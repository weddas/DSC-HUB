<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img"
     aria-label="DSC-HUB neon isometric system map" data-demo="true"
     style="--fan-out:0.55;--fan-recirc:0.35;--fan-intake-main:0.4;--fan-intake-2x4:0.45;--light:0.72;">
  <title>DSC-HUB System Map</title>
  <defs>
    <style type="text/css"><![CDATA[
      svg {
        --bg: #0E1116;
        --card: #171B22;
        --neon: #00E676;
        --cyan: #00BCD4;
        --amber: #FFAA00;
        --orange: #FF9800;
        --red: #F44336;
        --blue: #2196F3;
        --dim: #2A3140;
        --label: #8B93A7;
        --fan-out: 0.55;
        --fan-recirc: 0.35;
        --fan-intake-main: 0.4;
        --fan-intake-2x4: 0.45;
        --light: 0.72;
      }

      .plate { fill: var(--bg); }
      .floor { fill: #12161D; stroke: var(--dim); stroke-width: 1; }
      .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .room-wire { stroke: #3A4558; stroke-width: 1.6; }
      .tent-wire { stroke: var(--neon); stroke-width: 1.8; opacity: 0.85; }
      .tent-wire.priority { stroke: var(--cyan); stroke-width: 2.2; opacity: 1; filter: drop-shadow(0 0 4px var(--cyan)); }
      .duct { stroke: var(--cyan); stroke-width: 2; opacity: 0.55; fill: none; }
      .duct-flow {
        stroke: var(--cyan);
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 6 10;
        opacity: 0.9;
        filter: drop-shadow(0 0 3px var(--cyan));
      }
      .duct-flow.out { stroke: var(--orange); filter: drop-shadow(0 0 3px var(--orange)); }
      .duct-flow.recirc { stroke: var(--amber); filter: drop-shadow(0 0 3px var(--amber)); }
      .duct-flow.intake { stroke: var(--cyan); }
      .ghost { stroke: #4A5568; stroke-dasharray: 4 5; opacity: 0.45; fill: none; }
      .label {
        fill: var(--label);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .label-accent { fill: var(--neon); font-size: 12px; font-weight: 600; }
      .probe { fill: none; stroke: var(--amber); stroke-width: 1.5; }
      .hub-box { fill: none; stroke: var(--neon); stroke-width: 1.6; }
      .panel-box { fill: none; stroke: var(--cyan); stroke-width: 1.6; }
      .tank { fill: none; stroke: var(--blue); stroke-width: 1.6; }
      .pot { fill: none; stroke: var(--neon); stroke-width: 1.4; }
      .plant { fill: none; stroke: var(--neon); stroke-width: 1.2; opacity: 0.8; }
      .mat { fill: none; stroke: var(--orange); stroke-width: 1.5; opacity: 0.35; }
      .mat[data-on="true"] { opacity: 1; filter: drop-shadow(0 0 6px var(--orange)); }
      .appliance { fill: none; stroke-width: 1.5; opacity: 0.4; }
      .appliance.heater { stroke: var(--orange); }
      .appliance.humidifier { stroke: var(--cyan); }
      .appliance.dehumidifier { stroke: var(--blue); }
      .appliance.heater[data-on="true"] { opacity: 1; filter: drop-shadow(0 0 6px var(--orange)); }
      .appliance.humidifier[data-on="true"] { opacity: 1; filter: drop-shadow(0 0 6px var(--cyan)); }
      .appliance.dehumidifier[data-on="true"] { opacity: 1; filter: drop-shadow(0 0 6px var(--blue)); }
      .light-rail { fill: none; stroke: #3A4558; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .sf1000 {
        fill: none;
        stroke: var(--amber);
        stroke-width: 2.4;
        opacity: calc(0.25 + var(--light) * 0.75);
        filter: drop-shadow(0 0 calc(2px + var(--light) * 10px) var(--amber));
      }
      .sf1000-glow {
        fill: var(--amber);
        opacity: calc(var(--light) * 0.18);
      }
      .fan-body { fill: none; stroke: var(--cyan); stroke-width: 1.6; }
      .fan-blade {
        fill: none;
        stroke: var(--neon);
        stroke-width: 1.5;
        transform-box: fill-box;
        transform-origin: center;
      }
      .offline-banner { display: none; }
      svg[data-offline="true"] .offline-banner { display: block; }
      svg[data-offline="true"] .duct-flow,
      svg[data-offline="true"] .fan-blade,
      svg[data-offline="true"] .sf1000 { opacity: 0.25; filter: none; animation: none !important; }
      svg[data-emergency="true"] .emergency-wash { opacity: 0.22; }
      .emergency-wash { fill: var(--red); opacity: 0; pointer-events: none; }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -64; }
      }
      @keyframes breathe-light {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @keyframes appliance-flicker {
        0%, 70%, 100% { opacity: 0.35; filter: none; }
        75%, 90% { opacity: 1; filter: drop-shadow(0 0 6px #00BCD4); }
      }

      svg[data-demo="true"] #fan-out .fan-blade { animation: spin 1.1s linear infinite; }
      svg[data-demo="true"] #fan-recirc .fan-blade { animation: spin 1.6s linear infinite; }
      svg[data-demo="true"] #fan-intake-main .fan-blade { animation: spin 1.35s linear infinite; }
      svg[data-demo="true"] #fan-intake-2x4 .fan-blade { animation: spin 1.25s linear infinite; }
      svg[data-demo="true"] .duct-flow { animation: dash-flow 1.4s linear infinite; }
      svg[data-demo="true"] .duct-flow.out { animation-duration: 1.1s; }
      svg[data-demo="true"] .duct-flow.recirc { animation-duration: 1.7s; }
      svg[data-demo="true"] .sf1000 { animation: breathe-light 3.2s ease-in-out infinite; }
      svg[data-demo="true"] .sf1000-glow { animation: breathe-light 3.2s ease-in-out infinite; }
      svg[data-demo="true"] #appliance-humidifier { animation: appliance-flicker 8s ease-in-out infinite; }
      svg[data-demo="true"] #mat { opacity: 0.85; filter: drop-shadow(0 0 5px #FF9800); }
      svg[data-demo="true"] #tent-2x4 .tent-wire { stroke: #00BCD4; filter: drop-shadow(0 0 4px #00BCD4); }

      svg[data-live="true"] #fan-out .fan-blade {
        animation: spin calc(2.4s - var(--fan-out) * 1.6s) linear infinite;
      }
      svg[data-live="true"] #fan-recirc .fan-blade {
        animation: spin calc(2.4s - var(--fan-recirc) * 1.6s) linear infinite;
      }
      svg[data-live="true"] #fan-intake-main .fan-blade {
        animation: spin calc(2.4s - var(--fan-intake-main) * 1.6s) linear infinite;
      }
      svg[data-live="true"] #fan-intake-2x4 .fan-blade {
        animation: spin calc(2.4s - var(--fan-intake-2x4) * 1.6s) linear infinite;
      }
      svg[data-live="true"] #fan-out[data-pct="0"] .fan-blade,
      svg[data-live="true"] #fan-recirc[data-pct="0"] .fan-blade,
      svg[data-live="true"] #fan-intake-main[data-pct="0"] .fan-blade,
      svg[data-live="true"] #fan-intake-2x4[data-pct="0"] .fan-blade {
        animation: none;
      }
      svg[data-live="true"] .duct-flow.out {
        animation: dash-flow calc(2.2s - var(--fan-out) * 1.4s) linear infinite;
        opacity: calc(0.25 + var(--fan-out) * 0.75);
      }
      svg[data-live="true"] .duct-flow.recirc {
        animation: dash-flow calc(2.2s - var(--fan-recirc) * 1.4s) linear infinite;
        opacity: calc(0.25 + var(--fan-recirc) * 0.75);
      }
      svg[data-live="true"] .duct-flow.intake-main {
        animation: dash-flow calc(2.2s - var(--fan-intake-main) * 1.4s) linear infinite;
        opacity: calc(0.25 + var(--fan-intake-main) * 0.75);
      }
      svg[data-live="true"] .duct-flow.intake-2x4 {
        animation: dash-flow calc(2.2s - var(--fan-intake-2x4) * 1.4s) linear infinite;
        opacity: calc(0.25 + var(--fan-intake-2x4) * 0.75);
      }
    ]]></style>
  </defs>

  <rect class="plate" width="960" height="580"/>

  <g opacity="0.35">
    <path class="wire room-wire" d="M80 420 L480 220 L880 420 L480 620 Z" transform="translate(0,-80)"/>
  </g>

  <!-- ROOM LUNG -->
  <g id="room" class="wire">
    <path class="floor" d="M120 390 L340 280 L560 390 L340 500 Z"/>
    <path class="room-wire" d="M120 390 L340 280 L560 390 L340 500 Z"/>
    <path class="room-wire" d="M120 390 L120 310 L340 200 L340 280"/>
    <path class="room-wire" d="M560 390 L560 310 L340 200 L340 280"/>
    <path class="room-wire" d="M120 310 L340 200 L560 310"/>
    <text class="label label-accent" x="300" y="455">ROOM LUNG</text>

    <g id="appliance-heater" class="appliance heater" data-on="false" transform="translate(200,355)">
      <rect x="-14" y="-10" width="28" height="20" rx="2"/>
      <path d="M-8 10 L-8 18 M0 10 L0 18 M8 10 L8 18"/>
      <path d="M-10 -4 Q0 -14 10 -4" opacity="0.7"/>
      <text class="label" x="-12" y="32" font-size="9">HEAT</text>
    </g>
    <g id="appliance-humidifier" class="appliance humidifier" data-on="true" transform="translate(260,370)">
      <rect x="-12" y="-14" width="24" height="28" rx="3"/>
      <path d="M0 -6 Q4 0 0 6 Q-4 0 0 -6"/>
      <text class="label" x="-14" y="28" font-size="9">HUM</text>
    </g>
    <g id="appliance-dehumidifier" class="appliance dehumidifier" data-on="false" transform="translate(318,355)">
      <rect x="-14" y="-12" width="28" height="24" rx="2"/>
      <path d="M-6 -2 H6 M-6 4 H6"/>
      <text class="label" x="-16" y="28" font-size="9">DEHUM</text>
    </g>
    <g class="ghost" transform="translate(175,330)">
      <rect x="-16" y="-10" width="32" height="18" rx="2"/>
      <text class="label" x="-10" y="24" font-size="8">AC</text>
    </g>
    <g class="ghost" transform="translate(380,340)">
      <circle r="8"/>
      <path d="M0 -4 Q3 0 0 4"/>
      <text class="label" x="-14" y="24" font-size="8">MISTER</text>
    </g>
    <g id="probe-room" class="probe" transform="translate(400,300)">
      <circle r="4"/>
      <path d="M0 4 L0 14"/>
      <text class="label" id="label-room" x="8" y="6" font-size="10">22.4C  48%</text>
    </g>
  </g>

  <!-- 2x4 CLONE TENT -->
  <g id="tent-2x4">
    <path class="floor" d="M380 300 L500 240 L620 300 L500 360 Z" opacity="0.9"/>
    <path class="tent-wire priority" d="M380 300 L500 240 L620 300 L500 360 Z"/>
    <path class="tent-wire priority" d="M380 300 L380 210 L500 150 L500 240"/>
    <path class="tent-wire priority" d="M620 300 L620 210 L500 150 L500 240"/>
    <path class="tent-wire priority" d="M380 210 L500 150 L620 210"/>
    <text class="label label-accent" x="455" y="195" fill="#00BCD4">2x4 CLONE</text>

    <ellipse id="sf1000-glow" class="sf1000-glow" cx="500" cy="230" rx="70" ry="28"/>
    <g id="light-sf1000">
      <path class="sf1000" d="M440 188 L560 188"/>
      <path class="sf1000" d="M445 182 L555 182" opacity="0.5"/>
      <text class="label" x="470" y="176" fill="#FFAA00" font-size="9">SF1000</text>
    </g>

    <g id="mat" class="mat" data-on="true">
      <path d="M430 310 L500 275 L570 310 L500 345 Z"/>
    </g>
    <g id="pots">
      <g class="pot" transform="translate(460,305)">
        <path d="M-10 8 L-8 -6 L8 -6 L10 8 Z"/>
        <path class="plant" d="M0 -6 Q-6 -18 2 -22 Q4 -14 0 -6 Q6 -18 -2 -22"/>
      </g>
      <g class="pot" transform="translate(500,285)">
        <path d="M-10 8 L-8 -6 L8 -6 L10 8 Z"/>
        <path class="plant" d="M0 -6 Q-5 -20 3 -24 Q3 -14 0 -6"/>
      </g>
      <g class="pot" transform="translate(540,305)">
        <path d="M-10 8 L-8 -6 L8 -6 L10 8 Z"/>
        <path class="plant" d="M0 -6 Q-7 -16 1 -22 Q5 -12 0 -6"/>
      </g>
      <g class="pot" transform="translate(500,325)">
        <path d="M-10 8 L-8 -6 L8 -6 L10 8 Z"/>
        <path class="plant" d="M0 -6 Q-4 -18 2 -20 Q4 -12 0 -6"/>
      </g>
      <text class="label" x="478" y="355" font-size="9">POT 1-4</text>
    </g>

    <g id="probe-clone" class="probe" transform="translate(575,220)">
      <circle r="4"/>
      <path d="M0 4 L0 12"/>
      <text class="label" id="label-clone" x="8" y="6" font-size="10">24.1C  72%</text>
    </g>
  </g>

  <!-- 4x8 MAIN TENT -->
  <g id="tent-4x8">
    <path class="floor" d="M540 220 L720 130 L900 220 L720 310 Z" opacity="0.85"/>
    <path class="tent-wire" d="M540 220 L720 130 L900 220 L720 310 Z"/>
    <path class="tent-wire" d="M540 220 L540 100 L720 10 L720 130"/>
    <path class="tent-wire" d="M900 220 L900 100 L720 10 L720 130"/>
    <path class="tent-wire" d="M540 100 L720 10 L900 100"/>
    <text class="label label-accent" x="680" y="55">4x8 MAIN</text>

    <path class="light-rail" d="M600 70 L840 70"/>
    <text class="label" x="680" y="62" font-size="9">LIGHT - none fitted</text>

    <g id="probe-tent" class="probe" transform="translate(820,140)">
      <circle r="4"/>
      <path d="M0 4 L0 12"/>
      <text class="label" id="label-tent" x="8" y="6" font-size="10">25.8C  58%</text>
    </g>
  </g>

  <!-- DUCTS -->
  <path class="duct" d="M400 320 C430 300 450 280 470 260"/>
  <path id="airflow-intake-2x4" class="duct-flow intake intake-2x4" d="M400 320 C430 300 450 280 470 260"/>
  <path class="duct" d="M480 360 C560 340 620 280 680 220"/>
  <path id="airflow-intake-main" class="duct-flow intake intake-main" d="M480 360 C560 340 620 280 680 220"/>
  <path class="duct" d="M580 250 C620 230 650 210 680 190"/>
  <path id="airflow-borrow" class="duct-flow intake" d="M580 250 C620 230 650 210 680 190"/>
  <path class="duct" d="M860 160 C900 140 920 110 940 80" stroke="#FF9800" opacity="0.5"/>
  <path id="airflow-out" class="duct-flow out" d="M860 160 C900 140 920 110 940 80"/>
  <text class="label" x="900" y="70" fill="#FF9800">OUTSIDE</text>
  <path class="duct" d="M780 280 C820 340 700 400 560 400" stroke="#FFAA00" opacity="0.45"/>
  <path id="airflow-recirc" class="duct-flow recirc" d="M780 280 C820 340 700 400 560 400"/>

  <!-- FANS -->
  <g id="fan-intake-2x4" data-pct="45" transform="translate(430,295)">
    <circle class="fan-body" r="14"/>
    <g class="fan-blade">
      <path d="M0 -10 L3 0 L0 10 L-3 0 Z"/>
      <path d="M-10 0 L0 3 L10 0 L0 -3 Z"/>
    </g>
    <text class="label" x="-18" y="28" font-size="8">4in IN 2x4</text>
  </g>
  <g id="fan-intake-main" data-pct="40" transform="translate(600,300)">
    <circle class="fan-body" r="14"/>
    <g class="fan-blade">
      <path d="M0 -10 L3 0 L0 10 L-3 0 Z"/>
      <path d="M-10 0 L0 3 L10 0 L0 -3 Z"/>
    </g>
    <text class="label" x="-18" y="28" font-size="8">4in IN MAIN</text>
  </g>
  <g id="fan-out" data-pct="55" transform="translate(900,120)">
    <circle class="fan-body" r="18" stroke="#FF9800"/>
    <g class="fan-blade" stroke="#FF9800">
      <path d="M0 -12 L4 0 L0 12 L-4 0 Z"/>
      <path d="M-12 0 L0 4 L12 0 L0 -4 Z"/>
    </g>
    <text class="label" x="-16" y="34" font-size="8" fill="#FF9800">6in OUT</text>
  </g>
  <g id="fan-recirc" data-pct="35" transform="translate(760,340)">
    <circle class="fan-body" r="18" stroke="#FFAA00"/>
    <g class="fan-blade" stroke="#FFAA00">
      <path d="M0 -12 L4 0 L0 12 L-4 0 Z"/>
      <path d="M-12 0 L0 4 L12 0 L0 -4 Z"/>
    </g>
    <text class="label" x="-22" y="34" font-size="8" fill="#FFAA00">6in RECIRC</text>
  </g>

  <!-- HUB + PANEL + TANK -->
  <g id="hub" class="hub-box" transform="translate(140,470)">
    <rect x="-28" y="-18" width="56" height="36" rx="3"/>
    <circle cx="-10" cy="0" r="3" fill="#00E676" stroke="none" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#00BCD4" stroke="none" opacity="0.7"/>
    <circle cx="10" cy="0" r="3" fill="#FFAA00" stroke="none" opacity="0.7"/>
    <text class="label label-accent" x="-18" y="32">HUB</text>
  </g>
  <g id="panel" class="panel-box" transform="translate(230,470)">
    <rect x="-22" y="-16" width="44" height="32" rx="2"/>
    <rect x="-16" y="-10" width="32" height="20" rx="1" stroke="#00BCD4" opacity="0.5"/>
    <text class="label" x="-20" y="30" fill="#00BCD4">CYD</text>
  </g>
  <g id="tank" class="tank" transform="translate(320,475)">
    <path d="M-20 12 L-16 -12 L16 -12 L20 12 Z"/>
    <path d="M-12 0 H12" opacity="0.5"/>
    <text class="label" x="-16" y="28" fill="#2196F3">TANK</text>
  </g>

  <text class="label label-accent" x="28" y="36" font-size="14">DSC-HUB  SYSTEM MAP</text>
  <text class="label" x="28" y="54" font-size="10">room -&gt; 2x4 -&gt; 4x8 -&gt; out / recirc</text>

  <rect class="emergency-wash" width="960" height="580"/>

  <g class="offline-banner">
    <rect x="300" y="250" width="360" height="48" rx="6" fill="#171B22" stroke="#F44336" stroke-width="1.5"/>
    <text class="label" x="390" y="280" fill="#F44336" font-size="14">HUB OFFLINE</text>
  </g>
</svg>

# Unraid trampoline — Compose Manager still points at DSC-HUB/services/cannalib.
# Real project: Y:\Digital Stealth Care\Projects\CannaLib
# After Recreate, retarget Compose Manager external path to CannaLib/services/cannalib
# and delete this file.
services:
  cannalib:
    image: python:3.12-slim
    container_name: cannalib
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "/app/standalone_server.py"]
    ports:
      - "8790:8790"
    env_file:
      - /mnt/user/Digital-Documents/Digital Stealth Care/Projects/CannaLib/services/cannalib/.env
    environment:
      CANNALIB_DB_PATH: /data/dsc_brain.sqlite3
      CANNALIB_REQUIRE_API_KEY: "false"
      CANNALIB_METRICS_REQUIRE_KEY: "true"
      CANNALIB_TRUST_PROXY: "true"
      CANNALIB_RATE_LIMIT_ENABLED: "true"
      CANNALIB_RATE_LIMIT_RPM: "120"
      CANNALIB_RATE_LIMIT_BURST: "40"
      CANNALIB_COOLDOWN_BASE_S: "0.25"
      CANNALIB_COOLDOWN_MAX_S: "8"
      CANNALIB_COOLDOWN_429_AFTER: "3"
      CANNALIB_MAX_Q_LEN: "120"
      CANNALIB_MAX_LIMIT: "50"
    volumes:
      - "/mnt/user/Digital-Documents/Digital Stealth Care/Projects/CannaLib/services/cannalib/standalone_server.py:/app/standalone_server.py:ro"
      - "/mnt/user/Digital-Documents/Digital Stealth Care/Projects/CannaLib/brain/data/dsc_brain.sqlite3:/data/dsc_brain.sqlite3:ro"
      - "/mnt/user/Digital-Documents/Digital Stealth Care/Projects/CannaLib/brain/data/dsc_brain.sqlite3-wal:/data/dsc_brain.sqlite3-wal:ro"
      - "/mnt/user/Digital-Documents/Digital Stealth Care/Projects/CannaLib/brain/data/dsc_brain.sqlite3-shm:/data/dsc_brain.sqlite3-shm:ro"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

homeassistant: false
permit_join: false
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
serial:
  port: /dev/ttyACM0
  # z2m 2.x: ember (EZSP v13). Pair with SkyConnect EmberZNet 7.4.x if HOST_FATAL_ERROR.
  adapter: ember
frontend:
  enabled: false
device_options:
  # Retain each device's last state on the broker. Without this, a reconnecting subscriber
  # (the brain, after ANY restart) receives nothing until the device next transmits — and
  # on-change safety sensors (leak) can be silent for hours, so a brain restart left the
  # leak rail and both canopy sensors blank. mosquitto runs with persistence on, so retained
  # state also survives a broker restart. Applied live 2026-09-10 and verified: a fresh
  # subscriber immediately receives all five devices.
  retain: true
advanced:
  log_level: info

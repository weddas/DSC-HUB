# DSC Brain — public software simulation (WiP demo)
# Unraid Compose Manager: point stack at this directory on the NAS share:
#   /mnt/user/Digital-Documents/Digital Stealth Care/Projects/DSC-HUB/services/dsc-hub
# No MQTT, ESPHome, Sonoffs, or LAN keys. Port 8788 on the host → 8787 in container.
name: dsc-brain-demo

services:
  brain:
    build:
      context: ../..
      dockerfile: services/dsc-hub/brain/Dockerfile.prebuilt
    image: dsc-hub-brain:7.3.0-demo
    container_name: dsc-brain-demo
    restart: unless-stopped
    ports:
      - "8788:8787"
    environment:
      DSC_DEMO_MODE: "1"
      DSC_DATA: /data
      DSC_REPO_ROOT: /app
      DSC_EXPECTED_FIRMWARE: 7.0.0.0-demo
      DSC_SURFACE_VERSION: 7.4.0-demo
      CANNALIB_USE_LOCAL_FALLBACK: "true"
    volumes:
      - dsc_demo_ops:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  dsc_demo_ops:

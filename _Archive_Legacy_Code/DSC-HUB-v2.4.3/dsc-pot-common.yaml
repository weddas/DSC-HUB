substitutions:
  probe_address: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: digital_emotions.dsc-pot
    version: "2.4.1"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: ${api_key_val}
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: ${ota_password_val}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

captive_portal:

uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 4800
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus1
  uart_id: rs485_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: soil_sensor_bus
    address: ${probe_address}
    modbus_id: modbus1
    update_interval: 60s
    command_throttle: 100ms
    setup_priority: -10

sensor:
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    icon: mdi:water-percent
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x < 0.0 || x > 100.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Temperature"
    id: soil_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    register_type: holding
    address: 0x0001
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x < -20.0 || x > 60.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Conductivity"
    id: soil_conductivity
    unit_of_measurement: "µS/cm"
    state_class: measurement
    icon: mdi:flash
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 20000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil pH"
    id: soil_ph
    unit_of_measurement: "pH"
    state_class: measurement
    icon: mdi:ph
    register_type: holding
    address: 0x0003
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x < 3.0 || x > 9.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Nitrogen"
    id: soil_nitrogen
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0004
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 2000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Phosphorus"
    id: soil_phosphorus
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0005
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 2000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Potassium"
    id: soil_potassium
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0006
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 2000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "Firmware Version"
    hide_timestamp: true

button:
  - platform: restart
    name: "Restart"
    entity_category: config

text:
  - platform: template
    name: "Plant Name"
    id: plant_name
    icon: "mdi:tag-text-outline"
    optimistic: true
    restore_value: true
    initial_value: "Unassigned"
    max_length: 32
    mode: text
    entity_category: config

select:
  - platform: template
    name: "Growth Stage"
    id: growth_stage
    icon: "mdi:sprout"
    optimistic: true
    restore_value: true
    initial_option: "Vegetative"
    entity_category: config
    options:
      - "Germination"
      - "Seedling"
      - "Early Vegetative"
      - "Vegetative"
      - "Late (Push) Vegetative"
      - "Early Flowering"
      - "Flowering"
      - "Late Flowering"
      - "Final 48-72h Flowering"
      - "Dry Mode"
      - "Off"

espnow:
  auto_add_peer: false
  peers:
    - 84:1F:E8:16:E6:60   # DSC-HUB

packet_transport:
  - platform: espnow
    id: pt_espnow
    peer_address: 84:1F:E8:16:E6:60
    update_interval: 60s
    encryption:
      key: !secret espnow_key
    sensors:
      - soil_temperature
      - soil_moisture

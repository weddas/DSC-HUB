# ==================================================================
#  DSC-HUB · Demand automations (v2.2 — COMPLETE SET, all 7 rungs)
#  This file SUPERSEDES dsc_hub_demand_additions.yaml.
#
#  Paste into automations.yaml, or save as
#  config/packages/dsc_hub/dsc_hub_demand_automations.yaml under an
#  `automation:` key if you use packages.
#
#  >>> REPLACE the seven REPLACE_WITH_* entity_ids with your real
#  >>> smart plugs. Nothing else needs editing.
# ==================================================================

- id: dsc_hub_humidifier_follower
  alias: "DSC-HUB · Humidifier follows Humidifier Demand"
  use_blueprint:
    path: dsc_hub/demand_follower.yaml
    input:
      demand_switch: switch.dsc_hub_humidifier_demand
      appliance: switch.REPLACE_WITH_HUMIDIFIER_PLUG


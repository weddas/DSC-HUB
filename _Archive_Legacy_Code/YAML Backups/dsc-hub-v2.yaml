    restore_value: true
    min_value: 0.4
    max_value: 1.6
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.4
    set_action:
      - globals.set: {id: stage_vpd_min, value: !lambda 'return x;'}

  - platform: template
    name: "VPD Target Max"
    id: num_vpd_max
    icon: "mdi:water-thermometer"
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.8
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.8
    set_action:
      - globals.set: {id: stage_vpd_max, value: !lambda 'return x;'}

  - platform: template
    name: "RH Target Min"
    id: num_rh_min
    icon: "mdi:water-percent"
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 90
    step: 1
    unit_of_measurement: "%"
    initial_value: 70
    set_action:
      - globals.set: {id: stage_rh_min, value: !lambda 'return x;'}

  - platform: template
    name: "RH Target Max"
    id: num_rh_max
    icon: "mdi:water-percent"
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 95
    step: 1
    unit_of_measurement: "%"
    initial_value: 80
    set_action:
      - globals.set: {id: stage_rh_max, value: !lambda 'return x;'}

  - platform: template
    name: "Sunrise Duration"
    id: num_sunrise
    icon: "mdi:weather-sunset-up"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    update_interval: 10s
    lambda: 'return id(sunrise_minutes);'
    set_action:
      - globals.set: {id: sunrise_minutes, value: !lambda 'return (int) x;'}

  - platform: template
    name: "Sunset Duration"
    id: num_sunset
    icon: "mdi:weather-sunset-down"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    update_interval: 10s
    lambda: 'return id(sunset_minutes);'
    set_action:
      - globals.set: {id: sunset_minutes, value: !lambda 'return (int) x;'}

  # The "X" in the 0 -> X% sunrise ramp. Also the level manual OLED
  # adjust writes to, so device + HA always agree on the target.
  - platform: template
    name: "SF1000 Target Brightness"
    id: num_sf1000_target
    icon: "mdi:brightness-percent"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 10s
    lambda: 'return id(local_target_sf1000);'
    set_action:
      - globals.set: {id: local_target_sf1000, value: !lambda 'return (int) x;'}

# Real HH:MM picker in HA (renders as AM/PM per your HA locale).
datetime:
  - platform: template
    name: "Lights-On Time"
    id: lights_on_time
    type: time
    icon: "mdi:clock-time-six-outline"
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"

# ==========================================
# 5. SYSTEM INFO TEXT SENSORS & DIAGNOSTICS
# ==========================================
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: network_ip
    ssid:
      name: "WiFi SSID"
      id: network_ssid
  - platform: version
    name: "Firmware Version"
    id: fw_version
    hide_timestamp: true

# Remote-recovery + community-testing helpers: restart from HA without
# a power cycle, and uptime for "when did it last reboot" triage.
button:
  - platform: restart
    name: "Restart"

# ==========================================
# 6. HARDWARE SENSORS, FAILSAFE & WATCHDOG
# ==========================================
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 15s

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic

  - platform: dht
    model: DHT22
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    update_interval: 30s
    temperature:
      id: temp_sensor
      name: "Tent Temperature"
      filters:
        - filter_out: 150.0
        - lambda: |-
            if (isnan(x) || x < -10 || x > 60) return NAN;
            return x;
      # Watchdog heartbeat: stamp the time of every VALID reading, and
      # remember the value (shown on the fault banner for context).
      on_value:
        - lambda: |-
            if (!isnan(id(temp_sensor).state)) {
              id(last_valid_temp_time) = millis();
              id(last_good_temp) = id(temp_sensor).state;
            }
      # EMERGENCY FAILSAFE (hysteresis 34/35 C)
      on_value_range:
        - above: 35.0
          then:
            - lambda: |-
                if (id(emergency_failsafe_active)) return;   // already tripped
                // Snapshot current state so we can restore on clear
                id(saved_out)       = id(fan_exhaust_out).speed;
                id(saved_recirc)   = id(fan_exhaust_recirc).speed;
                id(saved_intake_main)   = id(fan_intake_main).speed;
                id(saved_intake_clone)  = id(fan_intake_clone).speed;
                id(saved_light_sf1000_b)= id(light_sf1000).remote_values.get_brightness();
                id(emergency_failsafe_active) = true;
                id(emergency_since) = millis();
                // Reset the ladder timers: the emergency period must never
                // count as "fans failed to fix it" after we resume.
                id(esc_humid_since) = 0; id(esc_dry_since) = 0;
                id(esc_cold_since) = 0;  id(esc_deep_cold_since) = 0;
                id(esc_hot_since) = 0;
                // Kill heat sources + ONCE-THROUGH purge to OUTSIDE.
                // ROOM fan -> 0 so we don't dump the tent's heat into the
                // room the intakes are pulling from. Intakes 100% feed the
                // outside fan with (cooler) room/makeup air.
                id(humidifier_demand).turn_off();
                id(heater_demand).turn_off();
                id(growmat_demand).turn_off();
                id(ac_demand).turn_on();     // AC assists the purge (setpoint 20C)
                auto fe = id(fan_exhaust_out).make_call();  fe.set_state(true);  fe.set_speed(100); fe.perform();
                auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(false); fa.set_speed(0);  fa.perform();
                auto fim = id(fan_intake_main).make_call(); fim.set_state(true); fim.set_speed(100); fim.perform();
                auto fic = id(fan_intake_clone).make_call();fic.set_state(true); fic.set_speed(100); fic.perform();
                id(light_sf1000).turn_off().perform();
                ESP_LOGW("failsafe", "EMERGENCY temp>35C: once-through purge OUTSIDE, ROOM fan off, light OFF");
        - below: 34.0
          then:
            - lambda: |-
                if (!id(emergency_failsafe_active)) return;
                id(emergency_failsafe_active) = false;
                id(emergency_since) = 0;
                id(ac_demand).turn_off();    // ladder re-arms it if still needed
                // Restore the pre-trip fan + light state
                auto fe = id(fan_exhaust_out).make_call();  fe.set_state(id(saved_out) > 0);      fe.set_speed(id(saved_out));      fe.perform();
                auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(id(saved_recirc) > 0);  fa.set_speed(id(saved_recirc));  fa.perform();
                auto fim = id(fan_intake_main).make_call(); fim.set_state(id(saved_intake_main) > 0); fim.set_speed(id(saved_intake_main)); fim.perform();
                auto fic = id(fan_intake_clone).make_call();fic.set_state(id(saved_intake_clone) > 0);fic.set_speed(id(saved_intake_clone));fic.perform();
                if (id(saved_light_sf1000_b) > 0.0f){ auto l = id(light_sf1000).turn_on();l.set_brightness(id(saved_light_sf1000_b));l.perform(); }
                ESP_LOGI("failsafe", "Emergency cleared: restored previous fan/light state");
    humidity:
      id: humidity_sensor
      name: "Tent Humidity"
      filters:
        - filter_out: 100.0
        - lambda: |-
            if (isnan(x) || x < 0 || x > 100) return NAN;
            return x;

  - platform: adc
    pin: GPIO34
    name: "CO2 Sensor Voltage"
    id: co2_voltage
    attenuation: 12db
    update_interval: 10s
    filters:
      - exponential_moving_average: {alpha: 0.1, send_every: 3}
    on_value:
      then:
        - component.update: co2_ppm_estimate

  # ---- TEMPLATE SENSORS ----
  - platform: template
    name: "Dynamic CO2 PPM"          # NOTE: uncalibrated analog estimate.
    id: co2_ppm_estimate             # Replace with SCD41 block below for real ppm.
    unit_of_measurement: "ppm"
    icon: "mdi:molecule-co2"
    update_interval: never
    lambda: |-
      float v = id(co2_voltage).state;
      if (isnan(v)) return NAN;
      return 116.67f * expf(2.769f * v);

  - platform: template
    name: "VPD (kPa)"
    id: vpd_sensor
    accuracy_decimals: 2
    unit_of_measurement: "kPa"
    lambda: |-
      float t = id(temp_sensor).state;
      float rh = id(humidity_sensor).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return NAN;
      float svp = 0.6108f * expf((17.27f * t) / (t + 237.3f));
      float avp = svp * (rh / 100.0f);
      return svp - avp;

  # ---- UI: ROTARY ENCODER (internal — not an HA entity) ----
  - platform: rotary_encoder
    pin_a: GPIO25
    pin_b: GPIO26
    id: menu_dial
    internal: true
    on_clockwise:
      then:
        - lambda: |-
            if (id(boot_resume_pending)) return;   // prompt owns the input
            if (id(display_sleeping)) {            // first nudge only wakes
              id(display_sleeping) = false;
              id(last_interaction_time) = millis();
              id(current_page) = 0; id(menu_cursor) = 0;
              return;
            }
            id(last_interaction_time) = millis();

            // Detent acceleration: <80ms between detents = fast spin
            uint32_t nowd = millis();
            int step = (nowd - id(last_detent_ms) < 80) ? 15 : 5;
            id(last_detent_ms) = nowd;

            // --- Home-page status carousel: Home -> Trends -> Lights -> Fans -> WiFi -> Home ---
            if (id(current_page) == 0)       { id(current_page) = 8; }
            else if (id(current_page) == 8)  { id(current_page) = 9; }
            else if (id(current_page) == 9)  { id(current_page) = 10; }
            else if (id(current_page) == 10) { id(current_page) = 11; }
            else if (id(current_page) == 11) { id(current_page) = 0; }

            else if (id(current_page) == 1)  { id(menu_cursor) = (id(menu_cursor) + 1) % 5; }
            else if (id(current_page) == 2)  { id(menu_cursor) = (id(menu_cursor) + 1) % 4; }
            else if (id(current_page) == 4)  { id(menu_cursor) = (id(menu_cursor) + 1) % 3; }
            else if (id(current_page) == 12) { id(menu_cursor) = (id(menu_cursor) + 1) % 3; }
            else if (id(current_page) == 3) { // Adjusting Airflow (4 fans)
              if (id(adjusting_item) == 0)      { int v = id(local_target_out) + step;          id(local_target_out)          = v > 100 ? 100 : v; }
              else if (id(adjusting_item) == 1) { int v = id(local_target_recirc) + step;       id(local_target_recirc)       = v > 100 ? 100 : v; }
              else if (id(adjusting_item) == 2) { int v = id(local_target_intake_main) + step;  id(local_target_intake_main)  = v > 100 ? 100 : v; }
              else if (id(adjusting_item) == 3) { int v = id(local_target_intake_clone) + step; id(local_target_intake_clone) = v > 100 ? 100 : v; }
              id(apply_live_adjust).execute();   // applies AS you scroll
            }
            else if (id(current_page) == 5) { // Adjusting Lighting
              if (id(adjusting_item) == 0)      { int v = id(local_target_sf1000) + step; id(local_target_sf1000) = v > 100 ? 100 : v; }
              else if (id(adjusting_item) == 1) { int v = id(sunrise_minutes) + step;     id(sunrise_minutes)     = v > 120 ? 120 : v; }
              else if (id(adjusting_item) == 2) { int v = id(sunset_minutes) + step;      id(sunset_minutes)      = v > 120 ? 120 : v; }
              id(apply_live_adjust).execute();   // applies AS you scroll
            }
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(boot_resume_pending)) return;   // prompt owns the input
            if (id(display_sleeping)) {
              id(display_sleeping) = false;
              id(last_interaction_time) = millis();
              id(current_page) = 0; id(menu_cursor) = 0;
              return;
            }
            id(last_interaction_time) = millis();

            uint32_t nowd = millis();
            int step = (nowd - id(last_detent_ms) < 80) ? 15 : 5;
            id(last_detent_ms) = nowd;

            // --- Home-page status carousel (reverse) ---
            if (id(current_page) == 0)       { id(current_page) = 11; }
            else if (id(current_page) == 11) { id(current_page) = 10; }
            else if (id(current_page) == 10) { id(current_page) = 9; }
            else if (id(current_page) == 9)  { id(current_page) = 8; }
            else if (id(current_page) == 8)  { id(current_page) = 0; }

            else if (id(current_page) == 1)  { id(menu_cursor) = (id(menu_cursor) + 4) % 5; }
            else if (id(current_page) == 2)  { id(menu_cursor) = (id(menu_cursor) + 3) % 4; }
            else if (id(current_page) == 4)  { id(menu_cursor) = (id(menu_cursor) + 2) % 3; }
            else if (id(current_page) == 12) { id(menu_cursor) = (id(menu_cursor) + 2) % 3; }
            else if (id(current_page) == 3) {
              if (id(adjusting_item) == 0)      { int v = id(local_target_out) - step;          id(local_target_out)          = v < 0 ? 0 : v; }
              else if (id(adjusting_item) == 1) { int v = id(local_target_recirc) - step;       id(local_target_recirc)       = v < 0 ? 0 : v; }
              else if (id(adjusting_item) == 2) { int v = id(local_target_intake_main) - step;  id(local_target_intake_main)  = v < 0 ? 0 : v; }
              else if (id(adjusting_item) == 3) { int v = id(local_target_intake_clone) - step; id(local_target_intake_clone) = v < 0 ? 0 : v; }
              id(apply_live_adjust).execute();   // applies AS you scroll
            }
            else if (id(current_page) == 5) {
              if (id(adjusting_item) == 0)      { int v = id(local_target_sf1000) - step; id(local_target_sf1000) = v < 0 ? 0 : v; }
              else if (id(adjusting_item) == 1) { int v = id(sunrise_minutes) - step;     id(sunrise_minutes)     = v < 0 ? 0 : v; }
              else if (id(adjusting_item) == 2) { int v = id(sunset_minutes) - step;      id(sunset_minutes)      = v < 0 ? 0 : v; }
              id(apply_live_adjust).execute();   // applies AS you scroll
            }

# ------------------------------------------------------------------
# OPTIONAL: real CO2 sensor (Sensirion SCD41). Drops onto the SAME
# I2C bus (GPIO21/22) — no new wiring. When the sensor arrives:
#   1) uncomment this block
#   2) delete the ADC "co2_voltage" + "Dynamic CO2 PPM" sensors above
#   3) point the OLED "CO2e" line at id(scd41_co2)
#   4) TIER-2 UPGRADE: point the sensor watchdog at scd41_temp as a
#      fallback before declaring fault (single-DHT22 trip today).
# ------------------------------------------------------------------
#   - platform: scd4x
#     address: 0x62
#     update_interval: 30s
#     co2:
#       name: "CO2"
#       id: scd41_co2
#     temperature:
#       name: "Temp (SCD41)"
#       id: scd41_temp
#     humidity:
#       name: "RH (SCD41)"
#       id: scd41_rh

# ------------------------------------------------------------------
# OPTIONAL: external Zigbee climate sensors, mirrored from Home
# Assistant. The battery Zigbee sensors stay paired to the coordinator
# on Digital-Home; the hub subscribes to their HA entities over the
# native API it already holds. TIER 3 — informational only:
#   * values only flow while HA is up (inverts the local-first rule)
#   * battery sensors report lazily (1-5+ min) — too stale for the
#     >35C failsafe or the watchdog. Use for canopy-average display /
#     sanity checks, never safety.
# Direct Zigbee on this board is not possible (WROOM-32 has no
# 802.15.4 radio) and a second coordinator would fragment the mesh.
# ------------------------------------------------------------------
#   - platform: homeassistant
#     id: zigbee_canopy_temp
#     entity_id: sensor.YOUR_ZIGBEE_TEMP_ENTITY
#     internal: true
#   - platform: homeassistant
#     id: zigbee_canopy_rh
#     entity_id: sensor.YOUR_ZIGBEE_RH_ENTITY
#     internal: true

# ==========================================
# 7. BINARY SENSORS (status + UI buttons)
# ==========================================
binary_sensor:
  - platform: status
    name: "HA Link Status"
    id: ha_connected

  - platform: template
    name: "Climate Sensor Fault"
    id: sensor_fault_bs
    device_class: problem
    lambda: 'return id(sensor_fault_active);'

  - platform: gpio
    pin: {number: GPIO32, mode: {input: true, pullup: true}}
    id: dial_button
    internal: true
    on_press:
      then:
        - lambda: |-
            // Boot-resume prompt: dial = continue Auto right now
            if (id(boot_resume_pending)) {
              id(boot_resume_pending) = false;
              id(last_interaction_time) = millis();
              id(current_page) = 0;
              ESP_LOGI("boot", "User confirmed -> resuming Auto");
              return;
            }
            if (id(display_sleeping)) {            // first press only wakes
              id(display_sleeping) = false;
              id(last_interaction_time) = millis();
              id(current_page) = 0; id(menu_cursor) = 0;
              return;
            }
            id(last_interaction_time) = millis();

            // Home / any status-carousel page -> Main Menu
            if (id(current_page) == 0 || (id(current_page) >= 8 && id(current_page) <= 11)) {
              id(current_page) = 1; id(menu_cursor) = 0;
            }

            // 1. MAIN MENU (5 items: Mode / Airflow / Lighting / Grow / System)
            else if (id(current_page) == 1) {
              if (id(menu_cursor) == 0)      { id(current_page) = 12; id(menu_cursor) = id(local_manual_mode).state ? 2 : (id(full_auto_mode) ? 1 : 0); } // Mode (cursor on current)
              else if (id(menu_cursor) == 1) { id(current_page) = 2;  id(menu_cursor) = 0; } // Airflow
              else if (id(menu_cursor) == 2) { id(current_page) = 4;  id(menu_cursor) = 0; } // Lighting
              else if (id(menu_cursor) == 3) { id(current_page) = 7;  id(menu_cursor) = 0; } // Grow Status
              else if (id(menu_cursor) == 4) { id(current_page) = 6;  id(menu_cursor) = 0; } // System Info
            }

            // 12. MODE SELECT -> apply and return. This is the deliberate
            // path into Full Auto from the hardware (CON stays a simple
            // Manual panic-toggle so a stray press can't arm the curve).
            else if (id(current_page) == 12) {
              if (id(menu_cursor) == 0) {        // Standby (HA drives outputs)
                id(local_manual_mode).turn_off();
                id(full_auto_mode) = false;
                ESP_LOGI("mode", "Mode -> Standby");
              } else if (id(menu_cursor) == 1) { // Full Auto
                id(local_manual_mode).turn_off();
                id(full_auto_mode) = true;
                ESP_LOGI("mode", "Mode -> Full Auto");
              } else {                           // Manual (fans)
                id(local_manual_mode).turn_on();
                ESP_LOGI("mode", "Mode -> Manual");
              }
              id(current_page) = 1; id(menu_cursor) = 0;
            }

            // 2. AIRFLOW MENU -> Adjust screen
            else if (id(current_page) == 2) {
               id(adjusting_item) = id(menu_cursor);
               id(current_page) = 3;
            }

            // 4. LIGHTING MENU -> Adjust screen
            else if (id(current_page) == 4) {
               id(adjusting_item) = id(menu_cursor);
               id(current_page) = 5;
            }

            // 3 / 5. ADJUST pages apply LIVE as you scroll — push = done.
            else if (id(current_page) == 3) { id(current_page) = 2; }
            else if (id(current_page) == 5) { id(current_page) = 4; }

            // 6 / 7. Read-only pages -> dial returns to Main Menu
            else if (id(current_page) == 6 || id(current_page) == 7) {
               id(current_page) = 1; id(menu_cursor) = 0;
            }

  - platform: gpio
    pin: {number: GPIO14, mode: {input: true, pullup: true}}
    id: back_button
    internal: true
    on_multi_click:
      # SHORT press: contextual back (fires on release)
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.05s
        then:
          - lambda: |-
              // Boot-resume prompt: back = decline, hold in Manual Override
              if (id(boot_resume_pending)) {
                id(boot_resume_pending) = false;
                id(local_manual_mode).turn_on();   // holds fans; light stays scheduled
                id(last_interaction_time) = millis();
                id(current_page) = 0;
                ESP_LOGI("boot", "User declined -> Manual Override (fans)");
                return;
              }
              if (id(display_sleeping)) {
                id(display_sleeping) = false;
                id(last_interaction_time) = millis();
                id(current_page) = 0; id(menu_cursor) = 0;
                return;
              }
              id(last_interaction_time) = millis();
              if (id(current_page) >= 8 && id(current_page) <= 11) {
                id(current_page) = 0;                              // Status carousel -> Home
              } else if (id(current_page) == 2 || id(current_page) == 4 || id(current_page) == 6 || id(current_page) == 7 || id(current_page) == 12) {
                id(current_page) = 1; id(menu_cursor) = 0;          // Back to Main Menu
              } else if (id(current_page) == 3) {
                id(current_page) = 2;                                // Exit Fan Adjust (already live)
              } else if (id(current_page) == 5) {
                id(current_page) = 4;                                // Exit Light Adjust (already live)
              } else {
                id(current_page) = 0;
                id(display_sleeping) = true;                         // Force Sleep (explicit flag)
              }
      # LONG press (~1s): jump Home from anywhere
      - timing:
          - ON for at least 0.8s
        then:
          - lambda: |-
              if (id(boot_resume_pending)) {       // same contract as short-press
                id(boot_resume_pending) = false;
                id(local_manual_mode).turn_on();
                ESP_LOGI("boot", "User declined (hold) -> Manual Override (fans)");
              }
              id(display_sleeping) = false;
              id(last_interaction_time) = millis();
              id(current_page) = 0; id(menu_cursor) = 0;

  - platform: gpio
    pin: {number: GPIO33, mode: {input: true, pullup: true}}
    id: con_button
    internal: true
    on_press:
      then:
        - lambda: |-
            if (id(boot_resume_pending)) return;   // prompt owns the input
            if (id(display_sleeping)) {
              id(display_sleeping) = false;
              id(last_interaction_time) = millis();
              id(current_page) = 0; id(menu_cursor) = 0;
              return;
            }
            id(last_interaction_time) = millis();
            // Quick Manual (fans) panic-toggle. Full Auto is entered via
            // the Mode menu ONLY — deliberate, never on a stray press.
            id(local_manual_mode).toggle();
            id(full_auto_mode) = false;

# ==========================================
# 8. SCRIPTS  (stage engine + climate + photoperiod)
# ==========================================
script:
  # ---- Load a stage's full climate envelope (STAGE CHANGE only) ----
  - id: apply_stage
    mode: restart
    then:
      - lambda: |-
          std::string s = id(grow_stage).state;
          float tt, vmin, vmax, rmin, rmax; int lh; std::string sh;
          if      (s == "Germination")             { tt=25; vmin=0.4f; vmax=0.8f; rmin=70; rmax=80; lh=18; sh="Germ"; }
          else if (s == "Seedling")                { tt=24; vmin=0.5f; vmax=0.8f; rmin=65; rmax=75; lh=18; sh="Seedling"; }
          else if (s == "Early Vegetative")        { tt=25; vmin=0.7f; vmax=1.0f; rmin=60; rmax=70; lh=18; sh="Early Veg"; }
          else if (s == "Vegetative")              { tt=26; vmin=0.8f; vmax=1.1f; rmin=55; rmax=65; lh=18; sh="Veg"; }
          else if (s == "Late (Push) Vegetative")  { tt=26; vmin=1.0f; vmax=1.2f; rmin=50; rmax=60; lh=18; sh="Push Veg"; }
          else if (s == "Early Flowering")         { tt=25; vmin=1.0f; vmax=1.2f; rmin=50; rmax=55; lh=12; sh="Early Flwr"; }
          else if (s == "Flowering")               { tt=24; vmin=1.2f; vmax=1.4f; rmin=45; rmax=50; lh=12; sh="Flower"; }
          else if (s == "Late Flowering")          { tt=22; vmin=1.3f; vmax=1.5f; rmin=40; rmax=45; lh=12; sh="Late Flwr"; }
          else if (s == "Final 48-72h Flowering")  { tt=21; vmin=1.4f; vmax=1.6f; rmin=35; rmax=45; lh=12; sh="Flush"; }
          else /* Dry Mode */                      { tt=19; vmin=0.8f; vmax=1.0f; rmin=55; rmax=62; lh=0;  sh="Dry"; }
          id(num_target_temp).make_call().set_value(tt).perform();
          id(num_vpd_min).make_call().set_value(vmin).perform();
          id(num_vpd_max).make_call().set_value(vmax).perform();
          id(num_rh_min).make_call().set_value(rmin).perform();
          id(num_rh_max).make_call().set_value(rmax).perform();
          id(stage_light_hours) = lh;
          id(stage_short) = sh;
          ESP_LOGI("grow", "Stage '%s': VPD %.1f-%.1f, RH %.0f-%.0f, %dh light",
                   s.c_str(), vmin, vmax, (float)rmin, (float)rmax, lh);

  # ---- BOOT variant: label + light hours ONLY. Never touches the
  # numeric targets, so reboots keep your fine-tuning intact. ----
  - id: apply_stage_boot
    mode: restart
    then:
      - lambda: |-
          std::string s = id(grow_stage).state;
          if      (s == "Germination")             { id(stage_short) = "Germ";       id(stage_light_hours) = 18; }
          else if (s == "Seedling")                { id(stage_short) = "Seedling";   id(stage_light_hours) = 18; }
          else if (s == "Early Vegetative")        { id(stage_short) = "Early Veg";  id(stage_light_hours) = 18; }
          else if (s == "Vegetative")              { id(stage_short) = "Veg";        id(stage_light_hours) = 18; }
          else if (s == "Late (Push) Vegetative")  { id(stage_short) = "Push Veg";   id(stage_light_hours) = 18; }
          else if (s == "Early Flowering")         { id(stage_short) = "Early Flwr"; id(stage_light_hours) = 12; }
          else if (s == "Flowering")               { id(stage_short) = "Flower";     id(stage_light_hours) = 12; }
          else if (s == "Late Flowering")          { id(stage_short) = "Late Flwr";  id(stage_light_hours) = 12; }
          else if (s == "Final 48-72h Flowering")  { id(stage_short) = "Flush";      id(stage_light_hours) = 12; }
          else /* Dry Mode */                      { id(stage_short) = "Dry";        id(stage_light_hours) = 0;  }
          ESP_LOGI("grow", "Boot: stage '%s' relabelled (%dh light), targets untouched",
                   s.c_str(), id(stage_light_hours));

  # ---- Climate auto-curve + humidifier/dehumidifier demand ----
  - id: run_climate_logic
    mode: single
    then:
      - lambda: |-
          if (id(boot_resume_pending)) return;   // waiting on resume prompt
          if (id(emergency_failsafe_active)) return;
          if (id(sensor_fault_active)) return;   // watchdog has control

          float rh   = id(humidity_sensor).state;
          float temp = id(temp_sensor).state;
          float vpd  = id(vpd_sensor).state;
          int  strat = id(control_strategy_idx);

          // ============ APPLIANCE ESCALATION LADDER ============
          // Fans are attempt #1 (curve below reacts within 10s). Appliances
          // are attempt #2: demanded only when the condition PERSISTS
          // despite the fans. Timers reset the moment the condition clears
          // (and whenever the failsafe / watchdog engages — see those).
          {
            uint32_t nowms = millis();
            float t_tgt = id(stage_temp_target);
            float r_hi  = id(stage_rh_max);
            float r_lo  = id(stage_rh_min);
            // held-for tracker: returns how long (ms) cond has been true
            auto track = [nowms](bool cond, uint32_t &since) -> uint32_t {
              if (cond && since == 0) since = nowms;
              if (!cond) since = 0;
              return cond ? (nowms - since) : 0;
            };

            // Too humid -> DEHUMIDIFIER (fans had 5 min and RH still high)
            if (id(dehumidifier_auto_enabled) && !isnan(rh)) {
              if (track(rh > r_hi + 3.0f, id(esc_humid_since)) > 300000 && !id(dehumidifier_demand).state) {
                id(dehumidifier_demand).turn_on();
                ESP_LOGI("ladder", "RH %.0f%% > %.0f%% for 5min despite fans -> DEHUMIDIFIER", rh, r_hi);
              }
              if (id(dehumidifier_demand).state && rh < r_hi - 2.0f) id(dehumidifier_demand).turn_off();
            }
            // Too dry -> HUMIDIFIER (fans already eased; 2 min persistence)
            if (id(humidifier_auto_enabled) && !isnan(rh)) {
              if (track(rh < r_lo - 2.0f, id(esc_dry_since)) > 120000 && !id(humidifier_demand).state) {
                id(humidifier_demand).turn_on();
                ESP_LOGI("ladder", "RH %.0f%% < %.0f%% for 2min -> HUMIDIFIER", rh, r_lo);
              }
              if (id(humidifier_demand).state && rh > r_lo + 2.0f) id(humidifier_demand).turn_off();
            }
            // Too cold, rung 1 -> GROW MAT (gentle root-zone heat, 1 min)
            if (id(growmat_auto_enabled) && !isnan(temp)) {
              if (track(temp < t_tgt - 1.0f, id(esc_cold_since)) > 60000 && !id(growmat_demand).state) {
                id(growmat_demand).turn_on();
                ESP_LOGI("ladder", "Temp %.1fC < %.1fC -> GROW MAT", temp, t_tgt - 1.0f);
              }
              if (id(growmat_demand).state && temp >= t_tgt) id(growmat_demand).turn_off();
            }
            // Too cold, rung 2 -> 750W HEATER (mat wasn't enough for 5 min)
            if (id(heater_auto_enabled) && !isnan(temp)) {
              if (track(temp < t_tgt - 2.0f, id(esc_deep_cold_since)) > 300000 && !id(heater_demand).state) {
                id(heater_demand).turn_on();
                ESP_LOGI("ladder", "Temp %.1fC < %.1fC for 5min (mat not enough) -> HEATER", temp, t_tgt - 2.0f);
              }
              if (id(heater_demand).state && temp >= t_tgt - 0.5f) id(heater_demand).turn_off();
            }
            // Too hot -> AC (temp held over target+2 for 5 min despite fans)
            if (id(ac_auto_enabled) && !isnan(temp)) {
              if (track(temp > t_tgt + 2.0f, id(esc_hot_since)) > 300000 && !id(ac_demand).state) {
                id(ac_demand).turn_on();
                ESP_LOGI("ladder", "Temp %.1fC > %.1fC for 5min despite venting -> AC", temp, t_tgt + 2.0f);
              }
              if (id(ac_demand).state && temp <= t_tgt + 0.5f) id(ac_demand).turn_off();
            }
          }

          // ================= TWO-AXIS FAN CONTROL =================
          // OUT   (fan_exhaust_out)   -> outside: heat, RH overflow, fresh air
          // RECIRC(fan_exhaust_recirc)-> room:    VPD/RH air movement, hold heat
          // Blending the two IS the damper. Intakes slave to total exhaust.
          int out = 0, recirc = 0, intake = 0;
          bool rh_overflow = false;
          if (id(full_auto_mode) && !isnan(temp)) {
            float rmax = id(stage_rh_max);

            // ---- RECIRC: move air past canopy, feed moisture to the room ----
            recirc = 20;   // baseline circulation, always on
            if (strat == 0 && !isnan(vpd)) {                 // VPD strategy
              float vmin = id(stage_vpd_min), vmax = id(stage_vpd_max);
              if (vpd < vmin - 0.30f) recirc = 100;          // way too humid
              else if (vpd < vmin - 0.20f) recirc = 80;
              else if (vpd < vmin - 0.10f) recirc = 60;
              else if (vpd < vmin) recirc = 45;              // slightly humid
              else if (vpd <= vmax) recirc = 30;             // in band
              else recirc = 20;                              // too dry -> ease off
            } else if (strat == 2 && !isnan(rh)) {           // Humidity strategy
              if (rh > rmax + 15.0f) recirc = 100;
              else if (rh > rmax + 10.0f) recirc = 80;
              else if (rh > rmax + 5.0f) recirc = 60;
              else if (rh > rmax) recirc = 45;
              else recirc = 25;
            } else {                                         // Temperature strategy
              recirc = 25;   // OUT does the heat work; RECIRC just circulates
            }

            // ---- OUT: expel heat / moisture overflow / fresh air ----
            // Fresh-air floor: no CO2 rig, so makeup air is the only CO2
            // top-up. Never let the loop fully close.
            out = 15;
            float target = id(stage_temp_target);
            if (temp >= target + 3.0f) out = 100;            // dump heat hard
            else if (temp >= target + 2.0f) out = 80;
            else if (temp >= target + 1.0f) out = 60;
            else if (temp >= target) out = 40;
            // Moisture overflow: RH way over ceiling -> vent outside NOW,
            // in parallel with the ladder deciding about the dehumidifier.
            if (!isnan(rh) && rh > rmax + 5.0f) {
              if (out < 70) out = 70;
              rh_overflow = true;
            }

            // ---- Negative pressure: intakes track total extraction ----
            intake = (int)(((out + recirc) / 2.0f) * 0.7f);

            auto co = id(fan_exhaust_out).make_call();    co.set_state(out > 0);    co.set_speed(out);    co.perform();
            auto cr = id(fan_exhaust_recirc).make_call(); cr.set_state(recirc > 0); cr.set_speed(recirc); cr.perform();
            auto ci = id(fan_intake_main).make_call();    ci.set_state(intake > 0); ci.set_speed(intake); ci.perform();
            auto cc = id(fan_intake_clone).make_call();   cc.set_state(intake > 0); cc.set_speed(intake); cc.perform();
          }

          // ---- Build the live "Running:" status line (screensaver) ----
          {
            std::string s;
            auto add = [&s](const char *p) { if (!s.empty()) s += ",   "; s += p; };
            char b[72];
            if (!id(full_auto_mode)) {
              add(id(local_manual_mode).state ? "Manual control - holding set fan levels"
                                              : "Standby - HA driving outputs directly");
            } else if (isnan(temp)) {
              add("Waiting on climate sensor");
            } else {
              if (id(dehumidifier_demand).state)      add("Dehumidifier called in");
              else if (id(humidifier_demand).state)   add("Humidifier called in");
              if (id(ac_demand).state)                add("AC cooling (max 20C)");
              if (id(heater_demand).state)            add("heater assisting");
              else if (id(growmat_demand).state)      add("grow mat warming roots");
              // Air routing (which way is the air going, and why)
              if (rh_overflow)         add("venting moisture outside (room dehumidifier maxed)");
              else if (out >= 60)      add("venting outside to dump heat");
              else if (recirc >= 60)   add("recirculating hard through the room");
              else if (recirc > 25)    add("moving air, holding heat in room");
              else                     add("gentle recirculation + fresh-air trickle");
              add("maintaining internal negative pressure");
              if (strat == 0 && !isnan(vpd)) {
                if (vpd < id(stage_vpd_min))      { snprintf(b, sizeof(b), "raising VPD to target: %.1f", id(stage_vpd_min)); add(b); }
                else if (vpd > id(stage_vpd_max)) { snprintf(b, sizeof(b), "lowering VPD to target: %.1f", id(stage_vpd_max)); add(b); }
                else                              { snprintf(b, sizeof(b), "VPD %.2f inside %.1f-%.1f band", vpd, id(stage_vpd_min), id(stage_vpd_max)); add(b); }
              } else if (strat == 1) {
                float tt = id(stage_temp_target);
                if (temp >= tt + 1.0f)      { snprintf(b, sizeof(b), "cooling toward %.0fC (venting out)", tt); add(b); }
                else if (temp <= tt - 1.0f) { add("trying to maintain heat (recirculating)"); }
                else                        { snprintf(b, sizeof(b), "holding temp at %.0fC", tt); add(b); }
              } else if (!isnan(rh)) {
                if (rh > id(stage_rh_max))      { snprintf(b, sizeof(b), "pulling RH down to %.0f%%", id(stage_rh_max)); add(b); }
                else if (rh < id(stage_rh_min)) { snprintf(b, sizeof(b), "conserving RH above %.0f%%", id(stage_rh_min)); add(b); }
                else                            { snprintf(b, sizeof(b), "RH %.0f%% inside band", rh); add(b); }
              }
            }
            if (id(manual_light_hold))          add("light held manually (resumes at lights-off)");
            if (id(light_ramp_state) == 1)      { snprintf(b, sizeof(b), "sunrise ramp at %d%%", (int) id(light_current_pct)); add(b); }
            else if (id(light_ramp_state) == 2) { snprintf(b, sizeof(b), "sunset dimming at %d%%", (int) id(light_current_pct)); add(b); }
            id(auto_status_text) = s;
          }

  # ---- LIVE APPLY for the OLED adjust pages ----
  # Called on every dial detent while adjusting: the value takes effect
  # AS you scroll (no confirm needed).
  #   Fans  : first detent engages Manual Override (FANS ONLY — the
  #           photoperiod keeps driving the light).
  #   Light : first detent sets Manual Light Hold (LIGHT ONLY — the
  #           schedule pauses and self-heals at the next lights-off).
  #   Sunrise/Sunset minutes are live globals; no hold of any kind.
  - id: apply_live_adjust
    mode: restart
    then:
      - lambda: |-
          if (id(current_page) == 3) {                 // fans
            id(full_auto_mode) = false;
            if (!id(local_manual_mode).state) {
              id(local_manual_mode).turn_on();
              id(manual_banner_until) = millis() + 2000;   // flash the banner
            }
            switch (id(adjusting_item)) {
              case 0: { int v = id(local_target_out);          auto c = id(fan_exhaust_out).make_call();    c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
              case 1: { int v = id(local_target_recirc);       auto c = id(fan_exhaust_recirc).make_call(); c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
              case 2: { int v = id(local_target_intake_main);  auto c = id(fan_intake_main).make_call();    c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
              case 3: { int v = id(local_target_intake_clone); auto c = id(fan_intake_clone).make_call();   c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
            }
          } else if (id(current_page) == 5 && id(adjusting_item) == 0) {   // SF1000
            if (!id(manual_light_hold)) {
              id(manual_light_hold) = true;                  // light-only hold
              id(manual_banner_until) = millis() + 2000;
            }
            int v = id(local_target_sf1000);
            if (v > 0) { auto l = id(light_sf1000).turn_on(); l.set_brightness(v / 100.0f); l.set_transition_length(200); l.perform(); }
            else id(light_sf1000).turn_off().perform();
          }

  # ---- Photoperiod + Sunrise/Sunset ramp (device-run; HA sets params) ----
  # Ramps live INSIDE the photoperiod window:
  #   lights-on  ......... 0% -> target% over "Sunrise Duration" min
  #   steady     ......... hold target%
  #   window end ......... target% -> 0% over "Sunset Duration" min,
  #                        finishing exactly AT lights-off.
  # If sunrise+sunset ever exceed the window, both scale down to fit.
  - id: run_photoperiod
    mode: single
    then:
      - lambda: |-
          if (id(boot_resume_pending)) return;   // waiting on resume prompt
          if (id(emergency_failsafe_active)) return;
          if (!id(auto_photoperiod_enabled)) { id(light_ramp_state) = 0; return; }

          int dur = id(stage_light_hours);
          if (dur <= 0) {                        // Dry Mode / dark
            if (id(manual_light_hold)) {         // explicit user hold wins;
              id(light_ramp_state) = 0;          // no window = no self-heal,
              id(light_current_pct) = id(light_sf1000).remote_values.is_on()   // clear via HA switch
                  ? id(light_sf1000).remote_values.get_brightness() * 100.0f : 0.0f;
              return;
            }
            id(light_sf1000).turn_off().perform();
            id(lights_currently_on) = false;
            id(light_ramp_state) = 0;
            id(light_current_pct) = 0.0f;
            return;
          }

          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          if (!now.is_valid()) return;           // no clock yet -> leave lights

          // Seconds-resolution clock for a smooth ramp
          float cur  = now.hour * 60.0f + now.minute + now.second / 60.0f;
          int on_m   = id(lights_on_time).hour * 60 + id(lights_on_time).minute;
          float window   = dur * 60.0f;
          float since_on = fmodf(cur - on_m + 1440.0f, 1440.0f);   // handles midnight wrap
          bool was_on = id(lights_currently_on);
          bool on = since_on < window;
          id(lights_currently_on) = on;

          // MANUAL LIGHT HOLD: the schedule keeps ticking (so the display
          // and countdowns stay honest) but the device does NOT touch the
          // light. SELF-HEALS at the lights-off boundary: a daytime tweak
          // resumes the schedule overnight, so the dark window is always
          // enforced from the next cycle onward — no herm trap.
          if (id(manual_light_hold)) {
            if (was_on && !on) {
              id(manual_light_hold) = false;
              ESP_LOGI("photoperiod", "Lights-off boundary -> manual light hold released, schedule resumes");
              // fall through: the !on branch below turns the light off now
            } else {
              id(light_ramp_state) = 0;
              id(light_current_pct) = id(light_sf1000).remote_values.is_on()
                  ? id(light_sf1000).remote_values.get_brightness() * 100.0f : 0.0f;
              return;
            }
          }

          if (!on) {
            id(light_sf1000).turn_off().perform();
            id(light_ramp_state) = 0;
            id(light_current_pct) = 0.0f;
            return;
          }

          float target = (float) id(local_target_sf1000);          // the "X%"
          float rise   = (float) id(sunrise_minutes);              // the "Y min"
          float fall   = (float) id(sunset_minutes);
          if (rise + fall > window && (rise + fall) > 0.0f) {      // never overlap
            float k = window / (rise + fall);
            rise *= k; fall *= k;
          }

          float to_off = window - since_on;
          float pct; int ramp;
          if (rise > 0.0f && since_on < rise)    { pct = target * (since_on / rise); ramp = 1; }
          else if (fall > 0.0f && to_off < fall) { pct = target * (to_off / fall);   ramp = 2; }
          else                                   { pct = target;                     ramp = 0; }
          id(light_ramp_state)  = ramp;
          id(light_current_pct) = pct;

          if (pct >= 0.5f) {
            auto l = id(light_sf1000).turn_on();
            l.set_brightness(pct / 100.0f);
            // Glide between 15s updates while ramping so it looks continuous
            l.set_transition_length(ramp != 0 ? 14000 : 1000);
            l.perform();
          } else {
            id(light_sf1000).turn_off().perform();
          }

# ==========================================
# 9. PERIODIC LOOPS
# ==========================================
interval:
  - interval: 10s
    then:
      - script.execute: run_climate_logic

  # 15s cadence keeps the sunrise/sunset ramp visually continuous
  # (each update glides via a 14s light transition).
  - interval: 15s
    then:
      - script.execute: run_photoperiod

  # ---- Boot-resume countdown: starts once the clock syncs (or after a
  # 2 min cap if WiFi/SNTP is down, so fans never wait forever) ----
  - interval: 1s
    then:
      - lambda: |-
          if (!id(boot_resume_pending)) return;
          auto t = id(sntp_time).now();
          if (!t.is_valid()) t = id(grow_time).now();
          if (id(boot_time_synced_at) == 0 && (t.is_valid() || millis() > 120000))
            id(boot_time_synced_at) = millis();
          if (id(boot_time_synced_at) != 0 && (millis() - id(boot_time_synced_at)) > 60000) {
            id(boot_resume_pending) = false;
            ESP_LOGI("boot", "Resume prompt timed out -> continuing Auto");
          }

  # ---- 1h trend sampler: 12-slot ring buffer, one sample / 5 min ----
  - interval: 300s
    then:
      - lambda: |-
          int i = id(hist_idx);
          id(hist_temp)[i] = id(temp_sensor).state;
          id(hist_rh)[i]   = id(humidity_sensor).state;
          id(hist_vpd)[i]  = id(vpd_sensor).state;
          id(hist_idx) = (i + 1) % 12;
          if (id(hist_idx) == 0) id(hist_filled) = true;

  # ---- Sensor watchdog: no valid temp for 3 min -> safe mode + alert ----
  - interval: 30s
    then:
      - lambda: |-
          // A stale sensor DURING an emergency must never throttle the
          // purge — the failsafe outranks the watchdog. Let the latched
          // emergency hold 100% purge until a valid <34C reading clears it.
          if (id(emergency_failsafe_active)) return;

          bool stale = (millis() - id(last_valid_temp_time)) > 180000;
          if (stale && !id(sensor_fault_active)) {
            id(sensor_fault_active) = true;
            // Ladder timers reset: the fault period must never count as
            // "fans failed to fix it" once readings return.
            id(esc_humid_since) = 0; id(esc_dry_since) = 0;
            id(esc_cold_since) = 0;  id(esc_deep_cold_since) = 0;
            id(esc_hot_since) = 0;
            id(humidifier_demand).turn_off();
            id(dehumidifier_demand).turn_off();
            id(heater_demand).turn_off();
            id(growmat_demand).turn_off();
            id(ac_demand).turn_off();   // climate unknown -> no appliances
            // No temp reading -> gentle, safe ventilation. Bias OUTSIDE
            // (fresh air + mild extraction) since we can't trust climate.
            auto fe = id(fan_exhaust_out).make_call();  fe.set_state(true); fe.set_speed(40); fe.perform();
            auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(true); fa.set_speed(25); fa.perform();
            auto fim = id(fan_intake_main).make_call(); fim.set_state(true); fim.set_speed(25); fim.perform();
            auto fic = id(fan_intake_clone).make_call();fic.set_state(true); fic.set_speed(25); fic.perform();
            ESP_LOGW("watchdog", "No valid temp for 3 min -> SENSOR FAULT safe mode");
          } else if (!stale && id(sensor_fault_active)) {
            id(sensor_fault_active) = false;
            // Recovery: in Auto the 10s curve re-takes the fans; in Manual
            // the user's held levels must come back (safe mode stomped them).
            if (id(local_manual_mode).state) {
              auto fe = id(fan_exhaust_out).make_call();  fe.set_state(id(local_target_out) > 0);          fe.set_speed(id(local_target_out));          fe.perform();
              auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(id(local_target_recirc) > 0);    fa.set_speed(id(local_target_recirc));       fa.perform();
              auto fim = id(fan_intake_main).make_call(); fim.set_state(id(local_target_intake_main) > 0); fim.set_speed(id(local_target_intake_main)); fim.perform();
              auto fic = id(fan_intake_clone).make_call();fic.set_state(id(local_target_intake_clone) > 0);fic.set_speed(id(local_target_intake_clone));fic.perform();
              ESP_LOGI("watchdog", "Sensor recovered -> manual fan levels restored");
            } else {
              ESP_LOGI("watchdog", "Temperature sensor recovered");
            }
          }

# ==========================================
# 10. OLED DISPLAY RENDERER
# ==========================================
display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    id: oled_screen
    update_interval: 100ms
    lambda: |-
      // --- RAW PIXEL-MAPPED SCREENSAVER (also prevents burn-in) ---
      static const unsigned char dsc_esp_logo_bits[] = {
        0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03, 0x00, 0x00, 0x00, 0x00, 0x00, 0x07, 0x00,
        0x00, 0x00, 0x00, 0x00, 0x0f, 0x00, 0x00, 0x00, 0x00, 0x00, 0x3f, 0x00, 0x00, 0x00, 0x00, 0x00,
        0x7f, 0x00, 0x00, 0x00, 0x00, 0x00, 0xff, 0x00, 0x00, 0x00, 0x00, 0x00, 0xff, 0x00, 0x00, 0x00,
        0x00, 0x01, 0xff, 0x00, 0x00, 0x00, 0x00, 0x01, 0xff, 0x00, 0x00, 0x00, 0x00, 0x03, 0xff, 0x00,
        0x00, 0x00, 0x00, 0x03, 0xff, 0x00, 0x00, 0x00, 0x00, 0x07, 0xff, 0x80, 0x00, 0x00, 0x00, 0x07,
        0xff, 0x60, 0x00, 0x00, 0x00, 0x0f, 0xfc, 0x30, 0x00, 0x00, 0x00, 0x0f, 0xf0, 0x08, 0x00, 0x00,
        0x00, 0x1f, 0xe3, 0x06, 0x00, 0x00, 0x00, 0x1f, 0xc7, 0x03, 0x00, 0x00, 0x00, 0x3f, 0x9f, 0x01,
        0x80, 0x00, 0x00, 0x3f, 0x3f, 0x00, 0xc0, 0x00, 0x00, 0x3e, 0x0f, 0x0e, 0x60, 0x00, 0x00, 0x7c,
        0x07, 0x1e, 0x30, 0x00, 0x00, 0x78, 0xc3, 0x3c, 0x10, 0x00, 0x00, 0xf1, 0xf3, 0x30, 0x08, 0x00,
        0x00, 0xe1, 0xff, 0x00, 0x04, 0x00, 0x01, 0xe1, 0xff, 0x00, 0x06, 0x00, 0x01, 0xc1, 0xff, 0x00,
        0x82, 0x00, 0x01, 0xc1, 0xff, 0x00, 0x83, 0x00, 0x03, 0x80, 0xff, 0x01, 0x81, 0x00, 0x01, 0x80,
        0xff, 0x01, 0x01, 0x00, 0x01, 0x80, 0xff, 0x01, 0x01, 0x00, 0x00, 0xc0, 0xf8, 0xe3, 0x03, 0x00,
        0x00, 0x60, 0x7f, 0x06, 0x06, 0x00, 0x00, 0x30, 0x3f, 0x0c, 0x0c, 0x00, 0x00, 0x18, 0x1f, 0x18,
        0x18, 0x00, 0x00, 0x0c, 0x0f, 0x30, 0x30, 0x00, 0x1f, 0x02, 0x03, 0x40, 0x40, 0x78, 0x1f, 0xc1,
        0x00, 0x00, 0x83, 0xf8, 0x1b, 0xe0, 0x80, 0x03, 0x07, 0xd8, 0x1c, 0xf1, 0xe0, 0x07, 0x8f, 0xb8,
        0x0e, 0x7a, 0x30, 0x0e, 0x5e, 0x78, 0x0f, 0x39, 0x98, 0x19, 0x9c, 0xf0, 0x0f, 0x98, 0x44, 0x22,
        0x19, 0xf0, 0x07, 0xcc, 0x22, 0x44, 0x13, 0xe0, 0x03, 0xe8, 0x01, 0x8c, 0x17, 0xc0, 0x01, 0xf0,
        0x01, 0x08, 0x0f, 0x80, 0x00, 0x04, 0x01, 0x00, 0x00, 0x00, 0x00, 0x02, 0x00, 0x00, 0x40, 0x00
      };

      // --- MARQUEE ENGINE ------------------------------------------------
      // Wall-clock scroll (40 px/s): refresh-rate independent, and immune
      // to the float-precision freeze an accumulator hits on long uptimes.
      id(marquee_px) = fmodf(millis() * 0.040f, 100000.0f);
      auto draw_scroll = [&](int x, int y, display::BaseFont *font, const char *text) {
        int bx, by, bw, bh;
        it.get_text_bounds(0, 0, text, font, TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
        int avail = 128 - x;
        if (bw <= avail) { it.print(x, y, font, text); return; }
        int span = bw + 56;                         // generous gap before it loops
        int off = ((int) id(marquee_px)) % span;
        it.print(x - off, y, font, text);
        it.print(x - off + span, y, font, text);    // seamless wrap copy
      };

      // --- CAROUSEL DOTS (Home + status pages, top-right) ---------------
      auto draw_dots = [&](int active) {
        for (int i = 0; i < 5; i++) {
          int x = 104 + i * 5;
          if (i == active) it.filled_circle(x, 3, 2);
          else             it.circle(x, 3, 1);
        }
      };

      // EMERGENCY banner (with elapsed purge time for context)
      if (id(emergency_failsafe_active)) {
         it.printf(64, 14, id(font_large), TextAlign::CENTER, "! EMERGENCY");
         it.printf(64, 34, id(font_medium), TextAlign::CENTER, "TEMP %.1f C", id(temp_sensor).state);
         uint32_t es = id(emergency_since) ? (millis() - id(emergency_since)) / 1000 : 0;
         it.printf(64, 50, id(font_small), TextAlign::CENTER, "Purging %um%02us  (clear <34C)", (unsigned)(es / 60), (unsigned)(es % 60));
         return;
      }

      // SENSOR FAULT banner (stale-for + last good reading = diagnostics)
      if (id(sensor_fault_active)) {
         it.printf(64, 12, id(font_large), TextAlign::CENTER, "SENSOR FAULT");
         uint32_t ss = (millis() - id(last_valid_temp_time)) / 1000;
         it.printf(64, 34, id(font_small), TextAlign::CENTER, "No temp for %um%02us", (unsigned)(ss / 60), (unsigned)(ss % 60));
         if (!isnan(id(last_good_temp)))
           it.printf(64, 45, id(font_small), TextAlign::CENTER, "Last good: %.1fC", id(last_good_temp));
         it.printf(64, 56, id(font_small), TextAlign::CENTER, "Safe vent active");
         return;
      }

      // BOOT RESUME PROMPT: power returned mid-schedule. Automations are
      // held until Dial (continue), Back (manual), or the 60s timeout.
      if (id(boot_resume_pending)) {
         it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "RESUME AUTO?");
         char r1[40];
         snprintf(r1, sizeof(r1), "Auto: %s", id(stage_short).c_str());
         draw_scroll(4, 16, id(font_small), r1);
         auto bnow = id(sntp_time).now();
         if (!bnow.is_valid()) bnow = id(grow_time).now();
         if (bnow.is_valid() && id(stage_light_hours) > 0) {
           int cur = bnow.hour * 60 + bnow.minute;
           int on_m = id(lights_on_time).hour * 60 + id(lights_on_time).minute;
           int off_m = (on_m + id(stage_light_hours) * 60) % 1440;
           bool in_win = ((cur - on_m + 1440) % 1440) < id(stage_light_hours) * 60;
           int mins = in_win ? (off_m - cur + 1440) % 1440 : (on_m - cur + 1440) % 1440;
           char r2[44];
           snprintf(r2, sizeof(r2), "Lights %s  %dh%02dm %s", in_win ? "ON" : "OFF", mins / 60, mins % 60, in_win ? "left" : "to on");
           draw_scroll(4, 27, id(font_small), r2);
         } else if (!bnow.is_valid()) {
           it.printf(4, 27, id(font_small), "Syncing clock...");
         } else {
           it.printf(4, 27, id(font_small), "Dark stage (Dry)");
         }
         it.printf(4, 38, id(font_small), "Dial=Go  Back=Manual");
         if (id(boot_time_synced_at) != 0) {
           int rem = 60 - (int)((millis() - id(boot_time_synced_at)) / 1000);
           if (rem < 0) rem = 0;
           it.printf(4, 49, id(font_small), "Auto-continue in %ds", rem);
         } else {
           it.printf(4, 49, id(font_small), "Waiting for clock...");
         }
         return;
      }

      // --- SCREENSAVER: bouncing logo + live "Running:" status line ------
      if (millis() - id(last_interaction_time) > 300000) id(display_sleeping) = true;
      if (id(display_sleeping)) {
         id(current_page) = 0; id(menu_cursor) = 0;   // wake clean to Home
         id(saver_x) += id(saver_vx); id(saver_y) += id(saver_vy);
         // Bounce inside the area above the status line (logo is 48px tall;
         // status line at y=53 gives a 0..5px vertical lane)
         if (id(saver_x) <= 0)  { id(saver_x) = 0;  id(saver_vx) =  fabsf(id(saver_vx)); }
         if (id(saver_x) >= 80) { id(saver_x) = 80; id(saver_vx) = -fabsf(id(saver_vx)); }
         if (id(saver_y) <= 0)  { id(saver_y) = 0;  id(saver_vy) =  fabsf(id(saver_vy)); }
         if (id(saver_y) >= 5)  { id(saver_y) = 5;  id(saver_vy) = -fabsf(id(saver_vy)); }
         for(int y = 0; y < 48; y++) {
             for(int x = 0; x < 48; x++) {
                 int byte_idx = y * 6 + (x / 8);
                 int bit_idx = x % 8;
                 if (dsc_esp_logo_bits[byte_idx] & (1 << (7 - bit_idx))) {
                     it.draw_pixel_at(id(saver_x) + x, id(saver_y) + y);
                 }
             }
         }
         std::string run_line = "Running:  " + id(auto_status_text);
         draw_scroll(0, 53, id(font_small), run_line.c_str());
         return;
      }

      // PAGE 0: HOME  (dial-rotate here to cycle the status carousel)
      if (id(current_page) == 0) {
        draw_dots(0);
        const char* mode = id(full_auto_mode) ? "AUTO" : (id(local_manual_mode).state ? "MAN" : "HA");
        it.printf(0, 0,  id(font_small), "T:%.1fC  RH:%.0f%%", id(temp_sensor).state, id(humidity_sensor).state);
        it.printf(0, 12, id(font_small), "VPD %.2f [%.1f-%.1f]", id(vpd_sensor).state, id(stage_vpd_min), id(stage_vpd_max));
        char l3[48];
        snprintf(l3, sizeof(l3), "%s  L:%s %d%%%s", id(stage_short).c_str(), id(lights_currently_on) ? "ON" : "OFF", (int) id(light_current_pct), id(manual_light_hold) ? " HELD" : "");
        draw_scroll(0, 24, id(font_small), l3);
        char l4[48];
        snprintf(l4, sizeof(l4), "Mode:%s  %s", mode, id(control_strategy).state.c_str());
        draw_scroll(0, 36, id(font_small), l4);
        // Demand badges: the escalation ladder is visible ON-DEVICE now.
        std::string badges;
        if (id(dehumidifier_demand).state) badges += "DEHUM ";
        if (id(humidifier_demand).state)   badges += "HUM ";
        if (id(heater_demand).state)       badges += "HEAT ";
        if (id(growmat_demand).state)      badges += "MAT ";
        if (id(ac_demand).state)           badges += "AC ";
        if (!badges.empty()) {
          std::string bl = "! " + badges;
          draw_scroll(0, 48, id(font_small), bl.c_str());
        }
      }

      // PAGE 1: MAIN MENU (5 items @ 10px pitch)
      else if (id(current_page) == 1) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "MAIN MENU");
        it.printf(12, 13, id(font_small), "Mode");
        it.printf(12, 23, id(font_small), "Airflow Control");
        it.printf(12, 33, id(font_small), "Lighting Control");
        it.printf(12, 43, id(font_small), "Grow Status");
        it.printf(12, 53, id(font_small), "System Info");
        it.printf(0, 13 + (id(menu_cursor) * 10), id(font_small), ">>");
      }

      // PAGE 12: MODE SELECT (dial to choose, push = set; '*' = active)
      else if (id(current_page) == 12) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "MODE");
        int active = id(local_manual_mode).state ? 2 : (id(full_auto_mode) ? 1 : 0);
        it.printf(12, 16, id(font_small), "Standby (HA)%s",  active == 0 ? "  *" : "");
        it.printf(12, 27, id(font_small), "Full Auto%s",     active == 1 ? "  *" : "");
        it.printf(12, 38, id(font_small), "Manual (fans)%s", active == 2 ? "  *" : "");
        it.printf(0, 16 + (id(menu_cursor) * 11), id(font_small), ">>");
        it.printf(64, 53, id(font_small), TextAlign::TOP_CENTER, "Push = set");
      }

      // PAGE 2: AIRFLOW (4 fans)
      else if (id(current_page) == 2) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "AIRFLOW");
        it.printf(12, 16, id(font_small), "Exhaust Out [%d%%]", id(local_target_out));
        it.printf(12, 27, id(font_small), "Exhaust Room [%d%%]", id(local_target_recirc));
        it.printf(12, 38, id(font_small), "Main Intake [%d%%]", id(local_target_intake_main));
        it.printf(12, 49, id(font_small), "Clone Intake [%d%%]", id(local_target_intake_clone));
        it.printf(0, 16 + (id(menu_cursor) * 11), id(font_small), ">>");
      }

      // PAGE 4: LIGHTING
      else if (id(current_page) == 4) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "LIGHTING");
        it.printf(12, 16, id(font_small), "SF1000 [%d%%]", id(local_target_sf1000));
        it.printf(12, 27, id(font_small), "Sunrise [%dm]", id(sunrise_minutes));
        it.printf(12, 38, id(font_small), "Sunset [%dm]", id(sunset_minutes));
        it.printf(0, 16 + (id(menu_cursor) * 11), id(font_small), ">>");
        if (id(manual_light_hold))
          it.printf(12, 51, id(font_small), "SCHEDULE PAUSED (hold)");
      }

      // PAGE 3 / 5: ADJUST ITEM (name + big value + live bar)
      else if (id(current_page) == 3 || id(current_page) == 5) {
        static const char* fan_names[]   = {"Exhaust Out", "Exhaust Room", "Main Intake", "Clone Intake"};
        static const char* light_names[] = {"SF1000", "Sunrise", "Sunset"};
        int current_val = 0, bar_max = 100;
        const char* unit = "%";
        const char* iname = "";
        if (id(current_page) == 3) {
          it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "ADJUST FAN");
          iname = fan_names[id(adjusting_item) & 3];
          if (id(adjusting_item) == 0) current_val = id(local_target_out);
          else if (id(adjusting_item) == 1) current_val = id(local_target_recirc);
          else if (id(adjusting_item) == 2) current_val = id(local_target_intake_main);
          else if (id(adjusting_item) == 3) current_val = id(local_target_intake_clone);
        } else {
          it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "ADJUST LIGHT");
          iname = light_names[id(adjusting_item) % 3];
          if (id(adjusting_item) == 0) current_val = id(local_target_sf1000);
          else if (id(adjusting_item) == 1) { current_val = id(sunrise_minutes); unit = "min"; bar_max = 120; }
          else if (id(adjusting_item) == 2) { current_val = id(sunset_minutes);  unit = "min"; bar_max = 120; }
        }
        it.printf(64, 15, id(font_small), TextAlign::TOP_CENTER, "%s", iname);
        it.printf(64, 33, id(font_large), TextAlign::CENTER, "%d %s", current_val, unit);
        // Live bar: outline + proportional fill
        it.rectangle(14, 45, 100, 7);
        int fillw = (current_val * 98) / bar_max;
        if (fillw > 0) it.filled_rectangle(15, 46, fillw, 5);
        if (id(current_page) == 5 && id(adjusting_item) == 0 && id(manual_light_hold))
          it.printf(64, 55, id(font_small), TextAlign::TOP_CENTER, "Held - resumes at OFF");
        else
          it.printf(64, 55, id(font_small), TextAlign::TOP_CENTER, "Live - Push = Done");
      }

      // PAGE 6: SYSTEM INFO (uptime + firmware for remote triage)
      else if (id(current_page) == 6) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "SYSTEM INFO");
        it.printf(4, 13, id(font_small), "HA:%s  Flt:%s", id(ha_connected).state ? "Conn" : "Off", id(sensor_fault_active) ? "YES" : "No");
        int us = (int) id(uptime_s).state;
        it.printf(4, 23, id(font_small), "Up: %dd %02dh %02dm   CO2e %.0f", us / 86400, (us % 86400) / 3600, (us % 3600) / 60, id(co2_ppm_estimate).state);
        std::string ip_line = "IP: " + id(network_ip).state;
        draw_scroll(4, 33, id(font_small), ip_line.c_str());
        std::string fw_line = "FW: " + id(fw_version).state;
        draw_scroll(4, 43, id(font_small), fw_line.c_str());
        it.printf(4, 53, id(font_small), "DSC-HUB  rev 2");
      }

      // PAGE 7: GROW STATUS (read-only)
      else if (id(current_page) == 7) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "GROW STATUS");
        it.printf(4, 16, id(font_small), "Stage: %s", id(stage_short).c_str());
        it.printf(4, 27, id(font_small), "VPD %.2f /%.1f-%.1f", id(vpd_sensor).state, id(stage_vpd_min), id(stage_vpd_max));
        it.printf(4, 38, id(font_small), "RH %.0f%% /%.0f-%.0f", id(humidity_sensor).state, id(stage_rh_min), id(stage_rh_max));
        if (id(stage_light_hours) <= 0) {
          it.printf(4, 49, id(font_small), "Light: DARK (Dry)");
        } else {
          int mins_left = -1;
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          if (now.is_valid()) {
            int cur = now.hour * 60 + now.minute;
            int on_m = id(lights_on_time).hour * 60 + id(lights_on_time).minute;
            int off_m = (on_m + id(stage_light_hours) * 60) % 1440;
            if (id(lights_currently_on)) mins_left = (off_m - cur + 1440) % 1440;
            else mins_left = (on_m - cur + 1440) % 1440;
          }
          if (mins_left >= 0)
            it.printf(4, 49, id(font_small), "L:%s  %dh%02dm %s", id(lights_currently_on) ? "ON" : "OFF", mins_left / 60, mins_left % 60, id(lights_currently_on) ? "left" : "on");
          else
            it.printf(4, 49, id(font_small), "L:%s  (no clock)", id(lights_currently_on) ? "ON" : "OFF");
        }
      }

      // ==================== STATUS CAROUSEL (dial from Home) =============

      // PAGE 8: TRENDS (current + 1h delta + sparkline per metric)
      else if (id(current_page) == 8) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "TRENDS 1h");
        draw_dots(1);
        // Gather ring buffer chronologically (oldest -> newest)
        float v_t[12], v_r[12], v_v[12];
        int cnt   = id(hist_filled) ? 12 : id(hist_idx);
        int start = id(hist_filled) ? id(hist_idx) : 0;
        for (int i = 0; i < cnt; i++) {
          int k = (start + i) % 12;
          v_t[i] = id(hist_temp)[k]; v_r[i] = id(hist_rh)[k]; v_v[i] = id(hist_vpd)[k];
        }
        // Sparkline: 38px wide box, 10px tall, NANs skipped
        auto spark = [&](int y, float *v, int n) {
          if (n < 2) return;
          float mn = 1e9f, mx = -1e9f;
          for (int i = 0; i < n; i++) if (!isnan(v[i])) { if (v[i] < mn) mn = v[i]; if (v[i] > mx) mx = v[i]; }
          if (mx < mn) return;                          // all NAN
          if (mx - mn < 0.01f) { mx += 0.5f; mn -= 0.5f; }
          int px = -1, py = -1;
          for (int i = 0; i < n; i++) {
            if (isnan(v[i])) continue;
            int x  = 88 + (i * 38) / 11;
            int yy = y + 9 - (int)((v[i] - mn) / (mx - mn) * 8.0f);
            if (px >= 0) it.line(px, py, x, yy);
            px = x; py = yy;
          }
        };
        // First valid (oldest) sample = delta baseline
        auto base = [&](float *v, int n) -> float {
          for (int i = 0; i < n; i++) if (!isnan(v[i])) return v[i];
          return NAN;
        };
        float tc = id(temp_sensor).state, rc = id(humidity_sensor).state, vc = id(vpd_sensor).state;
        float t0 = base(v_t, cnt), r0 = base(v_r, cnt), v0 = base(v_v, cnt);
        if (!isnan(t0) && !isnan(tc)) it.printf(4, 14, id(font_small), "T %.1f %+.1f", tc, tc - t0);
        else                          it.printf(4, 14, id(font_small), "T %.1f ...", tc);
        spark(14, v_t, cnt);
        if (!isnan(r0) && !isnan(rc)) it.printf(4, 27, id(font_small), "RH %.0f%% %+.0f", rc, rc - r0);
        else                          it.printf(4, 27, id(font_small), "RH %.0f%% ...", rc);
        spark(27, v_r, cnt);
        if (!isnan(v0) && !isnan(vc)) it.printf(4, 40, id(font_small), "VPD %.2f %+.2f", vc, vc - v0);
        else                          it.printf(4, 40, id(font_small), "VPD %.2f ...", vc);
        spark(40, v_v, cnt);
        it.printf(4, 53, id(font_small), "CO2e %.0f ppm", id(co2_ppm_estimate).state);
      }

      // PAGE 9: LIGHTS (window, brightness, ramp phase, countdown)
      else if (id(current_page) == 9) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "LIGHTS");
        draw_dots(2);
        float pct = id(auto_photoperiod_enabled) && !id(manual_light_hold)
                      ? id(light_current_pct)
                      : (id(light_sf1000).remote_values.is_on() ? id(light_sf1000).remote_values.get_brightness() * 100.0f : 0.0f);
        it.printf(4, 16, id(font_small), "SF1000: %s %d%%", pct > 0.5f ? "ON" : "OFF", (int) pct);
        int lh = id(lights_on_time).hour, lm = id(lights_on_time).minute;
        int h12 = lh % 12; if (h12 == 0) h12 = 12;
        char l2[48];
        snprintf(l2, sizeof(l2), "On @ %d:%02d %s for %dh", h12, lm, lh < 12 ? "AM" : "PM", id(stage_light_hours));
        draw_scroll(4, 27, id(font_small), l2);
        const char* ramp = id(manual_light_hold)      ? "HELD (manual)"
                         : id(light_ramp_state) == 1  ? "Sunrise (raising)"
                         : id(light_ramp_state) == 2  ? "Sunset (dimming)"
                         : (id(lights_currently_on) ? "Steady" : "Dark");
        it.printf(4, 38, id(font_small), "Phase: %s", ramp);
        if (id(stage_light_hours) > 0) {
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          if (now.is_valid()) {
            int cur = now.hour * 60 + now.minute;
            int on_m = id(lights_on_time).hour * 60 + id(lights_on_time).minute;
            int off_m = (on_m + id(stage_light_hours) * 60) % 1440;
            int mins = id(lights_currently_on) ? (off_m - cur + 1440) % 1440 : (on_m - cur + 1440) % 1440;
            it.printf(4, 49, id(font_small), "%dh%02dm to %s", mins / 60, mins % 60, id(lights_currently_on) ? "OFF" : "ON");
          }
        } else {
          it.printf(4, 49, id(font_small), "Dark period (Dry)");
        }
      }

      // PAGE 10: FANS (purpose + live speed)
      else if (id(current_page) == 10) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "FANS");
        draw_dots(3);
        it.printf(4, 16, id(font_small), "Out  %3d%% Outside", id(fan_exhaust_out).state ? id(fan_exhaust_out).speed : 0);
        it.printf(4, 27, id(font_small), "Room %3d%% Recirc", id(fan_exhaust_recirc).state ? id(fan_exhaust_recirc).speed : 0);
        it.printf(4, 38, id(font_small), "IntM %3d%%  Fresh", id(fan_intake_main).state ? id(fan_intake_main).speed : 0);
        it.printf(4, 49, id(font_small), "Int2 %3d%%  Clone", id(fan_intake_clone).state ? id(fan_intake_clone).speed : 0);
      }

      // PAGE 11: WIFI DIAGNOSTICS
      else if (id(current_page) == 11) {
        it.printf(64, 0, id(font_medium), TextAlign::TOP_CENTER, "WIFI DIAG");
        draw_dots(4);
        std::string ssid_line = "SSID: " + id(network_ssid).state;
        draw_scroll(4, 16, id(font_small), ssid_line.c_str());
        float rssi = id(wifi_rssi).state;
        const char* q = isnan(rssi) ? "?" : (rssi > -60 ? "Good" : (rssi > -70 ? "OK" : "Weak"));
        it.printf(4, 27, id(font_small), "RSSI: %.0f dBm %s", rssi, q);
        std::string ip_line = "IP: " + id(network_ip).state;
        draw_scroll(4, 38, id(font_small), ip_line.c_str());
        it.printf(4, 49, id(font_small), "HA: %s", id(ha_connected).state ? "Connected" : "Offline");
      }

      // --- HOLD-ENGAGED FLASH BANNER (drawn last = on top, 2s) -----------
      if (millis() < id(manual_banner_until)) {
        it.filled_rectangle(0, 0, 128, 12);
        if (id(current_page) == 5)
          it.printf(64, 1, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER, "LIGHT HELD - sched paused");
        else
          it.printf(64, 1, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER, "MANUAL - auto fans paused");
      }

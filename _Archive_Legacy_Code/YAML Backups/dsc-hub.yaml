# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: dsc-hub
  friendly_name: DSC-HUB
  on_boot:
    - priority: -100
      then:
        - lambda: 'id(last_valid_temp_time) = millis();'
        - delay: 3s
        # Re-apply the (restored) stage after reboot so every target
        # is populated correctly before the control loops kick in.
        - script.execute: apply_stage
        # If Auto was live before the power cut, arm the resume prompt.
        # It auto-continues after 60s so an unattended blip self-heals;
        # automations hold off until resolved.
        - lambda: |-
            if (id(full_auto_mode) || id(auto_photoperiod_enabled)) {
              id(boot_resume_pending) = true;
              ESP_LOGI("boot", "Auto was active pre-boot -> resume prompt armed");
            }

# Batch flash writes so rapid dial-spinning doesn't wear the chip.
preferences:
  flash_write_interval: 60s

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "Up4ETAwSuerKfUCeTVH59TLHwMMjHVgu4TjPawh7QXc="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: DSC-HUB Fallback Hotspot
    password: "adGVoFwQ1MKI"


# ==================================================================
#  DIGITAL-PLANT  ·  Grow Tent Environmental Controller
#  Device: airquality   (ESP32 + SH1106 128x64 OLED + rotary UI)
# ==================================================================
#  CONTROL MODEL — how the pieces fit together
#  -----------------------------------------------------------------
#   1. Pick "Grow Stage" in HA  ->  auto-loads the VPD / RH / Temp
#      targets + photoperiod length for that stage. (You can still
#      fine-tune the individual number sliders afterwards — the stage
#      just writes sensible defaults into them.)
#   2. "Control Strategy" decides WHICH variable the fans chase:
#        VPD (grower-grade, default) / Temperature / Humidity
#   3. "Tent Full Auto Mode"  -> enables the fan auto-curve.
#   4. "Auto Photoperiod"     -> the DEVICE runs the light schedule
#      locally (survives HA / network loss). HA only sets the params
#      (stage = duration, "Lights-On Time" HH:MM = when it starts).
#      Sunrise/Sunset: the SF1000 ramps 0 -> target% over "Sunrise
#      Duration" minutes at lights-on, and target% -> 0 over "Sunset
#      Duration" minutes finishing AT lights-off. Both ramps live
#      INSIDE the photoperiod window (auto-scaled if they overlap).
#   5. Humidifier / Dehumidifier soft switches -> read-only demand
#      signals HA can watch to drive external gear (see that section).
#
#  FAN ROLES (4x inline) — "software-defined damper":
#     6" Exhaust (Outside) -> dumps heat/moisture OUT (carbon filter 1).
#                             Ramps on TEMP over target, RH overflow when
#                             the dehumidifier can't cope, + a 15% fresh-
#                             air floor so CO2 never fully depletes.
#     6" Exhaust (Room)    -> RECIRCULATES into the room (carbon filter 2).
#                             Ramps on VPD / RH demand. Holds the light's
#                             heat in the room lung; the room dehumidifier
#                             then pulls the moisture. This is the winter /
#                             cold-but-humid workhorse.
#     4" Intake (Main)     -> fresh air room -> 4x8, slaved to total exhaust
#     4" Intake (2x4)      -> fresh air room -> 2x4 (cascades into 4x8)
#   Blending OUT vs ROOM % IS the damper — no mechanical flap needed.
#   Makeup air for OUT comes from a door undercut / cracked vent.
#
#  APPLIANCE ESCALATION LADDER (fans first, appliances on failure):
#     Demands are soft signals; HA automations do the real switching,
#     e.g. "if Heater Demand on -> turn on heater plug, off when off".
#       Too humid : fans 5 min, RH still > max+3  -> Dehumidifier Demand
#       Too dry   : 2 min below min-2             -> Humidifier Demand
#       Too cold  : 1 min below target-1          -> Grow Mat Demand
#                   5 min below target-2          -> Heater Demand (750W)
#       Too hot   : OUT maxed 5 min, > target+2   -> AC Demand (cool @20C)
#     All clear with hysteresis once back in band. Each has an "Auto"
#     arm switch. Emergency (>35C): heat demands OFF, AC ON.
#
#  MANUAL OVERRIDE (mutually exclusive with Full Auto):
#     Manual ON = device stops driving fans AND light: no auto-curve,
#     no slaving/roles, no photoperiod. Your values just stick.
#     Safety layers (failsafe, watchdog) still override. OLED adjust
#     pages apply LIVE as you scroll the dial; push = done.
#
#  PRIORITY ORDER (highest wins):
#     Emergency failsafe (>35C: OUT 100%, ROOM 0%, intakes 100% = once-
#        through purge outside)  >  Sensor-fault safe mode
#        >  Manual Override  >  Auto Photoperiod / Full Auto curve
#
#  OLED UI:
#     Home page dial-rotate = status carousel:
#        Home <-> Trends <-> Lights <-> Fans <-> WiFi Diag
#     Any text wider than the screen auto-scrolls (marquee).
#     Screensaver shows a live "Running: ..." automation status line.
#
#  HA ENTITIES added by this config:
#     select   : Grow Stage, Control Strategy
#     switch   : Tent Full Auto Mode, Tent Manual Override,
#                Auto Photoperiod, Humidifier Auto/Demand,
#                Dehumidifier Auto/Demand, Heater Auto/Demand,
#                Grow Mat Auto/Demand, AC Auto/Demand
#     number   : Target Temp, VPD Min, VPD Max, RH Min, RH Max,
#                Sunrise Duration, Sunset Duration, SF1000 Target %
#     datetime : Lights-On Time (HH:MM, shows as AM/PM in HA)
#     binary   : HA Link Status, Climate Sensor Fault
#  RENAMED fans: "6 Inch Exhaust (Outside)" + "(Room)" (were Main/Aux) —
#  their HA entity_ids change, so update any dashboards referencing them.
# ==================================================================


captive_portal:

# Time: SNTP primary (internet, HA-independent) so the photoperiod
# keeps running even if Home Assistant is down. HA time is backup.
# TIMEZONE IS CRITICAL — without it the schedule runs on UTC.
time:
  - platform: sntp
    id: sntp_time
    timezone: "Australia/Sydney"
  - platform: homeassistant
    id: grow_time

# ==========================================
# 1. I2C BUS & FONTS
# ==========================================
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_medium
    size: 14
  - file: "gfonts://Roboto"
    id: font_large
    size: 20

# ==========================================
# 2. GLOBALS (State Machine & Memory)
# ==========================================
globals:
  # --- UI state machine ---
  - id: current_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: menu_cursor
    type: int
    restore_value: false
    initial_value: '0'
  - id: adjusting_item
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_interaction_time
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Manual target levels (light brightness persists) ---
  - id: local_target_out
    type: int
    restore_value: false
    initial_value: '0'
  - id: local_target_intake_main
    type: int
    restore_value: false
    initial_value: '0'
  - id: local_target_intake_clone
    type: int
    restore_value: false
    initial_value: '0'
  - id: local_target_recirc
    type: int
    restore_value: false
    initial_value: '0'
  - id: local_target_sf1000
    type: int
    restore_value: true
    initial_value: '75'

  # --- Operating modes (persist across reboot) ---
  - id: emergency_failsafe_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: full_auto_mode
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: auto_photoperiod_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: humidifier_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: dehumidifier_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: heater_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: growmat_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ac_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'

  # --- Boot resume: power returned mid-schedule ---
  - id: boot_resume_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_time_synced_at        # millis when clock became valid (0 = not yet)
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Escalation ladder timers (millis when a condition began; 0 = clear) ---
  - id: esc_humid_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_dry_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_cold_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_deep_cold_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_hot_since
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Stage-driven targets (written by apply_stage) ---
  - id: stage_temp_target
    type: float
    restore_value: false
    initial_value: '25.0'
  - id: stage_vpd_min
    type: float
    restore_value: false
    initial_value: '0.4'
  - id: stage_vpd_max
    type: float
    restore_value: false
    initial_value: '0.8'
  - id: stage_rh_min
    type: float
    restore_value: false
    initial_value: '70.0'
  - id: stage_rh_max
    type: float
    restore_value: false
    initial_value: '80.0'
  - id: stage_light_hours
    type: int
    restore_value: false
    initial_value: '18'
  - id: stage_short
    type: std::string
    restore_value: false
    initial_value: '"Germ"'

  # --- Control strategy: 0=VPD, 1=Temperature, 2=Humidity (persists) ---
  - id: control_strategy_idx
    type: int
    restore_value: true
    initial_value: '0'

  # --- Photoperiod & sunrise/sunset ramp ---
  # (Lights-On Time itself lives in the `datetime` entity, restore_value: true)
  - id: lights_currently_on
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: sunrise_minutes
    type: int
    restore_value: true
    initial_value: '30'
  - id: sunset_minutes
    type: int
    restore_value: true
    initial_value: '30'
  - id: light_ramp_state          # 0 = steady/off, 1 = sunrise, 2 = sunset
    type: int
    restore_value: false
    initial_value: '0'
  - id: light_current_pct         # live brightness the ramp engine is driving
    type: float
    restore_value: false
    initial_value: '0.0'

  # --- Failsafe snapshot (to restore state after an emergency) ---
  - id: saved_out
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_intake_main
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_intake_clone
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_recirc
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_light_sf1000_b
    type: float
    restore_value: false
    initial_value: '0.0'

  # --- Sensor watchdog ---
  - id: sensor_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_valid_temp_time
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Screensaver physics ---
  - id: saver_x
    type: float
    restore_value: false
    initial_value: '10.0'
  - id: saver_y
    type: float
    restore_value: false
    initial_value: '10.0'
  - id: saver_vx
    type: float
    restore_value: false
    initial_value: '2.0'
  - id: saver_vy
    type: float
    restore_value: false
    initial_value: '1.5'

  # --- Marquee scrolling + live automation status line ---
  - id: marquee_px
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: auto_status_text
    type: std::string
    restore_value: false
    initial_value: '"Idle - automation off"'

  # --- 1h trend ring buffers (12 slots, sampled every 5 min) ---
  - id: hist_temp
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: hist_rh
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: hist_vpd
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: hist_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: hist_filled
    type: bool
    restore_value: false
    initial_value: 'false'

# ==========================================
# 3. PWM OUTPUTS, FANS & LIGHTS
# ==========================================
output:
  - platform: ledc
    pin: GPIO16
    id: exhaust_out_pwm          # 6" exhaust -> OUTSIDE (carbon filter 1)
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO17
    id: intake_4in_main_pwm
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO18
    id: intake_4in_clone_pwm
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO19                  # was 250W light -> now 6" exhaust -> ROOM
    id: exhaust_recirc_pwm       # (carbon filter 2). Same clamp mod
    frequency: 1000 Hz           # (330R + 3v3 zener / opto) before wiring.
  - platform: ledc
    pin: GPIO23
    id: light_sf1000_pwm
    frequency: 1000 Hz

fan:
  - platform: speed
    output: exhaust_out_pwm
    name: "6 Inch Exhaust (Outside)"
    id: fan_exhaust_out
  - platform: speed
    output: exhaust_recirc_pwm
    name: "6 Inch Exhaust (Room)"
    id: fan_exhaust_recirc
  - platform: speed
    output: intake_4in_main_pwm
    name: "4 Inch Intake Fan (Main)"
    id: fan_intake_main
  - platform: speed
    output: intake_4in_clone_pwm
    name: "4 Inch Intake Fan (2x4)"
    id: fan_intake_clone

light:
  - platform: monochromatic
    output: light_sf1000_pwm
    name: "SF1000 Dimmer"
    id: light_sf1000

# ==========================================
# 4. HA CONTROLS (switches / selects / numbers)
# ==========================================
switch:
  # MANUAL OVERRIDE <-> FULL AUTO are mutually exclusive (each turns the
  # other off). Manual = the device stops driving fans AND the light
  # entirely: no auto-curve, no slaving/roles, no photoperiod — whatever
  # you set from the dial or HA just sticks. The safety layers (emergency
  # failsafe, sensor watchdog) still override manual. The appliance
  # escalation ladder keeps signalling in manual; disable individual
  # "X Auto" switches if you want it silent too.
  - platform: template
    name: "Tent Manual Override"
    id: local_manual_mode
    icon: "mdi:hand-back-right"
    optimistic: true
    turn_on_action:
      - globals.set: {id: full_auto_mode, value: 'false'}

  - platform: template
    name: "Tent Full Auto Mode"
    id: full_auto_switch
    icon: "mdi:auto-mode"
    lambda: 'return id(full_auto_mode);'
    turn_on_action:
      - globals.set: {id: full_auto_mode, value: 'true'}
      - switch.turn_off: local_manual_mode
    turn_off_action:
      - globals.set: {id: full_auto_mode, value: 'false'}

  - platform: template
    name: "Auto Photoperiod"
    id: photoperiod_switch
    icon: "mdi:theme-light-dark"
    lambda: 'return id(auto_photoperiod_enabled);'
    turn_on_action:
      - globals.set: {id: auto_photoperiod_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: auto_photoperiod_enabled, value: 'false'}

  # --- Humidifier soft switch (RH TOO LOW) ---
  - platform: template
    name: "Humidifier Auto"
    id: humidifier_auto_switch
    icon: "mdi:air-humidifier"
    lambda: 'return id(humidifier_auto_enabled);'
    turn_on_action:
      - globals.set: {id: humidifier_auto_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: humidifier_auto_enabled, value: 'false'}
  - platform: template
    name: "Humidifier Demand"      # <-- watch THIS in your HA automation
    id: humidifier_demand
    icon: "mdi:water-plus"
    optimistic: true

  # --- Dehumidifier soft switch (RH TOO HIGH — the one that matters in NSW flower) ---
  - platform: template
    name: "Dehumidifier Auto"
    id: dehumidifier_auto_switch
    icon: "mdi:air-humidifier-off"
    lambda: 'return id(dehumidifier_auto_enabled);'
    turn_on_action:
      - globals.set: {id: dehumidifier_auto_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: dehumidifier_auto_enabled, value: 'false'}
  - platform: template
    name: "Dehumidifier Demand"    # <-- watch THIS in your HA automation
    id: dehumidifier_demand
    icon: "mdi:water-minus"
    optimistic: true

  # --- ESCALATION LADDER appliances (HA does the actual switching) ---
  # "X Auto" arms the ladder for that device; "X Demand" is the read-only
  # signal an HA automation follows. Demands only engage when the fans
  # have demonstrably failed to fix the condition (see run_climate_logic).
  - platform: template
    name: "Heater Auto"
    id: heater_auto_switch
    icon: "mdi:radiator"
    lambda: 'return id(heater_auto_enabled);'
    turn_on_action:
      - globals.set: {id: heater_auto_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: heater_auto_enabled, value: 'false'}
      - switch.turn_off: heater_demand
  - platform: template
    name: "Heater Demand"          # 750W fan heater
    id: heater_demand
    icon: "mdi:fire"
    optimistic: true

  - platform: template
    name: "Grow Mat Auto"
    id: growmat_auto_switch
    icon: "mdi:heat-wave"
    lambda: 'return id(growmat_auto_enabled);'
    turn_on_action:
      - globals.set: {id: growmat_auto_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: growmat_auto_enabled, value: 'false'}
      - switch.turn_off: growmat_demand
  - platform: template
    name: "Grow Mat Demand"        # under-pot root-zone warmth
    id: growmat_demand
    icon: "mdi:heating-coil"
    optimistic: true

  - platform: template
    name: "AC Auto"
    id: ac_auto_switch
    icon: "mdi:air-conditioner"
    lambda: 'return id(ac_auto_enabled);'
    turn_on_action:
      - globals.set: {id: ac_auto_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: ac_auto_enabled, value: 'false'}
      - switch.turn_off: ac_demand
  - platform: template
    name: "AC Demand"              # portable AC, set to cool @ 20C max
    id: ac_demand
    icon: "mdi:snowflake"
    optimistic: true

select:
  - platform: template
    name: "Grow Stage"
    id: grow_stage
    icon: "mdi:sprout"
    optimistic: true
    restore_value: true
    initial_option: "Germination"
    options:
      - "Germination"
      - "Seedling"
      - "Early Vegetative"
      - "Vegetative"
      - "Late (Push) Vegetative"
      - "Early Flowering"
      - "Flowering"
      - "Late Flowering"
      - "Final 48-72h Flowering"
      - "Dry Mode"
    set_action:
      - script.execute: apply_stage

  - platform: template
    name: "Control Strategy"
    id: control_strategy
    icon: "mdi:tune-variant"
    optimistic: true
    restore_value: true
    initial_option: "VPD"
    options:
      - "VPD"
      - "Temperature"
      - "Humidity"
    set_action:
      - lambda: |-
          if (x == "VPD") id(control_strategy_idx) = 0;
          else if (x == "Temperature") id(control_strategy_idx) = 1;
          else id(control_strategy_idx) = 2;

number:
  - platform: template
    name: "Target Temp"
    id: num_target_temp
    icon: "mdi:thermometer"
    optimistic: true
    min_value: 15
    max_value: 32
    step: 0.5
    unit_of_measurement: "°C"
    initial_value: 25
    set_action:
      - globals.set: {id: stage_temp_target, value: !lambda 'return x;'}

  - platform: template
    name: "VPD Target Min"
    id: num_vpd_min
    icon: "mdi:water-thermometer"
    optimistic: true
    min_value: 0.4
    max_value: 1.6
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.4
    set_action:
      - globals.set: {id: stage_vpd_min, value: !lambda 'return x;'}

  - platform: template
    name: "VPD Target Max"
    id: num_vpd_max
    icon: "mdi:water-thermometer"
    optimistic: true
    min_value: 0.4
    max_value: 1.8
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.8
    set_action:
      - globals.set: {id: stage_vpd_max, value: !lambda 'return x;'}

  - platform: template
    name: "RH Target Min"
    id: num_rh_min
    icon: "mdi:water-percent"
    optimistic: true
    min_value: 20
    max_value: 90
    step: 1
    unit_of_measurement: "%"
    initial_value: 70
    set_action:
      - globals.set: {id: stage_rh_min, value: !lambda 'return x;'}

  - platform: template
    name: "RH Target Max"
    id: num_rh_max
    icon: "mdi:water-percent"
    optimistic: true
    min_value: 20
    max_value: 95
    step: 1
    unit_of_measurement: "%"
    initial_value: 80
    set_action:
      - globals.set: {id: stage_rh_max, value: !lambda 'return x;'}

  - platform: template
    name: "Sunrise Duration"
    id: num_sunrise
    icon: "mdi:weather-sunset-up"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    update_interval: 10s
    lambda: 'return id(sunrise_minutes);'
    set_action:
      - globals.set: {id: sunrise_minutes, value: !lambda 'return (int) x;'}

  - platform: template
    name: "Sunset Duration"
    id: num_sunset
    icon: "mdi:weather-sunset-down"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    update_interval: 10s
    lambda: 'return id(sunset_minutes);'
    set_action:
      - globals.set: {id: sunset_minutes, value: !lambda 'return (int) x;'}

  # The "X" in the 0 -> X% sunrise ramp. Also the level manual OLED
  # adjust writes to, so device + HA always agree on the target.
  - platform: template
    name: "SF1000 Target Brightness"
    id: num_sf1000_target
    icon: "mdi:brightness-percent"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 10s
    lambda: 'return id(local_target_sf1000);'
    set_action:
      - globals.set: {id: local_target_sf1000, value: !lambda 'return (int) x;'}

# Real HH:MM picker in HA (renders as AM/PM per your HA locale).
# Replaces the old whole-hour "Lights-On Hour" slider.
datetime:
  - platform: template
    name: "Lights-On Time"
    id: lights_on_time
    type: time
    icon: "mdi:clock-time-six-outline"
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"

# ==========================================
# 5. SYSTEM INFO TEXT SENSORS
# ==========================================
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: network_ip
    ssid:
      name: "WiFi SSID"
      id: network_ssid

# ==========================================
# 6. HARDWARE SENSORS, FAILSAFE & WATCHDOG
# ==========================================
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 15s

  - platform: dht
    model: DHT22
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    update_interval: 30s
    temperature:
      id: temp_sensor
      name: "temp"
      filters:
        - filter_out: 150.0
        - lambda: |-
            if (isnan(x) || x < -10 || x > 60) return NAN;
            return x;
      # Watchdog heartbeat: stamp the time of every VALID reading.
      on_value:
        - lambda: 'if (!isnan(id(temp_sensor).state)) id(last_valid_temp_time) = millis();'
      # EMERGENCY FAILSAFE (hysteresis 34/35 C)
      on_value_range:
        - above: 35.0
          then:
            - lambda: |-
                if (id(emergency_failsafe_active)) return;   // already tripped
                // Snapshot current state so we can restore on clear
                id(saved_out)       = id(fan_exhaust_out).speed;
                id(saved_recirc)   = id(fan_exhaust_recirc).speed;
                id(saved_intake_main)   = id(fan_intake_main).speed;
                id(saved_intake_clone)  = id(fan_intake_clone).speed;
                id(saved_light_sf1000_b)= id(light_sf1000).remote_values.get_brightness();
                id(emergency_failsafe_active) = true;
                // Kill heat sources + ONCE-THROUGH purge to OUTSIDE.
                // ROOM fan -> 0 so we don't dump the tent's heat into the
                // room the intakes are pulling from. Intakes 100% feed the
                // outside fan with (cooler) room/makeup air.
                id(humidifier_demand).turn_off();
                id(heater_demand).turn_off();
                id(growmat_demand).turn_off();
                id(ac_demand).turn_on();     // AC assists the purge (setpoint 20C)
                auto fe = id(fan_exhaust_out).make_call();  fe.set_state(true);  fe.set_speed(100); fe.perform();
                auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(false); fa.set_speed(0);  fa.perform();
                auto fim = id(fan_intake_main).make_call(); fim.set_state(true); fim.set_speed(100); fim.perform();
                auto fic = id(fan_intake_clone).make_call();fic.set_state(true); fic.set_speed(100); fic.perform();
                id(light_sf1000).turn_off().perform();
                ESP_LOGW("failsafe", "EMERGENCY temp>35C: once-through purge OUTSIDE, ROOM fan off, light OFF");
        - below: 34.0
          then:
            - lambda: |-
                if (!id(emergency_failsafe_active)) return;
                id(emergency_failsafe_active) = false;
                id(ac_demand).turn_off();    // ladder re-arms it if still needed
                // Restore the pre-trip fan + light state
                auto fe = id(fan_exhaust_out).make_call();  fe.set_state(id(saved_out) > 0);      fe.set_speed(id(saved_out));      fe.perform();
                auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(id(saved_recirc) > 0);  fa.set_speed(id(saved_recirc));  fa.perform();
                auto fim = id(fan_intake_main).make_call(); fim.set_state(id(saved_intake_main) > 0); fim.set_speed(id(saved_intake_main)); fim.perform();
                auto fic = id(fan_intake_clone).make_call();fic.set_state(id(saved_intake_clone) > 0);fic.set_speed(id(saved_intake_clone));fic.perform();
                if (id(saved_light_sf1000_b) > 0.0f){ auto l = id(light_sf1000).turn_on();l.set_brightness(id(saved_light_sf1000_b));l.perform(); }
                ESP_LOGI("failsafe", "Emergency cleared: restored previous fan/light state");
    humidity:
      id: humidity_sensor
      name: "humidity"
      filters:
        - filter_out: 100.0
        - lambda: |-
            if (isnan(x) || x < 0 || x > 100) return NAN;
            return x;

  - platform: adc
    pin: GPIO34
    name: "CO2 Sensor Voltage"
    id: co2_voltage
    attenuation: 12db
    update_interval: 10s
    filters:
      - exponential_moving_average: {alpha: 0.1, send_every: 3}
    on_value:
      then:
        - component.update: co2_ppm_estimate

  # ---- TEMPLATE SENSORS ----
  - platform: template
    name: "Dynamic CO2 PPM"          # NOTE: uncalibrated analog estimate.
    id: co2_ppm_estimate             # Replace with SCD41 block below for real ppm.
    unit_of_measurement: "ppm"
    icon: "mdi:molecule-co2"
    update_interval: never
    lambda: |-
      float v = id(co2_voltage).state;
      if (isnan(v)) return NAN;
      return 116.67f * expf(2.769f * v);

  - platform: template
    name: "VPD (kPa)"
    id: vpd_sensor
    accuracy_decimals: 2
    unit_of_measurement: "kPa"
    lambda: |-
      float t = id(temp_sensor).state;
      float rh = id(humidity_sensor).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return NAN;
      float svp = 0.6108f * expf((17.27f * t) / (t + 237.3f));
      float avp = svp * (rh / 100.0f);
      return svp - avp;

  # ---- UI: ROTARY ENCODER ----
  - platform: rotary_encoder
    pin_a: GPIO25
    pin_b: GPIO26
    name: "Menu Dial"
    id: menu_dial
    on_clockwise:
      then:
        - lambda: |-
            if (id(boot_resume_pending)) return;   // prompt owns the input
            bool was_asleep = (millis() - id(last_interaction_time)) > 300000;
            id(last_interaction_time) = millis();
            if (was_asleep) return;   // first nudge only wakes the screen

            // --- Home-page status carousel: Home -> Trends -> Lights -> Fans -> WiFi -> Home ---
            if (id(current_page) == 0)       { id(current_page) = 8; }
            else if (id(current_page) == 8)  { id(current_page) = 9; }
            else if (id(current_page) == 9)  { id(current_page) = 10; }
            else if (id(current_page) == 10) { id(current_page) = 11; }
            else if (id(current_page) == 11) { id(current_page) = 0; }

            else if (id(current_page) == 1) { id(menu_cursor) = (id(menu_cursor) + 1) % 4; }
            else if (id(current_page) == 2) { id(menu_cursor) = (id(menu_cursor) + 1) % 4; }
            else if (id(current_page) == 4) { id(menu_cursor) = (id(menu_cursor) + 1) % 3; }
            else if (id(current_page) == 3) { // Adjusting Airflow (4 fans)
              if (id(adjusting_item) == 0 && id(local_target_out) < 100) id(local_target_out) += 5;
              else if (id(adjusting_item) == 1 && id(local_target_recirc) < 100) id(local_target_recirc) += 5;
              else if (id(adjusting_item) == 2 && id(local_target_intake_main) < 100) id(local_target_intake_main) += 5;
              else if (id(adjusting_item) == 3 && id(local_target_intake_clone) < 100) id(local_target_intake_clone) += 5;
              id(apply_live_adjust).execute();   // applies AS you scroll
            }
            else if (id(current_page) == 5) { // Adjusting Lighting
              if (id(adjusting_item) == 0 && id(local_target_sf1000) < 100) id(local_target_sf1000) += 5;
              else if (id(adjusting_item) == 1 && id(sunrise_minutes) < 120) id(sunrise_minutes) += 5;
              else if (id(adjusting_item) == 2 && id(sunset_minutes) < 120) id(sunset_minutes) += 5;
              id(apply_live_adjust).execute();   // applies AS you scroll
            }
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(boot_resume_pending)) return;   // prompt owns the input
            bool was_asleep = (millis() - id(last_interaction_time)) > 300000;
            id(last_interaction_time) = millis();
            if (was_asleep) return;

            // --- Home-page status carousel (reverse) ---
            if (id(current_page) == 0)       { id(current_page) = 11; }
            else if (id(current_page) == 11) { id(current_page) = 10; }
            else if (id(current_page) == 10) { id(current_page) = 9; }
            else if (id(current_page) == 9)  { id(current_page) = 8; }
            else if (id(current_page) == 8)  { id(current_page) = 0; }

            else if (id(current_page) == 1) { id(menu_cursor) = (id(menu_cursor) + 3) % 4; }
            else if (id(current_page) == 2) { id(menu_cursor) = (id(menu_cursor) + 3) % 4; }
            else if (id(current_page) == 4) { id(menu_cursor) = (id(menu_cursor) + 2) % 3; }
            else if (id(current_page) == 3) {
              if (id(adjusting_item) == 0 && id(local_target_out) > 0) id(local_target_out) -= 5;
              else if (id(adjusting_item) == 1 && id(local_target_recirc) > 0) id(local_target_recirc) -= 5;
              else if (id(adjusting_item) == 2 && id(local_target_intake_main) > 0) id(local_target_intake_main) -= 5;
              else if (id(adjusting_item) == 3 && id(local_target_intake_clone) > 0) id(local_target_intake_clone) -= 5;
              id(apply_live_adjust).execute();   // applies AS you scroll
            }
            else if (id(current_page) == 5) {
              if (id(adjusting_item) == 0 && id(local_target_sf1000) > 0) id(local_target_sf1000) -= 5;
              else if (id(adjusting_item) == 1 && id(sunrise_minutes) > 0) id(sunrise_minutes) -= 5;
              else if (id(adjusting_item) == 2 && id(sunset_minutes) > 0) id(sunset_minutes) -= 5;
              id(apply_live_adjust).execute();   // applies AS you scroll
            }

# ------------------------------------------------------------------
# OPTIONAL: real CO2 sensor (Sensirion SCD41). Drops onto the SAME
# I2C bus (GPIO21/22) — no new wiring. When the sensor arrives:
#   1) uncomment this block
#   2) delete the ADC "co2_voltage" + "Dynamic CO2 PPM" sensors above
#   3) point the OLED "CO2e" line at id(scd41_co2)
# ------------------------------------------------------------------

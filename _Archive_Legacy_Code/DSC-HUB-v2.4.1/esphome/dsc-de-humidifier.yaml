# ==================================================================
#  DSC-De-Humidifier — device stub  (v2.4)
#  Sonoff BASIC R2 v1.4 · ESP8285 · GPIO12 relay / GPIO0 button / GPIO13 LED
#  ------------------------------------------------------------------
#  ⚠ NEVER put logic in a stub — it belongs in dsc-sonoff-common.yaml.
#  ⚠ `name:` is the entity_id contract: switch.dsc_de_humidifier_main_relay
#     is referenced by the demand_follower automation + dashboards.
#
#  API-loss grace: 240s
#  # Dehumidifier — COMPRESSOR. 4min grace: a routine HA restart must NOT
# short-cycle it. Mirrors the hub's 3-min compressor protection; the
# cost of 4 extra minutes of dehumidifying is nothing, a dead
# compressor is a new appliance.
# ==================================================================

substitutions:
  name: dsc-de-humidifier
  friendly_name: DSC-De-Humidifier
  ap_ssid: "DSC-De-Humidifi Fallback Hotspot"
  api_key_val: !secret dsc_dehumidifier_api_key
  ota_password_val: !secret dsc_dehumidifier_ota_password
  ap_password_val: !secret dsc_dehumidifier_ap_password
  api_grace_ms: "240000"

packages:
  common: !include dsc-sonoff-common.yaml

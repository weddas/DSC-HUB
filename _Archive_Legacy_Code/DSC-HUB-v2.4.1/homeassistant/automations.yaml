# ==================================================================
#  DSC-HUB v2.4 · AUTOMATIONS  —  REV B (reconciled against Notion)
#  ------------------------------------------------------------------
#  ⚠️ REV B SUPERSEDES REV A. If you already pasted Rev A, delete its
#  four `dsc_v24_follow_*` automations before using this file.
#
#  v2.4.1 NOTE: no structural changes — the followers and alerts are
#  unchanged. Only the B2 root-zone alert TEXT is updated: the fault
#  now means NO pot probe delivered a plausible reading on EITHER the
#  ESP-NOW direct link or the HA path for 5 min (v2.4 = POT1's HA path
#  only). Reminder for your OWN older Scribe alerts (not in this
#  file): guard every threshold read with `| float(default)` — the
#  19 Jul entries printed "0% floor" / "unavailable kPa ceiling"
#  because a clone threshold entity returned unavailable.
#
#  WHAT CHANGED AND WHY (six-month note):
#
#  Rev A invented its own follower pattern without checking the Code
#  Library. That was wrong three ways:
#
#  1. ID COLLISION — the canonical pack uses `dsc_follower_heater`
#     etc. Rev A used `dsc_v24_follow_heater_demand`. Pasting both
#     gives you EIGHT automations racing on four relays.
#
#  2. SAFETY REGRESSION — Rev A triggered on `to: "on"` / `to: "off"`,
#     which does NOT fire when the demand goes `unavailable`. The
#     canonical pack triggers on ANY state change and uses a
#     `default:` branch, so a hub dropout drives every appliance OFF
#     automatically. Rev A would have left a 750 W heater running when
#     the hub died — the exact failure the v2.4 safety thread exists
#     to close.
#
#  3. WRONG NOTIFIER — Rev A used persistent_notification because it
#     didn't know the real one. It's `notify.chriss_iphone_max`.
#
#  Rev B = the canonical pack + ONE genuine addition (see §A note).
#
#  Source of truth: Code Library → "HA Demand Follower Pack
#  (entity-based)". If you change the pattern here, change it there.
# ==================================================================


# ==================================================================
#  A.  DEMAND FOLLOWERS  —  canonical pattern + node-reconnect
# ==================================================================
#  ⚠️ If your four canonical followers are already installed and
#  working, you only need the ONE-LINE addition below — not a
#  wholesale replace. See install-instructions.md §4.
#
#  THE ADDITION: a third trigger, `relay from: unavailable`.
#
#  Why it's newly necessary: the v2.4 Sonoff batch adds
#  `restore_mode: ALWAYS_OFF`. That's the runaway fix — a node that
#  loses power comes back OFF instead of faithfully restoring a
#  latched ON. But it opens a gap the canonical pack doesn't cover:
#
#     node reboots -> relay comes up OFF -> demand is still ON
#     -> the demand never *changed*, so nothing re-fires
#     -> HA never restarted, so the `homeassistant: start` leg
#        doesn't fire either
#     -> the mat sits dead on a cold night with demand live
#
#  That is the same class of bug as the 17 Jul "demand ON, mat off"
#  symptom, arriving through a different door. ALWAYS_OFF creates it;
#  this trigger closes it.
#
#  Everything else is the canonical pattern verbatim:
#    * `mode: restart` — a rapid flip mid-run lands on the latest state
#    * bare `trigger: state` (no to:/from:) — fires on ANY change,
#      including -> unavailable
#    * `default:` = safe-OFF — catches off / unavailable / unknown
#    * `homeassistant: start` — resync after an HA reboot
#
#  Entity-based, never device-based. Device triggers bind to registry
#  IDs and break silently-then-loudly on any reflash or rename.

- id: dsc_follower_humidifier
  alias: "DSC-HUB · Humidifier follows Humidifier Demand"
  description: "Relay mirrors hub demand. Safe-OFF on hub dropout. Resyncs on HA restart + node reconnect."
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_humidifier_demand
    - trigger: homeassistant
      event: start
    # v2.4 addition — see header. Covers ALWAYS_OFF node reboots.
    - trigger: state
      entity_id: switch.dsc_humidifier_main_relay
      from: "unavailable"
      for: "00:00:05"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.dsc_hub_humidifier_demand
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.dsc_humidifier_main_relay
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.dsc_humidifier_main_relay

- id: dsc_follower_dehumidifier
  alias: "DSC-HUB · Dehumidifier follows Dehumidifier Demand"
  description: "Relay mirrors hub demand. Safe-OFF on hub dropout. Resyncs on HA restart + node reconnect."
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_dehumidifier_demand
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: switch.dsc_de_humidifier_main_relay
      from: "unavailable"
      for: "00:00:05"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.dsc_hub_dehumidifier_demand
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.dsc_de_humidifier_main_relay
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.dsc_de_humidifier_main_relay

- id: dsc_follower_heater
  alias: "DSC-HUB · Heater follows Heater Demand"
  description: "Relay mirrors hub demand. Safe-OFF on hub dropout. Resyncs on HA restart + node reconnect."
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_heater_demand
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: switch.dsc_heater_main_relay
      from: "unavailable"
      for: "00:00:05"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.dsc_hub_heater_demand
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.dsc_heater_main_relay
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.dsc_heater_main_relay

- id: dsc_follower_grow_mat
  alias: "DSC-HUB · Grow Mat follows Grow Mat Demand"
  description: "Relay mirrors hub demand. v2.4: demand is now closed-loop on root-zone temp."
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_grow_mat_demand
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: switch.dsc_heatmat_main_relay
      from: "unavailable"
      for: "00:00:05"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.dsc_hub_grow_mat_demand
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.dsc_heatmat_main_relay
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.dsc_heatmat_main_relay


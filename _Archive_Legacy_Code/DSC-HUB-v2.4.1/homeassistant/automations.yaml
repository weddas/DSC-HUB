# ==================================================================
#  B.  NEW v2.4 ALERTS
# ==================================================================

# ------------------------------------------------------------------
#  B1. CLONE DARK-PERIOD VIOLATION  —  the herm alarm
# ------------------------------------------------------------------
#  Replaces the v2.3 4x8 version, which after the topology change was
#  comparing the CLONE light against the 4x8's schedule — it would
#  have sat green through a real leak.
#
#  60 s persistence, not instant: the ramp engine writes the SF1000
#  and the window flag on the same 15 s tick, but HA sees two separate
#  state updates. A bare trigger would false-alarm at every sunset,
#  and an alarm that cries wolf twice a day gets muted.
- id: dsc_v24_alert_clone_dark_violation
  alias: "DSC-HUB · ALERT Clone dark-period violation"
  description: "SF1000 commanded on outside the 2x4 window for >60s. Flowering herm risk."
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.dsc_clone_dark_period_violation
      to: "on"
      for: "00:01:00"
  actions:
    - action: notify.chriss_iphone_max
      data:
        title: "⚠ CLONE TENT — LIGHT IN DARK PERIOD"
        message: >-
          SF1000 is ON at {{ (state_attr('light.dsc_hub_sf1000_dimmer','brightness')
          | float(0) / 255 * 100) | round(0) }}% but the 2x4 window is shut.
          Manual Light Hold is
          {{ 'ON — that is almost certainly it' if is_state('switch.dsc_hub_manual_light_hold','on')
             else 'off' }}.
    - action: persistent_notification.create
      data:
        title: "⚠ CLONE TENT — LIGHT IN DARK PERIOD"
        notification_id: dsc_clone_dark_violation
        message: >-
          The SF1000 is commanded ON but the 2x4 window is shut.
          Brightness {{ (state_attr('light.dsc_hub_sf1000_dimmer','brightness') | float(0)
          / 255 * 100) | round(0) }}%.

          Most likely cause: Manual Light Hold is engaged
          (currently {{ 'ON' if is_state('switch.dsc_hub_manual_light_hold','on') else 'off' }}).
          It self-heals at the next clone lights-off boundary, but that
          may be a full cycle away.

          Check: Manual Light Hold · Master Manual Takeover
          ({{ 'ON' if is_state('switch.dsc_hub_manual_takeover','on') else 'off' }}) ·
          Auto Photoperiod
          ({{ 'armed' if is_state('switch.dsc_hub_auto_photoperiod','on') else 'DISARMED' }}).
    - action: logbook.log
      data:
        name: "Grow log"
        entity_id: input_boolean.dsc_event_log
        message: "⚠ Clone dark-period violation — SF1000 on outside the 2x4 window"

- id: dsc_v24_alert_clone_dark_violation_clear
  alias: "DSC-HUB · ALERT Clone dark-period violation cleared"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.dsc_clone_dark_period_violation
      to: "off"
  actions:
    - action: persistent_notification.dismiss
      data:
        notification_id: dsc_clone_dark_violation

# ------------------------------------------------------------------
#  B2. ROOT-ZONE PROBE FAULT  —  the mat went blind
# ------------------------------------------------------------------
#  Not an emergency — a REGRESSION notice. The mat silently falls back
#  to the v2.3 clone-air rung, which is safe but is exactly the
#  behaviour v2.4 existed to replace (22 °C plate setpoint left the
#  root zone at 16–19 °C).
#
#  Hence 10 min persistence, no repeat, no phone push. It exists so a
#  dead probe can't hide for a fortnight behind a mat that still looks
#  like it's working.
#
#  v2.4.1: the fault now means NO pot probe delivered a plausible
#  reading on EITHER path (ESP-NOW direct or HA mirror) for 5 min —
#  one healthy probe keeps the loop alive, and an HA restart alone no
#  longer trips this (the direct links ride through it).
- id: dsc_v24_alert_rootzone_fault
  alias: "DSC-HUB · ALERT Root-zone probe fault (mat on air fallback)"
  description: "All pot probes stale >5min on both paths. Mat reverts to v2.3 clone-air rung. Degraded, not dangerous."
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.dsc_hub_root_zone_sensor_fault
      to: "on"
      for: "00:10:00"
  actions:
    - action: persistent_notification.create
      data:
        title: "Root-zone probes offline — grow mat degraded"
        notification_id: dsc_rootzone_fault
        message: >-
          No pot soil-temperature probe has delivered a plausible reading
          for over 5 minutes — on the ESP-NOW direct links OR the HA
          path — so the closed-loop grow mat has fallen back to clone AIR
          temperature (v2.3 behaviour). The mat still works — it is just
          heating to the wrong target again.

          POT1 last read: {{ states('sensor.dsc_pot1_soil_temperature') }}°C ·
          ESP-NOW links:
          P1 {{ states('binary_sensor.dsc_hub_pot1_esp_now_link') }} ·
          P2 {{ states('binary_sensor.dsc_hub_pot2_esp_now_link') }} ·
          P3 {{ states('binary_sensor.dsc_hub_pot3_esp_now_link') }} ·
          P4 {{ states('binary_sensor.dsc_hub_pot4_esp_now_link') }}.

          Likely causes, cheapest first:
            1. Router AP channel hopped (splits ESP-NOW) AND HA is down.
            2. All pot nodes offline (check WiFi RSSI / power).
            3. RS485 probe faults (POT3 already has one).

          Clears automatically when readings resume.
    - action: logbook.log
      data:
        name: "Grow log"
        entity_id: input_boolean.dsc_event_log
        message: "Root-zone probes stale — grow mat fell back to clone-air control"

- id: dsc_v24_alert_rootzone_fault_clear
  alias: "DSC-HUB · ALERT Root-zone probe recovered"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.dsc_hub_root_zone_sensor_fault
      to: "off"
      for: "00:01:00"
  actions:
    - action: persistent_notification.dismiss
      data:
        notification_id: dsc_rootzone_fault
    - action: logbook.log
      data:
        name: "Grow log"
        entity_id: input_boolean.dsc_event_log
        message: "Root-zone probe recovered — closed-loop grow mat resumed"


# ==================================================================
#  C.  SCRIBE — v2.4 EVENTS ONLY
# ==================================================================
#  These cover events that did not exist before v2.4, so they cannot
#  collide with your current Scribe automations.
#
#  ⚠️ They do NOT fix the v2.3 triple-reporting noise — that lives in
#  your existing Scribe entries and needs those EDITED, not these
#  added. Notion's own scoping note agrees: the hysteresis fix removes
#  the noise SOURCE; retune first, then reassess.
#  See notes-comments.md §5.

# Logging the ROOT-ZONE temp at each mat transition is what makes the
# closed loop auditable after the fact: "did the band actually hold
# the soil?" becomes answerable from the log alone.
- id: dsc_v24_scribe_mat_closed_loop
  alias: "DSC-HUB · Scribe Grow mat (closed-loop root zone)"
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_grow_mat_demand
      to: "on"
      id: "on"
    - trigger: state
      entity_id: switch.dsc_hub_grow_mat_demand
      to: "off"
      id: "off"
  actions:
    - action: logbook.log
      data:
        name: "Grow log"
        entity_id: input_boolean.dsc_event_log
        message: >-
          {% set rz = states('sensor.dsc_pot1_soil_temperature') %}
          {% set blind = is_state('binary_sensor.dsc_hub_root_zone_sensor_fault','on') %}
          {% if trigger.id == 'on' %}
            🌱 Grow mat ON — root zone {{ rz }}°C
            (below {{ states('number.dsc_hub_mat_root_zone_low') }}°C){{ ' [AIR FALLBACK — probes blind]' if blind else '' }}
          {% else %}
            Grow mat off — root zone {{ rz }}°C
            (reached {{ states('number.dsc_hub_mat_root_zone_high') }}°C){{ ' [AIR FALLBACK]' if blind else '' }}
          {% endif %}

# Sunrise/sunset are a real ramp on a real light now, not a switch
# flip. Logging the boundaries gives the photoperiod an audit trail
# independent of the recorder's purge window.
- id: dsc_v24_scribe_clone_photoperiod
  alias: "DSC-HUB · Scribe Clone photoperiod boundaries"
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id: binary_sensor.dsc_hub_2x4_window_open
      to: "on"
      id: open
    - trigger: state
      entity_id: binary_sensor.dsc_hub_2x4_window_open
      to: "off"
      id: shut
  actions:
    - action: logbook.log
      data:
        name: "Grow log"
        entity_id: input_boolean.dsc_event_log
        message: >-
          {% if trigger.id == 'open' %}
            ☀ 2x4 sunrise — SF1000 ramping to {{ states('number.dsc_hub_sf1000_target_brightness') }}%
            over {{ states('number.dsc_hub_sunrise_duration') }} min
            ({{ states('select.dsc_hub_clone_photoperiod') }})
          {% else %}
            🌙 2x4 lights-off — SF1000 dark.
            On today: {{ states('sensor.dsc_lights_on_today_2x4') | float(0) | round(2) }}h
            vs {{ states('sensor.dsc_clone_expected_light_hours') }}h planned
          {% endif %}

# A Sonoff in test mode is unsupervised for 10 minutes by design and
# auto-expires — so this is a note, not an alarm. But an appliance
# that ran because someone pressed a button is exactly the kind of
# thing that looks like a control-loop mystery a week later.
- id: dsc_v24_scribe_node_test_mode
  alias: "DSC-HUB · Scribe Appliance node test mode"
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.dsc_heater_test_mode
        - binary_sensor.dsc_heatmat_test_mode
        - binary_sensor.dsc_humidifier_test_mode
        - binary_sensor.dsc_de_humidifier_test_mode
      to: ["on", "off"]
  actions:
    - action: logbook.log
      data:
        name: "Grow log"
        entity_id: input_boolean.dsc_event_log
        message: >-
          🧪 {{ trigger.to_state.attributes.friendly_name }}
          {{ 'ENGAGED — node ignores hub demand for up to 10 min' if trigger.to_state.state == 'on'
             else 'ended — node back under hub control' }}

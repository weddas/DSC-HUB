  # ==========================================
  # 5. TRENDS & LOGS (History)
  # ==========================================
  - title: Trends
    icon: mdi:chart-line
    path: trends
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 📉 CLIMATE HISTORY
            heading_style: title
          
          - type: custom:apexcharts-card
            header:
              show: true
              title: Main Tent · 24 h Climate
              show_states: true
              colorize_states: true
            graph_span: 24h
            apex_config:
              chart:
                height: 300
              grid:
                borderColor: rgba(128,128,128,.15)
            all_series_config:
              stroke_width: 2
            yaxis:
              - id: temp
                decimals: 0
                apex_config:
                  title:
                    text: °C
              - id: rh
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: "% RH"
            series:
              - entity: sensor.dsc_hub_tent_temperature
                name: Temp
                color: "#ed7d31"
                yaxis_id: temp
              - entity: sensor.dsc_hub_tent_humidity
                name: RH
                color: "#5b9bd5"
                yaxis_id: rh
          
          - type: custom:apexcharts-card
            header:
              show: true
              title: VPD · 7 Days
              show_states: true
            graph_span: 7d
            apex_config:
              chart:
                height: 240
            yaxis:
              - min: 0
                max: 2
                decimals: 1
            series:
              - entity: sensor.dsc_hub_vpd_kpa
                name: VPD
                color: "#70ad47"
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 30min
              - entity: number.dsc_hub_vpd_target_min
                name: Min
                curve: stepline
                color: "#5b9bd5"
                stroke_width: 1
                opacity: 0.4
                group_by:
                  func: avg
                  duration: 30min
              - entity: number.dsc_hub_vpd_target_max
                name: Max
                curve: stepline
                color: "#c00000"
                stroke_width: 1
                opacity: 0.4
                group_by:
                  func: avg
                  duration: 30min

      - type: grid
        cards:
          - type: heading
            heading: 🔄 HARDWARE ACTIVITY
            heading_style: title

          - type: custom:apexcharts-card
            header:
              show: true
              title: Demand Activity · 24 h
              show_states: false
            graph_span: 24h
            apex_config:
              chart:
                height: 240
            all_series_config:
              curve: stepline
              stroke_width: 2
              transform: "return x === 'on' ? 1 : 0;"
            yaxis:
              - min: 0
                max: 1.2
                decimals: 0
                show: false
            series:
              - entity: switch.dsc_hub_heater_demand
                name: Heater
                color: "#c00000"
              - entity: switch.dsc_hub_dehumidifier_demand
                name: Dehu
                color: "#ed7d31"
              - entity: switch.dsc_hub_humidifier_demand
                name: Humid
                color: "#5b9bd5"

          - type: custom:apexcharts-card
            header:
              show: true
              title: Fan Duty 6 h
              show_states: true
              colorize_states: true
            graph_span: 6h
            apex_config:
              chart:
                height: 180
            yaxis:
              - min: 0
                max: 100
                decimals: 0
            series:
              - entity: fan.dsc_hub_6_inch_exhaust_outside
                attribute: percentage
                name: Exhaust
                curve: stepline
                stroke_width: 2
                color: "#c00000"
              - entity: fan.dsc_hub_6_inch_exhaust_room
                attribute: percentage
                name: Recirc
                curve: stepline
                stroke_width: 2
                color: "#5b9bd5"
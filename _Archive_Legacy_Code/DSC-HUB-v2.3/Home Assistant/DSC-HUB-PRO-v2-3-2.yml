title: DSC-HUB
views:
  - title: Command Center
    icon: mdi:server-network
    path: command-center
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 👑 SYSTEM STATUS
            heading_style: title
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: sensor.dsc_hub_uptime
                icon: >-
                  {{ 'mdi:chip' if not is_state(entity,'unavailable') else
                  'mdi:alert-circle' }}
                icon_color: "{{ 'green' if not is_state(entity,'unavailable') else 'red' }}"
                content: >-
                  {{ 'HUB ONLINE' if not is_state(entity,'unavailable') else
                  'HUB OFFLINE' }}
              - type: template
                entity: sensor.dsc_hub_uptime
                icon: mdi:timer-outline
                icon_color: green
                content: "{{ states(entity) }}"
              - type: template
                icon: mdi:sprout
                content: >
                  {% set ns = namespace(bad=0) %} {% for e in
                  states.binary_sensor
                     if e.entity_id.startswith('binary_sensor.dsc_')
                     and e.state == 'on'
                     and e.attributes.get('device_class') not in ['connectivity','running'] %}
                  {% set ns.bad = ns.bad + 1 %}{% endfor %} {{ 'All clear' if
                  ns.bad == 0 else ns.bad ~ ' alert(s)' }}
                icon_color: >
                  {% set ns = namespace(bad=0) %} {% for e in
                  states.binary_sensor
                     if e.entity_id.startswith('binary_sensor.dsc_')
                     and e.state == 'on'
                     and e.attributes.get('device_class') not in ['connectivity','running'] %}
                  {% set ns.bad = ns.bad + 1 %}{% endfor %} {{ 'green' if ns.bad
                  == 0 else 'red' }}
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: ⚠️ Active System Alerts
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.dsc_*
                  state: "on"
              exclude:
                - attributes:
                    device_class: connectivity
                - attributes:
                    device_class: running
          - type: heading
            heading: 🎛️ MASTER CONTROL
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-select-card
                entity: select.dsc_hub_priority_tent
                name: Shared Room Priority
                icon: mdi:priority-high
                icon_color: blue
              - type: custom:mushroom-select-card
                entity: select.dsc_hub_control_strategy
                name: Fan Control Strategy
                icon: mdi:strategy
              - type: custom:mushroom-entity-card
                entity: switch.dsc_hub_manual_takeover
                name: Master Manual Takeover
                icon: mdi:gesture-tap-button
                icon_color: purple
              - type: custom:mushroom-entity-card
                entity: switch.dsc_hub_tent_manual_override
                name: Manual Fan Override
                icon: mdi:hand-back-right
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: switch.dsc_hub_tent_full_auto_mode
                name: Resume Full Auto
                icon: mdi:robot
                icon_color: green
      - type: grid
        cards:
          - type: heading
            heading: 🌡️ ROOM CONTROL
            heading_style: title
          - type: heading
            heading: Source Air Environment
            heading_style: subtitle
            icon: mdi:home-thermometer
          - type: custom:mushroom-template-card
            entity: sensor.dsc_hub_room_temperature
            primary: >-
              {{ states('sensor.dsc_hub_room_temperature') | float(0) | round(1)
              }}°C
            secondary: >-
              RH: {{ states('sensor.dsc_hub_room_humidity') | float(0) |
              round(0) }}%
            icon: mdi:air-filter
            icon_color: cyan
            layout: horizontal
          - type: heading
            heading: Automatic Control Arming
            heading_style: subtitle
            icon: mdi:stairs-up
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_heater_auto
                primary: 750W Heater
                secondary: |-
                  {% if is_state('switch.dsc_hub_heater_auto','on') %}
                    {% if is_state('switch.dsc_hub_heater_demand','on') %}
                      Auto · CURRENTLY ON
                    {% else %}
                      Auto · Standby
                    {% endif %}
                  {% else %} Manual · Off {% endif %}
                icon: mdi:radiator
                icon_color: >-
                  {{ 'red' if is_state('switch.dsc_hub_heater_demand','on') else
                  ('grey' if is_state('switch.dsc_hub_heater_auto','off') else
                  'blue') }}
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('switch.dsc_hub_heater_demand', 'on') %}
                        animation: pulse-red 2.5s infinite;
                        background: rgba(244, 67, 54, 0.05);
                        border: 1px solid rgba(244, 67, 54, 0.3);
                      {% endif %}
                    }
                    @keyframes pulse-red {
                      0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.2); }
                      70% { box-shadow: 0 0 0 8px rgba(244, 67, 54, 0); }
                      100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
                    }
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_ac_auto
                primary: Portable AC
                secondary: |-
                  {% if is_state('switch.dsc_hub_ac_auto','on') %}
                    {% if is_state('switch.dsc_hub_ac_demand','on') %}
                      Auto · CURRENTLY ON
                    {% else %}
                      Auto · Standby
                    {% endif %}
                  {% else %} Manual · Off {% endif %}
                icon: mdi:snowflake
                icon_color: >-
                  {{ 'cyan' if is_state('switch.dsc_hub_ac_demand','on') else
                  ('grey' if is_state('switch.dsc_hub_ac_auto','off') else
                  'blue') }}
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('switch.dsc_hub_ac_demand', 'on') %}
                        animation: pulse-cyan 2.5s infinite;
                        background: rgba(0, 188, 212, 0.05);
                        border: 1px solid rgba(0, 188, 212, 0.3);
                      {% endif %}
                    }
                    @keyframes pulse-cyan {
                      0% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0.2); }
                      70% { box-shadow: 0 0 0 8px rgba(0, 188, 212, 0); }
                      100% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0); }
                    }
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_humidifier_auto
                primary: Room Humidifier
                secondary: |-
                  {% if is_state('switch.dsc_hub_humidifier_auto','on') %}
                    {% if is_state('switch.dsc_hub_humidifier_demand','on') %}
                      Auto · CURRENTLY ON
                    {% else %}
                      Auto · Standby
                    {% endif %}
                  {% else %} Manual · Off {% endif %}
                icon: mdi:water-plus
                icon_color: >-
                  {{ 'blue' if is_state('switch.dsc_hub_humidifier_demand','on')
                  else ('grey' if
                  is_state('switch.dsc_hub_humidifier_auto','off') else
                  'light-blue') }}
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('switch.dsc_hub_humidifier_demand', 'on') %}
                        animation: pulse-blue 2.5s infinite;
                        background: rgba(33, 150, 243, 0.05);
                        border: 1px solid rgba(33, 150, 243, 0.3);
                      {% endif %}
                    }
                    @keyframes pulse-blue {
                      0% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0.2); }
                      70% { box-shadow: 0 0 0 8px rgba(33, 150, 243, 0); }
                      100% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0); }
                    }
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_dehumidifier_auto
                primary: Room Dehumidifier
                secondary: |-
                  {% if is_state('switch.dsc_hub_dehumidifier_auto','on') %}
                    {% if is_state('switch.dsc_hub_dehumidifier_demand','on') %}
                      Auto · CURRENTLY ON
                    {% else %}
                      Auto · Standby
                    {% endif %}
                  {% else %} Manual · Off {% endif %}
                icon: mdi:water-minus
                icon_color: >-
                  {{ 'orange' if
                  is_state('switch.dsc_hub_dehumidifier_demand','on') else
                  ('grey' if is_state('switch.dsc_hub_dehumidifier_auto','off')
                  else 'blue') }}
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('switch.dsc_hub_dehumidifier_demand', 'on') %}
                        animation: pulse-orange 2.5s infinite;
                        background: rgba(255, 152, 0, 0.05);
                        border: 1px solid rgba(255, 152, 0, 0.3);
                      {% endif %}
                    }
                    @keyframes pulse-orange {
                      0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.2); }
                      70% { box-shadow: 0 0 0 8px rgba(255, 152, 0, 0); }
                      100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
                    }
          - type: custom:logbook-card
            title: 📖 Grow Log
            entity: input_boolean.dsc_event_log
            hours_to_show: 48
            custom_logs: true
            show:
              state: false
              icon: false
              duration: true
              start_date: true
              end_date: true
            duration:
              largest: 1
              labels:
                second: s
                minute: m
                hour: h
                day: d
                week: w
                month: M
      - type: grid
        cards:
          - type: heading
            heading: 💨 AIRFLOW ROUTING
            heading_style: title
          - type: heading
            heading: Fan Speeds & Limits
            heading_style: subtitle
            icon: mdi:fan
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_6_inch_exhaust_outside
                name: Exhaust (Out)
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_6_inch_exhaust_room
                name: Recirc (Room)
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_4_inch_intake_fan_main
                name: Intake (4x8)
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_4_inch_intake_fan_2x4
                name: Intake (2x4)
                show_percentage_control: true
                icon_animation: true
          - type: heading
            heading: System Info
            heading_style: title
            icon: mdi:chip
          - type: custom:expander-card
            title: ⚙️ Hub Diagnostics
            cards:
              - type: entities
                entities:
                  - entity: sensor.dsc_hub_firmware_version
                    name: Firmware Version
                    icon: mdi:tag
                  - entity: sensor.dsc_hub_wifi_rssi
                    name: WiFi RSSI
                    icon: mdi:wifi
                  - entity: button.dsc_hub_restart
                    name: Restart Hub
                    icon: mdi:restart
          - type: tile
            entity: lock.4x8_humidifier_photo_lab_lock
            state_content:
              - last_changed
              - state
            vertical: true
            features:
              - type: lock-commands
            features_position: inline
          - type: tile
            entity: light.nabu_casa_skyconnect_v1_0_grow_room_main_white
            name: Photo-Lab Lights
            hide_state: true
            vertical: false
            features:
              - type: light-brightness
              - type: light-color-temp
            features_position: bottom
      - type: grid
        cards:
          - type: markdown
            content: >
              {#- ================= GATHER STATE ================= -#}

              {%- set ct   = states('sensor.dsc_hub_clone_temperature') |
              float(0) -%}

              {%- set crh  = states('sensor.dsc_hub_clone_humidity') | float(0)
              -%}

              {%- set cvpd = states('sensor.dsc_hub_clone_vpd_kpa') | float(0)
              -%}

              {%- set ct_target = states('number.dsc_hub_clone_temp') |
              float(22) -%}

              {%- set cvmin = states('number.dsc_hub_clone_vpd_min') |
              float(0.4) -%}

              {%- set cvmax = states('number.dsc_hub_clone_vpd_max') |
              float(0.8) -%}

              {%- set crh_min = states('number.dsc_hub_clone_rh_min') |
              float(70) -%}


              {%- set tt   = states('sensor.dsc_hub_tent_temperature') |
              float(0) -%}

              {%- set trh  = states('sensor.dsc_hub_tent_humidity') | float(0)
              -%}

              {%- set tvpd = states('sensor.dsc_hub_vpd_kpa') | float(0) -%}

              {%- set tt_target = states('number.dsc_hub_target_temp') |
              float(25) -%}

              {%- set tvmin = states('number.dsc_hub_vpd_target_min') |
              float(0.8) -%}

              {%- set tvmax = states('number.dsc_hub_vpd_target_max') |
              float(1.2) -%}


              {%- set priority = states('select.dsc_hub_priority_tent') -%}

              {%- set strategy = states('select.dsc_hub_control_strategy') -%}


              {%- set mat_on   = is_state('switch.dsc_hub_grow_mat_demand','on')
              -%}

              {%- set heat_on  = is_state('switch.dsc_hub_heater_demand','on')
              -%}

              {%- set ac_on    = is_state('switch.dsc_hub_ac_demand','on') -%}

              {%- set hum_on   =
              is_state('switch.dsc_hub_humidifier_demand','on') -%}

              {%- set dehum_on =
              is_state('switch.dsc_hub_dehumidifier_demand','on') -%}

              {%- set chum_on  =
              is_state('switch.dsc_hub_clone_humidifier_demand','on') -%}


              {#- ---- optional trend sensors (see narrator-helpers.yaml) ----
              -#}

              {%- set ct_tr = states('sensor.dsc_clone_temp_trend') | float(0)
              if has_value('sensor.dsc_clone_temp_trend') else none -%}

              {%- set crh_tr = states('sensor.dsc_clone_rh_trend') | float(0) if
              has_value('sensor.dsc_clone_rh_trend') else none -%}

              {%- set cdir = 'steady' -%}

              {%- if ct_tr is not none -%}
                {%- set cdir = 'falling' if ct_tr <= -0.2 else ('rising' if ct_tr >= 0.2 else 'steady') -%}
              {%- endif -%}

              {%- set rhdir = '' -%}

              {%- if crh_tr is not none -%}
                {%- set rhdir = ' (falling)' if crh_tr <= -1 else (' (rising)' if crh_tr >= 1 else ' (steady)') -%}
              {%- endif -%}


              {#- ---- VPD sensitivity at current humidity (Tetens) ---- -#}

              {%- set svp  = 0.6108 * (e ** (17.27 * ct / (ct + 237.3))) -%}

              {%- set svp1 = 0.6108 * (e ** (17.27 * (ct - 1) / (ct - 1 +
              237.3))) -%}

              {%- set vpd_per_deg = (svp - svp1) * (1 - crh / 100) -%}

              {%- set degs_to_floor = (((cvpd - cvmin) / vpd_per_deg) |
              round(1)) if vpd_per_deg > 0 else 99 -%}

              {%- set degs_to_ceiling = (((cvmax - cvpd) / vpd_per_deg) |
              round(1)) if vpd_per_deg > 0 else 99 -%}


              {#- ---- pot moisture ---- -#}

              {%- set m1 = states('sensor.dsc_pot1_soil_moisture') | float(0)
              -%}

              {%- set m2 = states('sensor.dsc_pot2_soil_moisture') | float(0)
              -%}

              {%- set m3 = states('sensor.dsc_pot3_soil_moisture') | float(0)
              -%}

              {%- set m4 = states('sensor.dsc_pot4_soil_moisture') | float(0)
              -%}

              {%- set pmin = [m1, m2, m3, m4] | min -%}

              {%- set ndry = [m1, m2, m3, m4] | select('lt', 30) | list | length
              -%}

              {%- set driest = 'POT1' if pmin == m1 else ('POT2' if pmin == m2
              else ('POT3' if pmin == m3 else 'POT4')) -%}


              {#- ---- fans ---- -#}

              {%- set fx  =
              state_attr('fan.dsc_hub_6_inch_exhaust_outside','percentage') |
              int(0) -%}

              {%- set fr  =
              state_attr('fan.dsc_hub_6_inch_exhaust_room','percentage') |
              int(0) -%}

              {%- set fi1 =
              state_attr('fan.dsc_hub_4_inch_intake_fan_main','percentage') |
              int(0) -%}

              {%- set fi2 =
              state_attr('fan.dsc_hub_4_inch_intake_fan_2x4','percentage') |
              int(0) -%}


              ## 🧠 System Narrator

              *Serving: **{{ priority }}** · Strategy: **{{ strategy }}***


              ### 🌿 Clone tent

              Temperature is **{{ ct | round(1) }}°C** ({{ cdir }}) against a {{
              ct_target | round(1) }}°C target, RH **{{ crh | round(0) | int
              }}%**{{ rhdir }}, VPD **{{ cvpd | round(2) }} kPa** (band {{ cvmin
              }}–{{ cvmax }}).

              {%- if heat_on %}

              🔥 **Room heater demand is ACTIVE** — the hub is heating the
              shared room for the clones. Expect RH to fall and VPD to climb as
              warm air arrives.

              {%- elif ct < ct_target %}

              {%- if mat_on %} The grow mat is **ON**, carrying the heating load
              at the root zone,{% else %} The grow mat is off,{% endif %} but
              air temp is still **{{ (ct_target - ct) | round(1) }}°C under
              target**. The room heater stays on standby because VPD ({{ cvpd |
              round(2) }}) is inside its band.

              {%- if degs_to_floor < 99 %}

              {%- if degs_to_floor <= 1 %}

              ➡️ **Heater demand is imminent** — less than ~1°C more cooling (to
              ≈{{ (ct - degs_to_floor) | round(1) }}°C) puts VPD under its {{
              cvmin }} kPa floor.

              {%- elif degs_to_floor <= 3 %}

              ➡️ **If the clone tent cools another ~{{ degs_to_floor }}°C** (to
              ≈{{ (ct - degs_to_floor) | round(1) }}°C at today's humidity), VPD
              hits its {{ cvmin }} kPa floor — **heater demand will be
              required**.

              {%- else %}

              On VPD alone, heater demand is still **~{{ degs_to_floor }}°C of
              cooling away** (tent would need to reach ≈{{ (ct - degs_to_floor)
              | round(1) }}°C) — though the hub's own temperature deadband may
              trip it sooner.

              {%- endif %}

              {%- endif %}

              {%- else %}

              Air temp is at/above target — no heating pressure.

              {%- endif %}

              {%- if mat_on or heat_on %}

              💧 Watching humidity as heat is added: each +1°C lifts VPD by ≈{{
              vpd_per_deg | round(2) }} kPa here. RH floor is {{ crh_min |
              round(0) | int }}% (now {{ crh | round(0) | int }}%); clone
              humidifier is {{ '**ON**' if chum_on else 'on standby and will
              pick up if RH sags' }}.

              {%- endif %}

              {%- if degs_to_ceiling <= 2 %}

              ⚠️ Headroom warning: only ~{{ degs_to_ceiling }}°C of warming
              before VPD tops its {{ cvmax }} kPa ceiling — expect exhaust to
              ramp if heating continues.

              {%- endif %}


              ### ⬜ Main tent

              **{{ tt | round(1) }}°C** / **{{ trh | round(0) | int }}%** / VPD
              **{{ tvpd | round(2) }} kPa** (band {{ tvmin }}–{{ tvmax }}, temp
              target {{ tt_target | round(1) }}°C).

              {%- set active = [] %}

              {%- if heat_on %}{% set active = active + ['heater'] %}{% endif %}

              {%- if ac_on %}{% set active = active + ['AC'] %}{% endif %}

              {%- if hum_on %}{% set active = active + ['humidifier'] %}{% endif
              %}

              {%- if dehum_on %}{% set active = active + ['dehumidifier'] %}{%
              endif %}

              {%- if active | length > 0 %}

              Running now: **{{ active | join(', ') }}**.

              {%- elif tvmin <= tvpd <= tvmax %}

              All room appliances on standby — VPD is inside its band, nothing
              needs correcting.

              {%- else %}

              VPD is **{{ 'below' if tvpd < tvmin else 'above' }} its band** but
              no appliance has fired yet — the hub is likely waiting out its
              deadband, or the {{ priority }} priority is holding room
              appliances for the other tent.

              {%- endif %}


              ### 🌱 Root zone

              {%- if ndry == 0 %}

              All 4 pots above 30% moisture (driest: {{ driest }} at {{ pmin |
              round(1) }}%) — plants have water buffer while climate shifts; no
              watering pressure from the heat event.

              {%- else %}

              ⚠️ **{{ ndry }} pot(s) under 30% moisture** — {{ driest }} is
              driest at {{ pmin | round(1) }}%. Added heat will accelerate
              drying; consider watering before the heater runs.

              {%- endif %}

              {%- if is_state('binary_sensor.dsc_tank_ec_out_of_range','on') or
              is_state('binary_sensor.dsc_tank_ph_out_of_range','on') %}

              🚰 Tank needs attention before next feed:{{ ' EC out of range.' if
              is_state('binary_sensor.dsc_tank_ec_out_of_range','on') }}{{ ' pH
              out of range.' if
              is_state('binary_sensor.dsc_tank_ph_out_of_range','on') }}

              {%- endif %}


              ### 💨 Airflow

              Exhaust **{{ fx }}%** · recirc **{{ fr }}%** · intakes **{{ fi1
              }}% / {{ fi2 }}%** —

              {%- if fx < 30 %} fans are idling low to conserve heat and
              humidity. They'll ramp if VPD overshoots {{ cvmax }} kPa (clone)
              or {{ tvmax }} kPa (main), or if temps exceed limits.

              {%- elif fx < 70 %} moderate venting — the hub is trading some
              heat/humidity for fresh air exchange.

              {%- else %} venting hard — the hub is actively dumping
              heat/humidity; heating and exhaust are fighting, check strategy if
              this persists.

              {%- endif %}


              {%- set ns = namespace(alerts=[]) %}

              {%- for b in states.binary_sensor
                  if b.entity_id.startswith('binary_sensor.dsc_')
                  and b.state == 'on'
                  and b.attributes.get('device_class') not in ['connectivity','running'] %}
              {%- set ns.alerts = ns.alerts + [b.name] %}

              {%- endfor %}

              {%- if ns.alerts | length > 0 %}


              ### ⚠️ Watchlist ({{ ns.alerts | length }})

              {%- for a in ns.alerts %}

              - {{ a }}

              {%- endfor %}

              {%- endif %}
            text_only: true
            grid_options:
              columns: full
              rows: auto
        column_span: 2
  - title: 4x8 Main
    icon: mdi:tent
    path: 4x8-main
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: ⬜ 4x8 MAIN TENT
            heading_style: title
          - type: heading
            heading: Current Environment
            heading_style: subtitle
            icon: mdi:chart-bar
          - type: custom:stack-in-card
            cards:
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_tent_temperature
                    primary: "{{ states(entity) | float(0) | round(1) }}°C"
                    secondary: >-
                      Temperature ({{ states('select.dsc_hub_grow_stage') }}
                      Target: {{ states('number.dsc_hub_target_temp') | float(0)
                      | round(1) }}°C)
                    icon: mdi:thermometer
                    icon_color: >-
                      {% set t = states(entity) | float(0) %} {{ 'red' if t > 30
                      else ('blue' if t < 18 else 'green') }}
                    layout: vertical
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_tent_humidity
                    primary: "{{ states(entity) | float(0) | round(0) }}%"
                    secondary: >-
                      Humidity ({{ states('select.dsc_hub_grow_stage') }} Range:
                      {{ states('number.dsc_hub_rh_target_min') | float(0) |
                      round(0) }}-{{ states('number.dsc_hub_rh_target_max') |
                      float(0) | round(0) }}%)
                    icon: mdi:water-percent
                    icon_color: >-
                      {% set rh = states(entity) | float(0) %} {% set lo =
                      states('number.dsc_hub_rh_target_min') | float(40) %} {%
                      set hi = states('number.dsc_hub_rh_target_max') |

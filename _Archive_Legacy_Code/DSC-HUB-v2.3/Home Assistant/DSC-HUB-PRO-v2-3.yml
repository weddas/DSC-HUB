              {% if is_state('switch.dsc_hub_dehumidifier_auto','on') %}{% if
              is_state('switch.dsc_hub_dehumidifier_demand','on') %}Auto ·
              running now{% else %}Auto · standby{% endif %}{% else %}Manual ·
              off{% endif %}
            icon: mdi:air-humidifier-off
            icon_color: >-
              {% if is_state('switch.dsc_hub_dehumidifier_auto','on') %}{% if
              is_state('switch.dsc_hub_dehumidifier_demand','on') %}green{% else
              %}blue{% endif %}{% else %}grey{% endif %}
            entity: switch.dsc_hub_dehumidifier_auto
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: AC
            secondary: >-
              {% if is_state('switch.dsc_hub_ac_auto','on') %}{% if
              is_state('switch.dsc_hub_ac_demand','on') %}Auto · running now{%
              else %}Auto · standby{% endif %}{% else %}Manual · off{% endif %}
            icon: mdi:snowflake
            icon_color: >-
              {% if is_state('switch.dsc_hub_ac_auto','on') %}{% if
              is_state('switch.dsc_hub_ac_demand','on') %}green{% else %}blue{%
              endif %}{% else %}grey{% endif %}
            entity: switch.dsc_hub_ac_auto
            tap_action:
              action: toggle
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Clone 2×4
            heading_style: title
            icon: mdi:sprout-outline
          - type: custom:stack-in-card
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.dsc_hub_clone_temperature
                primary: "{{ states(entity) | round(1) }}°C"
                secondary: Clone Temp
                icon: mdi:thermometer
                icon_color: >-
                  {% set t = states(entity) | float(0) %} {{ 'green' if 20 <= t
                  <= 28 else 'amber' }}
              - type: custom:mushroom-template-card
                entity: sensor.dsc_hub_clone_humidity
                primary: "{{ states(entity) | round(0) }}%"
                secondary: Clone RH
                icon: mdi:water-percent
                icon_color: >-
                  {% set rh = states(entity) | float(0) %} {{ 'green' if rh >=
                  70 else 'amber' }}
              - type: custom:mushroom-template-card
                entity: sensor.dsc_hub_clone_vpd_kpa
                primary: "{{ states(entity) | round(2) }} kPa"
                secondary: VPD
                icon: mdi:waves-arrow-up
                icon_color: >-
                  {% set v = states(entity) | float(0) %} {% set lo =
                  states('number.dsc_hub_vpd_target_min') | float(0.8) %} {% set
                  hi = states('number.dsc_hub_vpd_target_max') | float(1.2) %}
                  {{ 'green' if lo <= v <= hi else 'red' }}
          - type: custom:apexcharts-card
            header:
              show: true
              title: Clone 12 h
              show_states: false
            graph_span: 12h
            apex_config:
              chart:
                height: 160
              legend:
                show: false
            series:
              - entity: sensor.dsc_hub_clone_temperature
                name: Temp
                stroke_width: 2
                color: "#ed7d31"
                yaxis_id: temp
              - entity: sensor.dsc_hub_clone_humidity
                name: RH
                stroke_width: 2
                color: "#5b9bd5"
                yaxis_id: rh
            yaxis:
              - id: temp
                decimals: 0
              - id: rh
                opposite: true
                min: 0
                max: 100
                decimals: 0
          - type: custom:mushroom-template-card
            entity: switch.dsc_hub_clone_led_demand
            primary: Clone Light
            secondary: >-
              {% set l = states('light.dsc_hub_sf1000_dimmer') %}{% set b =
              state_attr('light.dsc_hub_sf1000_dimmer','brightness')|int(0) %}{{
              'On · ' ~ (b/255*100)|round(0)|int ~ '%' if l == 'on' else 'Off'
              }}
            icon: mdi:led-strip-variant
            icon_color: >-
              {{ 'amber' if is_state('switch.dsc_hub_clone_led_demand','on')
              else 'grey' }}
          - type: custom:mushroom-template-card
            entity: switch.dsc_hub_clone_humidifier_demand
            primary: Clone Humidifier
            secondary: >-
              {% if is_state('switch.dsc_hub_clone_humidifier_demand','on')
              %}Running{% elif
              is_state('switch.dsc_hub_clone_humidifier_auto','on') %}Standby
              (auto){% else %}Off (manual){% endif %}
            icon: mdi:air-humidifier
            icon_color: >-
              {% if is_state('switch.dsc_hub_clone_humidifier_demand','on')
              %}blue{% else %}grey{% endif %}
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 4×8 Main Tent
            heading_style: title
            icon: mdi:tent
          - type: custom:stack-in-card
            cards:
              - type: horizontal-stack
                title: Room Enviroment
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_room_temperature
                    primary: "{{ states(entity) | round(1) }}°C"
                    secondary: Temperature
                    icon: mdi:thermometer
                    icon_color: >-
                      {% set t = states(entity) | float(0) %} {% if t > 30 %}
                      red {% elif t < 18 %} blue {% else %} green {% endif %}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_room_humidity
                    primary: "{{ states(entity) | round(0) }}%"
                    secondary: Humidity
                    icon: mdi:water-percent
                    icon_color: >-
                      {% set rh = states(entity) | float(0) %} {% set lo =
                      states('number.dsc_hub_rh_target_min') | float(40) %} {%
                      set hi = states('number.dsc_hub_rh_target_max') |
                      float(65) %} {{ 'green' if lo <= rh <= hi else 'amber' }}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_vpd_kpa
                    primary: "{{ states(entity) | round(2) }} kPa"
                    secondary: VPD
                    icon: mdi:waves-arrow-up
                    icon_color: >-
                      {% set v = states(entity) | float(0) %} {% set lo =
                      states('number.dsc_hub_vpd_target_min') | float(0.8) %} {%
                      set hi = states('number.dsc_hub_vpd_target_max') |
                      float(1.2) %} {{ 'green' if lo <= v <= hi else 'red' }}
                    tap_action:
                      action: more-info
          - type: custom:stack-in-card
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_tent_temperature
                    primary: "{{ states(entity) | round(1) }}°C"
                    secondary: Temperature
                    icon: mdi:thermometer
                    icon_color: >-
                      {% set t = states(entity) | float(0) %} {% if t > 30 %}
                      red {% elif t < 18 %} blue {% else %} green {% endif %}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_tent_humidity
                    primary: "{{ states(entity) | round(0) }}%"
                    secondary: Humidity
                    icon: mdi:water-percent
                    icon_color: >-
                      {% set rh = states(entity) | float(0) %} {% set lo =
                      states('number.dsc_hub_rh_target_min') | float(40) %} {%
                      set hi = states('number.dsc_hub_rh_target_max') |
                      float(65) %} {{ 'green' if lo <= rh <= hi else 'amber' }}
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-template-card
                    entity: sensor.dsc_hub_vpd_kpa
                    primary: "{{ states(entity) | round(2) }} kPa"
                    secondary: VPD
                    icon: mdi:waves-arrow-up
                    icon_color: >-
                      {% set v = states(entity) | float(0) %} {% set lo =
                      states('number.dsc_hub_vpd_target_min') | float(0.8) %} {%
                      set hi = states('number.dsc_hub_vpd_target_max') |
                      float(1.2) %} {{ 'green' if lo <= v <= hi else 'red' }}
                    tap_action:
                      action: more-info
          - type: custom:apexcharts-card
            header:
              show: true
              title: VPD vs Target Band
              show_states: true
              colorize_states: true
            graph_span: 12h
            update_interval: 60s
            apex_config:
              chart:
                height: 220
              grid:
                borderColor: rgba(128,128,128,.15)
              legend:
                show: false
            yaxis:
              - min: 0
                max: 2
                decimals: 1
            series:
              - entity: sensor.dsc_hub_vpd_kpa
                name: VPD
                stroke_width: 2
                color: "#70ad47"
                fill_raw: last
              - entity: number.dsc_hub_vpd_target_min
                name: Min
                curve: stepline
                stroke_width: 1
                color: "#5b9bd5"
                opacity: 0.5
                show:
                  in_header: false
              - entity: number.dsc_hub_vpd_target_max
                name: Max
                curve: stepline
                stroke_width: 1
                color: "#c00000"
                opacity: 0.5
                show:
                  in_header: false
          - type: custom:stack-in-card
            cards:
              - type: custom:mushroom-select-card
                entity: select.dsc_hub_grow_stage
                name: Grow Stage
                icon: mdi:sprout
              - type: custom:mushroom-select-card
                entity: select.dsc_hub_control_strategy
                name: Control Strategy
                icon: mdi:strategy
              - type: custom:mushroom-select-card
                entity: select.dsc_hub_priority_tent
                name: Priority Tent
                icon: mdi:priority-high
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: switch.dsc_hub_tent_full_auto_mode
                    name: Full Auto
                    icon: mdi:robot
                    icon_color: green
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-entity-card
                    entity: switch.dsc_hub_tent_manual_override
                    name: Manual (fans)
                    icon: mdi:hand-back-right
                    icon_color: amber
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-entity-card
                    entity: switch.dsc_hub_manual_takeover
                    name: Takeover
                    icon: mdi:gesture-tap-button
                    icon_color: purple
                    tap_action:
                      action: toggle
          - type: entities
            title: Targets
            show_header_toggle: false
            entities:
              - entity: number.dsc_hub_vpd_target_min
                name: VPD Min
              - entity: number.dsc_hub_vpd_target_max
                name: VPD Max
              - entity: number.dsc_hub_rh_target_min
                name: RH Min
              - entity: number.dsc_hub_rh_target_max
                name: RH Max
            card_mod:
              style: |
                ha-card { --ha-card-border-radius: 12px; }
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Airflow
            heading_style: title
            icon: mdi:fan
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_6_inch_exhaust_outside
                name: Exhaust → Outside
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_6_inch_exhaust_room
                name: Recirc → Room
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_4_inch_intake_fan_main
                name: Intake (Main)
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_4_inch_intake_fan_2x4
                name: Intake (2×4)
                show_percentage_control: true
                icon_animation: true
          - type: custom:apexcharts-card
            header:
              show: true
              title: Fan Duty 6 h
              show_states: true
              colorize_states: true
            graph_span: 6h
            apex_config:
              chart:
                height: 180
            yaxis:
              - min: 0
                max: 100
                decimals: 0
            series:
              - entity: fan.dsc_hub_6_inch_exhaust_outside
                attribute: percentage
                name: Exhaust
                curve: stepline
                stroke_width: 2
                color: "#c00000"
              - entity: fan.dsc_hub_6_inch_exhaust_room
                attribute: percentage
                name: Recirc
                curve: stepline
                stroke_width: 2
                color: "#5b9bd5"
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Escalation Ladder
            heading_style: title
            icon: mdi:stairs-up
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_humidifier_demand
                primary: Humidifier
                secondary: "{{ 'Running now' if is_state(entity,'on') else 'Standby' }}"
                icon: mdi:air-humidifier
                icon_color: "{{ 'blue' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state(config.entity,'on') %}
                      border: 1px solid rgba(255,255,255,.18);
                      box-shadow: 0 0 12px rgba(255,255,255,.25);
                      {% endif %}
                    }
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_dehumidifier_demand
                primary: Dehumidifier
                secondary: "{{ 'Running now' if is_state(entity,'on') else 'Standby' }}"
                icon: mdi:water-minus
                icon_color: "{{ 'orange' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state(config.entity,'on') %}
                      border: 1px solid rgba(255,255,255,.18);
                      box-shadow: 0 0 12px rgba(255,255,255,.25);
                      {% endif %}
                    }
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_grow_mat_demand
                primary: Grow Mat (2×4)
                secondary: "{{ 'Running now' if is_state(entity,'on') else 'Standby' }}"
                icon: mdi:heating-coil
                icon_color: "{{ 'deep-orange' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state(config.entity,'on') %}
                      border: 1px solid rgba(255,255,255,.18);
                      box-shadow: 0 0 12px rgba(255,255,255,.25);
                      {% endif %}
                    }
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_heater_demand
                primary: Heater 750 W
                secondary: "{{ 'Running now' if is_state(entity,'on') else 'Standby' }}"
                icon: mdi:radiator
                icon_color: "{{ 'red' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state(config.entity,'on') %}
                      border: 1px solid rgba(255,255,255,.18);
                      box-shadow: 0 0 12px rgba(255,255,255,.25);

                  icon: mdi:hand-back-right
                  icon_color: amber
                  content: MANUAL (FANS)
                  tap_action:
                    action: toggle
              - type: conditional
                conditions:
                  - entity: switch.dsc_hub_heater_demand
                    state: "on"
                chip:
                  type: template
                  icon: mdi:radiator
                  icon_color: red
                  content: HEAT
              - type: conditional

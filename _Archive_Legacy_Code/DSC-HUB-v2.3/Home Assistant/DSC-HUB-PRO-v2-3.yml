title: DSC-HUB
views:
  - title: Grow Room
    path: dsc-grow
    type: sections
    max_columns: 4
    header:
      card:
        type: markdown
        content: "# 🌿 DSC Grow Room"
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:sprout
                content: >
                  {% set ns = namespace(bad=0) %} {% for e in
                  states.binary_sensor
                       if e.entity_id.startswith('binary_sensor.dsc_')
                       and e.state == 'on' %}{% set ns.bad = ns.bad + 1 %}{% endfor %}
                  {{ 'All clear' if ns.bad == 0 else ns.bad ~ ' alert(s)' }}
                icon_color: >
                  {% set ns = namespace(bad=0) %} {% for e in
                  states.binary_sensor
                       if e.entity_id.startswith('binary_sensor.dsc_')
                       and e.state == 'on' %}{% set ns.bad = ns.bad + 1 %}{% endfor %}
                  {{ 'green' if ns.bad == 0 else 'red' }}
              - type: template
                icon: mdi:water
                content: Tank {{ states('sensor.dsc_tank_ec_normalized') }} µS/cm
                icon_color: >
                  {{ 'red' if
                  is_state('binary_sensor.dsc_tank_ec_out_of_range','on') else
                  'blue' }}
              - type: template
                icon: mdi:ph
                content: pH {{ states('sensor.water_tester_ph_current') }}
              - type: template
                icon: mdi:thermometer-water
                content: "{{ states('sensor.water_tester_temperature') }}°C"
                icon_color: >
                  {{ 'red' if
                  is_state('binary_sensor.dsc_tank_water_too_warm','on') else
                  'blue' }}
              - type: template
                icon: mdi:calendar-clock
                content: "{{ states('input_select.dsc_tank_stage') }}"
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: ⚠️ Needs attention
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.dsc_*
                  state: "on"
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('text.4x8_dsc_pot_1_plant_name') }}"
            secondary: >-
              POT1 · {{ states('select.4x8_dsc_pot_1_growth_stage') }} · {{
              states('select.4x8_dsc_pot_1_plant_type') }}
            icon: mdi:sprout
            icon_color: >
              {% set ns = namespace(bad=false) %}{% if
              is_state('binary_sensor.dsc_pot1_moisture_out_of_range','on') %}{%
              set ns.bad = true %}{% endif %}{% if
              is_state('binary_sensor.dsc_pot1_ph_out_of_range','on') %}{% set
              ns.bad = true %}{% endif %}{% if
              is_state('binary_sensor.dsc_pot1_root_zone_temp_out_of_range','on')
              %}{% set ns.bad = true %}{% endif %}{% if
              is_state('binary_sensor.dsc_pot1_ec_salt_build_up','on') %}{% set
              ns.bad = true %}{% endif %}{% if
              is_state('binary_sensor.dsc_pot1_ec_depleted_vs_baseline','on')
              %}{% set ns.bad = true %}{% endif %}{% if
              is_state('binary_sensor.dsc_pot1_nitrogen_below_baseline','on')
              %}{% set ns.bad = true %}{% endif %}{% if
              is_state('binary_sensor.dsc_pot1_nitrogen_depleting_fast','on')
              %}{% set ns.bad = true %}{% endif %}{{ 'red' if ns.bad else
              'green' }}
            multiline_secondary: true
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:water-percent
                content: "{{ states('sensor.dsc_pot1_soil_moisture') }}%"
                icon_color: teal
              - type: template
                icon: mdi:thermometer
                content: "{{ states('sensor.dsc_pot1_soil_temperature') }}°"
                icon_color: orange
              - type: template
                icon: mdi:ph
                content: "{{ states('sensor.dsc_pot1_soil_ph') }}"
                icon_color: purple
              - type: template
                icon: mdi:flash
                content: "{{ states('sensor.dsc_pot1_soil_conductivity') }}"
                icon_color: amber
              - type: template
                icon: mdi:leaf
                content: N {{ states('sensor.dsc_pot1_soil_nitrogen') }}
                icon_color: green
          - type: custom:bar-card
            entities:
              - entity: sensor.dsc_pot1_soil_moisture
                name: Moisture
            min: 0
            max: 100
            height: 28px
            positions:
              value: inside
              name: outside
              icon: "off"
            severity:
              - color: "#e74c3c"
                from: 0
                to: 29
              - color: "#f39c12"
                from: 30
                to: 39
              - color: "#2ecc71"
                from: 40
                to: 70
              - color: "#f39c12"
                from: 71
                to: 84
              - color: "#e74c3c"
                from: 85
                to: 100
          - type: custom:bar-card
            entities:
              - entity: sensor.dsc_pot1_soil_ph
                name: pH
            min: 5
            max: 8
            height: 28px
            positions:
              value: inside
              name: outside
              icon: "off"
            severity:
              - color: "#e74c3c"
                from: 5
                to: 5.7
              - color: "#f39c12"
                from: 5.8
                to: 6.1
              - color: "#2ecc71"
                from: 6.2
                to: 6.8
              - color: "#f39c12"
                from: 6.9
                to: 7
              - color: "#e74c3c"
                from: 7.1
                to: 8
          - type: custom:bar-card
            entities:
              - entity: sensor.dsc_pot1_soil_conductivity
                name: EC
            min: 0
            max: 3000
            height: 28px
            positions:
              value: inside
              name: outside
              icon: "off"
            severity:
              - color: "#2ecc71"
                from: 0
                to: 1999
              - color: "#e74c3c"
                from: 2000
                to: 3000
          - type: custom:mushroom-entity-card
            entity: select.4x8_dsc_pot_1_growth_stage
            name: Stage
            icon: mdi:calendar-clock
            secondary_info: none
          - type: custom:mushroom-entity-card
            entity: text.4x8_dsc_pot_1_plant_name
            name: Plant
            icon: mdi:tag-text
          - type: custom:apexcharts-card
            header:
              show: true
              title: Nitrogen vs 7-day baseline
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              end: minute
            yaxis:
              - id: "n"
                decimals: 0
                min: 0
            series:
              - entity: sensor.dsc_pot1_soil_nitrogen
                name: "N"
                type: line
                stroke_width: 2
                color: "#2ecc71"
                yaxis_id: "n"
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot1_soil_nitrogen_7d_baseline
                name: 7d base
                type: line
                stroke_width: 1
                opacity: 0.5
                color: "#8895a0"
                yaxis_id: "n"
                group_by:
                  func: avg
                  duration: 1h
          - type: custom:apexcharts-card
            header:
              show: true
              title: EC & moisture
              show_states: true
              colorize_states: true
            graph_span: 24h
            yaxis:
              - id: ec
                min: 0
                decimals: 0
              - id: moist
                opposite: true
                min: 0
                max: 100
                decimals: 0
            series:
              - entity: sensor.dsc_pot1_soil_conductivity
                name: EC
                type: line
                stroke_width: 2
                color: "#f5a623"
                yaxis_id: ec
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot1_soil_moisture
                name: Moisture
                type: area
                stroke_width: 1
                opacity: 0.1
                color: "#3fa9f5"
                yaxis_id: moist
                group_by:
                  func: avg
                  duration: 15min
          - type: entities
            title: Today's extremes
            show_header_toggle: false
            entities:
              - entity: sensor.dsc_pot1_soil_nitrogen_daily_max
                name: N peak
              - entity: sensor.dsc_pot1_soil_nitrogen_daily_max_time
                name: — at
              - entity: sensor.dsc_pot1_soil_nitrogen_daily_min
                name: N low
              - entity: sensor.dsc_pot1_soil_nitrogen_daily_min_time
                name: — at
              - entity: sensor.dsc_pot1_soil_nitrogen_rate
                name: N rate (mg/kg/h)

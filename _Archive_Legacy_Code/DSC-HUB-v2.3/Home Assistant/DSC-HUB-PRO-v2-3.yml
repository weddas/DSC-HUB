      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: sensor.dsc_hub_tent_temperature
                icon: |-
                  {{ 'mdi:chip' if not is_state(entity,'unavailable')
                     else 'mdi:alert-circle' }}
                icon_color: "{{ 'green' if not is_state(entity,'unavailable') else 'red' }}"
                content: |-
                  {{ 'HUB ONLINE' if not is_state(entity,'unavailable')
                     else 'HUB OFFLINE' }}
              - type: entity
                entity: select.dsc_hub_grow_stage
                icon: mdi:sprout
                icon_color: light-green
              - type: entity
                entity: select.dsc_hub_control_strategy
                icon: mdi:strategy
                icon_color: blue
              - type: template
                entity: switch.dsc_hub_tent_full_auto_mode
                icon: mdi:robot
                icon_color: "{{ 'green' if is_state(entity,'on') else 'disabled' }}"
                content: "{{ 'FULL AUTO' if is_state(entity,'on') else 'Auto off' }}"
                tap_action:
                  action: toggle
              - type: conditional
                conditions:
                  - entity: switch.dsc_hub_manual_takeover
                    state: "on"
                chip:
                  type: template
                  entity: switch.dsc_hub_manual_takeover
                  icon: mdi:gesture-tap-button
                  icon_color: purple
                  content: TAKEOVER
                  tap_action:
                    action: toggle
              - type: conditional

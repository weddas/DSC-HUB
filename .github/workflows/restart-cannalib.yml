# Bounce the bind-mounted CannaLib stdlib API so it picks up
# CannaLib/services/cannalib/standalone_server.py. Restart only, not Recreate.
name: Restart cannalib

on:
  workflow_dispatch:

concurrency:
  group: restart-cannalib
  cancel-in-progress: false

jobs:
  restart:
    name: Restart cannalib container
    runs-on: [self-hosted, unraid-ha-deploy]
    steps:
      - name: Restart cannalib
        run: |
          set -euo pipefail
          if sudo -n docker info >/dev/null 2>&1; then
            restart_cmd="sudo -n docker"
          elif docker info >/dev/null 2>&1; then
            restart_cmd="docker"
          elif command -v nsenter >/dev/null 2>&1 && nsenter -t 1 -m docker info >/dev/null 2>&1; then
            restart_cmd="nsenter -t 1 -m docker"
          else
            echo "No docker access from this runner (need sock mount, sudo, or host nsenter)." >&2
            exit 1
          fi
          $restart_cmd restart cannalib
          i=0
          while [ "$i" -lt 20 ]; do
            if curl -fsS --max-time 3 http://127.0.0.1:8790/health >/tmp/cl-health.json \
              || curl -fsS --max-time 3 http://192.168.86.2:8790/health >/tmp/cl-health.json; then
              cat /tmp/cl-health.json
              echo
              exit 0
            fi
            i=$((i + 1))
            sleep 1
          done
          echo "cannalib health did not return" >&2
          exit 1

# ==================================================================
#  DSC-HUB  ·  Lovelace product shell (N-086 / surface 5.1.12)
#  ------------------------------------------------------------------
#  Four primary sections (WEBUI wireframe): Ops · Plant · Advanced · System
#  Former Pro pages are subviews. Build a Plant lives under Plant.
#  The Dash is an Ops subview (cinema), not the product home.
#
#  Default landing: Ops (/dsc-hub-pro/ops)
#
#  REQUIRES packages: homeassistant/packages/dsc_v4_*.yaml
#  HACS: mushroom · apexcharts · plotly-graph · mini-graph-card
#        gauge-card-pro · modern-circular-gauge · logbook-card
#        auto-entities · vertical-stack-in-card · card-mod · bar-card
#        ph-meter-temperature · expander-card · browser_mod
#        + DSC-HUB Dashboard repo (system map + airflow + Dash + Build + Catalog)
# ==================================================================

title: DSC-HUB
views:
  # ---- Primary product sections (tab strip) ----
  - !include modules/view_ops.yaml
  - !include modules/view_plant.yaml
  - !include modules/view_advanced.yaml
  - !include modules/view_system.yaml
  # ---- Ops subviews ----
  - !include modules/view_home.yaml
  - !include modules/view_dash.yaml
  - !include modules/view_climate.yaml
  - !include modules/view_main_4x8.yaml
  - !include modules/view_clone_2x4.yaml
  - !include modules/view_root_zone.yaml
  - !include modules/view_tank.yaml
  - !include modules/view_lighting.yaml
  # ---- Plant subviews ----
  - !include modules/view_plant_build.yaml
  - !include modules/view_catalog.yaml
  - !include modules/view_strains.yaml
  - !include modules/view_nutrient_science.yaml
  # ---- Advanced subviews ----
  - !include modules/view_learning.yaml
  - !include modules/view_trends.yaml
  - !include modules/view_history.yaml

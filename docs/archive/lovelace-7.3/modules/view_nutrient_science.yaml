title: Nutrient Science
icon: mdi:flask
path: nutrient-science
subview: true
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Mix planner
        heading_style: title
      - type: entities
        entities:
          - entity: input_number.dsc_mix_tank_liters
            name: Tank volume
          - entity: input_number.dsc_mix_strength_pct
            name: Strength
          - entity: input_select.dsc_mix_target_pot
            name: Target pot
      - type: markdown
        content: >-
          **Next mix:** {{ states('sensor.dsc_next_mix_recipe') }}

          **Purchase list:** {{ states('sensor.dsc_mix_purchase_list') }}
      - type: entities
        entities:
          - entity: sensor.dsc_mix_calculator
            name: Build a Plant mix calculator
      - type: markdown
        content: >-
          {% if state_attr('sensor.dsc_mix_calculator', 'short_stock_any') %}
          **Short stock:** one or more in-inventory mix lines cannot cover the
          required ml. Accept will skip those lines and report them.
          {% else %}
          Stock covers all enabled inventory lines in the current calculator.
          {% endif %}
      - type: custom:mushroom-template-card
        primary: Open Build a Plant
        secondary: Compose strain, medium, recipe, light and roster assignment
        icon: mdi:sprout
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: /dsc-hub-pro/plant-build
      - type: custom:mushroom-template-card
        primary: Catalog Explorer
        secondary: Browse / compare nutrients and strains
        icon: mdi:bookshelf
        icon_color: teal
        tap_action:
          action: navigate
          navigation_path: /dsc-hub-pro/catalog
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Seedling A+B
            secondary: 2.0 ml/L
            icon: mdi:seed
            tap_action:
              action: call-service
              service: script.dsc_mix_apply_recipe_pack
              data:
                stage: seedling
          - type: custom:mushroom-template-card
            primary: Veg A+B
            secondary: 3.0 ml/L
            icon: mdi:leaf
            tap_action:
              action: call-service
              service: script.dsc_mix_apply_recipe_pack
              data:
                stage: veg
          - type: custom:mushroom-template-card
            primary: Flower A+B
            secondary: 4.0 ml/L
            icon: mdi:flower
            tap_action:
              action: call-service
              service: script.dsc_mix_apply_recipe_pack
              data:
                stage: flower
      - type: custom:mushroom-template-card
        primary: Stock summary
        secondary: "{{ states('sensor.dsc_nutrient_stock_summary') }}"
        icon: mdi:warehouse
        icon_color: green
        multiline_secondary: true
      - type: custom:mushroom-template-card
        primary: Accept mix (QA)
        secondary: Burn recipe ml from in-stock nutrients — manual gate
        icon: mdi:check-decagram
        icon_color: cyan
        multiline_secondary: true
        tap_action:
          action: call-service
          service: script.dsc_accept_mix
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Nutrients 1–4 (primary)
        heading_style: title
      - type: custom:expander-card
        title: Nutrient 1
        expanded: true
        card_mod:
          style: |
            ha-card {
              border-left: 3px solid rgba(56,189,248,0.4);
              border-radius: 10px;
            }
            ha-card .title {
              font-weight: 600;
              letter-spacing: 0.3px;
            }
        cards:
          - type: entities
            entities:
              - entity: input_text.dsc_nutrient_1_name
                name: Name
              - entity: input_boolean.dsc_nutrient_1_in_inventory
                name: In inventory
              - entity: input_number.dsc_nutrient_1_stock_ml
                name: Stock
              - entity: input_number.dsc_nutrient_1_dose_ml_l

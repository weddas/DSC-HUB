                            color: '#f97316'
          - type: custom:modern-circular-gauge
            entity: sensor.dsc_pot4_soil_moisture
            name: POT4
            min: 0
            max: 100
            tap_action: 
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: POT4 — plant console
                  size: wide
                  content:
                    type: vertical-stack
                    cards:
                      - type: entities
                        entities:
                          - entity: text.dsc_pot4_plant_name
                            name: Plant
                            icon: mdi:sprout
                          - entity: select.dsc_pot4_growth_stage
                            name: Growth stage
                          - entity: select.dsc_pot4_strain
                            name: Strain (pot contract)
                          - entity: select.dsc_pot_4_strain
                            name: Strain (pot underscore fallback)
                          - entity: input_select.dsc_pot4_strain
                            name: Strain (HA)
                          - entity: date.dsc_pot_4_sprout_date
                            name: Sprout (pot)
                          - entity: input_datetime.dsc_pot4_sprout_date
                            name: Sprout (HA)
                          - entity: sensor.dsc_pot4_need_summary
                            name: Need
                          - entity: binary_sensor.dsc_hub_pot4_esp_now_link
                            name: ESP-NOW link
                          - entity: switch.dsc_hub_mat_vote_pot_4
                            name: Mat vote
                          - type: divider
                          - entity: sensor.dsc_pot4_soil_moisture
                            name: Moisture
                          - entity: sensor.dsc_pot4_soil_temperature
                            name: Soil temp
                          - entity: sensor.dsc_pot4_soil_conductivity
                            name: EC
                          - entity: sensor.dsc_pot4_soil_ph
                            name: pH
                          - entity: sensor.dsc_pot4_soil_nitrogen
                            name: N
                          - entity: sensor.dsc_pot4_soil_phosphorus
                            name: P
                          - entity: sensor.dsc_pot4_soil_potassium
                            name: K
                      - type: custom:apexcharts-card
                        graph_span: 48h
                        header:
                          show: true
                          title: Moisture & soil temp — 48h
                          show_states: true
                        apex_config:
                          chart:
                            height: 260
                        yaxis:
                          - id: pct
                            min: 0
                            max: 100
                          - id: temp
                            opposite: true
                        series:
                          - entity: sensor.dsc_pot4_soil_moisture
                            name: Moisture %
                            yaxis_id: pct
                            stroke_width: 2
                            extend_to: now
                            color: '#3b82f6'
                          - entity: sensor.dsc_pot4_soil_temperature
                            name: Soil °C
                            yaxis_id: temp
                            stroke_width: 2
                            extend_to: now
                            color: '#f97316'
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: conditional
            conditions:
              - entity: sensor.water_tester_ph_current
                state_not: unavailable
            chip:
              type: template
              entity: sensor.water_tester_ph_current
              icon: mdi:ph
              icon_color: >-
                {% set ph = states(entity)|float(0) %} {{ 'green' if 5.8 <= ph
                <= 6.5 else 'red' }}
              content: pH {{ states(entity) }}
              tap_action:
                action: navigate
                navigation_path: /dsc-hub-pro/tank
          - type: template
            entity: sensor.dsc_tank_ec_normalized
            icon: mdi:flash
            icon_color: >-
              {% set ec = states(entity)|float(0) %} {% set lo =
              states('sensor.dsc_tank_ec_target_min')|float(0) %} {% set hi
              = states('sensor.dsc_tank_ec_target_max')|float(99) %} {{
              'green' if lo <= ec <= hi else 'red' }}
            content: EC {{ states(entity) }}
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/tank
          - type: conditional
            conditions:
              - entity: sensor.water_tester_temperature
                state_not: unavailable
            chip:
              type: template
              entity: sensor.water_tester_temperature
              icon: mdi:thermometer-water
              icon_color: "{{ 'red' if states(entity)|float(0) > 24 else 'green' }}"
              content: >-
                {{ states(entity) }}°C{{ ' ⚠ PYTHIUM' if
                states(entity)|float(0) > 24 else '' }}
              tap_action:
                action: navigate
                navigation_path: /dsc-hub-pro/tank
          - type: template
            icon: mdi:grass
            icon_color: lime
            content: Open Root Zone
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/root-zone


      - type: custom:mushroom-chips-card
        alignment: justify
        chips:
          # Virtual 4x8 window hours (no lamp) — clock icon on purpose.
          - type: template
            entity: sensor.dsc_lights_on_today_4x8
            icon: mdi:sun-clock
            icon_color: >-
              {{ 'blue' if is_state('binary_sensor.dsc_hub_4x8_window_open','on')
              else 'disabled' }}
            content: >-
              4×8 {{ states(entity)|float(0)|round(1) }}h / {{
              states('sensor.dsc_expected_light_hours')|float(0)|round(0)
              }}h
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/lighting
          - type: template
            entity: sensor.dsc_lights_on_today_2x4
            icon: mdi:white-balance-sunny
            icon_color: >-
              {{ 'red' if
              is_state('binary_sensor.dsc_clone_dark_period_violation','on')
              else 'amber' }}
            content: >-
              2×4 {{ states(entity)|float(0)|round(1) }}h / {{
              states('sensor.dsc_clone_expected_light_hours')|float(0)|round(0)
              }}h
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/lighting
          - type: template
            entity: sensor.dsc_heater_runtime_today
            icon: mdi:radiator
            icon_color: "{{ 'deep-orange' if states(entity)|float(0) > 0 else 'disabled' }}"
            content: Heat {{ states(entity)|float(0)|round(1) }}h
          - type: template
            entity: sensor.dsc_humidifier_cycles_last_hour
            icon: mdi:sync-alert
            icon_color: |-
              {{ 'red' if states(entity)|float(0) > 6 else
                 ('amber' if states(entity)|float(0) > 3 else 'green') }}
            content: Hum {{ states(entity)|float(0)|round(0) }}/h
        card_mod:
          style: |
            @keyframes dsc-sun-breathe {
              0%, 100% { opacity: 1; transform: scale(1); }
              50% { opacity: 0.65; transform: scale(1.08); }
            }
            mushroom-template-chip:nth-child(2) mushroom-shape-icon {
              {% if is_state('light.dsc_hub_sf1000_dimmer','on')
                 and not is_state('binary_sensor.dsc_clone_dark_period_violation','on') %}
              animation: dsc-sun-breathe 2.8s ease-in-out infinite;
              {% endif %}
            }

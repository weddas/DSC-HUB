# ==================================================================
#  DSC-BRIDGE · package body (WT32-ETH01 v1.4)
#  F-010 appliance drive · F-012 SoftAP channel anchor · F-013 HA mirror
#  ------------------------------------------------------------------
#  Stubs pass secrets + hub_mac / espnow_cmd_tag / Sonoff hosts+keys.
#  Remote-git safe: no !secret in this file.
# ==================================================================

substitutions:
  name: dsc-bridge
  friendly_name: DSC-BRIDGE
  anchor_channel: "11"
  anchor_ssid: "DSC-Anchor"
  anchor_ap_password: "CHANGEME"
  espnow_cmd_tag: "54727"
  hub_mac: "00:00:00:00:00:00"
  # SoftAP static map overridden by stubs — studio LAN Sonoffs
  dsc_heater_host: "10.42.0.50"
  dsc_heatmat_host: "10.42.0.51"
  dsc_humidifier_host: "10.42.0.54"
  dsc_dehumidifier_host: "10.42.0.55"
  dsc_heater_api_key: "CHANGEME"
  dsc_heatmat_api_key: "CHANGEME"
  dsc_humidifier_api_key: "CHANGEME"
  dsc_dehumidifier_api_key: "CHANGEME"
  demand_stale_ms: "45000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: digital_emotions.dsc-bridge
    version: "7.0.0.0"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: ${api_key_val}
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password_val}

# Ethernet for Pi-subnet Sonoff TCP (F-010). SoftAP / ESP-NOW 0xD8 parked on Pi path.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16
  manual_ip:
    static_ip: 10.42.0.5
    gateway: 10.42.0.1
    subnet: 255.255.255.0
    dns1: 10.42.0.1

# SoftAP (dsc_anchor_ap) + espnow 0xD8 path PARKED on Pi — dsc_api_client drives Sonoffs.

globals:
  - id: dem_mask
    type: uint8_t
    restore_value: false
    initial_value: '0'

dsc_api_client:
  - id: heater_client
    name: "Heater API Link"
    host: ${dsc_heater_host}
    encryption_key: ${dsc_heater_api_key}
    switch_object_id: main_relay
  - id: heatmat_client
    name: "Heatmat API Link"
    host: ${dsc_heatmat_host}
    encryption_key: ${dsc_heatmat_api_key}
    switch_object_id: main_relay
  - id: humidifier_client
    name: "Humidifier API Link"
    host: ${dsc_humidifier_host}
    encryption_key: ${dsc_humidifier_api_key}
    switch_object_id: main_relay
  - id: dehumidifier_client
    name: "Dehumidifier API Link"
    host: ${dsc_dehumidifier_host}
    encryption_key: ${dsc_dehumidifier_api_key}
    switch_object_id: main_relay

binary_sensor:
  - platform: template
    name: "Hub ESP-NOW Link"
    id: hub_link
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    name: "Anchor SoftAP Up"
    id: anchor_up
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    name: "Demand Humidifier"
    id: demand_hum
    entity_category: diagnostic
  - platform: template
    name: "Demand Dehumidifier"
    id: demand_dehum
    entity_category: diagnostic
  - platform: template
    name: "Demand Heater"
    id: demand_heat
    entity_category: diagnostic
  - platform: template
    name: "Demand Grow Mat"
    id: demand_mat
    entity_category: diagnostic
  - platform: template
    name: "Demand AC"
    id: demand_ac
    entity_category: diagnostic
  - platform: template
    name: "Demand Clone Hum"
    id: demand_clone
    entity_category: diagnostic
  - platform: template
    name: "Mirror Sensor Fault"
    id: mir_sensor_fault
    entity_category: diagnostic
  - platform: template
    name: "Mirror Full Auto"
    id: mir_full_auto
    entity_category: diagnostic

sensor:
  - platform: template
    name: "ESP-NOW Age"
    id: espnow_age
    unit_of_measurement: ms
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Anchor Channel"
    id: anchor_channel_sensor
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Mirror Main Temp"
    id: mir_main_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Clone Temp"
    id: mir_clone_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Room Temp"
    id: mir_room_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Main RH"
    id: mir_main_rh
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: humidity
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Clone RH"
    id: mir_clone_rh
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: humidity
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Room RH"
    id: mir_room_rh
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: humidity
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Main VPD"
    id: mir_main_vpd
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Mirror Clone VPD"
    id: mir_clone_vpd
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "Anchor BSSID"
    id: anchor_bssid_ts
    entity_category: diagnostic
    update_interval: never
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

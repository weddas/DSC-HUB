# ==================================================================
#  DSC-BRIDGE — lab stub (WT32-ETH01 v1.4)
#  Ethernet-only after SoftAP cutover. SoftAP / ESP-NOW parked.
#  esphome run dsc-bridge.yaml
# ==================================================================

substitutions:
  name: dsc-bridge
  friendly_name: DSC-BRIDGE
  api_key_val: !secret dsc_bridge_api_key
  ota_password_val: !secret dsc_bridge_ota_password
  ap_password_val: !secret dsc_bridge_ap_password
  # SoftAP disabled in common via enable_anchor: false — passwords kept for kit.
  anchor_ap_password: !secret dsc_anchor_ap_password
  anchor_ssid: "DSC-Anchor"
  anchor_channel: "11"
  enable_anchor: "false"
  espnow_cmd_tag: "54727"
  hub_mac: "84:1F:E8:16:E6:60"
  # Pi AP — Sonoff native API targets (F-010)
  dsc_heater_host: "10.42.0.50"
  dsc_heatmat_host: "10.42.0.51"
  dsc_humidifier_host: "10.42.0.54"
  dsc_dehumidifier_host: "10.42.0.55"
  dsc_heater_api_key: !secret dsc_heater_api_key
  dsc_heatmat_api_key: !secret dsc_heatmat_api_key
  dsc_humidifier_api_key: !secret dsc_humidifier_api_key
  dsc_dehumidifier_api_key: !secret dsc_dehumidifier_api_key

external_components:
  - source:
      type: local
      path: components
    components: [dsc_api_client]

packages:
  bridge: !include dsc-bridge-common.yaml

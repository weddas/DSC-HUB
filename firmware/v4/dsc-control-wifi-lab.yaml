# ==================================================================
#  DSC-CONTROL · lab WiFi (Digital-Emotions Studio · HA bus cutover)
#
#  Studio 2.4 GHz STA. Panel talks to hub via HA Native API (ESP-NOW
#  parked). SoftAP Anchor membership removed.
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 20
      manual_ip:
        static_ip: ${lan_ip}
        gateway: 192.168.86.1
        subnet: 255.255.255.0
        dns1: 192.168.86.1
  use_address: ${lan_ip}
  power_save_mode: none
  fast_connect: false
  post_connect_roaming: false
  ap:
    ssid: "DSC-CONTROL Fallback"
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        id(wifi_conn) = true;
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (id(wifi_channel) != 0 && id(wifi_channel) != ch) {
              id(wifi_channel_hopped) = true;
              ESP_LOGW("wifi", "channel hop %d -> %d", id(wifi_channel), ch);
            } else {
              ESP_LOGI("wifi", "STA channel %d (studio LAN)", ch);
            }
            id(wifi_channel) = ch;
          }
        }
    - delay: 500ms
    - lambda: |-
        const char *ip = id(wifi_ip_ts).state.empty() ? "(pending)" : id(wifi_ip_ts).state.c_str();
        ESP_LOGI("wifi", "STA IP %s — HA API :6053", ip);
  on_disconnect:
    - lambda: 'id(wifi_conn) = false;'

captive_portal:

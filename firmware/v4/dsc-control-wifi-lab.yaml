# ==================================================================
#  DSC-CONTROL · lab WiFi (Nest-first until SoftAP IP gate passes)
#
#  SoftAP-home membership is paused: SoftAP eth↔.4.x was not proven
#  before SoftAP-primary orphaned STAs. Nest primary; SoftAP secondary
#  (no zero-BSSID pins). Re-elevate SoftAP only after FOLLOWUPS gate.
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 20
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      priority: 10
      manual_ip:
        static_ip: 192.168.4.11
        gateway: 192.168.4.1
        subnet: 255.255.255.0
        dns1: 192.168.4.1
  power_save_mode: none
  # Match hub: false so bounce can scan onto hub's *learned* preferred AP.
  fast_connect: false
  # Match hub: off-channel roam scans break ESP-NOW (shared radio).
  post_connect_roaming: false
  ap:
    ssid: "DSC-CONTROL Fallback"
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        id(wifi_conn) = true;
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (id(wifi_channel) != 0 && id(wifi_channel) != ch) {
              id(wifi_channel_hopped) = true;
              ESP_LOGW("wifi", "channel hop %d -> %d (ESP-NOW needs hub on same ch)", id(wifi_channel), ch);
            } else {
              ESP_LOGI("wifi", "STA channel %d", ch);
            }
            id(wifi_channel) = ch;
          }
        }
    - delay: 500ms
    - lambda: |-
        const char *ip = id(wifi_ip_ts).state.empty() ? "(pending)" : id(wifi_ip_ts).state.c_str();
        ESP_LOGI("wifi", "STA IP %s — HA API :6053", ip);
  on_disconnect:
    - lambda: 'id(wifi_conn) = false;'

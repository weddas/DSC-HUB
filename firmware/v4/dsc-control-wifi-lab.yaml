# ==================================================================
#  DSC-CONTROL · lab WiFi (SoftAP-local membership)
#
#  SoftAP-local only — STA joins DSC-Anchor (BSSID pin + SoftAP
#  manual_ip). Never Nest/home Wi‑Fi. SoftAP-only STA retries SoftAP
#  then Fallback AP. SoftAP BSSID pin on SoftAP entry only. Static
#  SoftAP IP 192.168.4.11.
# ==================================================================
wifi:
  networks:
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      bssid: ${wifi_bssid}
      priority: 20
      manual_ip:
        static_ip: 192.168.4.11
        gateway: 192.168.4.1
        subnet: 255.255.255.0
        dns1: 192.168.4.1
  use_address: 192.168.4.11
  power_save_mode: none
  fast_connect: false
  post_connect_roaming: false
  ap:
    ssid: "DSC-CONTROL Fallback"
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        id(wifi_conn) = true;
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (id(wifi_channel) != 0 && id(wifi_channel) != ch) {
              id(wifi_channel_hopped) = true;
              ESP_LOGW("wifi", "channel hop %d -> %d (ESP-NOW needs hub on same ch)", id(wifi_channel), ch);
            } else {
              ESP_LOGI("wifi", "STA channel %d", ch);
            }
            id(wifi_channel) = ch;
          }
        }
    - delay: 500ms
    - lambda: |-
        const char *ip = id(wifi_ip_ts).state.empty() ? "(pending)" : id(wifi_ip_ts).state.c_str();
        ESP_LOGI("wifi", "STA IP %s — HA API :6053", ip);
  on_disconnect:
    - lambda: 'id(wifi_conn) = false;'

text_sensor:
  - platform: template
    name: "Last EVT"
    id: last_evt_ts
    icon: mdi:message-alert-outline
    lambda: |-
      if (id(evt_last_code).empty()) return {"EVT|H|NONE|0|"};
      char b[96];
      snprintf(b, sizeof(b), "EVT|H|%s|%u|", id(evt_last_code).c_str(), (unsigned) id(evt_last_epoch));
      return {std::string(b)};
    update_interval: 5s
  - platform: template
    name: "RF Status"
    id: rf_status_ts
    icon: mdi:wifi-marker
    update_interval: 10s
    lambda: |-
      // RF|H|assoc3|pref3|ch|rssi|CODE
      auto *w = wifi::global_wifi_component;
      char assoc3[4] = {'-','-','-',0};
      char pref3[4] = {'-','-','-',0};
      int ch = 0;
      int rssi = 0;
      const char *code = "OK";
      if (w != nullptr && w->is_connected()) {
        auto b = w->wifi_bssid();
        snprintf(assoc3, sizeof(assoc3), "%02X%02X", b[4], b[5]);
        // last 3 hex of BSSID = 1.5 bytes -> use last byte pair style A1B
        snprintf(assoc3, sizeof(assoc3), "%02X%X", b[5], (b[4] >> 4) & 0xF);
        ch = w->get_wifi_channel();
        rssi = (int) w->wifi_rssi();
      } else {
        code = "WRB";
      }
      std::string pref = id(preferred_wifi_bssid).state;
      if (pref.size() == 17) {
        // last octet + nibble of prior
        char hex[3] = { pref[15], pref[16], 0 };
        int last = (int) strtol(hex, nullptr, 16);
        char hex2[3] = { pref[12], pref[13], 0 };
        int prev = (int) strtol(hex2, nullptr, 16);
        snprintf(pref3, sizeof(pref3), "%02X%X", last, (prev >> 4) & 0xF);
        if (w != nullptr && w->is_connected()) {
          auto b = w->wifi_bssid();
          bool match = true;
          for (int i = 0; i < 6; i++) {
            char hx[3] = { pref[i * 3], pref[i * 3 + 1], 0 };
            if ((uint8_t) strtol(hx, nullptr, 16) != b[i]) { match = false; break; }
          }
          if (!match) code = "CHX";
        }
      } else {
        snprintf(pref3, sizeof(pref3), "---");
      }
      // FAR must be checked before WEAK — every FAR rssi (<-90) also
      // satisfies WEAK's (<-80), so checking WEAK first made FAR dead code
      // (found by scripts/fleet_fix_sim.py's RF-code model check).
      if (strcmp(code, "OK") == 0 && rssi < -90) code = "FAR";
      if (strcmp(code, "OK") == 0 && rssi < -80) code = "WEAK";
      char out[48];
      snprintf(out, sizeof(out), "RF|H|%s|%s|%d|%d|%s", assoc3, pref3, ch, rssi, code);
      return {std::string(out)};

script:
  - id: emit_evt
    mode: queued
    max_runs: 8
    then:
      - lambda: |-
          std::string code = id(evt_pending_code);
          std::string detail = id(evt_pending_detail);
          if (code.empty()) return;
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          uint32_t epoch = now.is_valid() ? (uint32_t) now.timestamp : (millis() / 1000u);
          id(evt_last_code) = code;
          id(evt_last_epoch) = epoch;
          char line[80];
          snprintf(line, sizeof(line), "%s|%u|%s", code.c_str(), (unsigned) epoch, detail.c_str());
          std::string s(line);
          int i = id(evt_ring_idx) % 8;
          if (i == 0) id(evt_ring_0) = s;
          else if (i == 1) id(evt_ring_1) = s;
          else if (i == 2) id(evt_ring_2) = s;
          else if (i == 3) id(evt_ring_3) = s;
          else if (i == 4) id(evt_ring_4) = s;
          else if (i == 5) id(evt_ring_5) = s;
          else if (i == 6) id(evt_ring_6) = s;
          else id(evt_ring_7) = s;
          id(evt_ring_idx) = (i + 1) % 8;
          char pub[96];
          snprintf(pub, sizeof(pub), "EVT|H|%s|%u|%s", code.c_str(), (unsigned) epoch, detail.c_str());
          id(last_evt_ts).publish_state(pub);
          ESP_LOGI("evt", "%s", pub);
          id(evt_pending_code) = "";
          id(evt_pending_detail) = "";

  - id: recompute_coherence
    mode: single
    then:
      - lambda: |-
          uint32_t h = 2166136261u;
          auto mix = [&](uint32_t v){ h ^= v; h *= 16777619u; };
          mix((uint32_t) id(full_auto_mode));
          mix((uint32_t) id(auto_photoperiod_enabled));
          mix((uint32_t) id(ha_takeover_active));
          mix((uint32_t) id(clone_light_hours));
          mix((uint32_t)(id(photo_min_dark_hours) * 10));
          mix((uint32_t)(id(stage_vpd_min) * 100));
          mix((uint32_t)(id(stage_vpd_max) * 100));
          mix((uint32_t)(id(clone_vpd_min) * 100));
          mix((uint32_t)(id(clone_vpd_max) * 100));
          mix(id(photo_delivered_s));
          mix(id(vpd_main_delivered_s));
          mix(id(vpd_clone_delivered_s));
          id(coherence_hash) = h;
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          if (now.is_valid()) id(coherence_epoch) = (uint32_t) now.timestamp;
          if (id(coherence_ha_hash) != 0 && id(coherence_ha_hash) != h) {
            if (!id(coherence_mismatch)) {
              id(coherence_mismatch) = true;
              id(evt_pending_code) = "COHERENCE";
              id(evt_pending_detail) = "ha_hash_diff";
              id(emit_evt).execute();
            }
          } else {
            id(coherence_mismatch) = false;
          }

  - id: set_fix_active
    mode: single
    then:
      - lambda: |-
          // Toggle via fix_active global before calling; this syncs side effects.
          id(ota_blocked) = id(fix_active);
          id(learning_paused) = id(fix_active) || !id(clock_valid);
          id(evt_pending_code) = id(fix_active) ? "FIX_ACTIVE" : "FIX_DONE";
          id(evt_pending_detail) = id(fix_active) ? "1" : "0";
          id(emit_evt).execute();

  - id: rf_request_rejoin
    mode: single
    then:
      - lambda: |-
          uint32_t now = millis();
          if (id(rf_heal_last_ms) != 0 && (now - id(rf_heal_last_ms)) < 60000u) {
            ESP_LOGW("rf", "REJOIN rate-limited");
            return;
          }
          id(rf_heal_last_ms) = now;
          id(rf_rejoin_count) = id(rf_rejoin_count) + 1;
          id(evt_pending_code) = "REJOIN";
          id(evt_pending_detail) = "hub";
          id(emit_evt).execute();
          wifi::global_wifi_component->reset();

  - id: rf_fleet_jump_arm
    mode: single
    then:
      - lambda: |-
          if (!id(clock_valid)) {
            id(evt_pending_code) = "CLK_HOLD";
            id(evt_pending_detail) = "jump";
            id(emit_evt).execute();
            return;
          }
          uint32_t now = millis();
          if (!id(fix_active) && id(rf_jump_last_ms) != 0 && (now - id(rf_jump_last_ms)) < 300000u) {
            ESP_LOGW("rf", "FLEET_JUMP rate-limited");
            return;
          }
          id(rf_jump_last_ms) = now;
          id(evt_pending_code) = "FLEET_JUMP";
          id(evt_pending_detail) = "arm";
          id(emit_evt).execute();

  - id: tick_lateral_ledgers
    mode: single
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          id(clock_valid) = now.is_valid();
          id(learning_paused) = id(fix_active) || !id(clock_valid);
          if (!id(clock_valid)) return;

          uint32_t now_ms = millis();
          uint32_t dt_s = 15;
          if (id(ledger_tick_ms) != 0) {
            uint32_t dt = now_ms - id(ledger_tick_ms);
            if (dt < 1000) dt_s = 1;
            else if (dt > 30000) dt_s = 30;
            else dt_s = dt / 1000u;
          }
          id(ledger_tick_ms) = now_ms;

          int ckey = id(photo_cycle_key);
          if (ckey != 0 && id(vpd_ledger_cycle_key) != ckey) {
            id(vpd_main_delivered_s) = 0;
            id(vpd_clone_delivered_s) = 0;
            id(mister_delivered_s) = 0;
            id(vpd_ledger_cycle_key) = ckey;
          }

          float mv = id(vpd_sensor).state;
          float cv = id(clone_vpd).state;
          float mn = fminf(id(stage_vpd_min), id(stage_vpd_max));
          float mx = fmaxf(id(stage_vpd_min), id(stage_vpd_max));
          if (!isnan(mv) && mv >= mn && mv <= mx && id(vpd_main_delivered_s) < 200000u)
            id(vpd_main_delivered_s) = id(vpd_main_delivered_s) + dt_s;
          float cmn = fminf(id(clone_vpd_min), id(clone_vpd_max));
          float cmx = fmaxf(id(clone_vpd_min), id(clone_vpd_max));
          if (!isnan(cv) && cv >= cmn && cv <= cmx && id(vpd_clone_delivered_s) < 200000u)
            id(vpd_clone_delivered_s) = id(vpd_clone_delivered_s) + dt_s;

          if (id(clone_hum_demand).state && id(mister_delivered_s) < 200000u)
            id(mister_delivered_s) = id(mister_delivered_s) + dt_s;

          if (id(mister_target_h) > 0.01f) {
            uint32_t tgt = (uint32_t)(id(mister_target_h) * 3600.0f);
            uint32_t debt = tgt > id(mister_delivered_s) ? tgt - id(mister_delivered_s) : 0;
            id(mister_catchup_active) = debt > 0 && id(clone_hum_auto_enabled);
          } else {
            id(mister_catchup_active) = false;
          }

interval:
  - interval: 15s
    then:
      - script.execute: tick_lateral_ledgers
      - script.execute: recompute_coherence

  - interval: 30s
    then:
      - lambda: |-
          static bool was_fs = false;
          static bool was_api = true;
          bool fs = id(emergency_failsafe_active);
          if (fs && !was_fs) {
            id(evt_pending_code) = "FAILSAFE";
            id(evt_pending_detail) = "trip";
            id(emit_evt).execute();
          }
          if (!fs && was_fs) {
            id(evt_pending_code) = "FAILSAFE";
            id(evt_pending_detail) = "clear";
            id(emit_evt).execute();
          }
          was_fs = fs;
          bool api = id(ha_connected).state;
          if (!api && was_api) {
            id(evt_pending_code) = "API_BLIP";
            id(evt_pending_detail) = "down";
            id(emit_evt).execute();
          }
          if (api && !was_api) {
            id(evt_pending_code) = "API_BLIP";
            id(evt_pending_detail) = "up";
            id(emit_evt).execute();
            id(recompute_coherence).execute();
          }
          was_api = api;

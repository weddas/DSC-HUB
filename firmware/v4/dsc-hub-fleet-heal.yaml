# ==================================================================
#  DSC-HUB · fleet heal + lateral ledgers (merged by stub package list)
#  ------------------------------------------------------------------
#  Light-quota stays in dsc-hub-v4_0.yaml. This package adds:
#    - VPD hours-in-band ledger (main + clone)
#    - Mister/irrigation duty ledger (target 0 = disabled)
#    - Settings coherence receipt (detect + flag only)
#    - clock_valid gate + EVT bus + FIX_ACTIVE
#    - RF self-heal orchestration hooks (REJOIN / FLEET_JUMP)
#  Wire packets 0xD0v2 / 0xD5 / 0xD7 live in dsc-hub-espnow-primary.yaml.
#  Ops runbook: docs/qa/FLEET-SELF-HEAL-5.1.8.md (includes 0xD5/0xD7 layout debt).
# ==================================================================

globals:
  # --- VPD band ledger (same cycle key as photo) ---
  - id: vpd_main_delivered_s
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: vpd_clone_delivered_s
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: vpd_band_target_h
    type: float
    restore_value: true
    initial_value: '18.0'
  - id: vpd_ledger_cycle_key
    type: int
    restore_value: true
    initial_value: '0'

  # --- Mister duty ledger (target 0 = off) ---
  - id: mister_delivered_s
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: mister_target_h
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: mister_min_off_h
    type: float
    restore_value: true
    initial_value: '4.0'
  - id: mister_catchup_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # --- Coherence receipt (HA <-> hub; detect+flag only) ---
  - id: coherence_epoch
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: coherence_hash
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: coherence_mismatch
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: coherence_ha_hash
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: coherence_ha_epoch
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Fleet heal / Fix ---
  - id: clock_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: fix_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ota_blocked
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rf_heal_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rf_jump_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rf_rejoin_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: evt_ring_idx
    type: int
    restore_value: true
    initial_value: '0'
  - id: evt_last_code
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: evt_last_epoch
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: evt_ring_0
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_1
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_2
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_3
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_4
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_5
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_6
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_ring_7
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: evt_pending_code
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: evt_pending_detail
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: ledger_tick_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: learning_paused
    type: bool
    restore_value: false
    initial_value: 'false'

button:
  - platform: template
    name: "Pre-OTA Quiesce"
    id: btn_pre_ota_quiesce
    icon: mdi:airplane-takeoff
    on_press:
      - lambda: |-
          // Fleet Fix-lite: confirm preferred + ESP-NOW before OTA; block if Fix active.
          if (id(fix_active)) {
            id(evt_pending_code) = "OTA_BLOCK";
            id(evt_pending_detail) = "fix_active";
            id(emit_evt).execute();
            ESP_LOGW("ota", "Pre-OTA refused — FIX_ACTIVE");
            return;
          }
          id(evt_pending_code) = "OTA_QUIESCE";
          id(evt_pending_detail) = "arm";
          id(emit_evt).execute();
          id(tx_fleet_heartbeat).execute();
          id(tx_peer_time).execute();
      - delay: 2s
      - lambda: |-
          bool panel_ok = id(panel_last_ms) != 0 && (millis() - id(panel_last_ms)) < 30000u;
          bool wifi_ok = wifi::global_wifi_component != nullptr
              && wifi::global_wifi_component->is_connected();
          if (wifi_ok && id(clock_valid) && panel_ok) {
            id(evt_pending_code) = "OTA_READY";
            id(evt_pending_detail) = "ok";
          } else {
            id(evt_pending_code) = "OTA_HOLD";
            id(evt_pending_detail) = !wifi_ok ? "wifi" : (!id(clock_valid) ? "clock" : "espnow");
          }
          id(emit_evt).execute();

number:
  - platform: template
    name: "VPD Band Target Hours"
    id: num_vpd_band_target_h
    icon: mdi:chart-timeline-variant
    min_value: 0
    max_value: 24
    step: 0.5
    unit_of_measurement: "h"
    update_interval: 60s
    lambda: 'return id(vpd_band_target_h);'
    set_action:
      - globals.set: {id: vpd_band_target_h, value: !lambda 'return x;'}
      - lambda: 'id(num_vpd_band_target_h).publish_state(id(vpd_band_target_h));'

  - platform: template
    name: "Mister Target Hours"
    id: num_mister_target_h
    icon: mdi:water-pump
    min_value: 0
    max_value: 12
    step: 0.5
    unit_of_measurement: "h"
    update_interval: 60s
    lambda: 'return id(mister_target_h);'
    set_action:
      - globals.set: {id: mister_target_h, value: !lambda 'return x;'}
      - lambda: 'id(num_mister_target_h).publish_state(id(mister_target_h));'

  - platform: template
    name: "Mister Min Off Hours"
    id: num_mister_min_off_h
    icon: mdi:timer-sand
    min_value: 1
    max_value: 12
    step: 0.5
    unit_of_measurement: "h"
    update_interval: 60s
    lambda: 'return id(mister_min_off_h);'
    set_action:
      - globals.set: {id: mister_min_off_h, value: !lambda 'return x;'}
      - lambda: 'id(num_mister_min_off_h).publish_state(id(mister_min_off_h));'

sensor:
  - platform: template
    name: "VPD Main Band Hours"
    id: vpd_main_band_h
    unit_of_measurement: "h"
    state_class: measurement
    icon: mdi:leaf
    accuracy_decimals: 2
    update_interval: 15s
    lambda: 'return {id(vpd_main_delivered_s) / 3600.0f};'
  - platform: template
    name: "VPD Clone Band Hours"
    id: vpd_clone_band_h
    unit_of_measurement: "h"
    state_class: measurement
    icon: mdi:leaf-circle
    accuracy_decimals: 2
    update_interval: 15s
    lambda: 'return {id(vpd_clone_delivered_s) / 3600.0f};'
  - platform: template
    name: "VPD Main Band Debt Hours"
    id: vpd_main_debt_h
    unit_of_measurement: "h"
    state_class: measurement
    icon: mdi:scale-unbalanced
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      uint32_t t = (uint32_t)(id(vpd_band_target_h) * 3600.0f);
      if (id(vpd_main_delivered_s) >= t) return {0.0f};
      return {(t - id(vpd_main_delivered_s)) / 3600.0f};
  - platform: template
    name: "VPD Clone Band Debt Hours"
    id: vpd_clone_debt_h
    unit_of_measurement: "h"
    state_class: measurement
    icon: mdi:scale-unbalanced
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      uint32_t t = (uint32_t)(id(vpd_band_target_h) * 3600.0f);
      if (id(vpd_clone_delivered_s) >= t) return {0.0f};
      return {(t - id(vpd_clone_delivered_s)) / 3600.0f};
  - platform: template
    name: "Mister Delivered Hours"
    id: mister_delivered_h
    unit_of_measurement: "h"
    state_class: measurement
    icon: mdi:water
    accuracy_decimals: 2
    update_interval: 15s
    lambda: 'return {id(mister_delivered_s) / 3600.0f};'
  - platform: template
    name: "Mister Debt Hours"
    id: mister_debt_h
    unit_of_measurement: "h"
    state_class: measurement
    icon: mdi:water-alert
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (id(mister_target_h) <= 0.01f) return {0.0f};
      uint32_t t = (uint32_t)(id(mister_target_h) * 3600.0f);
      if (id(mister_delivered_s) >= t) return {0.0f};
      return {(t - id(mister_delivered_s)) / 3600.0f};
  - platform: template
    name: "Coherence Hash"
    id: coherence_hash_s
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return {(float) id(coherence_hash)};'
  - platform: template
    name: "Coherence Epoch"
    id: coherence_epoch_s
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return {(float) id(coherence_epoch)};'


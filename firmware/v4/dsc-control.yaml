# ==================================================================
#  DSC-CONTROL — device stub (lab)
#  Kit SoftAP setup: dsc-control-kit.yaml
# ==================================================================

substitutions:
  name: dsc-control
  friendly_name: DSC-CONTROL
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_val: !secret dsc_control_api_key
  ota_password_val: !secret dsc_control_ota_password
  ap_password_val: !secret dsc_control_ap_password
  hub_mac: "84:1F:E8:16:E6:60"        # DSC-HUB
  espnow_cmd_tag: "54727"             # 0xD5C7 — must match hub

packages:
  wifi: !include dsc-control-wifi-lab.yaml
  panel: !include dsc-control-common.yaml
  # Lab: do NOT include dsc-fleet-setup-control-lab.yaml.
  # Even with enabled: false the component AUTO_LOADs web_server_base + json
  # (captive-class DRAM). That recreated the v4.0.x CYD heap crash mode as
  # IllegalInstruction / Unknown on core 1 under ESPHome 2026.7 / IDF 5.5.
  # Kit SoftAP still uses dsc-control-kit.yaml → dsc-fleet-setup-satellite.

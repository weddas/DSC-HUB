# ==================================================================
#  DSC-CONTROL — device stub
#  ------------------------------------------------------------------
#  Secrets + hub MAC/tag stay here. UI/logic in dsc-control-common.yaml
#  (glyphs via !include cyd_glyphs.yaml beside that file).
#
#  Local:  esphome run dsc-control.yaml
#  HA:     homeassistant/esphome/dsc-control.yaml (git-pulls the body)
# ==================================================================

substitutions:
  name: dsc-control
  friendly_name: DSC-CONTROL
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_val: !secret dsc_control_api_key
  ota_password_val: !secret dsc_control_ota_password
  ap_password_val: !secret dsc_control_ap_password
  hub_mac: "84:1F:E8:16:E6:60"        # DSC-HUB
  espnow_cmd_tag: "54727"             # 0xD5C7 — must match hub

packages:
  panel: !include dsc-control-common.yaml

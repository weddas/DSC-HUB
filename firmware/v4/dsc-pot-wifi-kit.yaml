# ==================================================================
#  DSC pot · kit WiFi (join DSC-Setup-* SoftAP for provisioning)
# ==================================================================
wifi:
  power_save_mode: none
  # Match hub: allow scan onto learned preferred BSSID after bounce.
  fast_connect: false
  # Match hub: off-channel roam scans break ESP-NOW (shared radio).
  post_connect_roaming: false
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

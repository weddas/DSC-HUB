# ==================================================================
#  DSC pot · lab WiFi
#
#  Pots are ESP-NOW-only to the hub (SoftAP fleet-star). Nest/home is
#  for OTA/optional LAN only — do NOT prefer DSC-Anchor SoftAP (wastes
#  SoftAP STA slots and is not required for climate).
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      bssid: ${wifi_bssid}
      priority: 20
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 10
    # SoftAP last-resort only (e.g. Nest down during OTA) — never preferred.
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      priority: 0
  power_save_mode: none
  # Match hub: false so bounce can scan onto a preferred Nest BSSID if set.
  fast_connect: false
  # Match hub: off-channel roam scans break ESP-NOW (shared radio).
  post_connect_roaming: false
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

captive_portal:

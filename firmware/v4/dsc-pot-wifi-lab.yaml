# ==================================================================
#  DSC pot · lab WiFi
#
#  AP PIN: networks[0] prefers ${wifi_bssid}. Production stubs stay
#  00:00:00:00:00:00 — hub learns preferred AP at runtime and 0xD0
#  broadcasts it; pots adopt via adopt_hub_wifi_ap. No site MAC in YAML.
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      bssid: ${wifi_bssid}
      priority: 10
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 0
  power_save_mode: none
  # Match hub: false so bounce can scan onto hub's *learned* preferred AP.
  fast_connect: false
  # Match hub: off-channel roam scans break ESP-NOW (shared radio).
  post_connect_roaming: false
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

captive_portal:

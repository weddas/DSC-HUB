# ==================================================================
#  DSC pot · lab WiFi
#
#  SoftAP DSC-Anchor primary — same channel pin as hub for ESP-NOW.
#  Pot traffic is tiny (vitals); SoftAP STA cost is fine. Nest/home
#  is emergency fallback only. SoftAP BSSID pin on SoftAP entry only.
#  Stubs set softap_ip + softap_bssid / wifi_bssid.
# ==================================================================
wifi:
  networks:
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      bssid: ${softap_bssid}
      priority: 20
      manual_ip:
        static_ip: ${softap_ip}
        gateway: 192.168.4.1
        subnet: 255.255.255.0
        dns1: 192.168.4.1
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 5
  power_save_mode: none
  fast_connect: false
  # Off-channel roam scans break ESP-NOW (shared radio).
  post_connect_roaming: false
  use_address: ${softap_ip}
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

captive_portal:

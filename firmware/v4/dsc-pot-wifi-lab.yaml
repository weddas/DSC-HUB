# ==================================================================
#  DSC pot · lab WiFi (Digital-Emotions Studio · HA bus cutover)
#
#  Studio 2.4 GHz STA. Soil reports via ESPHome Native API to HA;
#  hub reads HA mirrors (ESP-NOW packet_transport parked).
#  Stubs set lan_ip (reclaimed Nest reservations).
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 20
      manual_ip:
        static_ip: ${lan_ip}
        gateway: 192.168.86.1
        subnet: 255.255.255.0
        dns1: 192.168.86.1
  power_save_mode: none
  fast_connect: false
  post_connect_roaming: false
  use_address: ${lan_ip}
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

captive_portal:

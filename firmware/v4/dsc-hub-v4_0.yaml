    id: num_vpd_min
    icon: "mdi:water-thermometer"
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.6
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.4
    set_action:
      - globals.set: {id: stage_vpd_min, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "VPD Target Max"
    id: num_vpd_max
    icon: "mdi:water-thermometer"
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.8
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.8
    set_action:
      - globals.set: {id: stage_vpd_max, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "RH Target Min"
    id: num_rh_min
    icon: "mdi:water-percent"
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 90
    step: 1
    unit_of_measurement: "%"
    initial_value: 70
    set_action:
      - globals.set: {id: stage_rh_min, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "RH Target Max"
    id: num_rh_max
    icon: "mdi:water-percent"
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 95
    step: 1
    unit_of_measurement: "%"
    initial_value: 80
    set_action:
      - globals.set: {id: stage_rh_max, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  # v2.4.1 · SENSOR EFFICIENCY: these polled template numbers only
  # mirror slow-moving settings. 10s polling re-published every one of
  # them 6x/min forever — pure API noise. 60s is still faster than any
  # human retunes them, and set_action remains instant either way.
  - platform: template
    name: "Sunrise Duration"
    id: num_sunrise
    icon: "mdi:weather-sunset-up"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    update_interval: 60s
    lambda: 'return id(sunrise_minutes);'
    set_action:
      - globals.set: {id: sunrise_minutes, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_sunrise).publish_state((float) id(sunrise_minutes));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "Sunset Duration"
    id: num_sunset
    icon: "mdi:weather-sunset-down"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    update_interval: 60s
    lambda: 'return id(sunset_minutes);'
    set_action:
      - globals.set: {id: sunset_minutes, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_sunset).publish_state((float) id(sunset_minutes));'
      - script.execute: tx_panel_sync

  # The "X" in the 0 -> X% sunrise ramp. Also the level manual OLED
  # adjust writes to, so device + HA always agree on the target.
  # (10s retained here — the OLED dial writes this one live.)
  - platform: template
    name: "SF1000 Target Brightness"
    id: num_sf1000_target
    icon: "mdi:brightness-percent"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 10s
    lambda: 'return id(local_target_sf1000);'
    set_action:
      - globals.set: {id: local_target_sf1000, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_sf1000_target).publish_state((float) id(local_target_sf1000));'
      - script.execute: tx_panel_sync

  # ===== v2.2 · CLONE TARGET SLIDERS (persist; presets write them) =====
  - platform: template
    name: "Clone Target Temp"
    id: num_clone_temp
    icon: "mdi:thermometer"
    optimistic: true
    restore_value: true
    min_value: 15
    max_value: 32
    step: 0.5
    unit_of_measurement: "°C"
    initial_value: 24
    set_action:
      - globals.set: {id: clone_temp_target, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone VPD Min"
    id: num_clone_vpd_min
    icon: "mdi:water-thermometer"
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.6
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.4
    set_action:
      - globals.set: {id: clone_vpd_min, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone VPD Max"
    id: num_clone_vpd_max
    icon: "mdi:water-thermometer"
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.8
    step: 0.1
    unit_of_measurement: "kPa"
    initial_value: 0.8
    set_action:
      - globals.set: {id: clone_vpd_max, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone RH Min"
    id: num_clone_rh_min
    icon: "mdi:water-percent"
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 90
    step: 1
    unit_of_measurement: "%"
    initial_value: 70
    set_action:
      - globals.set: {id: clone_rh_min, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone RH Max"
    id: num_clone_rh_max
    icon: "mdi:water-percent"
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 95
    step: 1
    unit_of_measurement: "%"
    initial_value: 80
    set_action:
      - globals.set: {id: clone_rh_max, value: !lambda 'return x;'}
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone Light Hours"
    id: num_clone_light_hours
    icon: "mdi:clock-outline"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 24
    step: 1
    unit_of_measurement: "h"
    initial_value: 18
    set_action:
      - globals.set: {id: clone_light_hours, value: !lambda 'return (int) x;'}
      - script.execute: tx_panel_sync

  # ===== v2.4 · RUNTIME-CONFIGURABLE PARAMETERS ======================
  # Tunables promoted from compiled constants. All persist (NVS layers
  # on the YAML defaults). Watchdog + >35C failsafe thresholds are
  # deliberately NOT exposed — those stay compiled-in.
  # v2.4.1: all polls 10s -> 60s (settings mirrors, not measurements).

  # The SF1000 kick-in duty (1k pull-down dead zone). Brightness 0-100%
  # remaps to duty floor-100%; OFF stays a true 0% duty. Bench estimate
  # ~30% + 2 margin — verify against the light on the first v2.4
  # sunrise and trim here, no reflash.
  - platform: template
    name: "SF1000 Ramp Floor"
    id: num_sf_ramp_floor
    icon: "mdi:arrow-collapse-down"
    min_value: 0
    max_value: 50
    step: 1
    unit_of_measurement: "%"
    update_interval: 60s
    lambda: 'return id(sf_ramp_floor);'
    set_action:
      - globals.set: {id: sf_ramp_floor, value: !lambda 'return x;'}
      - lambda: 'id(light_sf1000_pwm).set_min_power(x / 100.0f);'
      - lambda: 'id(num_sf_ramp_floor).publish_state((float) id(sf_ramp_floor));'
      - script.execute: tx_panel_sync

  # Clone humidifier release offset: demand clears at RH-min + this.
  # The v2.3 +2% (4% total band) was the short-cycler. Raising this IS
  # "raise the overshoot target".
  - platform: template
    name: "Clone Hum Hysteresis"
    id: num_clone_hum_hyst
    icon: "mdi:arrow-expand-vertical"
    min_value: 2
    max_value: 15
    step: 0.5
    unit_of_measurement: "%"
    update_interval: 60s
    lambda: 'return id(clone_hum_hyst);'
    set_action:
      - globals.set: {id: clone_hum_hyst, value: !lambda 'return x;'}
      - lambda: 'id(num_clone_hum_hyst).publish_state((float) id(clone_hum_hyst));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone Hum Min Off-Time"
    id: num_clone_hum_min_off
    icon: "mdi:timer-sand"
    min_value: 0
    max_value: 900
    step: 30
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(clone_hum_min_off_s);'
    set_action:
      - globals.set: {id: clone_hum_min_off_s, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_clone_hum_min_off).publish_state((float) id(clone_hum_min_off_s));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "Humidifier Min Off-Time"
    id: num_hum_min_off
    icon: "mdi:timer-sand"
    min_value: 0
    max_value: 900
    step: 30
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(hum_min_off_s);'
    set_action:
      - globals.set: {id: hum_min_off_s, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_hum_min_off).publish_state((float) id(hum_min_off_s));'
      - script.execute: tx_panel_sync

  # ===== v5.1.0 · Ladder persistence bases (seconds) — Phase B may write =====
  - platform: template
    name: "Ladder Wait Dehum"
    id: num_ladder_wait_dehum
    icon: "mdi:timer-outline"
    min_value: 60
    max_value: 600
    step: 10
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(base_dehum_wait_ms) / 1000.0f;'
    set_action:
      - globals.set: {id: base_dehum_wait_ms, value: !lambda 'return (uint32_t)(x * 1000.0f);'}
      - lambda: 'id(num_ladder_wait_dehum).publish_state(id(base_dehum_wait_ms) / 1000.0f);'
  - platform: template
    name: "Ladder Wait Hum"
    id: num_ladder_wait_hum
    icon: "mdi:timer-outline"
    min_value: 60
    max_value: 600
    step: 10
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(base_hum_wait_ms) / 1000.0f;'
    set_action:
      - globals.set: {id: base_hum_wait_ms, value: !lambda 'return (uint32_t)(x * 1000.0f);'}
      - lambda: 'id(num_ladder_wait_hum).publish_state(id(base_hum_wait_ms) / 1000.0f);'
  - platform: template
    name: "Ladder Wait Heat"
    id: num_ladder_wait_heat
    icon: "mdi:timer-outline"
    min_value: 60
    max_value: 600
    step: 10
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(base_heat_wait_ms) / 1000.0f;'
    set_action:
      - globals.set: {id: base_heat_wait_ms, value: !lambda 'return (uint32_t)(x * 1000.0f);'}
      - lambda: 'id(num_ladder_wait_heat).publish_state(id(base_heat_wait_ms) / 1000.0f);'
  - platform: template
    name: "Ladder Wait AC"
    id: num_ladder_wait_ac
    icon: "mdi:timer-outline"
    min_value: 60
    max_value: 600
    step: 10
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(base_ac_wait_ms) / 1000.0f;'
    set_action:
      - globals.set: {id: base_ac_wait_ms, value: !lambda 'return (uint32_t)(x * 1000.0f);'}
      - lambda: 'id(num_ladder_wait_ac).publish_state(id(base_ac_wait_ms) / 1000.0f);'
  - platform: template
    name: "Ladder Wait Mat"
    id: num_ladder_wait_mat
    icon: "mdi:timer-outline"
    min_value: 30
    max_value: 300
    step: 5
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(base_mat_wait_ms) / 1000.0f;'
    set_action:
      - globals.set: {id: base_mat_wait_ms, value: !lambda 'return (uint32_t)(x * 1000.0f);'}
      - lambda: 'id(num_ladder_wait_mat).publish_state(id(base_mat_wait_ms) / 1000.0f);'

  - platform: template
    name: "Heater Min Off-Time"
    id: num_heater_min_off
    icon: "mdi:timer-sand"
    min_value: 0
    max_value: 900
    step: 30
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(heater_min_off_s);'
    set_action:
      - globals.set: {id: heater_min_off_s, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_heater_min_off).publish_state((float) id(heater_min_off_s));'
      - script.execute: tx_panel_sync

  # Closed-loop grow mat band (ROOT-ZONE temp from the soil probes).
  # Energise below Low, cut at/above High. The gap IS the hysteresis —
  # keep it >= 2C. The mat's plate thermostat still bounds the surface.
  # v2.4.1: heats on the COLDEST valid pot; hottest pot >= High + 1C
  # trips the runaway flush (mat off, fans pull the root zone down).
  - platform: template
    name: "Mat Root-Zone Low"
    id: num_mat_rz_low
    icon: "mdi:thermometer-chevron-down"
    min_value: 12
    max_value: 26
    step: 0.5
    unit_of_measurement: "°C"
    update_interval: 60s
    lambda: 'return id(mat_rz_low);'
    set_action:
      - globals.set: {id: mat_rz_low, value: !lambda 'return x;'}
      - lambda: 'id(num_mat_rz_low).publish_state((float) id(mat_rz_low));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "Mat Root-Zone High"
    id: num_mat_rz_high
    icon: "mdi:thermometer-chevron-up"
    min_value: 14
    max_value: 28
    step: 0.5
    unit_of_measurement: "°C"
    update_interval: 60s
    lambda: 'return id(mat_rz_high);'
    set_action:
      - globals.set: {id: mat_rz_high, value: !lambda 'return x;'}
      - lambda: 'id(num_mat_rz_high).publish_state((float) id(mat_rz_high));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "Mat Min Off-Time"
    id: num_mat_min_off
    icon: "mdi:timer-sand"
    min_value: 0
    max_value: 1800
    step: 60
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(mat_min_off_s);'
    set_action:
      - globals.set: {id: mat_min_off_s, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_mat_min_off).publish_state((float) id(mat_min_off_s));'
      - script.execute: tx_panel_sync

  # ===== v2.4.2 · RECIRC DE-STRAT PULSE tunables =====
  # A burst of destrat_burst_pct% RECIRC for destrat_burst_s seconds
  # every destrat_period_s seconds. Gentle defaults: 15s every 3min.
  - platform: template
    name: "De-Strat Pulse Period"
    id: num_destrat_period
    icon: "mdi:timer-refresh"
    min_value: 30
    max_value: 1800
    step: 30
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(destrat_period_s);'
    set_action:
      - globals.set: {id: destrat_period_s, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_destrat_period).publish_state((float) id(destrat_period_s));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "De-Strat Pulse Length"
    id: num_destrat_burst
    icon: "mdi:timer-play"
    min_value: 5
    max_value: 120
    step: 5
    unit_of_measurement: "s"
    update_interval: 60s
    lambda: 'return id(destrat_burst_s);'
    set_action:
      - globals.set: {id: destrat_burst_s, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_destrat_burst).publish_state((float) id(destrat_burst_s));'
      - script.execute: tx_panel_sync

  - platform: template
    name: "De-Strat Pulse Level"
    id: num_destrat_level
    icon: "mdi:fan-chevron-up"
    min_value: 25
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 60s
    lambda: 'return id(destrat_burst_pct);'
    set_action:
      - globals.set: {id: destrat_burst_pct, value: !lambda 'return (int) x;'}
      - lambda: 'id(num_destrat_level).publish_state((float) id(destrat_burst_pct));'
      - script.execute: tx_panel_sync

  # HA → hub API handshake ping (Sync automation writes unix time every 30s).
  # Proves the API write path is alive. Silent ≥5 min while WiFi is still
  # up → wedged API session → sync NVS + safe_reboot (not a WiFi reboot).
  - platform: template
    name: "HA Handshake"
    id: num_ha_handshake
    entity_category: diagnostic
    icon: "mdi:handshake"
    min_value: 0
    max_value: 2147483647
    step: 1
    optimistic: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(ha_handshake_last) = millis();
          id(ha_handshake_seen) = true;
          id(api_ever_connected) = true;
          id(api_down_since) = 0;
          ESP_LOGD("api", "HA handshake ping (beat=%u)", (unsigned) x);

# Real HH:MM picker in HA (renders as AM/PM per your HA locale).
datetime:
  - platform: template
    name: "Lights-On Time"
    id: lights_on_time
    type: time
    icon: "mdi:clock-time-six-outline"
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
    on_value:
      - script.execute: tx_panel_sync

  # v2.2: clone window start. Default 18:00 — the counter-cycle to a
  # 06:00 4x8 start, so the 2x4 is the warm humid reservoir at night.
  - platform: template
    name: "Clone Lights-On Time"

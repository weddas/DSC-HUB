          ESP_LOGI("wifi", "preferred WiFi BSSID cleared");

# ==========================================
# 6. HARDWARE SENSORS, FAILSAFE & WATCHDOG
# ==========================================
sensor:
  # v2.4.1 · SENSOR EFFICIENCY: RSSI was publishing every 15s — a
  # diagnostic nobody watches at 4x/min. 60s + a 3dB delta means it
  # only speaks when the link actually moves.
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    filters:
      - delta: 3.0

  # v2.4.1: uptime is reboot-triage data — 5 min resolution is plenty.
  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 300s
    entity_category: diagnostic

  # Stack heartbeat — HA sees a live counter; Sync automation also pings
  # number.dsc_hub_ha_handshake. Recovery interval uses both signals.
  - platform: template
    name: "Heartbeat"
    id: hub_heartbeat
    entity_category: diagnostic
    icon: mdi:heart-pulse
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      id(hub_heartbeat_count) = id(hub_heartbeat_count) + 1;
      return (float) id(hub_heartbeat_count);

  - platform: dht
    model: DHT22
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    update_interval: 30s
    temperature:
      id: temp_sensor
      name: "Tent Temperature"
      filters:
        - filter_out: 150.0
        - lambda: |-
            if (isnan(x) || x < -10 || x > 60) return NAN;
            return x;
      # Watchdog heartbeat: stamp the time of every VALID reading, and
      # remember the value (shown on the fault banner for context).
      on_value:
        - lambda: |-
            if (!isnan(id(temp_sensor).state)) {
              id(last_valid_temp_time) = millis();
              id(last_good_temp) = id(temp_sensor).state;
            }
      # EMERGENCY FAILSAFE (hysteresis 34/35 C)
      on_value_range:
        - above: 35.0
          then:
            - lambda: |-
                if (id(emergency_failsafe_active)) return;   // already tripped
                // Snapshot current state so we can restore on clear
                id(saved_out)       = id(fan_exhaust_out).speed;
                id(saved_recirc)   = id(fan_exhaust_recirc).speed;
                id(saved_intake_main)   = id(fan_intake_main).speed;
                id(saved_intake_clone)  = id(fan_intake_clone).speed;
                id(saved_light_sf1000_b)= id(light_sf1000).remote_values.get_brightness();
                id(emergency_failsafe_active) = true;
                id(emergency_since) = millis();
                // Reset the ladder timers: the emergency period must never
                // count as "fans failed to fix it" after we resume.
                id(esc_humid_since) = 0; id(esc_dry_since) = 0;
                id(esc_cold_since) = 0;  id(esc_deep_cold_since) = 0;
                id(esc_hot_since) = 0;   id(esc_clone_dry_since) = 0;
                // Kill heat sources + ONCE-THROUGH purge to OUTSIDE.
                // ROOM fan -> 0 so we don't dump the tent's heat into the
                // room the intakes are pulling from. Intakes 100% feed the
                // outside fan with (cooler) room/makeup air.
                id(humidifier_demand).turn_off();
                // BUG-FIX 2026-08-02: the dehumidifier is a heat-adding
                // appliance too — leaving it ON fights the purge (watchdog
                // path already clears it; trip path missed it).
                id(dehumidifier_demand).turn_off();
                id(heater_demand).turn_off();
                id(growmat_demand).turn_off();
                // v2.4: stamp the min-off clocks — a forced-off must still
                // honour the cooldown before the ladder re-fires anything.
                id(hum_off_at) = millis(); id(heater_off_at) = millis();
                id(mat_off_at) = millis(); id(clone_hum_off_at) = millis();
                id(dehum_off_at) = millis();
                // v2.2/v2.4: purge path is room -> 2x4 -> 4x8 -> outside.
                // The SF1000 (clone light) heats that airstream; the
                // mister adds latent load. Both OFF — the clone schedule
                // re-asserts within 15s of clear.
                id(clone_hum_demand).turn_off();
                id(ac_demand).turn_on();     // AC assists the purge (setpoint 20C)
                auto fe = id(fan_exhaust_out).make_call();  fe.set_state(true);  fe.set_speed(100); fe.perform();
                auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(false); fa.set_speed(0);  fa.perform();
                auto fim = id(fan_intake_main).make_call(); fim.set_state(true); fim.set_speed(100); fim.perform();
                auto fic = id(fan_intake_clone).make_call();fic.set_state(true); fic.set_speed(100); fic.perform();
                id(light_write_guard_until) = millis() + 1000;   // v2.3: our write, don't latch hold
                id(light_sf1000).turn_off().perform();
                ESP_LOGW("failsafe", "EMERGENCY temp>35C: once-through purge OUTSIDE, ROOM fan off, light OFF");
        - below: 34.0
          then:
            - lambda: |-
                if (!id(emergency_failsafe_active)) return;
                id(emergency_failsafe_active) = false;
                id(emergency_since) = 0;
                id(ac_demand).turn_off();    // ladder re-arms it if still needed
                id(ac_off_at) = millis();    // v2.4.2 (BUG-2): stamp the compressor clock
                                             // (the AC ran through the whole purge)
                // Restore the pre-trip fan + light state
                auto fe = id(fan_exhaust_out).make_call();  fe.set_state(id(saved_out) > 0);      fe.set_speed(id(saved_out));      fe.perform();
                auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(id(saved_recirc) > 0);  fa.set_speed(id(saved_recirc));  fa.perform();
                auto fim = id(fan_intake_main).make_call(); fim.set_state(id(saved_intake_main) > 0); fim.set_speed(id(saved_intake_main)); fim.perform();
                auto fic = id(fan_intake_clone).make_call();fic.set_state(id(saved_intake_clone) > 0);fic.set_speed(id(saved_intake_clone));fic.perform();
                id(light_write_guard_until) = millis() + 1000;   // v2.3: our write, don't latch hold
                if (id(saved_light_sf1000_b) > 0.0f){ auto l = id(light_sf1000).turn_on();l.set_brightness(id(saved_light_sf1000_b));l.perform(); }
                ESP_LOGI("failsafe", "Emergency cleared: restored previous fan/light state");
    humidity:
      id: humidity_sensor
      name: "Tent Humidity"
      filters:
        - filter_out: 100.0
        - lambda: |-
            if (isnan(x) || x < 0 || x > 100) return NAN;
            return x;

  # ===== v2.2 · ROOM SENSOR (GPIO4) — the intake SOURCE air =====
  # Placement: same height as the tents' room intakes. This sensor is
  # what makes the ladder's reality gates and the heat-reuse split
  # honest — it must read the air the fans actually move.
  - platform: dht
    model: DHT22
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    update_interval: 30s
    temperature:
      id: room_temp
      name: "Room Temperature"
      filters:
        - filter_out: 150.0
        - lambda: |-
            if (isnan(x) || x < -10 || x > 60) return NAN;
            return x;
      on_value:
        - lambda: |-
            if (!isnan(id(room_temp).state)) id(last_valid_room_time) = millis();
    humidity:
      id: room_rh
      name: "Room Humidity"
      filters:
        - filter_out: 100.0
        - lambda: |-
            if (isnan(x) || x < 0 || x > 100) return NAN;
            return x;

  # ===== v2.2 · CLONE TENT SENSOR (GPIO13) — canopy height, on a yoyo =====
  - platform: dht
    model: DHT22
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
    update_interval: 30s
    temperature:
      id: clone_temp
      name: "Clone Temperature"
      filters:
        - filter_out: 150.0
        - lambda: |-
            if (isnan(x) || x < -10 || x > 60) return NAN;
            return x;
      on_value:
        - lambda: |-
            if (!isnan(id(clone_temp).state)) id(last_valid_clone_time) = millis();
    humidity:
      id: clone_rh
      name: "Clone Humidity"
      filters:
        - filter_out: 100.0
        - lambda: |-
            if (isnan(x) || x < 0 || x > 100) return NAN;
            return x;

  - platform: adc
    pin: GPIO34
    name: "CO2 Sensor Voltage"
    id: co2_voltage
    attenuation: 12db
    update_interval: 10s
    filters:
      - exponential_moving_average: {alpha: 0.1, send_every: 3}
    on_value:
      then:
        - component.update: co2_ppm_estimate

  # ---- TEMPLATE SENSORS ----
  - platform: template
    name: "Dynamic CO2 PPM"          # NOTE: uncalibrated analog estimate.
    id: co2_ppm_estimate             # Replace with SCD41 block below for real ppm.
    unit_of_measurement: "ppm"
    icon: "mdi:molecule-co2"
    update_interval: never
    lambda: |-
      float v = id(co2_voltage).state;
      if (isnan(v)) return NAN;
      return 116.67f * expf(2.769f * v);

  - platform: template
    name: "VPD (kPa)"
    id: vpd_sensor
    accuracy_decimals: 2
    unit_of_measurement: "kPa"
    lambda: |-
      float t = id(temp_sensor).state;
      float rh = id(humidity_sensor).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return NAN;
      float svp = 0.6108f * expf((17.27f * t) / (t + 237.3f));
      float avp = svp * (rh / 100.0f);
      return svp - avp;

  # v2.2: same VPD maths, clone tent air. Drives the clone mini-
  # controller, the clone humidifier rung, and the Clone OLED page.
  - platform: template
    name: "Clone VPD (kPa)"
    id: clone_vpd
    accuracy_decimals: 2
    unit_of_measurement: "kPa"
    lambda: |-
      float t = id(clone_temp).state;
      float rh = id(clone_rh).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return NAN;
      float svp = 0.6108f * expf((17.27f * t) / (t + 237.3f));
      float avp = svp * (rh / 100.0f);
      return svp - avp;

  # ===== v2.4.1 · ROOT-ZONE TEMPS — HA MIRRORS (fallback source) =====
  # The closed-loop grow mat's SECOND sense path. v2.4 alpha read POT1
  # only — a cold POT4 was invisible (19 Jul incident). All four are
  # mirrored; run_climate_logic takes min() over the PLAUSIBLE (5-45C)
  # readings for heating and max() for the runaway guard, so POT3's
  # faulted flat-0.0C probe is simply ignored instead of pegging the
  # mat on (the exact blocker that parked min() in v2.4).
  # With ESP-NOW live these are the per-pot FALLBACK: the source-select
  # in the mat block prefers a pot's direct ESP-NOW reading while it is
  # fresh (<150s) and only reads the HA mirror when that link is stale.
  # The freshness stamp advances on a plausible reading from EITHER
  # path — a faulted probe can neither keep the loop alive nor blind
  # it. internal: HA's own entities mirrored in; re-exporting them
  # would just duplicate them.
  - platform: homeassistant
    id: rootzone_temp
    entity_id: ${rootzone_temp_entity}
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) id(last_valid_rootzone_time) = millis();
  - platform: homeassistant
    id: rootzone_temp_2
    entity_id: ${rootzone_temp_entity_2}
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) id(last_valid_rootzone_time) = millis();
  - platform: homeassistant
    id: rootzone_temp_3
    entity_id: ${rootzone_temp_entity_3}
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) id(last_valid_rootzone_time) = millis();
  - platform: homeassistant
    id: rootzone_temp_4
    entity_id: ${rootzone_temp_entity_4}
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) id(last_valid_rootzone_time) = millis();

  # ===== v2.4 · LADDER TIMING TELEMETRY ==============================
  # Firmware truth for the Dashboard v3 appliance module cards.
  # "Fire Countdown" = seconds until that rung's persistence window
  # elapses and the demand fires (0 = idle or already fired).
  # "Cooldown Remaining" = seconds of min-off left before that
  # appliance may re-fire (0 = free to fire).
  # v2.4.1 · SENSOR EFFICIENCY: every one of these was publishing its
  # value each 10s tick FOREVER — mostly a constant 0. That is 10
  # sensors x 6 msgs/min of API traffic + HA recorder churn for
  # nothing. A delta filter keeps the 10s responsiveness while a
  # countdown is actually live, and silences the idle zeros.
  - platform: template
    name: "Dehumidifier Fire Countdown"
    id: sens_dehum_countdown
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(esc_humid_since) == 0 || id(dehumidifier_demand).state) return 0;
      uint32_t held = millis() - id(esc_humid_since);
      return held >= id(cur_dehum_wait) ? 0 : (id(cur_dehum_wait) - held) / 1000.0f;

  - platform: template
    name: "Humidifier Fire Countdown"
    id: sens_hum_countdown
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(esc_dry_since) == 0 || id(humidifier_demand).state) return 0;
      uint32_t held = millis() - id(esc_dry_since);
      return held >= id(cur_hum_wait) ? 0 : (id(cur_hum_wait) - held) / 1000.0f;

  - platform: template
    name: "Heater Fire Countdown"
    id: sens_heater_countdown
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(esc_deep_cold_since) == 0 || id(heater_demand).state) return 0;
      uint32_t held = millis() - id(esc_deep_cold_since);
      return held >= id(cur_heat_wait) ? 0 : (id(cur_heat_wait) - held) / 1000.0f;

  - platform: template
    name: "AC Fire Countdown"
    id: sens_ac_countdown
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(esc_hot_since) == 0 || id(ac_demand).state) return 0;
      uint32_t held = millis() - id(esc_hot_since);
      return held >= id(cur_ac_wait) ? 0 : (id(cur_ac_wait) - held) / 1000.0f;

  - platform: template
    name: "Grow Mat Fire Countdown"
    id: sens_mat_countdown
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(esc_cold_since) == 0 || id(growmat_demand).state) return 0;
      uint32_t held = millis() - id(esc_cold_since);
      uint32_t mw = id(cur_mat_wait) ? id(cur_mat_wait) : id(base_mat_wait_ms);
      return held >= mw ? 0 : (mw - held) / 1000.0f;

  - platform: template
    name: "Clone Humidifier Fire Countdown"
    id: sens_clone_hum_countdown
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(esc_clone_dry_since) == 0 || id(clone_hum_demand).state) return 0;
      uint32_t held = millis() - id(esc_clone_dry_since);
      return held >= 120000 ? 0 : (120000 - held) / 1000.0f;

  - platform: template
    name: "Humidifier Cooldown Remaining"
    id: sens_hum_cooldown
    unit_of_measurement: "s"
    icon: "mdi:timer-lock-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(hum_off_at) == 0 || id(humidifier_demand).state) return 0;
      uint32_t mo = (uint32_t) id(hum_min_off_s) * 1000;
      uint32_t since = millis() - id(hum_off_at);
      return since >= mo ? 0 : (mo - since) / 1000.0f;

  - platform: template
    name: "Dehumidifier Cooldown Remaining"
    id: sens_dehum_cooldown
    unit_of_measurement: "s"
    icon: "mdi:timer-lock-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(dehum_off_at) == 0 || id(dehumidifier_demand).state) return 0;
      uint32_t since = millis() - id(dehum_off_at);
      return since >= 180000 ? 0 : (180000 - since) / 1000.0f;

  - platform: template
    name: "AC Cooldown Remaining"
    id: sens_ac_cooldown
    unit_of_measurement: "s"
    icon: "mdi:timer-lock-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(ac_off_at) == 0 || id(ac_demand).state) return 0;
      uint32_t since = millis() - id(ac_off_at);
      return since >= 180000 ? 0 : (180000 - since) / 1000.0f;

  - platform: template
    name: "Heater Cooldown Remaining"
    id: sens_heater_cooldown
    unit_of_measurement: "s"
    icon: "mdi:timer-lock-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(heater_off_at) == 0 || id(heater_demand).state) return 0;
      uint32_t mo = (uint32_t) id(heater_min_off_s) * 1000;
      uint32_t since = millis() - id(heater_off_at);
      return since >= mo ? 0 : (mo - since) / 1000.0f;

  - platform: template
    name: "Grow Mat Cooldown Remaining"
    id: sens_mat_cooldown
    unit_of_measurement: "s"
    icon: "mdi:timer-lock-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(mat_off_at) == 0 || id(growmat_demand).state) return 0;
      uint32_t mo = (uint32_t) id(mat_min_off_s) * 1000;
      uint32_t since = millis() - id(mat_off_at);
      return since >= mo ? 0 : (mo - since) / 1000.0f;

  - platform: template
    name: "Clone Humidifier Cooldown Remaining"
    id: sens_clone_hum_cooldown
    unit_of_measurement: "s"
    icon: "mdi:timer-lock-outline"
    entity_category: diagnostic
    update_interval: 10s
    filters:
      - delta: 0.5
    lambda: |-
      if (id(clone_hum_off_at) == 0 || id(clone_hum_demand).state) return 0;
      uint32_t mo = (uint32_t) id(clone_hum_min_off_s) * 1000;
      uint32_t since = millis() - id(clone_hum_off_at);
      return since >= mo ? 0 : (mo - since) / 1000.0f;

# ------------------------------------------------------------------
# OPTIONAL: real CO2 sensor (Sensirion SCD41). Drops onto the SAME
# I2C bus (GPIO21/22) — no new wiring. When the sensor arrives:
#   1) uncomment this block
#   2) delete the ADC "co2_voltage" + "Dynamic CO2 PPM" sensors above
#   3) point the OLED "CO2e" line at id(scd41_co2)
#   4) TIER-2 UPGRADE: point the sensor watchdog at scd41_temp as a
#      fallback before declaring fault (single-DHT22 trip today).
# ------------------------------------------------------------------
#   - platform: scd4x
#     address: 0x62
#     update_interval: 30s
#     co2:
#       name: "CO2"
#       id: scd41_co2
#     temperature:
#       name: "Temp (SCD41)"
#       id: scd41_temp
#     humidity:
#       name: "RH (SCD41)"
#       id: scd41_rh

# ------------------------------------------------------------------
# OPTIONAL: external Zigbee climate sensors, mirrored from Home
# Assistant. The battery Zigbee sensors stay paired to the coordinator
# on Digital-Home; the hub subscribes to their HA entities over the
# native API it already holds. TIER 3 — informational only:
#   * values only flow while HA is up (inverts the local-first rule)
#   * battery sensors report lazily (1-5+ min) — too stale for the
#     >35C failsafe or the watchdog. Use for canopy-average display /
#     sanity checks, never safety.
# Direct Zigbee on this board is not possible (WROOM-32 has no
# 802.15.4 radio) and a second coordinator would fragment the mesh.
# ------------------------------------------------------------------
#   - platform: homeassistant
#     id: zigbee_canopy_temp
#     entity_id: sensor.YOUR_ZIGBEE_TEMP_ENTITY
#     internal: true
#   - platform: homeassistant
#     id: zigbee_canopy_rh
#     entity_id: sensor.YOUR_ZIGBEE_RH_ENTITY
#     internal: true

  # ===== v2.4.1 · ESP-NOW ROOT-ZONE SENSORS (pot -> hub direct) ======
  # The HA-independence leg for the SENSING path, LIVE as of v2.4.1.
  # Each pot unicasts soil_temperature/soil_moisture straight to this
  # hub every 60s; HA is no longer in the mat's sense loop.
  # SOURCE PRIORITY (per pot, resolved in run_climate_logic):
  #   ESP-NOW fresh (<150s) -> HA mirror -> clone-AIR rung -> mat OFF
  # A dead router, an HA restart, or a pot WiFi drop each degrade one
  # rung of the chain instead of blinding the mat. Same plausibility
  # filter (5-45C) applies to every source. These four are internal —
  # HA already has the pots' own entities; re-exporting would twin them.
  - platform: packet_transport
    provider: dsc_pot1
    remote_id: soil_temperature
    id: rz_now_1
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) { id(rz_now_1_at) = millis(); id(last_valid_rootzone_time) = millis(); }
  - platform: packet_transport
    provider: dsc_pot2
    remote_id: soil_temperature
    id: rz_now_2
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) { id(rz_now_2_at) = millis(); id(last_valid_rootzone_time) = millis(); }
  - platform: packet_transport
    provider: dsc_pot3
    remote_id: soil_temperature
    id: rz_now_3
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) { id(rz_now_3_at) = millis(); id(last_valid_rootzone_time) = millis(); }
  - platform: packet_transport
    provider: dsc_pot4
    remote_id: soil_temperature
    id: rz_now_4
    internal: true
    on_value:
      - lambda: |-
          if (!isnan(x) && x > 5.0f && x < 45.0f) { id(rz_now_4_at) = millis(); id(last_valid_rootzone_time) = millis(); }

# ==========================================
# 7. BINARY SENSORS (status + UI buttons)
# ==========================================
binary_sensor:
  - platform: status
    name: "HA Link Status"
    id: ha_connected

  # True while WiFi is associated. Dashboard / alerts can show stack
  # health separately from HA Link (API client), which can flap alone.
  - platform: template
    name: "WiFi Associated"
    id: wifi_associated
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      auto *w = wifi::global_wifi_component;
      return w != nullptr && w->is_connected();

  - platform: template
    name: "Climate Sensor Fault"
    id: sensor_fault_bs
    device_class: problem
    lambda: 'return id(sensor_fault_active);'

  # v2.2: room/clone sensor soft fault. NEVER trips safe mode — the
  # router and reality gates just fall back to v2.1 behaviour.
  - platform: template
    name: "Aux Sensor Fault"
    id: aux_fault_bs
    device_class: problem
    lambda: 'return id(room_fault_active) || id(clone_fault_active);'

  # v2.4: root-zone probe soft fault (stale > 5 min). NEVER trips safe
  # mode — the closed-loop mat just falls back to the clone-AIR rung.
  # v2.4.1: "stale" now means NO pot probe has delivered a plausible
  # reading — one healthy probe keeps the loop alive.
  - platform: template
    name: "Root-Zone Sensor Fault"
    id: rootzone_fault_bs
    device_class: problem
    lambda: 'return id(rootzone_fault_active);'

  # >35 °C emergency vent — firmware owns the fans; HA gets a problem
  # sensor so phone alerts / dashboard match the panel fault bit.
  - platform: template
    name: "Emergency Failsafe"
    id: emergency_failsafe_bs
    device_class: problem
    icon: mdi:fire-alert
    lambda: 'return id(emergency_failsafe_active);'

  # ===== v2.4 · PHOTOPERIOD WINDOW EXPORTS ==========================
  # WHY THESE EXIST (six-month note): when the SF1000 moved to the 2x4
  # (topology Option A), the 4x8's photoperiod became a VIRTUAL clock —
  # run_photoperiod maintains lights_currently_on but drives no output.
  # That left HA with no way to see the 4x8 window at all: the old
  # dashboard measured "4x8 lights on today" off the SF1000, which now
  # reports the CLONE tent. Exporting the two window globals restores
  # honest light accounting and separates two things that are no longer
  # the same: the WINDOW (schedule truth) vs the LIGHT (what the SF1000
  # is actually doing). Manual Light Hold is exactly the case where they
  # diverge — and SF1000-on while the 2x4 window is shut is the herm
  # risk the dark-period alarm has to catch.
  #
  # device_class: running is deliberate, not cosmetic — the Home page
  # alert list auto-includes binary_sensor.dsc_* and excludes only
  # connectivity/running. Without it, "window open" would raise an
  # alert every single photoperiod.
  - platform: template
    name: "4x8 Window Open"
    id: main_window_bs
    icon: "mdi:sun-clock"
    device_class: running
    lambda: 'return id(lights_currently_on);'

  - platform: template
    name: "2x4 Window Open"
    id: clone_window_bs
    icon: "mdi:sun-clock-outline"
    device_class: running
    lambda: 'return id(clone_lights_on);'

  # ===== v2.4.1 · PER-POT ESP-NOW LINK WATCHDOGS ====================
  # Honest freshness-based link truth: ON while that pot's last
  # plausible ESP-NOW reading is under 150s old (2.5 missed sends).
  # device_class: connectivity — deliberately excluded from the Home
  # alert list auto-include, so a link blip never pages anyone; the
  # mat's own fallback chain is the functional response.
  - platform: template
    name: "POT1 ESP-NOW Link"
    id: pot1_espnow_link
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(rz_now_1_at) != 0 && (millis() - id(rz_now_1_at)) < 150000;'
  - platform: template
    name: "POT2 ESP-NOW Link"
    id: pot2_espnow_link
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(rz_now_2_at) != 0 && (millis() - id(rz_now_2_at)) < 150000;'
  - platform: template
    name: "POT3 ESP-NOW Link"
    id: pot3_espnow_link
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(rz_now_3_at) != 0 && (millis() - id(rz_now_3_at)) < 150000;'
  - platform: template
    name: "POT4 ESP-NOW Link"
    id: pot4_espnow_link
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(rz_now_4_at) != 0 && (millis() - id(rz_now_4_at)) < 150000;'

# ==========================================
# 8. SCRIPTS  (stage engine + climate + photoperiod)
# ==========================================
script:
  # ---- Optional AP pin: learn / prefer Nest BSSID (early, pre-GUI work) ----
  - id: wifi_ap_capture_now
    mode: single
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr || !w->is_connected()) {
            ESP_LOGW("wifi", "Remember AP: WiFi not connected");
            return;
          }
          auto b = w->wifi_bssid();
          char mac[18];
          snprintf(mac, sizeof(mac), "%02X:%02X:%02X:%02X:%02X:%02X",
                   b[0], b[1], b[2], b[3], b[4], b[5]);
          id(preferred_wifi_bssid).make_call().set_value(mac).perform();
          ESP_LOGI("wifi", "Remembered WiFi AP BSSID %s", mac);

  - id: wifi_ap_learn_or_pin
    mode: single
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr || !w->is_connected()) return;

          auto cur = w->wifi_bssid();
          char cur_mac[18];
          snprintf(cur_mac, sizeof(cur_mac), "%02X:%02X:%02X:%02X:%02X:%02X",
                   cur[0], cur[1], cur[2], cur[3], cur[4], cur[5]);

          std::string pref = id(preferred_wifi_bssid).state;
          // Auto-learn once while Lock is ON and preferred is empty.
          if (id(wifi_ap_lock).state && (pref.empty() || pref == "00:00:00:00:00:00")) {
            id(preferred_wifi_bssid).make_call().set_value(cur_mac).perform();
            pref = cur_mac;
            ESP_LOGI("wifi", "Lock WiFi AP: learned BSSID %s", cur_mac);
          }
          if (!id(wifi_ap_lock).state) return;
          if (pref.size() != 17) return;

          wifi::bssid_t want{};
          for (int i = 0; i < 6; i++) {
            char hex[3] = { pref[i * 3], pref[i * 3 + 1], 0 };
            want[i] = (uint8_t) strtol(hex, nullptr, 16);
          }
          // Prefer this Nest point on the next association.
          w->set_sta_priority(want, 127);
          bool same = true;
          for (int i = 0; i < 6; i++) if (cur[i] != want[i]) { same = false; break; }
          if (same) {
            ESP_LOGI("wifi", "On preferred AP %s (priority raised)", pref.c_str());
            return;
          }
          ESP_LOGW("wifi", "On %s but prefer %s — scheduling WiFi bounce", cur_mac, pref.c_str());
          id(link_wifi_bounce).execute();

  # ---- Link recovery (same ladder as Control/pots) ----
  - id: link_wifi_bounce
    mode: single
    then:
      - logger.log:
          level: WARN
          format: "link: WiFi bounce — API rebind + preferred BSSID rejoin"
      - wifi.disable:
      - delay: 3s
      - wifi.enable:
      - delay: 8s
      - lambda: |-
          ESP_LOGI("link", "WiFi bounce complete");
          id(wifi_ap_learn_or_pin).execute();
          id(tx_fleet_heartbeat).execute();
          id(tx_vitals).execute();

  # Wedged HA API while WiFi up — sync NVS then reboot. Caps at 2/boot.
  - id: stack_recovery_reboot
    mode: single
    then:
      - lambda: |-
          id(stack_recovery_reboots) = id(stack_recovery_reboots) + 1;
          ESP_LOGE("api",
                   "API RECOVERY #%d — WiFi up but HA session wedged; sync NVS + App.safe_reboot()",
                   id(stack_recovery_reboots));
          global_preferences->sync();
      - delay: 250ms
      - lambda: 'App.safe_reboot();'

  # ---- v2.4.3 · Engage the full automation stack (Full Auto entry) ----
  # Called the instant Full Auto is turned on (HA switch or OLED Mode menu):
  # arm every appliance rung AND the light schedule, and release Manual Light
  # Hold (this is the deliberate "the schedule owns the light now" moment).
  # The run_climate_logic top-of-loop guard KEEPS them armed thereafter, so
  # this is really just for instant HA feedback + the one-shot hold release.
  - id: arm_full_auto
    then:
      - lambda: |-
          id(humidifier_auto_enabled)   = true;
          id(dehumidifier_auto_enabled) = true;
          id(heater_auto_enabled)       = true;
          id(growmat_auto_enabled)      = true;
          id(ac_auto_enabled)           = true;
          id(clone_hum_auto_enabled)    = true;
          id(auto_photoperiod_enabled)  = true;
          id(manual_light_hold)         = false;   // schedule owns the light now
          // Publish to HA — bare global writes leave lambda switches stale on
          // the dashboard until something else republishes them.
          id(humidifier_auto_switch).publish_state(true);
          id(dehumidifier_auto_switch).publish_state(true);
          id(heater_auto_switch).publish_state(true);
          id(growmat_auto_switch).publish_state(true);
          id(ac_auto_switch).publish_state(true);
          id(clone_hum_auto_switch).publish_state(true);
          id(photoperiod_switch).publish_state(true);
          id(manual_light_hold_switch).publish_state(false);
          ESP_LOGI("mode", "Full Auto engaged -> ladder + photoperiod armed, light hold released");
      - script.execute: tx_panel_sync

  # ---- Load a stage's full climate envelope (STAGE CHANGE only) ----
  - id: apply_stage
    mode: restart
    then:
      - lambda: |-
          std::string s = id(grow_stage).current_option().str();
          // v2.3: OFF = 4x8 out of service. Don't touch the numeric targets
          // (so returning to a stage restores your fine-tuning); just drop
          // the tent from arbitration.
          // v2.4: the SF1000 is NOT this tent's light any more — stage Off
          // no longer writes the light. The 4x8 has no light to dark; its
          // VIRTUAL window just closes (lights_currently_on -> false), and
          // a clone in Follow-4x8 goes dark with it via the ramp engine.
          if (s == "Off") {
            id(main_active) = false;
            id(stage_short) = "OFF";
            id(stage_light_hours) = 0;
            id(lights_currently_on) = false;
            ESP_LOGI("grow", "Stage OFF -> 4x8 inactive (excluded from arbitration; virtual window closed)");
            return;
          }
          id(main_active) = true;
          float tt, vmin, vmax, rmin, rmax; int lh; std::string sh;
          if      (s == "Germination")             { tt=25; vmin=0.4f; vmax=0.8f; rmin=70; rmax=80; lh=18; sh="Germ"; }
          else if (s == "Seedling")                { tt=24; vmin=0.5f; vmax=0.8f; rmin=65; rmax=75; lh=18; sh="Seedling"; }
          else if (s == "Early Vegetative")        { tt=25; vmin=0.7f; vmax=1.0f; rmin=60; rmax=70; lh=18; sh="Early Veg"; }
          else if (s == "Vegetative")              { tt=26; vmin=0.8f; vmax=1.1f; rmin=55; rmax=65; lh=18; sh="Veg"; }
          else if (s == "Late (Push) Vegetative")  { tt=26; vmin=1.0f; vmax=1.2f; rmin=50; rmax=60; lh=18; sh="Push Veg"; }
          else if (s == "Early Flowering")         { tt=25; vmin=1.0f; vmax=1.2f; rmin=50; rmax=55; lh=12; sh="Early Flwr"; }
          else if (s == "Flowering")               { tt=24; vmin=1.2f; vmax=1.4f; rmin=45; rmax=50; lh=12; sh="Flower"; }
          else if (s == "Late Flowering")          { tt=22; vmin=1.3f; vmax=1.5f; rmin=40; rmax=45; lh=12; sh="Late Flwr"; }
          else if (s == "Final 48-72h Flowering")  { tt=21; vmin=1.4f; vmax=1.6f; rmin=35; rmax=45; lh=12; sh="Flush"; }
          else /* Dry Mode */                      { tt=19; vmin=0.8f; vmax=1.0f; rmin=55; rmax=62; lh=0;  sh="Dry"; }
          id(num_target_temp).make_call().set_value(tt).perform();
          id(num_vpd_min).make_call().set_value(vmin).perform();
          id(num_vpd_max).make_call().set_value(vmax).perform();
          id(num_rh_min).make_call().set_value(rmin).perform();
          id(num_rh_max).make_call().set_value(rmax).perform();
          id(stage_light_hours) = lh;
          id(stage_short) = sh;
          ESP_LOGI("grow", "Stage '%s': VPD %.1f-%.1f, RH %.0f-%.0f, %dh light",
                   s.c_str(), vmin, vmax, (float)rmin, (float)rmax, lh);

  # ---- BOOT variant: label + light hours ONLY. Never touches the
  # numeric targets, so reboots keep your fine-tuning intact. ----
  - id: apply_stage_boot
    mode: restart
    then:
      - lambda: |-
          std::string s = id(grow_stage).current_option().str();
          if (s == "Off") { id(main_active) = false; id(stage_short) = "OFF"; id(stage_light_hours) = 0;
                            ESP_LOGI("grow", "Boot: 4x8 stage OFF (inactive)"); return; }
          id(main_active) = true;
          if      (s == "Germination")             { id(stage_short) = "Germ";       id(stage_light_hours) = 18; }
          else if (s == "Seedling")                { id(stage_short) = "Seedling";   id(stage_light_hours) = 18; }
          else if (s == "Early Vegetative")        { id(stage_short) = "Early Veg";  id(stage_light_hours) = 18; }
          else if (s == "Vegetative")              { id(stage_short) = "Veg";        id(stage_light_hours) = 18; }
          else if (s == "Late (Push) Vegetative")  { id(stage_short) = "Push Veg";   id(stage_light_hours) = 18; }
          else if (s == "Early Flowering")         { id(stage_short) = "Early Flwr"; id(stage_light_hours) = 12; }
          else if (s == "Flowering")               { id(stage_short) = "Flower";     id(stage_light_hours) = 12; }
          else if (s == "Late Flowering")          { id(stage_short) = "Late Flwr";  id(stage_light_hours) = 12; }
          else if (s == "Final 48-72h Flowering")  { id(stage_short) = "Flush";      id(stage_light_hours) = 12; }
          else /* Dry Mode */                      { id(stage_short) = "Dry";        id(stage_light_hours) = 0;  }
          ESP_LOGI("grow", "Boot: stage '%s' relabelled (%dh light), targets untouched",
                   s.c_str(), id(stage_light_hours));

  # ---- v2.2 · Clone Mode loader. Presets write defaults ONCE into the
  # clone sliders (fine-tune persists after). Follow 4x8 / Custom never
  # write — Follow resolves against the live main targets at runtime.
  - id: apply_clone_mode
    mode: restart
    then:
      - lambda: |-
          std::string m = id(clone_mode).current_option().str();
          // v2.3: OFF = 2x4 out of service. Excluded from arbitration and
          // from its donor/reservoir role; its intake trickles (see
          // run_climate_logic). Sliders untouched.
          // v2.4: the SF1000 lives in THIS tent — Clone Mode Off darks it.
          if (m == "Off") {
            id(clone_mode_idx) = 4;   // vitals 0xD1 broadcasts this; panel maps 4="Off"
            id(clone_active) = false;
            id(clone_hum_demand).turn_off();
            id(clone_lights_on) = false;
            id(light_ramp_state) = 0;
            id(light_current_pct) = 0.0f;
            id(light_write_guard_until) = millis() + 1000;   // our write, don't self-latch
            id(light_sf1000).turn_off().perform();           // dark the tent now
            ESP_LOGI("clone", "Mode OFF -> 2x4 inactive (no draw, no donor, SF1000 off)");
            return;
          }
          id(clone_active) = true;
          if      (m == "Follow 4x8")  { id(clone_mode_idx) = 0; ESP_LOGI("clone", "Mode: Follow 4x8 (live main targets)"); return; }
          else if (m == "Mother")      { id(clone_mode_idx) = 2; }
          else if (m == "Custom")      { id(clone_mode_idx) = 3; ESP_LOGI("clone", "Mode: Custom (sliders untouched)"); return; }
          else                         { id(clone_mode_idx) = 1; }
          float tt, vmin, vmax, rmin, rmax;
          if (id(clone_mode_idx) == 2) { tt=25; vmin=0.8f; vmax=1.1f; rmin=55; rmax=65; }  // Mother = veg-like
          else                         { tt=24; vmin=0.4f; vmax=0.8f; rmin=70; rmax=80; }  // Clones & Seedlings
          id(num_clone_temp).make_call().set_value(tt).perform();
          id(num_clone_vpd_min).make_call().set_value(vmin).perform();
          id(num_clone_vpd_max).make_call().set_value(vmax).perform();
          id(num_clone_rh_min).make_call().set_value(rmin).perform();
          id(num_clone_rh_max).make_call().set_value(rmax).perform();
          ESP_LOGI("clone", "Mode '%s': VPD %.1f-%.1f, RH %.0f-%.0f, %.0fC",
                   m.c_str(), vmin, vmax, rmin, rmax, tt);

  # ---- Climate auto-curve + humidifier/dehumidifier demand ----
  - id: run_climate_logic
    mode: single
    then:
      - lambda: |-
          if (id(boot_resume_pending)) return;   // waiting on resume prompt
          if (id(emergency_failsafe_active)) return;
          if (id(sensor_fault_active)) return;   // watchdog has control
          if (id(ha_takeover_active)) return;    // v2.3: you hold the wheel

          // v2.4.3 · FULL AUTO IS THE MASTER SWITCH. While Full Auto is engaged
          // the whole automation stack stays armed — every appliance rung AND
          // the light schedule — so you never arm them piecemeal and a
          // settings-wipe can't leave them silent. (Boot default is Full Auto,
          // so a wiped NVS comes up fully automatic.) Manual Light Hold is NOT
          // cleared here — you can still grab the light in Full Auto; only an
          // explicit Full Auto turn-on releases it. To hand-manage ONE
          // appliance, drop to Manual mode and arm the rest individually.
          if (id(full_auto_mode)) {
            id(humidifier_auto_enabled)   = true;
            id(dehumidifier_auto_enabled) = true;
            id(heater_auto_enabled)       = true;
            id(growmat_auto_enabled)      = true;
            id(ac_auto_enabled)           = true;
            id(clone_hum_auto_enabled)    = true;
            id(auto_photoperiod_enabled)  = true;
          }

          float rh   = id(humidity_sensor).state;
          float temp = id(temp_sensor).state;
          float vpd  = id(vpd_sensor).state;
          int  strat = id(control_strategy_idx);

          // ===== v2.2 · AUX SENSOR READS (soft-fault aware) =====
          // room_ok / clone_ok false -> every v2.2 feature that leans on
          // that sensor silently reverts to v2.1 behaviour. Never less
          // safe than blind.
          float rm_t = id(room_temp).state,  rm_h = id(room_rh).state;
          float cl_t = id(clone_temp).state, cl_h = id(clone_rh).state;
          bool room_ok  = !id(room_fault_active)  && !isnan(rm_t) && !isnan(rm_h);
          bool clone_ok = !id(clone_fault_active) && !isnan(cl_t) && !isnan(cl_h);

          // Resolve clone targets: Follow 4x8 reads the LIVE main targets
          // so a stage change re-aims the clone tent too.
          // v2.4.1: the clone VPD ceiling resolves here too — the clone
          // humidifier rung is VPD-aware now.
          float c_tt, c_rmin, c_rmax, c_vmax;
          if (id(clone_mode_idx) == 0) {
            c_tt = id(stage_temp_target);
            c_rmin = fminf(id(stage_rh_min), id(stage_rh_max));      // QA guard:
            c_rmax = fmaxf(id(stage_rh_min), id(stage_rh_max));      // bands are
            c_vmax = fmaxf(id(stage_vpd_min), id(stage_vpd_max));    // normalised
          } else {                                                    // everywhere
            c_tt = id(clone_temp_target);
            c_rmin = fminf(id(clone_rh_min), id(clone_rh_max));
            c_rmax = fmaxf(id(clone_rh_min), id(clone_rh_max));
            c_vmax = fmaxf(id(clone_vpd_min), id(clone_vpd_max));
          }

          // Router status flags (feed the screensaver verbs at the bottom)
          bool heat_reuse = false;
          int  borrow = 0;            // 0=idle, else clone-path draw %
          int  borrow_why = 0;        // 1=heat, 2=humidity
          bool borrow_capped = false;
          int  clone_need = 15;       // clone tent's own exchange request
          // v2.4.1: root-zone runaway flag — set by the mat rung, read by
          // the fan router (flush the 2x4) and the status line.
          bool rz_runaway = false;

          // ============ APPLIANCE ESCALATION LADDER ============
          // Fans are attempt #1 (curve below reacts within 10s). Appliances
          // are attempt #2: demanded only when the condition PERSISTS
          // despite the fans. Timers reset the moment the condition clears
          // (and whenever the failsafe / watchdog engages — see those).
          {
            uint32_t nowms = millis();

            // ===== v2.3 · PRIORITY ARBITRATION ===================
            // The ROOM appliances (dehumidifier/humidifier/heater/AC) are
            // shared — they can only condition the room to ONE tent's
            // target at a time. Pick which tent they serve:
            //   only one active  -> that tent (priority by definition)
            //   both active      -> the Priority Tent select
            //   both off         -> nobody (rungs gated by *_live below)
            // The GROW MAT is deliberately NOT in this arbitration — it
            // lives in the 2x4 and is that tent's own local heat lever,
            // so it always tracks the clone tent regardless of priority.
            bool arb_main;
            if      (id(main_active) && !id(clone_active)) arb_main = true;
            else if (!id(main_active) && id(clone_active)) arb_main = false;
            else                                           arb_main = id(priority_tent_main);
            // Never arbitrate on a blind sensor: clone falls back to main.
            if (!arb_main && !clone_ok) arb_main = true;
            bool room_live = id(main_active) || id(clone_active);

            // BUG-FIX 2026-08-02: the release rungs below are room_live-
            // gated, so when the LAST active tent goes Off an already-ON
            // room demand (hum/dehum/heater/AC) would stay latched and the
            // HA followers would keep conditioning a dead room. Force-clear
            // on the true->false EDGE only (both tents inactive) and stamp
            // the min-off clocks so re-activation honours the cooldowns.
            // Transient single-tent Offs never trip this: room_live stays
            // true while the other tent is active.
            if (!room_live && id(prev_room_live)) {
              id(humidifier_demand).turn_off();
              id(dehumidifier_demand).turn_off();
              id(heater_demand).turn_off();
              id(ac_demand).turn_off();
              id(hum_off_at) = millis();   id(dehum_off_at) = millis();
              id(heater_off_at) = millis(); id(ac_off_at) = millis();
              ESP_LOGW("grow", "Both tents Off -> room appliance demands force-cleared");
            }
            id(prev_room_live) = room_live;

            // v2.4.2 (BUG-4): the room-appliance dwell-timers are global but
            // timed against the ARBITRATED tent. When arbitration flips (a
            // Priority Tent change, or a tent going Off<->On) while both tents
            // shared an alarm state, the newly-served tent inherited the old
            // tent's accumulated dwell -> an appliance could fire 0s later.
            // Reset the four room timers on any arbitration-identity change so
            // the new tent starts a fresh persistence window. (The mat and
            // clone-humidifier timers are 2x4-local, not arbitrated -> left.)
            if (arb_main != id(prev_arb_main)) {
              id(esc_humid_since) = 0; id(esc_dry_since) = 0;
              id(esc_deep_cold_since) = 0; id(esc_hot_since) = 0;
              id(prev_arb_main) = arb_main;
            }

            // Arbitrated tent's sensor + target + normalised RH band.
            // v2.4.1: + the arbitrated VPD and its ceiling, so the
            // humidifier rung sees the SAME variable the strategy chases.
            float a_t, a_rh, a_tgt, a_rhi, a_rlo, a_vpd, a_vmax;
            if (arb_main) {
              a_t = temp; a_rh = rh; a_tgt = id(stage_temp_target);
              a_rhi = fmaxf(id(stage_rh_max), id(stage_rh_min));   // QA: normalise
              a_rlo = fminf(id(stage_rh_max), id(stage_rh_min));
              a_vpd = vpd;
              a_vmax = fmaxf(id(stage_vpd_min), id(stage_vpd_max));
            } else {
              a_t = cl_t; a_rh = cl_h; a_tgt = c_tt;
              a_rhi = c_rmax; a_rlo = c_rmin;                      // already normalised
              a_vpd = id(clone_vpd).state;
              a_vmax = c_vmax;
            }

            // held-for tracker: returns how long (ms) cond has been true
            auto track = [nowms](bool cond, uint32_t &since) -> uint32_t {
              if (cond && since == 0) since = nowms;
              if (!cond) since = 0;
              return cond ? (nowms - since) : 0;
            };

            // ===== v2.2 · REALITY GATES (v2.3: room is the source) =====
            // "Fans had N minutes" only makes sense if the ROOM air the
            // appliances condition can actually move the arbitrated tent.
            // If not, waiting is theatre — cut the persistence window.
            // v5.1.0: start from NVS bases (Phase B / HA may clamp), then reality gates.
            uint32_t dehum_wait = id(base_dehum_wait_ms);
            uint32_t hum_wait   = id(base_hum_wait_ms);
            uint32_t heat_wait  = id(base_heat_wait_ms);
            uint32_t ac_wait    = id(base_ac_wait_ms);
            uint32_t mat_wait   = id(base_mat_wait_ms);
            if (dehum_wait < 60000) dehum_wait = 60000;
            if (hum_wait < 60000) hum_wait = 60000;
            if (heat_wait < 60000) heat_wait = 60000;
            if (ac_wait < 60000) ac_wait = 60000;
            if (mat_wait < 30000) mat_wait = 30000;
            if (room_ok && rm_h >= a_rhi)
              dehum_wait = 60000;   // room air can't pull RH below ceiling
            if (room_ok && rm_t >= a_tgt + 1.0f)
              ac_wait = 60000;      // venting can't cool below room temp
            {
              bool moist_src = room_ok && rm_h > a_rh + 5.0f;   // room can wet it
              bool warm_src  = room_ok && rm_t > a_t  + 1.0f;   // room can warm it
              if (!moist_src) hum_wait  = 60000;
              if (!warm_src)  heat_wait = 120000;
            }
            // stash gated windows for Fire Countdown sensors
            id(cur_dehum_wait) = dehum_wait; id(cur_hum_wait) = hum_wait;
            id(cur_heat_wait)  = heat_wait;  id(cur_ac_wait)  = ac_wait;
            id(cur_mat_wait)   = mat_wait;

            // Too humid -> DEHUMIDIFIER (fans had their window, RH still high)
            if (room_live && id(dehumidifier_auto_enabled) && !isnan(a_rh)) {
              // QA: compressor protection — never restart within 3 min.
              if (track(a_rh > a_rhi + 3.0f, id(esc_humid_since)) > dehum_wait && !id(dehumidifier_demand).state
                  && (nowms - id(dehum_off_at)) > 180000) {
                id(dehumidifier_demand).turn_on();
                ESP_LOGI("ladder", "%s RH %.0f%% > %.0f%% for %us -> DEHUMIDIFIER", arb_main?"4x8":"2x4", a_rh, a_rhi, (unsigned)(dehum_wait / 1000));
              }
              if (id(dehumidifier_demand).state && a_rh < a_rhi - 2.0f) {
                id(dehumidifier_demand).turn_off();
                id(dehum_off_at) = nowms;
              }
            }
            // Too dry -> HUMIDIFIER (v2.4: min off-time — no rapid re-fire)
            // v2.4.1 · VPD-AWARE: waiting on the RH floor alone let VPD
            // sail over its ceiling with the humidifier silent (19 Jul:
            // VPD 0.94/0.99 over ceiling, RH 63%, no response). Under the
            // VPD strategy "too dry" is EITHER the RH floor breach OR the
            // arbitrated VPD over its ceiling. Release requires BOTH
            // healthy (RH back above floor+2 AND VPD at/under ceiling) so
            // the rung can't chatter between two half-recovered signals.
            // QA guard: at high temp VPD can top its ceiling while RH is
            // AT/OVER its own ceiling (hot air holds more water). That is
            // a cooling problem, not a humidity one — the VPD leg only
            // arms while RH is safely under the ceiling (below the
            // dehumidifier's own release point, rhi-2, so the two rungs'
            // hysteresis bands can never overlap) and never while the
            // dehumidifier demand is live. No humidifier/dehumidifier war.
            if (room_live && id(humidifier_auto_enabled) && !isnan(a_rh)) {
              bool vpd_dry = (strat == 0) && !isnan(a_vpd) && a_vpd > a_vmax + 0.05f
                             && a_rh < a_rhi - 2.0f && !id(dehumidifier_demand).state;
              bool too_dry = (a_rh < a_rlo - 2.0f) || vpd_dry;
              if (track(too_dry, id(esc_dry_since)) > hum_wait && !id(humidifier_demand).state
                  && (nowms - id(hum_off_at)) > (uint32_t) id(hum_min_off_s) * 1000) {
                id(humidifier_demand).turn_on();
                ESP_LOGI("ladder", "%s RH %.0f%% (floor %.0f%%) VPD %.2f (ceil %.2f) for %us -> HUMIDIFIER",
                         arb_main?"4x8":"2x4", a_rh, a_rlo, a_vpd, a_vmax, (unsigned)(hum_wait / 1000));
              }
              if (id(humidifier_demand).state
                  && ((a_rh > a_rlo + 2.0f && (strat != 0 || isnan(a_vpd) || a_vpd <= a_vmax))
                      || a_rh >= a_rhi)) {
                id(humidifier_demand).turn_off();
                id(hum_off_at) = nowms;
              }
            }
            // ===== v2.2 · CLONE RUNG: clone tent too dry -> CLONE HUMIDIFIER
            // 2x4-local; runs on the CLONE sensor + targets whenever the
            // clone tent is active (independent of priority). Soft fault
            // clears it (watchdog) — never guess wet.
            // v2.4 · SHORT-CYCLING FIX: the v2.3 release point (c_rmin+2)
            // gave a 4% total band -> rapid on/off cycling + Scribe spam.
            // Release is now c_rmin + Clone Hum Hysteresis (default +6),
            // and a min off-time blocks immediate re-fire. Both runtime-
            // tunable — retune for the micro-mister without a reflash.
            // v2.4.1 · VPD-AWARE: same fix as the room rung — unrooted
            // clones transpire on VPD, not RH. Fire on the RH floor OR
            // clone VPD over its ceiling; release needs both healthy.
            if (id(clone_active) && id(clone_hum_auto_enabled) && clone_ok) {
              float c_vpd = id(clone_vpd).state;
              bool c_vpd_dry = !isnan(c_vpd) && c_vpd > c_vmax + 0.05f
                               && cl_h < c_rmax - 2.0f          // QA: same
                               && !id(dehumidifier_demand).state; // no-war guard
              bool c_too_dry = (cl_h < c_rmin - 2.0f) || c_vpd_dry;
              if (track(c_too_dry, id(esc_clone_dry_since)) > 120000 && !id(clone_hum_demand).state
                  && (nowms - id(clone_hum_off_at)) > (uint32_t) id(clone_hum_min_off_s) * 1000) {
                id(clone_hum_demand).turn_on();
                ESP_LOGI("ladder", "Clone RH %.0f%% (floor %.0f%%) VPD %.2f (ceil %.2f) for 2min -> CLONE HUMIDIFIER",
                         cl_h, c_rmin, c_vpd, c_vmax);
              }
              if (id(clone_hum_demand).state
                  && ((cl_h > c_rmin + id(clone_hum_hyst) && (isnan(c_vpd) || c_vpd <= c_vmax))
                      || cl_h >= c_rmax)) {
                id(clone_hum_demand).turn_off();
                id(clone_hum_off_at) = nowms;
              }
            }
            // ===== v2.4 · GROW MAT — CLOSED-LOOP ROOT-ZONE HEAT =====
            // The mat is a 2x4-local lever (v2.3), but its plate
            // thermostat regulates the mat SURFACE — a 22C setpoint sat
            // the root zone at 16-19C. The soil probes are the only
            // trustworthy sense points, so demand tracks ROOT-ZONE temp
            // (via HA): energise below Mat Root-Zone Low, cut at Mat
            // Root-Zone High (the band IS the hysteresis), with a min
            // off-time — soil is a slow thermal mass, no cycling.
            // v2.4.1 · MULTI-PROBE + RUNAWAY:
            //   * ALL FOUR pots are sensed now (POT1-only missed the cold
            //     POT4 on 19 Jul). Heat decisions use the COLDEST
            //     plausible probe — the mat must keep every pot warm.
            //   * PLAUSIBILITY FILTER (5-45C): a faulted probe (POT3
            //     reads a flat 0.0C) is ignored, so it can never peg the
            //     mat on — the exact blocker that parked min() in v2.4.
            //   * MAT VOTE switches (Mat Vote Pot 1-4): operator can
            //     exclude a pot from coldest/hottest voting without a
            //     reflash. POT3 defaults OFF (known fault). The root-
            //     zone watchdog heartbeat uses the same gate so an
            //     excluded probe cannot keep closed-loop "alive" alone.
            //   * RUNAWAY: hottest plausible probe >= High + 1C -> mat
            //     OFF immediately and the fan router flushes the 2x4
            //     with cooler room air. Fans handle runaway heat;
            //     the mat only ever ADDS heat.
            // FALLBACK CHAIN (never control on a blind sensor):
            //   any probe live -> closed-loop on the root zone
            //   all stale      -> v2.3 clone-AIR rung (clone sensor)
            //   fully blind    -> mat OFF (never guess root heat)
            if (id(clone_active) && id(growmat_auto_enabled)) {
              float rz_min = NAN, rz_max = NAN;
              {
                // v2.4.1 · SOURCE SELECT (per pot): ESP-NOW first — it is
                // local and survives HA loss — falling to the HA mirror
                // when that pot's direct link is stale (>150s = 2.5
                // missed 60s sends). Both sources feed the same
                // plausibility filter below, so a faulted probe is
                // ignored regardless of which path carried it.
                auto pick = [nowms](float now_v, uint32_t now_at, float ha_v) -> float {
                  bool fresh = now_at != 0 && (nowms - now_at) < 150000;
                  return fresh ? now_v : ha_v;
                };
                float probes[4] = {
                  pick(id(rz_now_1).state, id(rz_now_1_at), id(rootzone_temp).state),
                  pick(id(rz_now_2).state, id(rz_now_2_at), id(rootzone_temp_2).state),
                  pick(id(rz_now_3).state, id(rz_now_3_at), id(rootzone_temp_3).state),
                  pick(id(rz_now_4).state, id(rz_now_4_at), id(rootzone_temp_4).state) };
                bool vote[4] = {
                  id(mat_vote_1), id(mat_vote_2), id(mat_vote_3), id(mat_vote_4) };
                for (int i = 0; i < 4; i++) {
                  if (!vote[i]) continue;   // operator excluded this pot
                  float p = probes[i];
                  if (isnan(p) || p <= 5.0f || p >= 45.0f) continue;   // faulted/implausible
                  if (isnan(rz_min) || p < rz_min) rz_min = p;
                  if (isnan(rz_max) || p > rz_max) rz_max = p;
                }
              }
              bool rz_ok = !id(rootzone_fault_active) && !isnan(rz_min);
              bool mat_free = (nowms - id(mat_off_at)) > (uint32_t) id(mat_min_off_s) * 1000;
              if (rz_ok) {
                float rz_lo = fminf(id(mat_rz_low), id(mat_rz_high));   // QA guard:
                float rz_hi = fmaxf(id(mat_rz_low), id(mat_rz_high));   // band normalised
                // RUNAWAY first: overheating roots outrank everything —
                // a pot cooking at High+1 is a faster kill than a cold
                // one, so the flush wins even if another pot reads cold.
                if (rz_max >= rz_hi + 1.0f) {
                  rz_runaway = true;
                  id(esc_cold_since) = 0;
                  if (id(growmat_demand).state) {
                    id(growmat_demand).turn_off();
                    id(mat_off_at) = nowms;
                    ESP_LOGW("ladder", "Root zone %.1fC >= %.1fC RUNAWAY -> mat OFF, flushing 2x4 with room air", rz_max, rz_hi + 1.0f);
                  }
                }
                if (!rz_runaway) {
                  if (track(rz_min < rz_lo, id(esc_cold_since)) > mat_wait && !id(growmat_demand).state && mat_free) {
                    id(growmat_demand).turn_on();
                    ESP_LOGI("ladder", "Root zone (coldest pot) %.1fC < %.1fC -> GROW MAT (closed-loop)", rz_min, rz_lo);
                  }
                  if (id(growmat_demand).state && rz_min >= rz_hi) {
                    id(growmat_demand).turn_off();
                    id(mat_off_at) = nowms;
                    ESP_LOGI("ladder", "Root zone %.1fC >= %.1fC -> mat off (min-off %ds)", rz_min, rz_hi, id(mat_min_off_s));
                  }
                }
              } else if (clone_ok) {
                // v2.3 fallback: clone-AIR rung (probes stale / HA down)
                // v2.4.3 · ROOT-SAFE BAND: air is a POOR proxy for root temp —
                // soil lags the air by hours, so cutting the mat the instant
                // the AIR reaches target leaves the roots cold (the 10:32pm
                // bug). When truly blind we bias warm: on as soon as air is
                // below target, hold until air is 1.5C OVER target, driving
                // heat into the slow root mass. The mat's plate thermostat
                // still bounds its surface. (Stopgap — the real fix is keeping
                // the probe alive; see the watchdog heartbeat + ESP-NOW.)
                if (track(cl_t < c_tt, id(esc_cold_since)) > mat_wait && !id(growmat_demand).state && mat_free) {
                  id(growmat_demand).turn_on();
                  ESP_LOGW("ladder", "Clone AIR %.1fC < %.1fC -> GROW MAT (PROBES BLIND - air proxy, NOT a root reading)", cl_t, c_tt);
                }
                if (id(growmat_demand).state && cl_t >= c_tt + 1.5f) {
                  id(growmat_demand).turn_off();
                  id(mat_off_at) = nowms;
                  ESP_LOGW("ladder", "Clone AIR %.1fC >= %.1fC -> mat off (air proxy; restore the root probe)", cl_t, c_tt + 1.5f);
                }
              } else if (id(growmat_demand).state) {
                id(growmat_demand).turn_off();   // fully blind -> mat off
                id(mat_off_at) = nowms;
              }
            } else if (!id(clone_active) && id(growmat_demand).state) {
              id(growmat_demand).turn_off();   // 2x4 off -> mat off
              id(mat_off_at) = nowms;
            }
            // Too cold -> 750W HEATER (room appliance; serves the arbitrated
            // tent. Note: NOT gated behind the mat any more — the mat now
            // heats a different tent, so the heater escalates on its own
            // deep-cold timer against whichever tent owns the room.)
            // v2.4: min off-time (default 60s) — resistive load, so this
            // is relay hygiene, not compressor protection.
            if (room_live && id(heater_auto_enabled) && !isnan(a_t)) {
              if (track(a_t < a_tgt - 2.0f, id(esc_deep_cold_since)) > heat_wait && !id(heater_demand).state
                  && (nowms - id(heater_off_at)) > (uint32_t) id(heater_min_off_s) * 1000) {
                id(heater_demand).turn_on();
                ESP_LOGI("ladder", "%s %.1fC < %.1fC for %us -> HEATER", arb_main?"4x8":"2x4", a_t, a_tgt - 2.0f, (unsigned)(heat_wait / 1000));
              }
              if (id(heater_demand).state && a_t >= a_tgt - 0.5f) {
                id(heater_demand).turn_off();
                id(heater_off_at) = nowms;
              }
            }
            // Too hot -> AC (arbitrated tent held over target+2 despite fans)
            // v2.4.1 · FANS-FIRST GATE: "despite fans" was assumed, never
            // enforced — on 19 Jul the AC fired for the 2x4 while the
            // exchange fans idled. The AC may now only fire when the
            // arbitrated tent's fan lever is demonstrably saturated:
            //   4x8 -> OUT exhaust already driven to >= 80%
            //   2x4 -> the router reports the exchange path saturated
            //          (clone_fan_saturated: cooling flush requested AND
            //          the cap/budget ceiling already reached)
            // ...OR fans are physically useless (room air at/above the
            // target+1 — venting can't cool below source temp; same
            // physics as the reality gate that shortens ac_wait), OR the
            // room sensor is blind (never safer-than-blind), OR the fan
            // curve isn't running (manual/standby — ladder still signals).
            if (room_live && id(ac_auto_enabled) && !isnan(a_t)) {
              bool fans_useless = !room_ok || rm_t >= a_tgt + 1.0f;
              bool fans_maxed = arb_main
                  ? (id(fan_exhaust_out).state && id(fan_exhaust_out).speed >= 80)
                  : id(clone_fan_saturated);
              if (track(a_t > a_tgt + 2.0f, id(esc_hot_since)) > ac_wait && !id(ac_demand).state
                  && (fans_maxed || fans_useless || !id(full_auto_mode))
                  && (nowms - id(ac_off_at)) > 180000) {   // QA: compressor protection
                id(ac_demand).turn_on();
                ESP_LOGI("ladder", "%s %.1fC > %.1fC for %us (fans %s) -> AC", arb_main?"4x8":"2x4", a_t, a_tgt + 2.0f,
                         (unsigned)(ac_wait / 1000), fans_useless ? "useless (room warm)" : "saturated");
              }
              if (id(ac_demand).state && a_t <= a_tgt + 0.5f) {
                id(ac_demand).turn_off();
                id(ac_off_at) = nowms;
              }
            }
          }

          // ================= TWO-AXIS FAN CONTROL =================
          // OUT   (fan_exhaust_out)   -> outside: heat, RH overflow, fresh air
          // RECIRC(fan_exhaust_recirc)-> room:    VPD/RH air movement, hold heat
          // Blending the two IS the damper. Intakes slave to total exhaust.
          int out = 0, recirc = 0;
          bool rh_overflow = false;
          if (id(full_auto_mode) && !isnan(temp)) {
            float rmax = fmaxf(id(stage_rh_max), id(stage_rh_min));   // QA guard

            // ---- RECIRC: move air past canopy, feed moisture to the room ----
            recirc = 20;   // baseline circulation, always on
            if (strat == 0 && !isnan(vpd)) {                 // VPD strategy
              float vmin = fminf(id(stage_vpd_min), id(stage_vpd_max));   // QA guard
              float vmax = fmaxf(id(stage_vpd_min), id(stage_vpd_max));
              if (vpd < vmin - 0.30f) recirc = 100;          // way too humid
              else if (vpd < vmin - 0.20f) recirc = 80;
              else if (vpd < vmin - 0.10f) recirc = 60;
              else if (vpd < vmin) recirc = 45;              // slightly humid
              else if (vpd <= vmax) recirc = 30;             // in band
              else recirc = 20;                              // too dry -> ease off
            } else if (strat == 2 && !isnan(rh)) {           // Humidity strategy
              if (rh > rmax + 15.0f) recirc = 100;
              else if (rh > rmax + 10.0f) recirc = 80;
              else if (rh > rmax + 5.0f) recirc = 60;
              else if (rh > rmax) recirc = 45;
              else recirc = 25;
            } else {                                         // Temperature strategy
              recirc = 25;   // OUT does the heat work; RECIRC just circulates
            }

            // ---- OUT: expel heat / moisture overflow / fresh air ----
            // Fresh-air floor: no CO2 rig, so makeup air is the only CO2
            // top-up. Never let the loop fully close.
            out = 15;
            float target = id(stage_temp_target);
            if (temp >= target + 3.0f) out = 100;            // dump heat hard
            else if (temp >= target + 2.0f) out = 80;
            else if (temp >= target + 1.0f) out = 60;
            else if (temp >= target) out = 40;
            // Moisture overflow: RH way over ceiling -> vent outside NOW,
            // in parallel with the ladder deciding about the dehumidifier.
            if (!isnan(rh) && rh > rmax + 5.0f) {
              if (out < 70) out = 70;
              rh_overflow = true;
            }

            // ===== v2.2 · HEAT REUSE: where should shed heat GO? =====
            // Lights are heaters. If the tent must shed heat while the
            // SYSTEM is heat-poor (heating rungs live, or the room is
            // cold) and the room can still absorb it, route the shed
            // through RECIRC instead of dumping it outside — the main
            // intake pulls that warmth straight back as makeup air.
            // Moisture overflow always wins: recirculated moisture just
            // comes back; it has to physically leave the building.
            if (out > 15 && !rh_overflow && room_ok
                && rm_t < temp - 1.0f                       // room can absorb
                && (id(heater_demand).state || id(growmat_demand).state
                    || rm_t < target - 2.0f)) {             // system heat-poor
              int shed = out;
              if (recirc < shed) recirc = shed;             // shed to the room
              out = 15 + shed / 4;                          // fresh-air floor + trickle
              heat_reuse = true;
            }

            // ===== v2.3 · HEATER NO-EXTRACTION INTERLOCK ==========
            // Heat is expensive. If we're actively running the 750W heater
            // (or the mat), there's no sense blowing that bought heat out
            // the wall. Hard rule: whenever heater demand is live, OUT
            // drops to the fresh-air floor and the air routes RECIRC —
            // circulate and hold, don't vent. Moisture overflow still
            // wins (RH that high MUST leave the building), and the >35C
            // emergency purge is upstream of this whole block, so safety
            // is never trapped behind a closed damper.
            if (id(heater_demand).state && !rh_overflow) {
              if (recirc < out) recirc = out;   // keep canopy air moving inside
              if (recirc < 25)  recirc = 25;    // never fully still while heating
              out = 15;                          // fresh-air floor only
              heat_reuse = true;                 // (drives the status verb)
            }

            // ===== v2.2 · INTAKE ROUTER =============================
            // Negative-pressure budget preserved from v2.1: each intake
            // used to run at 0.7 * mean(exhaust); the router now PLACES
            // that same total across the two paths instead of mirroring.
            int budget = (int)(((out + recirc) / 2.0f) * 0.7f) * 2;

            // -- Clone protection cap: air exchange is what flushes a
            //    clone tent out of band. The 4x8 may only draw through
            //    the 2x4 up to this ceiling. QA: the cap is CONTINUOUS —
            //    a hard step made the router oscillate +-15% whenever a
            //    reading hovered on the boundary. Linear ramps have no
            //    boundary to oscillate around.
            //      RH:   20% at/below floor -> 40% at floor+3 -> 100% at floor+8
            //      Cold: 30% at target-1.5C -> 100% at target-0.5C
            //    Unknown clone env -> 25%.
            // v2.4.1: when the 2x4 ITSELF is overheating (air > target+2
            //    or root-zone runaway), the RH leg of the cap is relaxed
            //    to a 50% floor — moisture protection must not block
            //    emergency cooling of the same tent it protects. The
            //    cold leg stays: never room-flush a COLD clone tent.
            int cap = 100;
            if (clone_ok) {
              float cap_rh = 100.0f;
              if      (cl_h <= c_rmin)        cap_rh = 20.0f;
              else if (cl_h <  c_rmin + 3.0f) cap_rh = 20.0f + (cl_h - c_rmin) * (20.0f / 3.0f);
              else if (cl_h <  c_rmin + 8.0f) cap_rh = 40.0f + (cl_h - c_rmin - 3.0f) * (60.0f / 5.0f);
              bool clone_emergency_cool = (cl_t > c_tt + 2.0f) || rz_runaway;
              if (clone_emergency_cool && cap_rh < 50.0f) cap_rh = 50.0f;
              float cap_cold = 100.0f;
              if      (cl_t <= c_tt - 1.5f)   cap_cold = 30.0f;
              else if (cl_t <  c_tt - 0.5f)   cap_cold = 30.0f + (cl_t - (c_tt - 1.5f)) * 70.0f;
              cap = (int) fminf(cap_rh, cap_cold);
            } else cap = 25;

            // -- Clone tent's OWN need (mini-controller, source-gated:
            //    only ramp exchange when room air actually helps) --
            //    v2.3: an Off 2x4 draws only an anti-stagnation trickle.
            //    v2.4.1: FAN-FIRST COOLING ESCALATION — the exchange is
            //    graded on how far over target the 2x4 is (50/75/100%),
            //    so the fans demonstrably try before the AC rung may
            //    fire (its fans-first gate reads the saturation flag
            //    stashed below). Root-zone runaway flushes at >= 70%.
            //    Overheat outranks the dry-hold: heat kills clones
            //    faster than dry air does.
            if (clone_ok && id(clone_active)) {
              bool c_hot   = cl_t > c_tt + 1.0f;
              bool c_humid = cl_h > c_rmax + 3.0f;
              bool c_dry   = cl_h < c_rmin - 2.0f;
              if      (c_humid && room_ok && rm_h < cl_h - 3.0f) clone_need = 60; // room air can dry it
              else if (c_hot   && room_ok && rm_t < cl_t - 1.0f) clone_need = 50; // room air can cool it
              else if (c_humid || c_hot)                          clone_need = 30; // exchange helps a little
              if (c_dry) clone_need = 10;                  // hold the moisture in
              if (room_ok && rm_t < cl_t - 0.5f) {         // graded cooling (beats dry-hold)
                if      (cl_t > c_tt + 3.0f) { if (clone_need < 100) clone_need = 100; }
                else if (cl_t > c_tt + 2.0f) { if (clone_need < 75)  clone_need = 75;  }
              }
              if (rz_runaway && room_ok && rm_t < cl_t) {  // pots cooking -> flush
                if (clone_need < 70) clone_need = 70;
              }
            } else if (!id(clone_active)) {
              clone_need = 8;                              // 2x4 Off -> trickle only
            }

            // -- Donor selection for the 4x8: is warm/humid 2x4 air the
            //    better source than room air? (The whole point of the
            //    daisy-chain: a separate mini-lung on the counter-cycle.)
            //    v2.3: borrowing needs an ACTIVE 4x8 to serve AND an
            //    ACTIVE 2x4 to donate — an Off tent is neither.
            if (clone_ok && id(main_active) && id(clone_active)) {
              bool tent_needs_heat  = temp < target - 1.0f;
              bool tent_needs_humid = (!isnan(rh) && rh < id(stage_rh_min) - 2.0f)
                                   || (strat == 0 && !isnan(vpd) && vpd > id(stage_vpd_max) + 0.1f);
              bool clone_warmer  = !room_ok || (cl_t > rm_t + 1.0f);
              bool clone_moister = !room_ok || (cl_h > rm_h + 5.0f);
              if      (tent_needs_heat  && cl_t > temp + 0.5f && clone_warmer)  { borrow = 60; borrow_why = 1; }
              else if (tent_needs_humid && cl_h > rh   + 5.0f && clone_moister) { borrow = 50; borrow_why = 2; }
              if (borrow > cap) { borrow = cap; borrow_capped = true; }
            }

            int clone_i = clone_need > borrow ? clone_need : borrow;
            // QA: the protection cap is UNCONDITIONAL. Flushing a cold
            // clone tent with 60% room air chills clones faster than damp
            // air harms them — the cap always wins, own-need included.
            // (v2.4.1: the RH leg self-relaxes for emergency cooling of
            // the 2x4 itself, computed above — the COLD leg never does.)
            if (clone_i > cap) clone_i = cap;

            // QA: CHAIN SERVICE. The 2x4 only exchanges what the 4x8
            // exhausts (daisy-chain). If the clone flush wants more than
            // the current budget carries AND venting is climate-safe for
            // the 4x8 (at/above target, no heating demand, not reusing
            // heat), lift OUT gently — never past 45%.
            // v2.4.1: a 2x4 in emergency cooling (air > target+2 or
            // root-zone runaway) may lift even with the 4x8 under target
            // — shed-heat economy never outranks cooking clones — and
            // the lift ceiling rises to 60%. Heater/mat guards stay.
            {
              bool clone_overheat = clone_ok && id(clone_active)
                                    && ((cl_t > c_tt + 2.0f) || rz_runaway);
              if (clone_i > budget && (temp >= target || clone_overheat) && !heat_reuse
                  && (!room_ok || rm_t < temp + 0.5f)      // QA: never lift OUT to
                  && !id(heater_demand).state              // suck a hotter room in
                  && !id(growmat_demand).state) {
                int lift_max = clone_overheat ? 60 : 45;
                int lift = 15 + (clone_i - budget) / 2;
                if (lift > lift_max) lift = lift_max;
                if (out < lift) out = lift;
                budget = (int)(((out + recirc) / 2.0f) * 0.7f) * 2;
              }
            }

            // QA: CHAIN SERVICE (borrow leg). Drawing conditioned 2x4 air
            // requires the 4x8 to exhaust the same volume — via RECIRC,
            // so the borrowed heat/moisture loops through the ROOM and
            // back, instead of being thrown outside. Bounded at 70%.
            if (borrow > 0 && clone_i > budget) {
              int r2 = (int) ceilf(clone_i / 0.7f) - out;
              if (r2 > 70) r2 = 70;
              if (recirc < r2) recirc = r2;
              budget = (int)(((out + recirc) / 2.0f) * 0.7f) * 2;
            }

            // QA: NEGATIVE PRESSURE IS A HARD INVARIANT. The intakes may
            // never place more air than the exhaust budget carries — a
            // positive tent leaks smell through every seam.
            if (clone_i > budget) clone_i = budget;
            // v2.4.1: stash "the 2x4 exchange path is saturated" for the
            // AC fans-first gate: a cooling flush was requested AND the
            // router has given it everything the cap/budget allow. The
            // ladder reads this NEXT tick (10s later) — by the time the
            // AC's 60-300s persistence window has elapsed, this flag is
            // long since honest.
            id(clone_fan_saturated) = (clone_need >= 50)
                && (clone_i >= cap - 2 || clone_i >= budget - 2 || clone_i >= 95);
            int main_i  = budget - clone_i;
            if (main_i > 100) {                       // main saturated: overflow
              int spill = main_i - 100;               // to the clone path, but
              int room_left = cap - clone_i;          // NEVER past the cap
              if (room_left > 0) clone_i += spill < room_left ? spill : room_left;
              main_i = 100;
            }
            if (main_i < 0) main_i = 0;

            // v2.3: an Off tent draws only an anti-stagnation trickle so
            // the room's conditioned air isn't wasted on an empty tent —
            // this is the "energy goes to the tent that's ON" win.
            // Clamping DOWN is always negative-pressure-safe (less air in).
            if (!id(clone_active) && clone_i > 8) clone_i = 8;
            if (!id(main_active)  && main_i  > 8) main_i  = 8;

            // v2.4.2 · HUMIDIFIER INTAKE ROUTING: the room humidifier plume
            // sits AT the intake mouths, so the intakes are its delivery
            // valves — running an intake injects humidifier moisture into
            // THAT tent. Starve the intake of any ACTIVE tent already at/above
            // its RH floor (doesn't need moisture) and not calling for cooling,
            // so the plume concentrates on the tent that's actually dry. The
            // room humidifier only fires when the ARBITRATED tent is dry, so
            // that tent (below its floor) is never clamped here — it keeps
            // drinking the plume; the satisfied tent stops inhaling it.
            // Clamp-DOWN only (12% trickle) -> always negative-pressure-safe;
            // the starved tent draws door-undercut makeup instead. Sim: flips
            // the delivery split from ~62% into the wrong tent to ~64% into
            // the right one. A switch (default on) — reversible if it moves.
            if (id(hum_intake_routing) && id(humidifier_demand).state) {
              float mrlo = fminf(id(stage_rh_min), id(stage_rh_max));
              if (id(main_active) && !isnan(rh) && rh >= mrlo
                  && !isnan(temp) && temp <= target + 1.0f && main_i > 12) main_i = 12;
              if (id(clone_active) && clone_ok && cl_h >= c_rmin
                  && cl_t <= c_tt + 1.0f && clone_i > 12) clone_i = 12;
            }

            // Slew-limit both paths (±15%/10s tick): the router must
            // never oscillate between donors on sensor jitter.
            auto slew = [](int cur, int tgt) {
              int d = tgt - cur;
              if (d >  15) d =  15;
              if (d < -15) d = -15;
              return cur + d;
            };
            clone_i = slew(id(cur_intake_clone), clone_i);
            main_i  = slew(id(cur_intake_main),  main_i);
            // v2.4.1 QA: negative pressure is a HARD invariant even
            // MID-SLEW. A budget collapse (e.g. the heater interlock
            // cutting OUT while the intakes were still ramping) could
            // otherwise leave the slewed intakes above the new budget
            // for a tick or two. Trimming DOWN bypasses the slew — less
            // air in is always safe; fresh-air leg is trimmed first so
            // an active clone flush survives.
            {
              int over = (clone_i + main_i) - budget;
              if (over > 0) {
                int cut = over < main_i ? over : main_i;
                main_i -= cut; over -= cut;
                if (over > 0) clone_i = clone_i > over ? clone_i - over : 0;
              }
            }
            id(cur_intake_clone) = clone_i;
            id(cur_intake_main)  = main_i;

            // v2.4.2 · RECIRC DE-STRAT PULSE: a brief periodic RECIRC burst to
            // re-entrain the canopy/corner dead air a steady low baseline
            // leaves stagnant. This is MIXING/de-stratifying — a duct fan won't
            // wave the canopy (that's the little oscillating fans' job). Applied
            // AFTER the intake budget, so a higher RECIRC only makes the tent
            // more negative (safe); only ever RAISES an idle RECIRC, never
            // lowers a working VPD/RH-driven one. Runtime period/burst/level.
            if (id(destrat_pulse_enable) && id(destrat_period_s) > 0 && id(destrat_burst_s) > 0) {
              uint32_t ph = (millis() / 1000) % (uint32_t) id(destrat_period_s);
              if (ph < (uint32_t) id(destrat_burst_s) && recirc < id(destrat_burst_pct))
                recirc = id(destrat_burst_pct);
            }

            auto co = id(fan_exhaust_out).make_call();    co.set_state(out > 0);     co.set_speed(out);     co.perform();
            auto cr = id(fan_exhaust_recirc).make_call(); cr.set_state(recirc > 0);  cr.set_speed(recirc);  cr.perform();
            auto ci = id(fan_intake_main).make_call();    ci.set_state(main_i > 0);  ci.set_speed(main_i);  ci.perform();
            auto cc = id(fan_intake_clone).make_call();   cc.set_state(clone_i > 0); cc.set_speed(clone_i); cc.perform();
          }

          // ---- Build the live "Running:" status line (screensaver) ----
          {
            std::string s;
            auto add = [&s](const char *p) { if (!s.empty()) s += ",   "; s += p; };
            char b[72];
            if (id(ha_takeover_active)) {
              add("MANUAL TAKEOVER - you own every output (safety still armed)");
            } else if (!id(full_auto_mode)) {
              add(id(local_manual_mode).state ? "Manual control - holding set fan levels"
                                              : "Standby - HA driving outputs directly");
            } else if (isnan(temp)) {
              add("Waiting on climate sensor");
            } else {
              // v2.3: say who's live + who the room is serving
              if (!id(main_active) && !id(clone_active)) add("both tents Off - idle");
              else if (!id(main_active))                 add("4x8 Off - room serving 2x4 clone");
              else if (!id(clone_active))                add("2x4 Off - room serving 4x8");
              else add(id(priority_tent_main) ? "both live - 4x8 has room priority"
                                              : "both live - 2x4 has room priority");
              if (id(dehumidifier_demand).state)      add("Dehumidifier called in");
              else if (id(humidifier_demand).state)   add("Humidifier called in");
              if (id(ac_demand).state)                add("AC cooling (max 20C)");
              if (id(heater_demand).state)            add("heater assisting (venting held - reusing heat)");
              else if (id(growmat_demand).state)      add("grow mat warming 2x4 roots");
              // v2.4.1: root-zone runaway is loud — it's the fans' job now
              if (rz_runaway)          add("ROOT ZONE HOT - mat cut, flushing 2x4 with room air");
              // Air routing (which way is the air going, and why)
              if (rh_overflow)         add("venting moisture outside (room dehumidifier maxed)");
              else if (heat_reuse)     add("recycling tent heat into the room");
              else if (out >= 60)      add("venting outside to dump heat");
              else if (recirc >= 60)   add("recirculating hard through the room");
              else if (recirc > 25)    add("moving air, holding heat in room");
              else                     add("gentle recirculation + fresh-air trickle");
              // v2.2: donor selection — say WHICH air the 4x8 is drinking
              if (borrow_why == 1)      add(borrow_capped ? "drawing warm 2x4 air (capped - protecting clones)"
                                                          : "drawing warm 2x4 air into the 4x8");
              else if (borrow_why == 2) add(borrow_capped ? "borrowing 2x4 humidity (capped - protecting clones)"
                                                          : "borrowing 2x4 humidity for the 4x8");
              if (clone_need >= 50)     add("flushing clone tent with room air");
              else if (clone_need <= 10 && clone_ok) add("holding clone tent moisture in");
              add("maintaining internal negative pressure");
              if (strat == 0 && !isnan(vpd)) {
                if (vpd < id(stage_vpd_min))      { snprintf(b, sizeof(b), "raising VPD to target: %.1f", id(stage_vpd_min)); add(b); }
                else if (vpd > id(stage_vpd_max)) { snprintf(b, sizeof(b), "lowering VPD to target: %.1f", id(stage_vpd_max)); add(b); }
                else                              { snprintf(b, sizeof(b), "VPD %.2f inside %.1f-%.1f band", vpd, id(stage_vpd_min), id(stage_vpd_max)); add(b); }
              } else if (strat == 1) {
                float tt = id(stage_temp_target);
                if (temp >= tt + 1.0f)      { snprintf(b, sizeof(b), "cooling toward %.0fC (venting out)", tt); add(b); }
                else if (temp <= tt - 1.0f) { add("trying to maintain heat (recirculating)"); }
                else                        { snprintf(b, sizeof(b), "holding temp at %.0fC", tt); add(b); }
              } else if (!isnan(rh)) {
                if (rh > id(stage_rh_max))      { snprintf(b, sizeof(b), "pulling RH down to %.0f%%", id(stage_rh_max)); add(b); }
                else if (rh < id(stage_rh_min)) { snprintf(b, sizeof(b), "conserving RH above %.0f%%", id(stage_rh_min)); add(b); }
                else                            { snprintf(b, sizeof(b), "RH %.0f%% inside band", rh); add(b); }
              }
            }
            // v2.2: clone tent voice (v2.4: LED demand retired — the
            // SF1000 ramp verbs below ARE the clone light's voice now)
            if (id(clone_hum_demand).state)     add("clone humidifier called in");
            if (id(room_fault_active))          add("room sensor offline (v2.1 fallback)");
            if (id(clone_fault_active))         add("clone sensor offline (v2.1 fallback)");
            if (id(rootzone_fault_active) && id(growmat_auto_enabled))
                                                add("root-zone probes offline (mat on air fallback)");
            if (id(manual_light_hold))          add("SF1000 held manually (resumes at clone lights-off)");
            if (id(light_ramp_state) == 1)      { snprintf(b, sizeof(b), "clone sunrise ramp at %d%%", (int) id(light_current_pct)); add(b); }
            else if (id(light_ramp_state) == 2) { snprintf(b, sizeof(b), "clone sunset dimming at %d%%", (int) id(light_current_pct)); add(b); }
            id(auto_status_text) = s;
          }

  # ---- LIVE APPLY for the OLED adjust pages ----
  # Called on every dial detent while adjusting: the value takes effect
  # AS you scroll (no confirm needed).
  #   Fans  : first detent engages Manual Override (FANS ONLY — the
  #           photoperiod keeps driving the light).
  #   Light : first detent sets Manual Light Hold (LIGHT ONLY — the
  #           schedule pauses and self-heals at the next lights-off).
  #   Sunrise/Sunset minutes are live globals; no hold of any kind.
  - id: apply_live_adjust
    mode: restart
    then:
      - lambda: |-
          if (id(current_page) == 3) {                 // fans
            id(full_auto_mode) = false;
            if (!id(local_manual_mode).state) {
              id(local_manual_mode).turn_on();
              id(manual_banner_until) = millis() + 2000;   // flash the banner
            }
            switch (id(adjusting_item)) {
              case 0: { int v = id(local_target_out);          auto c = id(fan_exhaust_out).make_call();    c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
              case 1: { int v = id(local_target_recirc);       auto c = id(fan_exhaust_recirc).make_call(); c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
              case 2: { int v = id(local_target_intake_main);  auto c = id(fan_intake_main).make_call();    c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
              case 3: { int v = id(local_target_intake_clone); auto c = id(fan_intake_clone).make_call();   c.set_state(v > 0); c.set_speed(v); c.perform(); break; }
            }
          } else if (id(current_page) == 5 && id(adjusting_item) == 0) {   // SF1000
            if (!id(manual_light_hold)) {
              id(manual_light_hold) = true;                  // light-only hold
              id(manual_banner_until) = millis() + 2000;
            }
            int v = id(local_target_sf1000);
            id(light_write_guard_until) = millis() + 1000;   // v2.3: dial write (hold already latched above)
            if (v > 0) { auto l = id(light_sf1000).turn_on(); l.set_brightness(v / 100.0f); l.set_transition_length(200); l.perform(); }
            else id(light_sf1000).turn_off().perform();
          }

  # ---- v2.4 · MAIN (4x8) PHOTOPERIOD — VIRTUAL SCHEDULE ----
  # The SF1000 moved to the clone tent (topology Option A); the 4x8
  # currently has NO light and NO PWM module. This script now ONLY
  # maintains lights_currently_on (the 4x8 window truth) so Follow-4x8,
  # the counter-cycle thermal logic, the OLED countdowns and the boot
  # prompt keep working. NO output writes -> no guards needed; it is
  # just a clock. When a 4x8 light lands (GPIO5 reserved), re-attach an
  # output here and lift the ramp maths from run_clone_photoperiod.
  - id: run_photoperiod
    mode: single
    then:
      - lambda: |-
          int dur = id(stage_light_hours);
          if (!id(main_active) || dur <= 0) { id(lights_currently_on) = false; return; }
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          if (!now.is_valid()) return;           // no clock yet -> hold last truth
          int cur  = now.hour * 60 + now.minute;
          int on_m = id(lights_on_time).hour * 60 + id(lights_on_time).minute;
          id(lights_currently_on) = ((cur - on_m + 1440) % 1440) < dur * 60;   // midnight wrap

  # ---- v2.4 · CLONE PHOTOPERIOD — THE SF1000 RAMP ENGINE ----
  # (was: binary Clone LED Demand flipper — retired with the demand.)
  # The SF1000 is the clone tent's light, so the full ramp engine lives
  # here now:
  #   lights-on  ......... 0% -> target% over "Sunrise Duration" min
  #   steady     ......... hold target%
  #   window end ......... target% -> 0% over "Sunset Duration" min,
  #                        finishing exactly AT clone lights-off.
  # If sunrise+sunset ever exceed the window, both scale down to fit.
  # Window source: Follow 4x8 mirrors the VIRTUAL main window (its
  # clock + duration, so ramps align to the 4x8 schedule); Independent
  # runs on Clone Lights-On Time + Clone Light Hours (default 18:00 —
  # the counter-cycle that makes the 2x4 the warm night reservoir).
  # Manual Light Hold self-heals at the CLONE lights-off boundary.
  # During the >35C emergency the trip handler owns the light; the
  # schedule re-asserts within 15s of clear.
  # NOTE: the ramp-floor remap (1k pull-down dead zone) happens in the
  # OUTPUT (min_power) — this engine still reasons in honest 0-100%.
  - id: run_clone_photoperiod
    mode: single
    then:
      - lambda: |-
          if (id(boot_resume_pending)) return;    // waiting on resume prompt
          if (id(emergency_failsafe_active)) return;  // trip handler owns the light
          if (id(ha_takeover_active)) { id(light_ramp_state) = 0; return; }  // you own the light
          if (!id(clone_active)) {                // 2x4 Off: apply_clone_mode already darked it
            id(clone_lights_on) = false;
            id(light_ramp_state) = 0;
            return;
          }
          if (!id(auto_photoperiod_enabled)) { id(light_ramp_state) = 0; return; }

          // v2.4.1 · LATCH FIX: v2.4 stamped a blanket 15.5s write-guard
          // here on EVERY 15s tick — so the guard was permanently live
          // whenever the schedule was armed, an external SF1000 change
          // (HA slider / dial) could never latch Manual Light Hold, and
          // the ramp silently overwrote it on the next tick. That is the
          // v2.2 "lights fight me from HA" bug back from the dead. The
          // guard is now stamped per-WRITE (2s), immediately before each
          // light call — device writes still never self-latch, and the
          // ~13s gap between ticks is where an external touch is heard
          // and latches the hold as designed.

          // Resolve the window source
          int dur, on_m;
          if (id(clone_photo_follow)) {
            dur  = id(main_active) ? id(stage_light_hours) : 0;   // following an Off 4x8 = dark
            on_m = id(lights_on_time).hour * 60 + id(lights_on_time).minute;
          } else {
            dur  = id(clone_light_hours);
            on_m = id(clone_lights_on_time).hour * 60 + id(clone_lights_on_time).minute;
          }

          if (dur <= 0) {                        // dark mode / following an Off or Dry 4x8
            if (id(manual_light_hold)) {         // explicit user hold wins;
              id(light_ramp_state) = 0;          // no window = no self-heal,
              id(light_current_pct) = id(light_sf1000).remote_values.is_on()   // clear via HA switch
                  ? id(light_sf1000).remote_values.get_brightness() * 100.0f : 0.0f;
              return;
            }
            id(light_write_guard_until) = millis() + 2000;   // our write
            id(light_sf1000).turn_off().perform();
            id(clone_lights_on) = false;
            id(light_ramp_state) = 0;
            id(light_current_pct) = 0.0f;
            return;
          }

          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(grow_time).now();
          if (!now.is_valid()) return;           // no clock yet -> leave the light

          // Seconds-resolution clock for a smooth ramp
          float cur  = now.hour * 60.0f + now.minute + now.second / 60.0f;
          float window   = dur * 60.0f;
          float since_on = fmodf(cur - on_m + 1440.0f, 1440.0f);   // handles midnight wrap
          bool was_on = id(clone_lights_on);
          bool on = since_on < window;
          id(clone_lights_on) = on;

          // MANUAL LIGHT HOLD: the schedule keeps ticking (so the display
          // and countdowns stay honest) but the device does NOT touch the
          // light. SELF-HEALS at the CLONE lights-off boundary: a daytime
          // tweak resumes the schedule overnight, so the dark window is
          // always enforced from the next cycle onward — no herm trap.
          if (id(manual_light_hold)) {
            if (was_on && !on) {
              id(manual_light_hold) = false;
              ESP_LOGI("photoperiod", "Clone lights-off boundary -> manual light hold released, schedule resumes");
              // fall through: the !on branch below turns the light off now
            } else {
              id(light_ramp_state) = 0;
              id(light_current_pct) = id(light_sf1000).remote_values.is_on()
                  ? id(light_sf1000).remote_values.get_brightness() * 100.0f : 0.0f;
              return;
            }
          }

          if (!on) {
            id(light_write_guard_until) = millis() + 2000;   // our write
            id(light_sf1000).turn_off().perform();
            id(light_ramp_state) = 0;
            id(light_current_pct) = 0.0f;
            return;
          }

          float target = (float) id(local_target_sf1000);          // the "X%"
          float rise   = (float) id(sunrise_minutes);              // the "Y min"
          float fall   = (float) id(sunset_minutes);
          if (rise + fall > window && (rise + fall) > 0.0f) {      // never overlap
            float k = window / (rise + fall);
            rise *= k; fall *= k;
          }

          float to_off = window - since_on;
          float pct; int ramp;
          if (rise > 0.0f && since_on < rise)    { pct = target * (since_on / rise); ramp = 1; }
          else if (fall > 0.0f && to_off < fall) { pct = target * (to_off / fall);   ramp = 2; }
          else                                   { pct = target;                     ramp = 0; }
          id(light_ramp_state)  = ramp;
          id(light_current_pct) = pct;

          if (pct >= 0.5f) {
            id(light_write_guard_until) = millis() + 2000;   // our write
            auto l = id(light_sf1000).turn_on();
            l.set_brightness(pct / 100.0f);
            // Glide between 15s updates while ramping so it looks continuous
            l.set_transition_length(ramp != 0 ? 14000 : 1000);
            l.perform();
          } else {
            id(light_write_guard_until) = millis() + 2000;   // our write
            id(light_sf1000).turn_off().perform();
          }

# ==========================================
# 9. PERIODIC LOOPS
# ==========================================
interval:
  - interval: 10s
    then:
      - script.execute: run_climate_logic

  # 15s cadence keeps the sunrise/sunset ramp visually continuous
  # (each update glides via a 14s light transition).
  - interval: 15s
    then:
      - script.execute: run_photoperiod
      - script.execute: run_clone_photoperiod

  # ---- Boot-resume countdown: starts once the clock syncs (or after a
  # 2 min cap if WiFi/SNTP is down, so fans never wait forever) ----
  - interval: 1s
    then:
      - lambda: |-
          if (!id(boot_resume_pending)) return;
          auto t = id(sntp_time).now();
          if (!t.is_valid()) t = id(grow_time).now();
          if (id(boot_time_synced_at) == 0 && (t.is_valid() || millis() > 120000))
            id(boot_time_synced_at) = millis();
          if (id(boot_time_synced_at) != 0 && (millis() - id(boot_time_synced_at)) > 60000) {
            id(boot_resume_pending) = false;
            // Belt-and-suspenders for anything still using the old resume
            // gate: if Full Auto was restored ON, re-arm the stack.
            if (!id(ha_takeover_active) && id(full_auto_mode)) {
              id(full_auto_switch).publish_state(true);
              id(arm_full_auto).execute();
              ESP_LOGI("boot", "Resume gate cleared -> Full Auto re-armed from persisted ON");
            } else {
              ESP_LOGI("boot", "Resume prompt timed out");
            }
          }

  # ---- 1h trend sampler: 12-slot ring buffer, one sample / 5 min ----
  - interval: 300s
    then:
      - lambda: |-
          int i = id(hist_idx);
          id(hist_temp)[i] = id(temp_sensor).state;
          id(hist_rh)[i]   = id(humidity_sensor).state;
          id(hist_vpd)[i]  = id(vpd_sensor).state;
          id(hist_cvpd)[i] = id(clone_vpd).state;    // v2.2: Clone page spark
          id(hist_idx) = (i + 1) % 12;
          if (id(hist_idx) == 0) id(hist_filled) = true;

  # ---- WiFi channel poll (Nest/mesh can hop without reconnect) ----
  # ESP-NOW rides the STA channel; silent hops split hub ↔ panel/pots.
  - interval: 30s
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;
          static int poll_ch = 0;
          int ch = (int) w->get_wifi_channel();
          if (ch <= 0) return;
          if (poll_ch != 0 && poll_ch != ch)
            ESP_LOGW("wifi", "channel hop %d -> %d — panel ESP-NOW will drop until it follows", poll_ch, ch);
          poll_ch = ch;

  # ---- Hub link recovery (same ladder as Control/pots) ----
  # API wedge OR panel ESP-NOW gone quiet after it was alive.
  # BUG-FIX 2026-08-02 cadence: HA handshake pings every 30s, panel
  # keepalives every 15s — every stage waits ≥3 missed beats:
  #   API  ≥90s / panel ≥45s → fleet heartbeat + vitals nudge
  #   API ≥180s              → WiFi bounce (API wedge ONLY)
  #   API ≥300s              → sync NVS + safe_reboot (max 2/boot)
  # Panel-only silence never bounces or reboots the hub (climate stays
  # local-first; the panel has its own recovery ladder).
  # WiFi-down is logged only.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u) return false;
              auto *w = wifi::global_wifi_component;
              if (w == nullptr || !w->is_connected()) return false;
              if (id(link_rec_last_action) != 0 &&
                  (millis() - id(link_rec_last_action)) < 20000u) return false;

              // Healthy API clears stage.
              // BUG-FIX 2026-08-02: handshake thresholds retuned to the HA
              // ping cadence (30s — see dsc_v4_automations.yaml). The old
              // 45s gate vs a 60s ping flagged api_problem every healthy
              // minute. 90s = 3 missed pings before stage-1; bounce 180s;
              // reboot 300s (matches the documented "silent ≥5 min").
              bool api_ok = id(ha_connected).state;
              if (api_ok) id(api_ever_connected) = true;
              bool hs_ok = id(ha_handshake_seen) && id(ha_handshake_last) != 0 &&
                           (millis() - id(ha_handshake_last)) < 90000u;
              if (api_ok || hs_ok) {
                id(api_down_since) = 0;
              }

              bool api_problem = false;
              if (id(ha_handshake_seen) && id(ha_handshake_last) != 0) {
                api_problem = (millis() - id(ha_handshake_last)) >= 90000u;
              } else if (id(api_ever_connected) && !api_ok) {
                if (id(api_down_since) == 0) id(api_down_since) = millis();
                api_problem = (millis() - id(api_down_since)) >= 90000u;
              }

              bool panel_problem = id(panel_last_ms) != 0 &&
                                   (millis() - id(panel_last_ms)) >= 45000u;

              if (!api_problem && !panel_problem) {
                id(link_rec_stage) = 0;
                return false;
              }
              return id(link_rec_stage) < 1;
          then:
            - lambda: |-
                id(link_rec_stage) = 1;
                id(link_rec_last_action) = millis();
                ESP_LOGW("link", "hub link soft — fleet heartbeat + vitals nudge");
            - script.execute: tx_fleet_heartbeat
            - script.execute: tx_vitals
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u) return false;
              // BUG-FIX 2026-08-02: safety ownership precedence — an active
              // >35C emergency purge or sensor-fault safe-vent outranks link
              // recovery (same rule the sensor watchdog already documents).
              // A WiFi bounce here (or the reboot below) would clear the
              // non-persisted emergency latch and drop fans to boot baseline.
              // Defer; recovery resumes once the safety mode clears.
              if (id(emergency_failsafe_active) || id(sensor_fault_active)) {
                static uint32_t defer_log_ms = 0;
                if (millis() - defer_log_ms > 60000u) {
                  defer_log_ms = millis();
                  ESP_LOGW("link", "WiFi bounce deferred — safety mode active (emergency/sensor fault)");
                }
                return false;
              }
              auto *w = wifi::global_wifi_component;
              if (w == nullptr || !w->is_connected()) return false;
              if (id(link_rec_last_action) != 0 &&
                  (millis() - id(link_rec_last_action)) < 20000u) return false;
              if (id(link_rec_wifi_bounces) >= 3) return false;

              bool api_ok = id(ha_connected).state;
              bool api_problem = false;
              if (id(ha_handshake_seen) && id(ha_handshake_last) != 0)
                api_problem = (millis() - id(ha_handshake_last)) >= 180000u;
              else if (id(api_ever_connected) && !api_ok && id(api_down_since) != 0)
                api_problem = (millis() - id(api_down_since)) >= 180000u;

              // BUG-FIX 2026-08-02: panel-only silence must never bounce hub
              // WiFi (same policy as the reboot stage below). The old trigger
              // fired on any ~90s panel command gap — normal idle glass —
              // flapping WiFi/API for the whole fleet. The panel now sends a
              // 15s keepalive (op 58), and hub-side recovery for a genuinely
              // dead panel stays at stage-1 nudges; the panel runs its own
              // recovery ladder. Bounce only for an unhealthy API.
              return api_problem && id(link_rec_stage) < 2;
          then:
            - lambda: |-
                id(link_rec_stage) = 2;
                id(link_rec_wifi_bounces) = id(link_rec_wifi_bounces) + 1;
                id(link_rec_last_action) = millis();
                ESP_LOGW("link", "hub link — WiFi bounce #%d (API rebind + AP rejoin)",
                         id(link_rec_wifi_bounces));
            - script.execute: link_wifi_bounce
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u) return false;
              // BUG-FIX 2026-08-02: never safe_reboot while a safety mode is
              // latched — the purge must run until <34C clears it (see the
              // matching WiFi-bounce guard above).
              if (id(emergency_failsafe_active) || id(sensor_fault_active)) {
                static uint32_t defer_log_ms = 0;
                if (millis() - defer_log_ms > 60000u) {
                  defer_log_ms = millis();
                  ESP_LOGW("link", "API recovery reboot deferred — safety mode active (emergency/sensor fault)");
                }
                return false;
              }
              auto *w = wifi::global_wifi_component;
              if (w == nullptr || !w->is_connected()) return false;
              if (id(stack_recovery_reboots) >= 2) return false;
              if (id(link_rec_last_action) != 0 &&
                  (millis() - id(link_rec_last_action)) < 20000u) return false;

              // Reboot only for sustained API wedge after a WiFi bounce —
              // never for panel-only silence (local climate must keep running).
              bool api_ok = id(ha_connected).state;
              bool api_problem = false;
              if (id(ha_handshake_seen) && id(ha_handshake_last) != 0)
                api_problem = (millis() - id(ha_handshake_last)) >= 300000u;
              else if (id(api_ever_connected) && !api_ok && id(api_down_since) != 0)
                api_problem = (millis() - id(api_down_since)) >= 300000u;

              return api_problem && id(link_rec_stage) >= 2;
          then:
            - lambda: |-
                id(link_rec_stage) = 3;
                id(link_rec_last_action) = millis();
                ESP_LOGE("link", "hub API still wedged after WiFi bounce — save state + reboot");
            - script.execute: stack_recovery_reboot

  # ---- Sensor watchdog: no valid temp for 3 min -> safe mode + alert ----
  - interval: 30s
    then:
      - lambda: |-
          // A stale sensor DURING an emergency must never throttle the
          // purge — the failsafe outranks the watchdog. Let the latched
          // emergency hold 100% purge until a valid <34C reading clears it.
          if (id(emergency_failsafe_active)) return;

          bool stale = (millis() - id(last_valid_temp_time)) > 180000;
          if (stale && !id(sensor_fault_active)) {
            id(sensor_fault_active) = true;
            // v2.4.2 (BUG-5): if we're in manual and the user is driving the
            // fans from HA (not the OLED dial), the local_target_* globals are
            // stale/zero. Snapshot the LIVE fan speeds NOW, before safe-vent
            // stomps them, so recovery restores what was actually running
            // instead of dropping the tent to dead air.
            if (id(local_manual_mode).state) {
              id(local_target_out)          = id(fan_exhaust_out).speed;
              id(local_target_recirc)       = id(fan_exhaust_recirc).speed;
              id(local_target_intake_main)  = id(fan_intake_main).speed;
              id(local_target_intake_clone) = id(fan_intake_clone).speed;
            }
            // Ladder timers reset: the fault period must never count as
            // "fans failed to fix it" once readings return.
            id(esc_humid_since) = 0; id(esc_dry_since) = 0;
            id(esc_cold_since) = 0;  id(esc_deep_cold_since) = 0;
            id(esc_hot_since) = 0;
            // v2.2: clone demands are NOT cleared here — they run on the
            // CLONE sensor (humidifier) and the CLOCK (LED). A dead tent
            // sensor doesn't blind the 2x4. Independence = resilience.
            id(humidifier_demand).turn_off();
            id(dehumidifier_demand).turn_off();
            id(heater_demand).turn_off();
            id(growmat_demand).turn_off();
            id(ac_demand).turn_off();   // climate unknown -> no appliances
            // v2.4: stamp min-off clocks so recovery can't rapid-fire
            // v2.4.2 (BUG-1): + the AC and dehumidifier compressor clocks —
            // they were cut above but never stamped, so recovery could
            // restart either inside its 3-min protection window.
            id(hum_off_at) = millis(); id(heater_off_at) = millis();
            id(mat_off_at) = millis();
            id(ac_off_at) = millis();  id(dehum_off_at) = millis();
            // No temp reading -> gentle, safe ventilation. Bias OUTSIDE
            // (fresh air + mild extraction) since we can't trust climate.
            auto fe = id(fan_exhaust_out).make_call();  fe.set_state(true); fe.set_speed(40); fe.perform();
            auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(true); fa.set_speed(25); fa.perform();
            auto fim = id(fan_intake_main).make_call(); fim.set_state(true); fim.set_speed(25); fim.perform();
            auto fic = id(fan_intake_clone).make_call();fic.set_state(true); fic.set_speed(25); fic.perform();
            ESP_LOGW("watchdog", "No valid temp for 3 min -> SENSOR FAULT safe mode");
          } else if (!stale && id(sensor_fault_active)) {
            id(sensor_fault_active) = false;
            // Recovery: in Auto the 10s curve re-takes the fans; in Manual
            // the user's held levels must come back (safe mode stomped them).
            if (id(local_manual_mode).state) {
              auto fe = id(fan_exhaust_out).make_call();  fe.set_state(id(local_target_out) > 0);          fe.set_speed(id(local_target_out));          fe.perform();
              auto fa = id(fan_exhaust_recirc).make_call();  fa.set_state(id(local_target_recirc) > 0);    fa.set_speed(id(local_target_recirc));       fa.perform();
              auto fim = id(fan_intake_main).make_call(); fim.set_state(id(local_target_intake_main) > 0); fim.set_speed(id(local_target_intake_main)); fim.perform();
              auto fic = id(fan_intake_clone).make_call();fic.set_state(id(local_target_intake_clone) > 0);fic.set_speed(id(local_target_intake_clone));fic.perform();
              ESP_LOGI("watchdog", "Sensor recovered -> manual fan levels restored");
            } else {
              ESP_LOGI("watchdog", "Temperature sensor recovered");
            }
          }

          // ===== v2.2 · AUX WATCHDOG (soft fault, 3 min, NO safe mode) =====
          // Room stale  -> reality gates + heat-reuse revert to v2.1.
          // Clone stale -> router runs main-only (cap 25%), clone
          //                humidifier demand cleared (never guess wet).
          // Clone LED demand is untouched: it's schedule-driven.
          bool room_stale  = (millis() - id(last_valid_room_time))  > 180000;
          bool clone_stale = (millis() - id(last_valid_clone_time)) > 180000;
          if (room_stale && !id(room_fault_active)) {
            id(room_fault_active) = true;
            ESP_LOGW("watchdog", "Room sensor stale 3min -> soft fault (gates + heat-reuse disabled)");
          } else if (!room_stale && id(room_fault_active)) {
            id(room_fault_active) = false;
            ESP_LOGI("watchdog", "Room sensor recovered");
          }
          if (clone_stale && !id(clone_fault_active)) {
            id(clone_fault_active) = true;
            id(esc_clone_dry_since) = 0;
            id(clone_hum_demand).turn_off();
            ESP_LOGW("watchdog", "Clone sensor stale 3min -> soft fault (router main-only, clone hum off)");
          } else if (!clone_stale && id(clone_fault_active)) {
            id(clone_fault_active) = false;
            ESP_LOGI("watchdog", "Clone sensor recovered");
          }

          // ===== v2.4 · ROOT-ZONE WATCHDOG (soft fault, 5 min) =========
          // The probe path is HA-dependent (pot -> HA -> hub) until
          // ESP-NOW lands, so a longer 5-min window rides out routine HA
          // restarts. Stale -> the mat falls back to the clone-AIR rung
          // (see run_climate_logic); fully blind -> mat OFF. NEVER trips
          // safe mode.
          // v2.4.1: "stale" = no pot probe has delivered a PLAUSIBLE
          // (5-45C) reading in 5 min — one healthy probe keeps the
          // closed loop alive; a faulted probe can't.
          // v2.4.3 · KEEP THE HEARTBEAT ALIVE ON A STABLE READING. The stamp
          // used to advance ONLY on a fresh push (on_value), so a flat soil
          // temp — or HA-mirror-only running without the ESP-NOW 60s heartbeat
          // — could go 5 min with no push and FALSE-trip this fault, dropping
          // the mat to air control (which then cuts the mat when the AIR hits
          // target while the ROOTS are still cold: the 19 Jul 10:32pm log).
          // Refresh whenever any *voting* probe currently reads plausible
          // (5-45C): a live-but-stable value keeps the closed loop alive; a
          // truly dead pot (HA 'unavailable' -> NaN, or ESP-NOW gone stale)
          // still cannot. Mat Vote switches gate this the same way they gate
          // coldest/hottest — an excluded dying probe must not keep the
          // heartbeat alive while eligible pots are dark.
          {
            auto pl = [](float v){ return !isnan(v) && v > 5.0f && v < 45.0f; };
            auto live = [&](bool vote, uint32_t at, float now_v, float ha_v) -> bool {
              if (!vote) return false;
              bool fresh = at != 0 && (millis() - at) < 150000;
              return (fresh && pl(now_v)) || pl(ha_v);
            };
            bool have =
              live(id(mat_vote_1), id(rz_now_1_at), id(rz_now_1).state, id(rootzone_temp).state) ||
              live(id(mat_vote_2), id(rz_now_2_at), id(rz_now_2).state, id(rootzone_temp_2).state) ||
              live(id(mat_vote_3), id(rz_now_3_at), id(rz_now_3).state, id(rootzone_temp_3).state) ||
              live(id(mat_vote_4), id(rz_now_4_at), id(rz_now_4).state, id(rootzone_temp_4).state);
            if (have) id(last_valid_rootzone_time) = millis();
          }
          bool rz_stale = (millis() - id(last_valid_rootzone_time)) > 300000;
          if (rz_stale && !id(rootzone_fault_active)) {
            id(rootzone_fault_active) = true;
            ESP_LOGW("watchdog", "Root-zone probes stale 5min -> soft fault (mat on clone-air fallback)");
          } else if (!rz_stale && id(rootzone_fault_active)) {
            id(rootzone_fault_active) = false;
            ESP_LOGI("watchdog", "Root-zone probe recovered -> closed-loop mat resumes");
          }

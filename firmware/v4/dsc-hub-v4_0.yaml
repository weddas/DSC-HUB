# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml
#
# PACKAGE BODY — flash via stub dsc-hub.yaml (local) or
# homeassistant/esphome/dsc-hub.yaml (git-pull). Do not flash this
# file alone; it expects wifi/api/ota/ap/espnow_key substitutions.
# ESP-NOW panel layer is loaded by the stub (dsc-hub-espnow-primary.yaml),
# not !include'd here — keeps local and git-pull paths identical.

# ===== v5.1.0 · FULL-FLEET INLINE + PHASE B WAITS (Aug 2026) =====
# Hub project string matches GitHub tag v5.1.0. Ladder persistence bases
# are NVS-tunable numbers (Phase B may clamp them from HA). Built on the
# v5.0.0 Sync add-on cut + ESP-NOW-primary climate stack.
#
# ===== API HEARTBEAT + RECOVERY (post-5.1.0) =====
# Symptom class: HA shows hub offline while DSC-CONTROL / ESP-NOW / WiFi
# still look healthy — that is an API session blip (Noise client), not a
# dead board. Short blips are absorbed by HA demand-follower debounce
# (heater stays on). This block only recovers a WEDGED API: WiFi still
# associated, HA Link / handshake silent ≥5 min → sync NVS +
# App.safe_reboot() so the API rebinds. api.reboot_timeout stays 0s
# (HA maintenance must not bounce climate). Boot grace + per-boot cap.
#
# ===== FLEET LINK / AP PIN (temp mesh) =====
# Optional text.dsc_hub_preferred_wifi_bssid (NVS). On WiFi connect the
# hub can auto-learn the current AP into that field (Lock WiFi AP),
# raise its STA priority, and broadcast the 6-byte BSSID in 0xD0 so
# Control (during Starting) and pots can follow the same Nest point.
# Compile-time wifi_bssid still works as a hard stub override.
# Recovery ladder: nudge → WiFi bounce → reboot (hub reboot = API only).
#
# ===== v4.0 · ESP-NOW PRIMARY CONTROL LAYER =====
# The DSC-CONTROL panel drives this hub directly over ESP-NOW. The stub
# merges dsc-hub-espnow-primary.yaml (command RX + telemetry TX + soil
# relay) into this body by package list-concatenation — the QA'd control
# logic is untouched, and every panel command runs through the SAME
# entity action HA uses, so the >35C failsafe and the sensor watchdog
# still outrank it.
# Remote-git safe: no !secret here — stub passes credentials as substitutions.

# ===== v2.4.1 · SUBSTITUTIONS =====
# rootzone_temp_entity*: the HA entities the closed-loop grow mat reads.
# v2.4.1: ALL FOUR pot probes are mirrored now (v2.4 alpha read POT1
# only — a cold POT4 was invisible to the mat, 19 Jul incident). The
# mat heats on the COLDEST plausible probe and trips the runaway flush
# on the HOTTEST. A plausibility filter (5-45C) in run_climate_logic
# ignores faulted probes (POT3 reads a flat 0.0C), which is what
# unblocked the min() that v2.4 parked.
substitutions:
  rootzone_temp_entity: sensor.dsc_pot1_soil_temperature
  rootzone_temp_entity_2: sensor.dsc_pot2_soil_temperature
  rootzone_temp_entity_3: sensor.dsc_pot3_soil_temperature
  rootzone_temp_entity_4: sensor.dsc_pot4_soil_temperature
  # Plant names live on each pot (permanent NVS). Hub mirrors them from HA
  # for the panel 0xD4 relay — packet_transport cannot carry text.
  pot1_plant_entity: text.dsc_pot1_plant_name
  pot2_plant_entity: text.dsc_pot2_plant_name
  pot3_plant_entity: text.dsc_pot3_plant_name
  pot4_plant_entity: text.dsc_pot4_plant_name

esphome:
  name: dsc-hub
  friendly_name: DSC-HUB
  project:
    name: "digital_emotions.dsc-hub"
    version: "5.1.0"
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(last_valid_temp_time)  = millis();
            id(last_valid_room_time)  = millis();   // aux heartbeats: grace
            id(last_valid_clone_time) = millis();   // period before soft fault
            id(last_valid_rootzone_time) = millis();
            // v2.4: re-apply the persisted SF1000 ramp floor (the YAML
            // min_power is only the shipped default; NVS layers on top).
            id(light_sf1000_pwm).set_min_power(id(sf_ramp_floor) / 100.0f);
        - delay: 3s
        # Boot repopulates ONLY the stage label + light hours. The numeric
        # climate targets (temp / VPD / RH) now PERSIST across reboots, so
        # your fine-tuning is never clobbered by a power cycle. The full
        # apply_stage (which overwrites targets with stage defaults) only
        # runs when you actually CHANGE the stage.
        - script.execute: apply_stage_boot
        - lambda: |-
            // Sync clone_mode_idx from the restored select. set_action does
            // not re-fire on boot, and Off historically returned before
            // writing the idx — so vitals could keep broadcasting the old
            // mode after a power cycle while Clone Mode was already Off.
            {
              std::string m = id(clone_mode).current_option().str();
              if      (m == "Follow 4x8")         id(clone_mode_idx) = 0;
              else if (m == "Clones & Seedlings") id(clone_mode_idx) = 1;
              else if (m == "Mother")            id(clone_mode_idx) = 2;
              else if (m == "Custom")            id(clone_mode_idx) = 3;
              else if (m == "Off")               id(clone_mode_idx) = 4;
            }
        - lambda: |-
            // v2.4.2 (BUG-3): SEED THE SAFE VENTILATION BASELINE UNCONDITIONALLY.
            // Previously an auto-resume boot left fans at LEDC 0% for the old
            // resume-prompt window. Every boot now comes up on moving air;
            // v2.4.4 re-arms Full Auto from the persisted flag so the curve
            // takes over on the next tick. (Restore persisted manual targets,
            // else a min floor.)
            int o = id(local_target_out)          > 0 ? id(local_target_out)          : 25;
            int r = id(local_target_recirc)       > 0 ? id(local_target_recirc)       : 20;
            int m = id(local_target_intake_main)  > 0 ? id(local_target_intake_main)  : 15;
            int c = id(local_target_intake_clone) > 0 ? id(local_target_intake_clone) : 15;
            auto fo = id(fan_exhaust_out).make_call();    fo.set_state(true); fo.set_speed(o); fo.perform();
            auto fr = id(fan_exhaust_recirc).make_call(); fr.set_state(true); fr.set_speed(r); fr.perform();
            auto fm = id(fan_intake_main).make_call();    fm.set_state(true); fm.set_speed(m); fm.perform();
            auto fc = id(fan_intake_clone).make_call();   fc.set_state(true); fc.set_speed(c); fc.perform();
            // v2.4.4 · PERSIST + RE-ARM ON BOOT.
            // full_auto_mode already restores from NVS. The bug was that
            // restore alone never re-ran arm_full_auto, and the old resume
            // gate parked the ladder until a tap. Clear the gate; if Full
            // Auto was ON (and Takeover is not), on_boot turns the switch
            // on so arm_full_auto runs again. If it was OFF, stay OFF.
            id(boot_resume_pending) = false;
            if (id(ha_takeover_active)) {
              ESP_LOGW("boot", "Manual Takeover restored -> Full Auto left alone (baseline Out %d Room %d IntM %d Int2 %d)", o, r, m, c);
            } else if (id(full_auto_mode)) {
              ESP_LOGI("boot", "Full Auto restored ON -> re-arming stack (baseline Out %d Room %d IntM %d Int2 %d)", o, r, m, c);
            } else {
              ESP_LOGI("boot", "Full Auto restored OFF -> staying OFF (baseline Out %d Room %d IntM %d Int2 %d)", o, r, m, c);
            }
        # Re-run arm_full_auto only when Full Auto was already on (and not
        # in Manual Takeover). Does not force ON if the user left it off.
        - if:
            condition:
              lambda: 'return !id(ha_takeover_active) && id(full_auto_mode);'
            then:
              - switch.turn_on: full_auto_switch

# Batch flash writes so rapid dial-spinning doesn't wear the chip.
preferences:
  flash_write_interval: 60s

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  # v2.4.1 · PERFORMANCE: default DEBUG logs every sensor update to
  # UART and to any API log subscriber — pure overhead on a device
  # running a 10s control loop + 100ms display. The ladder, watchdog
  # and failsafe all speak at INFO/WARN, so nothing operational is
  # lost. Drop back to DEBUG temporarily when chasing a hardware bug.
  level: INFO

# ==================================================================
#  SECRETS  —  de-inlined v2.4 (see secrets.yaml.template)
#  ------------------------------------------------------------------
#  WHY (six-month note): until now the hub carried its API key and AP
#  password INLINE, and the OTA block had NO PASSWORD AT ALL. The v2.4
#  housekeeping item called out the pot and Sonoff configs for exactly
#  this — the hub was never on that list, which is how it survived.
#
#  It should have been first. The Sonoffs each switch one appliance;
#  the hub drives every fan, the SF1000, and all six demand rungs. An
#  unauthenticated OTA endpoint on this device is the whole grow room.
#
#  Both old values are BURNED — they have been through chat/upload logs
#  more than once. They are not rotated by moving them to secrets.yaml;
#  they are rotated by GENERATING NEW ONES. Run generate-secrets.sh.
# ==================================================================
# Secrets come from the stub as substitutions (remote-git safe).
api:
  encryption:
    key: ${api_key_val}
  # Cap clients so a half-open Noise handshake cannot fill the slot and
  # make HA flap "unavailable" while WiFi + ESP-NOW (Control) stay fine.
  max_connections: 3
  # v2.4.1 · HA-DROP RESILIENCE: default reboot_timeout is 15 min and
  # used to bounce the hub on every HA outage. Stay at 0s — local climate
  # + ESP-NOW must keep running. Sustained API-wedge recovery (WiFi up,
  # HA Link/handshake dead) is the heartbeat interval below, not this.
  reboot_timeout: 0s
  on_client_connected:
    - lambda: |-
        ESP_LOGI("api", "HA client connected from %s (%s)",
                 client_info.c_str(), client_address.c_str());
        id(api_ever_connected) = true;
        id(api_down_since) = 0;
  on_client_disconnected:
    - lambda: |-
        ESP_LOGW("api", "HA client disconnected (%s @ %s) — API blip; climate/ESP-NOW keep running",
                 client_info.c_str(), client_address.c_str());

ota:
  - platform: esphome
    password: ${ota_password_val}

# WiFi lives in the stub / wifi package (lab vs kit SoftAP provisioning).
# See dsc-hub-wifi-lab.yaml / dsc-hub-wifi-kit.yaml.

# ==================================================================
#  DIGITAL-PLANT  ·  Grow Tent Environmental Controller   (rev 2.4.4)
#  Device: dsc-hub   (ESP32 + SH1106 128x64 OLED + rotary UI)
#  ---------------------------------------------------------------
#  v2.4.4 — BOOT PERSIST + RE-ARM FULL AUTO (31 Jul 2026)
#  ------------------------------------------------------------------
#  full_auto_mode already persists in NVS. The reboot gap was that
#  restore never re-ran arm_full_auto, and boot_resume_pending parked
#  the ladder behind a tap/timeout. on_boot now clears that gate and,
#  if Full Auto was ON (and Manual Takeover is not), turns the switch
#  on so the stack re-arms. If Full Auto was OFF, it stays OFF.
#  (Built on v2.4.3 below.)
#
#  v2.4.3 — FULL AUTO = MASTER + GROW-MAT ROOT-SAFETY (19 Jul 2026)
#  * FULL AUTO IS NOW THE MASTER AUTOMATION MODE. Being in Full Auto
#    keeps the ENTIRE stack armed every loop — all six appliance rungs
#    AND the light schedule (auto_photoperiod) — so you never arm them
#    piecemeal and a settings-wipe can't leave them silent. Turning Full
#    Auto on (HA switch OR OLED Mode menu) arms everything instantly and
#    releases Manual Light Hold. To hand-manage ONE appliance, drop to
#    Manual mode. (The old behaviour — Full Auto = fans only, every
#    appliance separately armed — is the "big miss" this fixes: after a
#    flash the ladder came up disarmed and silent.)
#  * FAIL INTO AUTOMATION: full_auto_mode + auto_photoperiod now DEFAULT
#    ON, so a fresh flash or a wiped/non-preserved NVS reboots straight
#    into Full Auto instead of idle Standby.
#  * v2.4.4 · BOOT PERSIST + RE-ARM: if Full Auto was ON, reboot re-runs
#    arm_full_auto (no resume prompt). If it was OFF, it stays OFF.
#    Manual Takeover restored from NVS still wins.
#  * GROW-MAT ROOT-ZONE SAFETY (the 10:32pm "mat off at air 21C / roots
#    17C" bug): the mat had FALSE-tripped its root-zone fault and fallen
#    to clone-AIR control, which cuts the mat when the AIR hits target —
#    telling you nothing about the cold roots. TWO fixes:
#      1. HEARTBEAT ON A STABLE READING: the "probe alive" stamp used to
#         advance only on a fresh PUSH, so a flat soil temp (or HA-mirror
#         operation without the ESP-NOW 60s heartbeat) went stale in 5min
#         and false-tripped the fault. It now refreshes whenever ANY probe
#         currently reads plausible (5-45C) — a live-but-stable value keeps
#         the closed loop alive; a truly dead pot (HA unavailable/NaN)
#         still can't. This keeps the mat controlling on the REAL 17.9C
#         root reading (< 20 low -> keeps heating) instead of on air.
#      2. ROOT-SAFE AIR FALLBACK: for when the probe is TRULY blind, the
#         air rung now biases warm (on below target, off at target+1.5)
#         and logs loudly that it's an air proxy, NOT a root reading.
#    REMINDER: the proper fix is ESP-NOW live (60s per-pot heartbeat) —
#    if your pots aren't yet on dsc-pot-common v2.4.1 with espnow_key,
#    the mat is HA-mirror-only and leans on fix #1 above.
#  (Built on v2.4.2 below.)
#  ---------------------------------------------------------------
#  v2.4.2 — QA HARDENING + FAN/APPLIANCE COORDINATION (19 Jul 2026)
#  Outcome of a full firmware-in-the-loop QA + air-physics sim pass.
#  FIVE safety/recovery bugs fixed + two new coordination features.
#  * BUG-1 COMPRESSOR CLOCKS (watchdog): safe-mode cut the AC + the
#    dehumidifier but stamped only hum/heater/mat off-clocks, so on
#    recovery either could re-fire inside its 3-min protection window
#    (sim: AC re-fired 70s after the cut). Now stamps ac_off_at +
#    dehum_off_at too.
#  * BUG-2 COMPRESSOR CLOCK (>35C clear): the emergency-clear cut the
#    AC with no ac_off_at stamp -> same short-cycle after a purge.
#    Now stamped.
#  * BUG-3 DEAD-AIR AUTO BOOT: only the NON-auto boot path seeded a
#    ventilation baseline; an auto-resume boot left the fans at 0% for
#    the whole 60-180s resume-prompt window. The baseline now seeds
#    UNCONDITIONALLY at boot; the resume prompt arms on top of moving
#    air. (>35C failsafe already fired independently — this closes the
#    still-air gap the safe-boot comment always promised to prevent.)
#  * BUG-4 CROSS-TENT TIMER BLEED: the ladder dwell-timers are global
#    but timed against the ARBITRATED tent; a Priority flip (or a tent
#    Off->On) while both shared an alarm state handed the new tent the
#    old tent's accumulated dwell (sim: AC fired 0s after a flip). The
#    four room-appliance timers now reset when the arbitrated tent
#    identity changes.
#  * BUG-5 MANUAL RECOVERY -> DEAD AIR: sensor-fault recovery in manual
#    restored fans from the OLED-dial target globals; if you drove the
#    fans from HA instead, those globals were 0 and recovery stomped the
#    tent to 0/0/0/0. The watchdog now snapshots the LIVE fan speeds
#    into the targets at fault entry, so manual recovery restores what
#    was actually running.
#  * NEW · HUMIDIFIER INTAKE ROUTING (switch, default ON): the room
#    humidifier plume sits AT the tent intakes, so the intakes are its
#    delivery valves. The clone router trickles the 2x4 intake when the
#    2x4 is dry (right when the source is the internal dome) — but with
#    a plume at the mouth that sent ~62% of the humidifier into the 4x8
#    that DIDN'T want it. When on, the router now starves the intake of
#    any active tent already at/above its RH floor (and not calling for
#    cooling), concentrating the plume on the tent that's actually dry.
#    Sim: delivery split flips from 62/38 (wrong tent) to ~36/64.
#  * NEW · RECIRC DE-STRAT PULSE (switch + 3 numbers, default ON): a
#    brief periodic RECIRC burst to re-entrain the canopy/corner dead
#    air a steady low baseline leaves stagnant. Mixing/de-stratifying,
#    NOT leaf-flutter (a duct fan won't wave the canopy — that's the
#    job of the little oscillating fans). Period/burst/level are runtime
#    numbers; only ever RAISES an idle RECIRC, never lowers a working one.
#  (Built on v2.4.1 below.)
#  ---------------------------------------------------------------
#  v2.4.1 — URGENT CONTROL FIXES (19 July 2026 incident)
#  * FANS-FIRST ENFORCED FOR AC: "appliances only after fans failed"
#    was assumed, never enforced — the AC rung could fire for the 2x4
#    while the exchange fans idled (19 Jul, 5:56pm). The AC now
#    requires the arbitrated tent's fan lever to be demonstrably
#    saturated (OUT >= 80% for the 4x8 / clone intake at its ceiling
#    for the 2x4) OR physically useless (room air at/above target)
#    before it may fire. Clone over-temp also gets a graded fan
#    escalation (exchange 50/75/100%) and a chain-service OUT lift so
#    the fans genuinely try first.
#  * VPD-AWARE HUMIDIFIER RUNGS: both humidifier rungs fired on the
#    RH floor only — VPD (the variable the strategy actually chases)
#    could sail over its ceiling with the humidifier silent (19 Jul,
#    5:28pm: VPD 0.94/0.99 over ceiling, RH 63%, no response). Under
#    the VPD strategy the rungs now fire on EITHER the RH floor breach
#    OR arbitrated VPD > ceiling, and only release when BOTH are
#    healthy.
#  * MULTI-PROBE ROOT ZONE + RUNAWAY FLUSH: the mat sensed POT1 only,
#    so a cold POT4 was invisible (19 Jul, 6:07pm). All four probes
#    are mirrored; a 5-45C plausibility filter ignores faulted probes
#    (POT3 reads 0.0C — the blocker that parked min() in v2.4). Mat
#    heats on the COLDEST valid pot, cuts on the band high, and a
#    RUNAWAY guard (hottest pot >= high + 1C) cuts the mat and flushes
#    the 2x4 with cooler room air — fans, not appliances, pull the
#    root zone down.
#  * ESP-NOW LIVE (pot -> hub direct): the four pots unicast their
#    root-zone readings straight to this hub every 60s (MACs captured
#    19 Jul). Per-pot source-select: ESP-NOW fresh -> HA mirror ->
#    clone-air rung -> mat OFF. Per-pot link watchdog binaries. The
#    mat's sense loop now survives HA restarts. Flash hub first, then
#    pots (dsc-pot-common v2.4.1); same espnow_key secret everywhere.
#  * HA-DROP RESILIENCE + SENSOR EFFICIENCY: api reboot_timeout 0s
#    (hub never self-reboots on HA loss), wifi power_save_mode none
#    (the classic dropped-socket cause), RSSI 15s->60s, uptime
#    60s->300s, ladder telemetry gets delta filters (idle zeros no
#    longer spam the API every 10s), runtime-tunable numbers poll
#    10s->60s. Roughly 80% less steady-state API traffic.
#  (Built on v2.4 below.)
#  ---------------------------------------------------------------
#  v2.4-ALPHA — LIGHT TOPOLOGY + CLOSED-LOOP ROOTS (July 2026)
#  * LIGHT TOPOLOGY CORRECTION (Option A, decided 16 Jul 2026): the
#    SF1000 physically hangs in the 2x4 CLONE tent; the 4x8 currently
#    has NO light and NO PWM module. The whole ramp engine (sunrise/
#    sunset, Manual Light Hold, write guard, OLED light page) is now
#    parented to the CLONE photoperiod. The binary Clone LED Demand +
#    Clone Light Auto entities RETIRE. The 4x8 exposes ZERO light
#    entities; its photoperiod stays alive as a VIRTUAL schedule so
#    Follow-4x8 and the counter-cycle thermal logic keep working —
#    when a 4x8 light + PWM module land (GPIO5 reserved), the schedule
#    just gets an output re-attached instead of being rebuilt.
#  * SF1000 RAMP-FLOOR REMAP: the 1k pull-down fix (relay cancelled)
#    leaves a dead zone — the light kicks in at ~30% duty. min_power
#    remaps brightness 0-100% -> duty ~32-100% (hard 0 below 0.5%),
#    so sunrise is a smooth start instead of dark-then-pop. Floor is
#    a runtime number — verify against the light on the first sunrise.
#    Minimum achievable intensity is now the kick-in level.
#  * CLONE HUMIDIFIER SHORT-CYCLING FIX: release hysteresis widened
#    (runtime, default +6%) + a minimum off-time (runtime, default
#    180s). Kills the rapid on/off cycling AND the Event Scribe spam
#    at the source. Room humidifier + heater get min-off too.
#  * CLOSED-LOOP GROW MAT: mat demand now tracks the RS485 soil-probe
#    ROOT-ZONE temp (via HA, ${rootzone_temp_entity}) — energise below
#    Mat Root-Zone Low, cut at Mat Root-Zone High, min-off so it can't
#    short-cycle. The mat's own plate thermostat regulates its SURFACE;
#    a 22C setpoint sat the root zone at 16-19C — the probe is the only
#    trustworthy sense point. Blind probe -> falls back to the v2.3
#    clone-air rung; fully blind -> mat OFF (never guess root heat).
#  * LADDER TIMING SENSORS: per-rung fire countdowns + per-appliance
#    cooldown-remaining — firmware truth for the Dashboard v3 module
#    cards (replaces HA-side timer mirrors, zero card changes).
#  * RUNTIME-CONFIGURABLE PARAMETERS: tunables above ship as number:
#    entities (restore_value: true). Watchdog + >35C failsafe
#    thresholds stay COMPILED-IN constants — deliberately not exposed.
#  * ESP-NOW pot links: LIVE (v2.4.1+) — per-pot providers + link sensors.
#  (Built on v2.3 below.)
#  ---------------------------------------------------------------
#  v2.3 — ZONE CONTROL + MANUAL TAKEOVER (July 2026)
#  Each tent gets an "Off" state; room appliances follow a Priority
#  Tent; the grow mat is now correctly a 2x4-local lever; heating never
#  vents outside; and a master Manual Takeover hands every output to HA.
#  (Built on v2.2 below.)
#  ---------------------------------------------------------------
#  v2.2 — THE CLONE TENT UPDATE (July 2026)
#  The 2x4 is now a second controlled environment AND a conditioned
#  air reservoir for the 4x8 (daisy-chain: room -> 2x4 -> 4x8).
#    * Room DHT22 (GPIO4) + Clone DHT22 (GPIO13) + Clone VPD
#    * INTAKE ROUTER: the 4x8 sources makeup air from whichever
#      donor (room via main intake / warm humid 2x4 air via clone
#      intake) moves it toward target — with hard caps that protect
#      the clone environment from being flushed out of band.
#    * HEAT REUSE: tent heat sheds to the ROOM (recirc) instead of
#      outside whenever the system is heat-poor. Lights are heaters;
#      don't vent their output and then demand the 750W.
#    * REALITY GATES on the ladder: if the source air physically
#      cannot fix a condition, appliance persistence drops 5min->1min.
#    * Clone Mode (Follow 4x8 / Clones & Seedlings / Mother / Custom),
#      Clone Photoperiod (Follow 4x8 / Independent), Clone LED Demand
#      (binary, blueprint-compatible), Clone Humidifier Demand.
#    * Aux sensors are SOFT-fault only: tent DHT22 alone owns safe
#      mode; a dead room/clone sensor just reverts v2.1 behaviour.
# ==================================================================
#  CONTROL MODEL — how the pieces fit together
#  -----------------------------------------------------------------
#   1. Pick "Grow Stage" in HA  ->  auto-loads the VPD / RH / Temp
#      targets + photoperiod length for that stage. (You can still
#      fine-tune the individual number sliders afterwards — the stage
#      just writes sensible defaults into them. Fine-tuning now
#      PERSISTS across reboots; only a stage CHANGE resets it.)
#   2. "Control Strategy" decides WHICH variable the fans chase:
#        VPD (grower-grade, default) / Temperature / Humidity
#   3. "Tent Full Auto Mode"  -> enables the fan auto-curve.
#   4. "Auto Photoperiod"     -> the DEVICE runs the light schedule
#      locally (survives HA / network loss). HA only sets the params
#      (stage = duration, "Lights-On Time" HH:MM = when it starts).
#      Sunrise/Sunset: the SF1000 ramps 0 -> target% over "Sunrise
#      Duration" minutes at lights-on, and target% -> 0 over "Sunset
#      Duration" minutes finishing AT lights-off. Both ramps live
#      INSIDE the photoperiod window (auto-scaled if they overlap).
#   5. Humidifier / Dehumidifier soft switches -> read-only demand
#      signals HA can watch to drive external gear (see that section).
#
#  FAN ROLES (4x inline) — "software-defined damper":
#     6" Exhaust (Outside) -> dumps heat/moisture OUT (carbon filter 1).
#                             Ramps on TEMP over target, RH overflow when
#                             the dehumidifier can't cope, + a 15% fresh-
#                             air floor so CO2 never fully depletes.
#     6" Exhaust (Room)    -> RECIRCULATES into the room (carbon filter 2).
#                             Ramps on VPD / RH demand. Holds the light's
#                             heat in the room lung; the room dehumidifier
#                             then pulls the moisture. This is the winter /
#                             cold-but-humid workhorse.
#     4" Intake (Main)     -> fresh air room -> 4x8, slaved to total exhaust
#     4" Intake (2x4)      -> fresh air room -> 2x4 (cascades into 4x8)
#   Blending OUT vs ROOM % IS the damper — no mechanical flap needed.
#   Makeup air for OUT comes from a door undercut / cracked vent.
#
#  APPLIANCE ESCALATION LADDER (fans first, appliances on failure):
#     Demands are soft signals; HA automations do the real switching,
#     e.g. "if Heater Demand on -> turn on heater plug, off when off".
#     v2.3: the ROOM appliances (dehumidifier/humidifier/heater/AC) serve
#     the PRIORITY tent (see Priority Tent below) — they condition the
#     shared room to hit that tent's own target, read on that tent's own
#     sensor. The GROW MAT is different: it lives in the 2x4, so it is a
#     2x4-LOCAL lever that always tracks the CLONE tent's temp/target and
#     runs regardless of priority.
#       Too humid : fans 5 min, RH still > max+3  -> Dehumidifier Demand
#       Too dry   : 2 min below min-2 OR VPD over ceiling (v2.4.1)
#                                                 -> Humidifier Demand
#       Roots cold: coldest valid pot < Mat Low   -> Grow Mat Demand (2x4)
#       Roots hot : hottest valid pot >= High+1C  -> mat OFF + fan flush
#       Too cold  : 5 min below (arb) target-2    -> Heater Demand (750W)
#       Too hot   : > target+2 for 5 min AND fans saturated/useless
#                                                 -> AC Demand (@20C)
#     All clear with hysteresis. Each has an "Auto" arm switch. Emergency
#     (>35C): heat demands OFF, AC ON. Ladder timers reset whenever the
#     failsafe or watchdog engages.
#     v2.3 HEATER INTERLOCK: whenever Heater Demand is live, the OUT fan
#     drops to the fresh-air floor and air routes RECIRC — we never blow
#     bought heat out the wall. (Moisture overflow + the >35C purge still
#     override; safety is upstream of the closed damper.)
#
#  PER-TENT ON/OFF + PRIORITY (v2.3):
#     Grow Stage "Off" (4x8) and Clone Mode "Off" (2x4) take a tent out of
#     service: its light darks, its photoperiod suspends, its intake drops
#     to a trickle, and it is EXCLUDED from room-appliance arbitration and
#     from any borrow/donor role. Targets are preserved (return restores
#     your tuning). "Priority Tent" (4x8 / 2x4) decides who commands the
#     shared room appliances when BOTH tents run; the non-priority tent is
#     best-effort on its LOCAL levers (its own intake/flush, the 2x4 grow
#     mat + clone humidifier, and borrow/heat-reuse). Only one tent active
#     -> it is priority by definition (the select is ignored).
#
#  MANUAL SEMANTICS (v2.3 — three tiers):
#     "Manual Takeover"       = MASTER. You drive every output from HA;
#        the fan curve, the ladder, and BOTH photoperiods are suspended.
#        Only Emergency (>35C) and the sensor watchdog still override.
#        This is the clean "HA owns everything" switch — use it when the
#        curve/ramp were "fighting" you. Full Auto (or a stage set) exits.
#     "Tent Manual Override"  = FANS ONLY. Device stops driving the fans;
#        your fan values stick. Photoperiod keeps driving the light.
#     "Manual Light Hold"     = LIGHT ONLY. Now latches on ANY external
#        SF1000 change — HA slider OR the OLED dial (v2.2 only latched the
#        dial; that was the "lights fight me from HA" bug). A re-entrancy
#        guard (light_write_guard_until) means the device's OWN ramp/adjust
#        writes never self-latch. Self-heals at the next lights-off edge.
#     Safety layers (failsafe, watchdog) still override everything.
#
#  PRIORITY ORDER (highest wins):
#     Emergency failsafe (>35C: OUT 100%, ROOM 0%, intakes 100% = once-
#        through purge outside)  >  Sensor-fault safe mode
#        >  Manual Takeover  >  Manual (fans) / Light Hold
#        >  Priority-tent arbitration  >  Auto Photoperiod / Full Auto
#
#  OLED UI (rev 2):
#     Home page dial-rotate = status carousel (position dots, top-right):
#        Home <-> Trends <-> Lights <-> Fans <-> WiFi Diag
#     Main Menu: Mode / Airflow / Lighting / Grow Status / System Info.
#        Mode page sets Standby / Full Auto / Manual from the dial —
#        Full Auto is now re-armable WITHOUT HA.
#     CON button = quick Manual (fans) toggle only — a deliberate
#        "panic hold". Entering Full Auto is menu-only by design so a
#        stray press can never hand control back to the curve.
#     Hold BACK ~1s = jump Home from anywhere.
#     Adjust pages show the item NAME + a live bar, and flash a banner
#        when they engage a manual hold. Trends page draws 1h sparklines.
#     Detent acceleration: spin fast = 15%/detent, slow = 5%.
#     Any text wider than the screen auto-scrolls (marquee, wall-clock
#        based so speed is refresh-independent).
#     Screensaver shows a live "Running: ..." automation status line.
#
#  HA ENTITIES added by this config:
#     select   : Grow Stage, Control Strategy
#     switch   : Tent Full Auto Mode, Tent Manual Override (fans),
#                Manual Light Hold, Auto Photoperiod (v2.4: drives the
#                SF1000 on the CLONE window),
#                Humidifier Auto/Demand, Dehumidifier Auto/Demand,
#                Heater Auto/Demand, Grow Mat Auto/Demand, AC Auto/Demand,
#                v2.4.2: Humidifier Intake Routing, RECIRC De-Strat Pulse
#     number   : Target Temp, VPD Min, VPD Max, RH Min, RH Max,
#                Sunrise Duration, Sunset Duration, SF1000 Target %,
#                v2.4: SF1000 Ramp Floor, Clone Hum Hysteresis,
#                Clone Hum Min Off-Time, Humidifier Min Off-Time,
#                Heater Min Off-Time, Mat Root-Zone Low/High,
#                Mat Min Off-Time, v2.4.2: De-Strat Pulse Period/Length/Level
#     datetime : Lights-On Time (HH:MM, shows as AM/PM in HA)
#     binary   : HA Link Status, Climate Sensor Fault, Aux Sensor Fault,
#                v2.4: Root-Zone Sensor Fault
#     sensor   : Tent Temperature, Tent Humidity, VPD, CO2e, Uptime,
#                WiFi RSSI, v2.4: 6x "<Appliance> Fire Countdown" +
#                4x "<Appliance> Cooldown Remaining"
#     text     : IP Address, WiFi SSID, Firmware Version
#     button   : Restart
#  RETIRED entities in v2.4 (light topology Option A): "Clone Light
#  Auto" and "Clone LED Demand" — the SF1000 IS the clone light; the
#  binary demand drove nothing real. Remove the demand_follower
#  automation for Clone LED Demand and drop both from dashboards.
#  RENAMED entities in v2.3: "temp" -> "Tent Temperature",
#  "humidity" -> "Tent Humidity" (entity_ids change — fold into the same
#  dashboard migration as the Outside/Room fan renames). The dial and
#  buttons are now internal (no longer exposed to HA).
# ==================================================================


# captive_portal: provided by wifi lab package (not kit SoftAP portal).

# ==================================================================
#  v2.4.1 · ESP-NOW  —  direct pot -> hub root-zone link (LIVE)
#  ------------------------------------------------------------------
#  HA-independence for the SENSING path: the four pots unicast their
#  soil probe readings straight to this hub. The closed-loop mat now
#  survives an HA restart (previously: pot -> HA -> hub, so every HA
#  reboot dropped the mat to the clone-air fallback for 5+ minutes).
#
#  DEVICE INVENTORY (captured 19 Jul 2026):
#    DSC-HUB    84:1F:E8:16:E6:60   192.168.86.33   dsc-hub.local
#    DSC-POT#1  8C:4F:00:27:E0:10   192.168.86.47   dsc_pot1.local
#    DSC-POT#2  F0:24:F9:59:C3:14   192.168.86.39   dsc_pot2.local
#    DSC-POT#3  A0:A3:B3:90:DA:B0   192.168.86.40   dsc_pot3.local
#    DSC-POT#4  EC:E3:34:7B:E7:A8   192.168.86.49   dsc_pot4.local
#
#  FLASH-ORDER + PREREQUISITES:
#   1. Add `espnow_key: "<random string>"` to secrets.yaml on the hub
#      AND all four pots (same key everywhere — it authenticates the
#      packet payloads via xxtea, per-provider).
#   2. LOCK the AP channel on the router. ESP-NOW rides the WiFi
#      channel; a router channel hop silently splits the link. (The
#      fallback chain means a split degrades to the HA path — the mat
#      keeps working — but the whole point is to not need it.)
#   3. Flash THIS hub first (it just listens; hearing nothing is the
#      designed fallback), then roll dsc-pot-common v2.4.1 to the pots
#      — POT2 first as canary, per the install instructions.
#  NOTE: requires ESP32 (any framework — arduino is fine; verified
#  against the espnow component schema in ESPHome 2026.6.5).
#  Actuation stays HA-dependent (Sonoffs are ESP8285 — no espnow).
# ==================================================================
espnow:
  auto_add_peer: false
  peers:
    - 8C:4F:00:27:E0:10   # DSC-POT#1
    - F0:24:F9:59:C3:14   # DSC-POT#2
    - A0:A3:B3:90:DA:B0   # DSC-POT#3 (moisture probe faulted — temp link still useful)
    - EC:E3:34:7B:E7:A8   # DSC-POT#4

# The hub is a pure CONSUMER: providers only, no outgoing sensors.
# (Do not add a top-level encryption: key here — the schema requires
# outgoing sensors to encrypt; per-provider keys below handle inbound.)
packet_transport:
  - platform: espnow
    id: pt_espnow
    update_interval: 60s
    providers:
      - name: dsc_pot1
        encryption: ${espnow_key}
      - name: dsc_pot2
        encryption: ${espnow_key}
      - name: dsc_pot3
        encryption: ${espnow_key}
      - name: dsc_pot4
        encryption: ${espnow_key}

# Time: SNTP primary (internet, HA-independent) so the photoperiod
# keeps running even if Home Assistant is down. HA time is backup.
# TIMEZONE IS CRITICAL — without it the schedule runs on UTC.
time:
  - platform: sntp
    id: sntp_time
    timezone: "Australia/Sydney"
  - platform: homeassistant
    id: grow_time

# ==========================================
# 1. (removed v4.0) OLED CONTROL MODULE
# ==========================================
# The i2c bus (GPIO21/22) + Roboto fonts lived here to drive the SH1106
# panel. v4.0 removes the on-hub OLED module (screen/knob/buttons/menu);
# GPIO21/22/25/26/32/14/33 are now free for DSC-CLONE expansion. Live
# control moved to the DSC-CONTROL panel over ESP-NOW (see packages: at
# the top of this file). No control logic changed.
# ==========================================
# 2. GLOBALS (State Machine & Memory)
# ==========================================
globals:
  # --- UI state machine ---
  - id: current_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: menu_cursor
    type: int
    restore_value: false
    initial_value: '0'
  - id: adjusting_item
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_interaction_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: display_sleeping          # explicit sleep flag (no time sentinel —
    type: bool                    # force-sleep works even in the first 5 min
    restore_value: false          # of uptime)
    initial_value: 'false'
  - id: last_detent_ms            # detent acceleration: fast spin = big steps
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: manual_banner_until       # millis deadline for the "MANUAL" flash
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Manual target levels (ALL persist now: they feed the safe-boot
  #     baseline so a power cut mid-manual-session never boots into
  #     dead air) ---
  - id: local_target_out
    type: int
    restore_value: true
    initial_value: '0'
  - id: local_target_intake_main
    type: int
    restore_value: true
    initial_value: '0'
  - id: local_target_intake_clone
    type: int
    restore_value: true
    initial_value: '0'
  - id: local_target_recirc
    type: int
    restore_value: true
    initial_value: '0'
  - id: local_target_sf1000
    type: int
    restore_value: true
    initial_value: '75'

  # --- Operating modes (persist across reboot) ---
  - id: emergency_failsafe_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: emergency_since           # millis when the failsafe tripped (banner)
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: full_auto_mode
    type: bool
    restore_value: true
    initial_value: 'true'          # v2.4.3: wiped/fresh NVS -> boot INTO Full
                                   # Auto (fail into automation, never idle).
  - id: auto_photoperiod_enabled
    type: bool
    restore_value: true
    initial_value: 'true'          # v2.4.3: Full Auto owns the light schedule;
                                   # wiped/fresh NVS -> photoperiod runs.
  - id: manual_light_hold         # LIGHT-only hold; self-heals at lights-off.
    type: bool                    # Deliberately NOT persisted: after a power
    restore_value: false          # cycle the schedule is authoritative.
    initial_value: 'false'
  - id: humidifier_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: dehumidifier_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: heater_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: growmat_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  # Per-pot mat vote: exclude a dying probe without a reflash.
  # POT3 defaults OFF (known flat-0°C fault); others ON.
  - id: mat_vote_1
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: mat_vote_2
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: mat_vote_3
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: mat_vote_4
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: ac_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'

  # --- Boot resume: power returned mid-schedule ---
  - id: boot_resume_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_time_synced_at        # millis when clock became valid (0 = not yet)
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Escalation ladder timers (millis when a condition began; 0 = clear) ---
  - id: esc_humid_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_dry_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_cold_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_deep_cold_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: esc_hot_since
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Stage-driven targets (written by apply_stage; numeric values
  #     PERSIST so reboots keep your fine-tuning — see apply_stage_boot) ---
  - id: stage_temp_target
    type: float
    restore_value: true
    initial_value: '25.0'
  - id: stage_vpd_min
    type: float
    restore_value: true
    initial_value: '0.4'
  - id: stage_vpd_max
    type: float
    restore_value: true
    initial_value: '0.8'
  - id: stage_rh_min
    type: float
    restore_value: true
    initial_value: '70.0'
  - id: stage_rh_max
    type: float
    restore_value: true
    initial_value: '80.0'
  - id: stage_light_hours
    type: int
    restore_value: true
    initial_value: '18'
  - id: stage_short               # std::string can't persist -> recomputed
    type: std::string             # from the (restored) Grow Stage at boot
    restore_value: false
    initial_value: '"Germ"'

  # --- Control strategy: 0=VPD, 1=Temperature, 2=Humidity (persists) ---
  - id: control_strategy_idx
    type: int
    restore_value: true
    initial_value: '0'

  # --- Photoperiod & sunrise/sunset ramp ---
  # (Lights-On Time itself lives in the `datetime` entity, restore_value: true)
  - id: lights_currently_on
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: sunrise_minutes
    type: int
    restore_value: true
    initial_value: '30'
  - id: sunset_minutes
    type: int
    restore_value: true
    initial_value: '30'
  - id: light_ramp_state          # 0 = steady/off, 1 = sunrise, 2 = sunset
    type: int
    restore_value: false
    initial_value: '0'
  - id: light_current_pct         # live brightness the ramp engine is driving
    type: float
    restore_value: false
    initial_value: '0.0'

  # --- Failsafe snapshot (to restore state after an emergency) ---
  - id: saved_out
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_intake_main
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_intake_clone
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_recirc
    type: int
    restore_value: false
    initial_value: '0'
  - id: saved_light_sf1000_b
    type: float
    restore_value: false
    initial_value: '0.0'

  # --- Sensor watchdog ---
  - id: sensor_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_valid_temp_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_good_temp            # last valid reading (fault-banner context)
    type: float
    restore_value: false
    initial_value: 'NAN'

  # --- API heartbeat / recovery (WiFi-up + HA session dead) ---
  # Timestamps are millis(); 0 = currently healthy / not timing.
  # WiFi-down is logged only — Control/ESP-NOW can still be fine; we do
  # NOT reboot for STA loss. Reboot is for wedged API while STA is up.
  - id: api_down_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: api_ever_connected        # only recover API after a prior good session
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ha_handshake_last         # millis of last HA number write; 0 = unused
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ha_handshake_seen         # HA automation has pinged at least once
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: stack_recovery_reboots    # per-boot cap — avoids reboot loops
    type: int
    restore_value: false
    initial_value: '0'
  - id: hub_heartbeat_count
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Same ladder as Control/pots: ping/nudge → WiFi bounce → reboot
  - id: link_rec_stage
    type: int
    restore_value: false
    initial_value: '0'
  - id: link_rec_wifi_bounces
    type: int
    restore_value: false
    initial_value: '0'
  - id: link_rec_last_action
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # --- Screensaver physics (px per 100ms frame; status line at y=53
  #     gives the 48px logo a 0..5px vertical lane) ---
  - id: saver_x
    type: float
    restore_value: false
    initial_value: '10.0'
  - id: saver_y
    type: float
    restore_value: false
    initial_value: '2.0'
  - id: saver_vx
    type: float
    restore_value: false
    initial_value: '4.0'
  - id: saver_vy
    type: float
    restore_value: false
    initial_value: '0.5'

  # --- Marquee scrolling + live automation status line ---
  # marquee_px is derived from millis() each frame (wall-clock scroll):
  # refresh-rate independent AND immune to float-precision freeze on
  # long uptimes. Kept as a global so draw_scroll stays simple.
  - id: marquee_px
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: auto_status_text
    type: std::string
    restore_value: false
    initial_value: '"Idle - automation off"'

  # --- 1h trend ring buffers (12 slots, sampled every 5 min) ---
  - id: hist_temp
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: hist_rh
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: hist_vpd
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: hist_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: hist_filled
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: hist_cvpd                   # clone VPD sparkline (Clone page)
    type: float[12]
    restore_value: false
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'

  # ===== v2.2 · CLONE TENT ENVIRONMENT (persist like the stage_* set) =====
  - id: clone_temp_target
    type: float
    restore_value: true
    initial_value: '24.0'
  - id: clone_vpd_min
    type: float
    restore_value: true
    initial_value: '0.4'
  - id: clone_vpd_max
    type: float
    restore_value: true
    initial_value: '0.8'
  - id: clone_rh_min
    type: float
    restore_value: true
    initial_value: '70.0'
  - id: clone_rh_max
    type: float
    restore_value: true
    initial_value: '80.0'
  - id: clone_mode_idx              # 0=Follow 4x8, 1=Clones&Seedlings,
    type: int                       # 2=Mother, 3=Custom, 4=Off (select
    restore_value: true             # can't re-fire set_action on boot ->
    initial_value: '1'              # int mirror persists, like strategy_idx)
  - id: clone_photo_follow          # true = clone LED mirrors 4x8 window
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: clone_light_hours
    type: int
    restore_value: true
    initial_value: '18'
  - id: clone_lights_on             # runtime: clone window truth
    type: bool
    restore_value: false
    initial_value: 'false'
  # v2.4: clone_led_auto_enabled RETIRED with the binary LED demand —
  # the SF1000 ramp engine is armed by auto_photoperiod_enabled now.
  - id: clone_hum_auto_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: esc_clone_dry_since         # clone-humidifier ladder timer
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ===== v2.2 · AUX SENSOR SOFT FAULTS (never trip safe mode) =====
  - id: last_valid_room_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_valid_clone_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: room_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: clone_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # ===== v2.2 QA · compressor protection (min 3min off before restart) =====
  - id: dehum_off_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ac_off_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ===== v2.3 · PER-TENT ACTIVE STATE + PRIORITY + MASTER TAKEOVER =====
  # main_active / clone_active: false when that tent's stage/mode is "Off".
  # An Off tent: lights off, photoperiod suspended, its intake trickles,
  # and it is EXCLUDED from room-appliance arbitration + borrow/donor.
  - id: main_active
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: clone_active
    type: bool
    restore_value: true
    initial_value: 'true'
  # priority_tent_main: when BOTH tents run, which one commands the shared
  # room appliances (heater/AC/humidifier/dehumidifier) + the exhaust
  # curve. The non-priority tent is best-effort on its LOCAL levers only.
  # Ignored when only one tent is active (that tent is priority by default).
  - id: priority_tent_main
    type: bool
    restore_value: true
    initial_value: 'true'
  # ha_takeover_active: master "give me the wheel". Suspends the fan curve,
  # the ladder, and both photoperiods — you drive every output from HA.
  # Only Emergency (>35C) and the sensor watchdog still override.
  - id: ha_takeover_active
    type: bool
    restore_value: true
    initial_value: 'false'
  # light_write_guard_until: re-entrancy guard so the device's OWN light
  # writes (ramp/adjust/failsafe) don't trip the HA-touch auto-latch.
  # millis() deadline; on_state ignores changes while now < this.
  - id: light_write_guard_until
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ===== v2.2 · INTAKE ROUTER slew state (prevents path oscillation) =====
  - id: cur_intake_main
    type: int
    restore_value: false
    initial_value: '15'
  - id: cur_intake_clone
    type: int
    restore_value: false
    initial_value: '15'
  # v2.4.1: set by the intake router each tick — true when a 2x4
  # cooling flush was requested AND the router has already given it
  # everything the protection cap / negative-pressure budget allow.
  # The AC rung's fans-first gate reads this (10s stale at most).
  - id: clone_fan_saturated
    type: bool
    restore_value: false
    initial_value: 'false'

  # ===== v2.4 · RUNTIME-CONFIGURABLE PARAMETERS ======================
  # Numeric tunables promoted to NVS state (paired number: entities).
  # YAML initial values are the git-versioned SHIPPED defaults; live NVS
  # values layer on top. Fold tuned values back into these defaults at
  # the next natural version bump. Watchdog + failsafe thresholds are
  # deliberately NOT here — they stay compiled-in constants.
  - id: sf_ramp_floor              # SF1000 kick-in duty %, from the 1k
    type: float                    # pull-down bench test (~30%, +2 margin).
    restore_value: true            # Verify on the first v2.4 sunrise.
    initial_value: '32.0'
  - id: clone_hum_hyst             # clone humidifier release offset:
    type: float                    # OFF at c_rmin + this (was +2 -> 4%
    restore_value: true            # band = the short-cycler). Default 6.
    initial_value: '6.0'
  - id: clone_hum_min_off_s        # clone humidifier minimum off-time
    type: int
    restore_value: true
    initial_value: '180'
  - id: hum_min_off_s              # room humidifier minimum off-time
    type: int
    restore_value: true
    initial_value: '120'
  - id: heater_min_off_s           # 750W heater minimum off-time (relay
    type: int                      # hygiene; resistive load, so short)
    restore_value: true
    initial_value: '60'
  - id: mat_rz_low                 # closed-loop mat: energise below this
    type: float                    # ROOT-ZONE temp (soil probe via HA)
    restore_value: true
    initial_value: '20.0'
  - id: mat_rz_high                # ...cut at/above this. The band IS the
    type: float                    # hysteresis — keep it >= 2C wide.
    restore_value: true
    initial_value: '24.0'
  - id: mat_min_off_s              # mat minimum off-time (soil is a slow
    type: int                      # thermal mass — no rapid cycling)
    restore_value: true
    initial_value: '300'

  # ===== v2.4 · MIN-OFF STAMPS (millis at last demand OFF; 0 = never) ===
  - id: clone_hum_off_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: hum_off_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: heater_off_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: mat_off_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ===== v2.4.1 · ESP-NOW FRESHNESS STAMPS (millis; 0 = never heard) ==
  # Per-pot arrival time of the last PLAUSIBLE ESP-NOW reading. The
  # mat's source-select treats a pot's ESP-NOW value as live for 150s
  # (2.5 missed 60s sends), then falls to that pot's HA mirror.
  - id: rz_now_1_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rz_now_2_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rz_now_3_at
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rz_now_4_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ===== Plant names (HA mirror cache for panel 0xD4) =================
  # Canonical store is each pot's text.plant_name (NVS). Hub caches the
  # HA entity so the panel can show names over ESP-NOW without talking
  # to HA itself. restore_value keeps the last known label if HA blips.
  - id: plant_name_1
    type: std::string
    restore_value: true
    initial_value: '"Unassigned"'
  - id: plant_name_2
    type: std::string
    restore_value: true
    initial_value: '"Unassigned"'
  - id: plant_name_3
    type: std::string
    restore_value: true
    initial_value: '"Unassigned"'
  - id: plant_name_4
    type: std::string
    restore_value: true
    initial_value: '"Unassigned"'

  # ===== v2.4 · ROOT-ZONE SOFT FAULT (never trips safe mode) ==========
  # The probe path is HA-dependent until ESP-NOW lands: HA down or the
  # pot node dark -> readings stale -> mat falls back to the v2.3
  # clone-AIR rung. Fully blind -> mat OFF. Never control on a blind
  # sensor, and never guess root-zone heat.
  # v2.4.1: the stamp now refreshes on ANY of the four pot probes
  # delivering a PLAUSIBLE (5-45C) reading — a faulted probe (POT3's
  # flat 0.0C) can neither keep the loop alive nor blind it.
  - id: last_valid_rootzone_time
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: rootzone_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # ===== v2.4 · LADDER TIMING TELEMETRY ==============================
  # run_climate_logic stashes the CURRENT persistence window per rung
  # (reality gates change them tick-to-tick) so the Fire Countdown
  # sensors can publish honest numbers without re-deriving the gates.
  - id: cur_dehum_wait
    type: uint32_t
    restore_value: false
    initial_value: '300000'
  - id: cur_hum_wait
    type: uint32_t
    restore_value: false
    initial_value: '120000'
  - id: cur_heat_wait
    type: uint32_t
    restore_value: false
    initial_value: '300000'
  - id: cur_ac_wait
    type: uint32_t
    restore_value: false
    initial_value: '300000'
  - id: cur_mat_wait
    type: uint32_t
    restore_value: false
    initial_value: '60000'

  # ===== v5.1.0 · LADDER WAIT BASES (Phase B writable) ===============
  # Open-loop persistence bases in milliseconds. Reality gates still
  # shorten via min(base, gate). Failsafe / min-off untouched.
  - id: base_dehum_wait_ms
    type: uint32_t
    restore_value: true
    initial_value: '300000'
  - id: base_hum_wait_ms
    type: uint32_t
    restore_value: true
    initial_value: '120000'
  - id: base_heat_wait_ms
    type: uint32_t
    restore_value: true
    initial_value: '300000'
  - id: base_ac_wait_ms
    type: uint32_t
    restore_value: true
    initial_value: '300000'
  - id: base_mat_wait_ms
    type: uint32_t
    restore_value: true
    initial_value: '60000'

  # ===== v2.4.2 · BUG-4: arbitration-change detector =================
  # Previous arbitrated-tent identity. When it flips (Priority Tent
  # change, or a tent going Off<->On), the shared ladder dwell-timers
  # reset so the newly-served tent starts a fresh persistence window.
  - id: prev_arb_main
    type: bool
    restore_value: false
    initial_value: 'true'

  # ===== BUG-FIX 2026-08-02 · room-live edge detector ================
  # Previous room_live state. When the LAST active tent goes Off the
  # release rungs stop running (they're room_live-gated), so an already
  # ON room demand would latch forever. The edge-clear below needs to
  # know the prior state to fire exactly once per transition.
  - id: prev_room_live
    type: bool
    restore_value: false
    initial_value: 'false'

  # ===== v2.4.2 · FAN/APPLIANCE COORDINATION (runtime-tunable) ========
  # Humidifier plume sits AT the intakes -> the intakes are its delivery
  # valves. When on, starve the intake of a tent that doesn't need the
  # moisture so the plume concentrates on the dry one. Default ON to
  # match the confirmed physical placement; a switch, so instantly
  # reversible from HA if the humidifier ever moves.
  - id: hum_intake_routing
    type: bool
    restore_value: true
    initial_value: 'true'
  # RECIRC de-stratification pulse: a brief periodic burst to mix the
  # canopy/corner dead air. Only ever raises an idle RECIRC.
  - id: destrat_pulse_enable
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: destrat_period_s          # seconds between bursts
    type: int
    restore_value: true
    initial_value: '180'
  - id: destrat_burst_s           # burst length (seconds)
    type: int
    restore_value: true
    initial_value: '15'
  - id: destrat_burst_pct         # RECIRC % during the burst
    type: int
    restore_value: true
    initial_value: '55'

# ==========================================
# 3. PWM OUTPUTS, FANS & LIGHTS
# ==========================================
# NOTE: GPIO16/17 are PSRAM pins on WROVER modules — fine on WROOM-32.
# If a board swap ever happens (see the June latch-up casualty), check
# the module variant before reusing this pin map.
output:
  - platform: ledc
    pin: GPIO16
    id: exhaust_out_pwm          # 6" exhaust -> OUTSIDE (carbon filter 1)
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO17
    id: intake_4in_main_pwm
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO18
    id: intake_4in_clone_pwm
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO19                  # was 250W light -> now 6" exhaust -> ROOM
    id: exhaust_recirc_pwm       # (carbon filter 2). Same clamp mod
    frequency: 1000 Hz           # (330R + 3v3 zener / opto) before wiring.
  - platform: ledc
    pin: GPIO23
    id: light_sf1000_pwm
    frequency: 1000 Hz
    # v2.4 · RAMP-FLOOR REMAP: the 1k pull-down on the dim line holds
    # the SF1000 fully dark below ~30% duty (relay cancelled 16 Jul 26;
    # GPIO5 returned to the spare pool). Without a remap the sunrise
    # ramp has a dark dead zone then pops on at ~30-40% brightness.
    # min_power maps brightness 0-100% -> duty 32-100%; zero_means_zero
    # keeps OFF at a true 0% duty so the pull-down guarantees dark.
    # 0.32 is the SHIPPED default — the "SF1000 Ramp Floor" number
    # re-applies the persisted live value at boot and on change.
    min_power: 0.32
    zero_means_zero: true

fan:
  - platform: speed
    output: exhaust_out_pwm
    name: "6 Inch Exhaust (Outside)"
    id: fan_exhaust_out
  - platform: speed
    output: exhaust_recirc_pwm
    name: "6 Inch Exhaust (Room)"
    id: fan_exhaust_recirc
  - platform: speed
    output: intake_4in_main_pwm
    name: "4 Inch Intake Fan (Main)"
    id: fan_intake_main
  - platform: speed
    output: intake_4in_clone_pwm
    name: "4 Inch Intake Fan (2x4)"
    id: fan_intake_clone

light:
  - platform: monochromatic
    output: light_sf1000_pwm
    name: "SF1000 Dimmer"
    id: light_sf1000
    # v2.4 · LIGHT TOPOLOGY: this IS the 2x4 CLONE tent's light. The
    # 4x8 has no light and no PWM module (GPIO5 reserved for when one
    # lands). The ramp engine driving this output now lives in
    # run_clone_photoperiod, on the CLONE window.
    # v2.3: an EXTERNAL brightness change (HA slider, physical toggle)
    # latches Manual Light Hold — the schedule/ramp then leaves the light
    # alone until you release it (self-heals at CLONE lights-off).
    # The device's OWN writes set light_write_guard_until first, so ramp
    # transitions never self-latch.
    on_state:
      - lambda: |-
          if (millis() < id(light_write_guard_until)) return;   // our own write
          if (id(ha_takeover_active)) return;                    // you already own it
          if (!id(manual_light_hold)) {
            id(manual_light_hold) = true;
            id(manual_light_hold_switch).publish_state(true);
            id(manual_banner_until) = millis() + 2000;
            ESP_LOGI("light", "External SF1000 change -> Manual Light Hold latched");
          }

# ==========================================
# 4. HA CONTROLS (switches / selects / numbers)
# ==========================================
switch:
  # MANUAL OVERRIDE (FANS) <-> FULL AUTO are mutually exclusive (each
  # turns the other off). rev 2: Manual is FANS ONLY — the device stops
  # driving the fans (no auto-curve, no slaving/roles); whatever you set
  # from the dial or HA just sticks. The PHOTOPERIOD KEEPS DRIVING THE
  # LIGHT unless you hand-adjust the light itself (-> Manual Light Hold).
  # Safety layers (emergency failsafe, sensor watchdog) still override.
  # The appliance escalation ladder keeps signalling in manual; disable
  # individual "X Auto" switches if you want it silent too.
  - platform: template
    name: "Tent Manual Override"
    id: local_manual_mode
    icon: "mdi:hand-back-right"
    optimistic: true
    turn_on_action:
      - globals.set: {id: full_auto_mode, value: 'false'}
      - lambda: 'id(full_auto_switch).publish_state(false);'
      - script.execute: tx_panel_sync
    turn_off_action:
      # Leaving manual releases the light hold too — the schedule resumes.
      - globals.set: {id: manual_light_hold, value: 'false'}
      - lambda: 'id(manual_light_hold_switch).publish_state(false);'
      - script.execute: tx_panel_sync

  - platform: template
    name: "Tent Full Auto Mode"
    id: full_auto_switch
    icon: "mdi:auto-mode"
    lambda: 'return id(full_auto_mode);'
    turn_on_action:
      - globals.set: {id: full_auto_mode, value: 'true'}
      - globals.set: {id: ha_takeover_active, value: 'false'}   # re-arming auto releases takeover
      - switch.turn_off: local_manual_mode
      - lambda: 'id(manual_takeover_switch).publish_state(false);'
      - script.execute: arm_full_auto                          # v2.4.3: arm the whole stack
      # arm_full_auto already calls tx_panel_sync
    turn_off_action:
      - globals.set: {id: full_auto_mode, value: 'false'}
      - script.execute: tx_panel_sync

  # Temp mesh: when ON, WiFi-connect learns/keeps preferred BSSID in NVS
  # and raises STA priority so the hub (and 0xD0 followers) stick to one
  # Nest point without locking the whole LAN channel plan.
  - platform: template
    name: "Lock WiFi AP"
    id: wifi_ap_lock
    icon: "mdi:access-point-check"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: wifi_ap_learn_or_pin
    turn_off_action:
      - logger.log:
          level: INFO
          format: "WiFi AP lock OFF — preferred BSSID kept but not enforced"

  - platform: template
    name: "Auto Photoperiod"
    id: photoperiod_switch
    icon: "mdi:theme-light-dark"
    # v2.4: this switch now arms the SF1000 ramp engine on the CLONE
    # window (run_clone_photoperiod). The 4x8 schedule it used to drive
    # is virtual — it has no output until a 4x8 light lands on GPIO5.
    lambda: 'return id(auto_photoperiod_enabled);'
    turn_on_action:
      - globals.set: {id: auto_photoperiod_enabled, value: 'true'}
      # Arming the schedule is an explicit "schedule owns the light".
      - globals.set: {id: manual_light_hold, value: 'false'}
      - lambda: 'id(manual_light_hold_switch).publish_state(false);'
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: auto_photoperiod_enabled, value: 'false'}
      - script.execute: tx_panel_sync

  # --- Manual Light Hold: visible + clearable from HA. Set automatically
  # when the SF1000 is hand-adjusted; self-heals at lights-off. ---
  - platform: template
    name: "Manual Light Hold"
    id: manual_light_hold_switch
    icon: "mdi:lightbulb-alert-outline"
    lambda: 'return id(manual_light_hold);'
    turn_on_action:
      - globals.set: {id: manual_light_hold, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: manual_light_hold, value: 'false'}
      - script.execute: tx_panel_sync

  # ===== v2.3 · MANUAL TAKEOVER — the master "give me the wheel" =====
  # ON  = you drive EVERY output from HA. The device stops driving fans
  #       (local_manual_mode), stops driving the light (manual_light_hold),
  #       and suspends the ladder + both photoperiods. Appliance DEMAND
  #       switches become yours to toggle directly. Only Emergency (>35C)
  #       and the sensor watchdog still override — safety never yields.
  # OFF = releases takeover; flip Full Auto (or set a stage) to resume.
  # This is the clean answer to "when I control from HA I need it to
  # actually hand me control" — no more curve/ramp fighting you.
  - platform: template
    name: "Manual Takeover"
    id: manual_takeover_switch
    icon: "mdi:gesture-tap-button"
    lambda: 'return id(ha_takeover_active);'
    turn_on_action:
      - globals.set: {id: ha_takeover_active, value: 'true'}
      - globals.set: {id: full_auto_mode, value: 'false'}
      - globals.set: {id: manual_light_hold, value: 'true'}
      - lambda: |-
          id(full_auto_switch).publish_state(false);
          id(manual_light_hold_switch).publish_state(true);
      - switch.turn_on: local_manual_mode
      - globals.set: {id: manual_banner_until, value: !lambda 'return millis() + 2000;'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: ha_takeover_active, value: 'false'}
      - script.execute: tx_panel_sync

  # --- Humidifier soft switch (RH TOO LOW / v2.4.1: or VPD TOO HIGH) ---
  - platform: template
    name: "Humidifier Auto"
    id: humidifier_auto_switch
    icon: "mdi:air-humidifier"
    lambda: 'return id(humidifier_auto_enabled);'
    turn_on_action:
      - globals.set: {id: humidifier_auto_enabled, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: humidifier_auto_enabled, value: 'false'}
      # BUG-FIX 2026-08-02: parity with Heater/Mat Auto — releasing Auto
      # must drop an already-ON demand or the HA follower keeps the relay
      # energized indefinitely. Stamp the min-off clock so the ladder
      # honours the cooldown when Auto is re-armed.
      - switch.turn_off: humidifier_demand
      - lambda: 'id(hum_off_at) = millis();'
      - script.execute: tx_panel_sync
  - platform: template
    name: "Humidifier Demand"      # <-- watch THIS in your HA automation
    id: humidifier_demand
    icon: "mdi:water-plus"
    optimistic: true

  # --- Dehumidifier soft switch (RH TOO HIGH — the one that matters in NSW flower) ---
  - platform: template
    name: "Dehumidifier Auto"
    id: dehumidifier_auto_switch
    icon: "mdi:air-humidifier-off"
    lambda: 'return id(dehumidifier_auto_enabled);'
    turn_on_action:
      - globals.set: {id: dehumidifier_auto_enabled, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: dehumidifier_auto_enabled, value: 'false'}
      # BUG-FIX 2026-08-02: same parity fix as Humidifier Auto above.
      - switch.turn_off: dehumidifier_demand
      - lambda: 'id(dehum_off_at) = millis();'
      - script.execute: tx_panel_sync
  - platform: template
    name: "Dehumidifier Demand"    # <-- watch THIS in your HA automation
    id: dehumidifier_demand
    icon: "mdi:water-minus"
    optimistic: true

  # --- ESCALATION LADDER appliances (HA does the actual switching) ---
  # "X Auto" arms the ladder for that device; "X Demand" is the read-only
  # signal an HA automation follows. Demands only engage when the fans
  # have demonstrably failed to fix the condition (see run_climate_logic).
  - platform: template
    name: "Heater Auto"
    id: heater_auto_switch
    icon: "mdi:radiator"
    lambda: 'return id(heater_auto_enabled);'
    turn_on_action:
      - globals.set: {id: heater_auto_enabled, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: heater_auto_enabled, value: 'false'}
      - switch.turn_off: heater_demand
      - script.execute: tx_panel_sync
  - platform: template
    name: "Heater Demand"          # 750W fan heater
    id: heater_demand
    icon: "mdi:fire"
    optimistic: true

  - platform: template
    name: "Grow Mat Auto"
    id: growmat_auto_switch
    icon: "mdi:heat-wave"
    lambda: 'return id(growmat_auto_enabled);'
    turn_on_action:
      - globals.set: {id: growmat_auto_enabled, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: growmat_auto_enabled, value: 'false'}
      - switch.turn_off: growmat_demand
      - script.execute: tx_panel_sync
  - platform: template
    name: "Grow Mat Demand"        # under-pot root-zone warmth
    id: growmat_demand
    icon: "mdi:heating-coil"
    optimistic: true

  # Per-pot mat eligibility — OFF pots are skipped by coldest/hottest vote
  # (still subject to the 5–45°C plausibility filter when ON).
  - platform: template
    name: "Mat Vote Pot 1"
    id: mat_vote_1_switch
    icon: "mdi:numeric-1-circle"
    entity_category: config
    lambda: 'return id(mat_vote_1);'
    turn_on_action:
      - globals.set: {id: mat_vote_1, value: 'true'}
    turn_off_action:
      - globals.set: {id: mat_vote_1, value: 'false'}
  - platform: template
    name: "Mat Vote Pot 2"
    id: mat_vote_2_switch
    icon: "mdi:numeric-2-circle"
    entity_category: config
    lambda: 'return id(mat_vote_2);'
    turn_on_action:
      - globals.set: {id: mat_vote_2, value: 'true'}
    turn_off_action:
      - globals.set: {id: mat_vote_2, value: 'false'}
  - platform: template
    name: "Mat Vote Pot 3"
    id: mat_vote_3_switch
    icon: "mdi:numeric-3-circle"
    entity_category: config
    lambda: 'return id(mat_vote_3);'
    turn_on_action:
      - globals.set: {id: mat_vote_3, value: 'true'}
    turn_off_action:
      - globals.set: {id: mat_vote_3, value: 'false'}
  - platform: template
    name: "Mat Vote Pot 4"
    id: mat_vote_4_switch
    icon: "mdi:numeric-4-circle"
    entity_category: config
    lambda: 'return id(mat_vote_4);'
    turn_on_action:
      - globals.set: {id: mat_vote_4, value: 'true'}
    turn_off_action:
      - globals.set: {id: mat_vote_4, value: 'false'}

  - platform: template
    name: "AC Auto"
    id: ac_auto_switch
    icon: "mdi:air-conditioner"
    lambda: 'return id(ac_auto_enabled);'
    turn_on_action:
      - globals.set: {id: ac_auto_enabled, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: ac_auto_enabled, value: 'false'}
      - switch.turn_off: ac_demand
      - script.execute: tx_panel_sync
  - platform: template
    name: "AC Demand"              # portable AC, set to cool @ 20C max
    id: ac_demand
    icon: "mdi:snowflake"
    optimistic: true

  # ===== v2.2 · CLONE TENT demands (same blueprint contract) =====
  # v2.4 · RETIRED: "Clone Light Auto" + "Clone LED Demand". The binary
  # LED demand drove nothing real — the SF1000 (GPIO23 PWM) IS the clone
  # light, and the ramp engine now drives it directly on the clone
  # window. Remove the Clone LED demand_follower automation in HA and
  # drop both entities from dashboards. If a SECOND (binary) clone light
  # ever appears, resurrect this pair from the v2.3 file.

  - platform: template
    name: "Clone Humidifier Auto"  # dome today, micro-mister tomorrow.
    id: clone_hum_auto_switch      # v2.4: hysteresis + min-off are now
    icon: "mdi:air-humidifier"     # runtime numbers — retune for a
    lambda: 'return id(clone_hum_auto_enabled);'   # mister, no reflash.
    turn_on_action:
      - globals.set: {id: clone_hum_auto_enabled, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: clone_hum_auto_enabled, value: 'false'}
      - switch.turn_off: clone_hum_demand
      - script.execute: tx_panel_sync
  - platform: template
    name: "Clone Humidifier Demand"  # <-- watch THIS in your HA automation
    id: clone_hum_demand
    icon: "mdi:water-plus-outline"
    optimistic: true

  # ===== v2.4.2 · FAN/APPLIANCE COORDINATION TOGGLES =====
  # Humidifier plume sits AT the tent intakes -> route it to the tent
  # that's dry by starving the satisfied tent's intake. ON matches the
  # confirmed physical placement; turn OFF if the humidifier ever moves
  # away from the intakes (then it diffuses into the room instead).
  - platform: template
    name: "Humidifier Intake Routing"
    id: hum_intake_routing_switch
    icon: "mdi:call-split"
    lambda: 'return id(hum_intake_routing);'
    turn_on_action:
      - globals.set: {id: hum_intake_routing, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: hum_intake_routing, value: 'false'}
      - script.execute: tx_panel_sync

  # Periodic RECIRC burst to mix canopy/corner dead air (de-stratify).
  - platform: template
    name: "RECIRC De-Strat Pulse"
    id: destrat_pulse_switch
    icon: "mdi:fan-auto"
    lambda: 'return id(destrat_pulse_enable);'
    turn_on_action:
      - globals.set: {id: destrat_pulse_enable, value: 'true'}
      - script.execute: tx_panel_sync
    turn_off_action:
      - globals.set: {id: destrat_pulse_enable, value: 'false'}
      - script.execute: tx_panel_sync

select:
  - platform: template
    name: "Grow Stage"
    id: grow_stage
    icon: "mdi:sprout"
    optimistic: true
    restore_value: true
    initial_option: "Germination"
    options:
      - "Germination"
      - "Seedling"
      - "Early Vegetative"
      - "Vegetative"
      - "Late (Push) Vegetative"
      - "Early Flowering"
      - "Flowering"
      - "Late Flowering"
      - "Final 48-72h Flowering"
      - "Dry Mode"
      - "Off"
    set_action:
      - script.execute: apply_stage
      - script.execute: tx_panel_sync

  - platform: template
    name: "Control Strategy"
    id: control_strategy
    icon: "mdi:tune-variant"
    optimistic: true
    restore_value: true
    initial_option: "VPD"
    options:
      - "VPD"
      - "Temperature"
      - "Humidity"
    set_action:
      - lambda: |-
          if (x == "VPD") id(control_strategy_idx) = 0;
          else if (x == "Temperature") id(control_strategy_idx) = 1;
          else id(control_strategy_idx) = 2;
      - script.execute: tx_panel_sync

  # ===== v2.2 · CLONE MODE — small select, not a second stage engine.
  # Clones don't traverse ten stages in a 2x4. Follow 4x8 reads the
  # main stage targets live; the presets write clone defaults into the
  # sliders once (fine-tune after, it persists); Custom never writes.
  - platform: template
    name: "Clone Mode"
    id: clone_mode
    icon: "mdi:sprout-outline"
    optimistic: true
    restore_value: true
    initial_option: "Clones & Seedlings"
    options:
      - "Follow 4x8"
      - "Clones & Seedlings"
      - "Mother"
      - "Custom"
      - "Off"
    set_action:
      - script.execute: apply_clone_mode
      - script.execute: tx_panel_sync

  - platform: template
    name: "Clone Photoperiod"
    id: clone_photo_select
    icon: "mdi:theme-light-dark"
    optimistic: true
    restore_value: true
    initial_option: "Independent"
    options:
      - "Follow 4x8"
      - "Independent"
    set_action:
      - lambda: 'id(clone_photo_follow) = (x == "Follow 4x8");'
      - script.execute: tx_panel_sync

  # ===== v2.3 · PRIORITY TENT — who commands the shared room appliances
  # (heater / AC / humidifier / dehumidifier) AND the exhaust curve when
  # BOTH tents are running. The other tent is best-effort on its LOCAL
  # levers (its own intake/flush, the 2x4's grow mat + clone humidifier,
  # and the v2.2 borrow/heat-reuse routing). When only one tent is active,
  # this is ignored — the live tent is priority by definition.
  - platform: template
    name: "Priority Tent"
    id: priority_tent_select
    icon: "mdi:priority-high"
    optimistic: true
    restore_value: true
    initial_option: "4x8 Main"
    options:
      - "4x8 Main"
      - "2x4 Clone"
    set_action:
      - lambda: 'id(priority_tent_main) = (x == "4x8 Main");'
      - script.execute: tx_panel_sync

number:

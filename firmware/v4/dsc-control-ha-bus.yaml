binary_sensor:
  - platform: homeassistant
    id: ha_full_auto
    entity_id: switch.dsc_hub_tent_full_auto_mode
    internal: true
    on_state:
      - lambda: |-
          int m = id(gv_mode);
          if (x) m |= 1; else m &= ~1;
          id(gv_mode) = m;
          id(gv_hub_last) = millis();
  - platform: homeassistant
    id: ha_takeover
    entity_id: switch.dsc_hub_manual_takeover
    internal: true
    on_state:
      - lambda: |-
          int m = id(gv_mode);
          if (x) m |= 4; else m &= ~4;
          id(gv_mode) = m;
  - platform: homeassistant
    id: ha_photo
    entity_id: switch.dsc_hub_auto_photoperiod
    internal: true
    on_state:
      - lambda: |-
          int m = id(gv_mode);
          if (x) m |= 8; else m &= ~8;
          id(gv_mode) = m;
  - platform: homeassistant
    id: ha_light_hold
    entity_id: switch.dsc_hub_manual_light_hold
    internal: true
    on_state:
      - lambda: |-
          int m = id(gv_mode);
          if (x) m |= 16; else m &= ~16;
          id(gv_mode) = m;
  - platform: homeassistant
    id: ha_dem_hum
    entity_id: switch.dsc_hub_humidifier_demand
    internal: true
    on_state:
      - lambda: |-
          int d = id(gv_dem);
          if (x) d |= 1; else d &= ~1;
          id(gv_dem) = d;
  - platform: homeassistant
    id: ha_dem_dehum
    entity_id: switch.dsc_hub_dehumidifier_demand
    internal: true
    on_state:
      - lambda: |-
          int d = id(gv_dem);
          if (x) d |= 2; else d &= ~2;
          id(gv_dem) = d;
  - platform: homeassistant
    id: ha_dem_heat
    entity_id: switch.dsc_hub_heater_demand
    internal: true
    on_state:
      - lambda: |-
          int d = id(gv_dem);
          if (x) d |= 4; else d &= ~4;
          id(gv_dem) = d;
  - platform: homeassistant
    id: ha_dem_mat
    entity_id: switch.dsc_hub_grow_mat_demand
    internal: true
    on_state:
      - lambda: |-
          int d = id(gv_dem);
          if (x) d |= 8; else d &= ~8;
          id(gv_dem) = d;
  - platform: homeassistant
    id: ha_dem_ac
    entity_id: switch.dsc_hub_ac_demand
    internal: true
    on_state:
      - lambda: |-
          int d = id(gv_dem);
          if (x) d |= 16; else d &= ~16;
          id(gv_dem) = d;
  - platform: homeassistant
    id: ha_dem_clone
    entity_id: switch.dsc_hub_clone_humidifier_demand
    internal: true
    on_state:
      - lambda: |-
          int d = id(gv_dem);
          if (x) d |= 32; else d &= ~32;
          id(gv_dem) = d;

interval:
  - interval: 15s
    then:
      - lambda: |-
          // Keep link fresh while Wi-Fi is up even if a sensor is quiet.
          if (id(wifi_conn)) {
            id(gv_hub_last) = millis();
            id(link_rec_stage) = 0;
          }

# ==================================================================
#  DSC-CONTROL · HA Native API bus (studio Wi-Fi cutover)
#  ------------------------------------------------------------------
#  Feeds gv_* from Home Assistant entities so the glass stays live
#  without ESP-NOW 0xD1/0xD2/0xD3. Commands: see hub_cmd → event.
#  Include from dsc-control.yaml after dsc-control-common.yaml.
# ==================================================================

sensor:
  - platform: homeassistant
    id: ha_tent_t
    entity_id: sensor.dsc_hub_tent_temperature
    internal: true
    on_value:
      - lambda: |-
          id(gv_tent_t) = x;
          id(gv_hub_last) = millis();
          id(link_rec_stage) = 0;
  - platform: homeassistant
    id: ha_tent_rh
    entity_id: sensor.dsc_hub_tent_humidity
    internal: true
    on_value:
      - lambda: 'id(gv_tent_rh) = x;'
  - platform: homeassistant
    id: ha_tent_vpd
    entity_id: sensor.dsc_hub_vpd_kpa
    internal: true
    on_value:
      - lambda: 'id(gv_tent_vpd) = x;'
  - platform: homeassistant
    id: ha_clone_t
    entity_id: sensor.dsc_hub_clone_temperature
    internal: true
    on_value:
      - lambda: 'id(gv_clone_t) = x;'
  - platform: homeassistant
    id: ha_clone_rh
    entity_id: sensor.dsc_hub_clone_humidity
    internal: true
    on_value:
      - lambda: 'id(gv_clone_rh) = x;'
  - platform: homeassistant
    id: ha_clone_vpd

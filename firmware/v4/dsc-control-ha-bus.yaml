    internal: true
    on_value:
      - lambda: 'id(gv_clone_vpd) = x;'
  - platform: homeassistant
    id: ha_room_t
    entity_id: sensor.dsc_hub_room_temperature
    internal: true
    on_value:
      - lambda: 'id(gv_room_t) = x;'
  - platform: homeassistant
    id: ha_room_rh
    entity_id: sensor.dsc_hub_room_humidity
    internal: true
    on_value:
      - lambda: 'id(gv_room_rh) = x;'
  - platform: homeassistant
    id: ha_target_temp
    entity_id: number.dsc_hub_target_temp
    internal: true
    on_value:
      - lambda: |-
          id(gv_cfg)[0] = x;
          id(gv_cfg_ok) = true;
  - platform: homeassistant
    id: ha_vpd_min
    entity_id: number.dsc_hub_vpd_target_min
    internal: true
    on_value:
      - lambda: 'id(gv_cfg)[1] = x;'
  - platform: homeassistant
    id: ha_vpd_max
    entity_id: number.dsc_hub_vpd_target_max
    internal: true
    on_value:
      - lambda: 'id(gv_cfg)[2] = x;'
  - platform: homeassistant

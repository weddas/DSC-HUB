      - lambda: 'id(gv_cfg)[3] = x;'
  - platform: homeassistant
    id: ha_rh_max
    entity_id: number.dsc_hub_rh_target_max
    internal: true
    on_value:
      - lambda: 'id(gv_cfg)[4] = x;'
  # Soil (7 channels × 4 pots → gv_soil[28])

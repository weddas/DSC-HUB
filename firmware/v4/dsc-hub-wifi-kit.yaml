# ==================================================================
#  DSC-HUB · kit WiFi (no compile-time STA — SoftAP provisioning)
#  Phone joins DSC-Setup-XXXX; credentials saved via dsc_fleet_setup.
# ==================================================================
wifi:
  # No ssid/password — ESPHome keeps NVS STA creds from fleet setup.
  power_save_mode: none
  # Rejoin known AP without a full scan. HA offline is usually API-only.
  fast_connect: true
  ap:
    ssid: "DSC-Setup"
    password: ${setup_ap_password}
  on_connect:
    - lambda: |-
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          static int last_ch = 0;
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (last_ch != 0 && last_ch != ch)
              ESP_LOGW("wifi", "channel hop %d -> %d — panel ESP-NOW will drop until it follows", last_ch, ch);
            else
              ESP_LOGI("wifi", "STA channel %d", ch);
            last_ch = ch;
          }
        }

# ==================================================================
#  SOIL SENSORS  —  registers 0x0000..0x0006
# ==================================================================
# ⚠ NAMES ARE THE ENTITY_ID CONTRACT. Pipeline per channel:
#  register scale → user cal (scale+offset) → out-of-range → NAN →
#  median(3). NAN is honest; a wrong number is not.
sensor:
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    icon: mdi:water-percent
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          float s = id(cal_moist_scale).state;
          float o = id(cal_moist_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 100.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # S_WORD: sub-zero soil reports as negative. U_WORD would wrap -1C to
  # 6553.5C, which the range guard then rejects as NAN — blinding the mat
  # on the coldest night. This is the sensor the closed-loop mat reads.
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Temperature"
    id: soil_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    register_type: holding
    address: 0x0001
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          float s = id(cal_temp_scale).state;
          float o = id(cal_temp_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < -20.0f || x > 60.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Conductivity"
    id: soil_conductivity
    unit_of_measurement: "µS/cm"
    state_class: measurement
    icon: mdi:flash
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_ec_scale).state;
          float o = id(cal_ec_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 20000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil pH"
    id: soil_ph
    unit_of_measurement: "pH"
    state_class: measurement
    icon: mdi:ph
    register_type: holding
    address: 0x0003
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.1
      - lambda: |-
          float s = id(cal_ph_scale).state;
          float o = id(cal_ph_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 3.0f || x > 9.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # N/P/K: DERIVED from bulk EC, not measured ions. Trend indicators only
  # (the HA NPK alerts compare to a 7-day baseline, not an absolute).
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Nitrogen"
    id: soil_nitrogen
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0004
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_n_scale).state;
          float o = id(cal_n_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 2000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Phosphorus"
    id: soil_phosphorus
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0005
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_p_scale).state;
          float o = id(cal_p_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 2000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Potassium"
    id: soil_potassium
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0006
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_k_scale).state;
          float o = id(cal_k_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 2000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # N-021: raw = (calibrated - offset) / scale — no second Modbus read.
  - platform: template
    name: "Soil Moisture Raw"
    id: soil_moisture_raw
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:water-percent
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      float c = id(soil_moisture).state;
      float s = id(cal_moist_scale).state;
      float o = id(cal_moist_offset).state;
      if (isnan(c) || isnan(s) || fabsf(s) < 1e-6f) return {};
      if (isnan(o)) o = 0.0f;
      return {(c - o) / s};
  - platform: template
    name: "Soil Temperature Raw"
    id: soil_temperature_raw
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      float c = id(soil_temperature).state;
      float s = id(cal_temp_scale).state;
      float o = id(cal_temp_offset).state;
      if (isnan(c) || isnan(s) || fabsf(s) < 1e-6f) return {};
      if (isnan(o)) o = 0.0f;
      return {(c - o) / s};
  - platform: template
    name: "Soil Conductivity Raw"
    id: soil_conductivity_raw
    unit_of_measurement: "µS/cm"
    state_class: measurement
    icon: mdi:flash
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      float c = id(soil_conductivity).state;
      float s = id(cal_ec_scale).state;
      float o = id(cal_ec_offset).state;
      if (isnan(c) || isnan(s) || fabsf(s) < 1e-6f) return {};
      if (isnan(o)) o = 0.0f;
      return {(c - o) / s};
  - platform: template
    name: "Soil pH Raw"
    id: soil_ph_raw
    unit_of_measurement: "pH"
    state_class: measurement
    icon: mdi:ph
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      float c = id(soil_ph).state;
      float s = id(cal_ph_scale).state;
      float o = id(cal_ph_offset).state;
      if (isnan(c) || isnan(s) || fabsf(s) < 1e-6f) return {};
      if (isnan(o)) o = 0.0f;
      return {(c - o) / s};

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic
  - platform: template
    name: "Firmware Version"
    icon: mdi:tag-check
    lambda: 'return {"6.0.0.0"};'
    update_interval: 60s
  # Diagnostic only — see 0xD7 RX note in globals/espnow below. This node
  # cannot set its own clock from the packet, so this is the only trace
  # of "what time did a peer last tell me" while clock_valid is false.
  - platform: template
    name: "Last Peer Time"
    id: last_peer_time
    icon: mdi:clock-sync-outline
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Soil Calibrated"
    id: soil_calibrated
    icon: mdi:check-decagram
    entity_category: diagnostic
    lambda: |-
      auto m = id(cal_method).state;
      return m != "none" && !m.empty();
  - platform: template
    name: "Clock Valid"
    id: clock_valid_bs
    device_class: running
    entity_category: diagnostic
    icon: mdi:clock-check-outline
    lambda: 'return id(clock_valid);'

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: template
    name: "Reset Sensor Calibration"
    id: cal_reset
    icon: mdi:restore
    entity_category: config
    on_press:
      - lambda: "id(cal_mute_stamp) = true;"
      - number.set: {id: cal_moist_offset, value: 0}
      - number.set: {id: cal_moist_scale, value: 1}
      - number.set: {id: cal_temp_offset, value: 0}
      - number.set: {id: cal_temp_scale, value: 1}
      - number.set: {id: cal_ec_offset, value: 0}
      - number.set: {id: cal_ec_scale, value: 1}
      - number.set: {id: cal_ph_offset, value: 0}
      - number.set: {id: cal_ph_scale, value: 1}
      - number.set: {id: cal_n_offset, value: 0}
      - number.set: {id: cal_n_scale, value: 1}
      - number.set: {id: cal_p_offset, value: 0}
      - number.set: {id: cal_p_scale, value: 1}
      - number.set: {id: cal_k_offset, value: 0}
      - number.set: {id: cal_k_scale, value: 1}
      - text.set: {id: cal_method, value: "none"}
      - text.set: {id: cal_last, value: ""}
      - lambda: "id(cal_mute_stamp) = false;"
      - logger.log: "Soil sensor calibration reset to defaults (scale=1, offset=0); provenance cleared"
  - platform: template
    name: "Mark Soil Cal Peer Median"
    id: cal_mark_peer_median
    icon: mdi:account-group
    entity_category: config
    on_press:
      - lambda: "id(cal_mute_stamp) = true;"
      - text.set:
          id: cal_method
          value: "peer_median"
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            char buf[32];
            snprintf(buf, sizeof(buf), "%04d-%02d-%02dT%02d:%02d:%02d",
                     now.year, now.month, now.day_of_month,
                     now.hour, now.minute, now.second);
            id(cal_last).make_call().set_value(std::string(buf)).perform();
          }
          id(cal_mute_stamp) = false;
          ESP_LOGI("cal", "Soil cal method stamped peer_median");
  - platform: template
    name: "Mark Soil Cal Lab Buffer"
    id: cal_mark_lab_buffer
    icon: mdi:flask
    entity_category: config
    on_press:
      - lambda: "id(cal_mute_stamp) = true;"
      - text.set:
          id: cal_method
          value: "lab_buffer"
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            char buf[32];
            snprintf(buf, sizeof(buf), "%04d-%02d-%02dT%02d:%02d:%02d",
                     now.year, now.month, now.day_of_month,
                     now.hour, now.minute, now.second);
            id(cal_last).make_call().set_value(std::string(buf)).perform();
          }
          id(cal_mute_stamp) = false;
          ESP_LOGI("cal", "Soil cal method stamped lab_buffer");

# ==================================================================
#  PLANT IDENTITY  —  labels, not control inputs. The label travels
#  with the probe (pull the node, the plant it watched comes with it).
# ==================================================================
text:
  - platform: template
    name: "Soil Cal Method"
    id: cal_method
    icon: mdi:clipboard-check-outline
    optimistic: true
    restore_value: true
    initial_value: "none"
    max_length: 16
    mode: text
    entity_category: diagnostic
  - platform: template
    name: "Soil Cal Last"
    id: cal_last
    icon: mdi:clock-check-outline
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    mode: text
    entity_category: diagnostic
  - platform: template
    name: "Plant Name"
    id: plant_name
    icon: "mdi:tag-text-outline"
    optimistic: true
    restore_value: true
    initial_value: "Unassigned"
    max_length: 32
    mode: text
    entity_category: config

select:
  - platform: template
    name: "Growth Stage"
    id: growth_stage
    icon: "mdi:sprout"
    optimistic: true
    restore_value: true
    initial_option: "Vegetative"
    entity_category: config
    options:
      - "Germination"
      - "Seedling"
      - "Early Vegetative"
      - "Vegetative"
      - "Late (Push) Vegetative"
      - "Early Flowering"
      - "Flowering"
      - "Late Flowering"
      - "Final 48-72h Flowering"
      - "Dry Mode"
      - "Off"
  - platform: template
    name: "Strain"
    id: strain
    icon: "mdi:dna"
    optimistic: true
    restore_value: true
    initial_option: "Generic Photoperiod"
    entity_category: config
    options:
      - "Generic Photoperiod"
      - "Generic Autoflower"
      - "Custom 1"
      - "Custom 2"
      - "Custom 3"
      - "Custom 4"
      - "Custom 5"

datetime:
  - platform: template
    name: "Sprout Date"
    id: sprout_date
    type: date
    icon: "mdi:calendar-start"
    optimistic: true
    restore_value: true
    entity_category: config

# ==================================================================
#  ESP-NOW PROVIDER  —  the pot half of the link
#  ------------------------------------------------------------------
#  Every 60s (matching the probe poll) this node unicasts its full soil
#  set to the hub MAC, xxtea-signed with espnow_key. The provider NAME
#  is this node's name: (dsc_pot1..4 via the stubs) and MUST match the
#  hub's providers: list — it does, by construction.
#
#  v4.0: the sensors: list now carries ALL SEVEN fields (was temp +
#  moisture). The hub reads soil_temperature by remote_id for the mat
#  exactly as before, and relays the rest to the DSC-CONTROL panel.
#
#  BEFORE FLASHING (per node): espnow_key in secrets (same everywhere);
#  Prefer wifi_bssid pin (same Nest AP as hub). Flash hub first, then
#  POT2 as canary, then the rest (USB first time, OTA after).
# ==================================================================
globals:
  - id: cal_mute_stamp
    type: bool
    restore_value: false
    initial_value: "false"
  - id: hub_beat_last
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: link_rec_stage
    type: int
    restore_value: false
    initial_value: '0'
  - id: link_rec_wifi_bounces
    type: int
    restore_value: false
    initial_value: '0'
  - id: link_rec_reboots
    type: int
    restore_value: false
    initial_value: '0'
  - id: link_rec_last_action
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: hub_ap_bssid_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: hub_ap_bssid
    type: uint8_t[6]
    restore_value: false
    initial_value: '{0,0,0,0,0,0}'
  # v5.1.7: sntp_time.now().is_valid() || ha_time.now().is_valid(), recomputed
  # every 15s (see interval below). Gates the 0xD7 "adopt peer time" path.
  - id: clock_valid
    type: bool
    restore_value: false
    initial_value: 'false'

espnow:
  auto_add_peer: false
  peers:
    - ${hub_mac}
  on_receive:
    - lambda: |-
        // Hub 0xD0 handshake — alive + Nest BSSID to join.
        if (size >= 2 && data[0] == 0xD0 && data[1] == 0x01) {
          id(hub_beat_last) = millis();
          id(link_rec_stage) = 0;
          if (size >= 9) {
            bool nz = false;
            for (int i = 0; i < 6; i++) {
              id(hub_ap_bssid)[i] = data[3 + i];
              if (data[3 + i]) nz = true;
            }
            id(hub_ap_bssid_ok) = nz;
            // Accept handshake → disconnect/reconnect to that exact BSSID.
            if (nz) id(adopt_hub_wifi_ap).execute();
          }
        }
        // v5.1.7 — 0xD0 v2: same {ver,channel,BSSID} shape as v1, but softer.
        // Only adopt when we don't already have a preferred AP; if we do,
        // log only — v2 must not fight an already-settled v1 adoption.
        if (size >= 9 && data[0] == 0xD0 && data[1] == 0x02) {
          id(hub_beat_last) = millis();
          id(link_rec_stage) = 0;
          uint8_t v2[6];
          bool nz = false;
          for (int i = 0; i < 6; i++) { v2[i] = data[3 + i]; if (v2[i]) nz = true; }
          if (nz) {
            if (!id(hub_ap_bssid_ok)) {
              for (int i = 0; i < 6; i++) id(hub_ap_bssid)[i] = v2[i];
              id(hub_ap_bssid_ok) = true;
              ESP_LOGI("wifi", "0xD0v2 handshake — adopting hub preferred AP (had none)");
              id(adopt_hub_wifi_ap).execute();
            } else {
              ESP_LOGD("wifi", "0xD0v2 handshake — preferred AP already set, not overriding");
            }
          }
        }
        // v5.1.7 — 0xD7 TIME: hub-broadcast epoch (u32 LE at data[2..5]).
        // Neither sntp_time nor ha_time exposes a way to inject "now" from
        // here, so while our own clock is invalid this only publishes a
        // diagnostic text_sensor — it does NOT make clock_valid true.
        if (size >= 6 && data[0] == 0xD7 && data[1] == 0x01) {
          uint32_t epoch = (uint32_t) data[2] | ((uint32_t) data[3] << 8)
                          | ((uint32_t) data[4] << 16) | ((uint32_t) data[5] << 24);
          bool pack_valid = epoch > 1698800000u;  // sanity: after 2023-11-01
          if (!id(clock_valid) && pack_valid) {
            ESPTime et = ESPTime::from_epoch_utc(epoch);
            char buf[24];
            snprintf(buf, sizeof(buf), "%04d-%02d-%02dT%02d:%02d:%02dZ",
                     et.year, et.month, et.day_of_month, et.hour, et.minute, et.second);
            id(last_peer_time).publish_state(std::string(buf));
          }
        }

packet_transport:
  - platform: espnow
    id: pt_espnow
    peer_address: ${hub_mac}
    update_interval: 60s
    encryption:
      key: ${espnow_key}
    # Sensor ids here are what the hub's remote_id: fields reference.
    # v4.0: full soil set (was soil_temperature + soil_moisture only).
    sensors:
      - soil_temperature     # the closed-loop mat's sense point (unchanged)
      - soil_moisture
      - soil_conductivity
      - soil_ph
      - soil_nitrogen
      - soil_phosphorus
      - soil_potassium

script:
  - id: cal_stamp_manual
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(cal_mute_stamp);"
          then:
            - text.set:
                id: cal_method
                value: "manual"
            - lambda: |-
                auto now = id(ha_time).now();
                if (!now.is_valid()) return;
                char buf[32];
                snprintf(buf, sizeof(buf), "%04d-%02d-%02dT%02d:%02d:%02d",
                         now.year, now.month, now.day_of_month,
                         now.hour, now.minute, now.second);
                id(cal_last).make_call().set_value(std::string(buf)).perform();

  # Accept hub 0xD0 BSSID handshake → disconnect/reconnect to THAT AP.
  - id: adopt_hub_wifi_ap
    mode: single
    then:
      - lambda: |-
          if (!id(hub_ap_bssid_ok)) return;
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;

          wifi::bssid_t want{};
          for (int i = 0; i < 6; i++) want[i] = id(hub_ap_bssid)[i];

          if (w->is_connected()) {
            auto cur = w->wifi_bssid();
            bool same = true;
            for (int i = 0; i < 6; i++) if (cur[i] != want[i]) { same = false; break; }
            if (same) {
              w->set_sta_priority(want, 127);
              return;  // already on hub's Nest point
            }
          }

          static uint32_t last_adopt_ms = 0;
          if (last_adopt_ms != 0 && (millis() - last_adopt_ms) < 60000u) return;
          if (id(link_rec_wifi_bounces) >= 3) return;
          last_adopt_ms = millis();
          id(link_rec_wifi_bounces) = id(link_rec_wifi_bounces) + 1;

          // Rebuild STA with the hub's BSSID so the reconnect targets it.
          wifi::WiFiAP sta = w->get_sta();
          if (sta.get_ssid().empty() && w->is_connected()) {
            // Kit/NVS path: keep whatever STA is live; only force BSSID.
            sta = w->get_sta();
          }
          sta.set_bssid(want);
          sta.set_priority(127);
          w->set_sta(sta);
          w->set_sta_priority(want, 127);
          ESP_LOGW("wifi",
                   "0xD0 handshake — reconnect to hub AP %02X:%02X:%02X:%02X:%02X:%02X (#%d)",
                   want[0], want[1], want[2], want[3], want[4], want[5],
                   id(link_rec_wifi_bounces));
      - wifi.disable:
      - delay: 2s
      - wifi.enable:
      - delay: 8s
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w != nullptr && w->is_connected() && id(hub_ap_bssid_ok)) {
            auto cur = w->wifi_bssid();
            ESP_LOGI("wifi", "Rejoined AP %02X:%02X:%02X:%02X:%02X:%02X (hub wanted %02X:%02X:%02X:%02X:%02X:%02X)",
                     cur[0], cur[1], cur[2], cur[3], cur[4], cur[5],
                     id(hub_ap_bssid)[0], id(hub_ap_bssid)[1], id(hub_ap_bssid)[2],
                     id(hub_ap_bssid)[3], id(hub_ap_bssid)[4], id(hub_ap_bssid)[5]);
          } else {
            ESP_LOGW("wifi", "Reconnect after 0xD0 handshake still settling");
          }

  - id: link_wifi_bounce
    mode: single
    then:
      - lambda: |-
          // Silent-recovery bounce: if we have a hub BSSID, pin it first.
          auto *w = wifi::global_wifi_component;
          if (w != nullptr && id(hub_ap_bssid_ok)) {
            wifi::bssid_t want{};
            for (int i = 0; i < 6; i++) want[i] = id(hub_ap_bssid)[i];
            wifi::WiFiAP sta = w->get_sta();
            sta.set_bssid(want);
            sta.set_priority(127);
            w->set_sta(sta);
            w->set_sta_priority(want, 127);
          }
      - wifi.disable:
      - delay: 3s
      - wifi.enable:
      - delay: 8s
      - lambda: 'ESP_LOGI("link", "WiFi bounce complete — waiting for hub 0xD0");'

  - id: link_recovery_reboot
    mode: single
    then:
      - delay: 250ms
      - lambda: 'App.safe_reboot();'

  - id: pot_hub_ping
    mode: single
    then:
      - espnow.send:
          address: ${hub_mac}
          wait_for_sent: false
          data: !lambda 'return std::vector<uint8_t>{0xD0, 0x01, 0};'

  # v5.1.7 — TX 0xD5 "RF card" every 10s. Local role numbering (NOT the
  # dsc_fleet_setup FleetRole enum): 2 = pot, unknown/unassigned slot;
  # 2+fleet_pot_index (3-6) once this pot's identity (1-4) is known —
  # see the fleet_pot_index substitution above.
  # Layout: [0]0xD5 [1]ver=1 [2]role [3]channel [4]rssi(int8)
  #         [5]assoc_ok [6..7]assoc BSSID[4..5]  [8]pref_ok [9..10]pref BSSID[4..5]
  # "pref" here is hub_ap_bssid (the hub-preferred AP this pot is holding
  # via 0xD0), not a pot-local preferred-BSSID entity (the pot has none).
  - id: tx_rf_card
    mode: single
    then:
      - espnow.send:
          address: ${hub_mac}
          wait_for_sent: false
          data: !lambda |-
            std::vector<uint8_t> p(11, 0);
            p[0] = 0xD5; p[1] = 0x01;
            uint8_t pidx = ${fleet_pot_index};
            p[2] = (pidx >= 1 && pidx <= 4) ? (uint8_t)(2 + pidx) : (uint8_t)2;
            auto *w = wifi::global_wifi_component;
            bool connected = w != nullptr && w->is_connected();
            if (connected) {
              p[3] = (uint8_t) w->get_wifi_channel();
              int rssi = (int) w->wifi_rssi();
              if (rssi < -128) rssi = -128;
              if (rssi > 0) rssi = 0;
              p[4] = (uint8_t)(int8_t) rssi;
              auto b = w->wifi_bssid();
              p[5] = 1; p[6] = b[4]; p[7] = b[5];
            }
            if (id(hub_ap_bssid_ok)) {
              p[8] = 1; p[9] = id(hub_ap_bssid)[4]; p[10] = id(hub_ap_bssid)[5];
            }
            return p;

# Hub 0xD0 every 5s. Silent ladder: ping → WiFi bounce (API rebind) → reboot.
interval:
  - interval: 10s
    then:
      - script.execute: tx_rf_card
  # v5.1.7 — clock_valid: sntp OR ha, recomputed every 15s (same cadence as
  # the hub's fleet-heal ledger tick).
  - interval: 15s
    then:
      - lambda: |-
          id(clock_valid) = id(sntp_time).now().is_valid() || id(ha_time).now().is_valid();
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u) return false;
              uint32_t age = (id(hub_beat_last) == 0) ? millis() : (millis() - id(hub_beat_last));
              if (age < 15000u) { id(link_rec_stage) = 0; return false; }
              if (id(link_rec_last_action) != 0 && (millis() - id(link_rec_last_action)) < 20000u)
                return false;
              return age >= 15000u && id(link_rec_stage) < 1;
          then:
            - lambda: |-
                id(link_rec_stage) = 1;
                id(link_rec_last_action) = millis();
                ESP_LOGW("link", "hub heartbeat silent — ESP-NOW ping");
            - script.execute: pot_hub_ping
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u) return false;
              uint32_t age = (id(hub_beat_last) == 0) ? millis() : (millis() - id(hub_beat_last));
              if (id(link_rec_last_action) != 0 && (millis() - id(link_rec_last_action)) < 20000u)
                return false;
              return age >= 45000u && id(link_rec_stage) < 2 && id(link_rec_wifi_bounces) < 3;
          then:
            - lambda: |-
                id(link_rec_stage) = 2;
                id(link_rec_wifi_bounces) = id(link_rec_wifi_bounces) + 1;
                id(link_rec_last_action) = millis();
                ESP_LOGW("link", "hub heartbeat silent — WiFi bounce #%d (API rebind + AP rejoin)",
                         id(link_rec_wifi_bounces));
            - script.execute: link_wifi_bounce
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u) return false;
              // BUG-FIX 2026-08-02: never escalate to reboot when the hub was
              // NEVER heard this boot (hub_beat_last==0) — the RAM-only 2/boot
              // cap resets every reboot, so an absent hub caused an infinite
              // reboot loop. Ping + capped WiFi bounces still run above.
              // Reboot remains for a previously-good session gone silent.
              if (id(hub_beat_last) == 0) {
                static uint32_t nohub_log_ms = 0;
                if (millis() - nohub_log_ms > 300000u) {
                  nohub_log_ms = millis();
                  ESP_LOGW("link", "hub never heard this boot — soft recovery only, no reboot");
                }
                return false;
              }
              uint32_t age = millis() - id(hub_beat_last);
              if (id(link_rec_last_action) != 0 && (millis() - id(link_rec_last_action)) < 20000u)
                return false;
              return age >= 120000u && id(link_rec_stage) >= 2 && id(link_rec_reboots) < 2;
          then:
            - lambda: |-
                id(link_rec_reboots) = id(link_rec_reboots) + 1;
                id(link_rec_stage) = 3;
                id(link_rec_last_action) = millis();
                ESP_LOGE("link", "hub heartbeat silent after WiFi bounce — safe_reboot #%d",
                         id(link_rec_reboots));
            - script.execute: link_recovery_reboot

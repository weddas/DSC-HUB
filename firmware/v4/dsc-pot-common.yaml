# ==================================================================
#  SOIL SENSORS  —  registers 0x0000..0x0006
# ==================================================================
# ⚠ NAMES ARE THE ENTITY_ID CONTRACT. Pipeline per channel:
#  register scale → user cal (scale+offset) → out-of-range → NAN →
#  median(3). NAN is honest; a wrong number is not.
sensor:
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    icon: mdi:water-percent
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          float s = id(cal_moist_scale).state;
          float o = id(cal_moist_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 100.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # S_WORD: sub-zero soil reports as negative. U_WORD would wrap -1C to
  # 6553.5C, which the range guard then rejects as NAN — blinding the mat
  # on the coldest night. This is the sensor the closed-loop mat reads.
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Temperature"
    id: soil_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    register_type: holding
    address: 0x0001
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          float s = id(cal_temp_scale).state;
          float o = id(cal_temp_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < -20.0f || x > 60.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Conductivity"
    id: soil_conductivity
    unit_of_measurement: "µS/cm"
    state_class: measurement
    icon: mdi:flash
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_ec_scale).state;
          float o = id(cal_ec_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 20000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil pH"
    id: soil_ph
    unit_of_measurement: "pH"
    state_class: measurement
    icon: mdi:ph
    register_type: holding
    address: 0x0003
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.1
      - lambda: |-
          float s = id(cal_ph_scale).state;
          float o = id(cal_ph_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 3.0f || x > 9.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # N/P/K: DERIVED from bulk EC, not measured ions. Trend indicators only
  # (the HA NPK alerts compare to a 7-day baseline, not an absolute).
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Nitrogen"
    id: soil_nitrogen
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0004
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_n_scale).state;
          float o = id(cal_n_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 2000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Phosphorus"
    id: soil_phosphorus
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0005
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_p_scale).state;
          float o = id(cal_p_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 2000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Potassium"
    id: soil_potassium
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0006
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float s = id(cal_k_scale).state;
          float o = id(cal_k_offset).state;
          if (isnan(s) || fabsf(s) < 1e-6f) s = 1.0f;
          if (isnan(o)) o = 0.0f;
          x = x * s + o;
          if (x < 0.0f || x > 2000.0f) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic
  - platform: template

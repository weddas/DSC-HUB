    min_value: -500
    max_value: 500
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    name: "Cal Nitrogen Scale"
    id: cal_n_scale
    icon: mdi:multiplication

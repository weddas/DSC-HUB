    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    name: "Cal Moisture Scale"
    id: cal_moist_scale
    icon: mdi:multiplication
    entity_category: config
    min_value: 0.5
    max_value: 1.5
    step: 0.01
    initial_value: 1

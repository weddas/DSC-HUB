  - platform: template
    name: "Cal Conductivity Scale"
    id: cal_ec_scale
    icon: mdi:multiplication
    entity_category: config
    min_value: 0.5
    max_value: 1.5
    step: 0.01
    initial_value: 1
    optimistic: true

# ==================================================================
#  DIGITAL-PLANT  ·  DSC-POT COMMON PACKAGE               (v4.0)
#  ESP32 · RS485 Modbus 7-in-1 NPK soil probe (JXCT-style)
#  ------------------------------------------------------------------
#  One package, four nodes. Fix once, deploy everywhere. The four
#  dsc-pot{1..4}.yaml stubs set ONLY name + friendly_name + secrets and
#  !include this file — never put logic in a stub.
#
#  ⚠ ENTITY IDs ARE A CONTRACT (sensor.dsc_pot1_soil_*, NO underscore
#  before the digit). Referenced by the HA stat/alert packages, the
#  dashboard, and the HUB's closed-loop grow mat. Do not rename a node.
#
#  v4.0 — ESP-NOW PRIMARY / FULL SOIL BROADCAST (25 Jul 2026)
#   * The pots now unicast the WHOLE soil readout to the hub every 60s —
#     temperature + moisture (the mat's sense loop, unchanged) PLUS
#     conductivity, pH, N, P and K. The hub relays all seven to the
#     DSC-CONTROL panel, so the panel's Soil tab is fully HA-independent.
#     ESP-NOW is the primary transport; the pots still publish every
#     value to Home Assistant as the backup path (dual, as before).
#   * The mat is untouched: the hub still reads soil_temperature by
#     remote_id exactly as in v2.4.1 — the extra fields just ride the
#     same packet.
#   * project.version -> 4.0 (device family version bump).
#  (Built on the v2.4.1 package below.)
#  ------------------------------------------------------------------
#  v2.4.1 — ESP-NOW PROVIDER LIVE. v2.4 — THE PACKAGE ROLLOUT (60s
#  polling, range->NAN + median(3), device_class/state_class, secrets
#  de-inlined). See the version history for the full lineage.
#
#  ⚠ POT3: soil probe reads 0.0% moisture — known fault, swap-test
#  pending. This package changes nothing about that; a faulty probe
#  reports faithfully through good firmware, and the hub's 5-45C
#  plausibility filter drops it from the mat's min()/max() scan.
# ==================================================================

substitutions:
  # Factory Modbus address of the probe (all four are 0x01 on their own
  # isolated bus). Here as a default in case a replacement probe differs.
  probe_address: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: digital_emotions.dsc-pot
    version: "4.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# De-inlined + rotated at the v2.4 flash. `!secret` resolves before
# substitutions, so the stub passes the VALUE in via ${..._val}.
api:
  encryption:
    key: ${api_key_val}
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: ${ota_password_val}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password_val}

captive_portal:

# ==================================================================
#  RS485 / MODBUS
# ==================================================================
uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 4800
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus1
  uart_id: rs485_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: soil_sensor_bus
    address: ${probe_address}
    modbus_id: modbus1
    # 60s: root-zone conditions don't change in 20s; this is also the
    # hub's closed-loop mat sense rate (inside the mat's 5-min min-off
    # and the hub's 5-min root-zone stale window).
    update_interval: 60s
    command_throttle: 100ms
    setup_priority: -10

# ==================================================================
#  SOIL SENSORS  —  registers 0x0000..0x0006
# ==================================================================
# ⚠ NAMES ARE THE ENTITY_ID CONTRACT. Every sensor gets the same two-
# stage guard: out-of-range -> NAN (a bus glitch is not a reading), then
# median(3) (one bad sample can't move the number). NAN is honest; a
# wrong number is not. "Never control on a blind sensor" starts here.
sensor:
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Moisture"
    id: soil_moisture
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    icon: mdi:water-percent
    register_type: holding
    address: 0x0000
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x < 0.0 || x > 100.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # S_WORD: sub-zero soil reports as negative. U_WORD would wrap -1C to
  # 6553.5C, which the range guard then rejects as NAN — blinding the mat
  # on the coldest night. This is the sensor the closed-loop mat reads.
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Temperature"
    id: soil_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: mdi:thermometer
    register_type: holding
    address: 0x0001
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x < -20.0 || x > 60.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Conductivity"
    id: soil_conductivity
    unit_of_measurement: "µS/cm"
    state_class: measurement
    icon: mdi:flash
    register_type: holding
    address: 0x0002
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 20000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil pH"
    id: soil_ph
    unit_of_measurement: "pH"
    state_class: measurement
    icon: mdi:ph
    register_type: holding
    address: 0x0003
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.1
      - lambda: |-
          if (x < 3.0 || x > 9.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  # N/P/K: DERIVED from bulk EC, not measured ions. Trend indicators only
  # (the HA NPK alerts compare to a 7-day baseline, not an absolute).
  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Nitrogen"
    id: soil_nitrogen
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0004
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 2000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Phosphorus"
    id: soil_phosphorus
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0005
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 2000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: modbus_controller
    modbus_controller_id: soil_sensor_bus
    name: "Soil Potassium"
    id: soil_potassium
    unit_of_measurement: "mg/kg"
    state_class: measurement
    icon: mdi:leaf
    register_type: holding
    address: 0x0006
    value_type: U_WORD
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (x < 0.0 || x > 2000.0) return NAN;
          return x;
      - median:
          window_size: 3
          send_every: 1

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "Firmware Version"
    hide_timestamp: true

button:
  - platform: restart
    name: "Restart"
    entity_category: config

# ==================================================================
#  PLANT IDENTITY  —  labels, not control inputs. The label travels
#  with the probe (pull the node, the plant it watched comes with it).
# ==================================================================
text:
  - platform: template
    name: "Plant Name"
    id: plant_name
    icon: "mdi:tag-text-outline"
    optimistic: true
    restore_value: true
    initial_value: "Unassigned"
    max_length: 32
    mode: text
    entity_category: config

select:
  - platform: template
    name: "Growth Stage"
    id: growth_stage
    icon: "mdi:sprout"
    optimistic: true
    restore_value: true
    initial_option: "Vegetative"
    entity_category: config
    options:
      - "Germination"
      - "Seedling"
      - "Early Vegetative"
      - "Vegetative"
      - "Late (Push) Vegetative"
      - "Early Flowering"
      - "Flowering"
      - "Late Flowering"
      - "Final 48-72h Flowering"
      - "Dry Mode"
      - "Off"

# ==================================================================
#  ESP-NOW PROVIDER  —  the pot half of the link
#  ------------------------------------------------------------------
#  Every 60s (matching the probe poll) this node unicasts its full soil
#  set to the hub MAC, xxtea-signed with espnow_key. The provider NAME
#  is this node's name: (dsc_pot1..4 via the stubs) and MUST match the
#  hub's providers: list — it does, by construction.
#
#  v4.0: the sensors: list now carries ALL SEVEN fields (was temp +
#  moisture). The hub reads soil_temperature by remote_id for the mat
#  exactly as before, and relays the rest to the DSC-CONTROL panel.
#
#  BEFORE FLASHING (per node): espnow_key in secrets (same everywhere);
#  AP channel LOCKED on the router. Flash the hub first, then POT2 as
#  canary, then the rest (USB first time, OTA after).
# ==================================================================
espnow:
  auto_add_peer: false
  peers:
    - 84:1F:E8:16:E6:60   # DSC-HUB (192.168.86.33, dsc-hub.local)

packet_transport:
  - platform: espnow
    id: pt_espnow
    peer_address: 84:1F:E8:16:E6:60
    update_interval: 60s
    encryption:
      key: !secret espnow_key
    # Sensor ids here are what the hub's remote_id: fields reference.
    # v4.0: full soil set (was soil_temperature + soil_moisture only).
    sensors:
      - soil_temperature     # the closed-loop mat's sense point (unchanged)
      - soil_moisture
      - soil_conductivity
      - soil_ph
      - soil_nitrogen
      - soil_phosphorus
      - soil_potassium

  - platform: template
    name: "Cal pH Offset"
    id: cal_ph_offset
    icon: mdi:tune-vertical
    entity_category: config
    unit_of_measurement: "pH"
    min_value: -2
    max_value: 2
    step: 0.01
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    name: "Cal pH Scale"
    id: cal_ph_scale
    icon: mdi:multiplication
    entity_category: config
    min_value: 0.5
    max_value: 1.5
    step: 0.01

# ==================================================================
#  PANEL STATE
# ==================================================================
globals:
  # ---- ESP-NOW telemetry sink (populated by on_receive) ----
  - {id: gv_hub_last, type: uint32_t, initial_value: '0'}     # millis of last hub packet
  - {id: cmd_tx_seq,  type: uint16_t, initial_value: '0'}
  - {id: gv_plant1, type: std::string, initial_value: '""'}
  - {id: gv_plant2, type: std::string, initial_value: '""'}
  - {id: gv_plant3, type: std::string, initial_value: '""'}
  - {id: gv_plant4, type: std::string, initial_value: '""'}
  - {id: gv_tent_t,   type: float, initial_value: 'NAN'}
  - {id: gv_clone_t,  type: float, initial_value: 'NAN'}
  - {id: gv_room_t,   type: float, initial_value: 'NAN'}
  - {id: gv_tent_rh,  type: float, initial_value: 'NAN'}
  - {id: gv_clone_rh, type: float, initial_value: 'NAN'}
  - {id: gv_room_rh,  type: float, initial_value: 'NAN'}
  - {id: gv_tent_vpd, type: float, initial_value: 'NAN'}
  - {id: gv_clone_vpd,type: float, initial_value: 'NAN'}
  - {id: gv_co2,      type: float, initial_value: 'NAN'}
  - {id: gv_fan_out,    type: int, initial_value: '0'}
  - {id: gv_fan_recirc, type: int, initial_value: '0'}
  - {id: gv_fan_imain,  type: int, initial_value: '0'}
  - {id: gv_fan_iclone, type: int, initial_value: '0'}
  - {id: gv_sf_pct,   type: int, initial_value: '0'}
  - {id: gv_ramp,     type: int, initial_value: '0'}
  - {id: gv_stage,    type: int, initial_value: '0'}
  - {id: gv_strat,    type: int, initial_value: '0'}
  - {id: gv_cmode,    type: int, initial_value: '0'}
  - {id: gv_prio,     type: int, initial_value: '1'}
  - {id: gv_dem,      type: int, initial_value: '0'}   # bits: hum dehum heat mat ac clonehum
  - {id: gv_mode,     type: int, initial_value: '0'}   # bits: fauto man takeover photo lighthold mainA cloneA
  - {id: gv_arm,      type: int, initial_value: '0'}   # bits: hum dehum heat mat ac clonehum
  - {id: gv_flt,      type: int, initial_value: '0'}   # bits: sensor room clone rootzone haconn lights_main lights_clone emg
  - {id: gv_coord,    type: int, initial_value: '0'}   # bits: humroute destrat pot1..4 link
  - id: gv_cfg
    type: float[27]
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: gv_soil
    type: float[28]
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: gv_cd
    type: float[6]        # ladder countdowns: hum dehum heat ac mat clonehum (added to vitals)
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: panel_sleeping
    type: bool
    initial_value: 'false'
  - id: night_mode
    type: bool
    initial_value: 'false'
  - id: alerts_silenced          # local mute; auto-clears when alerts do
    type: bool
    initial_value: 'false'
  - id: green_heartbeat          # solid dim green when all-OK (Settings toggle; no pulse)
    type: bool
    restore_value: true
    initial_value: 'true'
  # ---- flashlight (screen-as-torch) ----
  - id: fl_active
    type: bool
    initial_value: 'false'
  - id: fl_color                 # 0=green 1=white 2=red
    type: int
    restore_value: true
    initial_value: '0'
  - id: fl_bright                # backlight % while torch is on
    type: int
    restore_value: true
    initial_value: '70'
  - id: bl_last                  # last backlight % written (global so the lock can force a restore)
    type: int
    initial_value: '-1'
  - id: led_last                 # last status-LED mode written (global so the torch can reclaim it)
    type: int
    initial_value: '-1'
  - id: alert_count
    type: int
    initial_value: '0'
  - id: last_touch_ms
    type: uint32_t
    initial_value: '0'
  - id: edit_target              # editor page: 0=stage 1=strategy 2=clone 3=priority
    type: int
    initial_value: '0'
  - id: active_tab               # 0=Pulse 1=Clone 2=Main 3=Soil 4=Control
    type: int
    initial_value: '0'
  - id: soil_detail_pot          # 1..4 — which pot page_soil_detail shows
    type: int
    initial_value: '1'
  - id: ui_soil_detail            # true while page_soil_detail is showing
    type: bool
    initial_value: 'false'
  # ---- tap-challenge gate (Manual Takeover + appliance demands) ----
  - id: gate_op
    type: int
    initial_value: '0'
  - id: gate_val
    type: int
    initial_value: '0'
  # ---- Pulse 1h VPD micro-trend (12 × 5 min = 1 h; one label, no canvas) ----
  - id: spark_vpd
    type: float[12]
    initial_value: '{NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN,NAN}'
  - id: spark_idx
    type: int
    initial_value: '0'
  - id: spark_filled
    type: bool
    initial_value: 'false'
  # ---- screen lock (hold-to-lock, seed->plant growth) ----
  - id: lock_engaged             # is the panel locked
    type: bool
    initial_value: 'false'
  - id: holding                  # a lock/unlock hold is in progress
    type: bool
    initial_value: 'false'
  - id: hold_start               # millis() when the current hold began
    type: uint32_t
    initial_value: '0'
  - id: anim_phase               # unused since v4.0.6 (breathe removed)
    type: int
    initial_value: '0'
  - id: dev_mask                 # bitmask of active device icons (UI colouring)
    type: int
    initial_value: '0'
  # ---- connection uptimes (millis timestamp of last (re)connect) ----
  - {id: wifi_conn, type: bool, initial_value: 'false'}                # driven by wifi on_connect/on_disconnect
  - {id: wifi_channel, type: int, initial_value: '0'}
  - {id: wifi_channel_hopped, type: bool, initial_value: 'false'}
  - id: wifi_since
    type: uint32_t
    initial_value: '0'
  - id: wifi_was
    type: bool
    initial_value: 'false'
  - id: api_since
    type: uint32_t
    initial_value: '0'
  - id: api_was
    type: bool
    initial_value: 'false'


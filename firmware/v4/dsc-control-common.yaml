  # =============================== PAGES ===========================
  pages:
    # ------------------------------ BOOT (5.1.15 Starting + bar) ---
    # Lean: brand + status + one bar + pct. No icons/cards — RAM-safe.
    # Backlight stays off until this page is painted; then hello + snapshot.
    - id: page_boot
      scrollbar_mode: "OFF"
      bg_color: 0x0E1116
      widgets:
        - label:
            text: "DSC-CONTROL"
            text_font: f_med
            align: TOP_MID
            y: 72
            text_color: 0x00E676
        - label:
            id: lbl_boot_status
            text: "starting..."
            text_font: f_small
            align: TOP_MID
            y: 108
            text_color: 0x8A929C
        - bar:
            id: boot_bar
            x: 40
            y: 140
            width: 240
            height: 10
            min_value: 0
            max_value: 100
            value: 0
            animated: false
            indicator:
              bg_color: 0x00E676
            bg_color: 0x232A33
        - label:
            id: lbl_boot_pct
            text: "0%"
            text_font: f_small
            align: TOP_MID
            y: 158
            text_color: 0x5A6472
        - label:
            text: "v5.1.16"
            text_font: f_small
            align: TOP_MID
            y: 188
            text_color: 0x3A4550
    # ------------------------------ PULSE --------------------------
    - id: page_pulse
      scrollbar_mode: "OFF"
      bg_color: 0x0E1116
      on_swipe_left:
        - script.execute: hold_cancel
        - script.execute: tab_next
      on_swipe_right:
        - script.execute: hold_cancel
        - script.execute: tab_prev
      widgets:
        # status pills

            ic(id(ic_mout), pon(fan_out_pct),       CYAN);
            ic(id(ic_mroom),pon(fan_recirc_pct),    CYAN);
            ic(id(ic_mint), pon(fan_int_main_pct),  BLUE);
            ic(id(ic_mheat),dem_heater,            ORANGE);
            ic(id(ic_mac),  dem_ac,                 BLUE);
            ic(id(ic_mhum), dem_hum,                CYAN);
            ic(id(ic_mdeh), dem_dehum,              AMBER);

# ================= LVGL SECTION APPENDED BELOW =================

# ==================================================================
#  LVGL UI  — built from DSC-HUB Panel v4 (ESP-CYD Test V1)
#  Palette (design): NEON #00E676  AMBER #FFAA00  ORANGE #FF9800
#  BLUE #2196F3  CYAN #00BCD4  RED #F44336  card #171B22  bg #0E1116
# ==================================================================
lvgl:
  # Pin the draw buffer to 1/8 screen (19,200 B). Left unset, LVGL first
  # asks for a FULL 320x240x2 = 153,600 B buffer; on this PSRAM-less
  # board that always failed and LVGL silently fell back to 1/8 anyway,
  # so 1/8 is what the panel has been running on all along and the
  # picture is unchanged. Pinning it stops the full-size grab from ever
  # starting to succeed and swallowing the recovered heap.
  #
  # v4.0.2 correction: the v4.0.1 note justified this with "sram1_as_iram
  # frees 40 KB". It does not (see the esp32: block above) — but the pin
  # is still right, for the reason above.
  #
  # And 12% is already the floor. ESPHome buckets this percentage into a
  # fraction in lvgl/__init__.py:
  #     >=0.75 -> 1;  >=0.375 -> 2;  >0.19 -> 4;  else -> 8
  # so anything in (0, 19%] lands on 1/8. Setting 6% or 3% here would
  # change nothing at all. There is no smaller draw buffer available.
  buffer_size: 12%
  displays:
    - cyd_display
  touchscreens:
    - cyd_touch
  color_depth: 16
  default_font: f_body
  bg_color: 0x0E1116
  text_color: 0xFFFFFF
  # A touch anywhere refreshes the idle timer (screensaver + night).
  on_idle:
    timeout: 60s
    then:
      - script.execute: go_sleep

  style_definitions:
    - id: card
      bg_color: 0x171B22
      bg_opa: COVER
      border_color: 0x232A33
      border_width: 1
      radius: 8
      pad_all: 6
      text_color: 0xFFFFFF
    - id: rowbtn
      bg_color: 0x171B22
      bg_opa: COVER
      border_color: 0x232A33
      border_width: 1
      radius: 8
      pad_all: 8
      shadow_width: 0
      text_color: 0xFFFFFF
      width: 300

  # ---------------- persistent tab bar + modal overlays -------------
  top_layer:
    widgets:
      - obj:
          id: tabbar
          x: 0
          y: 200
          width: 320
          height: 40
          bg_color: 0x0A0D11
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - button:
                id: tab_btn0

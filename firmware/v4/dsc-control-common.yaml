                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic0, text: "\U000F05F6", text_font: mdi_28, align: CENTER, text_color: 0x00E676}
                on_click:
                  - lvgl.page.show: page_pulse
                  - lambda: 'id(active_tab) = 0;'
                  - script.execute: restyle_tabs
            - button:
                id: tab_btn1
                x: 64
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic1, text: "\U000F0E66", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_clone
                  - lambda: 'id(active_tab) = 1;'
                  - script.execute: restyle_tabs
            - button:
                id: tab_btn2
                x: 128
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic2, text: "\U000F032A", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_main
                  - lambda: 'id(active_tab) = 2;'
                  - script.execute: restyle_tabs
            - button:
                id: tab_btn3
                x: 192
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic3, text: "\U000F058E", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_soil
                  - lambda: 'id(active_tab) = 3;'
                  - script.execute: restyle_tabs
            - button:
                id: tab_btn4
                x: 256
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic4, text: "\U000F066A", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_control
                  - lambda: 'id(active_tab) = 4;'
                  - script.execute: restyle_tabs

      # ---- big SILENCE banner: shown only while an alert is live ----

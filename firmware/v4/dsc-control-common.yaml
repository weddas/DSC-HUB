      # ---- HOLD HUD (transient growth animation, topmost) ----
      # Shown during any lock/unlock hold. Locking: seed -> plant. Unlocking:
      # plant -> seed. Reaches the end at 3s, then commits.
      - obj:
          id: hold_hud
          hidden: true
          x: 0

          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: 72%
          border_width: 0
          radius: 0
          scrollable: false
          widgets:
            - label: {id: hud_sky,   text: "\U000F0594", text_font: mdi_28,   align: CENTER, y: -86, text_color: 0x5A6472}
            - label: {id: hud_plant, text: "\U000F0E62", text_font: mdi_grow, align: CENTER, y: -18, text_color: 0x00E676}
            - label: {id: hud_hint, text: "GOING TO SLEEP", text_font: f_med, align: CENTER, y: 46, text_color: 0xFFFFFF}
            - bar:

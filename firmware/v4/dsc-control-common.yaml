            pctlbl(id(exhroom_val), fan_recirc_pct, 26);
            pctlbl(id(intmain_val), fan_int_main_pct, 27);
            stlbl(id(dem_heater_st), dem_heater, 14);
            stlbl(id(dem_ac_st), dem_ac, 16);
            stlbl(id(dem_hum_st), dem_hum, 12);
            stlbl(id(dem_dehum_st), dem_dehum, 13);
            auto pon = [](float v){ return !isnan(v) && v > 0; };
            auto ic = [&](lv_obj_t* L, bool on, uint32_t col){
              setc(L, on ? col : 0x39424D);
              if (lv_obj_get_style_text_opa(L, LV_PART_MAIN) != 255)
                lv_obj_set_style_text_opa(L, 255, LV_PART_MAIN);

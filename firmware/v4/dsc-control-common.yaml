# ================= LVGL SECTION APPENDED BELOW =================

# ==================================================================
#  LVGL UI  — built from DSC-HUB Panel v4 (ESP-CYD Test V1)
#  Palette (design): NEON #00E676  AMBER #FFAA00  ORANGE #FF9800
#  BLUE #2196F3  CYAN #00BCD4  RED #F44336  card #171B22  bg #0E1116
# ==================================================================
lvgl:
  # v5.1.3 — start paused so setup/WiFi do not letter-draw under peak heap
  # pressure. v5.1.5 on_boot: resume-lite (page_boot) then resume-full.
  # Do not resume_on_input (a wake tap must not force paint before
  # boot_ui_ready).
  paused: true
  resume_on_input: false
  # v5.1.8 — single partial draw buffer ≈ 8% of framebuffer
  # (320×240×2×0.08 = 12,288 B) in internal SRAM. Checklist: never
  # full-frame / double-buffer without PSRAM. Reclaims ~3 KB vs 10%.
  buffer_size: 8%
  displays:
    - cyd_display
  touchscreens:
    - cyd_touch
  color_depth: 16
  default_font: f_body
  bg_color: 0x0E1116
  text_color: 0xFFFFFF

  style_definitions:
    - id: card
      bg_color: 0x171B22
      bg_opa: COVER
      border_color: 0x232A33
      border_width: 1
      radius: 8
      pad_all: 6
      text_color: 0xFFFFFF
    - id: rowbtn
      bg_color: 0x171B22
      bg_opa: COVER
      border_color: 0x232A33
      border_width: 1
      radius: 8
      pad_all: 8
      shadow_width: 0
      text_color: 0xFFFFFF
      width: 300

  # ---------------- persistent tab bar + modal overlays -------------
  top_layer:
    widgets:
      - obj:
          id: tabbar
          x: 0
          y: 200
          width: 320
          height: 40
          bg_color: 0x0A0D11
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - button:

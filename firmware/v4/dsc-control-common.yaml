# ==================================================================
#  SCRIPTS
# ==================================================================
script:
  # ---- send a command to the hub: {0xDC,ver,op,flags,i32 val,u16 tag,u16 seq} ----
  # UI control actions call this instead of homeassistant.action. Float values
  # are passed pre-scaled by ×100 (e.g. 24.5 °C -> op 30, val 2450).
  - id: hub_cmd
    parameters:
      op: int
      val: int
    then:
      - espnow.send:
          address: ${hub_mac}
          wait_for_sent: false
          data: !lambda |-
            std::vector<uint8_t> p(12, 0);
            p[0]=0xDC; p[1]=0x01; p[2]=(uint8_t) op; p[3]=0;
            uint32_t uv=(uint32_t) val; p[4]=uv&0xFF; p[5]=(uv>>8)&0xFF; p[6]=(uv>>16)&0xFF; p[7]=(uv>>24)&0xFF;
            uint16_t tg=(uint16_t) ${espnow_cmd_tag}; p[8]=tg&0xFF; p[9]=(tg>>8)&0xFF;
            uint16_t sq=id(cmd_tx_seq)++; p[10]=sq&0xFF; p[11]=(sq>>8)&0xFF;
            return p;

  # ---- swipe navigation: show the page for active_tab (0..4) ----
  # active_tab is set FIRST (clamped), then this shows the matching page
  # with independent ifs (no mutation mid-chain), so exactly one fires.
  - id: show_active_tab
    then:
      - if: {condition: {lambda: 'return id(active_tab) == 0;'}, then: [{lvgl.page.show: page_pulse}]}
      - if: {condition: {lambda: 'return id(active_tab) == 1;'}, then: [{lvgl.page.show: page_clone}]}
      - if: {condition: {lambda: 'return id(active_tab) == 2;'}, then: [{lvgl.page.show: page_main}]}
      - if: {condition: {lambda: 'return id(active_tab) == 3;'}, then: [{lvgl.page.show: page_soil}]}
      - if: {condition: {lambda: 'return id(active_tab) == 4;'}, then: [{lvgl.page.show: page_control}]}
      - script.execute: restyle_tabs
  - id: tab_next
    then:
      - lambda: 'if (id(active_tab) < 4) id(active_tab)++;'
      - script.execute: show_active_tab
  - id: tab_prev
    then:
      - lambda: 'if (id(active_tab) > 0) id(active_tab)--;'
      - script.execute: show_active_tab

  # highlight the active tab
  - id: restyle_tabs
    then:
      - lambda: |-
          lv_color_t on = lv_color_hex(0x00E676), off = lv_color_hex(0x5A6472);
          auto S = [&](lv_obj_t* ic, bool a) { lv_obj_set_style_text_color(ic, a ? on : off, 0); };
          int t = id(active_tab);
          S(id(tab_ic0), t == 0);
          S(id(tab_ic1), t == 1);
          S(id(tab_ic2), t == 2);
          S(id(tab_ic3), t == 3);
          S(id(tab_ic4), t == 4);

  - id: wake_panel
    then:
      - lambda: |-
          id(panel_sleeping) = false;
          lv_obj_add_flag(id(saver), LV_OBJ_FLAG_HIDDEN);
      - script.execute: refresh_ui

  - id: go_sleep
    then:
      - if:
          condition:
            lambda: 'return !id(fl_active);'   # don't sleep while the torch is on
          then:
            - lambda: |-
                id(panel_sleeping) = true;
                lv_obj_clear_flag(id(saver), LV_OBJ_FLAG_HIDDEN);
            - script.execute: refresh_ui

  # ---- flashlight — the light IS the onboard RGB LED (status_led) ----
  # apply_flashlight repaints the control chrome and either drives the chip
  # LED (fl_active) or hands it back to the status machine (led_last = -1 so
  # refresh_ui re-asserts it). The screen is only the control surface; the
  # dot mirrors the colour so you can aim it.
  - id: apply_flashlight
    then:
      - lambda: |-
          uint32_t tint;
          switch (id(fl_color)) {
            case 1: tint = 0xFFFFFF; break;   // white
            case 2: tint = 0xFF0000; break;   // red
            default: tint = 0x00FF00; break;  // green
          }
          char b[8]; snprintf(b, sizeof(b), "%d%%", id(fl_bright));
          lv_label_set_text(id(fl_pct), b);
          lv_bar_set_value(id(fl_bar), id(fl_bright), LV_ANIM_ON);
          lv_obj_set_style_border_width(id(fl_bg), id(fl_color) == 0 ? 3 : 1, 0);
          lv_obj_set_style_border_width(id(fl_bw), id(fl_color) == 1 ? 3 : 1, 0);
          lv_obj_set_style_border_width(id(fl_br), id(fl_color) == 2 ? 3 : 1, 0);
          if (id(fl_active)) {
            lv_label_set_text(id(fl_onoff_lbl), "ON");
            lv_obj_set_style_bg_color(id(fl_onoff), lv_color_hex(0x12241A), 0);
            lv_obj_set_style_border_color(id(fl_onoff), lv_color_hex(0x00E676), 0);
            lv_obj_set_style_text_color(id(fl_onoff_lbl), lv_color_hex(0x00E676), 0);
            lv_obj_set_style_bg_color(id(fl_dot), lv_color_hex(tint), 0);
            // drive the real onboard RGB LED
            float r = 0, g = 0, bl = 0;
            switch (id(fl_color)) { case 1: r = g = bl = 1; break; case 2: r = 1; break; default: g = 1; break; }
            auto c = id(status_led).turn_on();
            c.set_effect("None");
            c.set_rgb(r, g, bl);
            c.set_brightness(id(fl_bright) / 100.0f);
            c.perform();
          } else {
            lv_label_set_text(id(fl_onoff_lbl), "OFF");
            lv_obj_set_style_bg_color(id(fl_onoff), lv_color_hex(0x2A313B), 0);
            lv_obj_set_style_border_color(id(fl_onoff), lv_color_hex(0x8A929C), 0);
            lv_obj_set_style_text_color(id(fl_onoff_lbl), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_bg_color(id(fl_dot), lv_color_hex(0x2A313B), 0);
            id(led_last) = -1;   // hand the LED back to the status machine
          }
      - if:
          condition:
            lambda: 'return !id(fl_active);'
          then:
            - script.execute: refresh_ui   # re-assert the status LED right away

  - id: open_flashlight
    then:
      - lambda: |-
          id(fl_active) = true;
          lv_obj_clear_flag(id(fl_screen), LV_OBJ_FLAG_HIDDEN);
      - script.execute: apply_flashlight

  - id: close_flashlight
    then:
      - lambda: |-
          id(fl_active) = false;
          id(led_last) = -1;   // status machine reclaims the LED
          lv_obj_add_flag(id(fl_screen), LV_OBJ_FLAG_HIDDEN);
      - script.execute: refresh_ui

  # ---- connections screen ----
  - id: open_connections
    then:
      - lambda: 'lv_obj_clear_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: refresh_ui
  - id: close_connections
    then:
      - lambda: 'lv_obj_add_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);'

  # ---- screen lock: hold-to-lock / hold-to-unlock, seed<->plant growth ----
  # hold_begin shows the HUD; hold_tick (on_pressing) advances the plant and
  # the progress bar and, at 3s, commits the lock flip inline; hold_cancel
  # (on_release) aborts an unfinished hold. Growth glyphs are passed to C++
  # as \U escapes (literal in a YAML block scalar) -> UTF-8 for LVGL.
  - id: hold_begin
    then:
      - lambda: |-
          id(holding) = true;
          id(hold_start) = millis();
          lv_bar_set_value(id(hud_bar), 0, LV_ANIM_OFF);
          bool waking = id(lock_engaged);   // currently locked -> this hold WAKES it
          lv_label_set_text(id(hud_hint), waking ? "WAKING UP" : "GOING TO SLEEP");
          // start at the current state: waking begins asleep (seed+moon),
          // sleeping begins awake (flower+sun)
          lv_label_set_text(id(hud_plant), waking ? "\U000F0E62" : "\U000F024A");
          lv_label_set_text(id(hud_sky),   waking ? "\U000F0594" : "\U000F05A8");
          lv_obj_set_style_text_color(id(hud_plant), lv_color_hex(waking ? 0x3A4550 : 0x00E676), 0);
          lv_obj_set_style_text_color(id(hud_sky),   lv_color_hex(waking ? 0x5A6472 : 0xFFC24A), 0);
          lv_obj_clear_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);

  - id: hold_tick
    then:
      - lambda: |-
          if (!id(holding)) return;
          const uint32_t HOLD_MS = 3000;
          uint32_t el = millis() - id(hold_start);
          if (el > HOLD_MS) el = HOLD_MS;
          float prog = (float) el / HOLD_MS;               // 0..1 hold progress
          // wake: 0 = asleep (seed + moon), 1 = awake (flower + sun).
          // unlocking WAKES it (0->1); locking puts it to SLEEP (1->0).
          float wake = id(lock_engaged) ? prog : (1.0f - prog);
          const char* icon;
          if      (wake < 0.20f) icon = "\U000F0E62";      // seed   (asleep)
          else if (wake < 0.45f) icon = "\U000F0E66";      // sprout
          else if (wake < 0.70f) icon = "\U000F032A";      // leaf
          else if (wake < 0.95f) icon = "\U000F038E";      // nature
          else                   icon = "\U000F024A";      // flower (awake)
          lv_label_set_text(id(hud_plant), icon);
          lv_label_set_text(id(hud_sky), wake < 0.5f ? "\U000F0594" : "\U000F05A8");  // moon : sun
          lv_obj_set_style_text_color(id(hud_plant), lv_color_hex(wake < 0.5f ? 0x3A4550 : 0x00E676), 0);
          lv_obj_set_style_text_color(id(hud_sky),   lv_color_hex(wake < 0.5f ? 0x5A6472 : 0xFFC24A), 0);
          lv_bar_set_value(id(hud_bar), (int)(prog * 100), LV_ANIM_OFF);
          if (el < HOLD_MS) return;
          // ---- 3s reached: commit the flip ----
          id(holding) = false;
          lv_obj_add_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);
          if (id(lock_engaged)) {                          // was locked -> unlock
            id(lock_engaged) = false;
            lv_obj_add_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN);
            id(panel_sleeping) = false;
            lv_obj_add_flag(id(saver), LV_OBJ_FLAG_HIDDEN);
            id(bl_last) = -1;                              // refresh_ui restores backlight
          } else {                                         // was unlocked -> lock
            id(lock_engaged) = true;
            lv_obj_clear_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN);
          }

  - id: hold_cancel
    then:
      - lambda: |-
          if (!id(holding)) return;   // already committed at 3s; nothing to abort
          id(holding) = false;
          lv_obj_add_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);

  # open the roller editor for a select (0=stage 1=strategy 2=clone 3=priority)
  - id: open_editor
    parameters:
      target: int
    then:
      - lambda: |-
          id(edit_target) = target;
          const char* title; std::string opts; std::string cur;
          switch (target) {
            case 0: title = "Grow Stage";
              opts = "Germination\nSeedling\nEarly Vegetative\nVegetative\nLate (Push) Vegetative\nEarly Flowering\nFlowering\nLate Flowering\nFinal 48-72h Flowering\nDry Mode\nOff";
              cur = id(sel_stage).state; break;
            case 1: title = "Control Strategy";
              opts = "VPD\nTemperature\nHumidity";
              cur = id(sel_strategy).state; break;
            case 2: title = "Clone Mode";
              opts = "Follow 4x8\nClones & Seedlings\nMother\nCustom\nOff";
              cur = id(sel_clone_mode).state; break;
            case 3: title = "Priority Tent";
              opts = "4x8 Main\n2x4 Clone";
              cur = id(sel_priority).state; break;
            default: title = "Clone Photoperiod";
              opts = "Follow 4x8\nIndependent";
              cur = id(sel_clone_photo).state; break;
          }
          lv_label_set_text(id(ed_title), title);
          lv_roller_set_options(id(ed_roller)->obj, opts.c_str(), LV_ROLLER_MODE_NORMAL);
          int idx = 0, pos = 0; size_t start = 0;
          for (size_t i = 0; i <= opts.size(); i++) {
            if (i == opts.size() || opts[i] == '\n') {
              if (opts.substr(start, i - start) == cur) { idx = pos; break; }
              pos++; start = i + 1;
            }
          }
          lv_roller_set_selected(id(ed_roller)->obj, idx, LV_ANIM_OFF);
          lv_obj_clear_flag(id(editor), LV_OBJ_FLAG_HIDDEN);

  # apply the roller selection to the hub's select — send the INDEX over ESP-NOW
  # (roller option order matches the hub select order, so index maps 1:1).
  - id: apply_editor
    then:
      - script.execute:
          id: hub_cmd
          op: !lambda |-
            switch (id(edit_target)) {
              case 0: return 20;   // grow_stage
              case 1: return 21;   // control_strategy
              case 2: return 22;   // clone_mode
              case 3: return 24;   // priority_tent
              default: return 23;  // clone_photoperiod
            }
          val: !lambda 'return (int) lv_roller_get_selected(id(ed_roller)->obj);'
      - lambda: 'lv_obj_add_flag(id(editor), LV_OBJ_FLAG_HIDDEN);'

  # -------- the refresh engine: HA state -> every dynamic widget --------
  - id: refresh_ui
    then:
      - lambda: |-
          const uint32_t NEON=0x00E676, AMBER=0xFFAA00, RED=0xF44336, CYAN=0x00BCD4,
                         GREY=0x5A6472, WHITE=0xFFFFFF, DIM=0xC0C6CC, BORD=0x232A33,
                         BLUE=0x2196F3, ORANGE=0xFF9800;
          char b[64];
          // Guard style writes the same way setl guards text: LVGL invalidates
          // on every style set, which reallocates aligned A8 glyph masks.
          auto setc = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_text_color(o, LV_PART_MAIN);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_text_color(o, want, LV_PART_MAIN);
          };
          auto bordc = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_border_color(o, LV_PART_MAIN);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_border_color(o, want, LV_PART_MAIN);
          };
          auto setbar = [](lv_obj_t* o, int v){
            if ((int) lv_bar_get_value(o) != v) lv_bar_set_value(o, v, LV_ANIM_OFF);
          };
          auto setbarb = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_bg_color(o, LV_PART_INDICATOR);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_bg_color(o, want, LV_PART_INDICATOR);
          };
          // v4.0.2 — setl() replaces every lv_label_set_text() in refresh_ui.
          // lv_label_set_text() calls lv_realloc() *unconditionally*, then
          // invalidates the label, which schedules a redraw and a fresh
          // aligned A8 glyph-mask allocation per glyph. refresh_ui runs at
          // 1 Hz and rewrites ~41 labels, the overwhelming majority of which
          // have not changed since the last tick ("22.4C", "ON", an IP that
          // never moves). Comparing first turns that into zero allocations
          // on a quiet second. Same pixels, far less heap churn.
          auto setl = [](lv_obj_t* o, const char* s){
            const char* c = lv_label_get_text(o);
            if (c == nullptr || strcmp(c, s) != 0) lv_label_set_text(o, s);
          };
          auto bandcol = [&](float v, float lo, float hi)->uint32_t{
            if (isnan(v) || isnan(lo) || isnan(hi)) return GREY;
            if (v >= lo && v <= hi) return NEON;
            float m = (hi - lo) * 0.15f; if (m < 0.05f) m = 0.05f;
            if (v >= lo - m && v <= hi + m) return AMBER;
            return RED;
          };

          // ---------------- resolved target bands ----------------
          bool cfollow = id(sel_clone_mode).state == "Follow 4x8";
          float c_rmin = cfollow ? id(t_main_rh_min).state  : id(t_clone_rh_min).state;
          float c_rmax = cfollow ? id(t_main_rh_max).state  : id(t_clone_rh_max).state;
          float c_vmin = cfollow ? id(t_main_vpd_min).state : id(t_clone_vpd_min).state;
          float c_vmax = cfollow ? id(t_main_vpd_max).state : id(t_clone_vpd_max).state;
          float c_tt   = cfollow ? id(t_main_temp).state    : id(t_clone_temp).state;
          float m_rmin = id(t_main_rh_min).state,  m_rmax = id(t_main_rh_max).state;
          float m_vmin = id(t_main_vpd_min).state, m_vmax = id(t_main_vpd_max).state;
          float m_tt   = id(t_main_temp).state;

          // ---------------- PULSE: pills ----------------
          bool link = id(api_link).state;
          setc(id(pill_wifi_ic), link ? NEON : RED);
          float co2 = id(co2_ppm).state;
          if (isnan(co2)) strcpy(b, "CO2 --- ppm"); else snprintf(b, sizeof(b), "CO2 %d ppm", (int)co2);
          setl(id(lbl_co2), b);

          // ---------------- connection uptimes (millis-stamped; reset on drop) ----
          {
            uint32_t nowms = millis();
            bool w = id(wifi_conn);
            if (w && !id(wifi_was)) id(wifi_since) = nowms;   // rising edge -> restart timer
            id(wifi_was) = w;
            if (link && !id(api_was)) id(api_since) = nowms;
            id(api_was) = link;
            // format seconds -> compact "Ns / Nm / Nh Nm"
            auto upstr = [](char* out, size_t n, bool on, uint32_t since, uint32_t now){
              if (!on) { strncpy(out, "0s", n); return; }
              uint32_t s = (now - since) / 1000;
              if (s < 60)      snprintf(out, n, "%us", s);
              else if (s<3600) snprintf(out, n, "%um", s/60);
              else             snprintf(out, n, "%uh %um", s/3600, (s%3600)/60);
            };
            char u[16];
            upstr(u, sizeof(u), w, id(wifi_since), nowms);
            setl(id(conn_wifi_up), u); setc(id(conn_wifi_up), w ? NEON : GREY);
            setc(id(conn_wifi_ic), w ? NEON : RED);
            upstr(u, sizeof(u), link, id(api_since), nowms);
            setl(id(conn_api_up), u); setc(id(conn_api_up), link ? NEON : GREY);
            setc(id(conn_api_ic), link ? NEON : RED);
            // Wi-Fi sub-line: SSID · RSSI
            std::string ssid = id(wifi_ssid_ts).state;
            float rssi = id(wifi_rssi).state;
            if (ssid.empty()) ssid = "—";
            if (isnan(rssi)) snprintf(b, sizeof(b), "%s", ssid.c_str());
            else             snprintf(b, sizeof(b), "%s · %ddBm", ssid.c_str(), (int)rssi);
            setl(id(conn_wifi_sub), b);
            setl(id(conn_api_sub), id(wifi_ip_ts).state.c_str());

            // v4.0.2 — ESP-NOW row, live. gv_hub_last is stamped by the
            // 0xD1 vitals handler, which the hub sends every 2 s, so
            // "age" is the true health of the only link this panel needs.
            // 6 s = three missed broadcasts. Deliberately NOT derived from
            // the Wi-Fi or API state: ESP-NOW is independent of both, and
            // the whole point of the panel is that it keeps working when
            // they are down.
            uint32_t hub_age = nowms - id(gv_hub_last);
            bool espn = id(gv_hub_last) != 0 && hub_age < 6000;
            setc(id(conn_espnow_ic), espn ? NEON : RED);
            setl(id(conn_espnow_val), espn ? "LINKED" : "DOWN");
            setc(id(conn_espnow_val), espn ? NEON : RED);
            if (id(gv_hub_last) == 0) {
              setl(id(conn_espnow_sub), "no hub packet yet");
            } else if (espn) {
              snprintf(b, sizeof(b), "hub vitals %us ago", hub_age / 1000);
              setl(id(conn_espnow_sub), b);
            } else {
              uint32_t s = hub_age / 1000;
              if (s < 3600)      snprintf(b, sizeof(b), "silent %um", s / 60 ? s / 60 : 1);
              else if (s < 86400) snprintf(b, sizeof(b), "silent %uh", s / 3600);
              else                snprintf(b, sizeof(b), "silent %ud", s / 86400);
              setl(id(conn_espnow_sub), b);
            }
          }

          // ---------------- battery chip (hidden until a real pack is wired) ----
          {
            float bv = id(batt_v).state;                 // pack volts after the /2 divider
            bool valid = !isnan(bv) && bv > 2.8f && bv < 4.6f;   // 1S Li-ion plausibility gate
            if (valid) {
              int pct = (int)((bv - 3.30f) / (4.20f - 3.30f) * 100.0f);
              if (pct < 0) pct = 0; if (pct > 100) pct = 100;
              snprintf(b, sizeof(b), "%d%%", pct);
              setl(id(pill_batt_pct), b);
              setc(id(pill_batt_pct), pct <= 15 ? RED : (pct <= 40 ? AMBER : NEON));
              setc(id(pill_batt_ic),  pct <= 15 ? RED : (pct <= 40 ? AMBER : NEON));
              lv_obj_clear_flag(id(pill_batt_ic),  LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(pill_batt_pct), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(pill_batt_ic),  LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(pill_batt_pct), LV_OBJ_FLAG_HIDDEN);
            }
          }

          // ---------------- PULSE: env cards ----------------
          auto envtxt = [&](lv_obj_t* o, float t, float rh){
            if (isnan(t) || isnan(rh)) { setl(o, "--"); return; }
            char x[32]; snprintf(x, sizeof(x), "%.1f° · %.0f%%", t, rh); setl(o, x);
          };
          envtxt(id(lbl_2x4), id(clone_temp).state, id(clone_rh).state);
          envtxt(id(lbl_4x8), id(main_temp).state,  id(main_rh).state);
          envtxt(id(lbl_room), id(room_temp).state, id(room_rh).state);

          // ---------------- PULSE: ladder rung 1 (fans) ----------------
          int fans = (id(fan_out_on).state?1:0) + (id(fan_recirc_on).state?1:0)
                   + (id(fan_int_main_on).state?1:0) + (id(fan_int_clone_on).state?1:0);
          if (fans > 0) { snprintf(b, sizeof(b), "active · %d fans", fans);
            setc(id(lbl_rung1), CYAN); bordc(id(rung1), CYAN); }
          else { strcpy(b, "idle"); setc(id(lbl_rung1), GREY); bordc(id(rung1), BORD); }
          setl(id(lbl_rung1), b);

          // ---------------- PULSE: ladder rung 2 (appliances) ----------------
          bool any_dem = id(dem_hum).state||id(dem_dehum).state||id(dem_heater).state
                       ||id(dem_ac).state||id(dem_mat).state||id(dem_clone_hum).state;
          const char* dem = nullptr;
          if (id(dem_dehum).state) dem = "dehumidifier";
          else if (id(dem_hum).state) dem = "humidifier";
          else if (id(dem_heater).state) dem = "heater";
          else if (id(dem_ac).state) dem = "AC";
          else if (id(dem_mat).state) dem = "grow mat";
          else if (id(dem_clone_hum).state) dem = "clone humid";
          if (dem) { snprintf(b, sizeof(b), "%s active", dem);
            setc(id(lbl_rung2), AMBER); bordc(id(rung2), AMBER); }
          else {
            float best = 1e9f; const char* who = nullptr;
            auto chk = [&](float v, const char* n){ if (!isnan(v) && v > 0 && v < best) { best = v; who = n; } };
            chk(id(cd_dehum).state,"dehum"); chk(id(cd_hum).state,"humid"); chk(id(cd_heater).state,"heater");
            chk(id(cd_ac).state,"AC"); chk(id(cd_mat).state,"mat"); chk(id(cd_clone_hum).state,"c-hum");
            if (who) { snprintf(b, sizeof(b), "%s in %ds", who, (int)best); setc(id(lbl_rung2), AMBER); bordc(id(rung2), BORD); }
            else { strcpy(b, "standing by"); setc(id(lbl_rung2), GREY); bordc(id(rung2), BORD); }
          }
          setl(id(lbl_rung2), b);

          // ---------------- alerts ----------------
          int ac = 0; std::string head; char hb[48];
          auto AL = [&](bool cond, std::string txt){ if (cond) { if (ac == 0) head = txt; ac++; } };
          // gv_flt bit 128 = emergency_failsafe_active (>35 °C). Was packed
          // on the wire since v4.0 but never surfaced — panel could read
          // "all clear" while the hub owned outputs in failsafe.
          AL(id(fault_emg).state, "Emergency failsafe >35°C");
          AL(id(fault_climate).state, "Climate sensor fault");
          AL(id(fault_rootzone).state, "Root-zone probe fault");
          AL(id(fault_aux).state, "Aux sensor offline");
          // Sonoffs only switch when HA is up — surface that honestly.
          {
            bool dem = id(dem_hum).state || id(dem_dehum).state || id(dem_heater).state
                    || id(dem_mat).state || id(dem_ac).state || id(dem_clone_hum).state;
            AL(dem && !id(api_link).state, "Appliances need HA (Sonoffs offline)");
          }
          // Nest/mesh channel hop: ESP-NOW peers must share the STA channel.
          if (id(wifi_channel_hopped)) {
            snprintf(hb, sizeof(hb), "WiFi channel hop → %d (check ESP-NOW)", id(wifi_channel));
            AL(true, hb);
            // Auto-clear once ESP-NOW is linked again on the new channel.
            uint32_t hub_age = millis() - id(gv_hub_last);
            if (id(gv_hub_last) != 0 && hub_age < 6000) id(wifi_channel_hopped) = false;
          }
          float crh = id(clone_rh).state, cvp = id(clone_vpd).state, mrh = id(main_rh).state, mvp = id(main_vpd).state;
          if (!isnan(crh) && !isnan(c_rmax) && crh > c_rmax + 2) { snprintf(hb,sizeof(hb),"Clone RH high · %.0f%%",crh); AL(true,hb); }
          if (!isnan(cvp) && !isnan(c_vmax) && cvp > c_vmax + 0.1f) { snprintf(hb,sizeof(hb),"Clone VPD high · %.2f",cvp); AL(true,hb); }
          if (!isnan(mrh) && !isnan(m_rmax) && mrh > m_rmax + 2) { snprintf(hb,sizeof(hb),"Main RH high · %.0f%%",mrh); AL(true,hb); }
          if (!isnan(mvp) && !isnan(m_vmax) && mvp > m_vmax + 0.1f) { snprintf(hb,sizeof(hb),"Main VPD high · %.2f",mvp); AL(true,hb); }
          id(alert_count) = ac;

          // bell pill
          snprintf(b, sizeof(b), "%d", ac); setl(id(pill_alert_ct), b);
          setc(id(pill_alert_ct), ac>0?RED:GREY); setc(id(pill_bell_ic), ac>0?RED:GREY);
          // big SILENCE banner: visible whenever an alert is live + unsilenced
          if (ac > 0 && !id(alerts_silenced)) lv_obj_clear_flag(id(btn_silence), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(btn_silence), LV_OBJ_FLAG_HIDDEN);

          // alert strip
          if (ac == 0) {
            id(alerts_silenced) = false;
            setl(id(lbl_alert), "all clear · nothing needs attention");
            setc(id(lbl_alert), DIM); setc(id(alert_ic), NEON); bordc(id(alert_strip), 0x1E3A2B);
            lv_obj_add_flag(id(btn_mute), LV_OBJ_FLAG_HIDDEN);
          } else {
            if (id(alerts_silenced)) {
              snprintf(b, sizeof(b), "%d muted · %s", ac, head.c_str());
              setl(id(lbl_alert), b);
              setc(id(lbl_alert), 0x8A929C); setc(id(alert_ic), 0x8A929C); bordc(id(alert_strip), 0x3A2A12);
            } else {
              setl(id(lbl_alert), head.c_str());
              setc(id(lbl_alert), WHITE); setc(id(alert_ic), RED); bordc(id(alert_strip), RED);
            }
            lv_obj_clear_flag(id(btn_mute), LV_OBJ_FLAG_HIDDEN);
            setl(id(lbl_mute), id(alerts_silenced) ? "unmute" : "mute");
          }

          // ---------------- CLONE vitals ----------------
          {
            float t = id(clone_temp).state; uint32_t c = bandcol(t, c_tt-2, c_tt+2);
            if (isnan(t)) setl(id(clv_temp_val),"--"); else { snprintf(b,sizeof(b),"%.1f°",t); setl(id(clv_temp_val),b);} 
            setc(id(clv_temp_val),c); setbar(id(clv_temp_bar), isnan(t)?10:(int)t);
            setbarb(id(clv_temp_bar), c);
            float rh = id(clone_rh).state; c = bandcol(rh, c_rmin, c_rmax);
            if (isnan(rh)) setl(id(clv_rh_val),"--"); else { snprintf(b,sizeof(b),"%.0f%%",rh); setl(id(clv_rh_val),b);} 
            setc(id(clv_rh_val),c); setbar(id(clv_rh_bar), isnan(rh)?0:(int)rh);
            setbarb(id(clv_rh_bar), c);
            float vp = id(clone_vpd).state; c = bandcol(vp, c_vmin, c_vmax);
            if (isnan(vp)) setl(id(clv_vpd_val),"--"); else { snprintf(b,sizeof(b),"%.2f kPa",vp); setl(id(clv_vpd_val),b);} 
            setc(id(clv_vpd_val),c); setbar(id(clv_vpd_bar), isnan(vp)?0:(int)(vp*100));
            setbarb(id(clv_vpd_bar), c);
          }
          setl(id(clone_hdr_note), id(sel_clone_mode).state.c_str());

          // ---------------- MAIN vitals ----------------
          {
            float t = id(main_temp).state; uint32_t c = bandcol(t, m_tt-2, m_tt+2);
            if (isnan(t)) setl(id(mnv_temp_val),"--"); else { snprintf(b,sizeof(b),"%.1f°",t); setl(id(mnv_temp_val),b);} 
            setc(id(mnv_temp_val),c); setbar(id(mnv_temp_bar), isnan(t)?10:(int)t);
            setbarb(id(mnv_temp_bar), c);
            float rh = id(main_rh).state; c = bandcol(rh, m_rmin, m_rmax);
            if (isnan(rh)) setl(id(mnv_rh_val),"--"); else { snprintf(b,sizeof(b),"%.0f%%",rh); setl(id(mnv_rh_val),b);} 
            setc(id(mnv_rh_val),c); setbar(id(mnv_rh_bar), isnan(rh)?0:(int)rh);
            setbarb(id(mnv_rh_bar), c);
            float vp = id(main_vpd).state; c = bandcol(vp, m_vmin, m_vmax);
            if (isnan(vp)) setl(id(mnv_vpd_val),"--"); else { snprintf(b,sizeof(b),"%.2f kPa",vp); setl(id(mnv_vpd_val),b);} 
            setc(id(mnv_vpd_val),c); setbar(id(mnv_vpd_bar), isnan(vp)?0:(int)(vp*100));
            setbarb(id(mnv_vpd_bar), c);
          }

          // ---------------- CONTROL state ----------------
          bool fa = id(st_full_auto).state, ta = id(st_takeover).state, ap = id(st_auto_photo).state;
          setl(id(lbl_fullauto_state), fa ? "ON" : "off"); setc(id(lbl_fullauto_state), fa ? NEON : GREY);
          setl(id(lbl_autophoto_state), ap ? "ON" : "off"); setc(id(lbl_autophoto_state), ap ? NEON : GREY);
          if (ta) { setl(id(lbl_takeover_state), "ENGAGED — you own outputs"); setc(id(lbl_takeover_state), AMBER); bordc(id(takeover_card), AMBER); }
          else { setl(id(lbl_takeover_state), "tap to engage"); setc(id(lbl_takeover_state), 0x8A929C); bordc(id(takeover_card), BORD); }
          setl(id(lbl_stage_val), id(sel_stage).state.c_str());
          setl(id(lbl_strategy_val), id(sel_strategy).state.c_str());
          setl(id(lbl_clonemode_val), id(sel_clone_mode).state.c_str());
          setl(id(lbl_priority_val), id(sel_priority).state.c_str());

          // ---------------- SOIL tab (4 pot cards) ----------------
          auto potrow = [&](lv_obj_t* nameL, lv_obj_t* npkL, lv_obj_t* valL, int idx,
                            const std::string& plant, float mo, float tp, float ec, float ph,
                            float nn, float pp, float kk){
            char x[80];
            snprintf(x, sizeof(x), "P%d · %s", idx, plant.empty() ? "—" : plant.c_str());
            setl(nameL, x);
            if (isnan(nn) && isnan(pp) && isnan(kk)) setl(npkL, "N/P/K —");
            else { snprintf(x, sizeof(x), "N/P/K %d/%d/%d", (int)(isnan(nn)?0:nn), (int)(isnan(pp)?0:pp), (int)(isnan(kk)?0:kk)); setl(npkL, x); }
            if (isnan(mo) && isnan(tp) && isnan(ph)) { setl(valL, "offline / no data"); setc(valL, GREY); return; }
            char mS[10], tS[12], pS[10], eS[12];
            if (isnan(mo)) strcpy(mS, "--"); else snprintf(mS, sizeof(mS), "%.0f%%", mo);
            if (isnan(tp)) strcpy(tS, "--"); else snprintf(tS, sizeof(tS), "%.1f°", tp);
            if (isnan(ph)) strcpy(pS, "--"); else snprintf(pS, sizeof(pS), "%.1f", ph);
            if (isnan(ec)) strcpy(eS, "--"); else snprintf(eS, sizeof(eS), "%.0f", ec);
            snprintf(x, sizeof(x), "M %s · T %s · pH %s · EC %s", mS, tS, pS, eS);
            setl(valL, x);
            bool healthy = (!isnan(mo) && mo >= 30.0f) && (!isnan(ph) && ph >= 5.8f && ph <= 6.8f);
            setc(valL, healthy ? NEON : AMBER);
          };
          potrow(id(lbl_p1_name), id(lbl_p1_npk), id(lbl_p1_vals), 1, id(p1_plant).state,
                 id(p1_moist).state, id(p1_temp).state, id(p1_ec).state, id(p1_ph).state, id(p1_n).state, id(p1_p).state, id(p1_k).state);
          potrow(id(lbl_p2_name), id(lbl_p2_npk), id(lbl_p2_vals), 2, id(p2_plant).state,
                 id(p2_moist).state, id(p2_temp).state, id(p2_ec).state, id(p2_ph).state, id(p2_n).state, id(p2_p).state, id(p2_k).state);
          potrow(id(lbl_p3_name), id(lbl_p3_npk), id(lbl_p3_vals), 3, id(p3_plant).state,
                 id(p3_moist).state, id(p3_temp).state, id(p3_ec).state, id(p3_ph).state, id(p3_n).state, id(p3_p).state, id(p3_k).state);
          potrow(id(lbl_p4_name), id(lbl_p4_npk), id(lbl_p4_vals), 4, id(p4_plant).state,
                 id(p4_moist).state, id(p4_temp).state, id(p4_ec).state, id(p4_ph).state, id(p4_n).state, id(p4_p).state, id(p4_k).state);

          // ---------------- device rows (2x4 + 4x8) ----------------
          {
            auto pctlbl = [&](lv_obj_t* L, float v){ if (isnan(v)) setl(L, "--"); else { char q[8]; snprintf(q, sizeof(q), "%d%%", (int)v); setl(L, q); } };
            auto stlbl = [&](lv_obj_t* L, bool on){ setl(L, on ? "ON" : "off"); setc(L, on ? NEON : GREY); };
            pctlbl(id(sf1000_val), id(sf_target).state);
            pctlbl(id(fanclone_val), id(fan_int_clone_pct).state);
            stlbl(id(dem_clone_hum_st), id(dem_clone_hum).state);
            stlbl(id(dem_mat_st), id(dem_mat).state);
            pctlbl(id(exhout_val), id(fan_out_pct).state);
            pctlbl(id(exhroom_val), id(fan_recirc_pct).state);
            pctlbl(id(intmain_val), id(fan_int_main_pct).state);
            stlbl(id(dem_heater_st), id(dem_heater).state);
            stlbl(id(dem_ac_st), id(dem_ac).state);
            stlbl(id(dem_hum_st), id(dem_hum).state);
            stlbl(id(dem_dehum_st), id(dem_dehum).state);

            // ---- animated device icons (icon + sensor state) ----
            // base colour = function tint when on, dim grey when off; the
            // 250ms pass then breathes whichever are on (dev_mask bits).
            auto pon = [](float v){ return !isnan(v) && v > 0; };
            int mask = 0;
            auto ic = [&](lv_obj_t* L, bool on, uint32_t col, int bit){
              setc(L, on ? col : 0x39424D);
              if (on) mask |= (1 << bit);
            };
            ic(id(ic_csf),  pon(id(sf_target).state),        AMBER, 0);  // light
            ic(id(ic_cint), pon(id(fan_int_clone_pct).state), CYAN, 1);  // fan
            ic(id(ic_chum), id(dem_clone_hum).state,          CYAN, 2);  // humidifier
            ic(id(ic_cmat), id(dem_mat).state,               ORANGE,3);  // grow mat
            ic(id(ic_mout), pon(id(fan_out_pct).state),       CYAN, 4);  // exhaust
            ic(id(ic_mroom),pon(id(fan_recirc_pct).state),    CYAN, 5);  // recirc
            ic(id(ic_mint), pon(id(fan_int_main_pct).state),  BLUE, 6);  // intake
            ic(id(ic_mheat),id(dem_heater).state,            ORANGE,7);  // heater
            ic(id(ic_mac),  id(dem_ac).state,                 BLUE, 8);  // AC
            ic(id(ic_mhum), id(dem_hum).state,                CYAN, 9);  // humidifier
            ic(id(ic_mdeh), id(dem_dehum).state,              AMBER,10); // dehumid
            id(dev_mask) = mask;
          }

          // ---------------- Setup steppers + switches ----------------
          {
            auto numlbl = [&](lv_obj_t* L, float v, const char* fmt){ if (isnan(v)) { setl(L, "--"); return; } char q[16]; snprintf(q, sizeof(q), fmt, v); setl(L, q); };
            auto stv = [&](lv_obj_t* L, bool on){ setl(L, on ? "ON" : "off"); setc(L, on ? NEON : GREY); };
            numlbl(id(s_temp_val), id(t_main_temp).state, "%.1f°");
            numlbl(id(s_vmin_val), id(t_main_vpd_min).state, "%.1f");
            numlbl(id(s_vmax_val), id(t_main_vpd_max).state, "%.1f");
            numlbl(id(s_rmin_val), id(t_main_rh_min).state, "%.0f%");
            numlbl(id(s_rmax_val), id(t_main_rh_max).state, "%.0f%");
            numlbl(id(s_ctemp_val), id(t_clone_temp).state, "%.1f°");
            numlbl(id(s_cvmin_val), id(t_clone_vpd_min).state, "%.1f");
            numlbl(id(s_cvmax_val), id(t_clone_vpd_max).state, "%.1f");
            numlbl(id(s_crmin_val), id(t_clone_rh_min).state, "%.0f%");
            numlbl(id(s_crmax_val), id(t_clone_rh_max).state, "%.0f%");
            numlbl(id(s_sftgt_val), id(sf_target).state, "%.0f%");
            numlbl(id(s_ramp_val), id(n_ramp).state, "%.0f%");
            numlbl(id(s_sunrise_val), id(n_sunrise).state, "%.0fm");
            numlbl(id(s_sunset_val), id(n_sunset).state, "%.0fm");
            numlbl(id(s_clh_val), id(n_clh).state, "%.0fh");
            numlbl(id(s_rzlo_val), id(n_rzlo).state, "%.1f°");
            numlbl(id(s_rzhi_val), id(n_rzhi).state, "%.1f°");
            numlbl(id(s_matoff_val), id(n_matoff).state, "%.0fs");
            numlbl(id(s_chh_val), id(n_chh).state, "%.1f%");
            numlbl(id(s_chmo_val), id(n_chmo).state, "%.0fs");
            numlbl(id(s_hmo_val), id(n_hmo).state, "%.0fs");
            numlbl(id(s_htmo_val), id(n_htmo).state, "%.0fs");
            numlbl(id(s_dsp_val), id(n_dsp).state, "%.0fs");
            numlbl(id(s_dsl_val), id(n_dsl).state, "%.0fs");
            numlbl(id(s_dslv_val), id(n_dslv).state, "%.0f%");
            stv(id(st_lighthold_v), id(st_light_hold).state);
            stv(id(st_humroute_v), id(st_hum_routing).state);
            stv(id(st_destrat_v), id(st_destrat).state);
            stv(id(st_greenhb_v), id(green_heartbeat));
            setl(id(lbl_clonephoto_val), id(sel_clone_photo).state.c_str());
          }

          // ---------------- night mode, backlight, status LED ----------------
          bool night = !id(lights_main).state;
          id(night_mode) = night;
          int want = id(panel_sleeping) ? 12 : (night ? 40 : 100);
          if (want != id(bl_last)) {
            id(bl_last) = want; auto bl = id(backlight).turn_on(); bl.set_brightness(want/100.0f); bl.perform();
          }
          // The flashlight commandeers the onboard RGB LED while it's on, so
          // the status machine yields; close_flashlight sets led_last = -1 to
          // force a re-assert here.
          if (!id(fl_active)) {
            // LED state (written only on change — no per-second log spam):
            //   1 = ISSUE  -> pulsing red, overrides night (an alert you
            //                 can't see is useless)
            //   0 = night dark window -> LED off (no stray photons)
            //   2 = appliance demand   -> solid amber
            //   3 = all good           -> dim green
            int lm;
            if (ac > 0 && !id(alerts_silenced)) lm = 1;          // ISSUE: red pulse (overrides night)
            else if (night) lm = 0;                               // night dark window: off
            else if (any_dem) lm = 2;                             // appliance demand: solid amber
            else lm = id(green_heartbeat) ? 3 : 0;                // all-OK: green pulse if enabled, else off
            if (lm != id(led_last)) {
              id(led_last) = lm;
              if (lm == 0) {
                id(status_led).turn_off().perform();
              } else if (lm == 1) {
                auto c = id(status_led).turn_on();
                c.set_rgb(1.0f, 0.0f, 0.0f); c.set_brightness(1.0f);
                c.set_effect("Breathe"); c.perform();
              } else if (lm == 3) {
                auto c = id(status_led).turn_on();
                c.set_rgb(0.0f, 1.0f, 0.25f); c.set_brightness(1.0f);
                c.set_effect("Breathe"); c.perform();
              } else {
                auto c = id(status_led).turn_on();
                c.set_effect("None"); c.set_brightness(0.6f);
                c.set_rgb(1.0f, 0.60f, 0.0f);   // amber = appliance demand
                c.perform();
              }
            }
          }

          // ---------------- screensaver clock ----------------
          auto now = id(sntp_time).now();
          if (!now.is_valid()) now = id(ha_time).now();
          if (now.is_valid()) { snprintf(b, sizeof(b), "%02d:%02d", now.hour, now.minute); setl(id(saver_clock), b); setl(id(lock_clock), b); }

# ==================================================================
#  PERIODIC REFRESH
# ==================================================================
interval:
  - interval: 1s
    then:
      - script.execute: refresh_ui
  # Lock-screen breathing: only does work while locked. Active devices glow
  # white and pulse; idle devices sit dim. This is the "animated icon +
  # sensor state" holy grail, on the lock screen, white-on-black.
  # v4.0.2 — was 250 ms / 24 phases. Every tick changes text_opa on the
  # device icons, and a style change invalidates the label, so LVGL redraws
  # it and takes a fresh 32-byte-aligned A8 glyph mask off the system heap
  # for each icon (mdi_22 -> ~484 bytes each). At 250 ms that is a steady
  # few-KB-per-second churn of aligned allocations for the whole time the
  # panel is awake, which is the same fragmentation mechanism that killed
  # the SCROLL_CIRCULAR labels. 500 ms with 12 phases halves the redraw
  # rate while keeping the cycle at the same 6 s — it looks identical,
  # just in 12 steps instead of 24 on a fade nobody can count frames on.
  - interval: 500ms
    then:
      - lambda: |-
          // Skip entirely while the panel is asleep — no icons are visible.
          if (id(panel_sleeping)) return;
          id(anim_phase) = (id(anim_phase) + 1) % 12;
          int tri = id(anim_phase) < 6 ? id(anim_phase) : 12 - id(anim_phase);    // 0..6
          uint8_t opa = 90 + (uint8_t)(tri * 165 / 6);                            // 90..255
          if (id(lock_engaged)) {
            // lock screen: active devices glow white and breathe, idle sit dim
            lv_color_t white = lv_color_hex(0xFFFFFF), dim = lv_color_hex(0x2A2A2A);
            auto setopa = [](lv_obj_t* L, uint8_t o){
              if (lv_obj_get_style_text_opa(L, LV_PART_MAIN) != o) lv_obj_set_style_text_opa(L, o, LV_PART_MAIN);
            };
            auto setcol = [](lv_obj_t* L, lv_color_t c){
              if (lv_color_to_u32(lv_obj_get_style_text_color(L, LV_PART_MAIN)) != lv_color_to_u32(c))
                lv_obj_set_style_text_color(L, c, LV_PART_MAIN);
            };
            auto dev = [&](lv_obj_t* L, bool on){
              if (on) { setcol(L, white); setopa(L, opa); }
              else    { setcol(L, dim);   setopa(L, 255); }
            };
            bool fan_on = !isnan(id(fan_out_pct).state) && id(fan_out_pct).state > 0;
            bool int_on = !isnan(id(fan_int_main_pct).state) && id(fan_int_main_pct).state > 0;
            dev(id(lk_fan), fan_on); dev(id(lk_int), int_on); dev(id(lk_heat), id(dem_heater).state);
            dev(id(lk_hum), id(dem_hum).state); dev(id(lk_deh), id(dem_dehum).state); dev(id(lk_light), id(lights_main).state);
            return;
          }
          // control pages: breathe ON icons; OFF icons stay opa 255.
          // Guarding the write means an idle mask (all off) is zero churn.
          int m = id(dev_mask);
          auto br = [&](lv_obj_t* L, int bit){
            uint8_t want = (m & (1 << bit)) ? opa : (uint8_t) 255;
            if (lv_obj_get_style_text_opa(L, LV_PART_MAIN) != want) lv_obj_set_style_text_opa(L, want, LV_PART_MAIN);
          };
          br(id(ic_csf),0);  br(id(ic_cint),1); br(id(ic_chum),2); br(id(ic_cmat),3);
          br(id(ic_mout),4); br(id(ic_mroom),5); br(id(ic_mint),6); br(id(ic_mheat),7);
          br(id(ic_mac),8);  br(id(ic_mhum),9); br(id(ic_mdeh),10);

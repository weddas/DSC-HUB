            id: rung1
            x: 8
            y: 114
            width: 150
            height: 46
            styles: card
            border_color: 0x00BCD4
            shadow_width: 0
            scrollable: false
            widgets:
              - label: {text: "Rung 1 · Fans", text_font: f_small, align: TOP_LEFT, text_color: 0x8A929C}
              - label: {id: lbl_rung1, text: "--", text_font: f_body, align: BOTTOM_LEFT, text_color: 0x00BCD4}

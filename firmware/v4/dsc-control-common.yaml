# ==================================================================
#  SCRIPTS
# ==================================================================
script:
  # ---- send a command to the hub: {0xDC,ver,op,flags,i32 val,u16 tag,u16 seq} ----
  # UI control actions call this instead of homeassistant.action. Float values
  # are passed pre-scaled by ×100 (e.g. 24.5 °C -> op 30, val 2450).
  - id: hub_cmd
    parameters:
      op: int
      val: int
    then:
      - espnow.send:
          address: !lambda |-
            const uint8_t *m = id(fleet_setup).hub_mac();
            return std::array<uint8_t, 6>{m[0], m[1], m[2], m[3], m[4], m[5]};
          wait_for_sent: false
          data: !lambda |-
            std::vector<uint8_t> p(12, 0);
            p[0]=0xDC; p[1]=0x01; p[2]=(uint8_t) op; p[3]=0;
            uint32_t uv=(uint32_t) val; p[4]=uv&0xFF; p[5]=(uv>>8)&0xFF; p[6]=(uv>>16)&0xFF; p[7]=(uv>>24)&0xFF;
            uint16_t tg=(uint16_t) ${espnow_cmd_tag}; p[8]=tg&0xFF; p[9]=(tg>>8)&0xFF;
            uint16_t sq=id(cmd_tx_seq)++; p[10]=sq&0xFF; p[11]=(sq>>8)&0xFF;
            return p;

  # ---- swipe navigation: show the page for active_tab (0..4) ----
  # active_tab is set FIRST (clamped), then this shows the matching page
  # with independent ifs (no mutation mid-chain), so exactly one fires.
  - id: show_active_tab
    then:
      - if: {condition: {lambda: 'return id(active_tab) == 0;'}, then: [{lvgl.page.show: page_pulse}]}
      - if: {condition: {lambda: 'return id(active_tab) == 1;'}, then: [{lvgl.page.show: page_clone}]}
      - if: {condition: {lambda: 'return id(active_tab) == 2;'}, then: [{lvgl.page.show: page_main}]}
      - if: {condition: {lambda: 'return id(active_tab) == 3;'}, then: [{lvgl.page.show: page_soil}]}
      - if: {condition: {lambda: 'return id(active_tab) == 4;'}, then: [{lvgl.page.show: page_control}]}
      - lambda: 'id(ui_soil_detail) = false;'
      - script.execute: restyle_tabs
      - script.execute: refresh_ui
  - id: tab_next
    then:
      - lambda: 'if (id(active_tab) < 4) id(active_tab)++;'
      - script.execute: show_active_tab
  - id: tab_prev
    then:
      - lambda: 'if (id(active_tab) > 0) id(active_tab)--;'
      - script.execute: show_active_tab

  # highlight the active tab
  - id: restyle_tabs
    then:
      - lambda: |-
          lv_color_t on = lv_color_hex(0x00E676), off = lv_color_hex(0x5A6472);
          auto S = [&](lv_obj_t* ic, bool a) { lv_obj_set_style_text_color(ic, a ? on : off, 0); };
          int t = id(active_tab);
          S(id(tab_ic0), t == 0);
          S(id(tab_ic1), t == 1);
          S(id(tab_ic2), t == 2);
          S(id(tab_ic3), t == 3);
          S(id(tab_ic4), t == 4);

  - id: wake_panel
    then:
      - lambda: |-
          id(panel_sleeping) = false;
          lv_obj_add_flag(id(saver), LV_OBJ_FLAG_HIDDEN);
      - script.execute: refresh_ui

  - id: go_sleep
    then:
      - if:
          condition:
            lambda: 'return !id(fl_active);'   # don't sleep while the torch is on
          then:
            - lambda: |-
                id(panel_sleeping) = true;
                lv_obj_clear_flag(id(saver), LV_OBJ_FLAG_HIDDEN);
            - script.execute: refresh_ui

  # ---- flashlight — the light IS the onboard RGB LED (status_led) ----
  # apply_flashlight repaints the control chrome and either drives the chip
  # LED (fl_active) or hands it back to the status machine (led_last = -1 so
  # refresh_ui re-asserts it). The screen is only the control surface; the
  # dot mirrors the colour so you can aim it.
  - id: apply_flashlight
    then:
      - lambda: |-
          uint32_t tint;
          switch (id(fl_color)) {
            case 1: tint = 0xFFFFFF; break;   // white
            case 2: tint = 0xFF0000; break;   // red
            default: tint = 0x00FF00; break;  // green
          }
          char b[8]; snprintf(b, sizeof(b), "%d%%", id(fl_bright));
          {
            const char* cur = lv_label_get_text(id(fl_pct));
            if (cur == nullptr || strcmp(cur, b) != 0) lv_label_set_text(id(fl_pct), b);
          }
          lv_bar_set_value(id(fl_bar), id(fl_bright), LV_ANIM_OFF);
          lv_obj_set_style_border_width(id(fl_bg), id(fl_color) == 0 ? 3 : 1, 0);
          lv_obj_set_style_border_width(id(fl_bw), id(fl_color) == 1 ? 3 : 1, 0);
          lv_obj_set_style_border_width(id(fl_br), id(fl_color) == 2 ? 3 : 1, 0);
          if (id(fl_active)) {
            const char* on = "ON";
            if (strcmp(lv_label_get_text(id(fl_onoff_lbl)), on) != 0)
              lv_label_set_text(id(fl_onoff_lbl), on);
            lv_obj_set_style_bg_color(id(fl_onoff), lv_color_hex(0x12241A), 0);
            lv_obj_set_style_border_color(id(fl_onoff), lv_color_hex(0x00E676), 0);
            lv_obj_set_style_text_color(id(fl_onoff_lbl), lv_color_hex(0x00E676), 0);
            lv_obj_set_style_bg_color(id(fl_dot), lv_color_hex(tint), 0);
            // drive the real onboard RGB LED
            float r = 0, g = 0, bl = 0;
            switch (id(fl_color)) { case 1: r = g = bl = 1; break; case 2: r = 1; break; default: g = 1; break; }
            auto c = id(status_led).turn_on();
            c.set_rgb(r, g, bl);
            c.set_brightness(id(fl_bright) / 100.0f);
            c.perform();
          } else {
            const char* off = "OFF";
            if (strcmp(lv_label_get_text(id(fl_onoff_lbl)), off) != 0)
              lv_label_set_text(id(fl_onoff_lbl), off);
            lv_obj_set_style_bg_color(id(fl_onoff), lv_color_hex(0x2A313B), 0);
            lv_obj_set_style_border_color(id(fl_onoff), lv_color_hex(0x8A929C), 0);
            lv_obj_set_style_text_color(id(fl_onoff_lbl), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_bg_color(id(fl_dot), lv_color_hex(0x2A313B), 0);
            id(led_last) = -1;   // hand the LED back to the status machine
          }
      - if:
          condition:
            lambda: 'return !id(fl_active);'
          then:
            - script.execute: refresh_ui   # re-assert the status LED right away

  - id: open_flashlight
    then:
      - lambda: |-
          id(fl_active) = true;
          lv_obj_clear_flag(id(fl_screen), LV_OBJ_FLAG_HIDDEN);
      - script.execute: apply_flashlight

  - id: close_flashlight
    then:
      - lambda: |-
          id(fl_active) = false;
          id(led_last) = -1;   // status machine reclaims the LED
          lv_obj_add_flag(id(fl_screen), LV_OBJ_FLAG_HIDDEN);
      - script.execute: refresh_ui

  # ---- connections screen ----
  - id: open_connections
    then:
      - lambda: 'lv_obj_clear_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: refresh_ui
  - id: close_connections
    then:
      - lambda: 'lv_obj_add_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);'

  # ---- screen lock: hold-to-lock / hold-to-unlock, seed<->plant growth ----
  # hold_begin shows the HUD; hold_tick (on_pressing) advances the plant and
  # the progress bar and, at 3s, commits the lock flip inline; hold_cancel
  # (on_release) aborts an unfinished hold.
  # v4.0.8 CRASH FIX: only rewrite HUD labels when the glyph/text actually
  # changes. Unconditional lv_label_set_text on every on_pressing tick was
  # shredding the heap with A8 glyph masks (same failure mode as v4.0.1).
  - id: hold_begin
    then:
      - lambda: |-
          if (id(lock_engaged) && lv_obj_has_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN))
            return;  // locked but overlay gone — ignore
          // Allow unlock holds (overlay visible) and lock holds (unlocked).
          id(holding) = true;
          id(hold_start) = millis();
          // Do NOT show HUD yet — short taps must not flash / alloc glyphs.
          // hold_tick reveals the HUD after ~250 ms of sustained press.

  - id: hold_tick
    then:
      - lambda: |-
          if (!id(holding)) return;
          const uint32_t HOLD_MS = 3000;
          const uint32_t HUD_MS  = 250;   // ignore taps shorter than this
          uint32_t el = millis() - id(hold_start);
          if (el < HUD_MS) return;
          if (el > HOLD_MS) el = HOLD_MS;
          // Reveal HUD on first tick past the tap-grace window.
          if (lv_obj_has_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN)) {
            bool waking = id(lock_engaged);
            const char* hint = waking ? "WAKING UP" : "GOING TO SLEEP";
            if (strcmp(lv_label_get_text(id(hud_hint)), hint) != 0)
              lv_label_set_text(id(hud_hint), hint);
            const char* plant0 = waking ? "\U000F0E62" : "\U000F024A";
            const char* sky0 = waking ? "\U000F0594" : "\U000F05A8";
            if (strcmp(lv_label_get_text(id(hud_plant)), plant0) != 0)
              lv_label_set_text(id(hud_plant), plant0);
            if (strcmp(lv_label_get_text(id(hud_sky)), sky0) != 0)
              lv_label_set_text(id(hud_sky), sky0);
            lv_obj_set_style_text_color(id(hud_plant), lv_color_hex(waking ? 0x3A4550 : 0x00E676), 0);
            lv_obj_set_style_text_color(id(hud_sky),   lv_color_hex(waking ? 0x5A6472 : 0xFFC24A), 0);
            lv_bar_set_value(id(hud_bar), 0, LV_ANIM_OFF);
            lv_obj_clear_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);
          }
          float prog = (float) el / HOLD_MS;
          float wake = id(lock_engaged) ? prog : (1.0f - prog);
          const char* icon;
          if      (wake < 0.20f) icon = "\U000F0E62";
          else if (wake < 0.45f) icon = "\U000F0E66";
          else if (wake < 0.70f) icon = "\U000F032A";
          else if (wake < 0.95f) icon = "\U000F038E";
          else                   icon = "\U000F024A";
          if (strcmp(lv_label_get_text(id(hud_plant)), icon) != 0)
            lv_label_set_text(id(hud_plant), icon);
          const char* sky = wake < 0.5f ? "\U000F0594" : "\U000F05A8";
          if (strcmp(lv_label_get_text(id(hud_sky)), sky) != 0)
            lv_label_set_text(id(hud_sky), sky);
          {
            uint32_t pc = wake < 0.5f ? 0x3A4550 : 0x00E676;
            uint32_t sc = wake < 0.5f ? 0x5A6472 : 0xFFC24A;
            lv_color_t want_p = lv_color_hex(pc), want_s = lv_color_hex(sc);
            if (lv_color_to_u32(lv_obj_get_style_text_color(id(hud_plant), LV_PART_MAIN)) != lv_color_to_u32(want_p))
              lv_obj_set_style_text_color(id(hud_plant), want_p, LV_PART_MAIN);
            if (lv_color_to_u32(lv_obj_get_style_text_color(id(hud_sky), LV_PART_MAIN)) != lv_color_to_u32(want_s))
              lv_obj_set_style_text_color(id(hud_sky), want_s, LV_PART_MAIN);
          }
          int bar = (int)(prog * 100);
          if ((int) lv_bar_get_value(id(hud_bar)) != bar)
            lv_bar_set_value(id(hud_bar), bar, LV_ANIM_OFF);
          if (el < HOLD_MS) return;
          id(holding) = false;
          lv_obj_add_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);
          if (id(lock_engaged)) {
            id(lock_engaged) = false;
            lv_obj_add_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN);
            id(panel_sleeping) = false;
            lv_obj_add_flag(id(saver), LV_OBJ_FLAG_HIDDEN);
            id(bl_last) = -1;
          } else {
            id(lock_engaged) = true;
            lv_obj_clear_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN);
          }

  - id: hold_cancel
    then:
      - lambda: |-
          if (!id(holding)) return;
          id(holding) = false;
          lv_obj_add_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);

  # ---- tap-challenge gate: show confirm, then Engage sends hub_cmd ----
  - id: open_gate
    parameters:
      op: int
      val: int
      kind: int
    then:
      - lambda: |-
          id(gate_op) = op;
          id(gate_val) = val;
          if (kind == 0) {
            lv_label_set_text(id(gate_title), "Manual Takeover");
            lv_label_set_text(id(gate_body), "You will drive every output\nfrom HA. Safety stays armed.");
          } else {
            lv_label_set_text(id(gate_title), "Confirm demand");
            lv_label_set_text(id(gate_body), "Toggle this appliance demand?\nTap Engage to send.");
          }
          lv_obj_clear_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);

  - id: gate_confirm
    then:
      - script.execute:
          id: hub_cmd
          op: !lambda 'return id(gate_op);'
          val: !lambda 'return id(gate_val);'
      - lambda: 'lv_obj_add_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);'

  # open the roller editor for a select (0=stage 1=strategy 2=clone 3=priority)
  - id: open_editor
    parameters:
      target: int
    then:
      - lambda: |-
          id(edit_target) = target;
          const char* title; std::string opts; std::string cur;
          static const char* STAGE_N[]={"Germination","Seedling","Early Vegetative","Vegetative","Late (Push) Vegetative","Early Flowering","Flowering","Late Flowering","Final 48-72h Flowering","Dry Mode","Off"};
          static const char* STRAT_N[]={"VPD","Temperature","Humidity"};
          static const char* CMODE_N[]={"Follow 4x8","Clones & Seedlings","Mother","Custom","Off"};
          auto pick = [](int i, const char* const* o, int n)->std::string {
            return std::string(i>=0&&i<n?o[i]:"--");
          };
          switch (target) {
            case 0: title = "Grow Stage";
              opts = "Germination\nSeedling\nEarly Vegetative\nVegetative\nLate (Push) Vegetative\nEarly Flowering\nFlowering\nLate Flowering\nFinal 48-72h Flowering\nDry Mode\nOff";
              cur = pick(id(gv_stage), STAGE_N, 11); break;
            case 1: title = "Control Strategy";
              opts = "VPD\nTemperature\nHumidity";
              cur = pick(id(gv_strat), STRAT_N, 3); break;
            case 2: title = "Clone Mode";
              opts = "Follow 4x8\nClones & Seedlings\nMother\nCustom\nOff";
              cur = pick(id(gv_cmode), CMODE_N, 5); break;
            case 3: title = "Priority Tent";
              opts = "4x8 Main\n2x4 Clone";
              cur = std::string(id(gv_prio)?"4x8 Main":"2x4 Clone"); break;
            default: title = "Clone Photoperiod";
              opts = "Follow 4x8\nIndependent";
              cur = std::string((id(gv_coord)&64)?"Follow 4x8":"Independent"); break;
          }
          lv_label_set_text(id(ed_title), title);
          lv_roller_set_options(id(ed_roller)->obj, opts.c_str(), LV_ROLLER_MODE_NORMAL);
          int idx = 0, pos = 0; size_t start = 0;
          for (size_t i = 0; i <= opts.size(); i++) {
            if (i == opts.size() || opts[i] == '\n') {
              if (opts.substr(start, i - start) == cur) { idx = pos; break; }
              pos++; start = i + 1;
            }
          }
          lv_roller_set_selected(id(ed_roller)->obj, idx, LV_ANIM_OFF);
          lv_obj_clear_flag(id(editor), LV_OBJ_FLAG_HIDDEN);

  # apply the roller selection to the hub's select — send the INDEX over ESP-NOW
  # (roller option order matches the hub select order, so index maps 1:1).
  - id: apply_editor
    then:
      - script.execute:
          id: hub_cmd
          op: !lambda |-
            switch (id(edit_target)) {
              case 0: return 20;   // grow_stage
              case 1: return 21;   // control_strategy
              case 2: return 22;   // clone_mode
              case 3: return 24;   // priority_tent
              default: return 23;  // clone_photoperiod
            }
          val: !lambda 'return (int) lv_roller_get_selected(id(ed_roller)->obj);'
      - lambda: 'lv_obj_add_flag(id(editor), LV_OBJ_FLAG_HIDDEN);'

  # -------- the refresh engine (v4.0.11) --------
  # Page-gated: only touch widgets on the visible tab/overlay. Sleep/lock
  # short-circuit after LED/backlight/clock. Cadence is 5 s (see interval).
  # Avoid std::string in the hot path — A8 glyph churn is what WDT'd 4.0.9.
  - id: refresh_ui
    then:
      - lambda: |-
          const uint32_t NEON=0x00E676, AMBER=0xFFAA00, RED=0xF44336, CYAN=0x00BCD4,
                         GREY=0x5A6472, WHITE=0xFFFFFF, DIM=0xC0C6CC, BORD=0x232A33,
                         BLUE=0x2196F3, ORANGE=0xFF9800;
          char b[64];
          auto setc = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_text_color(o, LV_PART_MAIN);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_text_color(o, want, LV_PART_MAIN);
          };
          auto bordc = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_border_color(o, LV_PART_MAIN);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_border_color(o, want, LV_PART_MAIN);
          };
          auto setbar = [](lv_obj_t* o, int v){
            if ((int) lv_bar_get_value(o) != v) lv_bar_set_value(o, v, LV_ANIM_OFF);
          };
          auto setbarb = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_bg_color(o, LV_PART_INDICATOR);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_bg_color(o, want, LV_PART_INDICATOR);
          };
          auto setl = [](lv_obj_t* o, const char* s){
            const char* c = lv_label_get_text(o);
            if (c == nullptr || strcmp(c, s) != 0) lv_label_set_text(o, s);
          };
          auto sethid = [](lv_obj_t* o, bool hide){
            bool is_hid = lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN);
            if (hide && !is_hid) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            else if (!hide && is_hid) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto bandcol = [&](float v, float lo, float hi)->uint32_t{
            if (isnan(v) || isnan(lo) || isnan(hi)) return GREY;
            if (v >= lo && v <= hi) return NEON;
            float m = (hi - lo) * 0.15f; if (m < 0.05f) m = 0.05f;
            if (v >= lo - m && v <= hi + m) return AMBER;
            return RED;
          };

          const bool sleeping = id(panel_sleeping);
          const bool locked = id(lock_engaged);
          const bool conn_vis = !lv_obj_has_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);
          const int tab = id(active_tab);
          const bool soil_det = id(ui_soil_detail);
          const bool interactive = !sleeping && !locked;

          // v4.0.11 — read ESP-NOW globals directly (template mirrors parked).
          const float *cfg = id(gv_cfg);
          const float *soil = id(gv_soil);
          const float *cd = id(gv_cd);
          const int dem = id(gv_dem), mode = id(gv_mode), flt = id(gv_flt), coord = id(gv_coord);
          const int stage = id(gv_stage), strat = id(gv_strat), cmode = id(gv_cmode), prio = id(gv_prio);
          bool cfollow = (cmode == 0);
          float c_rmin = cfollow ? cfg[3] : cfg[8];
          float c_rmax = cfollow ? cfg[4] : cfg[9];
          float c_vmin = cfollow ? cfg[1] : cfg[6];
          float c_vmax = cfollow ? cfg[2] : cfg[7];
          float c_tt   = cfollow ? cfg[0] : cfg[5];
          float m_rmin = cfg[3], m_rmax = cfg[4];
          float m_vmin = cfg[1], m_vmax = cfg[2];
          float m_tt   = cfg[0];
          float clone_temp = id(gv_clone_t), clone_rh = id(gv_clone_rh), clone_vpd = id(gv_clone_vpd);
          float main_temp = id(gv_tent_t), main_rh = id(gv_tent_rh), main_vpd = id(gv_tent_vpd);
          float room_temp = id(gv_room_t), room_rh = id(gv_room_rh);
          float co2_ppm = id(gv_co2);
          float fan_out_pct = (float) id(gv_fan_out);
          float fan_recirc_pct = (float) id(gv_fan_recirc);
          float fan_int_main_pct = (float) id(gv_fan_imain);
          float fan_int_clone_pct = (float) id(gv_fan_iclone);
          float sf_target = cfg[10];
          float n_ramp = cfg[14], n_sunrise = cfg[11], n_sunset = cfg[12], n_clh = cfg[13];
          float n_rzlo = cfg[19], n_rzhi = cfg[20], n_matoff = cfg[21];
          float n_chh = cfg[15], n_chmo = cfg[16], n_hmo = cfg[17], n_htmo = cfg[18];
          float n_dsp = cfg[22], n_dsl = cfg[23], n_dslv = cfg[24];
          bool dem_hum = dem & 1, dem_dehum = dem & 2, dem_heater = dem & 4;
          bool dem_mat = dem & 8, dem_ac = dem & 16, dem_clone_hum = dem & 32;
          bool lights_main = flt & 32;
          bool fault_emg = flt & 128, fault_climate = flt & 1;
          bool fault_rootzone = flt & 8, fault_aux = flt & 6;
          bool fan_out_on = id(gv_fan_out) > 0, fan_recirc_on = id(gv_fan_recirc) > 0;
          bool fan_int_main_on = id(gv_fan_imain) > 0, fan_int_clone_on = id(gv_fan_iclone) > 0;
          bool st_full_auto = mode & 1, st_takeover = mode & 4, st_auto_photo = mode & 8;
          bool st_light_hold = mode & 16, st_hum_routing = coord & 1, st_destrat = coord & 2;
          static const char* STAGE_N[] = {"Germination","Seedling","Early Vegetative","Vegetative","Late (Push) Vegetative","Early Flowering","Flowering","Late Flowering","Final 48-72h Flowering","Dry Mode","Off"};
          static const char* STRAT_N[] = {"VPD","Temperature","Humidity"};
          static const char* CMODE_N[] = {"Follow 4x8","Clones & Seedlings","Mother","Custom","Off"};
          const char* sel_stage = (stage>=0&&stage<11)?STAGE_N[stage]:"--";
          const char* sel_strategy = (strat>=0&&strat<3)?STRAT_N[strat]:"--";
          const char* sel_clone_mode = (cmode>=0&&cmode<5)?CMODE_N[cmode]:"--";
          const char* sel_priority = prio ? "4x8 Main" : "2x4 Clone";
          const char* sel_clone_photo = (coord&64) ? "Follow 4x8" : "Independent";
          const char* p1_plant = id(gv_plant1).c_str();
          const char* p2_plant = id(gv_plant2).c_str();
          const char* p3_plant = id(gv_plant3).c_str();
          const char* p4_plant = id(gv_plant4).c_str();
          float p1_moist=soil[1], p1_temp=soil[0], p1_ec=soil[2], p1_ph=soil[3], p1_n=soil[4], p1_p=soil[5], p1_k=soil[6];
          float p2_moist=soil[8], p2_temp=soil[7], p2_ec=soil[9], p2_ph=soil[10], p2_n=soil[11], p2_p=soil[12], p2_k=soil[13];
          float p3_moist=soil[15], p3_temp=soil[14], p3_ec=soil[16], p3_ph=soil[17], p3_n=soil[18], p3_p=soil[19], p3_k=soil[20];
          float p4_moist=soil[22], p4_temp=soil[21], p4_ec=soil[23], p4_ph=soil[24], p4_n=soil[25], p4_p=soil[26], p4_k=soil[27];
          float cd_hum=cd[0], cd_dehum=cd[1], cd_heater=cd[2], cd_ac=cd[3], cd_mat=cd[4], cd_clone_hum=cd[5];

          bool link = id(api_link).state;
          bool any_dem = dem_hum||dem_dehum||dem_heater||dem_ac||dem_mat||dem_clone_hum;

          // ---- connection edge timers (always; cheap) ----
          {
            uint32_t nowms = millis();
            bool w = id(wifi_conn);
            if (w && !id(wifi_was)) id(wifi_since) = nowms;
            id(wifi_was) = w;
            if (link && !id(api_was)) id(api_since) = nowms;
            id(api_was) = link;
          }

          // ---- alerts (always — drives LED + silence banner) ----
          int ac = 0; char head[48] = ""; char hb[48];
          auto AL = [&](bool cond, const char* txt){
            if (!cond) return;
            if (ac == 0) { strncpy(head, txt, sizeof(head)-1); head[sizeof(head)-1] = 0; }
            ac++;
          };
          AL(fault_emg, "Emergency failsafe >35°C");
          AL(fault_climate, "Climate sensor fault");
          AL(fault_rootzone, "Root-zone probe fault");
          AL(fault_aux, "Aux sensor offline");
          AL(any_dem && !link, "Appliances need HA (Sonoffs offline)");
          if (id(wifi_channel_hopped)) {
            snprintf(hb, sizeof(hb), "WiFi channel hop → %d (check ESP-NOW)", id(wifi_channel));
            AL(true, hb);
            uint32_t hub_age = millis() - id(gv_hub_last);
            if (id(gv_hub_last) != 0 && hub_age < 6000) id(wifi_channel_hopped) = false;
          }
          float crh = clone_rh, cvp = clone_vpd, mrh = main_rh, mvp = main_vpd;
          if (!isnan(crh) && !isnan(c_rmax) && crh > c_rmax + 2) { snprintf(hb,sizeof(hb),"Clone RH high · %.0f%%",crh); AL(true,hb); }
          if (!isnan(cvp) && !isnan(c_vmax) && cvp > c_vmax + 0.1f) { snprintf(hb,sizeof(hb),"Clone VPD high · %.2f",cvp); AL(true,hb); }
          if (!isnan(mrh) && !isnan(m_rmax) && mrh > m_rmax + 2) { snprintf(hb,sizeof(hb),"Main RH high · %.0f%%",mrh); AL(true,hb); }
          if (!isnan(mvp) && !isnan(m_vmax) && mvp > m_vmax + 0.1f) { snprintf(hb,sizeof(hb),"Main VPD high · %.2f",mvp); AL(true,hb); }
          id(alert_count) = ac;
          if (ac == 0) id(alerts_silenced) = false;
          sethid(id(btn_silence), !(ac > 0 && !id(alerts_silenced)));

          // ---- night / backlight / status LED (always) ----
          bool night = !lights_main;
          id(night_mode) = night;
          int want = sleeping ? 12 : (night ? 40 : 100);
          if (want != id(bl_last)) {
            id(bl_last) = want; auto bl = id(backlight).turn_on(); bl.set_brightness(want/100.0f); bl.perform();
          }
          if (!id(fl_active)) {
            int lm;
            if (ac > 0 && !id(alerts_silenced)) lm = 1;
            else if (night) lm = 0;
            else if (any_dem) lm = 2;
            else lm = id(green_heartbeat) ? 3 : 0;
            if (lm != id(led_last)) {
              id(led_last) = lm;
              if (lm == 0) {
                id(status_led).turn_off().perform();
              } else if (lm == 1) {
                auto c = id(status_led).turn_on();
                c.set_rgb(1.0f, 0.0f, 0.0f); c.set_brightness(1.0f);
                c.perform();
              } else if (lm == 3) {
                auto c = id(status_led).turn_on();
                c.set_rgb(0.0f, 1.0f, 0.25f); c.set_brightness(0.35f);
                c.perform();
              } else {
                auto c = id(status_led).turn_on();
                c.set_brightness(0.6f);
                c.set_rgb(1.0f, 0.60f, 0.0f);
                c.perform();
              }
            }
          }

          // ---- clocks (always; setl no-ops when unchanged) ----
          {
            auto now = id(sntp_time).now();
            if (!now.is_valid()) now = id(ha_time).now();
            if (now.is_valid()) {
              snprintf(b, sizeof(b), "%02d:%02d", now.hour, now.minute);
              setl(id(saver_clock), b); setl(id(lock_clock), b);
            }
          }

          if (locked) {
            lv_color_t white = lv_color_hex(0xFFFFFF), dim = lv_color_hex(0x2A2A2A);
            auto lockic = [&](lv_obj_t* L, bool on){
              lv_color_t wantc = on ? white : dim;
              if (lv_color_to_u32(lv_obj_get_style_text_color(L, LV_PART_MAIN)) != lv_color_to_u32(wantc))
                lv_obj_set_style_text_color(L, wantc, LV_PART_MAIN);
              if (lv_obj_get_style_text_opa(L, LV_PART_MAIN) != 255)
                lv_obj_set_style_text_opa(L, 255, LV_PART_MAIN);
            };
            bool fan_on = !isnan(fan_out_pct) && fan_out_pct > 0;
            bool int_on = !isnan(fan_int_main_pct) && fan_int_main_pct > 0;
            lockic(id(lk_fan), fan_on); lockic(id(lk_int), int_on); lockic(id(lk_heat), dem_heater);
            lockic(id(lk_hum), dem_hum); lockic(id(lk_deh), dem_dehum); lockic(id(lk_light), lights_main);
          }

          if (!interactive) return;

          // ---- Connections overlay (only when open) ----
          if (conn_vis) {
            uint32_t nowms = millis();
            bool w = id(wifi_conn);
            auto upstr = [](char* out, size_t n, bool on, uint32_t since, uint32_t now){
              if (!on) { strncpy(out, "0s", n); return; }
              uint32_t s = (now - since) / 1000;
              if (s < 60)      snprintf(out, n, "%us", s);
              else if (s<3600) snprintf(out, n, "%um", s/60);
              else             snprintf(out, n, "%uh %um", s/3600, (s%3600)/60);
            };
            char u[16];
            upstr(u, sizeof(u), w, id(wifi_since), nowms);
            setl(id(conn_wifi_up), u); setc(id(conn_wifi_up), w ? NEON : GREY);
            setc(id(conn_wifi_ic), w ? NEON : RED);
            upstr(u, sizeof(u), link, id(api_since), nowms);
            setl(id(conn_api_up), u); setc(id(conn_api_up), link ? NEON : GREY);
            setc(id(conn_api_ic), link ? NEON : RED);
            const char* ssid = id(wifi_ssid_ts).state.c_str();
            if (ssid == nullptr || ssid[0] == '\0') ssid = "—";
            float rssi = id(wifi_rssi).state;
            int ch = id(wifi_channel);
            if (isnan(rssi)) {
              if (ch > 0) snprintf(b, sizeof(b), "%s · ch%d", ssid, ch);
              else        snprintf(b, sizeof(b), "%s", ssid);
            } else if (ch > 0) {
              snprintf(b, sizeof(b), "%s · %ddBm · ch%d", ssid, (int)rssi, ch);
            } else {
              snprintf(b, sizeof(b), "%s · %ddBm", ssid, (int)rssi);
            }
            setl(id(conn_wifi_sub), b);
            setl(id(conn_api_sub), id(wifi_ip_ts).state.c_str());
            uint32_t hub_age = nowms - id(gv_hub_last);
            bool espn = id(gv_hub_last) != 0 && hub_age < 6000;
            setc(id(conn_espnow_ic), espn ? NEON : RED);
            setl(id(conn_espnow_val), espn ? "LINKED" : "DOWN");
            setc(id(conn_espnow_val), espn ? NEON : RED);
            if (id(gv_hub_last) == 0) {
              snprintf(b, sizeof(b), "no hub packet · tx#%u", (unsigned) id(cmd_tx_seq));
            } else if (espn) {
              if (ch > 0)
                snprintf(b, sizeof(b), "rx %us · tx#%u · ch%d", hub_age / 1000, (unsigned) id(cmd_tx_seq), ch);
              else
                snprintf(b, sizeof(b), "rx %us · tx#%u", hub_age / 1000, (unsigned) id(cmd_tx_seq));
            } else {
              uint32_t s = hub_age / 1000;
              if (s < 3600)      snprintf(b, sizeof(b), "silent %um · tx#%u", s / 60 ? s / 60 : 1, (unsigned) id(cmd_tx_seq));
              else if (s < 86400) snprintf(b, sizeof(b), "silent %uh · tx#%u", s / 3600, (unsigned) id(cmd_tx_seq));
              else                snprintf(b, sizeof(b), "silent %ud · tx#%u", s / 86400, (unsigned) id(cmd_tx_seq));
            }
            setl(id(conn_espnow_sub), b);
          }

          // ---- PULSE ----
          if (tab == 0) {
            setc(id(pill_wifi_ic), link ? NEON : RED);
            float co2 = co2_ppm;
            if (isnan(co2)) strcpy(b, "CO2 --- ppm"); else snprintf(b, sizeof(b), "CO2 %d ppm", (int)co2);
            setl(id(lbl_co2), b);

            float bv = id(batt_v).state;
            bool valid = !isnan(bv) && bv > 2.8f && bv < 4.6f;
            if (valid) {
              int pct = (int)((bv - 3.30f) / (4.20f - 3.30f) * 100.0f);
              if (pct < 0) pct = 0; if (pct > 100) pct = 100;
              snprintf(b, sizeof(b), "%d%%", pct);
              setl(id(pill_batt_pct), b);
              setc(id(pill_batt_pct), pct <= 15 ? RED : (pct <= 40 ? AMBER : NEON));
              setc(id(pill_batt_ic),  pct <= 15 ? RED : (pct <= 40 ? AMBER : NEON));
            }
            sethid(id(pill_batt_ic), !valid);
            sethid(id(pill_batt_pct), !valid);

            auto envtxt = [&](lv_obj_t* o, float t, float rh){
              if (isnan(t) || isnan(rh)) { setl(o, "--"); return; }
              char x[32]; snprintf(x, sizeof(x), "%.1f° · %.0f%%", t, rh); setl(o, x);
            };
            envtxt(id(lbl_2x4), clone_temp, clone_rh);
            envtxt(id(lbl_4x8), main_temp,  main_rh);
            envtxt(id(lbl_room), room_temp, room_rh);

            {
              float mn = NAN, mx = NAN;
              int n = id(spark_filled) ? 12 : id(spark_idx);
              for (int i = 0; i < n; i++) {
                float v = id(spark_vpd)[i];
                if (isnan(v)) continue;
                if (isnan(mn) || v < mn) mn = v;
                if (isnan(mx) || v > mx) mx = v;
              }
              if (isnan(mn)) setl(id(lbl_spark), "VPD —");
              else { snprintf(b, sizeof(b), "VPD %.2f–%.2f", mn, mx); setl(id(lbl_spark), b); }
            }

            int fans = (fan_out_on?1:0) + (fan_recirc_on?1:0)
                     + (fan_int_main_on?1:0) + (fan_int_clone_on?1:0);
            if (fans > 0) { snprintf(b, sizeof(b), "active · %d fans", fans);
              setc(id(lbl_rung1), CYAN); bordc(id(rung1), CYAN); }
            else { strcpy(b, "idle"); setc(id(lbl_rung1), GREY); bordc(id(rung1), BORD); }
            setl(id(lbl_rung1), b);

            const char* dem = nullptr;
            if (dem_dehum) dem = "dehumidifier";
            else if (dem_hum) dem = "humidifier";
            else if (dem_heater) dem = "heater";
            else if (dem_ac) dem = "AC";
            else if (dem_mat) dem = "grow mat";
            else if (dem_clone_hum) dem = "clone humid";
            if (dem) { snprintf(b, sizeof(b), "%s active", dem);
              setc(id(lbl_rung2), AMBER); bordc(id(rung2), AMBER); }
            else {
              float best = 1e9f; const char* who = nullptr;
              auto chk = [&](float v, const char* n){ if (!isnan(v) && v > 0 && v < best) { best = v; who = n; } };
              chk(cd_dehum,"dehum"); chk(cd_hum,"humid"); chk(cd_heater,"heater");
              chk(cd_ac,"AC"); chk(cd_mat,"mat"); chk(cd_clone_hum,"c-hum");
              if (who) { snprintf(b, sizeof(b), "%s in %ds", who, (int)best); setc(id(lbl_rung2), AMBER); bordc(id(rung2), BORD); }
              else { strcpy(b, "standing by"); setc(id(lbl_rung2), GREY); bordc(id(rung2), BORD); }
            }
            setl(id(lbl_rung2), b);

            snprintf(b, sizeof(b), "%d", ac); setl(id(pill_alert_ct), b);
            setc(id(pill_alert_ct), ac>0?RED:GREY); setc(id(pill_bell_ic), ac>0?RED:GREY);
            if (ac == 0) {
              setl(id(lbl_alert), "all clear · nothing needs attention");
              setc(id(lbl_alert), DIM); setc(id(alert_ic), NEON); bordc(id(alert_strip), 0x1E3A2B);
              sethid(id(btn_mute), true);
            } else {
              if (id(alerts_silenced)) {
                snprintf(b, sizeof(b), "%d muted · %s", ac, head);
                setl(id(lbl_alert), b);
                setc(id(lbl_alert), 0x8A929C); setc(id(alert_ic), 0x8A929C); bordc(id(alert_strip), 0x3A2A12);
              } else {
                setl(id(lbl_alert), head);
                setc(id(lbl_alert), WHITE); setc(id(alert_ic), RED); bordc(id(alert_strip), RED);
              }
              sethid(id(btn_mute), false);
              setl(id(lbl_mute), id(alerts_silenced) ? "unmute" : "mute");
            }
          }

          // ---- CLONE vitals + clone device rows ----
          if (tab == 1) {
            float t = clone_temp; uint32_t c = bandcol(t, c_tt-2, c_tt+2);
            if (isnan(t)) setl(id(clv_temp_val),"--"); else { snprintf(b,sizeof(b),"%.1f°",t); setl(id(clv_temp_val),b);}
            setc(id(clv_temp_val),c); setbar(id(clv_temp_bar), isnan(t)?10:(int)t); setbarb(id(clv_temp_bar), c);
            float rh = clone_rh; c = bandcol(rh, c_rmin, c_rmax);
            if (isnan(rh)) setl(id(clv_rh_val),"--"); else { snprintf(b,sizeof(b),"%.0f%%",rh); setl(id(clv_rh_val),b);}
            setc(id(clv_rh_val),c); setbar(id(clv_rh_bar), isnan(rh)?0:(int)rh); setbarb(id(clv_rh_bar), c);
            float vp = clone_vpd; c = bandcol(vp, c_vmin, c_vmax);
            if (isnan(vp)) setl(id(clv_vpd_val),"--"); else { snprintf(b,sizeof(b),"%.2f kPa",vp); setl(id(clv_vpd_val),b);}
            setc(id(clv_vpd_val),c); setbar(id(clv_vpd_bar), isnan(vp)?0:(int)(vp*100)); setbarb(id(clv_vpd_bar), c);
            setl(id(clone_hdr_note), sel_clone_mode);

            auto pctlbl = [&](lv_obj_t* L, float v){ if (isnan(v)) setl(L, "--"); else { char q[8]; snprintf(q, sizeof(q), "%d%%", (int)v); setl(L, q); } };
            auto stlbl = [&](lv_obj_t* L, bool on){ setl(L, on ? "ON" : "off"); setc(L, on ? NEON : GREY); };
            pctlbl(id(sf1000_val), sf_target);
            pctlbl(id(fanclone_val), fan_int_clone_pct);
            stlbl(id(dem_clone_hum_st), dem_clone_hum);
            stlbl(id(dem_mat_st), dem_mat);
            auto pon = [](float v){ return !isnan(v) && v > 0; };
            auto ic = [&](lv_obj_t* L, bool on, uint32_t col){
              setc(L, on ? col : 0x39424D);
              if (lv_obj_get_style_text_opa(L, LV_PART_MAIN) != 255)
                lv_obj_set_style_text_opa(L, 255, LV_PART_MAIN);
            };
            ic(id(ic_csf),  pon(sf_target),        AMBER);
            ic(id(ic_cint), pon(fan_int_clone_pct), CYAN);
            ic(id(ic_chum), dem_clone_hum,          CYAN);
            ic(id(ic_cmat), dem_mat,               ORANGE);
          }

          // ---- MAIN vitals + main device rows ----
          if (tab == 2) {
            float t = main_temp; uint32_t c = bandcol(t, m_tt-2, m_tt+2);
            if (isnan(t)) setl(id(mnv_temp_val),"--"); else { snprintf(b,sizeof(b),"%.1f°",t); setl(id(mnv_temp_val),b);}
            setc(id(mnv_temp_val),c); setbar(id(mnv_temp_bar), isnan(t)?10:(int)t); setbarb(id(mnv_temp_bar), c);
            float rh = main_rh; c = bandcol(rh, m_rmin, m_rmax);
            if (isnan(rh)) setl(id(mnv_rh_val),"--"); else { snprintf(b,sizeof(b),"%.0f%%",rh); setl(id(mnv_rh_val),b);}
            setc(id(mnv_rh_val),c); setbar(id(mnv_rh_bar), isnan(rh)?0:(int)rh); setbarb(id(mnv_rh_bar), c);
            float vp = main_vpd; c = bandcol(vp, m_vmin, m_vmax);
            if (isnan(vp)) setl(id(mnv_vpd_val),"--"); else { snprintf(b,sizeof(b),"%.2f kPa",vp); setl(id(mnv_vpd_val),b);}
            setc(id(mnv_vpd_val),c); setbar(id(mnv_vpd_bar), isnan(vp)?0:(int)(vp*100)); setbarb(id(mnv_vpd_bar), c);

            auto pctlbl = [&](lv_obj_t* L, float v){ if (isnan(v)) setl(L, "--"); else { char q[8]; snprintf(q, sizeof(q), "%d%%", (int)v); setl(L, q); } };
            auto stlbl = [&](lv_obj_t* L, bool on){ setl(L, on ? "ON" : "off"); setc(L, on ? NEON : GREY); };
            pctlbl(id(exhout_val), fan_out_pct);
            pctlbl(id(exhroom_val), fan_recirc_pct);
            pctlbl(id(intmain_val), fan_int_main_pct);
            stlbl(id(dem_heater_st), dem_heater);
            stlbl(id(dem_ac_st), dem_ac);
            stlbl(id(dem_hum_st), dem_hum);
            stlbl(id(dem_dehum_st), dem_dehum);
            auto pon = [](float v){ return !isnan(v) && v > 0; };
            auto ic = [&](lv_obj_t* L, bool on, uint32_t col){
              setc(L, on ? col : 0x39424D);
              if (lv_obj_get_style_text_opa(L, LV_PART_MAIN) != 255)
                lv_obj_set_style_text_opa(L, 255, LV_PART_MAIN);
            };
            ic(id(ic_mout), pon(fan_out_pct),       CYAN);
            ic(id(ic_mroom),pon(fan_recirc_pct),    CYAN);
            ic(id(ic_mint), pon(fan_int_main_pct),  BLUE);
            ic(id(ic_mheat),dem_heater,            ORANGE);
            ic(id(ic_mac),  dem_ac,                 BLUE);
            ic(id(ic_mhum), dem_hum,                CYAN);
            ic(id(ic_mdeh), dem_dehum,              AMBER);
          }

          // ---- CONTROL + setup steppers ----
          if (tab == 4) {
            bool fa = st_full_auto, ta = st_takeover, ap = st_auto_photo;
            setl(id(lbl_fullauto_state), fa ? "ON" : "off"); setc(id(lbl_fullauto_state), fa ? NEON : GREY);
            setl(id(lbl_autophoto_state), ap ? "ON" : "off"); setc(id(lbl_autophoto_state), ap ? NEON : GREY);
            if (ta) { setl(id(lbl_takeover_state), "ENGAGED — you own outputs"); setc(id(lbl_takeover_state), AMBER); bordc(id(takeover_card), AMBER); }
            else { setl(id(lbl_takeover_state), "tap to engage"); setc(id(lbl_takeover_state), 0x8A929C); bordc(id(takeover_card), BORD); }
            setl(id(lbl_stage_val), sel_stage);
            setl(id(lbl_strategy_val), sel_strategy);
            setl(id(lbl_clonemode_val), sel_clone_mode);
            setl(id(lbl_priority_val), sel_priority);

            auto numlbl = [&](lv_obj_t* L, float v, const char* fmt){ if (isnan(v)) { setl(L, "--"); return; } char q[16]; snprintf(q, sizeof(q), fmt, v); setl(L, q); };
            auto stv = [&](lv_obj_t* L, bool on){ setl(L, on ? "ON" : "off"); setc(L, on ? NEON : GREY); };
            numlbl(id(s_temp_val), m_tt, "%.1f°");
            numlbl(id(s_vmin_val), m_vmin, "%.1f");
            numlbl(id(s_vmax_val), m_vmax, "%.1f");
            numlbl(id(s_rmin_val), m_rmin, "%.0f%");
            numlbl(id(s_rmax_val), m_rmax, "%.0f%");
            numlbl(id(s_ctemp_val), cfg[5], "%.1f°");
            numlbl(id(s_cvmin_val), cfg[6], "%.1f");
            numlbl(id(s_cvmax_val), cfg[7], "%.1f");
            numlbl(id(s_crmin_val), cfg[8], "%.0f%");
            numlbl(id(s_crmax_val), cfg[9], "%.0f%");
            numlbl(id(s_sftgt_val), sf_target, "%.0f%");
            numlbl(id(s_ramp_val), n_ramp, "%.0f%");
            numlbl(id(s_sunrise_val), n_sunrise, "%.0fm");
            numlbl(id(s_sunset_val), n_sunset, "%.0fm");
            numlbl(id(s_clh_val), n_clh, "%.0fh");
            numlbl(id(s_rzlo_val), n_rzlo, "%.1f°");
            numlbl(id(s_rzhi_val), n_rzhi, "%.1f°");
            numlbl(id(s_matoff_val), n_matoff, "%.0fs");
            numlbl(id(s_chh_val), n_chh, "%.1f%");
            numlbl(id(s_chmo_val), n_chmo, "%.0fs");
            numlbl(id(s_hmo_val), n_hmo, "%.0fs");
            numlbl(id(s_htmo_val), n_htmo, "%.0fs");
            numlbl(id(s_dsp_val), n_dsp, "%.0fs");
            numlbl(id(s_dsl_val), n_dsl, "%.0fs");
            numlbl(id(s_dslv_val), n_dslv, "%.0f%");
            stv(id(st_lighthold_v), st_light_hold);
            stv(id(st_humroute_v), st_hum_routing);
            stv(id(st_destrat_v), st_destrat);
            stv(id(st_greenhb_v), id(green_heartbeat));
            setl(id(lbl_clonephoto_val), sel_clone_photo);
          }

          // ---- SOIL summary cards ----
          if (tab == 3 && !soil_det) {
            auto potrow = [&](lv_obj_t* nameL, lv_obj_t* npkL, lv_obj_t* valL, int idx,
                              const char* plant, float mo, float tp, float ec, float ph,
                              float nn, float pp, float kk){
              char x[80];
              snprintf(x, sizeof(x), "P%d · %s", idx, (plant == nullptr || plant[0]=='\0') ? "—" : plant);
              setl(nameL, x);
              if (isnan(nn) && isnan(pp) && isnan(kk)) setl(npkL, "N/P/K —");
              else { snprintf(x, sizeof(x), "N/P/K %d/%d/%d", (int)(isnan(nn)?0:nn), (int)(isnan(pp)?0:pp), (int)(isnan(kk)?0:kk)); setl(npkL, x); }
              if (isnan(mo) && isnan(tp) && isnan(ph)) { setl(valL, "offline / no data"); setc(valL, GREY); return; }
              char mS[10], tS[12], pS[10], eS[12];
              if (isnan(mo)) strcpy(mS, "--"); else snprintf(mS, sizeof(mS), "%.0f%%", mo);
              if (isnan(tp)) strcpy(tS, "--"); else snprintf(tS, sizeof(tS), "%.1f°", tp);
              if (isnan(ph)) strcpy(pS, "--"); else snprintf(pS, sizeof(pS), "%.1f", ph);
              if (isnan(ec)) strcpy(eS, "--"); else snprintf(eS, sizeof(eS), "%.0f", ec);
              snprintf(x, sizeof(x), "M %s · T %s · pH %s · EC %s", mS, tS, pS, eS);
              setl(valL, x);
              bool healthy = (!isnan(mo) && mo >= 30.0f) && (!isnan(ph) && ph >= 5.8f && ph <= 6.8f);
              setc(valL, healthy ? NEON : AMBER);
            };
            potrow(id(lbl_p1_name), id(lbl_p1_npk), id(lbl_p1_vals), 1, p1_plant,
                   p1_moist, p1_temp, p1_ec, p1_ph, p1_n, p1_p, p1_k);
            potrow(id(lbl_p2_name), id(lbl_p2_npk), id(lbl_p2_vals), 2, p2_plant,
                   p2_moist, p2_temp, p2_ec, p2_ph, p2_n, p2_p, p2_k);
            potrow(id(lbl_p3_name), id(lbl_p3_npk), id(lbl_p3_vals), 3, p3_plant,
                   p3_moist, p3_temp, p3_ec, p3_ph, p3_n, p3_p, p3_k);
            potrow(id(lbl_p4_name), id(lbl_p4_npk), id(lbl_p4_vals), 4, p4_plant,
                   p4_moist, p4_temp, p4_ec, p4_ph, p4_n, p4_p, p4_k);
          }

          // ---- SOIL detail ----
          if (soil_det) {
            int pot = id(soil_detail_pot);
            if (pot < 1 || pot > 4) pot = 1;
            const char* plant = p1_plant;
            float mo = p1_moist, tp = p1_temp, ec = p1_ec, ph = p1_ph;
            float nn = p1_n, pp = p1_p, kk = p1_k;
            if (pot == 2) {
              plant = p2_plant; mo = p2_moist; tp = p2_temp;
              ec = p2_ec; ph = p2_ph; nn = p2_n; pp = p2_p; kk = p2_k;
            } else if (pot == 3) {
              plant = p3_plant; mo = p3_moist; tp = p3_temp;
              ec = p3_ec; ph = p3_ph; nn = p3_n; pp = p3_p; kk = p3_k;
            } else if (pot == 4) {
              plant = p4_plant; mo = p4_moist; tp = p4_temp;
              ec = p4_ec; ph = p4_ph; nn = p4_n; pp = p4_p; kk = p4_k;
            }
            char x[64];
            if (plant == nullptr || plant[0] == '\0') snprintf(x, sizeof(x), "POT %d", pot);
            else snprintf(x, sizeof(x), "P%d · %s", pot, plant);
            setl(id(lbl_sd_title), x);

            if (isnan(mo)) { setl(id(sd_moist_val), "--"); setc(id(sd_moist_val), GREY); setbar(id(sd_moist_bar), 0); setbarb(id(sd_moist_bar), GREY); }
            else {
              snprintf(x, sizeof(x), "%.0f%%", mo); setl(id(sd_moist_val), x);
              setbar(id(sd_moist_bar), (int) mo);
              uint32_t c = (mo >= 30.0f) ? NEON : AMBER;
              setc(id(sd_moist_val), c); setbarb(id(sd_moist_bar), c);
            }
            if (isnan(tp)) { setl(id(sd_temp_val), "--"); setc(id(sd_temp_val), GREY); }
            else { snprintf(x, sizeof(x), "%.1f°C", tp); setl(id(sd_temp_val), x); setc(id(sd_temp_val), NEON); }
            if (isnan(ph)) { setl(id(sd_ph_val), "--"); setc(id(sd_ph_val), GREY); setbar(id(sd_ph_bar), 40); setbarb(id(sd_ph_bar), GREY); }
            else {
              snprintf(x, sizeof(x), "%.2f", ph); setl(id(sd_ph_val), x);
              int pb = (int) (ph * 10.0f); if (pb < 40) pb = 40; if (pb > 80) pb = 80;
              setbar(id(sd_ph_bar), pb);
              uint32_t c = (ph >= 5.8f && ph <= 6.8f) ? NEON : AMBER;
              setc(id(sd_ph_val), c); setbarb(id(sd_ph_bar), c);
            }
            if (isnan(ec)) { setl(id(sd_ec_val), "--"); setc(id(sd_ec_val), GREY); }
            else { snprintf(x, sizeof(x), "%.0f uS/cm", ec); setl(id(sd_ec_val), x); setc(id(sd_ec_val), NEON); }
            if (isnan(nn)) { setl(id(sd_n_val), "--"); setc(id(sd_n_val), GREY); }
            else { snprintf(x, sizeof(x), "%d", (int) nn); setl(id(sd_n_val), x); setc(id(sd_n_val), NEON); }
            if (isnan(pp)) { setl(id(sd_p_val), "--"); setc(id(sd_p_val), GREY); }
            else { snprintf(x, sizeof(x), "%d", (int) pp); setl(id(sd_p_val), x); setc(id(sd_p_val), NEON); }
            if (isnan(kk)) { setl(id(sd_k_val), "--"); setc(id(sd_k_val), GREY); }
            else { snprintf(x, sizeof(x), "%d", (int) kk); setl(id(sd_k_val), x); setc(id(sd_k_val), NEON); }
          }

# ==================================================================
#  PERIODIC REFRESH
# ==================================================================
interval:
  # v4.0.11 — 5 s page-gated refresh; UI reads gv_* live (mirrors parked).
  - interval: 5s
    then:
      - script.execute: refresh_ui
  # Nest/mesh can hop 2.4 GHz without a reconnect — keep wifi_channel fresh
  # so Connections + alert strip catch ESP-NOW splits without waiting for
  # on_connect.
  - interval: 30s
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;
          int ch = (int) w->get_wifi_channel();
          if (ch <= 0) return;
          if (id(wifi_channel) != 0 && id(wifi_channel) != ch) {
            id(wifi_channel_hopped) = true;
            ESP_LOGW("wifi", "channel hop %d -> %d (ESP-NOW needs hub on same ch)", id(wifi_channel), ch);
          }
          id(wifi_channel) = ch;
  # 1h VPD micro-trend: one sample / 5 min → 12 slots. No canvas widgets.
  - interval: 300s
    then:
      - lambda: |-
          float v = id(gv_tent_vpd);
          if (isnan(v)) v = id(gv_clone_vpd);
          if (isnan(v)) return;
          int i = id(spark_idx);
          id(spark_vpd)[i] = v;
          id(spark_idx) = (i + 1) % 12;
          if (id(spark_idx) == 0) id(spark_filled) = true;

          // ---- MAIN vitals + main device rows ----
          if (tab == 2 && !pwr_det && !vpd_ed) {
            float t = main_temp; uint32_t c = bandcol(t, m_tt-2, m_tt+2);
            if (isnan(t)) setl(id(mnv_temp_val),"--"); else { snprintf(b,sizeof(b),"%.1f°",t); setl(id(mnv_temp_val),b);}
            setc(id(mnv_temp_val),c); setbar(id(mnv_temp_bar), isnan(t)?10:(int)t); setbarb(id(mnv_temp_bar), c);
            float rh = main_rh; c = bandcol(rh, m_rmin, m_rmax);
            if (isnan(rh)) setl(id(mnv_rh_val),"--"); else { snprintf(b,sizeof(b),"%.0f%%",rh); setl(id(mnv_rh_val),b);}
            setc(id(mnv_rh_val),c); setbar(id(mnv_rh_bar), isnan(rh)?0:(int)rh); setbarb(id(mnv_rh_bar), c);
            float vp = main_vpd; c = bandcol(vp, m_vmin, m_vmax);

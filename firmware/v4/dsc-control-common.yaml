# hub_cmd control (build_panel_control)
# ESP-NOW-fed (build_panel_data)
# ==================================================================
#  DSC-CONTROL — PACKAGE BODY (firmware v4.0.4, ESP-NOW primary)
#  Flash via stub dsc-control.yaml (local) or
#  homeassistant/esphome/dsc-control.yaml (git-pull).
#  Remote-git safe: no !secret — stub passes credentials + hub_mac / tag.
#  Board: ESP32-2432S028R "Cheap Yellow Display", DUAL-USB variant
#         (micro-USB + USB-C  ->  ST7789 panel, colours inverted)
#  ------------------------------------------------------------------
#  ROLE: touch control panel for the DSC-HUB system. Dual path:
#    * ESP-NOW PRIMARY — vitals/config/soil/names (0xD1–0xD4) in, commands
#      (0xDC) out. Runs with Home Assistant down.
#    * HA API OPTIONAL — OTA, encrypted api link, clock backup. The panel
#      does NOT drive hub entities over HA; the hub is the single source
#      of truth and republishes to this glass over ESP-NOW.
#
#  v0.1 SCOPE (bench build — flash, verify on glass, then iterate):
#    * Tab bar: Pulse / Clone / Main / Control  (design tab order)
#    * PULSE : status pills (WiFi / alert count / CO2e), 3 env cards
#      (2x4 / 4x8 / ROOM), escalation-ladder rungs (fans + appliance
#      w/ live fire-countdown), alert strip with local mute
#    * CLONE + MAIN : banded vitals bars (temp / RH / VPD coloured
#      against the LIVE targets, Follow-4x8 resolved honestly)
#    * CONTROL : Manual Takeover (confirm dialog), Full Auto + Auto
#      Photoperiod toggles, select editors (stage / strategy / clone
#      mode / priority) with Apply/Cancel — nothing that rewrites
#      targets is ever one stray tap away
#    * Night dim on the 4x8 dark window (design: "panel dimmed")
#    * Idle 60s -> screensaver clock; +30s -> backlight off + LVGL
#      paused; tap wakes. RGB LED mirrors alert/demand, dark at night.
#  DEFERRED to v0.2+ (in the v4 design, not this build): per-device
#  manual/power pages, VPD curve editor, plant detail / NPK, 24h
#  charts, tap-challenge unlock.
#
#  BEFORE FLASHING:
#    1. secrets.yaml needs THREE new lines (see runbook):
#       dsc_cyd1_api_key / _ota_password / _ap_password — generate
#       fresh, same discipline as generate-secrets.sh.
#    2. First flash is USB (this device has never been flashed).
#    3. After HA adopts it: Settings -> Devices -> ESPHome -> dsc-cyd1
#       -> CONFIGURE -> tick "Allow the device to perform Home
#       Assistant actions". Without it every control is read-only.
#
#  BENCH-CHECK MATRIX (dual-USB boards vary by batch):
#    * Colours look like a photo negative -> set invert_colors: false.
#      Still wrong -> the panel is ILI9341: swap to model: ILI9341.
#    * Image mirrored / upside down -> flip mirror_x / mirror_y in
#      BOTH display.transform and touchscreen.transform.
#    * Touch offset from target -> recalibrate (see touchscreen note).
# ==================================================================

substitutions:
  name: dsc-control
  friendly_name: DSC-CONTROL
  # ---- ESP-NOW primary link (must match the hub package) ----
  hub_mac: "84:1F:E8:16:E6:60"        # DSC-HUB
  # MUST match dsc-hub-espnow-primary.yaml. Not the default 0xABCD.
  espnow_cmd_tag: "54727"             # 0xD5C7

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    # v4.0.2 — this said "digital_emotions.dsc-hub". Copied in with the
    # rest of the header when the panel was forked from the hub config,
    # and never corrected: ESPHome publishes project.name verbatim, so
    # the dashboard and HA's device page both described DSC-CONTROL as
    # being the DSC HUB. Purely cosmetic, but confusing enough to matter.
    name: "digital_emotions.dsc-control"
    version: "4.0.4"
  on_boot:
    # Seed the 0xDC command seq from hardware RNG so a panel reboot is
    # unlikely to replay the hub's last-seen seq even before the hub's
    # 500 ms dedupe window expires. (Hub also accepts same-seq after gap.)
    - priority: 600
      then:
        - lambda: 'id(cmd_tx_seq) = (uint16_t) esp_random();'

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # ==============================================================
    #  RAM BUDGET (v4.0.2) — see the 26 Jul post-mortems.
    #
    #  v4.0  boot-looped 8x: heap down to 16 bytes during setup(),
    #        mDNS and ESP-NOW both failed to init, first allocation
    #        inside refresh_ui hit std::bad_alloc -> abort().
    #  v4.0.1 fixed BOOT but not RUN. It boots clean and setup()
    #        finishes, then dies 100-240 s later two different ways:
    #        a 768-byte A8 glyph mask fails and the LVGL render loop
    #        hangs until the task watchdog aborts loopTask, or a
    #        300-byte lv_malloc returns NULL and ROM memset stores to
    #        address 0 (StoreProhibited, EXCVADDR 0x0).
    #
    #  Both are the same fault: not enough free DRAM, and a heap
    #  fragmented by continuous LVGL churn. Still NOT a logic fault —
    #  nothing in the control path or the opcode map is wrong.
    # ==============================================================
    advanced:
      # v4.0.2 — sram1_as_iram REMOVED. v4.0.1 billed it as "+40 KB
      # DRAM, the single biggest win". That was wrong, and it is the
      # reason v4.0.1 under-delivered.
      #
      # Read IDF's own linker script (esp_system/ld/esp32/memory.ld.in):
      #     iram0_0_seg len = 0x20000 + SRAM1_IRAM_LEN   (0xA000 when on)
      #     _heap_end = ALIGN(0x40000000 - _sram1_iram_len - 3, 4)
      # and heap/port/esp32/memory_layout.c:
      #     SOC_RESERVE_MEMORY_REGION(&_heap_end, 0x40000000, sram1_iram)
      #
      # The option extends the INSTRUCTION segment by 40 KB and then
      # reserves the matching DRAM alias out of the heap. It can only
      # ever cost DRAM, never add it. Because v4.0 linked fine without
      # it, this app's IRAM already fits the base 0x20000 — so the real
      # recovery from that edit was 0 KB.
      #
      # It also carries an undocumented hazard: it needs a bootloader
      # from IDF v5.1+. A USB flash updates the bootloader, an OTA does
      # NOT — so an OTA onto an old bootloader bricks the boot.
      # Zero benefit, real risk. Gone.
      #
      # This CYD is an ESP32-D0WDQ6 rev 3.1. Declaring it drops the
      # older-silicon compatibility shims from the binary. Kept.
      minimum_chip_revision: "3.1"
    sdkconfig_options:
      # ----------------------------------------------------------
      #  WiFi is the BACKUP path on this panel — ESP-NOW carries all
      #  telemetry and control, and its frames are 48-58 bytes. WiFi
      #  only has to serve the HA API and OTA. So trade WiFi
      #  buffering for heap, hard.
      # ----------------------------------------------------------
      # Kept from v4.0.1 (stock is 10 / 32 / 32). Static RX buffers are
      # ~1.6 KB each of DMA-capable DRAM, allocated at wifi init.
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "4"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "8"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "8"
      # v4.0.2 — block-ack aggregation off. AMPDU exists to push
      # throughput; this panel's WiFi traffic is a trickle of API
      # frames. Each direction keeps a reorder/retry window of
      # full-size buffers alive for the life of the link, and that is
      # the single largest remaining WiFi allocation. Costs OTA speed
      # (a 1.7 MB image takes noticeably longer) and nothing else.
      CONFIG_ESP_WIFI_AMPDU_RX_ENABLED: "n"
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: "n"
      # Management-frame short buffers: stock 32. The panel associates
      # with one AP and stays there.
      CONFIG_ESP_WIFI_MGMT_SBUF_NUM: "8"
      # ----------------------------------------------------------
      #  LWIP. Stock is sized for a device serving many sockets. This
      #  one holds a single HA API connection plus mDNS.
      # ----------------------------------------------------------
      # NB: CONFIG_LWIP_MAX_SOCKETS is deliberately NOT set here.
      # ESPHome auto-sizes it from the components that actually claim
      # sockets (api, ota, mdns) and warns if a hand-set value is too
      # low; the socket pool is a handful of small structs anyway, so
      # there is nothing worth winning and a real risk of exhaustion.
      CONFIG_LWIP_MAX_ACTIVE_TCP: "8"
      CONFIG_LWIP_MAX_LISTENING_TCP: "8"
      # Send buffer and receive window, per connection. Stock 5744
      # (4 x MSS). Halving costs API throughput nobody will notice.
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "2880"
      CONFIG_LWIP_TCP_WND_DEFAULT: "2880"
      # TCP/IP task mailbox: stock 32 pointers deep.
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "16"
      # ----------------------------------------------------------
      #  System
      # ----------------------------------------------------------
      CONFIG_ESP_SYSTEM_EVENT_QUEUE_SIZE: "16"

logger:
  level: INFO

# Required by the free-heap sensors below (RAM RECOVERY, v4.0.1).
debug:
  update_interval: 60s

# Secrets come from the stub as substitutions (remote-git safe).
api:
  encryption:
    key: ${api_key_val}
  # Fleet rule (v2.4.1): never self-reboot because HA went away. A
  # panel with stale data beats a panel mid-boot-loop.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password_val}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  power_save_mode: none          # fleet rule: mains device, no modem naps
  ap:
    ssid: "DSC-CONTROL Fallback"
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        id(wifi_conn) = true;
        // Nest/mesh can hop 2.4 GHz channels under us. ESP-NOW rides the
        // STA channel — a hop that the hub did not also take silently
        // splits the link. Track it so the alert strip can surface it.
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (id(wifi_channel) != 0 && id(wifi_channel) != ch) {
              id(wifi_channel_hopped) = true;
              ESP_LOGW("wifi", "channel hop %d -> %d (ESP-NOW needs hub on same ch)", id(wifi_channel), ch);
            } else {
              ESP_LOGI("wifi", "STA channel %d", ch);
            }
            id(wifi_channel) = ch;
          }
        }
  on_disconnect:
    - lambda: 'id(wifi_conn) = false;'

# RAM RECOVERY (v4.0.1): captive_portal removed. It pulls in the async
# web server + DNS server purely to serve a WiFi-setup page on the
# fallback AP — but this panel's credentials are baked into the
# firmware, so that page could never do anything useful. The `wifi: ap:`
# fallback above is KEPT, so OTA-over-the-fallback-AP still works as a
# recovery path.
# captive_portal:

# ==================================================================
#  ESP-NOW PRIMARY LINK — telemetry in, commands out (to the hub)
#  Receives 0xD1 vitals / 0xD2 config / 0xD3 soil into gv_* globals;
#  the UI reads those (HA-independent). Commands go out via hub_cmd.
#  Coexists with nothing else here — the panel has no other espnow use.
# ==================================================================
espnow:
  auto_add_peer: false
  peers:
    - ${hub_mac}
  on_receive:
    - lambda: |-
        if (size < 2 || data[1] != 0x01) return;
        auto rd = [&](int off) -> float { int16_t v = (int16_t)(data[off] | (data[off+1] << 8)); return v == (int16_t)0x8000 ? NAN : (float) v; };
        uint8_t ty = data[0];
        if (ty == 0xD1 && size >= 36) {
          id(gv_hub_last) = millis();
          id(gv_tent_t)=rd(2)/100.0f; id(gv_clone_t)=rd(4)/100.0f; id(gv_room_t)=rd(6)/100.0f;
          id(gv_tent_rh)=rd(8)/100.0f; id(gv_clone_rh)=rd(10)/100.0f; id(gv_room_rh)=rd(12)/100.0f;
          id(gv_tent_vpd)=rd(14)/100.0f; id(gv_clone_vpd)=rd(16)/100.0f; id(gv_co2)=rd(18);
          id(gv_fan_out)=data[20]; id(gv_fan_recirc)=data[21]; id(gv_fan_imain)=data[22]; id(gv_fan_iclone)=data[23];
          id(gv_sf_pct)=data[24]; id(gv_ramp)=data[25];
          id(gv_stage)=data[26]; id(gv_strat)=data[27]; id(gv_cmode)=data[28]; id(gv_prio)=data[29];
          id(gv_dem)=data[30]; id(gv_mode)=data[31]; id(gv_arm)=data[32]; id(gv_flt)=data[33]; id(gv_coord)=data[34];
          if (size >= 48) for (int i = 0; i < 6; i++) { uint16_t c = data[36+i*2] | (data[37+i*2] << 8); id(gv_cd)[i] = (float) c; }
        } else if (ty == 0xD2 && size >= 56) {
          static const float sc[27] = {100,100,100,100,100, 100,100,100,100,100, 1,1,1,1, 1,100,1,1,1, 100,100,1,1,1,1, 1,1};
          for (int i = 0; i < 27; i++) { float v = rd(2 + i*2); id(gv_cfg)[i] = isnan(v) ? NAN : v / sc[i]; }
        } else if (ty == 0xD3 && size >= 58) {
          static const float ss[7] = {100,10,1,100,1,1,1};
          for (int i = 0; i < 28; i++) { float v = rd(2 + i*2); id(gv_soil)[i] = isnan(v) ? NAN : v / ss[i % 7]; }
        } else if (ty == 0xD4 && size >= 66) {
          // Plant names: 4×16 bytes, null-padded. Canonical store is each
          // pot; hub mirrors from HA and relays here so the soil tab works
          // without the panel talking to HA.
          auto take = [&](int off) -> std::string {
            std::string s;
            s.reserve(16);
            for (int i = 0; i < 16; i++) {
              char c = (char) data[off + i];
              if (c == 0) break;
              s.push_back(c);
            }
            return s;
          };
          id(gv_plant1) = take(2);  id(gv_plant2) = take(18);
          id(gv_plant3) = take(34); id(gv_plant4) = take(50);
        }

time:
  - platform: sntp
    id: sntp_time
    timezone: "Australia/Sydney"
  - platform: homeassistant
    id: ha_time

# ==========================================
#  CYD HARDWARE — dual-USB ESP32-2432S028R
# ==========================================
spi:
  - id: spi_tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  # DUAL-USB CYD: ST7789 panel. CONFIRMED on Chris's board 24 Jul —
  # colours render correct with invert_colors: FALSE (with `true` the
  # whole image came out a photo-negative: black bg -> pale lavender,
  # neon green -> magenta). Model ST7789V is right (text renders sharp,
  # correctly oriented). If a future board negatives again, flip this.
  - platform: ili9xxx
    id: cyd_display
    model: ST7789V
    spi_id: spi_tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    data_rate: 40MHz
    invert_colors: false
    dimensions:
      width: 320
      height: 240
    transform:
      # Landscape, USB ports to the right. Mirrored/upside-down image
      # -> flip these AND touchscreen.transform.
      swap_xy: true
      mirror_x: true
    color_order: bgr
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: GPIO33
    interrupt_pin:
      # GPIO36 is input-only — no internal pull-up. Bare `GPIO36` makes
      # ESP-IDF try gpio_pullup_en and log "GPIO number error".
      number: GPIO36
      mode:
        input: true
        pullup: false
    # Interrupt-driven; do not set update_interval (ESPHome warns if present).
    threshold: 400
    # CALIBRATED 24 Jul from Chris's four-corner taps (pen). Raw ranges
    # measured: x 219-3771, y 384-3852. Corners land square with these.
    calibration:
      x_min: 250
      x_max: 3750
      y_min: 400
      y_max: 3820
    transform:
      # Touch X was mirrored vs the display (taps hit the wrong tab
      # horizontally, Y was already correct) — mirror_x FALSE fixes it.
      # The display panel keeps mirror_x: true; touch + panel disagree on
      # X polarity, which is normal on the CYD.
      swap_xy: true
      mirror_x: false
    on_touch:
      # Calibration dialled 24 Jul — wake-only path; no per-tap UART spam.
      # A first tap while asleep only WAKES (matches the hub's OLED
      # contract — a wake-tap must never also press a button).
      - if:
          condition:
            lambda: 'return id(panel_sleeping);'
          then:
            - script.execute: wake_panel

# --- Outputs: backlight PWM + the 3 onboard RGB-LED channels ---
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000 Hz
  # Onboard RGB LED is common-anode -> each channel inverted.
  - platform: ledc
    pin: GPIO4
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

  # Status LED contract: RED = alert live, AMBER = appliance demand
  # live, dim GREEN = all quiet, OFF = night mode (no stray photons in
  # the grow room's dark period).
  - platform: rgb
    id: status_led
    name: "Status LED"
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF
    effects:
      # Breathing pulse — reused for BOTH the red "issue" state and the
      # optional green "all-OK heartbeat" (colour is set separately; the
      # effect just animates brightness up/down).
      - pulse:
          name: "Breathe"
          transition_length: 0.5s
          update_interval: 0.6s

button:
  - platform: restart
    name: "Restart"

# ==================================================================
#  SENSORS — onboard diagnostics + the hub's HA entity surface.
#  Every HA import is internal: HA already owns these entities;
#  re-exporting them from the panel would twin every one.
# ==================================================================
sensor:
  # RAM RECOVERY (v4.0.1) — free-heap telemetry. This panel ran out of
  # DRAM on its first v4.0 flash; this makes the margin visible in HA
  # instead of only showing up as a boot loop. Healthy after the fix is
  # tens of KB. If this ever trends below ~15 KB, stop adding widgets.
  # v4.0.2 — these two sensors shipped in v4.0.1 and were INVISIBLE in the
  # serial log. The `debug` platform logs its readings at DEBUG level, and
  # the global level is INFO, so they were dropped before reaching the
  # console — which is why the entire 26 Jul crash log contains not one
  # heap number despite the diagnostics having shipped the day before.
  # `logger: logs: {debug: DEBUG}` does NOT fix that: ESPHome refuses a
  # per-tag level more verbose than the global one ("must not be less
  # severe than the global log level"), and turning the whole log to DEBUG
  # on a panel that is crashing from heap pressure floods the console and
  # costs the very RAM being measured. So the reading is re-emitted at
  # INFO from on_value instead. One line a minute, always in the log.
  - platform: debug
    free:
      name: "Panel Free Heap"
      id: panel_free_heap
      entity_category: diagnostic
      on_value:
        - lambda: |-
            // Largest-free-block matters as much as free-total here. The two
            // crashes on 26 Jul were a 768 B and a 300 B request failing while
            // the heap still had usable bytes in it — fragmentation, not
            // capacity. If this line ever starts printing LOW, the panel is
            // back in the state that produced them.
            float blk = id(panel_free_block).state;
            if (isnan(blk))            ESP_LOGI("heap", "free=%.0f B  largest_block=(pending)", x);
            else if (blk < 12000.0f)   ESP_LOGW("heap", "LOW  free=%.0f B  largest_block=%.0f B  <- LVGL draw buffers start failing near here", x, blk);
            else                       ESP_LOGI("heap", "free=%.0f B  largest_block=%.0f B", x, blk);
    block:
      name: "Panel Largest Free Block"
      id: panel_free_block
      entity_category: diagnostic
  # onboard LDR (CdS on GPIO34) — logged for a future auto-dim pass
  - platform: adc
    pin: GPIO34
    id: ldr_raw
    name: "Ambient Light (raw)"
    attenuation: 12db
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  # Battery stub: GPIO35 is input-only (ADC1_CH7). Wire the pack through a
  # 2:1 divider (e.g. 2×100k) into GPIO35. Until that hardware exists the pin
  # floats, so the UI battery chip stays hidden unless batt_v reads a
  # plausible pack voltage (see refresh_ui). Divider ratio lives in the filter.
  - platform: adc
    pin: GPIO35
    id: batt_v
    attenuation: 12db
    update_interval: 10s
    internal: true
    filters:
      - multiply: 2.0        # undo the 2:1 divider -> pack volts (tune to your resistors)

  # --- environment ---
  - platform: template
    id: clone_temp
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_clone_t);'
  - platform: template
    id: clone_rh
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_clone_rh);'
  - platform: template
    id: clone_vpd
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_clone_vpd);'
  - platform: template
    id: main_temp
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_tent_t);'
  - platform: template
    id: main_rh
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_tent_rh);'
  - platform: template
    id: main_vpd
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_tent_vpd);'
  - platform: template
    id: room_temp
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_room_t);'
  - platform: template
    id: room_rh
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_room_rh);'
  - platform: template
    id: co2_ppm
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_co2);'

  # --- live targets (band colouring reads THESE, never baked numbers) ---
  - platform: template
    id: t_main_temp
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[0];'
  - platform: template
    id: t_main_vpd_min
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[1];'
  - platform: template
    id: t_main_vpd_max
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[2];'
  - platform: template
    id: t_main_rh_min
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[3];'
  - platform: template
    id: t_main_rh_max
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[4];'
  - platform: template
    id: t_clone_temp
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[5];'
  - platform: template
    id: t_clone_vpd_min
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[6];'
  - platform: template
    id: t_clone_vpd_max
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[7];'
  - platform: template
    id: t_clone_rh_min
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[8];'
  - platform: template
    id: t_clone_rh_max
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[9];'
  - platform: template
    id: sf_target
    internal: true
    update_interval: 1s
    lambda: 'return id(gv_cfg)[10];'

  # --- fan speeds (percentage attribute) + SF1000 brightness ---
  - platform: template
    id: fan_out_pct
    internal: true
    update_interval: 1s
    lambda: 'return (float)id(gv_fan_out);'
  - platform: template
    id: fan_recirc_pct

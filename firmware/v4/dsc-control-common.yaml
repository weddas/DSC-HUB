# ==================================================================
#  SCRIPTS
# ==================================================================
script:
  # ---- send a command to the hub: {0xDC,ver,op,flags,i32 val,u16 tag,u16 seq} ----
  # Starting-page progress — status + lean bar only (no cards/icons).
  # Call after setting id(boot_msg); safe before boot_ui_ready.
  - id: boot_paint
    parameters:
      pct: int
    then:
      - lambda: |-
          int p = pct;
          if (p < 0) p = 0;
          if (p > 100) p = 100;
          lv_bar_set_value(id(boot_bar), p, LV_ANIM_OFF);
          const char* m = id(boot_msg).c_str();
          if (m == nullptr || m[0] == '\0') m = "...";
          const char* cur = lv_label_get_text(id(lbl_boot_status));
          if (cur == nullptr || strcmp(cur, m) != 0)
            lv_label_set_text(id(lbl_boot_status), m);
          char b[8];
          snprintf(b, sizeof(b), "%d%%", p);
          cur = lv_label_get_text(id(lbl_boot_pct));
          if (cur == nullptr || strcmp(cur, b) != 0)
            lv_label_set_text(id(lbl_boot_pct), b);

  # UI control actions call this instead of homeassistant.action. Float values
  # are passed pre-scaled by ×100 (e.g. 24.5 °C -> op 30, val 2450).
  # v5.1.4: pend_* + write-through gv_* ONLY — no lv_label_set_text under the
  # tap (Full Auto / Modes letter-draw crashes). ui_dirty lets the 200 ms
  # drain paint grey via refresh_ui once the indev stack is clear.
  # Prefer hub's Nest AP (from 0xD0). Runs during Starting before full GUI.
  - id: adopt_hub_wifi_ap
    mode: single
    then:
      - lambda: |-
          if (!id(hub_ap_bssid_ok)) return;
          auto *w = wifi::global_wifi_component;
          if (w == nullptr || !w->is_connected()) return;
          wifi::bssid_t want{};
          for (int i = 0; i < 6; i++) want[i] = id(hub_ap_bssid)[i];
          w->set_sta_priority(want, 127);
          auto cur = w->wifi_bssid();
          bool same = true;
          for (int i = 0; i < 6; i++) if (cur[i] != want[i]) { same = false; break; }
          if (same) {
            ESP_LOGI("wifi", "Already on hub Nest AP %02X:%02X:%02X:%02X:%02X:%02X",
                     want[0], want[1], want[2], want[3], want[4], want[5]);
            return;
          }
          static uint32_t last_adopt_ms = 0;
          if (last_adopt_ms != 0 && (millis() - last_adopt_ms) < 60000u) return;
          if (id(link_rec_wifi_bounces) >= 3) return;
          last_adopt_ms = millis();
          id(link_rec_wifi_bounces) = id(link_rec_wifi_bounces) + 1;
          ESP_LOGW("wifi", "Adopting hub Nest AP %02X:%02X:%02X:%02X:%02X:%02X — WiFi bounce #%d",
                   want[0], want[1], want[2], want[3], want[4], want[5],
                   id(link_rec_wifi_bounces));
          id(link_wifi_bounce).execute();

  # WiFi bounce rebinds HA API TCP and re-associates (prefers wifi_bssid / hub AP).
  - id: link_wifi_bounce
    mode: single
    then:
      - wifi.disable:
      - delay: 3s
      - wifi.enable:
      - delay: 8s
      - lambda: 'ESP_LOGI("link", "WiFi bounce complete — waiting for hub ESP-NOW");'

  - id: link_recovery_reboot
    mode: single
    then:
      - delay: 250ms
      - lambda: 'App.safe_reboot();'

  # ================================================================
  #  FLEET FIX (v5.1.16) — hold "Fleet Fix" on Connections >=1.5s.
  #  Pins the glass on page_boot (refresh_ui bails via fix_active) and
  #  drives status ONLY through boot_msg + boot_paint — never the tab
  #  UI — while it walks the fleet in order: Hub -> Control (self) ->
  #  Pot1 -> Pot2 -> Pot3 -> Pot4. Each device gets up to 5 tries; one
  #  that never comes good is recorded in fix_skip_mask and the run
  #  moves on (no device can block the others). Soft heal only: Hub
  #  and the pots are pure wait-for-vitals (nothing this panel can
  #  push to them over ESP-NOW); self additionally gets a WiFi bounce
  #  between tries. NO hub reboot from glass, ever. Every string here
  #  is ASCII (no "…"/"–"/"→") — cyd_glyphs.yaml is a safety net, not
  #  the plan.
  # ================================================================
  - id: fleet_fix_run
    mode: single
    then:
      - lambda: |-
          if (id(fix_active)) return;   // belt & suspenders vs mode: single
          id(fix_active) = true;
          id(fix_phase) = 0;
          id(fix_skip_mask) = 0;
          id(fix_try_count) = 0;
          id(fix_msg) = "fleet fix starting...";
          id(boot_msg) = id(fix_msg);
          for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in)) {
            if (lv_indev_get_type(in) == LV_INDEV_TYPE_POINTER) lv_indev_wait_release(in);
          }
          lv_obj_add_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(alert_screen), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(tabbar), LV_OBJ_FLAG_HIDDEN);
      - lvgl.page.show: page_boot
      - script.execute: {id: boot_paint, pct: 2}
      - delay: 150ms

      # ---- 1: HUB — pure wait; hub already beats 0xD0 every 5s / vitals
      # every 2s regardless of this panel, and it is never rebooted from
      # here. ----
      - lambda: 'id(fix_phase) = 1; id(fix_try_count) = 0; id(fix_dev_ok) = id(gv_hub_last) != 0 && (millis() - id(gv_hub_last)) < 6000u;'
      - repeat:
          count: 5
          then:
            - if:
                condition: {lambda: 'return !id(fix_dev_ok);'}
                then:
                  - lambda: |-
                      id(fix_try_count)++;
                      char m[48];
                      snprintf(m, sizeof(m), "polling Nest - hub - try %d/5...", id(fix_try_count));
                      id(fix_msg) = m; id(boot_msg) = id(fix_msg);
                  - script.execute: {id: boot_paint, pct: 6}
                  - delay: 2500ms
                  - lambda: 'id(fix_dev_ok) = id(gv_hub_last) != 0 && (millis() - id(gv_hub_last)) < 6000u;'
      - lambda: |-
          if (!id(fix_dev_ok)) { id(fix_skip_mask) |= 1; id(fix_msg) = "hub skipped after 5 fails"; }
          else id(fix_msg) = "hub - linked";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 14}
      - delay: 300ms

      # ---- 2: CONTROL (self) — the one device this panel can actually
      # heal: bounce WiFi between tries. ----
      - lambda: 'id(fix_phase) = 2; id(fix_try_count) = 0; id(fix_dev_ok) = id(wifi_conn);'
      - repeat:
          count: 5
          then:
            - if:
                condition: {lambda: 'return !id(fix_dev_ok);'}
                then:
                  - lambda: |-
                      id(fix_try_count)++;
                      char m[48];
                      snprintf(m, sizeof(m), "control (self) - try %d/5 - bounce", id(fix_try_count));
                      id(fix_msg) = m; id(boot_msg) = id(fix_msg);
                  - script.execute: {id: boot_paint, pct: 18}
                  - wifi.disable:
                  - delay: 1500ms
                  - wifi.enable:
                  - wait_until:
                      condition: {lambda: 'return id(wifi_conn);'}
                      timeout: 6s
                  - lambda: 'id(fix_dev_ok) = id(wifi_conn);'
      - lambda: |-
          if (!id(fix_dev_ok)) { id(fix_skip_mask) |= 2; id(fix_msg) = "control skipped after 5 fails"; }
          else id(fix_msg) = "control (self) - linked";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 30}
      - delay: 300ms

      # ---- 3-6: POT1..4 — pure wait on the hub-relayed link bit (0xD1
      # gv_coord bits 2..5). This panel has no command that can reconnect
      # a pot; ESP-NOW vitals recovering is the only signal available. ----
      - lambda: 'id(fix_phase) = 3; id(fix_try_count) = 0; id(fix_dev_ok) = (id(gv_coord) >> 2) & 1;'
      - repeat:
          count: 5
          then:
            - if:
                condition: {lambda: 'return !id(fix_dev_ok);'}
                then:
                  - lambda: |-
                      id(fix_try_count)++;
                      char m[48];
                      snprintf(m, sizeof(m), "waiting pot1 - try %d/5 - vitals...", id(fix_try_count));
                      id(fix_msg) = m; id(boot_msg) = id(fix_msg);
                  - script.execute: {id: boot_paint, pct: 34}
                  - delay: 2500ms
                  - lambda: 'id(fix_dev_ok) = (id(gv_coord) >> 2) & 1;'
      - lambda: |-
          if (!id(fix_dev_ok)) { id(fix_skip_mask) |= 4; id(fix_msg) = "pot1 skipped after 5 fails"; }
          else id(fix_msg) = "pot1 - linked";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 42}

      - lambda: 'id(fix_phase) = 4; id(fix_try_count) = 0; id(fix_dev_ok) = (id(gv_coord) >> 3) & 1;'
      - repeat:
          count: 5
          then:
            - if:
                condition: {lambda: 'return !id(fix_dev_ok);'}
                then:
                  - lambda: |-
                      id(fix_try_count)++;
                      char m[48];
                      snprintf(m, sizeof(m), "waiting pot2 - try %d/5 - vitals...", id(fix_try_count));
                      id(fix_msg) = m; id(boot_msg) = id(fix_msg);
                  - script.execute: {id: boot_paint, pct: 46}
                  - delay: 2500ms
                  - lambda: 'id(fix_dev_ok) = (id(gv_coord) >> 3) & 1;'
      - lambda: |-
          if (!id(fix_dev_ok)) { id(fix_skip_mask) |= 8; id(fix_msg) = "pot2 skipped after 5 fails"; }
          else id(fix_msg) = "pot2 - linked";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 56}

      - lambda: 'id(fix_phase) = 5; id(fix_try_count) = 0; id(fix_dev_ok) = (id(gv_coord) >> 4) & 1;'
      - repeat:
          count: 5
          then:
            - if:
                condition: {lambda: 'return !id(fix_dev_ok);'}
                then:
                  - lambda: |-
                      id(fix_try_count)++;
                      char m[48];
                      snprintf(m, sizeof(m), "waiting pot3 - try %d/5 - vitals...", id(fix_try_count));
                      id(fix_msg) = m; id(boot_msg) = id(fix_msg);
                  - script.execute: {id: boot_paint, pct: 60}
                  - delay: 2500ms
                  - lambda: 'id(fix_dev_ok) = (id(gv_coord) >> 4) & 1;'
      - lambda: |-
          if (!id(fix_dev_ok)) { id(fix_skip_mask) |= 16; id(fix_msg) = "pot3 skipped after 5 fails"; }
          else id(fix_msg) = "pot3 - linked";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 70}

      - lambda: 'id(fix_phase) = 6; id(fix_try_count) = 0; id(fix_dev_ok) = (id(gv_coord) >> 5) & 1;'
      - repeat:
          count: 5
          then:
            - if:
                condition: {lambda: 'return !id(fix_dev_ok);'}
                then:
                  - lambda: |-
                      id(fix_try_count)++;
                      char m[48];
                      snprintf(m, sizeof(m), "waiting pot4 - try %d/5 - vitals...", id(fix_try_count));
                      id(fix_msg) = m; id(boot_msg) = id(fix_msg);
                  - script.execute: {id: boot_paint, pct: 74}
                  - delay: 2500ms
                  - lambda: 'id(fix_dev_ok) = (id(gv_coord) >> 5) & 1;'
      - lambda: |-
          if (!id(fix_dev_ok)) { id(fix_skip_mask) |= 32; id(fix_msg) = "pot4 skipped after 5 fails"; }
          else id(fix_msg) = "pot4 - linked";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 84}
      - delay: 300ms

      # ---- 7: SUCCESS GATE — preferred-AP match (if one is known),
      # fresh hub beat, a valid clock, and every non-skipped pot still OK.
      # "Success" needs zero skips too; any skip reports "Done - skipped
      # <list>" even if the gate itself would otherwise pass. ----
      - lambda: |-
          id(fix_phase) = 7;
          id(fix_msg) = "checking success gate...";
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 90}
      - delay: 300ms
      - lambda: |-
          bool pref_ok = true;
          if (id(hub_ap_bssid_ok)) {
            auto *w = wifi::global_wifi_component;
            pref_ok = false;
            if (w != nullptr && w->is_connected()) {
              auto b = w->wifi_bssid();
              pref_ok = true;
              for (int i = 0; i < 6; i++) if (b[i] != id(hub_ap_bssid)[i]) { pref_ok = false; break; }
            }
          }
          bool hub_ok = id(gv_hub_last) != 0 && (millis() - id(gv_hub_last)) < 30000u;
          bool clk_ok = id(sntp_time).now().is_valid() || id(ha_time).now().is_valid();
          bool pots_ok = true;
          for (int i = 0; i < 4; i++) {
            if (!(id(fix_skip_mask) & (4 << i)) && !((id(gv_coord) >> (2 + i)) & 1)) pots_ok = false;
          }
          bool gate_clear = pref_ok && hub_ok && clk_ok && pots_ok;
          bool success = gate_clear && id(fix_skip_mask) == 0;
          char skiplist[48] = "";
          static const char* NAMES[6] = {"hub","control","pot1","pot2","pot3","pot4"};
          for (int i = 0; i < 6; i++) {
            if (id(fix_skip_mask) & (1 << i)) {
              if (skiplist[0]) strncat(skiplist, ",", sizeof(skiplist) - strlen(skiplist) - 1);
              strncat(skiplist, NAMES[i], sizeof(skiplist) - strlen(skiplist) - 1);
            }
          }
          char m[80];
          if (success) snprintf(m, sizeof(m), "Success");
          else if (id(fix_skip_mask) != 0) snprintf(m, sizeof(m), "Done - skipped %s", skiplist);
          else snprintf(m, sizeof(m), "Done - gate not clear");
          id(fix_msg) = m;
          id(boot_msg) = id(fix_msg);
      - script.execute: {id: boot_paint, pct: 100}
      - lambda: 'id(fix_phase) = 8;'
      - delay: 2200ms

      # ---- done: hand the glass back to Connections ----
      - lambda: |-
          id(fix_active) = false;
          id(fix_phase) = 0;
          id(touch_guard_until) = millis() + 500;
          lv_obj_clear_flag(id(tabbar), LV_OBJ_FLAG_HIDDEN);
      - script.execute: show_active_tab
      - script.execute: open_connections

  # BUG-FIX 2026-08-02: presence keepalive (op 58). The hub times panel
  # liveness (panel_last_ms) from 0xDC RX only, and the panel only sends
  # 0xDC on user commands — so an idle glass went "silent" after ~90s and
  # falsely drove the hub's WiFi-bounce ladder. Dedicated script (not
  # hub_cmd) so a background beat never touches touch_guard/ui_dirty.
  - id: hub_keepalive
    mode: single
    then:
      - espnow.send:
          address: ${hub_mac}
          wait_for_sent: false
          data: !lambda |-
            std::vector<uint8_t> p(12, 0);
            p[0]=0xDC; p[1]=0x01; p[2]=58; p[3]=0;
            uint16_t tg=(uint16_t) ${espnow_cmd_tag}; p[8]=tg&0xFF; p[9]=(tg>>8)&0xFF;
            uint16_t sq=id(cmd_tx_seq)++; p[10]=sq&0xFF; p[11]=(sq>>8)&0xFF;
            return p;

  # ---- RF status card (0xD5), every 10s while WiFi is up (v5.1.16) ----
  # {0xD5,0x01,role=1(control),assoc[6],pref[6],ch,rssi_u8,status}.
  # assoc = current associated BSSID (zeros if not connected). pref =
  # the hub's learned Nest BSSID (hub_ap_bssid from 0xD0), zeros if
  # never learned — this panel has no NVS "preferred AP" of its own.
  # rssi_u8 = |RSSI| clamped 0-255 (dBm is always <=0 here). status
  # bits: 0 wifi up, 1 clock valid, 2 have preferred AP, 3 fix_active.
  - id: tx_rf_card
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(wifi_conn);'
          then:
            - espnow.send:
                address: ${hub_mac}
                wait_for_sent: false
                data: !lambda |-
                  std::vector<uint8_t> p(18, 0);
                  p[0]=0xD5; p[1]=0x01; p[2]=1;
                  auto *w = wifi::global_wifi_component;
                  int rssi = 0;
                  if (w != nullptr && w->is_connected()) {
                    auto b = w->wifi_bssid();
                    for (int i = 0; i < 6; i++) p[3+i] = b[i];
                    rssi = (int) w->wifi_rssi();
                  }
                  if (id(hub_ap_bssid_ok)) {
                    for (int i = 0; i < 6; i++) p[9+i] = id(hub_ap_bssid)[i];
                  }
                  p[15] = (uint8_t) (id(wifi_channel) < 0 ? 0 : (id(wifi_channel) > 255 ? 255 : id(wifi_channel)));
                  p[16] = (uint8_t) (rssi < 0 ? (-rssi > 255 ? 255 : -rssi) : 0);
                  uint8_t status = 1;   // gated by the if above -> wifi is up
                  if (id(clock_valid)) status |= 2;
                  if (id(hub_ap_bssid_ok)) status |= 4;
                  if (id(fix_active)) status |= 8;
                  p[17] = status;
                  return p;

  - id: hub_cmd
    parameters:
      op: int
      val: int
    then:
      - lambda: |-
          auto bitset = [](int& word, int bit, int on){
            if (on) word |= (1 << bit); else word &= ~(1 << bit);
          };
          // Hello (57) is presence-only — no optimistic UI pending.
          if (op != 57 && op >= 0 && op < 64) {
            id(pend_val)[op] = val;
            id(pend_ms)[op] = millis();
          }
          // Write-through so the next tap steps from the pending value.
          switch (op) {
            case 1: { int m=id(gv_mode); bitset(m,0,val); id(gv_mode)=m; break; }
            case 3: { int m=id(gv_mode); bitset(m,4,val); id(gv_mode)=m; break; }
            case 4: { int m=id(gv_mode); bitset(m,3,val); id(gv_mode)=m; break; }
            case 5: { int m=id(gv_mode); bitset(m,2,val); id(gv_mode)=m; break; }
            case 12: { int d=id(gv_dem); bitset(d,0,val); id(gv_dem)=d; break; }
            case 13: { int d=id(gv_dem); bitset(d,1,val); id(gv_dem)=d; break; }
            case 14: { int d=id(gv_dem); bitset(d,2,val); id(gv_dem)=d; break; }
            case 15: { int d=id(gv_dem); bitset(d,3,val); id(gv_dem)=d; break; }
            case 16: { int d=id(gv_dem); bitset(d,4,val); id(gv_dem)=d; break; }
            case 17: { int d=id(gv_dem); bitset(d,5,val); id(gv_dem)=d; break; }
            case 18: { int c=id(gv_coord); bitset(c,0,val); id(gv_coord)=c; break; }
            case 19: { int c=id(gv_coord); bitset(c,1,val); id(gv_coord)=c; break; }
            case 20: id(gv_stage) = val; break;
            case 21: id(gv_strat) = val; break;
            case 22: id(gv_cmode) = val; break;
            case 23:
              if (val) id(gv_coord) |= 64; else id(gv_coord) &= ~64;
              break;
            case 24: id(gv_prio) = val; break;
            case 25: id(gv_fan_out) = val; break;
            case 26: id(gv_fan_recirc) = val; break;
            case 27: id(gv_fan_imain) = val; break;
            case 28: id(gv_fan_iclone) = val; break;
            case 29: id(gv_sf_pct) = val; id(gv_cfg)[10] = (float) val; break;
            case 30: id(gv_cfg)[0] = val / 100.0f; break;
            case 31: id(gv_cfg)[1] = val / 100.0f; break;
            case 32: id(gv_cfg)[2] = val / 100.0f; break;
            case 33: id(gv_cfg)[3] = val / 100.0f; break;
            case 34: id(gv_cfg)[4] = val / 100.0f; break;
            case 35: id(gv_cfg)[11] = (float) val; break;
            case 36: id(gv_cfg)[12] = (float) val; break;
            case 37: id(gv_cfg)[5] = val / 100.0f; break;
            case 38: id(gv_cfg)[6] = val / 100.0f; break;
            case 39: id(gv_cfg)[7] = val / 100.0f; break;
            case 40: id(gv_cfg)[8] = val / 100.0f; break;
            case 41: id(gv_cfg)[9] = val / 100.0f; break;
            case 42: id(gv_cfg)[13] = (float) val; break;
            case 43: id(gv_cfg)[14] = (float) val; id(gv_ramp) = val; break;
            case 44: id(gv_cfg)[15] = val / 100.0f; break;
            case 45: id(gv_cfg)[16] = (float) val; break;
            case 46: id(gv_cfg)[17] = (float) val; break;
            case 47: id(gv_cfg)[18] = (float) val; break;
            case 48: id(gv_cfg)[19] = val / 100.0f; break;
            case 49: id(gv_cfg)[20] = val / 100.0f; break;
            case 50: id(gv_cfg)[21] = (float) val; break;
            case 51: id(gv_cfg)[22] = (float) val; break;
            case 52: id(gv_cfg)[23] = (float) val; break;
            case 53: id(gv_cfg)[24] = (float) val; break;
            default: break;
          }
          id(touch_guard_until) = millis() + 450;
          id(ui_dirty) = true;
      - espnow.send:
          # Lab uses stub ${hub_mac}. Kit SoftAP builds override via fleet
          # package lambdas only when provisioning is enabled — do not call
          # id(fleet_setup) here or lab must link web_server_base (CYD OOM).
          address: ${hub_mac}
          wait_for_sent: false
          data: !lambda |-
            std::vector<uint8_t> p(12, 0);
            p[0]=0xDC; p[1]=0x01; p[2]=(uint8_t) op; p[3]=0;
            uint32_t uv=(uint32_t) val; p[4]=uv&0xFF; p[5]=(uv>>8)&0xFF; p[6]=(uv>>16)&0xFF; p[7]=(uv>>24)&0xFF;
            uint16_t tg=(uint16_t) ${espnow_cmd_tag}; p[8]=tg&0xFF; p[9]=(tg>>8)&0xFF;
            uint16_t sq=id(cmd_tx_seq)++; p[10]=sq&0xFF; p[11]=(sq>>8)&0xFF;
            return p;

  # ---- swipe navigation: show the page for active_tab (0..4) ----
  # active_tab is set FIRST (clamped), then this shows the matching page
  # with independent ifs (no mutation mid-chain), so exactly one fires.
  - id: show_active_tab
    then:
      - if: {condition: {lambda: 'return id(active_tab) == 0;'}, then: [{lvgl.page.show: page_pulse}]}
      - if: {condition: {lambda: 'return id(active_tab) == 1;'}, then: [{lvgl.page.show: page_clone}]}
      - if: {condition: {lambda: 'return id(active_tab) == 2;'}, then: [{lvgl.page.show: page_main}]}
      - if: {condition: {lambda: 'return id(active_tab) == 3;'}, then: [{lvgl.page.show: page_soil}]}
      - if: {condition: {lambda: 'return id(active_tab) == 4;'}, then: [{lvgl.page.show: page_control}]}
      - lambda: |-
          id(ui_soil_detail) = false;
          id(ui_ladder_detail) = false;
          id(ui_vpd_editor) = false;
          id(ui_power_detail) = false;
      - script.execute: restyle_tabs
      - script.execute: refresh_ui
  - id: tab_next
    then:
      - lambda: 'if (id(active_tab) < 4) id(active_tab)++;'
      - script.execute: show_active_tab
  - id: tab_prev
    then:
      - lambda: 'if (id(active_tab) > 0) id(active_tab)--;'
      - script.execute: show_active_tab

  # highlight the active tab
  - id: restyle_tabs
    then:
      - lambda: |-
          lv_color_t on = lv_color_hex(0x00E676), off = lv_color_hex(0x5A6472);
          auto S = [&](lv_obj_t* ic, bool a) { lv_obj_set_style_text_color(ic, a ? on : off, 0); };
          int t = id(active_tab);
          S(id(tab_ic0), t == 0);
          S(id(tab_ic1), t == 1);
          S(id(tab_ic2), t == 2);
          S(id(tab_ic3), t == 3);
          S(id(tab_ic4), t == 4);

  # ---- connections screen ----
  - id: open_connections
    then:
      - lambda: 'lv_obj_clear_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: refresh_ui
  - id: close_connections
    then:
      - lambda: 'lv_obj_add_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);'

  - id: open_alerts
    then:
      - lambda: 'lv_obj_clear_flag(id(alert_screen), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: refresh_ui
  - id: close_alerts
    then:
      - lambda: 'lv_obj_add_flag(id(alert_screen), LV_OBJ_FLAG_HIDDEN);'

  # ---- screen lock: hold-to-lock / hold-to-unlock (v5.1.2) ----
  # Lock-begin only from lock_arm (lock_hit). Unlock from the overlay itself.
  # At 3s: set *_pending only — never hide/show overlay mid-press.
  # HUD show is deferred off the indev stack (delay in hold_begin).
  - id: hold_begin
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (id(lock_engaged)) {
                if (lv_obj_has_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN))
                  return false;
                id(holding) = true;
                id(hold_start) = millis();
                return true;
              }
              if (!id(lock_arm)) return false;
              id(holding) = true;
              id(hold_start) = millis();
              return true;
          then:
            - delay: 250ms
            - lambda: |-
                // Runs after the press callback returns — safe to mutate LVGL.
                if (!id(holding)) return;
                if (lv_obj_has_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN)) {
                  bool unlocking = id(lock_engaged);
                  const char* hint = unlocking ? "UNLOCKING" : "LOCKING";
                  if (strcmp(lv_label_get_text(id(hud_hint)), hint) != 0)
                    lv_label_set_text(id(hud_hint), hint);
                  lv_bar_set_value(id(hud_bar), 0, LV_ANIM_OFF);
                  lv_obj_clear_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);
                }

  - id: hold_tick
    mode: single
    then:
      - lambda: |-
          if (!id(holding)) return;
          const uint32_t HOLD_MS = 3000;
          uint32_t el = millis() - id(hold_start);
          if (el > HOLD_MS) el = HOLD_MS;
          // Bar only once HUD is visible (shown by deferred hold_begin).
          if (!lv_obj_has_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN)) {
            int bar = (int)((float) el / HOLD_MS * 100.0f);
            if ((int) lv_bar_get_value(id(hud_bar)) != bar)
              lv_bar_set_value(id(hud_bar), bar, LV_ANIM_OFF);
          }
          if (el < HOLD_MS) return;
          // Commit flags only — hide HUD / overlay after release (hold_finish).
          id(holding) = false;
          if (id(lock_engaged)) id(unlock_pending) = true;
          else id(lock_pending) = true;
          id(lock_arm) = false;

  - id: hold_cancel
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              id(lock_arm) = false;
              if (!id(holding)) return false;
              id(holding) = false;
              return true;
          then:
            - delay: 100ms
            - lambda: 'lv_obj_add_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);'

  - id: hold_finish
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(unlock_pending) || id(lock_pending);'
          then:
            - delay: 350ms
            - lambda: |-
                lv_obj_add_flag(id(hold_hud), LV_OBJ_FLAG_HIDDEN);
                if (id(unlock_pending)) {
                  id(unlock_pending) = false;
                  id(lock_engaged) = false;
                  id(bl_last) = -1;   // force backlight recompute (night vs day)
                  lv_obj_add_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN);
                } else if (id(lock_pending)) {
                  id(lock_pending) = false;
                  id(lock_engaged) = true;
                  lv_obj_clear_flag(id(lock_overlay), LV_OBJ_FLAG_HIDDEN);
                }
                id(lock_arm) = false;
                id(touch_guard_until) = millis() + 400;
                for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in)) {
                  if (lv_indev_get_type(in) == LV_INDEV_TYPE_POINTER)
                    lv_indev_wait_release(in);
                }
                // Coalesce tab paint — never full refresh_ui on the release path.
                id(ui_dirty) = true;
          else:
            - script.execute: hold_cancel

  # ---- tap-challenge gate: show confirm, then Engage sends hub_cmd ----
  - id: open_gate
    parameters:
      op: int
      val: int
      kind: int
    then:
      - lambda: |-
          id(gate_op) = op;
          id(gate_val) = val;
          if (kind == 0) {
            lv_label_set_text(id(gate_title), "Manual Takeover");
            lv_label_set_text(id(gate_body), "You will drive every output\nfrom HA. Safety stays armed.");
          } else {
            lv_label_set_text(id(gate_title), "Confirm demand");
            lv_label_set_text(id(gate_body), "Toggle this appliance demand?\nTap Engage to send.");
          }
          lv_obj_clear_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);

  - id: gate_confirm
    then:
      - script.execute:
          id: hub_cmd
          op: !lambda 'return id(gate_op);'
          val: !lambda 'return id(gate_val);'
      - lambda: 'lv_obj_add_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);'

  - id: open_power_detail
    parameters:
      dev: int
      ret: int
    then:
      - lambda: |-
          id(power_detail_dev) = dev;
          id(power_detail_return) = ret;
          id(ui_power_detail) = true;
          if (ret == 0) id(ui_ladder_detail) = false;
      - lvgl.page.show: page_power_detail
      - script.execute: refresh_ui

  - id: power_detail_back
    then:
      - lambda: |-
          int r = id(power_detail_return);
          id(ui_power_detail) = false;
          if (r == 0) id(ui_ladder_detail) = true;
          else if (r == 1) id(active_tab) = 1;
          else if (r == 2) id(active_tab) = 2;
      - if:
          condition:
            lambda: 'return id(power_detail_return) == 0;'
          then:
            - lvgl.page.show: page_ladder_detail
          else:
            - if:
                condition:
                  lambda: 'return id(power_detail_return) == 1;'
                then:
                  - lvgl.page.show: page_clone
                else:
                  - lvgl.page.show: page_main
      - script.execute: refresh_ui

  - id: pwr_fan_step
    parameters:
      delta: int
    then:
      - if:
          condition:
            lambda: 'return id(power_detail_dev) == 0;'
          then:
            - script.execute:
                id: hub_cmd
                op: 25
                val: !lambda 'int v = id(gv_fan_out) + delta; if (v < 0) v = 0; if (v > 100) v = 100; return v;'
      - if:
          condition:
            lambda: 'return id(power_detail_dev) == 1;'
          then:
            - script.execute:
                id: hub_cmd
                op: 26
                val: !lambda 'int v = id(gv_fan_recirc) + delta; if (v < 0) v = 0; if (v > 100) v = 100; return v;'
      - if:
          condition:
            lambda: 'return id(power_detail_dev) == 2;'
          then:
            - script.execute:
                id: hub_cmd
                op: 27
                val: !lambda 'int v = id(gv_fan_imain) + delta; if (v < 0) v = 0; if (v > 100) v = 100; return v;'
      - if:
          condition:
            lambda: 'return id(power_detail_dev) == 3;'
          then:
            - script.execute:
                id: hub_cmd
                op: 28
                val: !lambda 'int v = id(gv_fan_iclone) + delta; if (v < 0) v = 0; if (v > 100) v = 100; return v;'

  - id: pwr_toggle_demand
    then:
      - lambda: |-
          int d = id(power_detail_dev) - 4;
          static const int OPS[6] = {12, 13, 14, 16, 15, 17};
          static const int MASK[6] = {1, 2, 4, 16, 8, 32};
          if (d < 0 || d > 5) return;
          id(gate_op) = OPS[d];
          id(gate_val) = (id(gv_dem) & MASK[d]) ? 0 : 1;
          lv_label_set_text(id(gate_title), "Confirm demand");
          lv_label_set_text(id(gate_body), "Toggle this appliance demand?\nTap Engage to send.");
          lv_obj_clear_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);

  # -------- the refresh engine (v4.0.11) --------
  # Page-gated: only touch widgets on the visible tab/overlay. Lock
  # short-circuits after backlight/clock. Cadence is 5 s (see interval).
  # Avoid std::string in the hot path — A8 glyph churn is what WDT'd 4.0.9.
  - id: refresh_ui
    mode: single
    then:
      - lambda: |-
          if (!id(boot_ui_ready)) return;
          // Fleet Fix owns the glass exclusively while it runs — never
          // paint Pulse/Connections/etc underneath it (boot_msg + boot_paint
          // drive the screen instead; see fleet_fix_run).
          if (id(fix_active)) return;
          const uint32_t NEON=0x00E676, AMBER=0xFFAA00, RED=0xF44336, CYAN=0x00BCD4,
                         GREY=0x5A6472, WHITE=0xFFFFFF, DIM=0xC0C6CC, BORD=0x232A33,
                         BLUE=0x2196F3, ORANGE=0xFF9800, PEND=0x8A929C;
          char b[64];
          auto setc = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_text_color(o, LV_PART_MAIN);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_text_color(o, want, LV_PART_MAIN);
          };
          auto bordc = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_border_color(o, LV_PART_MAIN);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_border_color(o, want, LV_PART_MAIN);
          };
          auto setbar = [](lv_obj_t* o, int v){
            if ((int) lv_bar_get_value(o) != v) lv_bar_set_value(o, v, LV_ANIM_OFF);
          };
          auto setbarb = [](lv_obj_t* o, uint32_t c){
            lv_color_t want = lv_color_hex(c);
            lv_color_t cur = lv_obj_get_style_bg_color(o, LV_PART_INDICATOR);
            if (lv_color_to_u32(cur) != lv_color_to_u32(want))
              lv_obj_set_style_bg_color(o, want, LV_PART_INDICATOR);
          };
          auto setl = [](lv_obj_t* o, const char* s){
            const char* c = lv_label_get_text(o);
            if (c == nullptr || strcmp(c, s) != 0) lv_label_set_text(o, s);
          };
          auto sethid = [](lv_obj_t* o, bool hide){
            bool is_hid = lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN);
            if (hide && !is_hid) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            else if (!hide && is_hid) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto bandcol = [&](float v, float lo, float hi)->uint32_t{
            if (isnan(v) || isnan(lo) || isnan(hi)) return GREY;
            if (v >= lo && v <= hi) return NEON;
            float m = (hi - lo) * 0.15f; if (m < 0.05f) m = 0.05f;
            if (v >= lo - m && v <= hi + m) return AMBER;
            return RED;
          };

          const bool locked = id(lock_engaged);
          const bool conn_vis = !lv_obj_has_flag(id(conn_screen), LV_OBJ_FLAG_HIDDEN);
          const int tab = id(active_tab);
          const bool soil_det = id(ui_soil_detail);
          const bool lad_det = id(ui_ladder_detail);
          const bool vpd_ed = id(ui_vpd_editor);
          const bool pwr_det = id(ui_power_detail);
          const bool interactive = !locked;

          // v4.0.11 — read ESP-NOW globals directly (template mirrors parked).
          const float *cfg = id(gv_cfg);
          const float *soil = id(gv_soil);
          const float *cd = id(gv_cd);
          const float *cool = id(gv_cool);
          const int dem = id(gv_dem), mode = id(gv_mode), flt = id(gv_flt), coord = id(gv_coord);
          const int cmode = id(gv_cmode);
          bool cfollow = (cmode == 0);
          float c_rmin = cfollow ? cfg[3] : cfg[8];
          float c_rmax = cfollow ? cfg[4] : cfg[9];
          float c_vmin = cfollow ? cfg[1] : cfg[6];
          float c_vmax = cfollow ? cfg[2] : cfg[7];
          float c_tt   = cfollow ? cfg[0] : cfg[5];
          float m_rmin = cfg[3], m_rmax = cfg[4];
          float m_vmin = cfg[1], m_vmax = cfg[2];
          float m_tt   = cfg[0];
          float clone_temp = id(gv_clone_t), clone_rh = id(gv_clone_rh), clone_vpd = id(gv_clone_vpd);
          float main_temp = id(gv_tent_t), main_rh = id(gv_tent_rh), main_vpd = id(gv_tent_vpd);
          float room_temp = id(gv_room_t), room_rh = id(gv_room_rh);
          float co2_ppm = id(gv_co2);
          float fan_out_pct = (float) id(gv_fan_out);
          float fan_recirc_pct = (float) id(gv_fan_recirc);
          float fan_int_main_pct = (float) id(gv_fan_imain);
          float fan_int_clone_pct = (float) id(gv_fan_iclone);
          float sf_target = cfg[10];
          bool dem_hum = dem & 1, dem_dehum = dem & 2, dem_heater = dem & 4;
          bool dem_mat = dem & 8, dem_ac = dem & 16, dem_clone_hum = dem & 32;
          bool lights_main = flt & 32;
          bool fault_emg = flt & 128, fault_climate = flt & 1;
          bool fault_rootzone = flt & 8, fault_aux = flt & 6;
          bool fan_out_on = id(gv_fan_out) > 0, fan_recirc_on = id(gv_fan_recirc) > 0;
          bool fan_int_main_on = id(gv_fan_imain) > 0, fan_int_clone_on = id(gv_fan_iclone) > 0;
          bool st_full_auto = mode & 1, st_takeover = mode & 4, st_auto_photo = mode & 8;
          bool st_light_hold = mode & 16, st_hum_routing = coord & 1, st_destrat = coord & 2;
          static const char* CMODE_N[] = {"Follow 4x8","Clones & Seedlings","Mother","Custom","Off"};
          const char* sel_clone_mode = (cmode>=0&&cmode<5)?CMODE_N[cmode]:"--";
          const char* p1_plant = id(gv_plant1).c_str();
          const char* p2_plant = id(gv_plant2).c_str();
          const char* p3_plant = id(gv_plant3).c_str();
          const char* p4_plant = id(gv_plant4).c_str();
          float p1_moist=soil[1], p1_temp=soil[0], p1_ec=soil[2], p1_ph=soil[3], p1_n=soil[4], p1_p=soil[5], p1_k=soil[6];
          float p2_moist=soil[8], p2_temp=soil[7], p2_ec=soil[9], p2_ph=soil[10], p2_n=soil[11], p2_p=soil[12], p2_k=soil[13];
          float p3_moist=soil[15], p3_temp=soil[14], p3_ec=soil[16], p3_ph=soil[17], p3_n=soil[18], p3_p=soil[19], p3_k=soil[20];
          float p4_moist=soil[22], p4_temp=soil[21], p4_ec=soil[23], p4_ph=soil[24], p4_n=soil[25], p4_p=soil[26], p4_k=soil[27];
          float cd_hum=cd[0], cd_dehum=cd[1], cd_heater=cd[2], cd_ac=cd[3], cd_mat=cd[4], cd_clone_hum=cd[5];

          bool link = id(api_link).state;
          bool any_dem = dem_hum||dem_dehum||dem_heater||dem_ac||dem_mat||dem_clone_hum;

          // ---- connection edge timers (always; cheap) ----
          {
            uint32_t nowms = millis();
            bool w = id(wifi_conn);
            if (w && !id(wifi_was)) id(wifi_since) = nowms;
            id(wifi_was) = w;
            if (link && !id(api_was)) id(api_since) = nowms;
            id(api_was) = link;
            const std::string &ssid_now = id(wifi_ssid_ts).state;
            bool on_anchor = w && ssid_now.size() >= 9 &&
                             ssid_now.compare(0, 9, "DSC-Anchor") == 0;
            if (on_anchor && !id(bridge_was)) id(bridge_since) = nowms;
            id(bridge_was) = on_anchor;
          }

          // ---- alerts (always — drives LED + silence banner) ----
          // Paint alert list rows here when open — no global string buffer
          // (ESPHome GlobalsComponent rejects char[N] constructors).
          const bool alert_vis = !lv_obj_has_flag(id(alert_screen), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t* al_rows[8] = {id(al_row0),id(al_row1),id(al_row2),id(al_row3),
                                  id(al_row4),id(al_row5),id(al_row6),id(al_row7)};
          if (alert_vis) {
            for (int i = 0; i < 8; i++) sethid(al_rows[i], true);
            setl(id(alert_mute_lbl), id(alerts_silenced) ? "UNMUTE" : "MUTE");
          }
          int ac = 0; char head[48] = ""; char hb[48];
          auto AL = [&](bool cond, const char* txt){
            if (!cond) return;
            if (ac == 0) { strncpy(head, txt, sizeof(head)-1); head[sizeof(head)-1] = 0; }
            if (alert_vis && ac < 8) {
              setl(al_rows[ac], txt);
              sethid(al_rows[ac], false);
            }
            ac++;
          };
          AL(fault_emg, "Emergency failsafe >35°C");
          AL(fault_climate, "Climate sensor fault");
          AL(fault_rootzone, "Root-zone probe fault");
          AL(fault_aux, "Aux sensor offline");
          AL(any_dem && !link, "Appliances need bridge or HA");
          if (id(wifi_channel_hopped)) {
            snprintf(hb, sizeof(hb), "WiFi channel hop -> %d (check ESP-NOW)", id(wifi_channel));
            AL(true, hb);
            uint32_t hub_age = millis() - id(gv_hub_last);
            if (id(gv_hub_last) != 0 && hub_age < 6000) id(wifi_channel_hopped) = false;
          }
          float crh = clone_rh, cvp = clone_vpd, mrh = main_rh, mvp = main_vpd;
          if (!isnan(crh) && !isnan(c_rmax) && crh > c_rmax + 2) { snprintf(hb,sizeof(hb),"Clone RH high · %.0f%%",crh); AL(true,hb); }
          if (!isnan(cvp) && !isnan(c_vmax) && cvp > c_vmax + 0.1f) { snprintf(hb,sizeof(hb),"Clone VPD high · %.2f",cvp); AL(true,hb); }
          if (!isnan(mrh) && !isnan(m_rmax) && mrh > m_rmax + 2) { snprintf(hb,sizeof(hb),"Main RH high · %.0f%%",mrh); AL(true,hb); }
          if (!isnan(mvp) && !isnan(m_vmax) && mvp > m_vmax + 0.1f) { snprintf(hb,sizeof(hb),"Main VPD high · %.2f",mvp); AL(true,hb); }
          id(alert_count) = ac;
          if (ac == 0) id(alerts_silenced) = false;
          sethid(id(btn_silence), !(ac > 0 && !id(alerts_silenced)));

          // ---- night / backlight (always) ----
          // v5.1.6 — no idle sleep, so this is just the night dim. No RGB
          // LED machine any more (status_led/led_r/g/b removed).
          bool night = !lights_main;
          id(night_mode) = night;
          int want = night ? 40 : 100;
          if (want != id(bl_last)) {
            id(bl_last) = want;
            auto bl = id(backlight).turn_on(); bl.set_brightness(want/100.0f); bl.perform();
          }

          // ---- clock (always; setl no-ops when unchanged) ----
          {
            auto now = id(sntp_time).now();
            if (!now.is_valid()) now = id(ha_time).now();
            if (now.is_valid()) {
              snprintf(b, sizeof(b), "%02d:%02d", now.hour, now.minute);
              setl(id(lock_clock), b);
            }
          }

          if (!interactive) {
            id(ui_dirty) = false;
            return;
          }

          // v5.1.2 — never letter-draw tab widgets under active touch / hold.
          // Coalesce via ui_dirty; the 200 ms drain interval retries when safe.
          if (id(holding) || millis() < id(touch_guard_until)) {
            id(ui_dirty) = true;
            return;
          }
          id(ui_dirty) = false;

          // ---- Connections overlay (only when open) ----
          if (conn_vis) {
            uint32_t nowms = millis();
            bool w = id(wifi_conn);
            auto upstr = [](char* out, size_t n, bool on, uint32_t since, uint32_t now){
              if (!on) { strncpy(out, "0s", n); return; }
              uint32_t s = (now - since) / 1000;
              if (s < 60)      snprintf(out, n, "%us", s);
              else if (s<3600) snprintf(out, n, "%um", s/60);
              else             snprintf(out, n, "%uh %um", s/3600, (s%3600)/60);
            };
            char u[16];
            upstr(u, sizeof(u), w, id(wifi_since), nowms);
            setl(id(conn_wifi_up), u); setc(id(conn_wifi_up), w ? NEON : GREY);
            setc(id(conn_wifi_ic), w ? NEON : RED);
            upstr(u, sizeof(u), link, id(api_since), nowms);
            setl(id(conn_api_up), u); setc(id(conn_api_up), link ? NEON : GREY);
            setc(id(conn_api_ic), link ? NEON : RED);
            const char* ssid = id(wifi_ssid_ts).state.c_str();
            if (ssid == nullptr || ssid[0] == '\0') ssid = "—";
            float rssi = id(wifi_rssi).state;
            int ch = id(wifi_channel);
            if (isnan(rssi)) {
              if (ch > 0) snprintf(b, sizeof(b), "%s · ch%d", ssid, ch);
              else        snprintf(b, sizeof(b), "%s", ssid);
            } else if (ch > 0) {
              snprintf(b, sizeof(b), "%s · %ddBm · ch%d", ssid, (int)rssi, ch);
            } else {
              snprintf(b, sizeof(b), "%s · %ddBm", ssid, (int)rssi);
            }
            setl(id(conn_wifi_sub), b);
            setl(id(conn_api_sub), id(wifi_ip_ts).state.c_str());
            bool on_anchor = w && ssid != nullptr && strncmp(ssid, "DSC-Anchor", 10) == 0;
            upstr(u, sizeof(u), on_anchor, id(bridge_since), nowms);
            setl(id(conn_bridge_up), u);
            setc(id(conn_bridge_up), on_anchor ? NEON : GREY);
            setc(id(conn_bridge_ic), on_anchor ? NEON : RED);
            if (on_anchor) {
              if (ch > 0) snprintf(b, sizeof(b), "%s · ch%d", ssid, ch);
              else snprintf(b, sizeof(b), "%s", ssid);
            } else {
              snprintf(b, sizeof(b), "not on DSC-Anchor");
            }
            setl(id(conn_bridge_sub), b);
            uint32_t hub_age = nowms - id(gv_hub_last);
            bool espn = id(gv_hub_last) != 0 && hub_age < 6000;
            setc(id(conn_espnow_ic), espn ? NEON : RED);
            setl(id(conn_espnow_val), espn ? "LINKED" : "DOWN");
            setc(id(conn_espnow_val), espn ? NEON : RED);
            if (id(gv_hub_last) == 0) {
              snprintf(b, sizeof(b), "no hub packet · tx#%u", (unsigned) id(cmd_tx_seq));
            } else if (espn) {
              if (ch > 0)
                snprintf(b, sizeof(b), "rx %us · tx#%u · ch%d", hub_age / 1000, (unsigned) id(cmd_tx_seq), ch);
              else
                snprintf(b, sizeof(b), "rx %us · tx#%u", hub_age / 1000, (unsigned) id(cmd_tx_seq));
            } else {
              uint32_t s = hub_age / 1000;
              if (s < 3600)      snprintf(b, sizeof(b), "silent %um · tx#%u", s / 60 ? s / 60 : 1, (unsigned) id(cmd_tx_seq));
              else if (s < 86400) snprintf(b, sizeof(b), "silent %uh · tx#%u", s / 3600, (unsigned) id(cmd_tx_seq));
              else                snprintf(b, sizeof(b), "silent %ud · tx#%u", s / 86400, (unsigned) id(cmd_tx_seq));
            }
            setl(id(conn_espnow_sub), b);
          }

          // ---- PULSE ----
          if (tab == 0 && !lad_det && !pwr_det && !vpd_ed) {
            setc(id(pill_wifi_ic), link ? NEON : RED);
            float co2 = co2_ppm;
            if (isnan(co2)) strcpy(b, "CO2 --- ppm"); else snprintf(b, sizeof(b), "CO2 %d ppm", (int)co2);
            setl(id(lbl_co2), b);

            float bv = id(batt_v).state;
            bool valid = !isnan(bv) && bv > 2.8f && bv < 4.6f;
            if (valid) {
              int pct = (int)((bv - 3.30f) / (4.20f - 3.30f) * 100.0f);
              if (pct < 0) pct = 0; if (pct > 100) pct = 100;
              snprintf(b, sizeof(b), "%d%%", pct);
              setl(id(pill_batt_pct), b);
              setc(id(pill_batt_pct), pct <= 15 ? RED : (pct <= 40 ? AMBER : NEON));
              setc(id(pill_batt_ic),  pct <= 15 ? RED : (pct <= 40 ? AMBER : NEON));
            }
            sethid(id(pill_batt_ic), !valid);
            sethid(id(pill_batt_pct), !valid);

            auto envtxt = [&](lv_obj_t* o, float t, float rh){
              if (isnan(t) || isnan(rh)) { setl(o, "--"); return; }
              char x[32]; snprintf(x, sizeof(x), "%.1f° · %.0f%%", t, rh); setl(o, x);
            };
            envtxt(id(lbl_2x4), clone_temp, clone_rh);
            envtxt(id(lbl_4x8), main_temp,  main_rh);
            envtxt(id(lbl_room), room_temp, room_rh);

            {
              float mn = NAN, mx = NAN;
              int n = id(spark_filled) ? 12 : id(spark_idx);
              if (n < 1) n = 1;
              for (int i = 0; i < n; i++) {
                float v = id(spark_vpd)[i];
                if (isnan(v)) continue;
                if (isnan(mn) || v < mn) mn = v;
                if (isnan(mx) || v > mx) mx = v;
              }
              if (isnan(mn)) setl(id(lbl_spark), "VPD —");
              else {
                static const char ASC[8] = {'.', ':', '-', '=', '+', '*', '#', '@'};
                char sp[16]; int spn = 0;
                float span = mx - mn;
                if (span < 0.05f) span = 0.05f;
                for (int i = 0; i < n && spn < (int)sizeof(sp) - 2; i++) {
                  float v = id(spark_vpd)[i];
                  int lv = 0;
                  if (!isnan(v)) {
                    lv = (int)((v - mn) / span * 7.0f + 0.5f);
                    if (lv < 0) lv = 0;
                    if (lv > 7) lv = 7;
                  }
                  sp[spn++] = ASC[lv];
                }
                sp[spn] = '\0';
                snprintf(b, sizeof(b), "%s %.2f–%.2f", sp, mn, mx);
                setl(id(lbl_spark), b);
              }

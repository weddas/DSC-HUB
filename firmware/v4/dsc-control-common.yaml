      # hold anywhere for 3s (plant shrinks seed-ward) to release.
      - button:
          id: lock_overlay
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          shadow_width: 0
          pad_all: 0
          widgets:
            - label: {id: lock_clock, text: "--:--", text_font: f_big, align: TOP_MID, y: 22, text_color: 0xFFFFFF}
            - label: {text: "ASLEEP", text_font: f_small, align: TOP_MID, y: 60, text_color: 0x5A6472}
            - label: {id: lk_fan,   text: "\U000F0210", text_font: mdi_34, align: CENTER, x: -125, y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_int,   text: "\U000F11DC", text_font: mdi_34, align: CENTER, x: -75,  y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_heat,  text: "\U000F0238", text_font: mdi_34, align: CENTER, x: -25,  y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_hum,   text: "\U000F1099", text_font: mdi_34, align: CENTER, x: 25,   y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_deh,   text: "\U000F150C", text_font: mdi_34, align: CENTER, x: 75,   y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_light, text: "\U000F05A8", text_font: mdi_34, align: CENTER, x: 125,  y: 4, text_color: 0x2A2A2A}
            - label: {id: lock_hint, text: "hold anywhere to wake", text_font: f_small, align: BOTTOM_MID, y: -26, text_color: 0x5A6472}
            - label: {text: "\U000F033E", text_font: mdi_22, align: BOTTOM_MID, y: -4, text_color: 0x3A4550}
          on_press:
            - script.execute: hold_begin
          on_pressing:
            - script.execute: hold_tick
          on_release:

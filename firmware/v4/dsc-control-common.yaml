#  LVGL UI  — built from DSC-HUB Panel v4 (ESP-CYD Test V1)
#  Palette (design): NEON #00E676  AMBER #FFAA00  ORANGE #FF9800
#  BLUE #2196F3  CYAN #00BCD4  RED #F44336  card #171B22  bg #0E1116
# ==================================================================
lvgl:
  # Pin the draw buffer to 1/8 screen (19,200 B). Left unset, LVGL first
  # asks for a FULL 320x240x2 = 153,600 B buffer; on this PSRAM-less
  # board that always failed and LVGL silently fell back to 1/8 anyway,
  # so 1/8 is what the panel has been running on all along and the
  # picture is unchanged. Pinning it stops the full-size grab from ever
  # starting to succeed and swallowing the recovered heap.
  #
  # v4.0.2 correction: the v4.0.1 note justified this with "sram1_as_iram
  # frees 40 KB". It does not (see the esp32: block above) — but the pin
  # is still right, for the reason above.
  #
  # And 12% is already the floor. ESPHome buckets this percentage into a
  # fraction in lvgl/__init__.py:
  #     >=0.75 -> 1;  >=0.375 -> 2;  >0.19 -> 4;  else -> 8
  # so anything in (0, 19%] lands on 1/8. Setting 6% or 3% here would
  # change nothing at all. There is no smaller draw buffer available.
  buffer_size: 12%
  displays:
    - cyd_display
  touchscreens:
    - cyd_touch
  color_depth: 16
  default_font: f_body
  bg_color: 0x0E1116
  text_color: 0xFFFFFF
  # A touch anywhere refreshes the idle timer (screensaver + night).
  on_idle:
    timeout: 60s
    then:
      - script.execute: go_sleep

  style_definitions:
    - id: card
      bg_color: 0x171B22
      bg_opa: COVER
      border_color: 0x232A33
      border_width: 1
      radius: 8
      pad_all: 6
      text_color: 0xFFFFFF
    - id: rowbtn
      bg_color: 0x171B22
      bg_opa: COVER
      border_color: 0x232A33
      border_width: 1
      radius: 8
      pad_all: 8
      shadow_width: 0
      text_color: 0xFFFFFF
      width: 300

  # ---------------- persistent tab bar + modal overlays -------------
  top_layer:
    widgets:
      - obj:
          id: tabbar
          x: 0
          y: 200
          width: 320
          height: 40
          bg_color: 0x0A0D11
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - button:
                id: tab_btn0
                x: 0
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic0, text: "\U000F05F6", text_font: mdi_28, align: CENTER, text_color: 0x00E676}
                on_click:
                  - lvgl.page.show: page_pulse
                  - lambda: |-
                      id(active_tab) = 0;
                      id(ui_soil_detail) = false;
                  - script.execute: restyle_tabs
                  - script.execute: refresh_ui
            - button:
                id: tab_btn1
                x: 64
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic1, text: "\U000F0E66", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_clone
                  - lambda: |-
                      id(active_tab) = 1;
                      id(ui_soil_detail) = false;
                  - script.execute: restyle_tabs
                  - script.execute: refresh_ui
            - button:
                id: tab_btn2
                x: 128
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic2, text: "\U000F032A", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_main
                  - lambda: |-
                      id(active_tab) = 2;
                      id(ui_soil_detail) = false;
                  - script.execute: restyle_tabs
                  - script.execute: refresh_ui
            - button:
                id: tab_btn3
                x: 192
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic3, text: "\U000F058E", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_soil
                  - lambda: |-
                      id(active_tab) = 3;
                      id(ui_soil_detail) = false;
                  - script.execute: restyle_tabs
                  - script.execute: refresh_ui
            - button:
                id: tab_btn4
                x: 256
                y: 0
                width: 64
                height: 40
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                radius: 0
                widgets:
                  - label: {id: tab_ic4, text: "\U000F066A", text_font: mdi_28, align: CENTER, text_color: 0x5A6472}
                on_click:
                  - lvgl.page.show: page_control
                  - lambda: |-
                      id(active_tab) = 4;
                      id(ui_soil_detail) = false;
                  - script.execute: restyle_tabs
                  - script.execute: refresh_ui

      # ---- big SILENCE banner: shown only while an alert is live ----
      # Appears across the top on ANY tab whenever the LED is pulsing red;
      # one tap hushes the alert (and stops the pulse) immediately.
      - button:
          id: btn_silence
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 40
          bg_color: 0xF44336
          radius: 0
          shadow_width: 0
          widgets:
            - label: {text: "\U000F009B", text_font: mdi_22, align: CENTER, x: -84, text_color: 0xFFFFFF}
            - label: {text: "SILENCE ALERT", text_font: f_med, align: CENTER, x: 14, text_color: 0xFFFFFF}
          on_click:
            - lambda: 'id(alerts_silenced) = true;'
            - script.execute: refresh_ui

      # ---- screensaver overlay (hidden until idle) ----
      - obj:
          id: saver
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x06080B
          bg_opa: COVER
          border_width: 0
          radius: 0
          widgets:
            - label: {id: saver_clock, text: "--:--", text_font: f_big, align: CENTER, y: -14, text_color: 0x2E7D50}
            - label: {id: saver_status, text: "DSC-HUB", text_font: f_small, align: CENTER, y: 22, text_color: 0x3A4550}
          on_click:
            - script.execute: wake_panel

      # ---- select editor overlay (roller + Apply/Cancel) ----
      - obj:
          id: editor
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: 60%
          border_width: 0
          radius: 0
          widgets:
            - obj:
                align: CENTER
                width: 280
                height: 190
                bg_color: 0x171B22
                bg_opa: COVER
                border_color: 0x00E676
                border_width: 1
                radius: 10
                pad_all: 10
                widgets:
                  - label: {id: ed_title, text: "Grow Stage", text_font: f_med, align: TOP_LEFT, text_color: 0x00E676}
                  - roller:
                      id: ed_roller
                      align: TOP_MID
                      y: 30
                      width: 250
                      visible_row_count: 3
                      options:
                        - "Germination"
                        - "Vegetative"
                        - "Flowering"
                      bg_color: 0x0E1116
                      text_color: 0xFFFFFF
                      text_font: f_body
                  - button:
                      id: ed_cancel
                      align: BOTTOM_LEFT
                      width: 118
                      height: 38
                      bg_color: 0x2A313B
                      radius: 8
                      shadow_width: 0
                      widgets:
                        - label: {text: "Cancel", align: CENTER, text_color: 0xFFFFFF, text_font: f_body}
                      on_click:
                        - lambda: 'lv_obj_add_flag(id(editor), LV_OBJ_FLAG_HIDDEN);'
                  - button:
                      id: ed_apply
                      align: BOTTOM_RIGHT
                      width: 118
                      height: 38
                      bg_color: 0x12241A
                      border_color: 0x00E676
                      border_width: 1
                      radius: 8
                      shadow_width: 0
                      widgets:
                        - label: {text: "Apply", align: CENTER, text_color: 0x00E676, text_font: f_body}
                      on_click:
                        - script.execute: apply_editor

      # ---- action gate overlay (Manual Takeover + appliance demands) ----
      # Tap-challenge: nothing that flips outputs is one stray tap away.
      - obj:
          id: confirm_takeover
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: 60%
          border_width: 0
          widgets:
            - obj:
                align: CENTER
                width: 280
                height: 150
                bg_color: 0x171B22
                bg_opa: COVER
                border_color: 0xFFAA00
                border_width: 1
                radius: 10
                pad_all: 12
                widgets:
                  - label: {id: gate_title, text: "Confirm", text_font: f_med, align: TOP_MID, text_color: 0xFFAA00}
                  - label:
                      id: gate_body
                      text: "Confirm this action."
                      text_font: f_small
                      align: TOP_MID
                      y: 30
                      text_color: 0xC0C6CC
                      text_align: CENTER
                  - button:
                      align: BOTTOM_LEFT
                      width: 118
                      height: 38
                      bg_color: 0x2A313B
                      radius: 8
                      shadow_width: 0
                      widgets:
                        - label: {text: "Cancel", align: CENTER, text_color: 0xFFFFFF, text_font: f_body}
                      on_click:
                        - lambda: 'lv_obj_add_flag(id(confirm_takeover), LV_OBJ_FLAG_HIDDEN);'
                  - button:
                      align: BOTTOM_RIGHT
                      width: 118
                      height: 38
                      bg_color: 0x3A2A12
                      border_color: 0xFFAA00
                      border_width: 1
                      radius: 8
                      shadow_width: 0
                      widgets:
                        - label: {text: "Engage", align: CENTER, text_color: 0xFFAA00, text_font: f_body}
                      on_click:
                        - script.execute: gate_confirm

      # ---- flashlight overlay — drives the ONBOARD RGB LED (the chip LED) ----
      # This is a control surface only; the light itself is status_led (the
      # onboard RGB). While fl_active, refresh_ui's status-LED machine yields
      # (see the LED block, guarded on fl_active). On-screen dot mirrors the
      # colour so you can aim it. Opened by swipe-down on Pulse/Soil or
      # Setup -> Flashlight.
      - obj:
          id: fl_screen
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x06080B
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - label: {id: fl_title, text: "TORCH", text_font: f_med, align: TOP_LEFT, x: 16, y: 12, text_color: 0xFFFFFF}
            - label: {text: "onboard LED", text_font: f_small, align: TOP_LEFT, x: 16, y: 36, text_color: 0x8A929C}
            # ON / OFF toggle (turns the chip LED on/off without closing)
            - button:
                id: fl_onoff
                align: TOP_RIGHT
                x: -12
                y: 10
                width: 92
                height: 38
                bg_color: 0x12241A
                border_color: 0x00E676
                border_width: 1
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {id: fl_onoff_lbl, text: "ON", text_font: f_med, align: CENTER, text_color: 0x00E676}
                on_click:
                  - lambda: 'id(fl_active) = !id(fl_active);'
                  - script.execute: apply_flashlight
            # on-screen preview of the LED colour
            - obj:
                id: fl_dot
                align: TOP_MID
                y: 52
                width: 54
                height: 54
                bg_color: 0x00FF00
                bg_opa: COVER
                radius: 27
                border_width: 0
                scrollable: false
            - label: {id: fl_pct, text: "70%", text_font: f_med, align: TOP_MID, y: 112, text_color: 0xFFFFFF}
            # colour: Green / White / Red
            - button:
                id: fl_bg
                align: TOP_MID
                x: -62
                y: 138
                width: 54
                height: 32
                bg_color: 0x0E3A16
                border_color: 0x00E676
                border_width: 3
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "G", text_font: f_med, align: CENTER, text_color: 0x00E676}
                on_click:
                  - lambda: 'id(fl_color) = 0;'
                  - script.execute: apply_flashlight
            - button:
                id: fl_bw
                align: TOP_MID
                x: 0
                y: 138
                width: 54
                height: 32
                bg_color: 0x2A313B
                border_color: 0xFFFFFF
                border_width: 1
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "W", text_font: f_med, align: CENTER, text_color: 0xFFFFFF}
                on_click:
                  - lambda: 'id(fl_color) = 1;'
                  - script.execute: apply_flashlight
            - button:
                id: fl_br
                align: TOP_MID
                x: 62
                y: 138
                width: 54
                height: 32
                bg_color: 0x3A1212
                border_color: 0xF44336
                border_width: 1
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "R", text_font: f_med, align: CENTER, text_color: 0xF44336}
                on_click:
                  - lambda: 'id(fl_color) = 2;'
                  - script.execute: apply_flashlight
            # brightness  -  [bar]  +
            - button:
                id: fl_dn
                align: TOP_MID
                x: -128
                y: 178
                width: 34
                height: 30
                bg_color: 0x2A313B
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "-", text_font: f_med, align: CENTER, text_color: 0xFFFFFF}
                on_click:
                  - lambda: 'id(fl_bright) -= 10; if (id(fl_bright) < 10) id(fl_bright) = 10;'
                  - script.execute: apply_flashlight
            - bar:
                id: fl_bar
                align: TOP_MID
                x: 0
                y: 187
                width: 168
                height: 10
                min_value: 0
                max_value: 100
                value: 70
                indicator: {bg_color: 0x00E676}
                bg_color: 0x232A33
            - button:
                id: fl_up
                align: TOP_MID
                x: 128
                y: 178
                width: 34
                height: 30
                bg_color: 0x2A313B
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "+", text_font: f_med, align: CENTER, text_color: 0xFFFFFF}
                on_click:
                  - lambda: 'id(fl_bright) += 10; if (id(fl_bright) > 100) id(fl_bright) = 100;'
                  - script.execute: apply_flashlight
            - button:
                id: fl_close
                align: BOTTOM_MID
                y: -6
                width: 150
                height: 28
                bg_color: 0x171B22
                border_color: 0x8A929C
                border_width: 1
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "CLOSE", text_font: f_body, align: CENTER, text_color: 0xFFFFFF}
                on_click:
                  - script.execute: close_flashlight

      # ---- LOCK SCREEN (persistent while locked) ----
      # Full-screen black; a row of active-device glyphs in white breathe
      # while idle devices sit dim — high contrast so it reads even at the
      # dimmed backlight. The whole panel is the unlock target: press and
      # hold anywhere for 3s (plant shrinks seed-ward) to release.
      - button:
          id: lock_overlay
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          shadow_width: 0
          pad_all: 0
          widgets:
            - label: {id: lock_clock, text: "--:--", text_font: f_big, align: TOP_MID, y: 22, text_color: 0xFFFFFF}
            - label: {text: "ASLEEP", text_font: f_small, align: TOP_MID, y: 60, text_color: 0x5A6472}
            - label: {id: lk_fan,   text: "\U000F0210", text_font: mdi_34, align: CENTER, x: -125, y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_int,   text: "\U000F11DC", text_font: mdi_34, align: CENTER, x: -75,  y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_heat,  text: "\U000F0238", text_font: mdi_34, align: CENTER, x: -25,  y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_hum,   text: "\U000F1099", text_font: mdi_34, align: CENTER, x: 25,   y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_deh,   text: "\U000F150C", text_font: mdi_34, align: CENTER, x: 75,   y: 4, text_color: 0x2A2A2A}
            - label: {id: lk_light, text: "\U000F05A8", text_font: mdi_34, align: CENTER, x: 125,  y: 4, text_color: 0x2A2A2A}
            - label: {id: lock_hint, text: "hold anywhere to wake", text_font: f_small, align: BOTTOM_MID, y: -26, text_color: 0x5A6472}
            - label: {text: "\U000F033E", text_font: mdi_22, align: BOTTOM_MID, y: -4, text_color: 0x3A4550}
          on_press:
            - script.execute: hold_begin
          on_pressing:
            - script.execute: hold_tick
          on_release:
            - script.execute: hold_cancel

      # ---- HOLD HUD (transient growth animation, topmost) ----
      # Shown during any lock/unlock hold. Locking: seed -> plant. Unlocking:
      # plant -> seed. Reaches the end at 3s, then commits.
      - obj:
          id: hold_hud
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: 72%
          border_width: 0
          radius: 0
          scrollable: false
          widgets:
            - label: {id: hud_sky,   text: "\U000F0594", text_font: mdi_28,   align: CENTER, y: -86, text_color: 0x5A6472}
            - label: {id: hud_plant, text: "\U000F0E62", text_font: mdi_grow, align: CENTER, y: -18, text_color: 0x00E676}
            - label: {id: hud_hint, text: "GOING TO SLEEP", text_font: f_med, align: CENTER, y: 46, text_color: 0xFFFFFF}
            - bar:
                id: hud_bar
                align: CENTER
                y: 74
                width: 200
                height: 8
                min_value: 0
                max_value: 100
                value: 0
                indicator: {bg_color: 0x00E676}
                bg_color: 0x232A33

      # ---- CONNECTIONS screen (tap the Wi-Fi pill on Pulse) ----
      # Live link table: Wi-Fi, Home Assistant API, Bluetooth, ESP-NOW. Each
      # shows an up-counter that resets to 0 the moment that link drops.
      # BT/ESP-NOW read "—" until those radios are configured (ESP-NOW arrives
      # with the headless-hub firmware).
      - obj:
          id: conn_screen
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x06080B
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - label: {text: "\U000F05A9", text_font: mdi_22, align: TOP_LEFT, x: 12, y: 12, text_color: 0x00E676}
            - label: {text: "CONNECTIONS", text_font: f_med, align: TOP_LEFT, x: 44, y: 14, text_color: 0xFFFFFF}
            - button:
                id: conn_close
                align: TOP_RIGHT
                x: -8
                y: 8
                width: 66
                height: 30
                bg_color: 0x171B22
                border_color: 0x8A929C
                border_width: 1
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "CLOSE", text_font: f_small, align: CENTER, text_color: 0xFFFFFF}
                on_click:
                  - script.execute: close_connections
            # --- Wi-Fi ---
            - obj:
                x: 10
                y: 44
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                # v4.0.2 — same 33-into-26 squeeze as the soil cards: this row
                # stacks an f_body title (~18 px) over an f_small sub-line
                # (~15 px), and 42 px of height minus a 1 px border and 6 px
                # of top/bottom padding leaves only 28 px. Trimming just the
                # vertical padding to 2 gives 36 px and un-overlaps them;
                # left/right stay at 6 so the up-counter column is unmoved.
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  - label: {id: conn_wifi_ic, text: "\U000F05A9", text_font: mdi_22, align: LEFT_MID, x: 2, text_color: 0x00E676}
                  - label: {text: "Wi-Fi", text_font: f_body, align: TOP_LEFT, x: 36, y: 0, text_color: 0xFFFFFF}
                  # v4.0.2 — was `width: 180, long_mode: SCROLL_CIRCULAR`.
                  # SCROLL_CIRCULAR is not cosmetic: it runs an lv_anim at the
                  # display refresh rate, and every frame invalidates the label,
                  # so LVGL re-renders each glyph and takes a fresh 32-byte
                  # aligned A8 mask off the system heap for it (ESPHome sets
                  # LV_USE_STDLIB_MALLOC = LV_STDLIB_CUSTOM, so LVGL has no
                  # pool of its own — every one of those goes to the ESP-IDF
                  # heap). That is hundreds of aligned alloc/free cycles a
                  # second, which is what shredded the heap until the logged
                  # 768-byte (24x32, cf:14 = A8) draw buffer could not be
                  # served. DOTS renders once and stays still. 180 -> 200 px
                  # also stops "SSID · -xxdBm" colliding with the value column.
                  - label: {id: conn_wifi_sub, text: "—", text_font: f_small, align: BOTTOM_LEFT, x: 36, y: 0, width: 200, long_mode: DOT, text_color: 0x8A929C}
                  - label: {id: conn_wifi_up, text: "0s", text_font: f_body, align: RIGHT_MID, x: -2, text_color: 0x00E676}
            # --- Home Assistant API ---
            - obj:
                x: 10
                y: 90
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  - label: {id: conn_api_ic, text: "\U000F07D0", text_font: mdi_22, align: LEFT_MID, x: 2, text_color: 0x00E676}
                  - label: {text: "Home Assistant", text_font: f_body, align: TOP_LEFT, x: 36, y: 0, text_color: 0xFFFFFF}
                  - label: {id: conn_api_sub, text: "—", text_font: f_small, align: BOTTOM_LEFT, x: 36, y: 0, text_color: 0x8A929C}
                  - label: {id: conn_api_up, text: "0s", text_font: f_body, align: RIGHT_MID, x: -2, text_color: 0x00E676}
            # --- Bluetooth ---
            - obj:
                x: 10
                y: 136
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  - label: {text: "\U000F00AF", text_font: mdi_22, align: LEFT_MID, x: 2, text_color: 0x3A4550}

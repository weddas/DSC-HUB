          // ---- SOIL summary cards ----
          if (tab == 3 && !soil_det) {
            auto potrow = [&](lv_obj_t* nameL, lv_obj_t* npkL, lv_obj_t* valL, int idx,
                              const char* plant, float mo, float tp, float ec, float ph,
                              float nn, float pp, float kk){
              char x[80];
              snprintf(x, sizeof(x), "P%d · %s", idx, (plant == nullptr || plant[0]=='\0') ? "—" : plant);
              setl(nameL, x);
              if (isnan(nn) && isnan(pp) && isnan(kk)) setl(npkL, "N/P/K —");
              else { snprintf(x, sizeof(x), "N/P/K %d/%d/%d", (int)(isnan(nn)?0:nn), (int)(isnan(pp)?0:pp), (int)(isnan(kk)?0:kk)); setl(npkL, x); }
              if (isnan(mo) && isnan(tp) && isnan(ph)) { setl(valL, "offline / no data"); setc(valL, GREY); return; }
              char mS[10], tS[12], pS[10], eS[12];
              if (isnan(mo)) strcpy(mS, "--"); else snprintf(mS, sizeof(mS), "%.0f%%", mo);
              if (isnan(tp)) strcpy(tS, "--"); else snprintf(tS, sizeof(tS), "%.1f°", tp);
              if (isnan(ph)) strcpy(pS, "--"); else snprintf(pS, sizeof(pS), "%.1f", ph);
              if (isnan(ec)) strcpy(eS, "--"); else snprintf(eS, sizeof(eS), "%.0f", ec);
              snprintf(x, sizeof(x), "M %s · T %s · pH %s · EC %s", mS, tS, pS, eS);
              setl(valL, x);
              bool healthy = (!isnan(mo) && mo >= 30.0f) && (!isnan(ph) && ph >= 5.8f && ph <= 6.8f);
              setc(valL, healthy ? NEON : AMBER);
            };
            potrow(id(lbl_p1_name), id(lbl_p1_npk), id(lbl_p1_vals), 1, p1_plant,
                   p1_moist, p1_temp, p1_ec, p1_ph, p1_n, p1_p, p1_k);
            potrow(id(lbl_p2_name), id(lbl_p2_npk), id(lbl_p2_vals), 2, p2_plant,
                   p2_moist, p2_temp, p2_ec, p2_ph, p2_n, p2_p, p2_k);
            potrow(id(lbl_p3_name), id(lbl_p3_npk), id(lbl_p3_vals), 3, p3_plant,
                   p3_moist, p3_temp, p3_ec, p3_ph, p3_n, p3_p, p3_k);
            potrow(id(lbl_p4_name), id(lbl_p4_npk), id(lbl_p4_vals), 4, p4_plant,
                   p4_moist, p4_temp, p4_ec, p4_ph, p4_n, p4_p, p4_k);
          }

          // ---- SOIL detail ----
          if (soil_det) {
            int pot = id(soil_detail_pot);
            if (pot < 1 || pot > 4) pot = 1;
            const char* plant = p1_plant;
            float mo = p1_moist, tp = p1_temp, ec = p1_ec, ph = p1_ph;
            float nn = p1_n, pp = p1_p, kk = p1_k;
            if (pot == 2) {
              plant = p2_plant; mo = p2_moist; tp = p2_temp;
              ec = p2_ec; ph = p2_ph; nn = p2_n; pp = p2_p; kk = p2_k;
            } else if (pot == 3) {
              plant = p3_plant; mo = p3_moist; tp = p3_temp;
              ec = p3_ec; ph = p3_ph; nn = p3_n; pp = p3_p; kk = p3_k;
            } else if (pot == 4) {
              plant = p4_plant; mo = p4_moist; tp = p4_temp;
              ec = p4_ec; ph = p4_ph; nn = p4_n; pp = p4_p; kk = p4_k;
            }
            char x[64];
            if (plant == nullptr || plant[0] == '\0') snprintf(x, sizeof(x), "POT %d", pot);
            else snprintf(x, sizeof(x), "P%d · %s", pot, plant);
            setl(id(lbl_sd_title), x);

            if (isnan(mo)) { setl(id(sd_moist_val), "--"); setc(id(sd_moist_val), GREY); setbar(id(sd_moist_bar), 0); setbarb(id(sd_moist_bar), GREY); }
            else {
              snprintf(x, sizeof(x), "%.0f%%", mo); setl(id(sd_moist_val), x);
              setbar(id(sd_moist_bar), (int) mo);
              uint32_t c = (mo >= 30.0f) ? NEON : AMBER;
              setc(id(sd_moist_val), c); setbarb(id(sd_moist_bar), c);
            }
            if (isnan(tp)) { setl(id(sd_temp_val), "--"); setc(id(sd_temp_val), GREY); }
            else { snprintf(x, sizeof(x), "%.1f°C", tp); setl(id(sd_temp_val), x); setc(id(sd_temp_val), NEON); }
            if (isnan(ph)) { setl(id(sd_ph_val), "--"); setc(id(sd_ph_val), GREY); setbar(id(sd_ph_bar), 40); setbarb(id(sd_ph_bar), GREY); }
            else {
              snprintf(x, sizeof(x), "%.2f", ph); setl(id(sd_ph_val), x);
              int pb = (int) (ph * 10.0f); if (pb < 40) pb = 40; if (pb > 80) pb = 80;
              setbar(id(sd_ph_bar), pb);
              uint32_t c = (ph >= 5.8f && ph <= 6.8f) ? NEON : AMBER;
              setc(id(sd_ph_val), c); setbarb(id(sd_ph_bar), c);
            }
            if (isnan(ec)) { setl(id(sd_ec_val), "--"); setc(id(sd_ec_val), GREY); }
            else { snprintf(x, sizeof(x), "%.0f uS/cm", ec); setl(id(sd_ec_val), x); setc(id(sd_ec_val), NEON); }
            if (isnan(nn)) { setl(id(sd_n_val), "--"); setc(id(sd_n_val), GREY); }
            else { snprintf(x, sizeof(x), "%d", (int) nn); setl(id(sd_n_val), x); setc(id(sd_n_val), NEON); }
            if (isnan(pp)) { setl(id(sd_p_val), "--"); setc(id(sd_p_val), GREY); }
            else { snprintf(x, sizeof(x), "%d", (int) pp); setl(id(sd_p_val), x); setc(id(sd_p_val), NEON); }
            if (isnan(kk)) { setl(id(sd_k_val), "--"); setc(id(sd_k_val), GREY); }
            else { snprintf(x, sizeof(x), "%d", (int) kk); setl(id(sd_k_val), x); setc(id(sd_k_val), NEON); }
          }

          // ---- LADDER detail (Rung 1 fans / Rung 2 appliances) ----
          if (lad_det) {
            const int mode = id(ladder_detail_mode);
            const bool fans = (mode == 1);
            setl(id(lbl_ld_title), fans ? "RUNG 1 · FANS" : "RUNG 2 · DEVICES");

            lv_obj_t* rows[6] = {id(ld_row0),id(ld_row1),id(ld_row2),id(ld_row3),id(ld_row4),id(ld_row5)};
            lv_obj_t* ics[6]  = {id(ld_ic0),id(ld_ic1),id(ld_ic2),id(ld_ic3),id(ld_ic4),id(ld_ic5)};
            lv_obj_t* names[6]= {id(ld_name0),id(ld_name1),id(ld_name2),id(ld_name3),id(ld_name4),id(ld_name5)};
            lv_obj_t* vals[6] = {id(ld_val0),id(ld_val1),id(ld_val2),id(ld_val3),id(ld_val4),id(ld_val5)};
            lv_obj_t* minus[6]= {id(ld_minus0),id(ld_minus1),id(ld_minus2),id(ld_minus3),id(ld_minus4),id(ld_minus5)};
            lv_obj_t* plus[6] = {id(ld_plus0),id(ld_plus1),id(ld_plus2),id(ld_plus3),id(ld_plus4),id(ld_plus5)};

            auto pend_on = [&](int op)->bool{
              if (op < 0 || op >= 64) return false;
              uint32_t t = id(pend_ms)[op];
              if (t == 0) return false;
              if (millis() - t > 8000u) { id(pend_ms)[op] = 0; return false; }
              return true;
            };

            if (fans) {
              static const char* FNAME[4] = {
                "6\" exhaust (out)", "6\" exhaust (room)", "4\" intake (main)", "2x4 intake fan"
              };
              static const char* FIC[4] = {
                "\U000F0210", "\U000F0210", "\U000F11DC", "\U000F11DC"
              };
              float fpct[4] = {fan_out_pct, fan_recirc_pct, fan_int_main_pct, fan_int_clone_pct};
              int fop[4] = {25, 26, 27, 28};
              for (int i = 0; i < 6; i++) {
                sethid(rows[i], i >= 4);
                sethid(minus[i], i >= 4);
                sethid(plus[i], i >= 4);
              }
              for (int i = 0; i < 4; i++) {
                setl(names[i], FNAME[i]);
                setl(ics[i], FIC[i]);
                float v = fpct[i];
                bool on = !isnan(v) && v > 0;
                if (isnan(v)) setl(vals[i], "--");
                else { snprintf(b, sizeof(b), "%d%%", (int)v); setl(vals[i], b); }
                setc(vals[i], pend_on(fop[i]) ? PEND : (on ? CYAN : GREY));
                setc(ics[i], on ? CYAN : 0x39424D);
              }
            } else {
              static const char* ANAME[6] = {
                "Humidifier", "Dehumidifier", "Heater", "AC", "Grow mat", "Clone humidifier"
              };
              static const char* AIC[6] = {
                "\U000F1099", "\U000F150C", "\U000F0238", "\U000F0717", "\U000F1AAF", "\U000F1099"
              };
              bool aon[6] = {dem_hum, dem_dehum, dem_heater, dem_ac, dem_mat, dem_clone_hum};
              float afire[6] = {cd_hum, cd_dehum, cd_heater, cd_ac, cd_mat, cd_clone_hum};
              // cool[] same order; compressor lock for dehum(1) + AC(3)
              for (int i = 0; i < 6; i++) {
                sethid(rows[i], false);
                sethid(minus[i], true);
                sethid(plus[i], true);
                setl(names[i], ANAME[i]);
                setl(ics[i], AIC[i]);
                uint32_t col = GREY;
                if (aon[i]) {
                  uint32_t ms = id(dem_on_ms)[i];
                  uint32_t sec = ms ? (millis() - ms) / 1000u : 0;
                  if (sec >= 60) snprintf(b, sizeof(b), "ON · %um", (unsigned)(sec / 60u));
                  else snprintf(b, sizeof(b), "ON · %us", (unsigned)sec);
                  col = AMBER;
                } else if (!isnan(afire[i]) && afire[i] > 0) {
                  snprintf(b, sizeof(b), "in %ds", (int)afire[i]);
                  col = AMBER;
                } else if (!isnan(cool[i]) && cool[i] > 0) {
                  if (i == 1 || i == 3) snprintf(b, sizeof(b), "lock %ds", (int)cool[i]);
                  else snprintf(b, sizeof(b), "min-off %ds", (int)cool[i]);
                  col = 0x8A929C;
                } else {
                  strcpy(b, "idle");
                  col = GREY;
                }
                setl(vals[i], b);
                setc(vals[i], col);
                setc(ics[i], aon[i] ? AMBER : 0x39424D);
              }

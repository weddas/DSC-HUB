  - platform: template
    id: sel_clone_mode
    internal: true
    update_interval: never
    lambda: |-
        const char* o[]={"Follow 4x8","Clones & Seedlings","Mother","Custom","Off"}; int i=id(gv_cmode); return std::string(i>=0&&i<5?o[i]:"--");

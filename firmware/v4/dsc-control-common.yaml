      # ---- CONNECTIONS screen (tap the Wi-Fi pill on Pulse) ----
      # Live link table: Wi-Fi, Home Assistant API, Bluetooth, ESP-NOW. Each
      # shows an up-counter that resets to 0 the moment that link drops.
      # BT/ESP-NOW read "—" until those radios are configured (ESP-NOW arrives
      # with the headless-hub firmware).
      - obj:
          id: conn_screen
          hidden: true
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x06080B
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - label: {text: "\U000F05A9", text_font: mdi_22, align: TOP_LEFT, x: 12, y: 12, text_color: 0x00E676}
            - label: {text: "CONNECTIONS", text_font: f_med, align: TOP_LEFT, x: 44, y: 14, text_color: 0xFFFFFF}
            - button:
                id: conn_close
                align: TOP_RIGHT
                x: -8
                y: 8
                width: 66
                height: 30
                bg_color: 0x171B22
                border_color: 0x8A929C
                border_width: 1
                radius: 8
                shadow_width: 0
                widgets:
                  - label: {text: "CLOSE", text_font: f_small, align: CENTER, text_color: 0xFFFFFF}
                on_click:
                  - script.execute: close_connections
            # --- Wi-Fi ---
            - obj:
                x: 10
                y: 44
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                # v4.0.2 — same 33-into-26 squeeze as the soil cards: this row
                # stacks an f_body title (~18 px) over an f_small sub-line
                # (~15 px), and 42 px of height minus a 1 px border and 6 px
                # of top/bottom padding leaves only 28 px. Trimming just the
                # vertical padding to 2 gives 36 px and un-overlaps them;
                # left/right stay at 6 so the up-counter column is unmoved.
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  - label: {id: conn_wifi_ic, text: "\U000F05A9", text_font: mdi_22, align: LEFT_MID, x: 2, text_color: 0x00E676}
                  - label: {text: "Wi-Fi", text_font: f_body, align: TOP_LEFT, x: 36, y: 0, text_color: 0xFFFFFF}
                  # v4.0.2 — was `width: 180, long_mode: SCROLL_CIRCULAR`.
                  # SCROLL_CIRCULAR is not cosmetic: it runs an lv_anim at the
                  # display refresh rate, and every frame invalidates the label,
                  # so LVGL re-renders each glyph and takes a fresh 32-byte
                  # aligned A8 mask off the system heap for it (ESPHome sets
                  # LV_USE_STDLIB_MALLOC = LV_STDLIB_CUSTOM, so LVGL has no
                  # pool of its own — every one of those goes to the ESP-IDF
                  # heap). That is hundreds of aligned alloc/free cycles a
                  # second, which is what shredded the heap until the logged
                  # 768-byte (24x32, cf:14 = A8) draw buffer could not be
                  # served. DOTS renders once and stays still. 180 -> 200 px
                  # also stops "SSID · -xxdBm" colliding with the value column.
                  - label: {id: conn_wifi_sub, text: "—", text_font: f_small, align: BOTTOM_LEFT, x: 36, y: 0, width: 200, long_mode: DOT, text_color: 0x8A929C}
                  - label: {id: conn_wifi_up, text: "0s", text_font: f_body, align: RIGHT_MID, x: -2, text_color: 0x00E676}
            # --- Home Assistant API ---
            - obj:
                x: 10
                y: 90
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  - label: {id: conn_api_ic, text: "\U000F07D0", text_font: mdi_22, align: LEFT_MID, x: 2, text_color: 0x00E676}
                  - label: {text: "Home Assistant", text_font: f_body, align: TOP_LEFT, x: 36, y: 0, text_color: 0xFFFFFF}
                  - label: {id: conn_api_sub, text: "—", text_font: f_small, align: BOTTOM_LEFT, x: 36, y: 0, text_color: 0x8A929C}
                  - label: {id: conn_api_up, text: "0s", text_font: f_body, align: RIGHT_MID, x: -2, text_color: 0x00E676}
            # --- Bluetooth ---
            - obj:
                x: 10
                y: 136
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  - label: {text: "\U000F00AF", text_font: mdi_22, align: LEFT_MID, x: 2, text_color: 0x3A4550}
                  - label: {text: "Bluetooth", text_font: f_body, align: TOP_LEFT, x: 36, y: 0, text_color: 0xC0C6CC}
                  - label: {text: "radio off", text_font: f_small, align: BOTTOM_LEFT, x: 36, y: 0, text_color: 0x5A6472}
                  - label: {text: "—", text_font: f_body, align: RIGHT_MID, x: -2, text_color: 0x5A6472}
            # --- ESP-NOW ---
            - obj:
                x: 10
                y: 182
                width: 300
                height: 42
                bg_color: 0x0E1116
                border_color: 0x232A33
                border_width: 1
                radius: 8
                pad_all: 6
                pad_top: 2
                pad_bottom: 2
                scrollable: false
                widgets:
                  # v4.0.2 — this row was written before the hub's ESP-NOW
                  # layer shipped and still said "arrives with hub firmware"
                  # with a dead grey icon and an em-dash value, on a panel

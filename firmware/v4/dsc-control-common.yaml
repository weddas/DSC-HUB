          // ---- CONTROL (v5.1.6 — Full Auto / Auto Photoperiod / Manual
          // Takeover / Manual Light Hold / Humidifier Routing / RECIRC
          // De-Strat, inlined; every settings drill page is gone) ----
          if (tab == 4 && !vpd_ed && !pwr_det) {
            auto pend_on = [&](int op)->bool{
              if (op < 0 || op >= 64) return false;
              uint32_t t = id(pend_ms)[op];
              if (t == 0) return false;
              if (millis() - t > 8000u) { id(pend_ms)[op] = 0; return false; }
              return true;
            };
            bool fa = st_full_auto, ta = st_takeover, ap = st_auto_photo;
            setl(id(lbl_fullauto_state), fa ? "ON" : "off"); setc(id(lbl_fullauto_state), pend_on(1) ? PEND : (fa ? NEON : GREY));
            setl(id(lbl_autophoto_state), ap ? "ON" : "off"); setc(id(lbl_autophoto_state), pend_on(4) ? PEND : (ap ? NEON : GREY));
            if (ta) { setl(id(lbl_takeover_state), "ENGAGED — you own outputs"); setc(id(lbl_takeover_state), pend_on(5) ? PEND : AMBER); bordc(id(takeover_card), AMBER); }
            else { setl(id(lbl_takeover_state), "tap to engage"); setc(id(lbl_takeover_state), 0x8A929C); bordc(id(takeover_card), BORD); }

            auto stv = [&](lv_obj_t* L, bool on, int op){

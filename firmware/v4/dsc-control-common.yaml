                        border_color: 0x00E676
                        border_width: 1
                        radius: 6
                        shadow_width: 0
                        widgets:
                          - label: {text: "+", text_font: f_med, align: CENTER, text_color: 0x00E676}
                        on_click:
                          - script.execute:

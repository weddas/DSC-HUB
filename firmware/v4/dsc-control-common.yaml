        - label: {id: lbl_co2, text: "CO2 --- ppm", text_font: f_body, align: TOP_RIGHT, x: -12, y: 11, text_color: 0xC0C6CC}

        # env cards
        - obj:
            id: card2x4
            x: 8
            y: 40
            width: 98
            height: 52
            styles: card
            scrollable: false
            widgets:
              - label: {text: "2x4", text_font: f_small, align: TOP_LEFT, text_color: 0x8A929C}
              - label: {id: lbl_2x4, text: "--", text_font: f_body, align: BOTTOM_LEFT, text_color: 0xFFFFFF}
        - obj:
            id: card4x8
            x: 111
            y: 40
            width: 98
            height: 52
            styles: card
            scrollable: false
            widgets:
              - label: {text: "4x8", text_font: f_small, align: TOP_LEFT, text_color: 0x8A929C}
              - label: {id: lbl_4x8, text: "--", text_font: f_body, align: BOTTOM_LEFT, text_color: 0xFFFFFF}
        - obj:
            id: cardroom
            x: 214
            y: 40
            width: 98
            height: 52
            styles: card
            scrollable: false
            widgets:
              - label: {text: "ROOM", text_font: f_small, align: TOP_LEFT, text_color: 0x8A929C}
              - label: {id: lbl_room, text: "--", text_font: f_body, align: BOTTOM_LEFT, text_color: 0xFFFFFF}

        # escalation ladder + 1h VPD sparkline (ring → unicode blocks in lbl_spark)
        # Tap a rung → page_ladder_detail; tap a row → page_power_detail.
        - label: {text: "ESCALATION LADDER  ·  tap a rung", text_font: f_small, align: TOP_LEFT, x: 10, y: 98, text_color: 0x8A929C}
        - label: {id: lbl_spark, text: "VPD —", text_font: f_small, align: TOP_RIGHT, x: -12, y: 98, text_color: 0x5A6472}

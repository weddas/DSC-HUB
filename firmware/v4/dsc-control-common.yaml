              if (t == 0) return false;
              if (millis() - t > 8000u) { id(pend_ms)[op] = 0; return false; }
              return true;
            };
            auto vpdlbl = [&](lv_obj_t* L, float v, int op){
              if (isnan(v)) { setl(L, "--"); return; }
              char q[16]; snprintf(q, sizeof(q), "%.2f", v); setl(L, q);
              setc(L, pend_on(op) ? PEND : NEON);

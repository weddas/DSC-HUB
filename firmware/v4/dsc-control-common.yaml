text_sensor:
  - platform: template
    id: sel_stage
    internal: true
    update_interval: 2s
    lambda: |-
        const char* o[]={"Germination","Seedling","Early Vegetative","Vegetative","Late (Push) Vegetative","Early Flowering","Flowering","Late Flowering","Final 48-72h Flowering","Dry Mode","Off"}; int i=id(gv_stage); return std::string(i>=0&&i<11?o[i]:"--");
  # pot plant-name labels (hub relays via 0xD4 from pot HA entities)
  - platform: template
    id: p1_plant
    internal: true
    update_interval: 2s
    lambda: 'return id(gv_plant1);'
  - platform: template
    id: p2_plant
    internal: true
    update_interval: 2s
    lambda: 'return id(gv_plant2);'
  - platform: template

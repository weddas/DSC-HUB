                  radius: 6
                  shadow_width: 0
                  widgets:
                    - label: {text: "\U000F004D", text_font: mdi_22, align: CENTER, text_color: 0xFFFFFF}
                  on_click:
                    - lvgl.page.show: page_control
              - label: {text: "Panel & System", text_font: f_med, align: CENTER, text_color: 0xFFFFFF}
              - label: {text: "\U000F0493", text_font: mdi_16, align: RIGHT_MID, x: -8, text_color: 0x3A4550}
        - obj:
            id: set_panel_scroll
            x: 0

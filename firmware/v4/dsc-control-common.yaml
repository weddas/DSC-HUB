            vpdlbl(id(s_vmin_val), id(t_main_vpd_min).state, 31);
            vpdlbl(id(s_vmax_val), id(t_main_vpd_max).state, 32);
            vpdlbl(id(s_cvmin_val), id(t_clone_vpd_min).state, 38);
            vpdlbl(id(s_cvmax_val), id(t_clone_vpd_max).state, 39);
          }

          // ---- Per-device power (page_power_detail) ----
          if (pwr_det) {
            auto pend_on = [&](int op)->bool{
              if (op < 0 || op >= 64) return false;
              uint32_t t = id(pend_ms)[op];
              if (t == 0) return false;
              if (millis() - t > 8000u) { id(pend_ms)[op] = 0; return false; }
              return true;
            };
            int d = id(power_detail_dev);
            static const char* DN[10] = {
              "6\" exhaust (out)", "6\" exhaust (room)", "4\" intake (main)", "2x4 intake fan",
              "Humidifier", "Dehumidifier", "Heater", "AC", "Grow mat", "Clone humidifier"
            };
            static const char* DIC[10] = {
              "\U000F0210", "\U000F0210", "\U000F11DC", "\U000F11DC",
              "\U000F1099", "\U000F150C", "\U000F0238", "\U000F0717", "\U000F1AAF", "\U000F1099"
            };
            bool is_fan = (d >= 0 && d < 4);
            if (d >= 0 && d < 10) {
              setl(id(lbl_pwr_title), DN[d]);
              setl(id(lbl_pwr_ic), DIC[d]);
            }
            sethid(id(pwr_speed_row), !is_fan);
            sethid(id(btn_pwr_demand), is_fan);
            sethid(id(pwr_cool_row), is_fan);

            if (is_fan) {
              float fpct[4] = {fan_out_pct, fan_recirc_pct, fan_int_main_pct, fan_int_clone_pct};
              int fop[4] = {25, 26, 27, 28};
              float v = fpct[d];
              bool on = !isnan(v) && v > 0;
              if (isnan(v)) {
                setl(id(lbl_pwr_status), "idle");
                setl(id(lbl_pwr_speed), "--");
              } else {
                snprintf(b, sizeof(b), on ? "running · %d%%" : "idle · %d%%", (int)v);
                setl(id(lbl_pwr_status), b);
                snprintf(b, sizeof(b), "%d%%", (int)v);
                setl(id(lbl_pwr_speed), b);
                setc(id(lbl_pwr_speed), pend_on(fop[d]) ? PEND : (on ? CYAN : GREY));
              }
              setl(id(lbl_pwr_fire), "—");
              setc(id(lbl_pwr_status), on ? CYAN : GREY);
            } else if (d >= 4 && d < 10) {
              int ai = d - 4;
              bool aon[6] = {dem_hum, dem_dehum, dem_heater, dem_ac, dem_mat, dem_clone_hum};
              float afire[6] = {cd_hum, cd_dehum, cd_heater, cd_ac, cd_mat, cd_clone_hum};
              static const int OPS[6] = {12, 13, 14, 16, 15, 17};
              if (aon[ai]) {
                uint32_t ms = id(dem_on_ms)[ai];
                uint32_t sec = ms ? (millis() - ms) / 1000u : 0;
                if (sec >= 60) snprintf(b, sizeof(b), "ON · %um", (unsigned)(sec / 60u));
                else snprintf(b, sizeof(b), "ON · %us", (unsigned)sec);
                setc(id(lbl_pwr_status), AMBER);
              } else {
                strcpy(b, "off");
                setc(id(lbl_pwr_status), GREY);
              }
              setl(id(lbl_pwr_status), b);
              setl(id(lbl_pwr_dem), aon[ai] ? "ON" : "off");
              setc(id(lbl_pwr_dem), pend_on(OPS[ai]) ? PEND : (aon[ai] ? NEON : GREY));
              if (!isnan(afire[ai]) && afire[ai] > 0)
                snprintf(b, sizeof(b), "in %ds", (int)afire[ai]);
              else strcpy(b, "—");
              setl(id(lbl_pwr_fire), b);
              if (!isnan(cool[ai]) && cool[ai] > 0) {
                setl(id(lbl_pwr_cool_l), (ai == 1 || ai == 3) ? "Compressor lock" : "Min-off");
                if (ai == 1 || ai == 3) snprintf(b, sizeof(b), "lock %ds", (int)cool[ai]);
                else snprintf(b, sizeof(b), "min-off %ds", (int)cool[ai]);
              } else strcpy(b, "—");
              setl(id(lbl_pwr_cool), b);
            }
          }

# ==================================================================
#  PERIODIC REFRESH
# ==================================================================
interval:
  # v5.1.2 — drain coalesced paints once touch/hold guard is clear.
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              return id(boot_ui_ready)
                  && id(ui_dirty)
                  && !id(holding)
                  && millis() >= id(touch_guard_until);
          then:
            - script.execute: refresh_ui
  # v4.0.11 — 5 s page-gated refresh; UI reads gv_* live (mirrors parked).
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(boot_ui_ready);'
          then:
            - script.execute: refresh_ui
  # Nest/mesh can hop 2.4 GHz without a reconnect — keep wifi_channel fresh
  # so Connections + alert strip catch ESP-NOW splits without waiting for
  # on_connect.
  - interval: 30s
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;
          int ch = (int) w->get_wifi_channel();
          if (ch <= 0) return;
          if (id(wifi_channel) != 0 && id(wifi_channel) != ch) {
            id(wifi_channel_hopped) = true;
            ESP_LOGW("wifi", "channel hop %d -> %d (ESP-NOW needs hub on same ch)", id(wifi_channel), ch);
          }
          id(wifi_channel) = ch;

  # ---- ESP-NOW silent recovery ladder (temp until dedicated router) ----
  # Hub 5.1.9+: vitals ~10s (large cadence) + 0xD0 ~10s (medium). If glass
  # hears nothing:
  #   15s → hello ping (hub echoes vitals — API/session nudge)
  #   45s → WiFi bounce (rebind HA API + rejoin preferred BSSID)
  #   120s → safe_reboot (cap 2/boot)
  # v5.1.16 — suspended while fix_active: Fleet Fix drives its own hello/
  # WiFi-bounce sequence and must be the only thing touching the radio.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u || !id(boot_ui_ready) || id(fix_active)) return false;
              uint32_t age = (id(gv_hub_last) == 0) ? millis() : (millis() - id(gv_hub_last));
              if (age < 15000u) { id(link_rec_stage) = 0; return false; }
              if (id(link_rec_last_action) != 0 && (millis() - id(link_rec_last_action)) < 20000u)
                return false;
              return age >= 15000u && id(link_rec_stage) < 1;
          then:
            - lambda: |-
                id(link_rec_stage) = 1;
                id(link_rec_last_action) = millis();
                ESP_LOGW("link", "ESP-NOW silent — hello ping to hub");
            - script.execute:
                id: hub_cmd
                op: 57
                val: 0
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u || !id(boot_ui_ready) || id(fix_active)) return false;
              uint32_t age = (id(gv_hub_last) == 0) ? millis() : (millis() - id(gv_hub_last));
              if (id(link_rec_last_action) != 0 && (millis() - id(link_rec_last_action)) < 20000u)
                return false;
              return age >= 45000u && id(link_rec_stage) < 2 && id(link_rec_wifi_bounces) < 3;
          then:
            - lambda: |-
                id(link_rec_stage) = 2;
                id(link_rec_wifi_bounces) = id(link_rec_wifi_bounces) + 1;
                id(link_rec_last_action) = millis();
                ESP_LOGW("link", "ESP-NOW silent — WiFi bounce #%d (API rebind + AP rejoin)",
                         id(link_rec_wifi_bounces));
            - script.execute: link_wifi_bounce
      - if:
          condition:
            lambda: |-
              if (millis() < 90000u || !id(boot_ui_ready) || id(fix_active)) return false;
              // BUG-FIX 2026-08-02: never escalate to reboot when the hub was
              // NEVER heard this boot (gv_hub_last==0). The 2/boot cap lives
              // in RAM, so with a persistently absent hub each reboot reset
              // the cap -> infinite reboot loop, glass unusable. Hello ping +
              // capped WiFi bounces still run above; the panel then stays up
              // with its UI (and diagnostics) available. Reboot remains for a
              // previously-good ESP-NOW session that went silent.
              if (id(gv_hub_last) == 0) {
                static uint32_t nohub_log_ms = 0;
                if (millis() - nohub_log_ms > 300000u) {
                  nohub_log_ms = millis();
                  ESP_LOGW("link", "hub never heard this boot — soft recovery only, no reboot");
                }
                return false;
              }
              uint32_t age = millis() - id(gv_hub_last);
              if (id(link_rec_last_action) != 0 && (millis() - id(link_rec_last_action)) < 20000u)
                return false;
              return age >= 120000u && id(link_rec_stage) >= 2 && id(link_rec_reboots) < 2;
          then:
            - lambda: |-
                id(link_rec_reboots) = id(link_rec_reboots) + 1;
                id(link_rec_stage) = 3;
                id(link_rec_last_action) = millis();
                ESP_LOGE("link", "ESP-NOW silent after WiFi bounce — safe_reboot #%d",
                         id(link_rec_reboots));
            - script.execute: link_recovery_reboot

  # BUG-FIX 2026-08-02: presence keepalive — see hub_keepalive script.
  # 15s beat (hub panel-silence stage-1 threshold is 45s) once the UI is
  # up and the hub has been heard this boot. Keeps beating through a hub
  # quiet spell so panel_last_ms re-stamps the moment it returns.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return id(boot_ui_ready) && id(gv_hub_last) != 0;'
          then:
            - script.execute: hub_keepalive

  # 1h VPD micro-trend: one sample / 5 min → 12 slots; unicode sparkline in lbl_spark.
  - interval: 300s
    then:
      - lambda: |-
          float v = id(gv_tent_vpd);
          if (isnan(v)) v = id(gv_clone_vpd);
          if (isnan(v)) return;
          int i = id(spark_idx);
          id(spark_vpd)[i] = v;
          id(spark_idx) = (i + 1) % 12;
          if (id(spark_idx) == 0) id(spark_filled) = true;

  # RF status card to the hub (0xD5) — 10s while WiFi is up (v5.1.16).
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(boot_ui_ready) && id(wifi_conn);'
          then:
            - script.execute: tx_rf_card

  # clock_valid: cheap (two is_valid() calls), polled here rather than a
  # binary_sensor lambda — this codebase's binary_sensor.template has no
  # update_interval, so a lambda there would run every loop() instead.
  - interval: 15s
    then:
      - lambda: |-
          bool cv = id(sntp_time).now().is_valid() || id(ha_time).now().is_valid();
          if (cv != id(clock_valid)) {
            id(clock_valid) = cv;
            id(clock_valid_bs).publish_state(cv);
          }

            ic(id(ic_csf),  pon(sf_target),        AMBER);
            ic(id(ic_cint), pon(fan_int_clone_pct), CYAN);
            ic(id(ic_chum), dem_clone_hum,          CYAN);
            ic(id(ic_cmat), dem_mat,               ORANGE);

      widgets:
        - obj:
            # v4.0.2 — the tab bar lives on LVGL's top_layer at y=200..240 and
            # is never hidden, so it sits over every page unconditionally. This
            # container was 240 px tall with no bottom padding, which means its
            # viewport AND its AUTO scrollbar both ran the full height of the
            # screen and the bottom 40 px of both were permanently behind the
            # bar. Scrolled to the end, the last row landed 17 px under it —
            # "Vertical scroller and last chip is cut off by tabs". Clipping
            # the viewport to 200 makes the scroll range end exactly where the
            # bar begins; pad_bottom keeps the last row off the edge.

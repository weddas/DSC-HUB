    lambda: 'return (id(gv_flt)&32);'
  - platform: template
    id: lights_clone
    internal: true
    # gv_flt bit 64 = clone_lights_on
    lambda: 'return (id(gv_flt)&64);'
  - platform: template
    id: fault_climate
    internal: true
    lambda: 'return (id(gv_flt)&1);'
  - platform: template
    id: fault_aux
    internal: true
    lambda: 'return (id(gv_flt)&6);'

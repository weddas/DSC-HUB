# ==================================================================
#  DSC-HUB — device stub (lab / existing bench)
#  ------------------------------------------------------------------
#  Secrets + MAC/tag stay here. Logic: dsc-hub-v4_0.yaml
#  Panel ESP-NOW layer: dsc-hub-espnow-primary.yaml (sibling package).
#
#  Local:  esphome run dsc-hub.yaml
#  Kit SoftAP setup: esphome run dsc-hub-kit.yaml
#  HA:     homeassistant/esphome/dsc-hub.yaml (git-pulls both bodies)
# ==================================================================

substitutions:
  name: dsc-hub
  friendly_name: DSC-HUB
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  # .33 occupied by non-fleet host — studio cutover reservation
  lan_ip: "192.168.86.180"
  api_key_val: !secret dsc_hub_api_key
  ota_password_val: !secret dsc_hub_ota_password
  ap_password_val: !secret dsc_hub_ap_password
  # ESP-NOW parked (studio Wi-Fi / HA bus). Keys kept for kit SoftAP builds.
  espnow_key: !secret espnow_key
  panel_mac: "30:76:F5:E9:22:0C"
  bridge_mac: "58:2A:BD:60:3C:1D"
  espnow_cmd_tag: "54727"
  wifi_bssid: "00:00:00:00:00:00"

packages:
  wifi: !include dsc-hub-wifi-lab.yaml
  hub: !include dsc-hub-v4_0.yaml
  fleet_heal: !include dsc-hub-fleet-heal.yaml
  # ESP-NOW TX parked — no-op scripts so hub body still compiles.
  # Real radio: dsc-hub-espnow-primary.yaml (kit SoftAP only).
  espnow_parked: !include dsc-hub-espnow-parked.yaml
  # Kit SoftAP: dsc-hub-kit.yaml → dsc-fleet-setup-hub.yaml

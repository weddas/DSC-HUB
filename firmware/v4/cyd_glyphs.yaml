# v4.0.2 — U+2014 EM DASH added. It was already being emitted from four
# LVGL label defaults (conn_wifi_sub, conn_api_sub, the Bluetooth and
# ESP-NOW value columns) and from four C++ lambdas in refresh_ui (the
# empty-plant "P%d · %s" fallback, "N/P/K —", the empty-SSID fallback and
# "ENGAGED — you own outputs") — but it was never declared here, so LVGL
# drew the missing-glyph box for every one of them. That is every □ in
# the 26 Jul panel photos; no MDI icon was ever missing. Glyph bitmaps

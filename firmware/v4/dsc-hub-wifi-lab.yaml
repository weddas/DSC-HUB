# ==================================================================
#  DSC-HUB · lab WiFi (compile-time SSID from secrets)
# ==================================================================
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  power_save_mode: none
  # Rejoin known AP without a full scan. HA "hub offline" is usually an
  # API session blip (Control/ESP-NOW still fine); fast_connect just
  # shortens real STA drops.
  fast_connect: true
  ap:
    ssid: DSC-HUB Fallback Hotspot
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          static int last_ch = 0;
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (last_ch != 0 && last_ch != ch)
              ESP_LOGW("wifi", "channel hop %d -> %d — panel ESP-NOW will drop until it follows", last_ch, ch);
            else
              ESP_LOGI("wifi", "STA channel %d", ch);
            last_ch = ch;
          }
        }


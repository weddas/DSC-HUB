# ==================================================================
#  DSC-HUB · lab WiFi (Digital-Emotions Studio · HA bus cutover)
#
#  Studio 2.4 GHz STA on house LAN. SoftAP/ESP-NOW parking — no
#  DSC-Anchor membership. Fallback hotspot for USB recovery only.
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 20
      manual_ip:
        static_ip: ${lan_ip}
        gateway: 192.168.86.1
        subnet: 255.255.255.0
        dns1: 192.168.86.1
  power_save_mode: none
  fast_connect: false
  # Off-channel roam scans still thrash STA; keep off even without ESP-NOW.
  post_connect_roaming: false
  use_address: ${lan_ip}
  ap:
    ssid: DSC-HUB Fallback Hotspot
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          int ch = (int) w->get_wifi_channel();
          if (ch > 0)
            ESP_LOGI("wifi", "STA channel %d (studio LAN)", ch);
        }


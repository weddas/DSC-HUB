# ==================================================================
#  DSC-HUB · lab WiFi (compile-time SSID from secrets)
#
#  AP PIN: prefer ${wifi_bssid} so hub / Control / pots land on the same
#  Nest point. 00:00:00:00:00:00 = any AP on the SSID (fallback network).
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      bssid: ${wifi_bssid}
      priority: 10
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 0
  power_save_mode: none
  # false: Lock WiFi AP / preferred BSSID needs a scan to leave a sticky
  # Nest point. fast_connect rejoined the wrong AP after bounce (3 Aug).
  fast_connect: false
  ap:
    ssid: DSC-HUB Fallback Hotspot
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          static int last_ch = 0;
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (last_ch != 0 && last_ch != ch)
              ESP_LOGW("wifi", "channel hop %d -> %d — panel ESP-NOW will drop until it follows", last_ch, ch);
            else
              ESP_LOGI("wifi", "STA channel %d", ch);
            last_ch = ch;
          }
        }
    # Every STA connect / recovery boot — learn/pin preferred Nest BSSID.
    - script.execute: wifi_ap_learn_or_pin

captive_portal:

# ==================================================================
#  DSC-HUB · lab WiFi (recovery / Nest-first)
#
#  SoftAP-primary orphaned the hub when SoftAP join failed and Nest
#  entries were also pinned to wifi_bssid 00:00:00:00:00:00.
#  Nest is primary again until SoftAP eth↔.4.x path is proven.
#  SoftAP remains a secondary (no BSSID pin unless wifi_bssid is set).
# ==================================================================
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 20
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      priority: 10
      manual_ip:
        static_ip: 192.168.4.10
        gateway: 192.168.4.1
        subnet: 255.255.255.0
        dns1: 192.168.4.1
  power_save_mode: none
  fast_connect: false
  post_connect_roaming: false
  # Nest DHCP for HA Install/USB. Do not set use_address to SoftAP .4.10
  # until SoftAP IP gate passes (orphans Install toward a dead path).
  ap:
    ssid: DSC-HUB Fallback Hotspot
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          static int last_ch = 0;
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (last_ch != 0 && last_ch != ch)
              ESP_LOGW("wifi", "channel hop %d -> %d — panel ESP-NOW will drop until it follows", last_ch, ch);
            else
              ESP_LOGI("wifi", "STA channel %d", ch);
            last_ch = ch;
          }
        }
    - script.execute: wifi_ap_learn_or_pin

captive_portal:

# ==================================================================
#  DSC-HUB · lab WiFi
#
#  SoftAP DSC-Anchor is primary (fleet home + ESP-NOW channel pin).
#  Nest/home is emergency fallback only. SoftAP NAPT on ETH01 provides
#  the path to HA (see SoftAP fleet-star design). Static SoftAP IP
#  192.168.4.10 — HA needs route 192.168.4.0/24 via bridge ETH.
# ==================================================================
wifi:
  networks:
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      bssid: ${wifi_bssid}
      priority: 20
      manual_ip:
        static_ip: 192.168.4.10
        gateway: 192.168.4.1
        subnet: 255.255.255.0
        dns1: 192.168.4.1
    - ssid: ${anchor_ssid}
      password: ${anchor_ap_password}
      priority: 15
      manual_ip:
        static_ip: 192.168.4.10
        gateway: 192.168.4.1
        subnet: 255.255.255.0
        dns1: 192.168.4.1
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      bssid: ${wifi_bssid}
      priority: 5
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 0
  power_save_mode: none
  # false: Lock WiFi AP / preferred BSSID needs a scan to leave a sticky
  # AP. fast_connect rejoined the wrong AP after bounce (3 Aug).
  fast_connect: false
  # ESPHome default true: every 5 min (RSSI < -49) off-channel roam scan
  # while STA stays "connected". That hops the single radio off the
  # pinned channel and kills ESP-NOW. Lock + preferred BSSID pin the
  # Anchor point — roaming fights that pin.
  post_connect_roaming: false
  # SoftAP fleet-home address (Nest fallback still uses DHCP).
  use_address: 192.168.4.10
  ap:
    ssid: DSC-HUB Fallback Hotspot
    password: ${ap_password_val}
  on_connect:
    - lambda: |-
        auto *w = wifi::global_wifi_component;
        if (w != nullptr) {
          static int last_ch = 0;
          int ch = (int) w->get_wifi_channel();
          if (ch > 0) {
            if (last_ch != 0 && last_ch != ch)
              ESP_LOGW("wifi", "channel hop %d -> %d — panel ESP-NOW will drop until it follows", last_ch, ch);
            else
              ESP_LOGI("wifi", "STA channel %d", ch);
            last_ch = ch;
          }
        }
    # Every STA connect / recovery boot — learn/pin preferred Anchor BSSID.
    - script.execute: wifi_ap_learn_or_pin


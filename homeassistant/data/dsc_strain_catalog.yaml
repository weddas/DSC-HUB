# or python scripts/promote_customs_to_yaml.py <ha-states.json>

seeds:
  - id: generic_photoperiod
    name: Generic Photoperiod
    type: photo
    want:
      ph: [5.8, 6.5]
      ec_veg_us: [1000, 1600]
      ec_flower_us: [1600, 2400]
      moisture_pct: [45, 70]

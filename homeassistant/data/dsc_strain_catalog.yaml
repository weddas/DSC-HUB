    name: Generic Autoflower
    type: auto
    want:
      ph: [5.8, 6.5]
      ec_veg_us: [800, 1400]
      ec_flower_us: [1400, 2000]
      moisture_pct: [45, 70]

custom_slots: 5
note: Got = raw + offset. Peer baseline script sets offsets to median.

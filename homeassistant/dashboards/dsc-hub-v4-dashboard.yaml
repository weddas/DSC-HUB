  - title: Trends
    icon: mdi:chart-multiline
    path: trends
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 🧠 THE RESPONSE STACK — source → fans → result
            heading_style: title
          - type: custom:plotly-graph
            title: Disturbance propagation — 24 h
            hours_to_show: 24
            refresh_interval: 300
            layout:
              height: 620
              hovermode: x unified
              grid:
                rows: 3
                columns: 1
                pattern: independent
              yaxis:
                title: Source °C
              yaxis2:
                title: Fan %
                range:
                  - 0
                  - 100
              yaxis3:
                title: Tent °C
            entities:
              - entity: sensor.dsc_hub_room_temperature
                name: Room °C
                yaxis: y1
              - entity: sensor.dsc_hub_clone_temperature
                name: 2x4 °C
                yaxis: y1
              - entity: sensor.dsc_fan_intake_main_pct
                name: In 4x8 %
                yaxis: y2
                line:
                  shape: hv
              - entity: sensor.dsc_fan_intake_2x4_pct
                name: In 2x4 %
                yaxis: y2
                line:
                  shape: hv
              - entity: sensor.dsc_fan_exhaust_room_pct
                name: Ex Room %
                yaxis: y2
                line:
                  shape: hv
              - entity: sensor.dsc_fan_exhaust_outside_pct
                name: Ex Out %
                yaxis: y2
                line:
                  shape: hv
              - entity: sensor.dsc_hub_tent_temperature
                name: 4x8 °C
                yaxis: y3
              - entity: number.dsc_hub_target_temp
                name: Target
                yaxis: y3
                line:
                  dash: dot
          - type: markdown
            content: >-
              *v2.4 reading note: the 2x4 trace now carries the **SF1000's
              waste heat**. A daily bump in the top panel that lines up with
              the clone sunrise is the lamp, not a fault — and it is exactly
              the heat the 4x8 borrows through the chain at night.*
          - type: heading
            heading: 🎛️ THE TRANSFER FUNCTION — the controller, drawn by data
            heading_style: subtitle
          - type: custom:plotly-graph
            title: Fan % vs temp error — 48 h
            hours_to_show: 48
            refresh_interval: 300
            layout:
              height: 420
              xaxis:
                title: Temp error °C (tent − target)
              yaxis:
                title: Exhaust %
                range:
                  - 0
                  - 100
            entities:
              - entity: sensor.dsc_main_temp_error
                internal: true
                fn: >-
                  $fn ({ xs, ys, vars }) => { vars.errYs = ys; vars.errXs = xs;
                  }
              - entity: sensor.dsc_fan_exhaust_outside_pct
                name: Exhaust vs error
                mode: markers
                marker:
                  size: 5
                  opacity: 0.55
                fn: |-
                  $fn ({ xs, ys, vars }) => {
                    const ex = vars.errXs || [], ey = vars.errYs || [];
                    const outX = [], outY = [];
                    let j = 0;
                    for (let i = 0; i < xs.length; i++) {
                      while (j < ex.length - 1 && ex[j + 1] <= xs[i]) j++;
                      if (ey[j] !== undefined && ys[i] !== null) {
                        outX.push(ey[j]); outY.push(ys[i]);
                      }
                    }
                    return { x: outX, y: outY };
                  }
          - type: markdown
            content: >-
              *Read the scatter: clean S-curve = healthy loop · two separated
              bands = hysteresis · flat gap = dead zone · smeared blob =
              short-cycling. This is the v2.4 tuning instrument — change a band
              on **Climate Engine → Live Tunables**, watch the cloud tighten.
              No reflash between attempts, which is the whole point of the
              runtime tunables.*
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 🔍 FORENSICS
            heading_style: title
          # v2.4: new chart. The mat's closed loop is the headline change of
          # this version and it needs an audit view — "did the band actually
          # hold the soil?" should be answerable from one picture.
          - type: custom:plotly-graph
            title: Root zone vs mat runs vs the band — 48 h
            hours_to_show: 48
            refresh_interval: 300
            layout:
              height: 360
              hovermode: x unified
              yaxis:
                title: °C
              yaxis2:
                overlaying: "y"
                side: right
                range:
                  - 0
                  - 1
                visible: false
            entities:
              # BUG-FIX 2026-08-02: coldest voted root, not POT1
              - entity: sensor.dsc_coldest_root_zone_temp
                name: Root zone
              - entity: sensor.dsc_hub_clone_temperature
                name: Clone air
                line:
                  dash: dot
                  width: 1
              - entity: number.dsc_hub_mat_root_zone_low
                name: Band low
                line:
                  dash: dash
              - entity: number.dsc_hub_mat_root_zone_high
                name: Band high
                line:
                  dash: dash
              - entity: switch.dsc_hub_grow_mat_demand
                name: Mat
                yaxis: y2
                fill: tozeroy
                line:
                  shape: hv
                  width: 0
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
          - type: markdown
            content: >-
              *The v2.4 acceptance test, in one chart. **Root zone should live
              between the dashed lines**; mat blocks should be long and few,
              not short and many. If root zone tracks the dotted air line
              instead, the probe is blind and you are back on v2.3 behaviour —
              check Root-Zone Sensor Fault.*
          - type: custom:plotly-graph
            title: 4x8 temp with heater/AC run shading — 48 h
            hours_to_show: 48
            refresh_interval: 300
            layout:
              height: 340
              hovermode: x unified
              yaxis:
                title: °C
              yaxis2:
                overlaying: "y"
                side: right
                range:
                  - 0
                  - 1
                visible: false
            entities:
              - entity: sensor.dsc_hub_tent_temperature
                name: Tent °C
              - entity: number.dsc_hub_target_temp
                name: Target
                line:
                  dash: dot
              - entity: switch.dsc_hub_heater_demand
                name: Heater
                yaxis: y2
                fill: tozeroy
                line:
                  shape: hv
                  width: 0
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
              - entity: switch.dsc_hub_ac_demand
                name: AC
                yaxis: y2
                fill: tozeroy
                line:
                  shape: hv
                  width: 0
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
          - type: custom:plotly-graph
            title: 4x8 RH with hum/dehum run shading — 48 h
            hours_to_show: 48
            refresh_interval: 300
            layout:
              height: 340
              hovermode: x unified
              yaxis:
                title: "%RH"
              yaxis2:
                overlaying: "y"
                side: right
                range:
                  - 0
                  - 1
                visible: false
            entities:
              - entity: sensor.dsc_hub_tent_humidity
                name: RH
              - entity: switch.dsc_hub_humidifier_demand
                name: Hum
                yaxis: y2
                fill: tozeroy
                line:
                  shape: hv
                  width: 0
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
              - entity: switch.dsc_hub_dehumidifier_demand
                name: Dehum
                yaxis: y2
                fill: tozeroy
                line:
                  shape: hv
                  width: 0
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
          - type: custom:plotly-graph
            title: VPD overlay — both tents vs stage band, 48 h
            hours_to_show: 48
            refresh_interval: 300
            layout:
              height: 340
              hovermode: x unified
              yaxis:
                title: kPa
            entities:
              - entity: sensor.dsc_hub_vpd_kpa
                name: 4x8 VPD
              - entity: sensor.dsc_hub_clone_vpd_kpa
                name: 2x4 VPD
              - entity: number.dsc_hub_vpd_target_min
                name: Band min
                line:
                  dash: dot
              - entity: number.dsc_hub_vpd_target_max
                name: Band max
                line:
                  dash: dot
          - type: heading
            heading: 📓 GROW DIARY — Event Scribe
            heading_style: subtitle
          - type: custom:logbook-card
            title: Grow log
            entity: input_boolean.dsc_event_log
            history: 7
            desc: true
            show:
              state: false
              duration: false
              start_date: true
            custom_logs: true
          - type: markdown
            content: >-
              *Recorder tip: default `purge_keep_days: 10` is short for a full
              grow. Prefer ~120 days (or export the grow log) so diary entries
              survive the cycle — see NOTES-COMMENTS.md §4.*

  - title: System
    icon: mdi:cog
    path: system
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:home
                icon_color: teal
                content: Back to Home
                tap_action:
                  action: navigate
                  navigation_path: /dsc-hub-pro/home
          - type: heading
            heading: 👑 HUB HEALTH
            heading_style: title
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: sensor.dsc_fleet_version_status
                icon: mdi:clipboard-check
                icon_color: >-
                  {% set s = states(entity) %}
                  {{ 'green' if s == 'ok' else 'amber' if s == 'warn' else 'red' }}
                content: >-
                  FLEET {{ states(entity)|upper }} · expect {{ state_attr(entity,'expected') or '5.1.0' }}
              - type: entity
                entity: sensor.dsc_ha_surface_version
              - type: conditional
                conditions:
                  - entity: sensor.dsc_hub_sync_sha
                    state_not: unavailable
                chip:
                  type: entity
                  entity: sensor.dsc_hub_sync_sha
          - type: custom:expander-card
            title: 🏷️ Fleet version table
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: markdown
                content: >-
                  | Layer | Reported |
                  |---|---|
                  | Expected | `{{ state_attr('sensor.dsc_fleet_version_status','expected') or '5.1.0' }}` |
                  | HA surface | `{{ states('sensor.dsc_ha_surface_version') }}` |
                  | Sync SHA | `{{ states('sensor.dsc_hub_sync_sha') }}` |
                  | Hub | `{{ states('sensor.dsc_hub_firmware_version') }}` |
                  | Panel | `{{ states('sensor.dsc_control_firmware_version') }}` |
                  | Pot1–4 | `{{ states('sensor.dsc_pot1_firmware_version') }}` /
                    `{{ states('sensor.dsc_pot2_firmware_version') }}` /
                    `{{ states('sensor.dsc_pot3_firmware_version') }}` /
                    `{{ states('sensor.dsc_pot4_firmware_version') }}` |
                  | Heater / Mat | `{{ states('sensor.dsc_heater_firmware_version') }}` /
                    `{{ states('sensor.dsc_heatmat_firmware_version') }}` |
                  | Hum / Dehum | `{{ states('sensor.dsc_humidifier_firmware_version') }}` /
                    `{{ states('sensor.dsc_de_humidifier_firmware_version') }}` |
                  | ESPHome (hub) | `{{ states('sensor.dsc_hub_esphome_version') }}` |
              - type: entities
                entities:
                  - entity: input_text.dsc_expected_release
                    name: Expected release tag
              - type: markdown
                content: >-
                  *Expected train: **`5.1.x`**. HA surface **5.1.3** + hub **5.1.3**
                  for in-service / OOS ladder. **Sync ≠ flash** — after git/Sync,
                  ESPHome **Install** each device that needs the binary (hub for
                  OOS; Control/pots if still on old `fast_connect` / reboot_timeout).*
          - type: entities
            entities:
              - entity: binary_sensor.dsc_hub_link
                name: HA ↔ Hub Link (alias)
              - entity: sensor.dsc_hub_firmware_version
                name: Firmware
              - entity: sensor.dsc_hub_uptime
                name: Uptime
              - entity: sensor.dsc_hub_wifi_rssi
                name: WiFi RSSI
              - entity: sensor.dsc_hub_ip_address
                name: IP
              - entity: binary_sensor.dsc_hub_emergency_failsafe
                name: Emergency failsafe (>35°C)
              - entity: binary_sensor.dsc_hub_climate_sensor_fault
                name: Climate sensor fault
              - entity: binary_sensor.dsc_hub_aux_sensor_fault
                name: Aux sensor fault
              - entity: binary_sensor.dsc_hub_root_zone_sensor_fault
                name: Root-zone sensor fault
      # ================================================================
      #  v5.1: LINK & HEARTBEAT + WIFI AP PINNING — the new reliability
      #  surface. Heartbeat/handshake watch the API path; Lock WiFi AP
      #  pins the fleet to one BSSID on mesh networks (Nest AP fix).
      # ================================================================
      - type: grid
        cards:
          - type: heading
            heading: 💓 LINK & HEARTBEAT
            heading_style: title
          - type: custom:mushroom-template-card
            entity: sensor.dsc_hub_heartbeat
            primary: >-
              {% if states(entity) in ['unknown','unavailable'] %}Heartbeat — NO SIGNAL
              {% else %}Heartbeat {{ states(entity) }}{% endif %}
            secondary: >-
              {% set lc = states[entity].last_changed if states[entity] else none %}
              {% if lc %}last beat {{ relative_time(lc) }} ago —
              stale > 5 min triggers the watchdog alert{% else %}waiting for hub{% endif %}
            icon: mdi:heart-pulse
            icon_color: >-
              {% if states(entity) in ['unknown','unavailable'] %}red{% else %}green{% endif %}
            tap_action:
              action: more-info
            card_mod:
              style: |
                @keyframes dsc-beat {
                  0%, 100% { transform: scale(1); }
                  25% { transform: scale(1.15); }
                  40% { transform: scale(1); }
                }
                mushroom-shape-icon {
                  {% if states('sensor.dsc_hub_heartbeat') not in ['unknown','unavailable'] %}
                  animation: dsc-beat 1.6s ease-in-out infinite;
                  {% endif %}
                }
          - type: entities
            state_color: true
            entities:
              - entity: binary_sensor.dsc_hub_ha_link_status
                name: HA API link
              - entity: binary_sensor.dsc_hub_wifi_associated
                name: WiFi associated
              - entity: number.dsc_hub_ha_handshake
                name: HA handshake counter
              - entity: binary_sensor.dsc_hub_panel_link
                name: Panel ESP-NOW link
          - type: markdown
            content: >-
              *Handshake pings every few minutes; a wedged API with live WiFi
              for ≥5 min makes the hub NVS-sync and safe-reboot (max 2×/boot).
              ≥30 s of true offline safe-offs the Sonoffs from HA's side.*
          - type: heading
            heading: 📡 WIFI AP PINNING (v5.1)
            heading_style: subtitle
          - type: custom:expander-card
            title: 📌 Pin fleet to one AP — mesh roaming fix
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                entities:
                  - entity: switch.dsc_hub_lock_wifi_ap
                    name: Lock WiFi AP
                  - entity: sensor.dsc_hub_wifi_bssid
                    name: Current BSSID
                  - entity: text.dsc_hub_preferred_wifi_bssid
                    name: Preferred BSSID
                  - entity: button.dsc_hub_remember_current_wifi_ap
                    name: Remember current AP
                  - entity: button.dsc_hub_clear_preferred_wifi_ap
                    name: Clear preferred AP
              - type: markdown
                content: >-
                  *Lock broadcasts the pinned BSSID over ESP-NOW 0xD0 — pots
                  and the panel adopt it, so the whole fleet camps on one mesh
                  node instead of roaming mid-grow. A recovery ladder unpins
                  automatically if the AP disappears.*
          - type: custom:mini-graph-card
            name: WiFi RSSI — 24 h
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.dsc_hub_wifi_rssi
                name: Hub
              - entity: sensor.dsc_control_wifi_rssi
                name: Panel
            show:
              labels: true
              extrema: true
              legend: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: 📡 WiFi RSSI — 48h fleet
                  size: wide
                  content:
                    type: custom:apexcharts-card
                    graph_span: 48h
                    header:
                      show: true
                      title: RSSI (dBm) — pinned fleet should be flat lines
                      show_states: true
                    all_series_config:
                      extend_to: now
                      stroke_width: 2
                    apex_config:
                      chart:
                        height: 380
                    series:
                      - entity: sensor.dsc_hub_wifi_rssi
                        name: Hub
                        color: '#38bdf8'
                      - entity: sensor.dsc_control_wifi_rssi
                        name: Panel
                        color: '#a78bfa'
                      - entity: sensor.dsc_pot1_wifi_rssi
                        name: POT1
                        color: '#22c55e'
                      - entity: sensor.dsc_pot2_wifi_rssi
                        name: POT2
                        color: '#84cc16'
                      - entity: sensor.dsc_pot3_wifi_rssi
                        name: POT3
                        color: '#a3a3a3'
                      - entity: sensor.dsc_pot4_wifi_rssi
                        name: POT4
                        color: '#14b8a6'
      # ================================================================
      #  v5.1: PANEL HEALTH — the lean-cut glass. Heap fragmentation was
      #  the 4.0.x crash mode; free heap + largest block get a chart.
      # ================================================================
      - type: grid
        cards:
          - type: heading
            heading: 📱 DSC-CONTROL (PANEL)
            heading_style: title
          - type: custom:mushroom-template-card
            entity: binary_sensor.dsc_hub_panel_link
            primary: >-
              {% if is_state(entity,'on') %}Panel — ESP-NOW primary
              {% elif not is_state('sensor.dsc_control_wifi_rssi','unavailable') %}Panel — HA only (ESP-NOW hello missing)
              {% else %}Panel — OFFLINE{% endif %}
            secondary: >-
              Glass is vitals + coarse control since the 5.1.6 lean cut —
              every removed settings drill now lives on this dashboard
            icon: mdi:tablet-dashboard
            icon_color: >-
              {% if is_state(entity,'on') %}green
              {% elif not is_state('sensor.dsc_control_wifi_rssi','unavailable') %}amber
              {% else %}red{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: entities
            state_color: true
            entities:
              - entity: sensor.dsc_control_firmware_version
                name: Panel firmware
              - entity: sensor.dsc_control_wifi_rssi
                name: Panel WiFi RSSI
              - entity: binary_sensor.dsc_control_ha_link_status
                name: Panel HA link
              - entity: sensor.dsc_control_ambient_light_raw
                name: Ambient light (raw)
              - entity: light.dsc_control_backlight
                name: Backlight
              - entity: button.dsc_control_restart
                name: Restart panel
          - type: custom:mini-graph-card
            name: Panel heap — 24 h
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.dsc_control_panel_free_heap
                name: Free heap
              - entity: sensor.dsc_control_panel_largest_free_block
                name: Largest block
            show:
              labels: true
              extrema: true
              legend: true
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: 📱 Panel heap — 48h
                  size: wide
                  content:
                    type: custom:apexcharts-card
                    graph_span: 48h
                    header:
                      show: true
                      title: Free heap vs largest free block — fragmentation watch
                      show_states: true
                    all_series_config:
                      extend_to: now
                      stroke_width: 2
                    apex_config:
                      chart:
                        height: 380
                    series:
                      - entity: sensor.dsc_control_panel_free_heap
                        name: Free heap
                        color: '#22c55e'
                      - entity: sensor.dsc_control_panel_largest_free_block
                        name: Largest block
                        color: '#f59e0b'
          - type: markdown
            content: >-
              *Watch free heap **and** largest free block. Fragmentation
              (small largest block with "ok" free total) was the v4.0.1
              crash mode. ESP-NOW is primary — panel HA link may be down
              while the glass still drives the hub.*
          - type: custom:expander-card
            title: 🕐 Photoperiod windows
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                state_color: true
                entities:
                  - entity: binary_sensor.dsc_hub_4x8_window_open
                    name: 4x8 window (virtual — no lamp)
                  - entity: binary_sensor.dsc_hub_2x4_window_open
                    name: 2x4 window (SF1000)
                  - entity: light.dsc_hub_sf1000_dimmer
                    name: SF1000 actual
                  - entity: binary_sensor.dsc_clone_dark_period_violation
                    name: Clone dark-period violation
      - type: grid
        cards:
          - type: heading
            heading: 🌐 NODE FLEET
            heading_style: title
          # v2.4.1: per-pot ESP-NOW link truth. ON = that pot's readings are
          # arriving direct (<150s); OFF = the hub is riding its HA mirror.
          - type: entities
            title: ESP-NOW pot links (direct sensing path)
            state_color: true
            entities:
              - entity: binary_sensor.dsc_hub_pot1_esp_now_link
                name: POT1 direct link
              - entity: binary_sensor.dsc_hub_pot2_esp_now_link
                name: POT2 direct link
              - entity: binary_sensor.dsc_hub_pot3_esp_now_link
                name: POT3 direct link
              - entity: binary_sensor.dsc_hub_pot4_esp_now_link
                name: POT4 direct link
          - type: custom:auto-entities
            card:
              type: entities
              title: Appliance nodes (Sonoff)
              state_color: true
            filter:
              include:
                - entity_id: switch.dsc_heater_main_relay
                - entity_id: switch.dsc_heatmat_main_relay
                - entity_id: switch.dsc_humidifier_main_relay
                - entity_id: switch.dsc_de_humidifier_main_relay
                - entity_id: sensor.dsc_*_relay_on_time
                - entity_id: binary_sensor.dsc_*_test_mode
            sort:
              method: entity_id
          - type: custom:auto-entities
            card:
              type: entities
              title: Soil nodes (DSC-POT)
              state_color: true
            filter:
              include:
                - entity_id: sensor.dsc_pot?_wifi_rssi
                - entity_id: sensor.dsc_pot?_uptime
            sort:
              method: entity_id
          - type: custom:expander-card
            title: 🛡️ Node safety notes
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: markdown
                content: >-
                  *v4 node safety (Sonoffs still HA-actuated — no ESP-NOW on ESP8285):*


                  *• **`restore_mode: ALWAYS_OFF`** — a Sonoff that loses power
                  comes back OFF, never mid-demand. This is the runaway fix.*


                  *• **API-loss grace** — each node drops its relay after its own
                  grace window if the hub goes away: heater 60 s, heatmat/humidifier
                  90 s, dehumidifier 240 s (compressor). Tuned by consequence, not
                  by symmetry.*


                  *• **Test mode** — bounded to 10 minutes, physical button only.
                  The node ignores hub demand while it runs and auto-expires.*


                  *• **ESP-NOW pot links** — a grey link chip is not an
                  emergency: that pot is riding its HA mirror. Both paths dark for
                  5 min raises Root-Zone Sensor Fault and drops the mat to the
                  clone-air rung.*
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 🔧 ACTIONS
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: button.dsc_hub_restart
            name: Restart Hub (hold)
            icon: mdi:restart-alert
            icon_color: red
            tap_action:
              action: none
            hold_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.dsc_hub_restart
          - type: custom:mushroom-entity-card
            entity: input_boolean.dsc_event_log
            name: Event Scribe (grow log)
            icon: mdi:notebook-edit
            icon_color: green
          - type: heading
            heading: ⚠️ ALERT REGISTER
            heading_style: title
          - type: custom:auto-entities
            show_empty: true
            card:
              type: entities
              title: Grow / tank / hub alerts
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.dsc_hub_emergency_failsafe
                - entity_id: binary_sensor.dsc_hub_*_sensor_fault
                - entity_id: binary_sensor.dsc_clone_dark_period_violation
                - entity_id: binary_sensor.dsc_tank_*
                - entity_id: binary_sensor.dsc_pot*_moisture_out_of_range
                - entity_id: binary_sensor.dsc_pot*_ph_out_of_range
                - entity_id: binary_sensor.dsc_pot*_root_zone_temp_out_of_range
                - entity_id: binary_sensor.dsc_pot*_ec_*
                - entity_id: binary_sensor.dsc_pot*_nitrogen_*
              exclude:
                - entity_id: binary_sensor.dsc_hub_link
                - entity_id: binary_sensor.dsc_hub_ha_link_status
                - entity_id: binary_sensor.dsc_hub_*_window_open
                - entity_id: binary_sensor.dsc_hub_pot*_esp_now_link
            sort:
              method: state
              reverse: true

                      {% elif is_state('switch.dsc_hub_clone_humidifier_demand','on') %}
                      box-shadow: 0 0 14px rgba(56,189,248,0.5);
                      {% endif %}
                    }
          - type: heading
            heading: 🔒 IN SERVICE — kit capacity
            heading_style: subtitle
          - type: markdown
            content: >-
              *One switch per device. **Off** = removed, unsafe, or not installed —
              Full Auto never demands or relies on it; next-best in-kit levers run
              instead. Soft **capacity offline** cues (not problem alerts).*
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_ac_in_service
                name: AC In Service
                icon: mdi:snowflake
                icon_color: cyan
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_clone_humidifier_in_service
                name: Clone Mister In Service
                icon: mdi:sprinkler-variant
                icon_color: light-blue
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_pot1_in_service
                name: POT1 In Service
                icon: mdi:flower
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_pot2_in_service
                name: POT2 In Service
                icon: mdi:flower
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_pot3_in_service
                name: POT3 In Service
                icon: mdi:flower-outline
                icon_color: grey
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_pot4_in_service
                name: POT4 In Service
                icon: mdi:flower
                icon_color: green
          - type: heading
            heading: Temp OOS (flash) vs Operator Lockout (solid)
            heading_style: subtitle
          - type: markdown
            content: >-
              **Temp OOS** = system saw no effect (e.g. empty dehum) — flashing cue;
              Clear Temp after fix. **Operator Lockout** = only you set/clear; system
              never brings a locked device back.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Humidifier
                secondary: "{{ states('sensor.dsc_humidifier_efficacy_summary') }}"
                icon: mdi:air-humidifier
                icon_color: "{{ 'amber' if is_state('input_boolean.dsc_humidifier_temp_oos','on') else ('red' if is_state('input_boolean.dsc_humidifier_operator_lockout','on') else 'green') }}"
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_boolean.dsc_humidifier_temp_oos','on') %}
                      animation: dsc_temp_oos_pulse 1.2s ease-in-out infinite;
                      {% elif is_state('input_boolean.dsc_humidifier_operator_lockout','on') %}
                      box-shadow: 0 0 0 2px rgba(239,68,68,0.85);
                      {% endif %}
                    }
                    @keyframes dsc_temp_oos_pulse {
                      0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.0); }
                      50% { box-shadow: 0 0 18px 2px rgba(245,158,11,0.85); }
                    }
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_humidifier_operator_lockout
                name: Humidifier Lockout
                icon: mdi:lock
                icon_color: red
              - type: custom:mushroom-template-card
                primary: Clear Humidifier Temp OOS
                icon: mdi:restore
                tap_action:
                  action: call-service
                  service: script.dsc_clear_humidifier_temp_oos
              - type: custom:mushroom-template-card
                primary: Dehumidifier
                secondary: "{{ states('sensor.dsc_dehumidifier_efficacy_summary') }}"
                icon: mdi:air-humidifier
                icon_color: "{{ 'amber' if is_state('input_boolean.dsc_dehumidifier_temp_oos','on') else ('red' if is_state('input_boolean.dsc_dehumidifier_operator_lockout','on') else 'green') }}"
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('input_boolean.dsc_dehumidifier_temp_oos','on') %}
                      animation: dsc_temp_oos_pulse 1.2s ease-in-out infinite;
                      {% elif is_state('input_boolean.dsc_dehumidifier_operator_lockout','on') %}
                      box-shadow: 0 0 0 2px rgba(239,68,68,0.85);
                      {% endif %}
                    }
                    @keyframes dsc_temp_oos_pulse {
                      0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.0); }
                      50% { box-shadow: 0 0 18px 2px rgba(245,158,11,0.85); }
                    }
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_dehumidifier_operator_lockout
                name: Dehumidifier Lockout
                icon: mdi:lock
                icon_color: red
              - type: custom:mushroom-template-card
                primary: Clear Dehumidifier Temp OOS
                icon: mdi:restore
                tap_action:
                  action: call-service
                  service: script.dsc_clear_dehumidifier_temp_oos
              - type: custom:mushroom-entity-card
                entity: input_boolean.dsc_clone_humidifier_operator_lockout
                name: Clone Mister Lockout
                icon: mdi:lock
                icon_color: red
              - type: custom:mushroom-template-card
                primary: Clear Clone Temp OOS
                icon: mdi:restore
                tap_action:
                  action: call-service
                  service: script.dsc_clear_clone_humidifier_temp_oos
          - type: conditional
            conditions:
              - condition: state
                entity: lock.4x8_humidifier_photo_lab_lock
                state_not: unavailable
            card:
              type: custom:mushroom-entity-card
              entity: lock.4x8_humidifier_photo_lab_lock
              name: Room door release (lab magnet)
              icon: mdi:door-closed-lock
      - type: grid
        cards:
          - type: heading
            heading: 🎚️ LIVE TUNABLES — nested controls (no reflash)
            heading_style: title
          # These eight were compiled constants until v2.4. They now persist in
          # NVS, layered on the YAML defaults. Watchdog + >35C failsafe
          # thresholds are deliberately NOT here — those stay compiled-in so no
          # UI mistake can disarm the safety net.
          #
          # Six-month note: values tuned here live only in NVS. Fold the
          # keepers back into the YAML defaults at the next version bump, with
          # a commit message saying WHY the number moved.
          - type: markdown
            content: >-
              *Live values persist in NVS across reboots and layer on top of the
              firmware defaults. **Watchdog and the >35 °C failsafe are not
              here on purpose** — they stay compiled-in so nothing in this UI
              can disarm the safety net.*
          - type: custom:expander-card
            title: 📐 Plant specs — CFM / volumes / appliance rates
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.dsc_plant_specs_status
                primary: Spec verification
                secondary: >-
                  {{ states(entity)|upper }} —
                  {{ state_attr(entity,'issues') or 'none' }}
                icon: >-
                  {% if is_state(entity,'error') %}mdi:clipboard-alert
                  {% elif is_state(entity,'warn') %}mdi:clipboard-text-outline
                  {% else %}mdi:clipboard-check{% endif %}
                icon_color: >-
                  {% if is_state(entity,'error') %}red
                  {% elif is_state(entity,'warn') %}amber
                  {% else %}green{% endif %}
              - type: entities
                title: Volumes
                entities:
                  - entity: input_number.dsc_vol_4x8_m3
                    name: 4x8 tent
                  - entity: input_number.dsc_vol_2x4_m3
                    name: 2x4 tent
                  - entity: input_number.dsc_vol_room_m3
                    name: Room lung
              - type: custom:expander-card
                title: Optional L×W×H (cm) → m³
                expanded: false
                cards:
                  - type: markdown
                    content: >-
                      *Optional. Fill cm dimensions and Apply to write the
                      volume helper above. Packed tents may need a lower free-air
                      m³ after apply. Leave blank to keep editing m³ directly.*
                  - type: entities
                    title: 4x8 tent
                    entities:
                      - entity: input_number.dsc_dim_4x8_l_cm
                        name: Length
                      - entity: input_number.dsc_dim_4x8_w_cm
                        name: Width
                      - entity: input_number.dsc_dim_4x8_h_cm
                        name: Height
                      - entity: sensor.dsc_dim_4x8_computed_m3
                        name: Computed m³
                  - type: button
                    name: Apply → 4x8 volume
                    icon: mdi:cube-send
                    tap_action:
                      action: call-service
                      service: script.dsc_apply_dim_4x8
                  - type: entities
                    title: 2x4 tent
                    entities:
                      - entity: input_number.dsc_dim_2x4_l_cm
                        name: Length
                      - entity: input_number.dsc_dim_2x4_w_cm
                        name: Width
                      - entity: input_number.dsc_dim_2x4_h_cm
                        name: Height
                      - entity: sensor.dsc_dim_2x4_computed_m3
                        name: Computed m³
                  - type: button
                    name: Apply → 2x4 volume
                    icon: mdi:cube-send
                    tap_action:
                      action: call-service
                      service: script.dsc_apply_dim_2x4
                  - type: entities
                    title: Room lung
                    entities:
                      - entity: input_number.dsc_dim_room_l_cm
                        name: Length
                      - entity: input_number.dsc_dim_room_w_cm
                        name: Width
                      - entity: input_number.dsc_dim_room_h_cm
                        name: Height
                      - entity: sensor.dsc_dim_room_computed_m3
                        name: Computed m³
                  - type: button
                    name: Apply → room volume
                    icon: mdi:cube-send
                    tap_action:
                      action: call-service
                      service: script.dsc_apply_dim_room
              - type: entities
                title: Fan nameplate @ 100%
                entities:
                  - entity: input_number.dsc_cfm_out_max
                    name: OUT max CFM
                  - entity: input_number.dsc_cfm_recirc_max
                    name: RECIRC max CFM
                  - entity: input_number.dsc_cfm_intake_main_max
                    name: Intake Main max CFM
                  - entity: input_number.dsc_cfm_intake_clone_max
                    name: Intake 2x4 max CFM
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:chart-bell-curve
                    icon_color: cyan
                    content: Fan / PPFD curves → Learning
                    tap_action:
                      action: navigate
                      navigation_path: /dsc-hub-pro/learning
              - type: entities
                title: Appliance / light nameplates
                entities:
                  - entity: input_number.dsc_heater_w
                    name: Heater W
                  - entity: input_number.dsc_ac_btu_hr
                    name: AC BTU/h (0 if unwired)
                  - entity: input_number.dsc_dehum_l_day
                    name: Dehumidifier L/day
                  - entity: input_number.dsc_hum_ml_hr
                    name: Humidifier mL/h
                  - entity: input_number.dsc_sf1000_w
                    name: SF1000 W @100%
                  - entity: input_number.dsc_light_4x8_w
                    name: 4x8 light W
                  - entity: input_number.dsc_plant_transpiration_g_hr
                    name: Plant transpiration g/h
              - type: entities
                title: Live capacity (from specs / curves)
                entities:
                  - entity: sensor.dsc_cfm_exhaust_out
                  - entity: sensor.dsc_cfm_exhaust_recirc
                  - entity: sensor.dsc_cfm_intake_main
                  - entity: sensor.dsc_cfm_intake_2x4
                  - entity: sensor.dsc_ach_4x8
                  - entity: sensor.dsc_ach_2x4
                  - entity: sensor.dsc_heat_balance_btu
                  - entity: sensor.dsc_moisture_net_rate
              - type: custom:mushroom-template-card
                entity: sensor.dsc_learn_status
                primary: Response-rate learning
                secondary: >-
                  {{ states(entity)|upper }} — open Learning for ETA, charts & settings
                icon: mdi:brain
                icon_color: >-
                  {% if is_state(entity,'ready') %}green
                  {% elif is_state(entity,'partial') %}teal
                  {% elif is_state(entity,'warming') %}amber
                  {% elif is_state(entity,'gated') %}orange
                  {% else %}grey{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /dsc-hub-pro/learning
              - type: markdown
                content: >-
                  *Defaults are placeholders — replace with anemometer / nameplate
                  values. Optional multi-point CFM/PPFD curves live on **Learning**
                  (unset = % × nameplate). Spec checks flag intake CFM > exhaust
                  CFM, AC wired with 0 BTU/h, and zeroed appliance rates. Phase A
                  learning UI lives on the **Learning** view.*
          - type: custom:expander-card
            title: 🌱 Grow mat — closed-loop root-zone band
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                entities:
                  - entity: number.dsc_hub_mat_root_zone_low
                    name: Energise below
                  - entity: number.dsc_hub_mat_root_zone_high
                    name: Cut at
                  - entity: number.dsc_hub_mat_min_off_time
                    name: Min off-time
                  - entity: binary_sensor.dsc_hub_root_zone_sensor_fault
                    name: → Probe fault
              - type: custom:mushroom-chips-card
                alignment: start
                chips:
                  - type: template
                    icon: mdi:grass
                    icon_color: lime
                    content: Mat votes & soil → Root Zone
                    tap_action:
                      action: navigate
                      navigation_path: /dsc-hub-pro/root-zone
              - type: markdown
                content: >-
                  *The **gap between Low and High IS the hysteresis** — keep it
                  ≥ 2 °C. Mat vote switches live on **Root Zone** (source of
                  truth) so this page stays control-focused. Sensing arrives
                  over ESP-NOW with HA as per-pot fallback.*
          - type: custom:expander-card
            title: 💧 Clone humidifier — the short-cycling fix
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                entities:
                  - entity: number.dsc_hub_clone_hum_hysteresis
                    name: Release at RH-min +
                  - entity: number.dsc_hub_clone_hum_min_off_time
                    name: Min off-time
                  - entity: sensor.dsc_clone_humidifier_cycles_last_hour
                    name: → Cycles last hour
              - type: markdown
                content: >-
                  *v2.3 released at RH-min +2 — a 4 % total band that made the
                  micro-mister chatter and flooded the Scribe. Default is now
                  **+6** with a 180 s lock-out. If cycles/hour is still above
                  ~3, widen this before touching anything else.*
          - type: custom:expander-card
            title: 🔥 Room appliance min off-times
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                entities:
                  - entity: number.dsc_hub_humidifier_min_off_time
                    name: Humidifier
                  - entity: number.dsc_hub_heater_min_off_time
                    name: Heater (resistive — relay hygiene)
              - type: markdown
                content: >-
                  *AC and dehumidifier min-off is **fixed at 180 s in firmware**
                  and not exposed — that is compressor protection, not a
                  preference.*
          # v5.1 glass lean-cut: the panel lost its De-Strat settings drill.
          # This expander is now the ONLY place these tunables are editable.
          - type: custom:expander-card
            title: 🌀 De-strat pulse — RECIRC anti-stratification
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                entities:
                  - entity: switch.dsc_hub_recirc_de_strat_pulse
                    name: Pulse enabled
                  - entity: number.dsc_hub_de_strat_pulse_period
                    name: Period
                  - entity: number.dsc_hub_de_strat_pulse_length
                    name: Pulse length
                  - entity: number.dsc_hub_de_strat_pulse_level
                    name: Pulse level
              - type: markdown
                content: >-
                  *Briefly kicks the RECIRC fan to break temperature layers
                  when the room is otherwise still. Was a panel settings drill
                  before the v5.1.6 lean cut — HA is now the only editor.*
          - type: custom:expander-card
            title: ☀️ SF1000 ramp floor
            expanded: false
            card_mod: *dsc_expander_style
            cards:
              - type: entities
                entities:
                  - entity: number.dsc_hub_sf1000_ramp_floor
                    name: Kick-in duty
                  - entity: number.dsc_hub_sf1000_target_brightness
                    name: Target brightness
              - type: markdown
                content: >-
                  *The 1 kΩ pull-down killed the LM358's 0.2 V floor, but the
                  SF1000 driver still ignores duty below its own kick-in point.
                  Brightness 0–100 % remaps onto floor–100 % duty; **0 stays a
                  true 0 % duty**, so off is off.*


                  *Default 32 % is a **bench estimate**. Watch the first v2.4
                  sunrise: if the lamp jumps rather than fades from black, this
                  is too high — trim it. If the first minutes are dark, raise
                  it. No reflash either way.*
      - type: grid
        cards:
          - type: heading
            heading: 💨 AIRFLOW STATUS
            heading_style: title
          - type: custom:dsc-airflow-map-card
            title: AIRFLOW STATUS
            grid_options:
              columns: 12
              rows: 6
          - type: markdown
            content: >-
              *Real ducts only: Room→2x4, Room→4x8, 2x4→4x8 cascade, 4x8→Outside,
              4x8→Room recirc. Edges show live **CFM / fan %** and the **source
              zone T/RH** being pulled over. OUT and RECIRC are a **percentage
              blend** — only the RECIRC share feeds the room lung; OUT dumps
              outdoors and does not hit the intakes.*


              *Room appliances (heater / AC / hum / dehum) condition the shared
              lung the intakes suck from. Tent volumes from Plant Specs drive
              the quick air-mass and ACH lines on each node.*
          - type: heading
            heading: Fans
            heading_style: subtitle
          - type: conditional
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity: switch.dsc_hub_tent_full_auto_mode
                    state: "on"
                  - condition: state
                    entity: switch.dsc_hub_tent_manual_override
                    state: "off"
                  - condition: state
                    entity: switch.dsc_hub_manual_takeover
                    state: "off"
            card:
              type: custom:mushroom-template-card
              primary: Fans locked — Full Auto owns the curve
              secondary: Enable Manual Fan Override (or Takeover) to set percentages.
              icon: mdi:lock
              icon_color: amber
              multiline_secondary: true
              tap_action:
                action: call-service
                service: switch.turn_on
                target:
                  entity_id: switch.dsc_hub_tent_manual_override
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: switch.dsc_hub_tent_full_auto_mode
                    state: "off"
                  - condition: state
                    entity: switch.dsc_hub_tent_manual_override
                    state: "on"
                  - condition: state
                    entity: switch.dsc_hub_manual_takeover
                    state: "on"
            card:
              type: grid
              columns: 2
              square: false
              cards:
                - type: custom:mushroom-fan-card
                  entity: fan.dsc_hub_4_inch_intake_fan_main
                  name: Intake 4x8
                  show_percentage_control: true
                  icon_animation: true
                - type: custom:mushroom-fan-card
                  entity: fan.dsc_hub_4_inch_intake_fan_2x4
                  name: Intake 2x4
                  show_percentage_control: true
                  icon_animation: true
                - type: custom:mushroom-fan-card
                  entity: fan.dsc_hub_6_inch_exhaust_room
                  name: Exhaust Room
                  show_percentage_control: true
                  icon_animation: true
                - type: custom:mushroom-fan-card
                  entity: fan.dsc_hub_6_inch_exhaust_outside
                  name: Exhaust Outside
                  show_percentage_control: true
                  icon_animation: true
          - type: conditional
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity: switch.dsc_hub_tent_full_auto_mode
                    state: "on"
                  - condition: state
                    entity: switch.dsc_hub_tent_manual_override
                    state: "off"
                  - condition: state
                    entity: switch.dsc_hub_manual_takeover
                    state: "off"
            card:
              type: custom:mushroom-chips-card
              alignment: justify
              chips:
                - type: template
                  entity: sensor.dsc_fan_intake_main_pct
                  icon: mdi:fan
                  icon_color: cyan
                  content: "IN 4×8 {{ states(entity)|float(0)|round(0) }}%"
                - type: template
                  entity: sensor.dsc_fan_intake_2x4_pct
                  icon: mdi:fan
                  icon_color: cyan
                  content: "IN 2×4 {{ states(entity)|float(0)|round(0) }}%"
                - type: template
                  entity: sensor.dsc_fan_exhaust_room_pct
                  icon: mdi:fan-chevron-up
                  icon_color: cyan
                  content: "EX ROOM {{ states(entity)|float(0)|round(0) }}%"
                - type: template
                  entity: sensor.dsc_fan_exhaust_outside_pct
                  icon: mdi:fan-chevron-up
                  icon_color: cyan
                  content: "EX OUT {{ states(entity)|float(0)|round(0) }}%"
          - type: custom:mushroom-chips-card
            alignment: end
            chips:
              - type: template
                icon: mdi:arrow-expand-all
                icon_color: cyan
                content: Enlarge — fans 48h
                tap_action: *dsc_popup_fans
          - type: custom:apexcharts-card
            graph_span: 12h
            update_interval: 1min
            header:
              show: true
              title: Fan speeds — action magnitude (0–100%)
              show_states: true
              colorize_states: true
            all_series_config:
              extend_to: now
              fill_raw: last
            apex_config:
              chart:
                height: 220
                animations:
                  enabled: false
              legend:
                show: true
                position: top
              tooltip:
                shared: true
              grid:
                borderColor: rgba(148,163,184,0.2)
                strokeDashArray: 3
            yaxis:
              - id: primary
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: "%"
            series:
              - entity: sensor.dsc_fan_intake_main_pct
                name: In 4x8
                yaxis_id: primary
                curve: stepline
                stroke_width: 2
                color: '#34d399'
                float_precision: 0
              - entity: sensor.dsc_fan_intake_2x4_pct
                name: In 2x4
                yaxis_id: primary
                curve: stepline
                stroke_width: 2
                color: '#a3e635'
                float_precision: 0
              - entity: sensor.dsc_fan_exhaust_room_pct
                name: Ex Room
                yaxis_id: primary
                curve: stepline
                stroke_width: 2
                color: '#38bdf8'
                float_precision: 0
              - entity: sensor.dsc_fan_exhaust_outside_pct
                name: Ex Out
                yaxis_id: primary
                curve: stepline
                stroke_width: 2.5
                color: '#67e8f9'
                float_precision: 0
          - type: custom:apexcharts-card
            graph_span: 12h
            update_interval: 1min
            header:
              show: true
              title: Action → reaction · exhaust vs tent temp
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 220
                animations:
                  enabled: false
              legend:
                show: true
                position: top
              tooltip:
                shared: true
              grid:
                borderColor: rgba(148,163,184,0.2)
                strokeDashArray: 3
            all_series_config:
              extend_to: now
              fill_raw: last
            yaxis:
              - id: primary
                decimals: 1
                min: 14
                max: 32
                apex_config:
                  forceNiceScale: true
                  title:
                    text: Tent °C
              - id: fan
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: Exhaust %
                  tickAmount: 4
            series:
              - entity: sensor.dsc_fan_exhaust_outside_pct
                name: Exhaust %
                yaxis_id: fan
                curve: stepline
                stroke_width: 2
                color: '#67e8f9'
                float_precision: 0
                show:
                  extremas: false
              - entity: number.dsc_hub_target_temp
                name: Target
                yaxis_id: primary
                stroke_width: 1.5
                stroke_dash: 5
                color: '#94a3b8'
                show:
                  in_header: false
                  extremas: false
              - entity: sensor.dsc_hub_tent_temperature
                name: Tent °C
                yaxis_id: primary
                stroke_width: 2.5
                float_precision: 1
                show:
                  extremas: true

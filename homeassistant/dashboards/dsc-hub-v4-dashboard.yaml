              - entity: text.dsc_pot2_plant_name
                name: POT2 Plant
              - entity: select.dsc_pot2_growth_stage
                name: POT2 Stage
              - entity: text.dsc_pot3_plant_name
                name: POT3 Plant
              - entity: select.dsc_pot3_growth_stage
                name: POT3 Stage
              - entity: text.dsc_pot4_plant_name
                name: POT4 Plant
              - entity: select.dsc_pot4_growth_stage
                name: POT4 Stage
          - type: markdown
            content: >-
              *Plant names live on each pot (NVS). Hub mirrors
              `text.dsc_potN_plant_name` from HA and relays to the panel
              as ESP-NOW **0xD4**. If HA still shows the old `4x8_` /
              `grow_tent_` ids, rename them in the entity registry (or
              re-adopt the pot) so they match this dashboard.*
      - type: grid
        cards:
          # ============================================================
          #  ⚡ EC PLANT UPTAKE  —  new in v2.4
          #
          #  WHY (six-month note): the dashboard had ec_vs_tank chips and a
          #  Δ chart, but nothing that said what the numbers MEAN. EC is the
          #  most misread number in a grow room, because the intuition is
          #  backwards — a pot whose EC is CLIMBING is not "well fed", it is
          #  a pot that has stopped drinking its salts.
          #
          #  The physics, once:
          #    You feed at tank EC. The plant takes up water AND ions, but
          #    rarely in the same ratio.
          #      takes salts faster than water -> soil EC FALLS below tank
          #      takes water faster than salts -> soil EC RISES above tank
          #    So Δ (soil − tank) is a direct read on uptake balance, and
          #    its SLOPE is the rate. Absolute soil EC on its own tells you
          #    almost nothing without the tank to compare against.
          #
          #  These are JXCT bulk-EC readings: trend indicators, NOT
          #  calibrated absolutes. Every alert here is relative-to-baseline
          #  on purpose. The tank tester sits in solution, so tank EC is the
          #  one number in this section allowed to be read absolutely.
          # ============================================================
          - type: heading
            heading: ⚡ EC PLANT UPTAKE
            heading_style: title
          - type: markdown
            content: >-
              ```

              TANK ──── feed ────► ROOT ZONE ──── uptake ────► PLANT

              {{ states('sensor.dsc_tank_ec_normalized') }}                soil EC
              │
              └── Δ = soil − tank


              Δ < 0   soil thinner than feed   drinking salts   ✅ healthy uptake

              Δ ≈ 0   soil matches feed        balanced         ➖ steady state

              Δ > 0   soil richer than feed    water-only draw  ⚠️ salts piling up

              ```

              {% set tank = states('sensor.dsc_tank_ec_normalized')|float(0) %}

              | Pot | Soil EC | Δ tank | Slope | Reading |

              |---|---|---|---|---|

              {% for p in ['1','2','3','4'] -%}
              {% set ec = states('sensor.dsc_pot' ~ p ~ '_soil_conductivity')|float(0) %}
              {% set d = states('sensor.dsc_pot' ~ p ~ '_ec_vs_tank')|float(0) %}
              {% set s = states('sensor.dsc_pot' ~ p ~ '_ec_uptake_slope')|float(0) %}
              | POT{{ p }} | {{ ec|round(2) }} | {{ '%+.2f'|format(d) }} | {{ '%+.3f'|format(s) }} |
              {%- if d > 0.3 and s > 0 %} ⚠️ accumulating — consider a flush
              {%- elif d > 0.3 %} 🟡 rich, but easing
              {%- elif d < -0.3 and s < 0 %} ✅ drinking hard
              {%- elif d < -0.3 %} ✅ thin — feed is being consumed
              {%- else %} ➖ balanced
              {%- endif %} |

              {% endfor %}

              *Slope is EC change per hour. **Negative = uptake**, positive =
              concentration. A pot with Δ > 0 **and** a positive slope is the
              one to watch: it is taking water and leaving salts behind.*
          - type: custom:apexcharts-card
            header:
              show: true
              title: Soil EC vs tank feed — 48 h
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              end: minute
            yaxis:
              - min: ~0
                decimals: 2
                apex_config:
                  title:
                    text: EC (µS/cm)
            series:
              # The reference line. Everything else is read against THIS.
              - entity: sensor.dsc_tank_ec_normalized
                name: TANK (feed)
                stroke_width: 4
                color: "#94a3b8"
                curve: stepline
                group_by:
                  func: last
                  duration: 15min
              - entity: sensor.dsc_pot1_soil_conductivity
                name: POT1
                stroke_width: 2
                color: "#22c55e"
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot2_soil_conductivity
                name: POT2
                stroke_width: 2
                color: "#3b82f6"
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot3_soil_conductivity
                name: POT3 🚧
                stroke_width: 1
                opacity: 0.4
                color: "#a855f7"
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot4_soil_conductivity
                name: POT4
                stroke_width: 2
                color: "#f59e0b"
                group_by:
                  func: avg
                  duration: 15min
          - type: markdown
            content: >-
              *Read the **gap to the grey line**, not the lines themselves.
              Pots below tank are consuming; pots above are concentrating. The
              sawtooth is normal: every feed resets the pot toward tank EC, then
              the plant pulls it away again. **The shape of that pull is the
              plant talking.**


              A pot that stops sawtoothing has stopped drinking.*
          - type: custom:apexcharts-card
            header:
              show: true
              title: Uptake balance — Δ from tank, 48 h
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              end: minute
            apex_config:
              annotations:
                yaxis:
                  - "y": 0
                    strokeDashArray: 4
                    borderColor: "#94a3b8"
                    label:
                      text: balanced
                      style:
                        background: "#94a3b8"
              stroke:
                width: 2
            yaxis:
              - decimals: 2
                apex_config:
                  title:
                    text: soil − tank
            series:
              - entity: sensor.dsc_pot1_ec_vs_tank
                name: POT1
                color: "#22c55e"
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot2_ec_vs_tank
                name: POT2
                color: "#3b82f6"
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot3_ec_vs_tank
                name: POT3 🚧
                color: "#a855f7"
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.dsc_pot4_ec_vs_tank
                name: POT4
                color: "#f59e0b"
                group_by:
                  func: avg
                  duration: 15min
          - type: markdown
            content: >-
              *This is the uptake chart. **Below zero = the plant is winning**
              (pulling salts out faster than water). Above zero = salts are
              accumulating faster than they're used — the classic pre-lockout
              signature, and the cue to flush before it becomes a deficiency
              that looks like something else.*


              *A pot drifting steadily upward over days, while its moisture
              still cycles normally, is the textbook case: it's drinking water
              and leaving the food behind.*
          - type: heading
            heading: 📈 INSTANTANEOUS UPTAKE RATE
            heading_style: subtitle
          - type: custom:bar-card
            title: EC slope — negative is uptake
            entities:
              - entity: sensor.dsc_pot1_ec_uptake_slope
                name: POT1
              - entity: sensor.dsc_pot2_ec_uptake_slope
                name: POT2
              - entity: sensor.dsc_pot3_ec_uptake_slope
                name: POT3 🚧
              - entity: sensor.dsc_pot4_ec_uptake_slope
                name: POT4
            positions:
              icon: "off"
              indicator: inside
              name: outside
              value: inside
            min: -0.15
            max: 0.15
            severity:
              - color: "#22c55e"
                from: -0.15
                to: -0.005
              - color: "#94a3b8"
                from: -0.005
                to: 0.005
              - color: "#ef4444"
                from: 0.005
                to: 0.15
          - type: markdown
            content: >-
              *🟢 green = drinking · ⚪ grey = steady · 🔴 red = concentrating.*


              *Right after a feed everything reads red for an hour or two —
              that's the tank refilling the pot, not the plant failing. Judge
              this **between** feeds.*
      - type: grid
        cards:
          - type: heading
            heading: 🔄 WATER ↔ SOIL DYNAMICS
            heading_style: title
          - type: custom:mini-graph-card
            name: Soil moisture — feed & drink signatures, 48 h
            hours_to_show: 48
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_pot1_soil_moisture
                name: POT1
              - entity: sensor.dsc_pot2_soil_moisture
                name: POT2
              - entity: sensor.dsc_pot4_soil_moisture
                name: POT4
            show:
              labels: true
              extrema: true
              legend: true
          - type: markdown
            content: >-
              *POT3 omitted — its probe reads 0.0 % and would flatten the axis.*


              *A feed is a **cliff up**; drinking is the **decay after**. The
              steepness of the decay is transpiration — it tracks VPD, light
              and root-zone temp. Steeper decay after v2.4's mat fix is the
              expected outcome: warmer roots drink faster.*
      - type: grid
        cards:
          # ============================================================
          #  🧪 N · P · K
          #  v2.4: P and K were read by the probe from day one and shown
          #  NOWHERE. Two thirds of the NPK sensor was invisible.
          #
          #  Same caveat as EC, louder: JXCT derives N/P/K from bulk EC.
          #  These are NOT laboratory values — they are three differently
          #  weighted views of the same conductivity measurement. Treat them
          #  as SHAPES over time, never as ppm you could act on directly.
          #  Compare a pot to its own history, not to a chart on the box.
          # ============================================================
          - type: heading
            heading: 🧪 N · P · K — trend only, never absolute
            heading_style: title
          - type: markdown
            content: >-
              *⚠ The JXCT derives N/P/K from **bulk EC**, so all three move
              together with total salt. They are trend indicators against each
              pot's **own baseline** — never absolute ppm, never cross-pot
              league tables. A number moving is information; a number's value is
              not.*
          - type: custom:apexcharts-card
            header:
              show: true
              title: Nitrogen — 7 d
              show_states: true
              colorize_states: true
            graph_span: 7d
            span:
              end: minute
            yaxis:
              - decimals: 0
                apex_config:
                  title:
                    text: N (mg/kg est.)
            series:
              - entity: sensor.dsc_pot1_soil_nitrogen
                name: POT1
                color: "#22c55e"
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot2_soil_nitrogen
                name: POT2
                color: "#3b82f6"
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot3_soil_nitrogen
                name: POT3 🚧
                color: "#a855f7"
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot4_soil_nitrogen
                name: POT4
                color: "#f59e0b"
                group_by:
                  func: avg
                  duration: 1h
          - type: custom:apexcharts-card
            header:
              show: true
              title: Phosphorus — 7 d
              show_states: true
              colorize_states: true
            graph_span: 7d
            span:
              end: minute
            yaxis:
              - decimals: 0
                apex_config:
                  title:
                    text: P (mg/kg est.)
            series:
              - entity: sensor.dsc_pot1_soil_phosphorus
                name: POT1
                color: "#22c55e"
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot2_soil_phosphorus
                name: POT2
                color: "#3b82f6"
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot3_soil_phosphorus
                name: POT3 🚧
                color: "#a855f7"
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot4_soil_phosphorus
                name: POT4
                color: "#f59e0b"
                group_by:
                  func: avg
                  duration: 1h
          - type: custom:apexcharts-card
            header:
              show: true
              title: Potassium — 7 d
              show_states: true
              colorize_states: true
            graph_span: 7d
            span:
              end: minute
            yaxis:
              - decimals: 0
                apex_config:
                  title:
                    text: K (mg/kg est.)
            series:
              - entity: sensor.dsc_pot1_soil_potassium
                name: POT1
                color: "#22c55e"
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot2_soil_potassium
                name: POT2
                color: "#3b82f6"
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot3_soil_potassium
                name: POT3 🚧
                color: "#a855f7"
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.dsc_pot4_soil_potassium
                name: POT4
                color: "#f59e0b"
                group_by:
                  func: avg
                  duration: 1h
          - type: markdown
            content: >-
              *Because all three derive from bulk EC, the **useful signal is
              divergence**: if N drops while P and K hold, that is a ratio shift
              worth believing. If all three fall together, you are looking at
              total-salt depletion — which the EC uptake chart above already
              told you, more honestly.*
          - type: heading
            heading: 📉 N RATE OF CHANGE
            heading_style: subtitle
          - type: custom:mini-graph-card
            name: N rate — 48 h
            hours_to_show: 48
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_pot1_soil_nitrogen_rate
                name: POT1
              - entity: sensor.dsc_pot2_soil_nitrogen_rate
                name: POT2
              - entity: sensor.dsc_pot4_soil_nitrogen_rate
                name: POT4
            show:
              labels: true
              legend: true
          - type: entities
            title: Daily N extremes (uptake timing)
            entities:
              - entity: sensor.dsc_pot1_soil_nitrogen_daily_max_time
                name: POT1 daily max at
              - entity: sensor.dsc_pot1_soil_nitrogen_daily_min_time
                name: POT1 daily min at
              - entity: sensor.dsc_pot2_soil_nitrogen_daily_max_time
                name: POT2 daily max at
              - entity: sensor.dsc_pot2_soil_nitrogen_daily_min_time
                name: POT2 daily min at
          - type: markdown
            content: >-
              *Timing is the tell. On a healthy plant the daily minimum lands in
              the **light period** — that is when it is transpiring and feeding.
              A minimum that drifts into the dark period, or flattens out
              entirely, means uptake has decoupled from the photoperiod.*

  - title: Tank
    icon: mdi:cup-water
    path: tank
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🚰 TANK TESTER
            heading_style: title
          - type: custom:ph-meter-temperature
            entity: sensor.water_tester_ph_current
            entity_temperature: sensor.water_tester_temperature
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.water_tester_temperature
                above: 24
            card:
              type: custom:mushroom-template-card
              primary: ⚠ WATER TEMP > 24 °C — PYTHIUM RISK
              secondary: Chill or shade the reservoir; dissolved O2 is crashing
              icon: mdi:bacteria
              icon_color: red
      - type: grid
        cards:
          - type: heading
            heading: ⚡ EC vs STAGE TARGET
            heading_style: title
          - type: custom:gauge-card-pro
            entity: sensor.dsc_tank_ec_normalized
            header: Tank EC (normalised)
            min: 0
            max: 4
            needle: true
            segments: >
              {% set lo = states('sensor.dsc_tank_ec_target_min')|float(0.8) %}
              {% set hi = states('sensor.dsc_tank_ec_target_max')|float(2.0) %}
              {{ [ {'from': 0, 'color': '#f59e0b'},
                   {'from': lo, 'color': '#22c55e'},
                   {'from': hi, 'color': '#ef4444'} ] }}
          - type: custom:mini-graph-card
            name: EC + pH — 48 h
            hours_to_show: 48
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_tank_ec_normalized
                name: EC
              - entity: sensor.water_tester_ph_current
                name: pH
                y_axis: secondary
            show:
              labels: true
              extrema: true
              legend: true
          - type: markdown
            content: >-
              *This number is the **reference line** on the Root Zone uptake
              charts. When it moves, every Δ moves with it — so a "sudden
              uptake change" across all four pots at once is usually the tank,
              not the plants.*
      - type: grid
        cards:
          - type: heading
            heading: 🎯 FEED TARGETS
            heading_style: title
          - type: entities
            entities:
              - entity: input_select.dsc_tank_plant_type
                name: Plant Type
              - entity: input_select.dsc_tank_stage
                name: Feed Stage
              - entity: input_number.dsc_tank_ec_multiplier
                name: EC Multiplier
              - entity: sensor.dsc_tank_ec_target_min
                name: EC Target Min
              - entity: sensor.dsc_tank_ec_target_max
                name: EC Target Max
          - type: markdown
            content: >-
              *Tank EC alerts use **published absolute targets** — unlike the
              pot probes, which are trend-only. The tester sits in solution, so
              absolute values are meaningful here and only here.*

  - title: Lighting
    icon: mdi:white-balance-sunny
    path: lighting
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          # ============================================================
          #  v2.4: retitled from "SF1000 — 4x8 MAIN". The heading itself was
          #  wrong after the topology change.
          # ============================================================
          - type: heading
            heading: ☀️ SF1000 — 2x4 CLONE TENT
            heading_style: title
          - type: custom:vertical-stack-in-card
            cards:
              - type: light
                entity: light.dsc_hub_sf1000_dimmer
                name: SF1000
                features:
                  - type: light-brightness
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_sf1000_target_brightness
                name: Target Brightness (the "X%" the ramp climbs to)
                icon: mdi:brightness-6
                display_mode: slider
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_sf1000_ramp_floor
                name: Ramp Floor (driver kick-in duty)
                icon: mdi:arrow-collapse-down
                display_mode: slider
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: entity
                    entity: switch.dsc_hub_auto_photoperiod
                    icon: mdi:theme-light-dark
                  - type: entity
                    entity: switch.dsc_hub_manual_light_hold
                    icon: mdi:hand-back-right
                  - type: template
                    entity: binary_sensor.dsc_hub_2x4_window_open
                    icon: mdi:sun-clock
                    icon_color: "{{ 'amber' if is_state(entity,'on') else 'disabled' }}"
                    content: "window {{ 'open' if is_state(entity,'on') else 'shut' }}"
          - type: entities
            title: Schedule
            entities:
              - entity: select.dsc_hub_clone_photoperiod
                name: Window source
              - entity: time.dsc_hub_clone_lights_on_time
                name: Clone Lights-On Time
              - entity: number.dsc_hub_clone_light_hours
                name: Clone Light Hours
              - entity: number.dsc_hub_sunrise_duration
                name: Sunrise Ramp
              - entity: number.dsc_hub_sunset_duration
                name: Sunset Ramp
          - type: markdown
            content: >-
              *Window source: **Follow 4x8** mirrors the main tent's virtual
              window (ramps align to its schedule); **Independent** runs on
              Clone Lights-On Time + Clone Light Hours — the counter-cycle that
              makes the 2x4 a warm night reservoir.*


              *Sunrise + sunset can never overlap: if they exceed the window,
              both scale down to fit.*
          # ============================================================
          #  ⚠ THE STALE CAVEAT THIS REPLACES
          #  v3 said: "trust true darkness only after the GPIO5 hard-off
          #  relay lands (v2.4)". Both halves are now wrong — the relay was
          #  CANCELLED and the floor is gone. Leaving that text would have
          #  had you distrusting a dark period that is genuinely dark, and
          #  waiting on hardware that is never coming.
          # ============================================================
          - type: markdown
            content: >-
              ### ✅ Dark period — resolved in v2.4


              *The LM358's 0.2 V residual floor is **gone**: a 1 kΩ pull-down
              from the 0–10 V line to GND kills it. The planned GPIO5 hard-off
              relay was **cancelled** — it is not needed, and GPIO5 is now
              reserved for a future 4x8 light instead.*


              *Off is a **true 0 % duty**, not a low one. `zero_means_zero`
              guarantees the ramp floor never leaks into the off state.*


              *What this page shows is still **commanded** state — but
              commanded off now means dark.*
          - type: heading
            heading: 💡 ROOM UTILITY LIGHT
            heading_style: subtitle
          - type: light
            entity: light.nabu_casa_skyconnect_v1_0_grow_room_main_white
            name: Grow Room White
          - type: markdown
            content: >-
              *Not on the photoperiod, not in either tent — but it **is** in the
              room the 2x4 draws from. Leaving it on during the clone dark
              period can leak light through the intake path.*
      - type: grid
        cards:
          - type: heading
            heading: 📊 24 h ACCOUNTING — the tent with the lamp
            heading_style: title
          - type: custom:gauge-card-pro
            entity: sensor.dsc_lights_on_today_2x4
            header: 2x4 SF1000 on-time vs plan
            min: 0
            max: >
              {{ [states('sensor.dsc_clone_expected_light_hours')|float(18), 1] | max }}
            needle: true
            segments: >
              {% set exp = states('sensor.dsc_clone_expected_light_hours')|float(18) %}
              {{ [ {'from': 0, 'color': '#3b82f6'},
                   {'from': exp * 0.9, 'color': '#22c55e'} ] }}
          - type: custom:mushroom-template-card
            entity: sensor.dsc_lights_deviation_today
            primary: "Deviation: {{ states(entity) }} h vs clone plan"
            secondary: >-
              Meaningful at day end — intraday it trends to 0 on a healthy
              schedule. Plan is {{
              states('sensor.dsc_clone_expected_light_hours')|round(0) }} h.
            icon: mdi:scale-balance
            icon_color: >-
              {% set d = states(entity)|float(0)|abs %} {{ 'green' if d < 0.5
              else ('amber' if d < 1.5 else 'red') }}
            multiline_secondary: true
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.dsc_clone_dark_period_violation
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: ⚠ LIGHT ON IN DARK PERIOD
              secondary: SF1000 commanded on outside the 2x4 window — flowering killer
              icon: mdi:weather-night-partly-cloudy
              icon_color: red
          - type: heading
            heading: 🕐 4x8 VIRTUAL WINDOW
            heading_style: subtitle
          - type: custom:mushroom-template-card
            entity: sensor.dsc_lights_on_today_4x8
            primary: "Window open {{ states(entity)|float(0)|round(1) }}h today"
            secondary: >-
              No lamp fitted — this is the schedule the clones and the thermal
              loop follow. Plan {{
              states('sensor.dsc_expected_light_hours')|round(0) }}h.
            icon: mdi:sun-clock
            icon_color: >-
              {{ 'blue' if is_state('binary_sensor.dsc_hub_4x8_window_open','on')
              else 'disabled' }}
            multiline_secondary: true
          - type: custom:mushroom-template-card
            entity: sensor.dsc_next_light_event
            primary: >-
              Next 4x8 {{ state_attr(entity,'event') }} — {{
              relative_time(as_datetime(states(entity))) if
                 states(entity) not in ['unknown','unavailable','None'] else 'n/a' }}
            secondary: >-
              {{ as_timestamp(states(entity)) | timestamp_custom('%H:%M') if
              states(entity) not in ['unknown','unavailable','None'] else '' }}
            icon: >-
              {{ 'mdi:weather-sunset-up' if state_attr(entity,'event') ==
              'sunrise'
                 else 'mdi:weather-sunset-down' }}
            icon_color: amber
      - type: grid
        cards:
          # ============================================================
          #  COUNTER-CYCLE RIBBONS  —  rebuilt for v2.4
          #  v3 stacked SF1000 (labelled 4x8) against clone_led_demand. Both
          #  halves are wrong now: the LED demand is retired, and the SF1000
          #  is the 2x4's.
          #
          #  These two ribbons are deliberately DIFFERENT KINDS OF THING and
          #  are labelled as such — drawing them as twin on/off bars would
          #  imply a symmetry that no longer exists.
          # ============================================================
          - type: heading
            heading: 🔄 COUNTER-CYCLE — 24 h
            heading_style: title
          - type: custom:mini-graph-card
            name: 4x8 — virtual window (schedule, no lamp)
            hours_to_show: 24
            cache: true
            points_per_hour: 60
            line_width: 1
            height: 90
            entities:
              - entity: binary_sensor.dsc_hub_4x8_window_open
                name: 4x8 window
                show_fill: true
                smoothing: false
                color: "#3b82f6"
            lower_bound: 0
            upper_bound: 1
            show:
              labels: false
              fill: true
          - type: custom:mini-graph-card
            name: 2x4 — SF1000 brightness (real photons)
            hours_to_show: 24
            cache: true
            points_per_hour: 60
            line_width: 2
            height: 90
            entities:
              - entity: light.dsc_hub_sf1000_dimmer
                name: SF1000 %
                attribute: brightness
                transform: "return x / 255 * 100;"
                show_fill: true
                smoothing: false
                color: "#f59e0b"
            lower_bound: 0
            upper_bound: 100
            show:
              labels: false
              fill: true
          - type: markdown
            content: >-
              *Healthy counter-cycle = the two filled blocks **interlock like
              teeth**. Overlap means the room is being asked to serve two
              masters at once.*


              *Note the shapes differ on purpose: the top is a **square wave**
              (a schedule is on or off) and the bottom is a **trapezoid** (a
              real light ramps). If the bottom ever goes square, the ramp
              engine isn't running — check Manual Light Hold and Auto
              Photoperiod.*
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                entity: sensor.dsc_lights_on_today_4x8
                icon: mdi:sun-clock
                icon_color: blue
                content: 4x8 window {{ states(entity)|float(0)|round(1) }}h
              - type: template
                entity: sensor.dsc_lights_on_today_2x4
                icon: mdi:white-balance-sunny
                icon_color: amber
                content: 2x4 lit {{ states(entity)|float(0)|round(1) }}h

  - title: Trends
    icon: mdi:chart-multiline
    path: trends
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🧠 THE RESPONSE STACK — source → fans → result

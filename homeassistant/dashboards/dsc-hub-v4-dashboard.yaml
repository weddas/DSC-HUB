                  icon: mdi:timer-sand
                  icon_color: blue
              - type: custom:mini-graph-card
                hours_to_show: 12
                cache: true
                points_per_hour: 60
                line_width: 2
                smoothing: true
                entities:
                  - entity: sensor.dsc_hub_tent_temperature
                    name: Tent °C
                  - entity: number.dsc_hub_target_temp
                    name: Target
                    show_points: false
                  - entity: switch.dsc_hub_heater_demand

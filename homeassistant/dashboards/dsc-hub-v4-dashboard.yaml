  - title: 4x8 Main
    icon: mdi:greenhouse
    path: main-4x8
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🎯 STAGE & TARGETS
            heading_style: title
          - type: custom:mushroom-select-card
            entity: select.dsc_hub_grow_stage
            name: Grow Stage
            icon: mdi:sprout
            icon_color: green
          # v2.4: this card used to imply a lamp. It is a SCHEDULE card now.
          # It still matters: Follow-4x8 clones resolve against this window,
          # and the counter-cycle thermal logic runs off it.
          - type: custom:mushroom-template-card
            entity: sensor.dsc_expected_light_hours
            primary: >-
              Virtual window {{ states(entity)|round(0) }}h on / {{ 24 -
              states(entity)|float(0)|round(0) }}h dark
            secondary: >-
              {{ 'OPEN' if is_state('binary_sensor.dsc_hub_4x8_window_open','on')
              else 'Shut' }} · next {{ state_attr('sensor.dsc_next_light_event','event') }} —
              {{ relative_time(as_datetime(states('sensor.dsc_next_light_event')))
              if states('sensor.dsc_next_light_event') not in
              ['unknown','unavailable','None'] else 'n/a' }}
            icon: mdi:sun-clock
            icon_color: >-
              {{ 'blue' if is_state('binary_sensor.dsc_hub_4x8_window_open','on')
              else 'disabled' }}
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_target_temp
                name: Target Temp
                icon: mdi:thermometer
                display_mode: buttons
              - type: custom:mushroom-select-card
                entity: select.dsc_hub_control_strategy
                name: Strategy
                icon: mdi:tune-variant
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_rh_target_min
                name: RH Min
                icon: mdi:water-minus
                display_mode: buttons
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_rh_target_max
                name: RH Max
                icon: mdi:water-plus
                display_mode: buttons
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_vpd_target_min
                name: VPD Min
                icon: mdi:waves-arrow-up
                display_mode: buttons
              - type: custom:mushroom-number-card
                entity: number.dsc_hub_vpd_target_max
                name: VPD Max
                icon: mdi:waves-arrow-up
                display_mode: buttons
          - type: heading
            heading: ⚡ TENT APPLIANCE DEMANDS
            heading_style: subtitle
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: entity
                entity: switch.dsc_hub_heater_demand
                icon: mdi:radiator
              - type: entity
                entity: switch.dsc_hub_ac_demand
                icon: mdi:snowflake
              - type: entity
                entity: switch.dsc_hub_humidifier_demand
                icon: mdi:air-humidifier
              - type: entity
                entity: switch.dsc_hub_dehumidifier_demand
                icon: mdi:water-remove
          - type: markdown
            content: >-
              *Full appliance modules live on the **Climate Engine** page — this
              tent page is environment-first.*
      - type: grid
        cards:
          - type: heading
            heading: 🌡️ ENVIRONMENT — 24 h
            heading_style: title
          - type: custom:mini-graph-card
            name: Temperature + heater/AC runs
            hours_to_show: 24
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_hub_tent_temperature
                name: Tent
              - entity: sensor.dsc_hub_room_temperature
                name: Room
              - entity: number.dsc_hub_target_temp
                name: Target
                show_points: false
              - entity: switch.dsc_hub_heater_demand
                name: Heat
                y_axis: secondary
                show_line: false
                show_points: false
                show_fill: true
                smoothing: false
              - entity: switch.dsc_hub_ac_demand
                name: AC
                y_axis: secondary
                show_line: false
                show_points: false
                show_fill: true
                smoothing: false
            lower_bound_secondary: 0
            upper_bound_secondary: 1
            show:
              labels: true
              extrema: true
              legend: true
          - type: custom:mini-graph-card
            name: Humidity + hum/dehum runs
            hours_to_show: 24
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_hub_tent_humidity
                name: RH
              - entity: switch.dsc_hub_humidifier_demand
                name: Hum
                y_axis: secondary
                show_line: false
                show_points: false
                show_fill: true
                smoothing: false
              - entity: switch.dsc_hub_dehumidifier_demand
                name: Dehum
                y_axis: secondary
                show_line: false
                show_points: false
                show_fill: true
                smoothing: false
            lower_bound_secondary: 0
            upper_bound_secondary: 1
            show:
              labels: true
              extrema: true
              legend: true
          - type: custom:mini-graph-card
            name: VPD
            hours_to_show: 24
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_hub_vpd_kpa
                name: VPD
              - entity: number.dsc_hub_vpd_target_min
                name: Min
                show_points: false
              - entity: number.dsc_hub_vpd_target_max
                name: Max
                show_points: false
            show:
              labels: true
              extrema: true
      - type: grid
        cards:
          # ============================================================
          #  v2.4 — THIS TENT HAS NO LIGHT
          #  Was "LIGHTING SNAPSHOT" showing the SF1000. That card was the
          #  single most misleading thing on the dashboard after the
          #  topology change: it put the clone tent's lamp on the 4x8's
          #  page, so every glance said "the main tent is lit" while the
          #  4x8 sat in the dark.
          # ============================================================
          - type: heading
            heading: 💡 LIGHTING — none fitted
            heading_style: title
          - type: custom:mushroom-template-card
            entity: binary_sensor.dsc_hub_4x8_window_open
            primary: >-
              4x8 window {{ 'OPEN' if is_state(entity,'on') else 'shut' }} — no
              lamp fitted
            secondary: >-
              The SF1000 moved to the 2x4 in v2.4. This tent keeps a photoperiod
              because the clones and the thermal loop still obey it. GPIO5 is
              reserved for a light here.
            icon: mdi:lightbulb-off-outline
            icon_color: "{{ 'blue' if is_state(entity,'on') else 'disabled' }}"
            multiline_secondary: true
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-v4/lighting
          - type: custom:mini-graph-card
            name: Virtual window — 24 h
            hours_to_show: 24
            cache: true
            points_per_hour: 60
            line_width: 1
            height: 90
            entities:
              - entity: binary_sensor.dsc_hub_4x8_window_open
                name: 4x8 window
                show_fill: true
                smoothing: false
            lower_bound: 0
            upper_bound: 1
            show:
              labels: false
              fill: true
          - type: heading
            heading: 🫧 CO2
            heading_style: subtitle
          - type: custom:gauge-card-pro
            entity: sensor.dsc_hub_dynamic_co2_ppm
            header: Dynamic CO2 (uncalibrated trend)
            min: 300
            max: 2000
            needle: true
            segments: |
              {{ [ {'from': 300, 'color': '#f59e0b'},
                   {'from': 800, 'color': '#22c55e'},
                   {'from': 1500, 'color': '#ef4444'} ] }}
          - type: custom:mini-graph-card
            name: CO2 trend — 24 h
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.dsc_hub_dynamic_co2_ppm
                name: CO2
            show:
              labels: true
              extrema: true
          - type: markdown
            content: >-
              *Uncalibrated ADC estimate — read the **shape**, never the
              number. Drops when the fresh-air floor lifts; climbs in a closed
              loop. An SCD41 drops onto the existing I2C bus when you want real
              ppm (block is parked in the firmware).*

  - title: 2x4 Clone
    icon: mdi:sprout
    path: clone-2x4
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🎯 CLONE MODE & TARGETS
            heading_style: title
          # v2.4 behaviour shift worth knowing before you touch this select:
          # Clone Mode -> Off now DARKS THE SF1000. In v2.3 it only dropped
          # the tent from arbitration.
          - type: custom:mushroom-select-card
            entity: select.dsc_hub_clone_mode
            name: Clone Mode
            icon: mdi:sprout-outline
            icon_color: green
          - type: conditional
            conditions:
              - condition: state
                entity: select.dsc_hub_clone_mode
                state: "Off"
            card:
              type: custom:mushroom-template-card

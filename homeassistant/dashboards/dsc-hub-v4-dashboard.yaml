                    name: Tent °C
                  - entity: number.dsc_hub_target_temp
                    name: Target
                    show_points: false
                  - entity: switch.dsc_hub_ac_demand
                    name: AC
                    y_axis: secondary
                    show_line: false
                    show_points: false
                    show_fill: true
                    smoothing: false
                lower_bound_secondary: 0
                upper_bound_secondary: 1
                show:
                  labels: true
                  extrema: true
                  legend: true
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: template
                    entity: sensor.dsc_ac_runtime_today
                    icon: mdi:clock-outline
                    icon_color: amber
                    content: "{{ states(entity)|float(0)|round(1) }}h today"
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_humidifier_demand
                primary: 💧 Humidifier · room channel
                secondary: >-
                  {% if is_state(entity,'on') %}RUNNING — serving {{
                  states('select.dsc_hub_priority_tent') }} — on for {{
                  relative_time(states[entity].last_changed) }} {% else %}Idle ·
                  would serve {{ states('select.dsc_hub_priority_tent') }}{%
                  endif %} · Auto {{ 'armed' if
                  is_state('switch.dsc_hub_humidifier_auto','on') else '⚠
                  DISARMED' }}
                icon: mdi:air-humidifier
                icon_color: "{{ 'amber' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                hold_action:
                  action: call-service
                  service: switch.toggle
                  target:
                    entity_id: switch.dsc_hub_humidifier_auto
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.dsc_hub_humidifier_fire_countdown
                    above: 0
                card:
                  type: custom:mushroom-template-card
                  entity: sensor.dsc_hub_humidifier_fire_countdown
                  primary: Escalating — fires in {{ states(entity)|round(0) }}s

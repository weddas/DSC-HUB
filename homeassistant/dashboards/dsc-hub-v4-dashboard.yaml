                icon: mdi:weather-windy
              solar:
                entity: sensor.dsc_airflow_room_supply
                name: Room
                icon: mdi:home-thermometer-outline
              battery:
                entity: sensor.dsc_airflow_reservoir_net
                name: 2x4 Reservoir
                icon: mdi:sprout
              home:
                entity: sensor.dsc_airflow_main_load
                name: 4x8 Main
                icon: mdi:greenhouse
            watt_threshold: 10000
            w_decimals: 0
            min_flow_rate: 0.9
            max_flow_rate: 6
            display_zero_lines:
              mode: show
          - type: markdown
            content: >-
              *Flux values are an **airflow proxy** (fan % × 10), not watts —
              read direction and relative magnitude, not units. When the heater
              interlock holds extraction, watch the Outside flow stall while the
              reservoir keeps feeding the 4x8.*


              *v2.4 note: the 2x4 reservoir is now **lit** during its window, so
              it is a warmer donor than it used to be. The SF1000's waste heat
              is a feature of this loop, not a side effect.*
          - type: heading
            heading: 🌀 FAN BANK
            heading_style: subtitle
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_4_inch_intake_fan_main
                name: Intake 4x8
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_4_inch_intake_fan_2x4
                name: Intake 2x4
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_6_inch_exhaust_room
                name: Exhaust Room
                show_percentage_control: true
                icon_animation: true
              - type: custom:mushroom-fan-card
                entity: fan.dsc_hub_6_inch_exhaust_outside
                name: Exhaust Outside
                show_percentage_control: true
                icon_animation: true
          - type: custom:mini-graph-card
            name: Fan speeds — 12 h
            hours_to_show: 12
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_fan_intake_main_pct
                name: In 4x8
              - entity: sensor.dsc_fan_intake_2x4_pct
                name: In 2x4
              - entity: sensor.dsc_fan_exhaust_room_pct
                name: Ex Room
              - entity: sensor.dsc_fan_exhaust_outside_pct
                name: Ex Out
            show:
              labels: true
              legend: true
          - type: custom:mini-graph-card
            name: The curve working — exhaust vs tent temp
            hours_to_show: 12
            cache: true
            points_per_hour: 60
            line_width: 2
            entities:
              - entity: sensor.dsc_hub_tent_temperature
                name: Tent °C
              - entity: sensor.dsc_fan_exhaust_outside_pct
                name: Exhaust %
                y_axis: secondary
            show:
              labels: true
              legend: true
          - type: heading
            heading: 🔌 APPLIANCE NODE HEALTH
            heading_style: subtitle
          # v2.4: the Sonoffs gained a duty-time sensor and a bounded 10-min
          # test mode. A node in test mode ignores hub demand — surfacing it
          # here stops that becoming a control-loop mystery next week.
          - type: custom:auto-entities
            card:
              type: entities
              title: Relay duty + test mode
              state_color: true
            filter:
              include:
                - entity_id: sensor.dsc_*_relay_on_time
                - entity_id: binary_sensor.dsc_*_test_mode
                - entity_id: switch.dsc_heater_main_relay
                - entity_id: switch.dsc_heatmat_main_relay
                - entity_id: switch.dsc_humidifier_main_relay
                - entity_id: switch.dsc_de_humidifier_main_relay
            sort:
              method: entity_id
      - type: grid
        cards:
          - type: heading
            heading: 🧩 APPLIANCE MODULES
            heading_style: title
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:mushroom-template-card
                entity: switch.dsc_hub_heater_demand
                primary: 🔥 Heater · 750 W
                secondary: >-
                  {% if is_state(entity,'on') %}RUNNING — on for {{
                  relative_time(states[entity].last_changed) }} {% else %}Idle —
                  last change {{ relative_time(states[entity].last_changed) }}
                  ago{% endif %} · Auto {{ 'armed' if
                  is_state('switch.dsc_hub_heater_auto','on') else '⚠ DISARMED'
                  }}
                icon: mdi:radiator
                icon_color: "{{ 'amber' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                hold_action:
                  action: call-service
                  service: switch.toggle
                  target:
                    entity_id: switch.dsc_hub_heater_auto
              # v2.4: firmware publishes these directly now. The Dashboard v3
              # plan called for HA-side timer helpers to reconstruct them —
              # that whole layer is redundant and should NOT be built.
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.dsc_hub_heater_fire_countdown
                    above: 0
                card:
                  type: custom:mushroom-template-card
                  entity: sensor.dsc_hub_heater_fire_countdown
                  primary: Escalating — fires in {{ states(entity)|round(0) }}s
                  secondary: Fans have had their window; heat still losing
                  icon: mdi:timer-outline
                  icon_color: orange
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.dsc_hub_heater_cooldown_remaining

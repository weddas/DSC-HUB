                icon: mdi:snowflake
                icon_color: "{{ 'amber' if is_state(entity,'on') else 'disabled' }}"
                tap_action:
                  action: more-info
                hold_action:
                  action: call-service
                  service: switch.toggle
                  target:
                    entity_id: switch.dsc_hub_ac_auto
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.dsc_hub_ac_fire_countdown
                    above: 0
                card:
                  type: custom:mushroom-template-card
                  entity: sensor.dsc_hub_ac_fire_countdown
                  primary: Escalating — fires in {{ states(entity)|round(0) }}s
                  icon: mdi:timer-outline
                  icon_color: orange
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.dsc_hub_ac_cooldown_remaining
                    above: 0
                card:
                  type: custom:mushroom-template-card
                  entity: sensor.dsc_hub_ac_cooldown_remaining
                  primary: Compressor lock — {{ states(entity)|round(0) }}s
                  secondary: Fixed 180s in firmware; not user-tunable
                  icon: mdi:timer-lock-outline
                  icon_color: blue
              - type: custom:mini-graph-card
                hours_to_show: 12

# Advanced hub — learning / trends / history.
title: Advanced
icon: mdi:brain
path: advanced
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: custom:dsc-app-nav-card
      - type: heading
        heading: Advanced
        heading_style: title
      - type: markdown
        content: |
          Calibration, effect learning, trends, and history. Operational levers
          stay under Ops; plant composition under Plant.
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            icon: mdi:school
            icon_color: teal
            content: Learning
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/learning
          - type: template
            icon: mdi:chart-timeline-variant
            icon_color: cyan
            content: Trends
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/trends
          - type: template
            icon: mdi:history
            icon_color: amber
            content: History
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/history
      - type: custom:mushroom-template-card
        primary: Learning
        secondary: Fan / PPFD cal, appliance effect DB, ETA
        icon: mdi:school
        icon_color: teal
        tap_action:
          action: navigate
          navigation_path: /dsc-hub-pro/learning
      - type: custom:mushroom-template-card
        primary: Trends
        secondary: Long-horizon climate and root signals
        icon: mdi:chart-timeline-variant
        icon_color: cyan
        tap_action:
          action: navigate
          navigation_path: /dsc-hub-pro/trends
      - type: custom:mushroom-template-card
        primary: History
        secondary: Logbook and session recall
        icon: mdi:history
        icon_color: amber
        tap_action:
          action: navigate
          navigation_path: /dsc-hub-pro/history

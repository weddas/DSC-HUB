# Plant hub — compose + catalog browse (two equal jobs).
title: Plant
icon: mdi:sprout
path: plant
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: custom:dsc-app-nav-card
      - type: heading
        heading: Plant
        heading_style: title
      - type: markdown
        content: |
          Compose a plant, then browse catalogs for climate / height / chemistry
          when indexed. Fleet seats and mix lab stay operational (Want–Need–Got).
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            icon: mdi:spa
            icon_color: green
            content: Compose
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/plant-build
          - type: template
            icon: mdi:bookshelf
            icon_color: teal
            content: Catalog
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/catalog
          - type: template
            icon: mdi:flower
            icon_color: purple
            content: Fleet seats
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/strains
          - type: template
            icon: mdi:flask
            icon_color: cyan
            content: Mix lab
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/nutrient-science
      - type: heading
        heading: Quick compose
        heading_style: subtitle
      - type: markdown
        content: |
          Full composition surface opens under **Compose**. Catalog Explorer
          supports filter / detail / compare and **Use in Build**.

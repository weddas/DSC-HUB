# Plant composition — Build a Plant (subview under Plant hub).
title: Compose
icon: mdi:spa
path: plant-build
subview: true
type: panel
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            icon: mdi:arrow-left
            icon_color: teal
            content: Plant hub
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/plant
          - type: template
            icon: mdi:bookshelf
            icon_color: green
            content: Catalog
            tap_action:
              action: navigate
              navigation_path: /dsc-hub-pro/catalog
      - type: custom:dsc-build-plant-card
        title: Build a Plant
        subtitle: Compose strain / medium / nutrition / light / climate - then commit to inventory.

title: Strains
icon: mdi:dna
path: strains
subview: true
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Strain catalog
        heading_style: title
      - type: markdown
        content: >-
          **Want** bands come from the catalog picker (schema v2 seeds) or custom
          slots with split seedling/veg/flower EC. **Got** = offset-corrected
          probes. **Need** = gap narrative.

          Catalog SoT: `sensor.dsc_strain_catalog` (`want_bands` attribute).
          Promote: `python scripts/promote_strain_catalog_to_ha.py`.

          **Compose a new plant** under Plant → [Compose](/dsc-hub-pro/plant-build)
          or browse the [Catalog](/dsc-hub-pro/catalog) (soil %, nutrients, light,
          climate Apply, roster inventory).

          Operator rule: **peer OR ESP absolute cal, not both**.

          **Tonight:** 1) Capture peer baseline → 2) Push peer → ESP.
          Status: `{{ states('input_text.dsc_peer_sync_status') }}`
      - type: entities
        title: Catalog status
        show_header_toggle: false
        entities:
          - entity: sensor.dsc_strain_catalog
            name: Strain catalog
          - entity: input_select.dsc_pot1_strain
            name: POT1 strain (HA picker)
      - type: markdown
        title: Plant roster
        content: >-
          {{ states('sensor.dsc_plant_roster_summary') }}

          {% for slot in state_attr('sensor.dsc_plant_roster_summary', 'slots') or [] %}
          **{{ slot.get('slot', loop.index) }}.** {{ slot.get('nickname') or 'Unnamed' }}
          · {{ slot.get('strain') or 'No strain' }} · {{ slot.get('status', 'unknown') }}
          · pot {{ slot.get('pot', 'none') }}

          {% endfor %}
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.dsc_dual_cal_stack_fleet
            state: "on"
        card:
          type: markdown
          content: >-
            **Dual-stack warn:** {{ states('sensor.dsc_dual_cal_stack_summary') }}
      - type: entities
        title: Peer sync actions
        show_header_toggle: false
        entities:
          - entity: script.dsc_pots_capture_peer_baseline
            name: Capture peer baseline
            icon: mdi:account-group
            secondary_info: last-triggered
          - entity: script.dsc_pots_push_peer_offsets_to_esp
            name: Push peer → ESP (SoT)
            icon: mdi:chip
            secondary_info: last-triggered
          - entity: script.dsc_migrate_strain_sprout_ha_to_pot
            name: Migrate HA → pot (strain/sprout)
            icon: mdi:export
            secondary_info: last-triggered
      - type: custom:mushroom-entity-card
        entity: script.dsc_pots_reset_peer_captures
        name: Hold to reset all captures
        icon: mdi:backup-restore
        icon_color: red
        secondary_info: none
        tap_action:
          action: none
        hold_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.dsc_pots_reset_peer_captures
      - type: markdown
        content: >-
          Hold resets **HA peer Got offsets only** (all pots → 0). Does not
          clear ESP Cal Offset/Scale. Capture again after reset.
      - type: entities
        title: Peer sync status
        show_header_toggle: false
        entities:
          - entity: input_boolean.dsc_peer_sync_auto
            name: Auto sync after shared water
          - entity: input_boolean.dsc_peer_sync_require_confirm
            name: Require confirm (no silent Capture)
          - entity: input_boolean.dsc_peer_push_force
            name: Force push if scale ≠ 1
          - entity: input_datetime.dsc_peer_sync_last
            name: Last peer sync
          - entity: input_text.dsc_peer_sync_method
            name: Last method
          - entity: input_text.dsc_peer_sync_status
            name: Status
          - entity: input_number.dsc_peer_sync_settle_min
            name: Settle minutes
          - entity: input_number.dsc_peer_sync_cooldown_h
            name: Cooldown hours
          - entity: sensor.dsc_dual_cal_stack_summary
            name: Dual-stack
          - entity: binary_sensor.dsc_dual_cal_stack_fleet
            name: Dual-stack fleet
          - entity: sensor.dsc_peer_divergence_summary
            name: Fleet divergence
          - entity: sensor.dsc_peer_divergence_ph
            name: ΔpH max
          - entity: sensor.dsc_peer_divergence_ec
            name: ΔEC max
          - entity: sensor.dsc_peer_divergence_moisture
            name: ΔMoisture max

  - type: grid
    column_span: 2
    cards:
      - type: custom:expander-card
        title: POT1
        expanded: true
        card_mod:
          style: |
            ha-card {
              border-left: 3px solid rgba(56,189,248,0.4);
              border-radius: 10px;
            }
            ha-card .title {
              font-weight: 600;
              letter-spacing: 0.3px;
            }
        cards:
          - type: entities
            entities:

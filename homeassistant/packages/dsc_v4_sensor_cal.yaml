# ==================================================================
#  DSC-HUB v5.1.8 · SENSOR CAL — peer sync + push-to-ESP + lab wet
#  ------------------------------------------------------------------
#  HA peer Got offsets + push into ESP Cal Offset (N-019).
#  Dual-stack warn (N-024). Auto-after-water confirm (N-026).
#  Lab wet two-point scale → ESP (N-016). See docs/LAB-WET-CAL.md.
#  MAD capture: script.dsc_pots_capture_peer_baseline (strain_catalog).
# ==================================================================

input_boolean:
  dsc_peer_sync_auto:
    name: "DSC Peer Sync Auto After Water"
    icon: mdi:sync
    initial: true
  dsc_peer_sync_require_confirm:
    name: "DSC Peer Sync Require Confirm"
    icon: mdi:hand-back-right
    initial: true
  dsc_peer_push_force:
    name: "DSC Peer Push Force (non-1 scale)"
    icon: mdi:alert-octagon
    initial: false
  dsc_lab_wet_force:
    name: "DSC Lab Wet Force (ignore HA peers)"
    icon: mdi:flask-empty-alert
    initial: false

input_datetime:
  dsc_peer_sync_last:
    name: "DSC Peer Sync Last"
    has_date: true
    has_time: true
    icon: mdi:clock-check

input_text:
  dsc_peer_sync_method:
    name: "DSC Peer Sync Method"
    max: 32
    initial: "none"
    icon: mdi:clipboard-check-outline
  dsc_peer_sync_status:
    name: "DSC Peer Sync Status"
    max: 255
    initial: "Never synced — Capture peer baseline or wait for auto after water."
    icon: mdi:information-outline

input_number:
  dsc_peer_sync_settle_min:
    name: "DSC Peer Sync Settle (min)"
    min: 5
    max: 120
    step: 5
    initial: 20
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand
  dsc_peer_sync_cooldown_h:
    name: "DSC Peer Sync Cooldown (h)"
    min: 1
    max: 48
    step: 1
    initial: 6
    unit_of_measurement: "h"
    mode: box
    icon: mdi:timer-outline
  # N-016 lab wet two-point wizard (operator fills measured + expected)
  dsc_lab_wet_pot:
    name: "DSC Lab Wet Target Pot"
    min: 1
    max: 4
    step: 1
    initial: 1
    mode: box
    icon: mdi:flower-pot
  dsc_lab_wet_ph_lo_meas:
    name: "DSC Lab Wet pH Low Measured"
    min: 3
    max: 9
    step: 0.01
    initial: 4.0
    mode: box
  dsc_lab_wet_ph_lo_exp:
    name: "DSC Lab Wet pH Low Expected"
    min: 3
    max: 9
    step: 0.01
    initial: 4.0
    mode: box
  dsc_lab_wet_ph_hi_meas:
    name: "DSC Lab Wet pH High Measured"
    min: 3
    max: 9
    step: 0.01
    initial: 7.0
    mode: box
  dsc_lab_wet_ph_hi_exp:
    name: "DSC Lab Wet pH High Expected"
    min: 3
    max: 9
    step: 0.01
    initial: 7.0
    mode: box
  dsc_lab_wet_ec_lo_meas:
    name: "DSC Lab Wet EC Low Measured"
    min: 0
    max: 10000
    step: 1
    initial: 0
    unit_of_measurement: "µS/cm"
    mode: box
  dsc_lab_wet_ec_lo_exp:
    name: "DSC Lab Wet EC Low Expected"
    min: 0
    max: 10000
    step: 1
    initial: 0
    unit_of_measurement: "µS/cm"
    mode: box
  dsc_lab_wet_ec_hi_meas:
    name: "DSC Lab Wet EC High Measured"
    min: 0
    max: 10000
    step: 1
    initial: 1413
    unit_of_measurement: "µS/cm"
    mode: box
  dsc_lab_wet_ec_hi_exp:
    name: "DSC Lab Wet EC High Expected"
    min: 0
    max: 10000
    step: 1
    initial: 1413
    unit_of_measurement: "µS/cm"
    mode: box
  dsc_lab_wet_m_lo_meas:
    name: "DSC Lab Wet Moisture Low Measured"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    unit_of_measurement: "%"
    mode: box
  dsc_lab_wet_m_lo_exp:
    name: "DSC Lab Wet Moisture Low Expected"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    unit_of_measurement: "%"
    mode: box
  dsc_lab_wet_m_hi_meas:
    name: "DSC Lab Wet Moisture High Measured"
    min: 0
    max: 100
    step: 0.1
    initial: 100
    unit_of_measurement: "%"
    mode: box
  dsc_lab_wet_m_hi_exp:
    name: "DSC Lab Wet Moisture High Expected"
    min: 0
    max: 100
    step: 0.1
    initial: 100
    unit_of_measurement: "%"
    mode: box

input_select:
  dsc_lab_wet_channel:
    name: "DSC Lab Wet Channel"
    icon: mdi:flask
    options:
      - "ph"
      - "ec"
      - "moisture"
    initial: "ph"

template:
  - binary_sensor:
      - name: "DSC POT1 Dual Cal Stack"
        unique_id: dsc_probe1_dual_cal_stack
        device_class: problem
        icon: mdi:layers-triple
        state: >
          {% if not is_state('input_boolean.dsc_probe1_in_service','on') %}false
          {% else %}
          {% set eps = 0.05 %}
          {% set ha_ph = states('input_number.dsc_probe1_offset_ph')|float(0)|abs %}
          {% set ha_ec = states('input_number.dsc_probe1_offset_ec_us')|float(0)|abs %}
          {% set ha_m = states('input_number.dsc_probe1_offset_moisture')|float(0)|abs %}
          {% set ha = ha_ph > eps or ha_ec > 1 or ha_m > eps %}
          {% set eo = states('number.dsc_probe1_cal_ph_offset')|float(0)|abs > eps
             or states('number.dsc_probe1_cal_conductivity_offset')|float(0)|abs > 1
             or states('number.dsc_probe1_cal_moisture_offset')|float(0)|abs > eps
             or (states('number.dsc_probe1_cal_ph_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe1_cal_conductivity_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe1_cal_moisture_scale')|float(1) - 1)|abs > 0.02 %}
          {{ ha and eo }}
          {% endif %}
      - name: "DSC POT2 Dual Cal Stack"
        unique_id: dsc_probe2_dual_cal_stack
        device_class: problem
        icon: mdi:layers-triple
        state: >
          {% if not is_state('input_boolean.dsc_probe2_in_service','on') %}false
          {% else %}
          {% set eps = 0.05 %}
          {% set ha = states('input_number.dsc_probe2_offset_ph')|float(0)|abs > eps
             or states('input_number.dsc_probe2_offset_ec_us')|float(0)|abs > 1
             or states('input_number.dsc_probe2_offset_moisture')|float(0)|abs > eps %}
          {% set eo = states('number.dsc_probe2_cal_ph_offset')|float(0)|abs > eps
             or states('number.dsc_probe2_cal_conductivity_offset')|float(0)|abs > 1
             or states('number.dsc_probe2_cal_moisture_offset')|float(0)|abs > eps
             or (states('number.dsc_probe2_cal_ph_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe2_cal_conductivity_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe2_cal_moisture_scale')|float(1) - 1)|abs > 0.02 %}
          {{ ha and eo }}
          {% endif %}
      - name: "DSC POT3 Dual Cal Stack"
        unique_id: dsc_probe3_dual_cal_stack
        device_class: problem
        icon: mdi:layers-triple
        state: >
          {% if not is_state('input_boolean.dsc_probe3_in_service','on') %}false
          {% else %}
          {% set eps = 0.05 %}
          {% set ha = states('input_number.dsc_probe3_offset_ph')|float(0)|abs > eps
             or states('input_number.dsc_probe3_offset_ec_us')|float(0)|abs > 1
             or states('input_number.dsc_probe3_offset_moisture')|float(0)|abs > eps %}
          {% set eo = states('number.dsc_probe3_cal_ph_offset')|float(0)|abs > eps
             or states('number.dsc_probe3_cal_conductivity_offset')|float(0)|abs > 1
             or states('number.dsc_probe3_cal_moisture_offset')|float(0)|abs > eps
             or (states('number.dsc_probe3_cal_ph_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe3_cal_conductivity_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe3_cal_moisture_scale')|float(1) - 1)|abs > 0.02 %}
          {{ ha and eo }}
          {% endif %}
      - name: "DSC POT4 Dual Cal Stack"
        unique_id: dsc_probe4_dual_cal_stack
        device_class: problem
        icon: mdi:layers-triple
        state: >
          {% if not is_state('input_boolean.dsc_probe4_in_service','on') %}false
          {% else %}
          {% set eps = 0.05 %}
          {% set ha = states('input_number.dsc_probe4_offset_ph')|float(0)|abs > eps
             or states('input_number.dsc_probe4_offset_ec_us')|float(0)|abs > 1
             or states('input_number.dsc_probe4_offset_moisture')|float(0)|abs > eps %}
          {% set eo = states('number.dsc_probe4_cal_ph_offset')|float(0)|abs > eps
             or states('number.dsc_probe4_cal_conductivity_offset')|float(0)|abs > 1
             or states('number.dsc_probe4_cal_moisture_offset')|float(0)|abs > eps
             or (states('number.dsc_probe4_cal_ph_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe4_cal_conductivity_scale')|float(1) - 1)|abs > 0.02
             or (states('number.dsc_probe4_cal_moisture_scale')|float(1) - 1)|abs > 0.02 %}
          {{ ha and eo }}
          {% endif %}
      - name: "DSC Dual Cal Stack Fleet"
        unique_id: dsc_dual_cal_stack_fleet
        device_class: problem
        icon: mdi:layers-triple
        state: >
          {{ is_state('binary_sensor.dsc_probe1_dual_cal_stack','on')
             or is_state('binary_sensor.dsc_probe2_dual_cal_stack','on')
             or is_state('binary_sensor.dsc_probe3_dual_cal_stack','on')
             or is_state('binary_sensor.dsc_probe4_dual_cal_stack','on') }}

  - sensor:
      - name: "DSC Dual Cal Stack Summary"
        unique_id: dsc_dual_cal_stack_summary
        icon: mdi:layers-triple
        state: >
          {% if is_state('binary_sensor.dsc_dual_cal_stack_fleet','on') %}
            {% set ns = namespace(p=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('binary_sensor.dsc_pot' ~ n ~ '_dual_cal_stack','on') %}
                {% set ns.p = ns.p + ['POT' ~ n] %}
              {% endif %}
            {% endfor %}
            Dual stack on {{ ns.p|join(', ') }} — peer OR ESP absolute, not both. Push peer → ESP or clear one layer.
          {% else %}
            OK — single cal layer (or identity)
          {% endif %}

      - name: "DSC Peer Divergence pH"
        unique_id: dsc_peer_divergence_ph
        unit_of_measurement: "pH"
        icon: mdi:delta
        state: >
          {% set ns = namespace(v=[]) %}
          {% for n in [1,2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_ph')|float(none) %}
              {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.v|length < 2 %}unavailable
          {% else %}
            {% set med = (ns.v|sort)[((ns.v|length)-1)//2] %}
            {% set dmax = namespace(m=0.0) %}
            {% for x in ns.v %}
              {% set d = (x - med)|abs %}
              {% if d > dmax.m %}{% set dmax.m = d %}{% endif %}
            {% endfor %}
            {{ dmax.m|round(2) }}
          {% endif %}
        attributes:
          note: "Max |raw − median| among in-service pots (dashboard only)."

      - name: "DSC Peer Divergence EC"
        unique_id: dsc_peer_divergence_ec
        unit_of_measurement: "µS/cm"
        icon: mdi:delta
        state: >
          {% set ns = namespace(v=[]) %}
          {% for n in [1,2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_conductivity')|float(none) %}
              {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.v|length < 2 %}unavailable
          {% else %}
            {% set med = (ns.v|sort)[((ns.v|length)-1)//2] %}
            {% set dmax = namespace(m=0.0) %}
            {% for x in ns.v %}
              {% set d = (x - med)|abs %}
              {% if d > dmax.m %}{% set dmax.m = d %}{% endif %}
            {% endfor %}
            {{ dmax.m|round(0) }}
          {% endif %}

      - name: "DSC Peer Divergence Moisture"
        unique_id: dsc_peer_divergence_moisture
        unit_of_measurement: "%"
        icon: mdi:delta
        state: >
          {% set ns = namespace(v=[]) %}
          {% for n in [1,2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_moisture')|float(none) %}
              {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.v|length < 2 %}unavailable
          {% else %}
            {% set med = (ns.v|sort)[((ns.v|length)-1)//2] %}
            {% set dmax = namespace(m=0.0) %}
            {% for x in ns.v %}
              {% set d = (x - med)|abs %}
              {% if d > dmax.m %}{% set dmax.m = d %}{% endif %}
            {% endfor %}
            {{ dmax.m|round(1) }}
          {% endif %}

      - name: "DSC Peer Divergence Summary"
        unique_id: dsc_peer_divergence_summary
        icon: mdi:chart-scatter-plot
        state: >
          {% set ph = states('sensor.dsc_peer_divergence_ph') %}
          {% set ec = states('sensor.dsc_peer_divergence_ec') %}
          {% set m = states('sensor.dsc_peer_divergence_moisture') %}
          {% if ph in ['unknown','unavailable'] or ec in ['unknown','unavailable'] or m in ['unknown','unavailable'] %}
            Need ≥2 in-service pots with readings
          {% else %}
            ΔpH {{ ph }} · ΔEC {{ ec }} · ΔM {{ m }}%
          {% endif %}

script:
  dsc_pots_push_peer_offsets_to_esp:
    alias: "DSC Pots Push Peer Offsets → ESP"
    description: >-
      Additive merge HA peer offsets into ESP Cal Offset (pH/EC/moisture),
      zero HA offsets, stamp peer_median on pot (FW 5.1.5+). Refuses if any
      cal scale ≠ 1 unless Force is on.
    mode: single
    sequence:
      - variables:
          force: "{{ is_state('input_boolean.dsc_peer_push_force','on') }}"
          scale_bad: >
            {% set ns = namespace(b=false) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% for s in ['ph','conductivity','moisture'] %}
                  {% set sc = states('number.dsc_pot' ~ n ~ '_cal_' ~ s ~ '_scale')|float(1) %}
                  {% if (sc - 1)|abs > 0.02 %}{% set ns.b = true %}{% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.b }}
          any_peer: >
            {% set ns = namespace(b=false) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% if states('input_number.dsc_pot' ~ n ~ '_offset_ph')|float(0)|abs > 0.05
                   or states('input_number.dsc_pot' ~ n ~ '_offset_ec_us')|float(0)|abs > 1
                   or states('input_number.dsc_pot' ~ n ~ '_offset_moisture')|float(0)|abs > 0.05 %}
                  {% set ns.b = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.b }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not any_peer }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.dsc_peer_sync_status }
                data:
                  value: "Push aborted — no non-zero HA peer offsets on in-service pots. Capture first."
              - action: persistent_notification.create
                data:
                  title: "Peer → ESP push aborted"
                  message: "No HA peer offsets to push. Run Capture peer baseline first."
              - stop: "no peer offsets"
          - conditions:
              - condition: template
                value_template: "{{ scale_bad and not force }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.dsc_peer_sync_status }
                data:
                  value: "Push aborted — ESP cal scale ≠ 1. Enable Force (lab two-point) or reset scales."
              - action: persistent_notification.create
                data:
                  title: "Peer → ESP push aborted"
                  message: >-
                    One or more in-service pots have Cal Scale ≠ 1.
                    Turn on DSC Peer Push Force to merge offsets only, or reset scales to 1.0.
              - stop: "scale guard"
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - condition: template
              value_template: "{{ is_state('input_boolean.dsc_pot' ~ repeat.item ~ '_in_service','on') }}"
            - variables:
                n: "{{ repeat.item }}"
                ph_esp: "{{ states('number.dsc_pot' ~ repeat.item ~ '_cal_ph_offset')|float(0) }}"
                ph_ha: "{{ states('input_number.dsc_pot' ~ repeat.item ~ '_offset_ph')|float(0) }}"
                ec_esp: "{{ states('number.dsc_pot' ~ repeat.item ~ '_cal_conductivity_offset')|float(0) }}"
                ec_ha: "{{ states('input_number.dsc_pot' ~ repeat.item ~ '_offset_ec_us')|float(0) }}"
                m_esp: "{{ states('number.dsc_pot' ~ repeat.item ~ '_cal_moisture_offset')|float(0) }}"
                m_ha: "{{ states('input_number.dsc_pot' ~ repeat.item ~ '_offset_moisture')|float(0) }}"
                ph_merged: "{{ [[(ph_esp|float + ph_ha|float), -2]|max, 2]|min }}"
                ec_merged: "{{ [[(ec_esp|float + ec_ha|float), -2000]|max, 2000]|min }}"
                m_merged: "{{ [[(m_esp|float + m_ha|float), -50]|max, 50]|min }}"
                ph_resid: "{{ (ph_esp|float + ph_ha|float) - (ph_merged|float) }}"
                ec_resid: "{{ (ec_esp|float + ec_ha|float) - (ec_merged|float) }}"
                m_resid: "{{ (m_esp|float + m_ha|float) - (m_merged|float) }}"
            - action: number.set_value
              target: { entity_id: "number.dsc_pot{{ n }}_cal_ph_offset" }
              data: { value: "{{ ph_merged|float|round(2) }}" }
            - action: number.set_value
              target: { entity_id: "number.dsc_pot{{ n }}_cal_conductivity_offset" }
              data: { value: "{{ ec_merged|float|round(0) }}" }
            - action: number.set_value
              target: { entity_id: "number.dsc_pot{{ n }}_cal_moisture_offset" }
              data: { value: "{{ m_merged|float|round(1) }}" }
            - action: input_number.set_value
              target: { entity_id: "input_number.dsc_pot{{ n }}_offset_ph" }
              data: { value: "{{ ph_resid|float|round(2) }}" }
            - action: input_number.set_value
              target: { entity_id: "input_number.dsc_pot{{ n }}_offset_ec_us" }
              data: { value: "{{ ec_resid|float|round(0) }}" }
            - action: input_number.set_value
              target: { entity_id: "input_number.dsc_pot{{ n }}_offset_moisture" }
              data: { value: "{{ m_resid|float|round(1) }}" }
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {% set a = 'button.dsc_pot' ~ n ~ '_mark_soil_cal_peer_median' %}
                        {% set b = 'button.dsc_pot_' ~ n ~ '_mark_soil_cal_peer_median' %}
                        {{ states(a) not in ['unknown','unavailable','']
                           or states(b) not in ['unknown','unavailable',''] }}
                  sequence:
                    - variables:
                        mark_btn: >-
                          {% set a = 'button.dsc_pot' ~ n ~ '_mark_soil_cal_peer_median' %}
                          {% set b = 'button.dsc_pot_' ~ n ~ '_mark_soil_cal_peer_median' %}
                          {{ a if states(a) not in ['unknown','unavailable',''] else b }}
                    - action: button.press
                      target: { entity_id: "{{ mark_btn }}" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.dsc_peer_sync_last }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_method }
        data: { value: peer_median_pushed }
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_status }
        data:
          value: >-
            Pushed {{ now().strftime('%Y-%m-%d %H:%M') }} → ESP Cal Offset;
            HA peer offsets zeroed. Method peer_median (needs pot FW 5.1.5+).
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.dsc_peer_push_force }
      - action: persistent_notification.create
        data:
          title: "Peer offsets pushed to ESP"
          message: >-
            ESP Cal Offset now holds peer alignment. Got ≈ soil_*.
            ESP-NOW/mat see the same values. Dual-stack warn should clear.

  dsc_pots_apply_lab_wet_to_esp:
    alias: "DSC Pots Apply Lab Wet → ESP"
    description: >-
      Two-point lab buffer → ESP Cal Scale+Offset for selected pot/channel
      (N-016). Refuses if HA peer offsets non-zero unless Force. Stamps
      lab_buffer via Mark button (pot FW 5.1.6+). See docs/LAB-WET-CAL.md.
    mode: single
    sequence:
      - variables:
          n: "{{ states('input_number.dsc_lab_wet_pot')|int(1) }}"
          ch: "{{ states('input_select.dsc_lab_wet_channel') }}"
          force: "{{ is_state('input_boolean.dsc_lab_wet_force','on') }}"
          ha_peer: >
            {% set n = states('input_number.dsc_lab_wet_pot')|int(1) %}
            {{ states('input_number.dsc_pot' ~ n ~ '_offset_ph')|float(0)|abs > 0.05
               or states('input_number.dsc_pot' ~ n ~ '_offset_ec_us')|float(0)|abs > 1
               or states('input_number.dsc_pot' ~ n ~ '_offset_moisture')|float(0)|abs > 0.05 }}
          m_lo: >
            {% set c = states('input_select.dsc_lab_wet_channel') %}
            {% if c == 'ph' %}{{ states('input_number.dsc_lab_wet_ph_lo_meas')|float(0) }}
            {% elif c == 'ec' %}{{ states('input_number.dsc_lab_wet_ec_lo_meas')|float(0) }}
            {% else %}{{ states('input_number.dsc_lab_wet_m_lo_meas')|float(0) }}{% endif %}
          m_hi: >
            {% set c = states('input_select.dsc_lab_wet_channel') %}
            {% if c == 'ph' %}{{ states('input_number.dsc_lab_wet_ph_hi_meas')|float(0) }}
            {% elif c == 'ec' %}{{ states('input_number.dsc_lab_wet_ec_hi_meas')|float(0) }}
            {% else %}{{ states('input_number.dsc_lab_wet_m_hi_meas')|float(0) }}{% endif %}
          e_lo: >
            {% set c = states('input_select.dsc_lab_wet_channel') %}
            {% if c == 'ph' %}{{ states('input_number.dsc_lab_wet_ph_lo_exp')|float(0) }}
            {% elif c == 'ec' %}{{ states('input_number.dsc_lab_wet_ec_lo_exp')|float(0) }}
            {% else %}{{ states('input_number.dsc_lab_wet_m_lo_exp')|float(0) }}{% endif %}
          e_hi: >
            {% set c = states('input_select.dsc_lab_wet_channel') %}
            {% if c == 'ph' %}{{ states('input_number.dsc_lab_wet_ph_hi_exp')|float(0) }}
            {% elif c == 'ec' %}{{ states('input_number.dsc_lab_wet_ec_hi_exp')|float(0) }}
            {% else %}{{ states('input_number.dsc_lab_wet_m_hi_exp')|float(0) }}{% endif %}
          scale: >
            {% set dm = (m_hi|float) - (m_lo|float) %}
            {% set de = (e_hi|float) - (e_lo|float) %}
            {% if dm|abs < 0.001 %}0{% else %}{{ (de / dm)|round(4) }}{% endif %}
          offset: >
            {% set sc = scale|float(0) %}
            {{ ((e_lo|float) - sc * (m_lo|float))|round(3) }}
          scale_ent: >
            {% set c = states('input_select.dsc_lab_wet_channel') %}
            {% set n = states('input_number.dsc_lab_wet_pot')|int(1) %}
            {% if c == 'ph' %}number.dsc_pot{{ n }}_cal_ph_scale
            {% elif c == 'ec' %}number.dsc_pot{{ n }}_cal_conductivity_scale
            {% else %}number.dsc_pot{{ n }}_cal_moisture_scale{% endif %}
          offset_ent: >
            {% set c = states('input_select.dsc_lab_wet_channel') %}
            {% set n = states('input_number.dsc_lab_wet_pot')|int(1) %}
            {% if c == 'ph' %}number.dsc_pot{{ n }}_cal_ph_offset
            {% elif c == 'ec' %}number.dsc_pot{{ n }}_cal_conductivity_offset
            {% else %}number.dsc_pot{{ n }}_cal_moisture_offset{% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ha_peer and not force }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.dsc_peer_sync_status }
                data:
                  value: "Lab wet aborted — HA peer offsets still set. Push/zero peers or enable Force."
              - stop: "dual stack"
          - conditions:
              - condition: template
                value_template: "{{ (scale|float(0))|abs < 0.001 }}"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.dsc_peer_sync_status }
                data:
                  value: "Lab wet aborted — measured span too small (hi ≈ lo)."
              - stop: "span"
      - action: number.set_value
        target: { entity_id: "{{ scale_ent }}" }
        data: { value: "{{ scale|float }}" }
      - action: number.set_value
        target: { entity_id: "{{ offset_ent }}" }
        data: { value: "{{ offset|float }}" }
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set a = 'button.dsc_pot' ~ n ~ '_mark_soil_cal_lab_buffer' %}
                  {% set b = 'button.dsc_pot_' ~ n ~ '_mark_soil_cal_lab_buffer' %}
                  {{ states(a) not in ['unknown','unavailable','']
                     or states(b) not in ['unknown','unavailable',''] }}
            sequence:
              - variables:
                  mark_btn: >-
                    {% set a = 'button.dsc_pot' ~ n ~ '_mark_soil_cal_lab_buffer' %}
                    {% set b = 'button.dsc_pot_' ~ n ~ '_mark_soil_cal_lab_buffer' %}
                    {{ a if states(a) not in ['unknown','unavailable',''] else b }}
              - action: button.press
                target: { entity_id: "{{ mark_btn }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_status }
        data:
          value: >-
            Lab wet POT{{ n }} {{ ch }} → scale {{ scale }} offset {{ offset }}
            at {{ now().strftime('%Y-%m-%d %H:%M') }} (lab_buffer).
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.dsc_lab_wet_force }
      - action: persistent_notification.create
        data:
          title: "Lab wet applied"
          message: >-
            POT{{ n }} {{ ch }}: scale={{ scale }} offset={{ offset }}.
            Method lab_buffer (needs pot FW 5.1.6+). Do not also stack HA peers.

  dsc_pots_reset_peer_captures:
    alias: "DSC Pots Reset Peer Captures"
    description: >-
      Zero all HA peer Got offsets (pH/EC/moisture) and clear peer sync
      method/status. Does not touch ESP Cal Offset/Scale.
    mode: single
    sequence:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                n: "{{ repeat.item }}"
            - action: input_number.set_value
              target: { entity_id: "input_number.dsc_pot{{ n }}_offset_ph" }
              data: { value: 0 }
            - action: input_number.set_value
              target: { entity_id: "input_number.dsc_pot{{ n }}_offset_ec_us" }
              data: { value: 0 }
            - action: input_number.set_value
              target: { entity_id: "input_number.dsc_pot{{ n }}_offset_moisture" }
              data: { value: 0 }
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_method }
        data: { value: "none" }
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_status }
        data:
          value: >-
            Peer captures cleared {{ now().strftime('%Y-%m-%d %H:%M') }}.
            HA offsets zeroed — Capture again when ready. ESP Cal untouched.
      - action: persistent_notification.create
        data:
          title: "Peer captures reset"
          message: >-
            All HA peer Got offsets set to 0. ESP Cal Offset/Scale unchanged.
            Run Capture peer baseline to rebuild offsets.

automation:
  - id: dsc_peer_sync_after_water
    alias: "DSC Peer Sync · After shared watering"
    description: >-
      Coherent moisture rise → settle → Capture (or status-only if Require Confirm).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.dsc_probe1_soil_moisture_rate
          - sensor.dsc_probe2_soil_moisture_rate
          - sensor.dsc_probe3_soil_moisture_rate
          - sensor.dsc_probe4_soil_moisture_rate
        above: 1.5
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: input_boolean.dsc_peer_sync_auto
        state: "on"
      - condition: template
        value_template: >
          {% set thr = states('input_number.dsc_coherence_moisture_event_pts')|float(8) / 6 %}
          {% set up = namespace(n=0) %}
          {% for i in [1,2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ i ~ '_in_service','on')
                 and states('sensor.dsc_pot' ~ i ~ '_soil_moisture_rate')|float(0) >= thr %}
              {% set up.n = up.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ up.n >= 2 }}
      - condition: template
        value_template: >
          {% set last = states('input_datetime.dsc_peer_sync_last') %}
          {% set cd = states('input_number.dsc_peer_sync_cooldown_h')|float(6) %}
          {% if last in ['unknown','unavailable',''] %}true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last, 0)) >= cd * 3600 }}
          {% endif %}
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_status }
        data:
          value: >-
            Shared moisture rise — settling
            {{ states('input_number.dsc_peer_sync_settle_min')|int(20) }} min…
      - delay:
          minutes: "{{ states('input_number.dsc_peer_sync_settle_min')|int(20) }}"
      - condition: state
        entity_id: input_boolean.dsc_peer_sync_auto
        state: "on"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.dsc_peer_sync_require_confirm
                state: "on"
            sequence:
              - action: input_text.set_value
                target: { entity_id: input_text.dsc_peer_sync_status }
                data:
                  value: >-
                    Ready after water — press Capture peer baseline and/or
                    Push peer → ESP (auto did not rewrite offsets).
              - action: persistent_notification.create
                data:
                  title: "Peer sync ready"
                  message: "Shared watering settled. Confirm Capture / Push on Strains."
        default:
          - action: script.dsc_pots_capture_peer_baseline
            data:
              sync_source: peer_median_auto

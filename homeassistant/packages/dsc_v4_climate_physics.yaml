# ==================================================================
#  DSC-HUB v4 · CLIMATE PHYSICS / PLANT SPECS
#  ------------------------------------------------------------------
#  Operator-settable nameplate constants (CFM, volumes, dehum L/day…).
#  Optional L×W×H (cm) helpers + Apply scripts write dsc_vol_*_m3.
#  Live CFM: optional multi-point curves (dsc_v4_device_cal) interpolate
#  when ≥2 points set; otherwise pct × nameplate (unchanged default).
#  Derived sensors: live CFM, ACH, AH, BTU budget, moisture burn-off.
#  Verification binaries flag impossible / incomplete specs.
# ==================================================================

input_number:
  # --- Volumes (free air, packed tents) ---
  dsc_vol_4x8_m3:
    name: "DSC Spec · 4x8 Volume"
    min: 0.5
    max: 12
    step: 0.1
    initial: 2.5
    unit_of_measurement: "m³"
    icon: mdi:cube-outline
    mode: box

  dsc_vol_2x4_m3:
    name: "DSC Spec · 2x4 Volume"
    min: 0.2
    max: 6
    step: 0.1
    initial: 0.8
    unit_of_measurement: "m³"
    icon: mdi:cube-outline
    mode: box

  dsc_vol_room_m3:
    name: "DSC Spec · Room Lung Volume"
    min: 5
    max: 250
    step: 1
    initial: 40
    unit_of_measurement: "m³"
    icon: mdi:home-floor-1
    mode: box

  # --- Optional L×W×H (cm) → m³ helpers (Apply scripts write dsc_vol_*_m3) ---
  dsc_dim_4x8_l_cm:
    name: "DSC Spec · 4x8 Length"
    min: 0
    max: 500
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-left-right
    mode: box

  dsc_dim_4x8_w_cm:
    name: "DSC Spec · 4x8 Width"
    min: 0
    max: 500
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-left-right
    mode: box

  dsc_dim_4x8_h_cm:
    name: "DSC Spec · 4x8 Height"
    min: 0
    max: 400
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-up-down
    mode: box

  dsc_dim_2x4_l_cm:
    name: "DSC Spec · 2x4 Length"
    min: 0
    max: 400
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-left-right
    mode: box

  dsc_dim_2x4_w_cm:
    name: "DSC Spec · 2x4 Width"
    min: 0
    max: 400
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-left-right
    mode: box

  dsc_dim_2x4_h_cm:
    name: "DSC Spec · 2x4 Height"
    min: 0
    max: 400
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-up-down
    mode: box

  dsc_dim_room_l_cm:
    name: "DSC Spec · Room Length"
    min: 0
    max: 2000
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-left-right
    mode: box

  dsc_dim_room_w_cm:
    name: "DSC Spec · Room Width"
    min: 0
    max: 2000
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-left-right
    mode: box

  dsc_dim_room_h_cm:
    name: "DSC Spec · Room Height"
    min: 0
    max: 600
    step: 1
    initial: 0
    unit_of_measurement: "cm"
    icon: mdi:arrow-up-down
    mode: box

  # --- Fan nameplate @ 100% command ---
  dsc_cfm_out_max:
    name: "DSC Spec · OUT Fan Max CFM"
    min: 50
    max: 1500
    step: 5
    initial: 440
    unit_of_measurement: "CFM"
    icon: mdi:fan-chevron-up
    mode: box

  dsc_cfm_recirc_max:
    name: "DSC Spec · RECIRC Fan Max CFM"
    min: 50
    max: 1500
    step: 5
    initial: 440
    unit_of_measurement: "CFM"
    icon: mdi:fan-chevron-up
    mode: box

  dsc_cfm_intake_main_max:
    name: "DSC Spec · Intake Main Max CFM"
    min: 20
    max: 800
    step: 5
    initial: 200
    unit_of_measurement: "CFM"
    icon: mdi:fan
    mode: box

  dsc_cfm_intake_clone_max:
    name: "DSC Spec · Intake 2x4 Max CFM"
    min: 20
    max: 800
    step: 5
    initial: 200
    unit_of_measurement: "CFM"
    icon: mdi:fan
    mode: box

  # --- Appliance / light nameplates ---
  dsc_heater_w:
    name: "DSC Spec · Heater Watts"
    min: 0
    max: 3000
    step: 50
    initial: 750
    unit_of_measurement: "W"
    icon: mdi:radiator
    mode: box

  dsc_ac_btu_hr:
    name: "DSC Spec · AC Capacity"
    min: 0
    max: 24000
    step: 100
    initial: 0
    unit_of_measurement: "BTU/h"
    icon: mdi:snowflake
    mode: box

  dsc_light_4x8_w:
    name: "DSC Spec · 4x8 Light Watts"
    min: 0
    max: 2000
    step: 10
    initial: 0
    unit_of_measurement: "W"
    icon: mdi:wall-sconce-flat
    mode: box

  dsc_sf1000_w:
    name: "DSC Spec · SF1000 Watts @100%"
    min: 0
    max: 500
    step: 5
    initial: 100
    unit_of_measurement: "W"
    icon: mdi:lightbulb-on
    mode: box

  dsc_dehum_l_day:
    name: "DSC Spec · Dehumidifier L/day"
    min: 0
    max: 100
    step: 0.5
    initial: 20
    unit_of_measurement: "L/d"
    icon: mdi:water-remove
    mode: box

  dsc_hum_ml_hr:
    name: "DSC Spec · Humidifier mL/hour"
    min: 0
    max: 2000
    step: 10
    initial: 300
    unit_of_measurement: "mL/h"
    icon: mdi:air-humidifier
    mode: box

  dsc_learn_mat_expected_c_min:
    name: "DSC Spec · Mat Expected Rise"
    min: 0.01
    max: 0.5
    step: 0.01
    initial: 0.05
    unit_of_measurement: "°C/min"
    icon: mdi:heating-coil
    mode: box

  dsc_learn_recirc_expected_ah_min:
    name: "DSC Spec · Recirc Expected AH Rise"
    min: 0.01
    max: 0.5
    step: 0.01
    initial: 0.05
    unit_of_measurement: "g/m³/min"
    icon: mdi:fan
    mode: box

  dsc_plant_transpiration_g_hr:
    name: "DSC Spec · Plant Transpiration"
    min: 0
    max: 500
    step: 5
    initial: 40
    unit_of_measurement: "g/h"
    icon: mdi:leaf
    mode: box

template:
  - binary_sensor:
      # Spec verification — problem class so they surface on Climate / alerts.
      - name: "DSC Plant Specs Incomplete"
        unique_id: dsc_plant_specs_incomplete
        device_class: problem
        icon: mdi:clipboard-alert-outline
        state: >-
          {% set out = states('input_number.dsc_cfm_out_max')|float(0) %}
          {% set rec = states('input_number.dsc_cfm_recirc_max')|float(0) %}
          {% set im = states('input_number.dsc_cfm_intake_main_max')|float(0) %}
          {% set ic = states('input_number.dsc_cfm_intake_clone_max')|float(0) %}
          {% set v8 = states('input_number.dsc_vol_4x8_m3')|float(0) %}
          {% set v2 = states('input_number.dsc_vol_2x4_m3')|float(0) %}
          {% set vr = states('input_number.dsc_vol_room_m3')|float(0) %}
          {{ out < 50 or rec < 50 or im < 20 or ic < 20
             or v8 < 0.5 or v2 < 0.2 or vr < 5 }}

      - name: "DSC Plant Specs Intake Over Exhaust"
        unique_id: dsc_plant_specs_intake_over_exhaust
        device_class: problem
        icon: mdi:swap-vertical-bold
        state: >-
          {% set ex = states('input_number.dsc_cfm_out_max')|float(0)
                    + states('input_number.dsc_cfm_recirc_max')|float(0) %}
          {% set inn = states('input_number.dsc_cfm_intake_main_max')|float(0)
                     + states('input_number.dsc_cfm_intake_clone_max')|float(0) %}
          {{ ex > 0 and inn > ex * 1.05 }}

      - name: "DSC Plant Specs AC Capacity Missing"
        unique_id: dsc_plant_specs_ac_capacity_missing
        device_class: problem
        icon: mdi:snowflake-alert
        state: >-
          {{ is_state('input_boolean.dsc_ac_in_service', 'on')
             and states('input_number.dsc_ac_btu_hr')|float(0) <= 0 }}

      - name: "DSC Plant Specs Dehum Rate Zero"
        unique_id: dsc_plant_specs_dehum_rate_zero
        device_class: problem
        icon: mdi:water-alert
        state: "{{ states('input_number.dsc_dehum_l_day')|float(0) <= 0 }}"

      - name: "DSC Plant Specs Hum Rate Zero"
        unique_id: dsc_plant_specs_hum_rate_zero
        device_class: problem
        icon: mdi:air-humidifier-off
        state: "{{ states('input_number.dsc_hum_ml_hr')|float(0) <= 0 }}"

      - name: "DSC Plant Specs Heater Zero"
        unique_id: dsc_plant_specs_heater_zero
        device_class: problem
        icon: mdi:radiator-off
        state: "{{ states('input_number.dsc_heater_w')|float(0) <= 0 }}"

  - sensor:
      - name: "DSC Plant Specs Status"
        unique_id: dsc_plant_specs_status
        icon: mdi:clipboard-check-outline
        state: >-
          {% set bad = [
            is_state('binary_sensor.dsc_plant_specs_incomplete','on'),
            is_state('binary_sensor.dsc_plant_specs_intake_over_exhaust','on'),
            is_state('binary_sensor.dsc_plant_specs_ac_capacity_missing','on')
          ] %}
          {% set warn = [
            is_state('binary_sensor.dsc_plant_specs_dehum_rate_zero','on'),
            is_state('binary_sensor.dsc_plant_specs_hum_rate_zero','on'),
            is_state('binary_sensor.dsc_plant_specs_heater_zero','on')
          ] %}
          {% if bad|select|list|count > 0 %}error
          {% elif warn|select|list|count > 0 %}warn
          {% else %}ok{% endif %}
        attributes:
          issues: >-
            {% set parts = [
              'incomplete CFM/volume floors' if is_state('binary_sensor.dsc_plant_specs_incomplete','on') else none,
              'max intakes exceed max exhausts (NP risk)' if is_state('binary_sensor.dsc_plant_specs_intake_over_exhaust','on') else none,
              'AC marked wired but BTU/h is 0' if is_state('binary_sensor.dsc_plant_specs_ac_capacity_missing','on') else none,
              'dehumidifier L/day is 0' if is_state('binary_sensor.dsc_plant_specs_dehum_rate_zero','on') else none,
              'humidifier mL/h is 0' if is_state('binary_sensor.dsc_plant_specs_hum_rate_zero','on') else none,
              'heater watts is 0' if is_state('binary_sensor.dsc_plant_specs_heater_zero','on') else none
            ] %}
            {{ parts | reject('none') | list | join('; ') or 'none' }}

      # ----- Optional L×W×H → geometric m³ (Apply scripts write volume helpers) -----
      - name: "DSC Dim 4x8 Computed m³"
        unique_id: dsc_dim_4x8_computed_m3
        unit_of_measurement: "m³"
        icon: mdi:cube-outline
        state: >-
          {% set l = states('input_number.dsc_dim_4x8_l_cm')|float(0) %}
          {% set w = states('input_number.dsc_dim_4x8_w_cm')|float(0) %}
          {% set h = states('input_number.dsc_dim_4x8_h_cm')|float(0) %}
          {% if l <= 0 or w <= 0 or h <= 0 %}unavailable
          {% else %}{{ (l * w * h / 1000000) | round(2) }}{% endif %}

      - name: "DSC Dim 2x4 Computed m³"
        unique_id: dsc_dim_2x4_computed_m3
        unit_of_measurement: "m³"
        icon: mdi:cube-outline
        state: >-
          {% set l = states('input_number.dsc_dim_2x4_l_cm')|float(0) %}
          {% set w = states('input_number.dsc_dim_2x4_w_cm')|float(0) %}
          {% set h = states('input_number.dsc_dim_2x4_h_cm')|float(0) %}
          {% if l <= 0 or w <= 0 or h <= 0 %}unavailable
          {% else %}{{ (l * w * h / 1000000) | round(2) }}{% endif %}

      - name: "DSC Dim Room Computed m³"
        unique_id: dsc_dim_room_computed_m3
        unit_of_measurement: "m³"
        icon: mdi:home-floor-1
        state: >-
          {% set l = states('input_number.dsc_dim_room_l_cm')|float(0) %}
          {% set w = states('input_number.dsc_dim_room_w_cm')|float(0) %}
          {% set h = states('input_number.dsc_dim_room_h_cm')|float(0) %}
          {% if l <= 0 or w <= 0 or h <= 0 %}unavailable
          {% else %}{{ (l * w * h / 1000000) | round(1) }}{% endif %}

      # ----- Live CFM: curve interp when ≥2 measured points, else pct × nameplate -----
      - name: "DSC CFM Exhaust Out"
        unique_id: dsc_cfm_exhaust_out
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:fan-chevron-up
        state: >-
          {% set pct = states('sensor.dsc_fan_exhaust_outside_pct')|float(0) %}
          {% set plate = states('input_number.dsc_cfm_out_max')|float(0) %}
          {% set c25 = states('input_number.dsc_cal_cfm_out_25')|float(0) %}
          {% set c50 = states('input_number.dsc_cal_cfm_out_50')|float(0) %}
          {% set c75 = states('input_number.dsc_cal_cfm_out_75')|float(0) %}
          {% set c100 = states('input_number.dsc_cal_cfm_out_100')|float(0) %}
          {% set measured = [c25, c50, c75, c100] | select('gt', 0) | list %}
          {% if measured | count < 2 %}
            {{ (pct / 100 * plate) | round(1) }}
          {% else %}
            {% set ns = namespace(xs=[0.0], ys=[0.0]) %}
            {% for p, v in [(25.0, c25), (50.0, c50), (75.0, c75), (100.0, c100)] %}
              {% if v > 0 %}
                {% set ns.xs = ns.xs + [p] %}
                {% set ns.ys = ns.ys + [v] %}
              {% endif %}
            {% endfor %}
            {% if pct <= ns.xs[0] %}{{ ns.ys[0] | round(1) }}
            {% elif pct >= ns.xs[-1] %}{{ ns.ys[-1] | round(1) }}
            {% else %}
              {% set ns2 = namespace(lo=0, hi=1) %}
              {% for i in range(ns.xs | length - 1) %}
                {% if pct >= ns.xs[i] and pct <= ns.xs[i + 1] %}
                  {% set ns2.lo = i %}
                  {% set ns2.hi = i + 1 %}
                {% endif %}
              {% endfor %}
              {% set x0 = ns.xs[ns2.lo] %}{% set x1 = ns.xs[ns2.hi] %}
              {% set y0 = ns.ys[ns2.lo] %}{% set y1 = ns.ys[ns2.hi] %}
              {{ (y0 + (y1 - y0) * (pct - x0) / (x1 - x0)) | round(1) }}
            {% endif %}
          {% endif %}
        availability: "{{ has_value('sensor.dsc_fan_exhaust_outside_pct') }}"
        attributes:
          model: >-
            {% set n = [states('input_number.dsc_cal_cfm_out_25')|float(0),
              states('input_number.dsc_cal_cfm_out_50')|float(0),
              states('input_number.dsc_cal_cfm_out_75')|float(0),
              states('input_number.dsc_cal_cfm_out_100')|float(0)]
              | select('gt', 0) | list | count %}
            {{ 'curve' if n >= 2 else 'linear' }}

      - name: "DSC CFM Exhaust Recirc"
        unique_id: dsc_cfm_exhaust_recirc
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:fan-chevron-up
        state: >-
          {% set pct = states('sensor.dsc_fan_exhaust_room_pct')|float(0) %}
          {% set plate = states('input_number.dsc_cfm_recirc_max')|float(0) %}
          {% set c25 = states('input_number.dsc_cal_cfm_recirc_25')|float(0) %}
          {% set c50 = states('input_number.dsc_cal_cfm_recirc_50')|float(0) %}
          {% set c75 = states('input_number.dsc_cal_cfm_recirc_75')|float(0) %}
          {% set c100 = states('input_number.dsc_cal_cfm_recirc_100')|float(0) %}
          {% set measured = [c25, c50, c75, c100] | select('gt', 0) | list %}
          {% if measured | count < 2 %}
            {{ (pct / 100 * plate) | round(1) }}
          {% else %}
            {% set ns = namespace(xs=[0.0], ys=[0.0]) %}
            {% for p, v in [(25.0, c25), (50.0, c50), (75.0, c75), (100.0, c100)] %}
              {% if v > 0 %}
                {% set ns.xs = ns.xs + [p] %}
                {% set ns.ys = ns.ys + [v] %}
              {% endif %}
            {% endfor %}
            {% if pct <= ns.xs[0] %}{{ ns.ys[0] | round(1) }}
            {% elif pct >= ns.xs[-1] %}{{ ns.ys[-1] | round(1) }}
            {% else %}
              {% set ns2 = namespace(lo=0, hi=1) %}
              {% for i in range(ns.xs | length - 1) %}
                {% if pct >= ns.xs[i] and pct <= ns.xs[i + 1] %}
                  {% set ns2.lo = i %}
                  {% set ns2.hi = i + 1 %}
                {% endif %}
              {% endfor %}
              {% set x0 = ns.xs[ns2.lo] %}{% set x1 = ns.xs[ns2.hi] %}
              {% set y0 = ns.ys[ns2.lo] %}{% set y1 = ns.ys[ns2.hi] %}
              {{ (y0 + (y1 - y0) * (pct - x0) / (x1 - x0)) | round(1) }}
            {% endif %}
          {% endif %}
        availability: "{{ has_value('sensor.dsc_fan_exhaust_room_pct') }}"
        attributes:
          model: >-
            {% set n = [states('input_number.dsc_cal_cfm_recirc_25')|float(0),
              states('input_number.dsc_cal_cfm_recirc_50')|float(0),
              states('input_number.dsc_cal_cfm_recirc_75')|float(0),
              states('input_number.dsc_cal_cfm_recirc_100')|float(0)]
              | select('gt', 0) | list | count %}
            {{ 'curve' if n >= 2 else 'linear' }}

      - name: "DSC CFM Intake Main"
        unique_id: dsc_cfm_intake_main
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:fan
        state: >-
          {% set pct = states('sensor.dsc_fan_intake_main_pct')|float(0) %}
          {% set plate = states('input_number.dsc_cfm_intake_main_max')|float(0) %}
          {% set c25 = states('input_number.dsc_cal_cfm_intake_main_25')|float(0) %}
          {% set c50 = states('input_number.dsc_cal_cfm_intake_main_50')|float(0) %}
          {% set c75 = states('input_number.dsc_cal_cfm_intake_main_75')|float(0) %}
          {% set c100 = states('input_number.dsc_cal_cfm_intake_main_100')|float(0) %}
          {% set measured = [c25, c50, c75, c100] | select('gt', 0) | list %}
          {% if measured | count < 2 %}
            {{ (pct / 100 * plate) | round(1) }}
          {% else %}
            {% set ns = namespace(xs=[0.0], ys=[0.0]) %}
            {% for p, v in [(25.0, c25), (50.0, c50), (75.0, c75), (100.0, c100)] %}
              {% if v > 0 %}
                {% set ns.xs = ns.xs + [p] %}
                {% set ns.ys = ns.ys + [v] %}
              {% endif %}
            {% endfor %}
            {% if pct <= ns.xs[0] %}{{ ns.ys[0] | round(1) }}
            {% elif pct >= ns.xs[-1] %}{{ ns.ys[-1] | round(1) }}
            {% else %}
              {% set ns2 = namespace(lo=0, hi=1) %}
              {% for i in range(ns.xs | length - 1) %}
                {% if pct >= ns.xs[i] and pct <= ns.xs[i + 1] %}
                  {% set ns2.lo = i %}
                  {% set ns2.hi = i + 1 %}
                {% endif %}
              {% endfor %}
              {% set x0 = ns.xs[ns2.lo] %}{% set x1 = ns.xs[ns2.hi] %}
              {% set y0 = ns.ys[ns2.lo] %}{% set y1 = ns.ys[ns2.hi] %}
              {{ (y0 + (y1 - y0) * (pct - x0) / (x1 - x0)) | round(1) }}
            {% endif %}
          {% endif %}
        availability: "{{ has_value('sensor.dsc_fan_intake_main_pct') }}"
        attributes:
          model: >-
            {% set n = [states('input_number.dsc_cal_cfm_intake_main_25')|float(0),
              states('input_number.dsc_cal_cfm_intake_main_50')|float(0),
              states('input_number.dsc_cal_cfm_intake_main_75')|float(0),
              states('input_number.dsc_cal_cfm_intake_main_100')|float(0)]
              | select('gt', 0) | list | count %}
            {{ 'curve' if n >= 2 else 'linear' }}

      - name: "DSC CFM Intake 2x4"
        unique_id: dsc_cfm_intake_2x4
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:fan
        state: >-
          {% set pct = states('sensor.dsc_fan_intake_2x4_pct')|float(0) %}
          {% set plate = states('input_number.dsc_cfm_intake_clone_max')|float(0) %}
          {% set c25 = states('input_number.dsc_cal_cfm_intake_clone_25')|float(0) %}
          {% set c50 = states('input_number.dsc_cal_cfm_intake_clone_50')|float(0) %}
          {% set c75 = states('input_number.dsc_cal_cfm_intake_clone_75')|float(0) %}
          {% set c100 = states('input_number.dsc_cal_cfm_intake_clone_100')|float(0) %}
          {% set measured = [c25, c50, c75, c100] | select('gt', 0) | list %}
          {% if measured | count < 2 %}
            {{ (pct / 100 * plate) | round(1) }}
          {% else %}
            {% set ns = namespace(xs=[0.0], ys=[0.0]) %}
            {% for p, v in [(25.0, c25), (50.0, c50), (75.0, c75), (100.0, c100)] %}
              {% if v > 0 %}
                {% set ns.xs = ns.xs + [p] %}
                {% set ns.ys = ns.ys + [v] %}
              {% endif %}
            {% endfor %}
            {% if pct <= ns.xs[0] %}{{ ns.ys[0] | round(1) }}
            {% elif pct >= ns.xs[-1] %}{{ ns.ys[-1] | round(1) }}
            {% else %}
              {% set ns2 = namespace(lo=0, hi=1) %}
              {% for i in range(ns.xs | length - 1) %}
                {% if pct >= ns.xs[i] and pct <= ns.xs[i + 1] %}
                  {% set ns2.lo = i %}
                  {% set ns2.hi = i + 1 %}
                {% endif %}
              {% endfor %}
              {% set x0 = ns.xs[ns2.lo] %}{% set x1 = ns.xs[ns2.hi] %}
              {% set y0 = ns.ys[ns2.lo] %}{% set y1 = ns.ys[ns2.hi] %}
              {{ (y0 + (y1 - y0) * (pct - x0) / (x1 - x0)) | round(1) }}
            {% endif %}
          {% endif %}
        availability: "{{ has_value('sensor.dsc_fan_intake_2x4_pct') }}"
        attributes:
          model: >-
            {% set n = [states('input_number.dsc_cal_cfm_intake_clone_25')|float(0),
              states('input_number.dsc_cal_cfm_intake_clone_50')|float(0),
              states('input_number.dsc_cal_cfm_intake_clone_75')|float(0),
              states('input_number.dsc_cal_cfm_intake_clone_100')|float(0)]
              | select('gt', 0) | list | count %}
            {{ 'curve' if n >= 2 else 'linear' }}

      - name: "DSC ACH 4x8"
        unique_id: dsc_ach_4x8
        unit_of_measurement: "ACH"
        state_class: measurement
        icon: mdi:air-filter
        state: >-
          {% set cfm = states('sensor.dsc_cfm_intake_main')|float(0)
                     + states('sensor.dsc_cfm_intake_2x4')|float(0) %}
          {% set vol = states('input_number.dsc_vol_4x8_m3')|float(0) %}
          {% if vol <= 0 %}0{% else %}
            {{ ((cfm * 1.699 / vol)) | round(2) }}
          {% endif %}

      - name: "DSC ACH 2x4"
        unique_id: dsc_ach_2x4
        unit_of_measurement: "ACH"
        state_class: measurement
        icon: mdi:air-filter
        state: >-
          {% set cfm = states('sensor.dsc_cfm_intake_2x4')|float(0) %}
          {% set vol = states('input_number.dsc_vol_2x4_m3')|float(0) %}
          {% if vol <= 0 %}0{% else %}
            {{ ((cfm * 1.699 / vol)) | round(2) }}
          {% endif %}

      # Absolute humidity (g/m³) — Magnus approximation
      - name: "DSC AH Tent"
        unique_id: dsc_ah_tent
        unit_of_measurement: "g/m³"
        state_class: measurement
        icon: mdi:water-percent
        state: >-
          {% set t = states('sensor.dsc_hub_tent_temperature')|float(none) %}
          {% set rh = states('sensor.dsc_hub_tent_humidity')|float(none) %}
          {% if t is none or rh is none %}unknown{% else %}
            {% set es = 6.112 * (2.718281828 ** ((17.67 * t) / (t + 243.5))) %}
            {{ ((rh / 100) * es * 2.1674 / (273.15 + t)) | round(2) }}
          {% endif %}
        availability: >-
          {{ states('sensor.dsc_hub_tent_temperature') not in ['unknown','unavailable']
             and states('sensor.dsc_hub_tent_humidity') not in ['unknown','unavailable'] }}

      - name: "DSC AH Room"
        unique_id: dsc_ah_room
        unit_of_measurement: "g/m³"
        state_class: measurement
        icon: mdi:water-percent
        state: >-
          {% set t = states('sensor.dsc_hub_room_temperature')|float(none) %}
          {% set rh = states('sensor.dsc_hub_room_humidity')|float(none) %}
          {% if t is none or rh is none %}unknown{% else %}
            {% set es = 6.112 * (2.718281828 ** ((17.67 * t) / (t + 243.5))) %}
            {{ ((rh / 100) * es * 2.1674 / (273.15 + t)) | round(2) }}
          {% endif %}
        availability: >-
          {{ states('sensor.dsc_hub_room_temperature') not in ['unknown','unavailable']
             and states('sensor.dsc_hub_room_humidity') not in ['unknown','unavailable'] }}

      - name: "DSC AH Clone"
        unique_id: dsc_ah_clone
        unit_of_measurement: "g/m³"
        state_class: measurement
        icon: mdi:water-percent
        state: >-
          {% set t = states('sensor.dsc_hub_clone_temperature')|float(none) %}
          {% set rh = states('sensor.dsc_hub_clone_humidity')|float(none) %}
          {% if t is none or rh is none %}unknown{% else %}
            {% set es = 6.112 * (2.718281828 ** ((17.67 * t) / (t + 243.5))) %}
            {{ ((rh / 100) * es * 2.1674 / (273.15 + t)) | round(2) }}
          {% endif %}
        availability: >-
          {{ states('sensor.dsc_hub_clone_temperature') not in ['unknown','unavailable']
             and states('sensor.dsc_hub_clone_humidity') not in ['unknown','unavailable'] }}

      # Vent heat dump (once-through OUT vs room source air): ~1.08 × CFM × ΔT
      - name: "DSC Vent Heat Dump BTU"
        unique_id: dsc_vent_heat_dump_btu
        unit_of_measurement: "BTU/h"
        state_class: measurement
        icon: mdi:fire-alert
        state: >-
          {% set cfm = states('sensor.dsc_cfm_exhaust_out')|float(0) %}
          {% set tt = states('sensor.dsc_hub_tent_temperature')|float(none) %}
          {% set rt = states('sensor.dsc_hub_room_temperature')|float(none) %}
          {% if tt is none or rt is none %}unknown{% else %}
            {{ (1.08 * cfm * (tt - rt)) | round(0) }}
          {% endif %}

      - name: "DSC Heat Gain BTU"
        unique_id: dsc_heat_gain_btu
        unit_of_measurement: "BTU/h"
        state_class: measurement
        icon: mdi:heat-wave
        state: >-
          {% set heater = states('input_number.dsc_heater_w')|float(0)
             if is_state('switch.dsc_hub_heater_demand','on') else 0 %}
          {% set sf_pct = 0 %}
          {% if is_state('light.dsc_hub_sf1000_dimmer','on') %}
            {% set sf_pct = (state_attr('light.dsc_hub_sf1000_dimmer','brightness')|float(0) / 255) %}
          {% endif %}
          {% set sf = states('input_number.dsc_sf1000_w')|float(0) * sf_pct %}
          {% set main = states('input_number.dsc_light_4x8_w')|float(0)
             if is_state('binary_sensor.dsc_hub_4x8_window_open','on') else 0 %}
          {% set mat = 50 if is_state('switch.dsc_hub_grow_mat_demand','on') else 0 %}
          {{ ((heater + sf + main + mat) * 3.412) | round(0) }}

      - name: "DSC Heat Balance BTU"
        unique_id: dsc_heat_balance_btu
        unit_of_measurement: "BTU/h"
        state_class: measurement
        icon: mdi:scale-balance
        state: >-
          {% set dump = states('sensor.dsc_vent_heat_dump_btu')|float(0) %}
          {% set gain = states('sensor.dsc_heat_gain_btu')|float(0) %}
          {% set ac = states('input_number.dsc_ac_btu_hr')|float(0)
             if is_state('switch.dsc_hub_ac_demand','on')
                and is_state('input_boolean.dsc_ac_in_service','on') else 0 %}
          {{ (dump + ac - gain) | round(0) }}
        attributes:
          meaning: >-
            Positive = net cooling capacity; negative = heat stacking.

      - name: "DSC Dehum Removal Rate"
        unique_id: dsc_dehum_removal_rate
        unit_of_measurement: "g/h"
        state_class: measurement
        icon: mdi:water-minus
        state: >-
          {% if is_state('switch.dsc_hub_dehumidifier_demand','on') %}
            {{ ((states('input_number.dsc_dehum_l_day')|float(0) / 24) * 1000) | round(1) }}
          {% else %}0{% endif %}

      - name: "DSC Hum Addition Rate"
        unique_id: dsc_hum_addition_rate
        unit_of_measurement: "g/h"
        state_class: measurement
        icon: mdi:water-plus
        state: >-
          {% if is_state('switch.dsc_hub_humidifier_demand','on') %}
            {{ states('input_number.dsc_hum_ml_hr')|float(0) | round(1) }}
          {% else %}0{% endif %}

      # Vent moisture removal ≈ CFM × 1.699 m³/h × ΔAH (g/m³)
      - name: "DSC Vent Moisture Removal"
        unique_id: dsc_vent_moisture_removal
        unit_of_measurement: "g/h"
        state_class: measurement
        icon: mdi:weather-windy
        state: >-
          {% set cfm = states('sensor.dsc_cfm_exhaust_out')|float(0) %}
          {% set aht = states('sensor.dsc_ah_tent')|float(none) %}
          {% set ahr = states('sensor.dsc_ah_room')|float(none) %}
          {% if aht is none or ahr is none %}unknown{% else %}
            {{ (cfm * 1.699 * (aht - ahr)) | round(1) }}
          {% endif %}

      - name: "DSC Moisture Net Rate"
        unique_id: dsc_moisture_net_rate
        unit_of_measurement: "g/h"
        state_class: measurement
        icon: mdi:waves
        state: >-
          {% set rem = states('sensor.dsc_dehum_removal_rate')|float(0)
                     + states('sensor.dsc_vent_moisture_removal')|float(0) %}
          {% set add = states('sensor.dsc_hum_addition_rate')|float(0)
                     + states('input_number.dsc_plant_transpiration_g_hr')|float(0) %}
          {{ (rem - add) | round(1) }}
        attributes:
          meaning: >-
            Positive = drying the air; negative = moisture stacking.


# Optional L×W×H (cm) → write free-air volume helpers. Direct m³ edit still primary.
script:
  dsc_apply_dim_4x8:
    alias: "DSC Spec · Apply 4x8 L×W×H → m³"
    icon: mdi:cube-send
    mode: single
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_number.dsc_dim_4x8_l_cm')|float(0) > 0
             and states('input_number.dsc_dim_4x8_w_cm')|float(0) > 0
             and states('input_number.dsc_dim_4x8_h_cm')|float(0) > 0 }}
      - service: input_number.set_value
        target: { entity_id: input_number.dsc_vol_4x8_m3 }
        data:
          value: >-
            {{ [[
              (states('input_number.dsc_dim_4x8_l_cm')|float(0)
               * states('input_number.dsc_dim_4x8_w_cm')|float(0)
               * states('input_number.dsc_dim_4x8_h_cm')|float(0) / 1000000) | round(1),
              0.5]|max, 12]|min }}

  dsc_apply_dim_2x4:
    alias: "DSC Spec · Apply 2x4 L×W×H → m³"
    icon: mdi:cube-send
    mode: single
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_number.dsc_dim_2x4_l_cm')|float(0) > 0
             and states('input_number.dsc_dim_2x4_w_cm')|float(0) > 0
             and states('input_number.dsc_dim_2x4_h_cm')|float(0) > 0 }}
      - service: input_number.set_value
        target: { entity_id: input_number.dsc_vol_2x4_m3 }
        data:
          value: >-
            {{ [[
              (states('input_number.dsc_dim_2x4_l_cm')|float(0)
               * states('input_number.dsc_dim_2x4_w_cm')|float(0)
               * states('input_number.dsc_dim_2x4_h_cm')|float(0) / 1000000) | round(1),
              0.2]|max, 6]|min }}

  dsc_apply_dim_room:
    alias: "DSC Spec · Apply room L×W×H → m³"
    icon: mdi:cube-send
    mode: single
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_number.dsc_dim_room_l_cm')|float(0) > 0
             and states('input_number.dsc_dim_room_w_cm')|float(0) > 0
             and states('input_number.dsc_dim_room_h_cm')|float(0) > 0 }}
      - service: input_number.set_value
        target: { entity_id: input_number.dsc_vol_room_m3 }
        data:
          value: >-
            {{ [[
              (states('input_number.dsc_dim_room_l_cm')|float(0)
               * states('input_number.dsc_dim_room_w_cm')|float(0)
               * states('input_number.dsc_dim_room_h_cm')|float(0) / 1000000) | round(0),
              5]|max, 250]|min }}

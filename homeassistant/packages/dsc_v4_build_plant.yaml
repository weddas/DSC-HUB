            {% set v = states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_temp_max')|float(0) %}
            {{ v if v != 0 else 'unknown' }}
          {% else %}unknown{% endif %}
      - name: "DSC POT4 Want RH Min"
        unique_id: dsc_pot4_want_rh_min
        unit_of_measurement: "%"
        state: >
          {% set s = states('select.dsc_pot4_strain') %}
          {% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot4_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {% set v = states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_rh_min')|float(0) %}
            {{ v if v != 0 else 'unknown' }}
          {% else %}unknown{% endif %}
      - name: "DSC POT4 Want RH Max"
        unique_id: dsc_pot4_want_rh_max
        unit_of_measurement: "%"
        state: >
          {% set s = states('select.dsc_pot4_strain') %}
          {% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot4_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {% set v = states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_rh_max')|float(0) %}
            {{ v if v != 0 else 'unknown' }}
          {% else %}unknown{% endif %}

script:
  dsc_build_plant_commit:
    alias: "DSC Build Plant · Commit to roster"
    description: "Write active builder fields into the next empty roster slot."
    mode: single
    sequence:
      - variables:
          slot: >
            {% set ns = namespace(s=0) %}
            {% for i in range(1,9) %}
              {% if ns.s == 0 and states('input_select.dsc_plant_roster_' ~ i ~ '_status') in ['empty','unknown','unavailable',''] %}
                {% set ns.s = i %}
              {% endif %}
            {% endfor %}
            {{ ns.s }}
          snap: >
            {% set parts = [] %}
            {% for n in [1,2,3] %}
              {% set name = states('input_text.dsc_blend_component_' ~ n ~ '_name')|trim %}
              {% set pct = states('input_number.dsc_blend_pct_' ~ n)|float(0) %}
              {% if name and pct > 0 %}{% set parts = parts + [name ~ ' ' ~ pct|round(0) ~ '%'] %}{% endif %}
            {% endfor %}
            {{ parts|join(' + ') }}
      - condition: template
        value_template: "{{ slot|int(0) > 0 }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.dsc_plant_roster_{{ slot }}_nickname"
        data:
          value: "{{ states('input_text.dsc_build_nickname') }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.dsc_plant_roster_{{ slot }}_strain"
        data:
          value: "{{ states('input_text.dsc_build_strain') }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.dsc_plant_roster_{{ slot }}_blend"
        data:
          value: "{{ snap }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.dsc_plant_roster_{{ slot }}_recipe"
        data:
          value: "{{ states('input_text.dsc_build_recipe_note') or states('sensor.dsc_mix_calculator') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.dsc_build_blend_snapshot
        data:
          value: "{{ snap }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('input_datetime.dsc_build_sprout_date') not in ['unknown','unavailable',''] }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.dsc_plant_roster_{{ slot }}_sprout"
                data:
                  date: "{{ states('input_datetime.dsc_build_sprout_date')[:10] }}"
      - action: input_select.select_option
        target:
          entity_id: "input_select.dsc_plant_roster_{{ slot }}_pot"
        data:
          option: "{{ states('input_select.dsc_build_assign_pot') }}"
      - action: input_select.select_option
        target:
          entity_id: "input_select.dsc_plant_roster_{{ slot }}_status"
        data:
          option: "{{ 'active' if states('input_select.dsc_build_assign_pot') != 'none' else 'stock' }}"
      - action: persistent_notification.create
        data:
          title: "Build a Plant · committed"
          message: "Roster slot {{ slot }} ← {{ states('input_text.dsc_build_nickname') or states('input_text.dsc_build_strain') }}"

  dsc_plant_assign_to_pot:
    alias: "DSC Build Plant · Assign to pot"
    description: "Copy builder strain + sprout into pot HA helpers (and pot entities when online)."
    mode: single
    fields:
      pot:
        name: Pot
        description: "1–4"
        example: "1"
        required: true
        selector:
          select:
            options: ["1", "2", "3", "4"]
    sequence:
      - variables:
          n: "{{ pot if pot is defined else states('input_select.dsc_build_assign_pot') }}"
          strain: "{{ states('input_text.dsc_build_strain')|trim }}"
          sprout: "{{ states('input_datetime.dsc_build_sprout_date')[:10] }}"
      - condition: template
        value_template: "{{ n|string in ['1','2','3','4'] and strain != '' }}"
      - action: input_select.select_option
        target:
          entity_id: "input_select.dsc_pot{{ n }}_strain"
        data:
          option: "{{ strain }}"
        continue_on_error: true
      - action: select.select_option
        target:
          entity_id: "select.dsc_pot{{ n }}_strain"
        data:
          option: "{{ strain }}"
        continue_on_error: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ sprout|length >= 8 }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "input_datetime.dsc_pot{{ n }}_sprout_date"
                data:
                  date: "{{ sprout }}"
              - action: datetime.set_value
                target:
                  entity_id: "datetime.dsc_pot{{ n }}_sprout_date"
                data:
                  date: "{{ sprout }}"
                continue_on_error: true
      - action: logbook.log
        data:
          name: DSC Build Plant
          message: "Assigned {{ strain }} / {{ sprout }} → POT{{ n }}"

  dsc_apply_climate_want:
    alias: "DSC Apply Climate Want"
    description: >-
      Write hub climate targets from custom-slot Want temp/RH when set (≠0).
      No-op when unset. Does not invent catalog climate bands.
    mode: single
    fields:
      pot:
        name: Pot
        description: "1–4 or Fleet"
        example: "1"
        selector:
          select:
            options: ["Fleet", "1", "2", "3", "4"]
    sequence:
      - variables:
          which: "{{ pot if pot is defined else states('input_select.dsc_build_climate_pot') }}"
          n: >
            {% if which|string in ['1','2','3','4'] %}{{ which }}
            {% else %}
              {% set ns = namespace(p='1') %}
              {% for i in [1,2,3,4] %}
                {% set tmin = states('sensor.dsc_pot' ~ i ~ '_want_temp_min') %}
                {% if tmin not in ['unknown','unavailable',''] and tmin|float(0) != 0 %}
                  {% set ns.p = i|string %}
                {% endif %}
              {% endfor %}
              {{ ns.p }}
            {% endif %}
          tmin: "{{ states('sensor.dsc_pot' ~ n ~ '_want_temp_min')|float(0) }}"
          tmax: "{{ states('sensor.dsc_pot' ~ n ~ '_want_temp_max')|float(0) }}"
          rmin: "{{ states('sensor.dsc_pot' ~ n ~ '_want_rh_min')|float(0) }}"
          rmax: "{{ states('sensor.dsc_pot' ~ n ~ '_want_rh_max')|float(0) }}"
          tmid: "{{ ((tmin|float(0) + tmax|float(0)) / 2)|round(1) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ tmin|float(0) > 0 and tmax|float(0) > 0 }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.dsc_hub_target_temp
                data:
                  value: "{{ tmid }}"
          - conditions:
              - condition: template
                value_template: "{{ true }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Climate Want · skipped temp"
                  message: "POT{{ n }} Want temp unset (0). No catalog climate invent."
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ rmin|float(0) > 0 and rmax|float(0) > 0 }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.dsc_hub_rh_target_min
                data:
                  value: "{{ rmin }}"
              - action: number.set_value
                target:
                  entity_id: number.dsc_hub_rh_target_max
                data:
                  value: "{{ rmax }}"
          - conditions:
              - condition: template
                value_template: "{{ true }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Climate Want · skipped RH"
                  message: "POT{{ n }} Want RH unset (0). No catalog climate invent."
      - condition: template
        value_template: >-
          {{ (tmin|float(0) > 0 and tmax|float(0) > 0)
             or (rmin|float(0) > 0 and rmax|float(0) > 0) }}
      - action: logbook.log
        data:
          name: DSC Apply Climate Want
          message: >-
            POT{{ n }} → temp {{ tmid if tmin|float(0) > 0 else 'skip' }} °C,
            RH {{ rmin }}–{{ rmax }}%
      - action: persistent_notification.create
        data:
          title: "Climate Want applied"
          message: >-
            POT{{ n }}: target temp {{ tmid if tmin|float(0) > 0 else '(skipped)' }} °C,
            RH {{ rmin if rmin|float(0) > 0 else '?' }}–{{ rmax if rmax|float(0) > 0 else '?' }}%.

template:
  - sensor:
      - name: "DSC Blend Summary"
        unique_id: dsc_blend_summary
        icon: mdi:layers-triple
        unit_of_measurement: "%"
        state: >
          {% set p1 = states('input_number.dsc_blend_pct_1')|float(0) %}
          {% set p2 = states('input_number.dsc_blend_pct_2')|float(0) %}
          {% set p3 = states('input_number.dsc_blend_pct_3')|float(0) %}
          {{ (p1 + p2 + p3)|round(0) }}
        attributes:
          valid: >
            {{ (states('input_number.dsc_blend_pct_1')|float(0)
                + states('input_number.dsc_blend_pct_2')|float(0)
                + states('input_number.dsc_blend_pct_3')|float(0))|round(0) == 100 }}
          total_l: "{{ states('input_number.dsc_blend_total_l') }}"
          components: >
            {% set L = states('input_number.dsc_blend_total_l')|float(20) %}
            {% set parts = [] %}
            {% for n in [1,2,3] %}
              {% set name = states('input_text.dsc_blend_component_' ~ n ~ '_name')|trim %}
              {% set pct = states('input_number.dsc_blend_pct_' ~ n)|float(0) %}
              {% if name and pct > 0 %}
                {% set litres = (pct / 100 * L)|round(2) %}
                {% set parts = parts + [{'slot': n, 'name': name, 'pct': pct, 'litres': litres}] %}
              {% endif %}
            {% endfor %}
            {{ parts }}
          bar: >
            {% set parts = [] %}
            {% for n in [1,2,3] %}
              {% set name = states('input_text.dsc_blend_component_' ~ n ~ '_name')|trim %}
              {% set pct = states('input_number.dsc_blend_pct_' ~ n)|float(0) %}
              {% if pct > 0 %}
                {% set parts = parts + [ (name or ('#' ~ n)) ~ ' ' ~ pct|round(0) ~ '%' ] %}
              {% endif %}
            {% endfor %}
            {{ parts|join(' · ') }}

      - name: "DSC Mix Calculator"
        unique_id: dsc_mix_calculator
        icon: mdi:calculator-variant
        state: >
          {% set L = states('input_number.dsc_mix_tank_liters')|float(20) %}
          {% set str = states('input_number.dsc_mix_strength_pct')|float(100) / 100 %}
          {% set lines = [] %}
          {% set total = namespace(v=0) %}
          {% for n in range(1,9) %}
            {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
            {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
            {% if name and dose > 0 %}
              {% set ml = (dose * L * str)|round(1) %}
              {% set total.v = total.v + ml %}
              {% set lines = lines + [name ~ ': ' ~ ml ~ ' ml @ ' ~ dose ~ ' ml/L'] %}
            {% endif %}
          {% endfor %}
          {{ (total.v|round(1) ~ ' ml total') if lines else 'No doses set' }}
        attributes:
          tank_l: "{{ states('input_number.dsc_mix_tank_liters') }}"
          strength_pct: "{{ states('input_number.dsc_mix_strength_pct') }}"
          lines: >
            {% set L = states('input_number.dsc_mix_tank_liters')|float(20) %}
            {% set str = states('input_number.dsc_mix_strength_pct')|float(100) / 100 %}
            {% set out = [] %}
            {% for n in range(1,9) %}
              {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
              {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
              {% set stock = states('input_number.dsc_nutrient_' ~ n ~ '_stock_ml')|float(0) %}
              {% set inv = is_state('input_boolean.dsc_nutrient_' ~ n ~ '_in_inventory','on') %}
              {% if name and dose > 0 %}
                {% set ml = (dose * L * str)|round(1) %}
                {% set out = out + [{'slot': n, 'name': name, 'dose_ml_l': dose, 'ml': ml, 'stock_ml': stock, 'in_inventory': inv}] %}
              {% endif %}
            {% endfor %}
            {{ out }}
          total_ml: >
            {% set L = states('input_number.dsc_mix_tank_liters')|float(20) %}
            {% set str = states('input_number.dsc_mix_strength_pct')|float(100) / 100 %}
            {% set t = namespace(v=0) %}
            {% for n in range(1,9) %}
              {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
              {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
              {% if name and dose > 0 %}
                {% set t.v = t.v + (dose * L * str) %}
              {% endif %}
            {% endfor %}
            {{ t.v|round(1) }}
          note: "Metric ml for tank L × strength%. Accept mix burns stock via script.dsc_accept_mix."

      - name: "DSC Plant Roster Summary"
        unique_id: dsc_plant_roster_summary
        icon: mdi:sprout
        state: >
          {% set n = namespace(v=0) %}
          {% for i in range(1,9) %}
            {% if states('input_select.dsc_plant_roster_' ~ i ~ '_status') not in ['empty','unknown','unavailable'] %}
              {% set n.v = n.v + 1 %}
            {% endif %}
          {% endfor %}
          {{ n.v }} occupied
        attributes:
          slots: >
            {% set out = [] %}
            {% for i in range(1,9) %}
              {% set st = states('input_select.dsc_plant_roster_' ~ i ~ '_status') %}
              {% if st not in ['empty','unknown','unavailable'] %}
                {% set out = out + [{
                  'slot': i,
                  'nickname': states('input_text.dsc_plant_roster_' ~ i ~ '_nickname'),
                  'strain': states('input_text.dsc_plant_roster_' ~ i ~ '_strain'),
                  'sprout': states('input_datetime.dsc_plant_roster_' ~ i ~ '_sprout'),
                  'pot': states('input_select.dsc_plant_roster_' ~ i ~ '_pot'),
                  'status': st
                }] %}
              {% endif %}
            {% endfor %}
            {{ out }}

      - name: "DSC POT1 Want Temp Min"
        unique_id: dsc_pot1_want_temp_min
        unit_of_measurement: "°C"
        state: >
          {% set s = states('select.dsc_pot1_strain') %}
          {% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {% set v = states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_temp_min')|float(0) %}

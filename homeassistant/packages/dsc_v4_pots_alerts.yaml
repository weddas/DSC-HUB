# ---------------------------------------------------------------------
# One notifier for all pot alerts. Fires on OFF->ON only; the delay_on
# on each binary sensor is the debounce, so no extra cooldown needed.
# notify.notify broadcasts to all registered mobile apps — change the
# service if you want a specific device or channel.
# ---------------------------------------------------------------------
automation:
  - id: dsc_pots_alert_notifier
    alias: "DSC Pots — Alert Notifier"
    mode: queued
    max: 10
    trigger:
      - platform: state
        to: "on"
        entity_id:
          # Entity_ids match friendly-name slugs (same list as dsc_v4_alert_count).
          - binary_sensor.dsc_pot1_moisture_out_of_range
          - binary_sensor.dsc_pot1_ph_out_of_range
          - binary_sensor.dsc_pot1_root_zone_temp_out_of_range
          - binary_sensor.dsc_pot1_ec_salt_build_up
          - binary_sensor.dsc_pot1_ec_depleted_vs_baseline
          - binary_sensor.dsc_pot1_nitrogen_below_baseline
          - binary_sensor.dsc_pot1_nitrogen_depleting_fast
          - binary_sensor.dsc_pot2_moisture_out_of_range
          - binary_sensor.dsc_pot2_ph_out_of_range
          - binary_sensor.dsc_pot2_root_zone_temp_out_of_range
          - binary_sensor.dsc_pot2_ec_salt_build_up
          - binary_sensor.dsc_pot2_ec_depleted_vs_baseline
          - binary_sensor.dsc_pot2_nitrogen_below_baseline
          - binary_sensor.dsc_pot2_nitrogen_depleting_fast
          - binary_sensor.dsc_pot3_moisture_out_of_range
          - binary_sensor.dsc_pot3_ph_out_of_range
          - binary_sensor.dsc_pot3_root_zone_temp_out_of_range
          - binary_sensor.dsc_pot3_ec_salt_build_up
          - binary_sensor.dsc_pot3_ec_depleted_vs_baseline
          - binary_sensor.dsc_pot3_nitrogen_below_baseline
          - binary_sensor.dsc_pot3_nitrogen_depleting_fast
          - binary_sensor.dsc_pot4_moisture_out_of_range
          - binary_sensor.dsc_pot4_ph_out_of_range
          - binary_sensor.dsc_pot4_root_zone_temp_out_of_range
          - binary_sensor.dsc_pot4_ec_salt_build_up
          - binary_sensor.dsc_pot4_ec_depleted_vs_baseline
          - binary_sensor.dsc_pot4_nitrogen_below_baseline
          - binary_sensor.dsc_pot4_nitrogen_depleting_fast
    action:
      - action: notify.chriss_iphone_max
        data:
          title: "🌱 DSC Grow Alert"
          message: >
            {% set pot = trigger.entity_id.split('.')[1].split('_')[1] %}
            {% set plant = states('text.dsc_' ~ pot ~ '_plant_name') %}
            {% set stage = states('select.dsc_' ~ pot ~ '_growth_stage') %}
            {{ plant }} ({{ pot | upper }}, {{ stage }}):
            {{ trigger.to_state.attributes.friendly_name }}

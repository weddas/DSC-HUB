# ==================================================================
#  DSC-HUB v5.1 · SURFACE VERSION + FLEET STATUS
#  ------------------------------------------------------------------
#  Expected release string + HA surface marker + aggregate fleet chip.
#  Sync add-on writes /config/dsc-hub-sync.version (optional) with SHA.
# ==================================================================

input_text:
  dsc_expected_release:
    name: "DSC Expected Release"
    icon: mdi:tag-check
    initial: "5.2.0"
    max: 32

template:
  - sensor:
      - name: "DSC HA Surface Version"
        unique_id: dsc_ha_surface_version
        icon: mdi:home-assistant
        state: "7.1.3"
        attributes:
          packages: dsc_v4_*
          dashboard: dsc-hub custom panel (/dsc-hub) React+Vite
          lovelace_fallback: dsc-hub-pro YAML (sidebar hidden)
          build_plant_inclusion: N-085
          visual_pass: Surface 7.0 Live/Grow/Tune/Fleet guided shell
          densify_catalog: Compose+Research show height/flowering/chem from densified indexes
          pot_tent: input_select.dsc_potN_tent + script.dsc_apply_pot_to_tent
          phase_b: present
          learn_activity: present
          multi_lever: F-005 residual attribution
          in_service: ac/mister/pots + temp OOS / operator lockout
          crop_steering: strains + nutrient science + coherence + efficacy
          pot_identity: strain + sprout NVS (pot FW 5.1.3+)
          sensor_cal: peer sync + push-to-ESP + lab wet (pot FW 5.1.6+)
          sensor_trust: stuck/MAD/DHT + keep-up gaps
          derived_faults: vent-conflict + ineffective suspects
          light_quota: hub ledger debt/catch-up + Lighting view (hub FW 5.1.7+)
          fleet_heal: EVT autofix + coherence notify (hub 5.1.8+ / Control 5.1.16)
          wifi_roam: post_connect_roaming off (hub 5.1.10+) — ESP-NOW channel hold
          eth01_bridge: F-010 appliance + F-012 SoftAP anchor + F-013 HA mirror (5.2.0)
          custom_panel: dsc_hub 0.1.0

      - name: "DSC Fleet Version Status"
        unique_id: dsc_fleet_version_status
        icon: mdi:clipboard-check
        state: >-
          {% set exp = states('input_text.dsc_expected_release')|trim %}
            {% if exp in ['unknown','unavailable','', none] %}{% set exp = '5.2.0' %}{% endif %}
          {# Firmware train only. HA surface (6.x) is independent packaging. #}
          {% set checks = [
            ('hub', states('sensor.dsc_hub_firmware_version')),
            ('panel', states('sensor.dsc_control_firmware_version')),
            ('bridge', states('sensor.dsc_bridge_esphome_version')),
            ('pot1', states('sensor.dsc_pot1_firmware_version')),
            ('pot2', states('sensor.dsc_pot2_firmware_version')),
            ('pot3', states('sensor.dsc_pot3_firmware_version')),
            ('pot4', states('sensor.dsc_pot4_firmware_version')),
            ('heater', states('sensor.dsc_heater_firmware_version')),
            ('heatmat', states('sensor.dsc_heatmat_firmware_version')),
            ('humidifier', states('sensor.dsc_humidifier_firmware_version')),
            ('dehumidifier', states('sensor.dsc_de_humidifier_firmware_version'))
          ] %}
          {# Fleet runs mixed patch levels within one release train (e.g.
             panel 5.1.14 beside hub 5.1.0), so drift compares major.minor. #}
          {% set train = exp.split('.')[0:2]|join('.') %}
          {% set ns = namespace(missing=0, drift=0, ok=0) %}
          {% for name, ver in checks %}
            {% if name == 'bridge' and ver in ['unknown','unavailable',''] %}
              {# Bridge optional until flashed — do not fail fleet chip. #}
            {% elif name == 'pot3' and not is_state('input_boolean.dsc_pot3_in_service','on') %}
              {# Planned OOS — firmware-missing is inventory, not fleet drift. #}
            {% elif name.startswith('pot') and not is_state('input_boolean.dsc_' ~ name ~ '_in_service','on') %}
              {# In-service off — skip firmware-missing for that node. #}
            {% elif ver in ['unknown','unavailable',''] or ver is none %}
              {% set ns.missing = ns.missing + 1 %}
            {% elif (ver|string|trim).split('.')[0:2]|join('.') != train %}
              {% set ns.drift = ns.drift + 1 %}
            {% else %}
              {% set ns.ok = ns.ok + 1 %}
            {% endif %}
          {% endfor %}
          {% set learn_ok = states('input_boolean.dsc_climate_learn_phase_b_enabled') not in ['unknown','unavailable'] %}
          {% set auto_ok = states('automation.dsc_hub_humidifier_follows_humidifier_demand') not in ['unknown','unavailable']
             or states('automation.dsc_follower_humidifier') not in ['unknown','unavailable'] %}
          {% if not learn_ok or ns.missing > 4 %}error
          {% elif ns.drift > 0 or ns.missing > 0 %}warn
          {% else %}ok{% endif %}
        attributes:
          expected: >-
            {% set exp = states('input_text.dsc_expected_release')|trim %}
            {{ '5.2.0' if exp in ['unknown','unavailable',''] else exp }}
          hub: "{{ states('sensor.dsc_hub_firmware_version') }}"
          panel: "{{ states('sensor.dsc_control_firmware_version') }}"
          pot1: "{{ states('sensor.dsc_pot1_firmware_version') }}"
          pot2: "{{ states('sensor.dsc_pot2_firmware_version') }}"
          pot3: "{{ states('sensor.dsc_pot3_firmware_version') }}"
          pot4: "{{ states('sensor.dsc_pot4_firmware_version') }}"
          heater: "{{ states('sensor.dsc_heater_firmware_version') }}"
          heatmat: "{{ states('sensor.dsc_heatmat_firmware_version') }}"
          humidifier: "{{ states('sensor.dsc_humidifier_firmware_version') }}"
          dehumidifier: "{{ states('sensor.dsc_de_humidifier_firmware_version') }}"
          ha_surface: "{{ states('sensor.dsc_ha_surface_version') }}"
          sync_sha: >-
            {% if states('sensor.dsc_hub_sync_sha') not in ['unknown','unavailable'] %}
              {{ states('sensor.dsc_hub_sync_sha') }}
            {% else %}n/a{% endif %}
          meaning: >-
            ok = all reporting firmware devices on the expected
            major.minor release train (patch levels may differ).
            HA surface (sensor.dsc_ha_surface_version) is reported for
            ops but is not part of the firmware train compare.
            warn = some missing/unavailable or off-train version drift.
            error = learn/helpers missing or most devices unavailable.

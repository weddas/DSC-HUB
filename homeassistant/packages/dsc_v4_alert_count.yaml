# ==================================================================
#  DSC-HUB v4 · ALERT COUNT HELPER
#  ------------------------------------------------------------------
#  Server-side aggregate for the Home alert chip. Dashboard must NOT
#  loop states.binary_sensor — subscribe to this one entity instead.
#  Explicit entity_id list (Phase 1): avoids re-eval on every binary
#  sensor in the house. Keep in sync when adding new DSC alerts.
# ==================================================================

template:
  - sensor:
      - name: "DSC Active Alert Count"
        unique_id: dsc_active_alert_count
        icon: mdi:sprout
        # Pin subscriptions — do not use states.binary_sensor scans.
        state: >
          {% set alerts = [
            'binary_sensor.dsc_hub_emergency_failsafe',
            'binary_sensor.dsc_hub_climate_sensor_fault',
            'binary_sensor.dsc_hub_aux_sensor_fault',
            'binary_sensor.dsc_hub_root_zone_sensor_fault',
            'binary_sensor.dsc_clone_dark_period_violation',
            'binary_sensor.dsc_clone_light_missing_in_window',
            'binary_sensor.dsc_hub_coherence_mismatch',
            'binary_sensor.dsc_nest_channel_split',
            'binary_sensor.dsc_wifi_preferred_ap_mismatch',
            'binary_sensor.dsc_humidifier_vent_conflict',
            'binary_sensor.dsc_heater_vent_conflict',
            'binary_sensor.dsc_humidifier_ineffective_suspect',
            'binary_sensor.dsc_heater_ineffective_suspect',
            'binary_sensor.dsc_grow_mat_ineffective_suspect',
            'binary_sensor.dsc_plant_specs_incomplete',
            'binary_sensor.dsc_plant_specs_intake_over_exhaust',
            'binary_sensor.dsc_plant_specs_ac_capacity_missing',
            'binary_sensor.dsc_plant_specs_dehum_rate_zero',
            'binary_sensor.dsc_plant_specs_hum_rate_zero',
            'binary_sensor.dsc_plant_specs_heater_zero',
            'binary_sensor.dsc_tank_ec_out_of_range',
            'binary_sensor.dsc_tank_ph_out_of_range',
            'binary_sensor.dsc_tank_water_too_warm',
            'binary_sensor.dsc_pot1_moisture_out_of_range',
            'binary_sensor.dsc_pot1_ph_out_of_range',
            'binary_sensor.dsc_pot1_root_zone_temp_out_of_range',
            'binary_sensor.dsc_pot1_ec_salt_build_up',
            'binary_sensor.dsc_pot1_ec_depleted_vs_baseline',
            'binary_sensor.dsc_pot1_nitrogen_below_baseline',
            'binary_sensor.dsc_pot1_nitrogen_depleting_fast',
            'binary_sensor.dsc_pot2_moisture_out_of_range',
            'binary_sensor.dsc_pot2_ph_out_of_range',
            'binary_sensor.dsc_pot2_root_zone_temp_out_of_range',
            'binary_sensor.dsc_pot2_ec_salt_build_up',
            'binary_sensor.dsc_pot2_ec_depleted_vs_baseline',
            'binary_sensor.dsc_pot2_nitrogen_below_baseline',
            'binary_sensor.dsc_pot2_nitrogen_depleting_fast',
            'binary_sensor.dsc_pot3_moisture_out_of_range',
            'binary_sensor.dsc_pot3_ph_out_of_range',
            'binary_sensor.dsc_pot3_root_zone_temp_out_of_range',
            'binary_sensor.dsc_pot3_ec_salt_build_up',
            'binary_sensor.dsc_pot3_ec_depleted_vs_baseline',
            'binary_sensor.dsc_pot3_nitrogen_below_baseline',
            'binary_sensor.dsc_pot3_nitrogen_depleting_fast',
            'binary_sensor.dsc_pot4_moisture_out_of_range',
            'binary_sensor.dsc_pot4_ph_out_of_range',
            'binary_sensor.dsc_pot4_root_zone_temp_out_of_range',
            'binary_sensor.dsc_pot4_ec_salt_build_up',
            'binary_sensor.dsc_pot4_ec_depleted_vs_baseline',
            'binary_sensor.dsc_pot4_nitrogen_below_baseline',
            'binary_sensor.dsc_pot4_nitrogen_depleting_fast'
          ] %}
          {{ expand(alerts) | selectattr('state', 'eq', 'on') | list | count }}

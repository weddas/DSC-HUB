template:
  - sensor:
      - name: "DSC Strain Catalog"
        unique_id: dsc_strain_catalog
        icon: mdi:book-open-variant
        state: "ready"
        attributes:
          seed: "Generic Photoperiod, Generic Autoflower"
          custom_slots: 5
          note: >-
            Want bands from seed templates or occupied custom slots.
            Promote customs to YAML via FOLLOWUPS.

      # ---- POT1 ----
      - name: "DSC POT1 Days Since Sprout"
        unique_id: dsc_pot1_days_since_sprout
        unit_of_measurement: "d"
        icon: mdi:calendar-start
        state: >
          {% set d = states('datetime.dsc_pot1_sprout_date') %}{% if d in ['unknown','unavailable',''] %}{% set d = states('input_datetime.dsc_pot1_sprout_date') %}{% endif %}
          {% if d in ['unknown','unavailable',''] %}none
          {% else %}{{ ((as_timestamp(now()) - as_timestamp(d)) / 86400)|int }}
          {% endif %}

      - name: "DSC POT1 Expected Stage"
        unique_id: dsc_pot1_expected_stage
        icon: mdi:timeline-clock
        state: >
          {% set days = states('sensor.dsc_pot1_days_since_sprout')|int(-1) %}
          {% set strain = states('select.dsc_pot1_strain') %}{% if strain in ['unknown','unavailable',''] %}{% set strain = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% set auto = strain == 'Generic Autoflower' or
             (strain.startswith('Custom') and states('input_select.dsc_custom_strain_' ~ strain.split(' ')[1] ~ '_type') == 'auto') %}
          {% if days < 0 %}unknown
          {% elif days <= 3 %}Germination
          {% elif days <= 14 %}Seedling
          {% elif days <= 28 %}Early Vegetative
          {% elif not auto and days <= 42 %}Vegetative
          {% elif not auto and days <= 49 %}Late (Push) Vegetative
          {% elif auto and days <= 21 %}Vegetative
          {% elif auto and days <= 28 %}Early Flowering
          {% elif auto and days <= 49 %}Flowering
          {% elif auto and days <= 63 %}Late Flowering
          {% elif not auto and days <= 56 %}Early Flowering
          {% elif not auto and days <= 77 %}Flowering
          {% elif not auto and days <= 91 %}Late Flowering
          {% else %}Final 48-72h Flowering
          {% endif %}

      - name: "DSC POT1 Strain Display"
        unique_id: dsc_pot1_strain_display
        icon: mdi:dna
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {% set n = states('input_text.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_name')|trim %}
            {{ n if n else s }}
          {% else %}{{ s }}{% endif %}

      - name: "DSC POT1 Want pH Min"
        unique_id: dsc_pot1_want_ph_min
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_ph_min')|float(5.8) }}
          {% elif s == 'Generic Autoflower' %}5.8
          {% else %}5.8{% endif %}
      - name: "DSC POT1 Want pH Max"
        unique_id: dsc_pot1_want_ph_max
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_ph_max')|float(6.5) }}
          {% else %}6.5{% endif %}
      - name: "DSC POT1 Want EC Min"
        unique_id: dsc_pot1_want_ec_min
        unit_of_measurement: "µS/cm"
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% set stage = states('sensor.dsc_pot1_expected_stage') %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_ec_min')|float(800) }}
          {% elif 'Flower' in stage %}{{ 1400 if s == 'Generic Autoflower' else 1600 }}
          {% elif 'Seedling' in stage or stage == 'Germination' %}{{ 400 if s == 'Generic Autoflower' else 500 }}
          {% else %}{{ 800 if s == 'Generic Autoflower' else 1000 }}{% endif %}
      - name: "DSC POT1 Want EC Max"
        unique_id: dsc_pot1_want_ec_max
        unit_of_measurement: "µS/cm"
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% set stage = states('sensor.dsc_pot1_expected_stage') %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_ec_max')|float(1600) }}
          {% elif 'Flower' in stage %}{{ 2000 if s == 'Generic Autoflower' else 2400 }}
          {% elif 'Seedling' in stage or stage == 'Germination' %}{{ 800 if s == 'Generic Autoflower' else 900 }}
          {% else %}{{ 1400 if s == 'Generic Autoflower' else 1600 }}{% endif %}
      - name: "DSC POT1 Want Moisture Min"
        unique_id: dsc_pot1_want_moisture_min
        unit_of_measurement: "%"
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_moisture_min')|float(45) }}
          {% else %}45{% endif %}
      - name: "DSC POT1 Want Moisture Max"
        unique_id: dsc_pot1_want_moisture_max
        unit_of_measurement: "%"
        state: >
          {% set s = states('select.dsc_pot1_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot1_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_moisture_max')|float(70) }}
          {% else %}70{% endif %}

      - name: "DSC POT1 Got pH"
        unique_id: dsc_pot1_got_ph
        state: >
          {% set r = states('sensor.dsc_pot1_soil_ph')|float(none) %}
          {% set o = states('input_number.dsc_pot1_offset_ph')|float(0) %}
          {{ (r + o)|round(2) if r is not none else none }}
      - name: "DSC POT1 Got EC"
        unique_id: dsc_pot1_got_ec
        unit_of_measurement: "µS/cm"
        state: >
          {% set r = states('sensor.dsc_pot1_soil_conductivity')|float(none) %}
          {% set o = states('input_number.dsc_pot1_offset_ec_us')|float(0) %}
          {{ (r + o)|round(0) if r is not none else none }}
      - name: "DSC POT1 Got Moisture"
        unique_id: dsc_pot1_got_moisture
        unit_of_measurement: "%"
        state: >
          {% set r = states('sensor.dsc_pot1_soil_moisture')|float(none) %}
          {% set o = states('input_number.dsc_pot1_offset_moisture')|float(0) %}
          {{ (r + o)|round(1) if r is not none else none }}

      - name: "DSC POT1 Need EC Delta"
        unique_id: dsc_pot1_need_ec_delta
        unit_of_measurement: "µS/cm"
        state: >
          {% set g = states('sensor.dsc_pot1_got_ec')|float(none) %}
          {% set lo = states('sensor.dsc_pot1_want_ec_min')|float(none) %}
          {% set hi = states('sensor.dsc_pot1_want_ec_max')|float(none) %}
          {% if g is none or lo is none or hi is none %}none
          {% elif g < lo %}{{ (lo - g)|round(0) }}
          {% elif g > hi %}{{ (hi - g)|round(0) * -1 }}
          {% else %}0{% endif %}

      - name: "DSC POT1 Need Summary"
        unique_id: dsc_pot1_need_summary
        icon: mdi:clipboard-text
        state: >
          {% set g_ec = states('sensor.dsc_pot1_got_ec')|float(none) %}
          {% set lo = states('sensor.dsc_pot1_want_ec_min')|float(0) %}
          {% set hi = states('sensor.dsc_pot1_want_ec_max')|float(0) %}

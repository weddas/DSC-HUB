# ==================================================================
#  DSC-HUB v5.1.6 · STRAIN CATALOG + WANT / NEED / GOT
#  Strain/sprout SoT: prefer pot ESP entities (select/datetime) when online;
#  fall back to HA input_* until N-017 flash + migrate.
#  ------------------------------------------------------------------
#  Genetics define Want; offset-corrected probes are Got; Need = gap.
#  Seed strains embedded in templates; 5 custom slots via input_*.
#  Peer offsets: corrected = raw + offset (offset usually negative when
#  a probe reads high vs peer median). Capture script is MAD-hardened v2;
#  auto-after-water lives in dsc_v4_sensor_cal.yaml (HA Got only).
# ==================================================================

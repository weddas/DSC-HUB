script:
  dsc_pot1_apply_expected_stage:
    alias: "DSC POT1 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot1_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot1_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot1_expected_stage') }}"
  dsc_pot2_apply_expected_stage:
    alias: "DSC POT2 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot2_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot2_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot2_expected_stage') }}"
  dsc_pot3_apply_expected_stage:
    alias: "DSC POT3 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot3_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot3_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot3_expected_stage') }}"
  dsc_pot4_apply_expected_stage:
    alias: "DSC POT4 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot4_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot4_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot4_expected_stage') }}"
  dsc_pots_capture_peer_baseline:
    alias: "DSC Pots Capture Peer Baseline"
    description: >-
      MAD-hardened median of in-service pots → HA Got offsets (pH/EC/moisture).
      Does not write ESP Cal Offset/Scale. Optional field sync_source stamps status.
    mode: single
    fields:
      sync_source:
        name: Sync source
        description: "manual | peer_median_auto | peer_median"
        example: manual
        default: peer_median
        selector:
          text:
    sequence:
      - variables:
          src: "{{ sync_source if sync_source is defined and sync_source else 'peer_median' }}"
          ph_raw: >
            {% set ns = namespace(v=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_ph')|float(none) %}
                {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          ec_raw: >
            {% set ns = namespace(v=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_conductivity')|float(none) %}
                {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          m_raw: >
            {% set ns = namespace(v=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_moisture')|float(none) %}
                {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          ph_med: >
            {% set s = ph_raw|sort %}
            {% set n = s|length %}
            {% if n == 0 %}none
            {% elif n < 3 %}{{ s[(n-1)//2] }}
            {% else %}
              {% set med = s[(n-1)//2] %}
              {% set ds = namespace(d=[]) %}
              {% for x in s %}{% set ds.d = ds.d + [(x - med)|abs] %}{% endfor %}
              {% set mad = (ds.d|sort)[((ds.d|length)-1)//2] %}
              {% set keep = namespace(v=[]) %}
              {% for x in s %}
                {% if mad|float(0) < 1e-9 or (x - med)|abs <= 2.5 * mad %}
                  {% set keep.v = keep.v + [x] %}
                {% endif %}
              {% endfor %}
              {% set k = keep.v if keep.v|length >= 2 else s %}
              {{ (k|sort)[((k|length)-1)//2] }}
            {% endif %}
          ec_med: >
            {% set s = ec_raw|sort %}
            {% set n = s|length %}
            {% if n == 0 %}none
            {% elif n < 3 %}{{ s[(n-1)//2] }}
            {% else %}
              {% set med = s[(n-1)//2] %}
              {% set ds = namespace(d=[]) %}
              {% for x in s %}{% set ds.d = ds.d + [(x - med)|abs] %}{% endfor %}
              {% set mad = (ds.d|sort)[((ds.d|length)-1)//2] %}
              {% set keep = namespace(v=[]) %}
              {% for x in s %}
                {% if mad|float(0) < 1e-9 or (x - med)|abs <= 2.5 * mad %}
                  {% set keep.v = keep.v + [x] %}
                {% endif %}
              {% endfor %}
              {% set k = keep.v if keep.v|length >= 2 else s %}
              {{ (k|sort)[((k|length)-1)//2] }}
            {% endif %}
          m_med: >
            {% set s = m_raw|sort %}
            {% set n = s|length %}
            {% if n == 0 %}none
            {% elif n < 3 %}{{ s[(n-1)//2] }}
            {% else %}
              {% set med = s[(n-1)//2] %}
              {% set ds = namespace(d=[]) %}
              {% for x in s %}{% set ds.d = ds.d + [(x - med)|abs] %}{% endfor %}
              {% set mad = (ds.d|sort)[((ds.d|length)-1)//2] %}
              {% set keep = namespace(v=[]) %}
              {% for x in s %}
                {% if mad|float(0) < 1e-9 or (x - med)|abs <= 2.5 * mad %}
                  {% set keep.v = keep.v + [x] %}
                {% endif %}
              {% endfor %}
              {% set k = keep.v if keep.v|length >= 2 else s %}
              {{ (k|sort)[((k|length)-1)//2] }}
            {% endif %}
      - condition: template
        value_template: "{{ ph_med not in ['none', none] or ec_med not in ['none', none] or m_med not in ['none', none] }}"
      - repeat:
          for_each:
            - 1
            - 2
            - 3
            - 4
          sequence:
            - condition: template
              value_template: "{{ is_state('input_boolean.dsc_pot' ~ repeat.item ~ '_in_service','on') }}"
            - if:
                - condition: template
                  value_template: "{{ ph_med not in ['none', none] }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.dsc_pot{{ repeat.item }}_offset_ph"
                  data:
                    value: "{{ (ph_med|float - states('sensor.dsc_pot' ~ repeat.item ~ '_soil_ph')|float(ph_med|float))|round(2) }}"
            - if:
                - condition: template
                  value_template: "{{ ec_med not in ['none', none] }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.dsc_pot{{ repeat.item }}_offset_ec_us"
                  data:
                    value: "{{ (ec_med|float - states('sensor.dsc_pot' ~ repeat.item ~ '_soil_conductivity')|float(ec_med|float))|round(0) }}"
            - if:
                - condition: template
                  value_template: "{{ m_med not in ['none', none] }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.dsc_pot{{ repeat.item }}_offset_moisture"
                  data:
                    value: "{{ (m_med|float - states('sensor.dsc_pot' ~ repeat.item ~ '_soil_moisture')|float(m_med|float))|round(1) }}"
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.dsc_peer_sync_last }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_method }
        data:
          value: "{{ src }}"
      - action: input_text.set_value
        target: { entity_id: input_text.dsc_peer_sync_status }
        data:
          value: >-
            Synced {{ now().strftime('%Y-%m-%d %H:%M') }} ({{ src }}).
            Got ≈ MAD-filtered median. Push peer → ESP to move SoT onto pots.
      - action: persistent_notification.create
        data:
          title: "Peer baseline captured"
          message: >-
            Offsets set so corrected Got ≈ MAD-filtered median ({{ src }}).
            Optional next: Push peer → ESP (SoT) on Strains.
  dsc_migrate_strain_sprout_ha_to_pot:
    alias: "DSC Migrate Strain/Sprout HA → Pot"
    description: "One-shot copy of HA input strain/sprout onto pot ESP entities when pot is online and still at defaults."
    mode: single
    sequence:
      - repeat:
          for_each:
            - 1
            - 2
            - 3
            - 4
          sequence:
            - variables:
                pot: "{{ repeat.item }}"
                pot_strain: "select.dsc_pot{{ pot }}_strain"
                ha_strain: "input_select.dsc_pot{{ pot }}_strain"
                pot_sprout: "datetime.dsc_pot{{ pot }}_sprout_date"
                ha_sprout: "input_datetime.dsc_pot{{ pot }}_sprout_date"
            - condition: template
              value_template: "{{ states(pot_strain) not in ['unknown','unavailable',''] }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ states(pot_strain) == 'Generic Photoperiod'
                       and states(ha_strain) not in ['unknown','unavailable','', 'Generic Photoperiod'] }}
              then:
                - action: select.select_option
                  target:
                    entity_id: "{{ pot_strain }}"
                  data:
                    option: "{{ states(ha_strain) }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ states(ha_sprout) not in ['unknown','unavailable','']
                       and (states(pot_sprout) in ['unknown','unavailable','']
                            or states(pot_sprout)[:10] in ['1970-01-01','0000-00-00']
                            or states(pot_sprout)|length < 8) }}
              then:
                - action: datetime.set_value
                  target:
                    entity_id: "{{ pot_sprout }}"
                  data:
                    date: "{{ states(ha_sprout)[:10] }}"
  dsc_custom_fill_from_catalog:
    alias: "DSC Custom Fill From Catalog"
    description: "Fill one custom slot from sensor.dsc_strain_catalog Want bands."
    mode: queued
    max: 5
    fields:
      slot:
        name: Custom slot
        description: "Slot number 1-5."
        required: true
        selector:
          number:
            min: 1
            max: 5
            step: 1
            mode: box
      seed_name:
        name: Catalog seed name
        description: "Exact catalog display name, case-insensitive."
        required: true
        selector:
          text:
    sequence:
      - variables:
          slot_id: "{{ slot|int(0) }}"
          wanted_name: "{{ seed_name|trim|lower }}"
          bands: "{% set _wb = state_attr('sensor.dsc_strain_catalog', 'want_bands') %}{{ _wb if _wb is mapping else (_wb|from_json if _wb else {}) }}"
          band: >
            {% set ns = namespace(found={}) %}
            {% for row in bands.values() %}
              {% if row.get('name','')|lower == wanted_name %}{% set ns.found = row %}{% endif %}
            {% endfor %}
            {{ ns.found }}
      - condition: template
        value_template: "{{ 1 <= slot_id <= 5 and band|count > 0 }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.dsc_custom_strain_{{ slot_id }}_name"
        data:
          value: "{{ band.get('name') }}"
      - action: input_select.select_option
        target:
          entity_id: "input_select.dsc_custom_strain_{{ slot_id }}_type"
        data:
          option: "{{ band.get('type') if band.get('type') in ['photo','auto','other'] else 'other' }}"
      - repeat:
          for_each:
            - { suffix: ph_min, value: "{{ band.get('ph', [5.8,6.5])[0] }}" }
            - { suffix: ph_max, value: "{{ band.get('ph', [5.8,6.5])[1] }}" }
            - { suffix: ec_min, value: "{{ band.get('ec_veg_us', [800,1600])[0] }}" }
            - { suffix: ec_max, value: "{{ band.get('ec_veg_us', [800,1600])[1] }}" }
            - { suffix: ec_seedling_min, value: "{{ band.get('ec_seedling_us', [0,0])[0] }}" }
            - { suffix: ec_seedling_max, value: "{{ band.get('ec_seedling_us', [0,0])[1] }}" }
            - { suffix: ec_veg_min, value: "{{ band.get('ec_veg_us', [0,0])[0] }}" }
            - { suffix: ec_veg_max, value: "{{ band.get('ec_veg_us', [0,0])[1] }}" }
            - { suffix: ec_flower_min, value: "{{ band.get('ec_flower_us', [0,0])[0] }}" }
            - { suffix: ec_flower_max, value: "{{ band.get('ec_flower_us', [0,0])[1] }}" }
            - { suffix: moisture_min, value: "{{ band.get('moisture_pct', [45,70])[0] }}" }
            - { suffix: moisture_max, value: "{{ band.get('moisture_pct', [45,70])[1] }}" }
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "input_number.dsc_custom_strain_{{ slot_id }}_{{ repeat.item.suffix }}"
              data:
                value: "{{ repeat.item.value|float(0) }}"
      - if:
          - condition: template
            value_template: >-
              {{ band.get('curated', false)
                 and band.get('temp_c', [0,0])[0]|float(0) > 0
                 and band.get('temp_c', [0,0])[1]|float(0) > 0 }}
        then:
          - action: input_number.set_value
            target:
              entity_id: "input_number.dsc_custom_strain_{{ slot_id }}_temp_min"
            data:
              value: "{{ band.get('temp_c')[0] }}"
          - action: input_number.set_value
            target:
              entity_id: "input_number.dsc_custom_strain_{{ slot_id }}_temp_max"
            data:
              value: "{{ band.get('temp_c')[1] }}"
      - if:
          - condition: template
            value_template: >-
              {{ band.get('curated', false)
                 and band.get('rh_pct', [0,0])[0]|float(0) > 0
                 and band.get('rh_pct', [0,0])[1]|float(0) > 0 }}
        then:
          - action: input_number.set_value
            target:
              entity_id: "input_number.dsc_custom_strain_{{ slot_id }}_rh_min"
            data:
              value: "{{ band.get('rh_pct')[0] }}"
          - action: input_number.set_value
            target:
              entity_id: "input_number.dsc_custom_strain_{{ slot_id }}_rh_max"
            data:
              value: "{{ band.get('rh_pct')[1] }}"
      - if:
          - condition: template
            value_template: "{{ band.get('chem_summary','')|trim|length > 0 }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: "input_text.dsc_custom_strain_{{ slot_id }}_notes"
            data:
              value: "{{ band.get('chem_summary')|string|truncate(255, true, '') }}"
  dsc_promote_customs_yaml_preview:
    alias: "DSC Promote Customs YAML Preview (N-011)"
    description: >-
      Builds a YAML/JSON preview of occupied custom strain slots into a
      persistent notification for copy into homeassistant/data/*.yaml.
      Does not write git files. See scripts/promote_customs_to_yaml.py.
    mode: single
    sequence:
      - variables:
          body: >
            {% set ns = namespace(lines=['customs:']) %}
            {% for i in range(1,6) %}
              {% set name = states('input_text.dsc_custom_strain_' ~ i ~ '_name')|trim %}
              {% if name and not name.lower().startswith('custom') %}
                {% set ns.lines = ns.lines + [
                  '  - slot: ' ~ i,
                  '    name: ' ~ name,
                  '    type: ' ~ states('input_select.dsc_custom_strain_' ~ i ~ '_type'),
                  '    ph: [' ~ states('input_number.dsc_custom_strain_' ~ i ~ '_ph_min') ~ ', ' ~ states('input_number.dsc_custom_strain_' ~ i ~ '_ph_max') ~ ']',
                  '    ec: [' ~ states('input_number.dsc_custom_strain_' ~ i ~ '_ec_min') ~ ', ' ~ states('input_number.dsc_custom_strain_' ~ i ~ '_ec_max') ~ ']',
                  '    moisture: [' ~ states('input_number.dsc_custom_strain_' ~ i ~ '_moisture_min') ~ ', ' ~ states('input_number.dsc_custom_strain_' ~ i ~ '_moisture_max') ~ ']'
                ] %}
              {% endif %}
            {% endfor %}
            {% if ns.lines|length == 1 %}{{ 'No occupied custom strain names - nothing to promote.' }}
            {% else %}{{ ns.lines | join('\n') }}{% endif %}
      - action: persistent_notification.create
        data:
          title: "Promote customs ? git YAML"
          message: "{{ body }}"
          notification_id: dsc_promote_customs

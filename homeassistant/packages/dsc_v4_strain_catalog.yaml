script:
  dsc_pot1_apply_expected_stage:
    alias: "DSC POT1 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot1_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot1_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot1_expected_stage') }}"
  dsc_pot2_apply_expected_stage:
    alias: "DSC POT2 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot2_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot2_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot2_expected_stage') }}"
  dsc_pot3_apply_expected_stage:
    alias: "DSC POT3 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot3_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot3_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot3_expected_stage') }}"
  dsc_pot4_apply_expected_stage:
    alias: "DSC POT4 Apply Expected Stage"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('sensor.dsc_pot4_expected_stage') not in ['unknown','unavailable',''] }}"
      - action: select.select_option
        target:
          entity_id: select.dsc_pot4_growth_stage
        data:
          option: "{{ states('sensor.dsc_pot4_expected_stage') }}"
  dsc_pots_capture_peer_baseline:
    alias: "DSC Pots Capture Peer Baseline"
    description: "Set offsets so corrected Got matches median of in-service pots (same media assumed)."
    mode: single
    sequence:
      - variables:
          ph_vals: >
            {% set ns = namespace(v=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_ph')|float(none) %}
                {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          ec_vals: >
            {% set ns = namespace(v=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_conductivity')|float(none) %}
                {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          m_vals: >
            {% set ns = namespace(v=[]) %}
            {% for n in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
                {% set r = states('sensor.dsc_pot' ~ n ~ '_soil_moisture')|float(none) %}
                {% if r is not none %}{% set ns.v = ns.v + [r] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          ph_med: "{{ (ph_vals|sort)[((ph_vals|length)-1)//2] if ph_vals|length else none }}"
          ec_med: "{{ (ec_vals|sort)[((ec_vals|length)-1)//2] if ec_vals|length else none }}"
          m_med: "{{ (m_vals|sort)[((m_vals|length)-1)//2] if m_vals|length else none }}"
      - repeat:
          for_each:
            - 1
            - 2
            - 3
            - 4
          sequence:
            - condition: template
              value_template: "{{ is_state('input_boolean.dsc_pot' ~ repeat.item ~ '_in_service','on') }}"
            - if:
                - condition: template
                  value_template: "{{ ph_med is not none }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.dsc_pot{{ repeat.item }}_offset_ph"
                  data:
                    value: "{{ (ph_med - states('sensor.dsc_pot' ~ repeat.item ~ '_soil_ph')|float(ph_med))|round(2) }}"
            - if:
                - condition: template
                  value_template: "{{ ec_med is not none }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.dsc_pot{{ repeat.item }}_offset_ec_us"
                  data:
                    value: "{{ (ec_med - states('sensor.dsc_pot' ~ repeat.item ~ '_soil_conductivity')|float(ec_med))|round(0) }}"
            - if:
                - condition: template
                  value_template: "{{ m_med is not none }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.dsc_pot{{ repeat.item }}_offset_moisture"
                  data:
                    value: "{{ (m_med - states('sensor.dsc_pot' ~ repeat.item ~ '_soil_moisture')|float(m_med))|round(1) }}"
      - action: persistent_notification.create
        data:
          title: "Peer baseline captured"
          message: "Offsets set so corrected Got ≈ median of in-service pots."

  dsc_migrate_strain_sprout_ha_to_pot:
    alias: "DSC Migrate Strain/Sprout HA → Pot"
    description: "One-shot copy of HA input strain/sprout onto pot ESP entities when pot is online and still at defaults."
    mode: single
    sequence:
      - repeat:
          for_each:
            - 1
            - 2
            - 3
            - 4
          sequence:
            - variables:
                pot: "{{ repeat.item }}"
                pot_strain: "select.dsc_pot{{ pot }}_strain"
                ha_strain: "input_select.dsc_pot{{ pot }}_strain"
                pot_sprout: "datetime.dsc_pot{{ pot }}_sprout_date"
                ha_sprout: "input_datetime.dsc_pot{{ pot }}_sprout_date"
            - condition: template
              value_template: "{{ states(pot_strain) not in ['unknown','unavailable',''] }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ states(pot_strain) == 'Generic Photoperiod'
                       and states(ha_strain) not in ['unknown','unavailable','', 'Generic Photoperiod'] }}
              then:
                - action: select.select_option
                  target:
                    entity_id: "{{ pot_strain }}"
                  data:
                    option: "{{ states(ha_strain) }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ states(ha_sprout) not in ['unknown','unavailable','']
                       and (states(pot_sprout) in ['unknown','unavailable','']
                            or states(pot_sprout)[:10] == '1970-01-01') }}
              then:
                - action: datetime.set_value
                  target:
                    entity_id: "{{ pot_sprout }}"
                  data:
                    date: "{{ states(ha_sprout)[:10] }}"

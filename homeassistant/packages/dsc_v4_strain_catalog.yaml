            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_ec_min')|float(800) }}
          {% elif 'Flower' in stage %}{{ 1400 if s == 'Generic Autoflower' else 1600 }}
          {% elif 'Seedling' in stage or stage == 'Germination' %}{{ 400 if s == 'Generic Autoflower' else 500 }}
          {% else %}{{ 800 if s == 'Generic Autoflower' else 1000 }}{% endif %}
      - name: "DSC POT4 Want EC Max"
        unique_id: dsc_pot4_want_ec_max
        unit_of_measurement: "µS/cm"
        state: >
          {% set s = states('select.dsc_pot4_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot4_strain') %}{% endif %}
          {% set stage = states('sensor.dsc_pot4_expected_stage') %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_ec_max')|float(1600) }}
          {% elif 'Flower' in stage %}{{ 2000 if s == 'Generic Autoflower' else 2400 }}
          {% elif 'Seedling' in stage or stage == 'Germination' %}{{ 800 if s == 'Generic Autoflower' else 900 }}
          {% else %}{{ 1400 if s == 'Generic Autoflower' else 1600 }}{% endif %}
      - name: "DSC POT4 Want Moisture Min"
        unique_id: dsc_pot4_want_moisture_min
        unit_of_measurement: "%"
        state: >
          {% set s = states('select.dsc_pot4_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot4_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_moisture_min')|float(45) }}
          {% else %}45{% endif %}
      - name: "DSC POT4 Want Moisture Max"
        unique_id: dsc_pot4_want_moisture_max
        unit_of_measurement: "%"
        state: >
          {% set s = states('select.dsc_pot4_strain') %}{% if s in ['unknown','unavailable',''] %}{% set s = states('input_select.dsc_pot4_strain') %}{% endif %}
          {% if s.startswith('Custom') %}
            {{ states('input_number.dsc_custom_strain_' ~ s.split(' ')[1] ~ '_moisture_max')|float(70) }}
          {% else %}70{% endif %}

      - name: "DSC POT4 Got pH"
        unique_id: dsc_pot4_got_ph
        state: >
          {% set r = states('sensor.dsc_pot4_soil_ph')|float(none) %}
          {% set o = states('input_number.dsc_pot4_offset_ph')|float(0) %}
          {{ (r + o)|round(2) if r is not none else none }}
      - name: "DSC POT4 Got EC"
        unique_id: dsc_pot4_got_ec
        unit_of_measurement: "µS/cm"
        state: >
          {% set r = states('sensor.dsc_pot4_soil_conductivity')|float(none) %}
          {% set o = states('input_number.dsc_pot4_offset_ec_us')|float(0) %}
          {{ (r + o)|round(0) if r is not none else none }}
      - name: "DSC POT4 Got Moisture"
        unique_id: dsc_pot4_got_moisture
        unit_of_measurement: "%"
        state: >
          {% set r = states('sensor.dsc_pot4_soil_moisture')|float(none) %}
          {% set o = states('input_number.dsc_pot4_offset_moisture')|float(0) %}
          {{ (r + o)|round(1) if r is not none else none }}

      - name: "DSC POT4 Need EC Delta"
        unique_id: dsc_pot4_need_ec_delta
        unit_of_measurement: "µS/cm"
        state: >
          {% set g = states('sensor.dsc_pot4_got_ec')|float(none) %}
          {% set lo = states('sensor.dsc_pot4_want_ec_min')|float(none) %}
          {% set hi = states('sensor.dsc_pot4_want_ec_max')|float(none) %}
          {% if g is none or lo is none or hi is none %}none
          {% elif g < lo %}{{ (lo - g)|round(0) }}
          {% elif g > hi %}{{ (hi - g)|round(0) * -1 }}
          {% else %}0{% endif %}

      - name: "DSC POT4 Need Summary"
        unique_id: dsc_pot4_need_summary
        icon: mdi:clipboard-text
        state: >
          {% set g_ec = states('sensor.dsc_pot4_got_ec')|float(none) %}
          {% set lo = states('sensor.dsc_pot4_want_ec_min')|float(0) %}
          {% set hi = states('sensor.dsc_pot4_want_ec_max')|float(0) %}
          {% set g_ph = states('sensor.dsc_pot4_got_ph')|float(none) %}
          {% set ph_lo = states('sensor.dsc_pot4_want_ph_min')|float(5.8) %}
          {% set ph_hi = states('sensor.dsc_pot4_want_ph_max')|float(6.5) %}
          {% set g_m = states('sensor.dsc_pot4_got_moisture')|float(none) %}
          {% set m_lo = states('sensor.dsc_pot4_want_moisture_min')|float(45) %}
          {% set m_hi = states('sensor.dsc_pot4_want_moisture_max')|float(70) %}
          {% set bits = [] %}
          {% if g_ec is not none and g_ec < lo %}{% set bits = bits + ['EC low vs Want by ~' ~ (lo-g_ec)|round(0) ~ ' µS/cm'] %}
          {% elif g_ec is not none and g_ec > hi %}{% set bits = bits + ['EC high vs Want by ~' ~ (g_ec-hi)|round(0) ~ ' µS/cm'] %}{% endif %}
          {% if g_ph is not none and g_ph < ph_lo %}{% set bits = bits + ['pH low'] %}
          {% elif g_ph is not none and g_ph > ph_hi %}{% set bits = bits + ['pH high'] %}{% endif %}
          {% if g_m is not none and g_m < m_lo %}{% set bits = bits + ['moisture low'] %}
          {% elif g_m is not none and g_m > m_hi %}{% set bits = bits + ['moisture high'] %}{% endif %}
          {{ bits|join('; ') if bits else 'On target vs Want bands' }}

  - binary_sensor:
      - name: "DSC POT1 Stage Mismatch"
        unique_id: dsc_pot1_stage_mismatch

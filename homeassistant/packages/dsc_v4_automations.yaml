# ==================================================================
#  DSC-HUB v4 · AUTOMATIONS (package)
#  ------------------------------------------------------------------
#  Demand followers, alerts, grow-log scribe, and safety nets
#  (hub-offline safe-off + emergency/climate/aux fault alerts).
#
#  Synced as a package so git-push deploy never overwrites non-DSC
#  entries in /config/automations.yaml.
#
#  v4 notes:
#   * Root-zone alert covers all four pot ESP-NOW links.
#   * Mat scribe logs coldest plausible pot when available.
#   * Notifier target is input_text.dsc_notify_service via script.dsc_notify (see dsc_v4_notify.yaml).
#   * AC / clone mister followers: gated by input_boolean.*_in_service and
#     only act when switch.dsc_ac_main_relay / switch.dsc_clone_humidifier_main_relay
#     exist (bring hardware online, then flip In Service).
#
#  Capacity audit (soft hardening): HA must NOT run a second escalation
#  ladder. Firmware owns fans + demand rungs; this file only mirrors the
#  four wired Sonoffs (hum / dehum / heater / mat), alerts, and safe-off.
#  Verified: followers resync on HA start, relay restore, hub-link restore;
#  skip while node test mode is on; hub-offline ≥30s forces all four OFF.
#
#  API-blip tolerance (heater-critical): hub WiFi + DSC-CONTROL/ESP-NOW
#  can stay healthy while HA alone marks the hub unavailable (Noise API
#  session flap). Followers no longer fail-closed on that. Genuine
#  demand → off is immediate. Demand / ha_link unavailable|off must hold
#  ≥25s before follower OFF; 30s hub-offline safe-off remains the hard
#  belt. Sonoff node grace still covers total HA death.
#
#  Phase A response-rate learning lives in dsc_v4_climate_learn.yaml
#  (EMA observer + ETA gauges only — never writes ladder waits).
# ==================================================================

automation:
  - id: dsc_follower_humidifier
    alias: "DSC-HUB · Humidifier follows Humidifier Demand"
    description: "Relay mirrors hub demand. Genuine OFF immediate; hub blips debounce 25s before OFF. Resyncs on HA restart + node reconnect + hub-link restore."
    mode: restart
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_humidifier_demand
        to: "on"
      - trigger: state
        entity_id: switch.dsc_hub_humidifier_demand
        to: "off"
      - trigger: state
        entity_id: switch.dsc_hub_humidifier_demand
        to: "unavailable"
        for: "00:00:25"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: switch.dsc_humidifier_main_relay
        from: "unavailable"
        for: "00:00:05"
      - trigger: state
        entity_id: switch.dsc_humidifier_main_relay
        to: "off"
        for: "00:00:02"
      # BUG-FIX 2026-08-02: symmetric resync — a console/manual relay ON
      # against demand OFF must not stick (demand stays source of truth;
      # use test_mode for intentional overrides).
      - trigger: state
        entity_id: switch.dsc_humidifier_main_relay
        to: "on"
        for: "00:00:02"
      - trigger: state
        entity_id: binary_sensor.dsc_hub_ha_link_status
        to: "on"
        for: "00:00:05"
      - trigger: state
        entity_id: binary_sensor.dsc_hub_ha_link_status
        to:
          - "off"
          - "unavailable"
        for: "00:00:25"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dsc_hub_humidifier_demand
                state: "on"
              - condition: state
                entity_id: binary_sensor.dsc_hub_ha_link_status
                state: "on"
              - condition: state
                entity_id: binary_sensor.dsc_humidifier_available
                state: "on"
              - condition: template
                value_template: "{{ not is_state('binary_sensor.dsc_humidifier_test_mode', 'on') }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.dsc_humidifier_main_relay
          - conditions:
              - condition: state
                entity_id: switch.dsc_hub_humidifier_demand
                state: "off"
              - condition: template
                value_template: "{{ not is_state('binary_sensor.dsc_humidifier_test_mode', 'on') }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_humidifier_main_relay
          - conditions:
              - condition: template
                value_template: "{{ not is_state('binary_sensor.dsc_humidifier_test_mode', 'on') }}"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: switch.dsc_hub_humidifier_demand
                    state: "unavailable"
                    for: "00:00:25"
                  - condition: state
                    entity_id: binary_sensor.dsc_hub_ha_link_status
                    state: "off"
                    for: "00:00:25"
                  - condition: state
                    entity_id: binary_sensor.dsc_hub_ha_link_status
                    state: "unavailable"
                    for: "00:00:25"
                  - condition: state
                    entity_id: binary_sensor.dsc_humidifier_available
                    state: "off"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_humidifier_main_relay


# ==================================================================
#  DSC-HUB v5.1.8 · SENSOR TRUST + DHT DISAGREE + HA-LINK DIAG
#  ------------------------------------------------------------------
#  N-020 stuck/peer-MAD trust · N-022 DHT disagreement · F-006 flap
#  counter (HA-side). Conservative defaults; soak before tightening.
# ==================================================================

input_number:
  dsc_trust_stuck_minutes:
    name: "DSC Trust Stuck Window (min)"
    min: 15
    max: 240
    step: 5
    initial: 45
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-alert
  dsc_trust_mad_ph:
    name: "DSC Trust Peer MAD pH Alert"
    min: 0.2
    max: 2.0
    step: 0.1
    initial: 0.6
    mode: box
    icon: mdi:ph
  dsc_trust_mad_ec:
    name: "DSC Trust Peer MAD EC Alert"
    min: 50
    max: 2000
    step: 25
    initial: 250
    unit_of_measurement: "µS/cm"
    mode: box
    icon: mdi:flash
  dsc_trust_mad_moisture:
    name: "DSC Trust Peer MAD Moisture Alert"
    min: 2
    max: 40
    step: 1
    initial: 12
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-percent
  dsc_dht_delta_t_c:
    name: "DSC DHT ΔT Alert (°C)"
    min: 1
    max: 15
    step: 0.5
    initial: 4
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-alert
  dsc_dht_delta_rh:
    name: "DSC DHT ΔRH Alert (%)"
    min: 5
    max: 40
    step: 1
    initial: 15
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-percent-alert

input_boolean:
  dsc_trust_auto_clear_mat_vote:
    name: "DSC Trust Auto-Clear Mat Vote"
    icon: mdi:heat-wave
    initial: false

template:
  - sensor:
      - name: "DSC CFM Curves Status"
        unique_id: dsc_cfm_curves_status
        icon: mdi:chart-bell-curve
        state: >
          {% set targets = ['out','recirc','intake_main','intake_clone'] %}
          {% set ns = namespace(setn=0, unset=[]) %}
          {% for t in targets %}
            {% set pts = [
              states('input_number.dsc_cal_cfm_' ~ t ~ '_25')|float(0),
              states('input_number.dsc_cal_cfm_' ~ t ~ '_50')|float(0),
              states('input_number.dsc_cal_cfm_' ~ t ~ '_75')|float(0),
              states('input_number.dsc_cal_cfm_' ~ t ~ '_100')|float(0)
            ] %}
            {% set filled = pts|select('>', 0)|list|length %}
            {% if filled >= 2 %}{% set ns.setn = ns.setn + 1 %}
            {% else %}{% set ns.unset = ns.unset + [t] %}{% endif %}
          {% endfor %}
          {% if ns.setn == 4 %}all_curves
          {% elif ns.setn == 0 %}nameplate_only
          {% else %}partial {{ ns.setn }}/4{% endif %}
        attributes:
          unset: >
            {% set targets = ['out','recirc','intake_main','intake_clone'] %}
            {% set unset = [] %}
            {% for t in targets %}
              {% set pts = [
                states('input_number.dsc_cal_cfm_' ~ t ~ '_25')|float(0),
                states('input_number.dsc_cal_cfm_' ~ t ~ '_50')|float(0),
                states('input_number.dsc_cal_cfm_' ~ t ~ '_75')|float(0),
                states('input_number.dsc_cal_cfm_' ~ t ~ '_100')|float(0)
              ] %}
              {% if pts|select('>', 0)|list|length < 2 %}{% set unset = unset + [t] %}{% endif %}
            {% endfor %}
            {{ unset | join(', ') }}
          note: "Run Learning anemometer wizard; ≥2 points/duct flips CFM sensors off nameplate."

      - name: "DSC Keep-Up Gaps"
        unique_id: dsc_keepup_gaps
        icon: mdi:shield-alert-outline
        state: >
          {% set ns = namespace(g=[]) %}
          {% if is_state('binary_sensor.dsc_reduced_kit','on') %}
            {% set off = state_attr('binary_sensor.dsc_reduced_kit','offline') %}
            {% if off %}
              {% set ns.g = ns.g + ['Unexpected OOS: ' ~ off] %}
            {% endif %}
          {% endif %}
          {% if ns.g|length == 0 %}none
          {% else %}{{ ns.g|length }} gap(s){% endif %}
        attributes:
          planned_oos: "{{ state_attr('binary_sensor.dsc_reduced_kit','planned_oos') }}"
          gaps: >
            {% set g = [] %}
            {% if is_state('binary_sensor.dsc_reduced_kit','on') %}
              {% set off = state_attr('binary_sensor.dsc_reduced_kit','offline') %}
              {% if off %}{% set g = g + ['Unexpected OOS: ' ~ off] %}{% endif %}
            {% endif %}
            {{ g | join(' · ') }}
          full_auto_honesty: >-
            {% if is_state('switch.dsc_hub_tent_full_auto_mode','on')
                 and is_state('binary_sensor.dsc_reduced_kit','on') %}
              Full Auto armed with unexpected OOS — next-best levers only; cannot invent missing capacity
            {% elif is_state('binary_sensor.dsc_reduced_kit','on') %}
              Unexpected OOS — restore the live lever before claiming complete climate
            {% else %}Complete kit (planned holes are inventory, not keep-up faults){% endif %}

      - name: "DSC HA Link Flap Count 24h"
        unique_id: dsc_ha_link_flap_count_24h
        icon: mdi:lan-disconnect
        state: "{{ states('counter.dsc_ha_link_flaps_24h')|default(0) }}"
        attributes:
          note: "Increments when hub link drops to off. Reset daily. F-006 evidence."

  - binary_sensor:
      - name: "DSC POT1 Sensor Stuck"
        unique_id: dsc_pot1_sensor_stuck
        device_class: problem
        delay_on:
          minutes: 45
        state: >
          {% if not is_state('input_boolean.dsc_pot1_in_service','on') %}false
          {% else %}
          {% set win = states('input_number.dsc_trust_stuck_minutes')|float(45) %}
          {{ states('sensor.dsc_pot1_soil_moisture_rate')|float(0)|abs < 0.02
             and states('sensor.dsc_pot1_soil_moisture') not in ['unknown','unavailable','']
             and win >= 15 }}
          {% endif %}
      - name: "DSC POT2 Sensor Stuck"
        unique_id: dsc_pot2_sensor_stuck
        device_class: problem
        delay_on:
          minutes: 45
        state: >
          {% if not is_state('input_boolean.dsc_pot2_in_service','on') %}false
          {% else %}
          {{ states('sensor.dsc_pot2_soil_moisture_rate')|float(0)|abs < 0.02
             and states('sensor.dsc_pot2_soil_moisture') not in ['unknown','unavailable',''] }}
          {% endif %}
      - name: "DSC POT3 Sensor Stuck"
        unique_id: dsc_pot3_sensor_stuck
        device_class: problem
        delay_on:
          minutes: 45
        state: >
          {% if not is_state('input_boolean.dsc_pot3_in_service','on') %}false
          {% else %}
          {{ states('sensor.dsc_pot3_soil_moisture_rate')|float(0)|abs < 0.02
             and states('sensor.dsc_pot3_soil_moisture') not in ['unknown','unavailable',''] }}
          {% endif %}
      - name: "DSC POT4 Sensor Stuck"
        unique_id: dsc_pot4_sensor_stuck
        device_class: problem
        delay_on:
          minutes: 45
        state: >
          {% if not is_state('input_boolean.dsc_pot4_in_service','on') %}false
          {% else %}
          {{ states('sensor.dsc_pot4_soil_moisture_rate')|float(0)|abs < 0.02
             and states('sensor.dsc_pot4_soil_moisture') not in ['unknown','unavailable',''] }}
          {% endif %}

      - name: "DSC Peer MAD Alert"
        unique_id: dsc_peer_mad_alert
        device_class: problem
        delay_on:
          minutes: 20
        icon: mdi:chart-scatter-plot-hexbin
        state: >
          {% set ph = states('sensor.dsc_peer_divergence_ph')|float(none) %}
          {% set ec = states('sensor.dsc_peer_divergence_ec')|float(none) %}
          {% set m = states('sensor.dsc_peer_divergence_moisture')|float(none) %}
          {{ (ph is not none and ph >= states('input_number.dsc_trust_mad_ph')|float(0.6))
             or (ec is not none and ec >= states('input_number.dsc_trust_mad_ec')|float(250))
             or (m is not none and m >= states('input_number.dsc_trust_mad_moisture')|float(12)) }}

      # Fleet MAD is notify-only (dsc_peer_mad_alert). Do not stamp every
      # in-service pot untrusted — that auto-cleared all mat votes.
      - name: "DSC POT1 Untrusted"
        unique_id: dsc_pot1_untrusted
        device_class: problem
        icon: mdi:shield-off
        state: >
          {{ is_state('input_boolean.dsc_pot1_in_service','on')
             and is_state('binary_sensor.dsc_pot1_sensor_stuck','on') }}
      - name: "DSC POT2 Untrusted"
        unique_id: dsc_pot2_untrusted
        device_class: problem
        icon: mdi:shield-off
        state: >
          {{ is_state('input_boolean.dsc_pot2_in_service','on')
             and is_state('binary_sensor.dsc_pot2_sensor_stuck','on') }}
      - name: "DSC POT3 Untrusted"
        unique_id: dsc_pot3_untrusted
        device_class: problem
        icon: mdi:shield-off
        state: >
          {{ is_state('input_boolean.dsc_pot3_in_service','on')
             and is_state('binary_sensor.dsc_pot3_sensor_stuck','on') }}
      - name: "DSC POT4 Untrusted"
        unique_id: dsc_pot4_untrusted
        device_class: problem
        icon: mdi:shield-off
        state: >
          {{ is_state('input_boolean.dsc_pot4_in_service','on')
             and is_state('binary_sensor.dsc_pot4_sensor_stuck','on') }}

      - name: "DSC DHT Disagreement"
        unique_id: dsc_dht_disagreement
        device_class: problem
        delay_on:
          minutes: 15
        delay_off:
          minutes: 5
        icon: mdi:home-thermometer
        state: >
          {% set tt = states('sensor.dsc_hub_tent_temperature')|float(none) %}
          {% set rt = states('sensor.dsc_hub_room_temperature')|float(none) %}
          {% set ct = states('sensor.dsc_hub_clone_temperature')|float(none) %}
          {% set th = states('sensor.dsc_hub_tent_humidity')|float(none) %}
          {% set rh = states('sensor.dsc_hub_room_humidity')|float(none) %}
          {% set ch = states('sensor.dsc_hub_clone_humidity')|float(none) %}
          {% set dt = states('input_number.dsc_dht_delta_t_c')|float(4) %}
          {% set dr = states('input_number.dsc_dht_delta_rh')|float(15) %}
          {% set temps = [tt, rt, ct]|select('ne', none)|list %}
          {% set rhs = [th, rh, ch]|select('ne', none)|list %}
          {% set tspan = (temps|max - temps|min) if temps|length >= 2 else 0 %}
          {% set rspan = (rhs|max - rhs|min) if rhs|length >= 2 else 0 %}
          {{ tspan >= dt or rspan >= dr }}
        attributes:
          note: "Cue only — does not trip failsafe. Check Tent/Room/Clone DHT placement."

counter:
  dsc_ha_link_flaps_24h:
    name: "DSC HA Link Flaps 24h"
    icon: mdi:lan-disconnect
    initial: 0
    step: 1

automation:
  - id: dsc_trust_peer_mad_notify
    alias: "DSC Trust · Peer MAD alert notify"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dsc_peer_mad_alert
        to: "on"
    actions:
      - action: persistent_notification.create
        data:
          title: "Peer probe divergence"
          message: >-
            {{ states('sensor.dsc_peer_divergence_summary') }} —
            check stuck/outlier pot before trusting mat vote.
      - action: script.dsc_notify
        data:
          title: "DSC peer MAD"
          message: "{{ states('sensor.dsc_peer_divergence_summary') }}"

  - id: dsc_trust_stuck_notify
    alias: "DSC Trust · Stuck pot notify"
    mode: queued
    max: 4
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.dsc_pot1_sensor_stuck
          - binary_sensor.dsc_pot2_sensor_stuck
          - binary_sensor.dsc_pot3_sensor_stuck
          - binary_sensor.dsc_pot4_sensor_stuck
        to: "on"
    actions:
      - action: persistent_notification.create
        data:
          title: "Pot sensor stuck"
          message: "{{ trigger.to_state.name }} flatline ≥ stuck window."

  - id: dsc_dht_disagreement_notify
    alias: "DSC DHT disagreement notify"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dsc_dht_disagreement
        to: "on"
    actions:
      - action: persistent_notification.create
        data:
          title: "DHT disagreement"
          message: >-
            Tent/Room/Clone ΔT or ΔRH exceeded threshold for 15 min.
            Climate cue only — not a failsafe trip.

  - id: dsc_trust_auto_clear_mat
    alias: "DSC Trust · Auto-clear mat vote when untrusted"
    mode: queued
    max: 4
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.dsc_pot1_untrusted
          - binary_sensor.dsc_pot2_untrusted
          - binary_sensor.dsc_pot3_untrusted
          - binary_sensor.dsc_pot4_untrusted
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.dsc_trust_auto_clear_mat_vote
        state: "on"
    actions:
      - variables:
          n: "{{ trigger.entity_id.split('_')[2] | replace('pot','') }}"
      - action: switch.turn_off
        target:
          entity_id: "switch.dsc_hub_mat_vote_pot_{{ n }}"

  - id: dsc_ha_link_flap_count
    alias: "DSC HA Link flap counter (F-006)"
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: binary_sensor.dsc_hub_link
        to: "off"
    actions:
      - action: counter.increment
        target: { entity_id: counter.dsc_ha_link_flaps_24h }

  - id: dsc_ha_link_flap_daily_reset
    alias: "DSC HA Link flap counter daily reset"
    mode: single
    triggers:
      - trigger: time
        at: "00:05:00"
    actions:
      - action: counter.reset
        target: { entity_id: counter.dsc_ha_link_flaps_24h }

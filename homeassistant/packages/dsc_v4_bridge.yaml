# ==================================================================
#  DSC-HUB · Bridge helpers (studio cutover)
#  ETH01 ethernet + optional Sonoff API client. SoftAP / ESP-NOW parked.
#  HA demand followers are the primary appliance path.
# ==================================================================

template:
  - binary_sensor:
      - name: "DSC Bridge Online"
        unique_id: dsc_bridge_online
        device_class: connectivity
        state: >-
          {{ states('binary_sensor.dsc_bridge_status') not in
             ['unknown','unavailable','']
             or has_value('sensor.dsc_bridge_uptime') }}
        availability: "{{ has_value('sensor.dsc_bridge_uptime') or has_value('binary_sensor.dsc_bridge_status') }}"

      - name: "DSC Appliances Path OK"
        unique_id: dsc_appliances_path_ok
        icon: mdi:transmission-tower
        state: >-
          {% set ha = is_state('binary_sensor.dsc_hub_ha_link_status','on') %}
          {{ ha }}

      - name: "DSC Anchor SoftAP Up"
        unique_id: dsc_anchor_softap_up
        device_class: connectivity
        icon: mdi:access-point-off
        state: "false"
        attributes:
          note: SoftAP parked after studio Wi-Fi cutover

  - sensor:
      - name: "DSC Bridge ESPNOW Age Mirror"
        unique_id: dsc_bridge_espnow_age_helper
        unit_of_measurement: ms
        state: "{{ states('sensor.dsc_bridge_esp_now_age') | default('0') }}"
        availability: "{{ has_value('sensor.dsc_bridge_esp_now_age') }}"
        attributes:
          note: ESP-NOW parked — diagnostic only

      - name: "DSC Anchor BSSID"
        unique_id: dsc_anchor_bssid_helper
        state: "PARKED"
        attributes:
          note: SoftAP disabled on live lab

      - name: "DSC Anchor Channel"
        unique_id: dsc_anchor_channel_helper
        state: "0"
        attributes:
          note: SoftAP disabled on live lab

automation:
  - id: dsc_bridge_offline_demand_notify
    alias: "DSC-HUB · HA path down while demand ON"
    description: "Warn when appliances need HA followers and hub HA link is down."
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {{ is_state('binary_sensor.dsc_hub_ha_link_status','off')
             and (
               is_state('switch.dsc_hub_humidifier_demand','on')
               or is_state('switch.dsc_hub_dehumidifier_demand','on')
               or is_state('switch.dsc_hub_heater_demand','on')
               or is_state('switch.dsc_hub_grow_mat_demand','on')
             ) }}
        for: "00:01:00"
    action:
      - action: script.dsc_notify
        data:
          title: "DSC appliances — HA path down"
          message: >-
            Hub demand is ON but hub HA link is down.
            SoftAP/ESP-NOW are parked; Sonoffs need HA followers.
        continue_on_error: true

  # Prefer-Anchor SoftAP BSSID automation retired (SoftAP parked).

# ==================================================================
#  DSC-HUB v5.1.4 · ACTUATOR EFFICACY + TEMP OOS / LOCKOUT
#  ------------------------------------------------------------------
#  Command → effect learning. No response vs history → Temp OOS
#  (flashing UI) + demand forced off. Operator Lockout is manual-only;
#  system never clears lockout.
# ==================================================================

input_boolean:
  dsc_humidifier_temp_oos:
    name: "DSC Humidifier Temp OOS"
    icon: mdi:water-alert
    initial: false
  dsc_dehumidifier_temp_oos:
    name: "DSC Dehumidifier Temp OOS"
    icon: mdi:air-humidifier-off
    initial: false
  dsc_clone_humidifier_temp_oos:
    name: "DSC Clone Humidifier Temp OOS"
    icon: mdi:sprinkler-alert
    initial: false
  dsc_humidifier_operator_lockout:
    name: "DSC Humidifier Operator Lockout"
    icon: mdi:lock
    initial: false
  dsc_dehumidifier_operator_lockout:
    name: "DSC Dehumidifier Operator Lockout"
    icon: mdi:lock
    initial: false
  dsc_clone_humidifier_operator_lockout:
    name: "DSC Clone Humidifier Operator Lockout"
    icon: mdi:lock
    initial: false

input_number:
  dsc_humidifier_rh_at_start:
    name: "DSC Humidifier RH at Demand Start"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    unit_of_measurement: "%"
    mode: box
  dsc_dehumidifier_rh_at_start:
    name: "DSC Dehumidifier RH at Demand Start"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    unit_of_measurement: "%"
    mode: box
  dsc_clone_humidifier_rh_at_start:
    name: "DSC Clone Humidifier RH at Demand Start"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    unit_of_measurement: "%"
    mode: box
  dsc_humidifier_learned_delta_rh:
    name: "DSC Humidifier Learned ΔRH / 5 min"
    min: 0
    max: 30
    step: 0.1
    initial: 1.0
    unit_of_measurement: "%"
    mode: box
  dsc_dehumidifier_learned_delta_rh:
    name: "DSC Dehumidifier Learned ΔRH / 5 min"
    min: 0
    max: 30
    step: 0.1
    initial: 1.0
    unit_of_measurement: "%"
    mode: box
  dsc_clone_humidifier_learned_delta_rh:
    name: "DSC Clone Humidifier Learned ΔRH / 5 min"
    min: 0
    max: 30
    step: 0.1
    initial: 1.0
    unit_of_measurement: "%"
    mode: box
  dsc_efficacy_min_delta_rh:
    name: "DSC Efficacy Min ΔRH Floor"
    min: 0.2
    max: 5
    step: 0.1
    initial: 0.5
    unit_of_measurement: "%"
    mode: box
  dsc_efficacy_window_min:
    name: "DSC Efficacy Window"
    min: 3
    max: 30
    step: 1
    initial: 5
    unit_of_measurement: "min"
    mode: box

template:
  - binary_sensor:
      - name: "DSC Humidifier Available"
        unique_id: dsc_humidifier_available
        icon: mdi:air-humidifier
        state: >-
          {{ not is_state('input_boolean.dsc_humidifier_temp_oos','on')
             and not is_state('input_boolean.dsc_humidifier_operator_lockout','on') }}

      - name: "DSC Dehumidifier Available"
        unique_id: dsc_dehumidifier_available
        icon: mdi:air-humidifier
        state: >-
          {{ not is_state('input_boolean.dsc_dehumidifier_temp_oos','on')
             and not is_state('input_boolean.dsc_dehumidifier_operator_lockout','on') }}

      - name: "DSC Clone Humidifier Available"
        unique_id: dsc_clone_humidifier_available
        icon: mdi:sprinkler-variant
        state: >-
          {{ is_state('input_boolean.dsc_clone_humidifier_in_service','on')
             and not is_state('input_boolean.dsc_clone_humidifier_temp_oos','on')
             and not is_state('input_boolean.dsc_clone_humidifier_operator_lockout','on') }}

      - name: "DSC Humidifier Temp OOS Active"
        unique_id: dsc_humidifier_temp_oos_active
        icon: mdi:flash-alert
        state: "{{ is_state('input_boolean.dsc_humidifier_temp_oos','on') }}"
        attributes:
          ui: flash
          reason: "{{ states('sensor.dsc_humidifier_efficacy_summary') }}"

      - name: "DSC Dehumidifier Temp OOS Active"
        unique_id: dsc_dehumidifier_temp_oos_active
        icon: mdi:flash-alert
        state: "{{ is_state('input_boolean.dsc_dehumidifier_temp_oos','on') }}"
        attributes:
          ui: flash
          reason: "{{ states('sensor.dsc_dehumidifier_efficacy_summary') }}"

      - name: "DSC Clone Humidifier Temp OOS Active"
        unique_id: dsc_clone_humidifier_temp_oos_active
        icon: mdi:flash-alert
        state: "{{ is_state('input_boolean.dsc_clone_humidifier_temp_oos','on') }}"
        attributes:
          ui: flash

  - sensor:
      - name: "DSC Humidifier Efficacy Summary"
        unique_id: dsc_humidifier_efficacy_summary
        icon: mdi:water-percent
        state: >
          {% if is_state('input_boolean.dsc_humidifier_operator_lockout','on') %}
            Operator lockout — system will not re-enable
          {% elif is_state('input_boolean.dsc_humidifier_temp_oos','on') %}
            Temp OOS — humidifier on without expected tent RH rise (empty / off / offline?)
          {% elif not is_state('binary_sensor.dsc_humidifier_available','on') %}
            Unavailable
          {% else %}OK — available{% endif %}

      - name: "DSC Dehumidifier Efficacy Summary"
        unique_id: dsc_dehumidifier_efficacy_summary
        icon: mdi:water-percent
        state: >
          {% if is_state('input_boolean.dsc_dehumidifier_operator_lockout','on') %}
            Operator lockout — system will not re-enable
          {% elif is_state('input_boolean.dsc_dehumidifier_temp_oos','on') %}
            Temp OOS — dehumidifier on without expected tent RH drop (full tank / off / offline?)
          {% else %}OK — available{% endif %}

      - name: "DSC Clone Humidifier Efficacy Summary"
        unique_id: dsc_clone_humidifier_efficacy_summary
        icon: mdi:water-percent
        state: >
          {% if is_state('input_boolean.dsc_clone_humidifier_operator_lockout','on') %}
            Operator lockout — system will not re-enable
          {% elif is_state('input_boolean.dsc_clone_humidifier_temp_oos','on') %}
            Temp OOS — clone humidifier on without expected RH rise
          {% elif not is_state('input_boolean.dsc_clone_humidifier_in_service','on') %}
            Capacity OOS (in-service off)
          {% else %}OK — available{% endif %}

script:
  dsc_clear_humidifier_temp_oos:
    alias: "DSC Clear Humidifier Temp OOS"
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dsc_humidifier_temp_oos
      - action: persistent_notification.create
        data:
          title: "Humidifier Temp OOS cleared"
          message: "Device available again (operator lockout unchanged)."

  dsc_clear_dehumidifier_temp_oos:
    alias: "DSC Clear Dehumidifier Temp OOS"
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dsc_dehumidifier_temp_oos
      - action: persistent_notification.create
        data:
          title: "Dehumidifier Temp OOS cleared"
          message: "Device available again (operator lockout unchanged)."

  dsc_clear_clone_humidifier_temp_oos:
    alias: "DSC Clear Clone Humidifier Temp OOS"
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dsc_clone_humidifier_temp_oos

automation:
  - id: dsc_humidifier_record_rh_on_demand
    alias: "DSC Humidifier · Record RH at demand start"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_humidifier_demand
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.dsc_humidifier_available
        state: "on"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.dsc_humidifier_rh_at_start
        data:
          value: "{{ states('sensor.dsc_hub_tent_humidity')|float(0) }}"

  - id: dsc_dehumidifier_record_rh_on_demand
    alias: "DSC Dehumidifier · Record RH at demand start"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_dehumidifier_demand
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.dsc_dehumidifier_available
        state: "on"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.dsc_dehumidifier_rh_at_start
        data:
          value: "{{ states('sensor.dsc_hub_tent_humidity')|float(0) }}"

  - id: dsc_clone_humidifier_record_rh_on_demand
    alias: "DSC Clone Humidifier · Record RH at demand start"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_clone_humidifier_demand
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.dsc_clone_humidifier_available
        state: "on"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.dsc_clone_humidifier_rh_at_start
        data:
          value: "{{ states('sensor.dsc_hub_clone_humidity')|float(0) }}"

  - id: dsc_humidifier_efficacy_check
    alias: "DSC Humidifier · Efficacy check → Temp OOS"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_humidifier_demand
        to: "on"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.dsc_humidifier_available
        state: "on"
      - condition: state
        entity_id: switch.dsc_hub_humidifier_demand
        state: "on"
    actions:
      - variables:
          start: "{{ states('input_number.dsc_humidifier_rh_at_start')|float(0) }}"
          now_rh: "{{ states('sensor.dsc_hub_tent_humidity')|float(0) }}"
          delta: "{{ now_rh|float(0) - start|float(0) }}"
          expect: "{{ states('input_number.dsc_humidifier_learned_delta_rh')|float(1) }}"
          floor: "{{ states('input_number.dsc_efficacy_min_delta_rh')|float(0.5) }}"
          need: "{{ [expect|float(1) * 0.35, floor|float(0.5)]|max }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ delta|float(0) < need|float(0.5) }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.dsc_humidifier_temp_oos
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_hub_humidifier_demand
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_humidifier_main_relay
              - action: persistent_notification.create
                data:
                  title: "Humidifier Temp OOS"
                  message: >-
                    On 5+ min; tent RH Δ {{ delta|float(0)|round(1) }}%
                    (need ≥ {{ need|float(0)|round(1) }}%). Empty / off / offline?
                    Cleared only via Clear Temp OOS.
              - action: script.dsc_notify
                data:
                  title: "Humidifier Temp OOS"
                  message: "No RH rise — demand forced off. Check water / power."
          - conditions:
              - condition: template
                value_template: "{{ delta|float(0) >= need|float(0.5) }}"
            sequence:
              - variables:
                  old: "{{ states('input_number.dsc_humidifier_learned_delta_rh')|float(1) }}"
                  ewma: "{{ (0.7 * old|float(1) + 0.3 * delta|float(0))|round(2) }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.dsc_humidifier_learned_delta_rh
                data:
                  value: "{{ [ewma|float(1), 0.3]|max }}"

  - id: dsc_dehumidifier_efficacy_check
    alias: "DSC Dehumidifier · Efficacy check → Temp OOS"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_dehumidifier_demand
        to: "on"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.dsc_dehumidifier_available
        state: "on"
    actions:
      - variables:
          start: "{{ states('input_number.dsc_dehumidifier_rh_at_start')|float(0) }}"
          now_rh: "{{ states('sensor.dsc_hub_tent_humidity')|float(0) }}"
          delta: "{{ start|float(0) - now_rh|float(0) }}"
          expect: "{{ states('input_number.dsc_dehumidifier_learned_delta_rh')|float(1) }}"
          floor: "{{ states('input_number.dsc_efficacy_min_delta_rh')|float(0.5) }}"
          need: "{{ [expect|float(1) * 0.35, floor|float(0.5)]|max }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ delta|float(0) < need|float(0.5) }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.dsc_dehumidifier_temp_oos
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_hub_dehumidifier_demand
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_de_humidifier_main_relay
              - action: persistent_notification.create
                data:
                  title: "Dehumidifier Temp OOS"
                  message: >-
                    On 5+ min; tent RH drop {{ delta|float(0)|round(1) }}%
                    (need ≥ {{ need|float(0)|round(1) }}%). Full tank / off / offline?
              - action: script.dsc_notify
                data:
                  title: "Dehumidifier Temp OOS"
                  message: "No RH drop — demand forced off. Empty tank?"
          - conditions:
              - condition: template
                value_template: "{{ delta|float(0) >= need|float(0.5) }}"
            sequence:
              - variables:
                  old: "{{ states('input_number.dsc_dehumidifier_learned_delta_rh')|float(1) }}"
                  ewma: "{{ (0.7 * old|float(1) + 0.3 * delta|float(0))|round(2) }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.dsc_dehumidifier_learned_delta_rh
                data:
                  value: "{{ [ewma|float(1), 0.3]|max }}"

  - id: dsc_clone_humidifier_efficacy_check
    alias: "DSC Clone Humidifier · Efficacy check → Temp OOS"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.dsc_hub_clone_humidifier_demand
        to: "on"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.dsc_clone_humidifier_available
        state: "on"
    actions:
      - variables:
          start: "{{ states('input_number.dsc_clone_humidifier_rh_at_start')|float(0) }}"
          now_rh: "{{ states('sensor.dsc_hub_clone_humidity')|float(0) }}"
          delta: "{{ now_rh|float(0) - start|float(0) }}"
          expect: "{{ states('input_number.dsc_clone_humidifier_learned_delta_rh')|float(1) }}"
          floor: "{{ states('input_number.dsc_efficacy_min_delta_rh')|float(0.5) }}"
          need: "{{ [expect|float(1) * 0.35, floor|float(0.5)]|max }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ delta|float(0) < need|float(0.5) }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.dsc_clone_humidifier_temp_oos
              - action: switch.turn_off
                target:
                  entity_id: switch.dsc_hub_clone_humidifier_demand
              - action: persistent_notification.create
                data:
                  title: "Clone humidifier Temp OOS"
                  message: "No clone RH rise — demand forced off."
          - conditions:
              - condition: template
                value_template: "{{ delta|float(0) >= need|float(0.5) }}"
            sequence:
              - variables:
                  old: "{{ states('input_number.dsc_clone_humidifier_learned_delta_rh')|float(1) }}"
                  ewma: "{{ (0.7 * old|float(1) + 0.3 * delta|float(0))|round(2) }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.dsc_clone_humidifier_learned_delta_rh
                data:
                  value: "{{ [ewma|float(1), 0.3]|max }}"

  - id: dsc_efficacy_inhibit_demand_while_oos
    alias: "DSC Efficacy · Force demand off while Temp OOS or Lockout"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.dsc_humidifier_temp_oos
          - input_boolean.dsc_humidifier_operator_lockout
          - input_boolean.dsc_dehumidifier_temp_oos
          - input_boolean.dsc_dehumidifier_operator_lockout
          - input_boolean.dsc_clone_humidifier_temp_oos
          - input_boolean.dsc_clone_humidifier_operator_lockout
        to: "on"
      - trigger: state
        entity_id: switch.dsc_hub_humidifier_demand
        to: "on"
      - trigger: state
        entity_id: switch.dsc_hub_dehumidifier_demand
        to: "on"
      - trigger: state
        entity_id: switch.dsc_hub_clone_humidifier_demand
        to: "on"
    actions:
      - if:
          - condition: template
            value_template: "{{ not is_state('binary_sensor.dsc_humidifier_available','on') and is_state('switch.dsc_hub_humidifier_demand','on') }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.dsc_hub_humidifier_demand
      - if:
          - condition: template
            value_template: "{{ not is_state('binary_sensor.dsc_dehumidifier_available','on') and is_state('switch.dsc_hub_dehumidifier_demand','on') }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.dsc_hub_dehumidifier_demand
      - if:
          - condition: template
            value_template: "{{ not is_state('binary_sensor.dsc_clone_humidifier_available','on') and is_state('switch.dsc_hub_clone_humidifier_demand','on') }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.dsc_hub_clone_humidifier_demand

# =====================================================================
# DSC-CORRELATION — Water tester <-> soil probe analysis (v4)
# ---------------------------------------------------------------------
# EC vs tank + 6h uptake slope per pot. Dashboard Root Zone uptake UI.
# Depends on dsc_v4_tank.yaml (sensor.dsc_tank_ec_normalized).
# =====================================================================

template:
  - sensor:
      - name: "DSC-Probe1 EC vs Tank"
        unique_id: dsc_probe1_ec_vs_tank
        unit_of_measurement: "µS/cm"
        state_class: measurement
        icon: mdi:swap-vertical-bold
        state: >
          {% set soil = states('sensor.dsc_probe1_soil_conductivity')|float(none) %}
          {% set tank = states('sensor.dsc_tank_ec_normalized')|float(none) %}
          {{ (soil - tank)|round(0) if soil is not none and tank is not none else none }}

      - name: "DSC-Probe2 EC vs Tank"
        unique_id: dsc_probe2_ec_vs_tank
        unit_of_measurement: "µS/cm"
        state_class: measurement
        icon: mdi:swap-vertical-bold
        state: >
          {% set soil = states('sensor.dsc_probe2_soil_conductivity')|float(none) %}
          {% set tank = states('sensor.dsc_tank_ec_normalized')|float(none) %}
          {{ (soil - tank)|round(0) if soil is not none and tank is not none else none }}

      - name: "DSC-Probe3 EC vs Tank"
        unique_id: dsc_probe3_ec_vs_tank
        unit_of_measurement: "µS/cm"
        state_class: measurement
        icon: mdi:swap-vertical-bold
        state: >
          {% set soil = states('sensor.dsc_probe3_soil_conductivity')|float(none) %}
          {% set tank = states('sensor.dsc_tank_ec_normalized')|float(none) %}
          {{ (soil - tank)|round(0) if soil is not none and tank is not none else none }}

      - name: "DSC-Probe4 EC vs Tank"
        unique_id: dsc_probe4_ec_vs_tank
        unit_of_measurement: "µS/cm"
        state_class: measurement
        icon: mdi:swap-vertical-bold
        state: >
          {% set soil = states('sensor.dsc_probe4_soil_conductivity')|float(none) %}
          {% set tank = states('sensor.dsc_tank_ec_normalized')|float(none) %}
          {{ (soil - tank)|round(0) if soil is not none and tank is not none else none }}

sensor:
  - platform: derivative
    name: "DSC-Probe1 EC Uptake Slope"
    unique_id: dsc_probe1_ec_uptake_slope
    source: sensor.dsc_probe1_soil_conductivity
    time_window: "06:00:00"
    unit_time: h
    round: 1

  - platform: derivative
    name: "DSC-Probe2 EC Uptake Slope"
    unique_id: dsc_probe2_ec_uptake_slope
    source: sensor.dsc_probe2_soil_conductivity
    time_window: "06:00:00"
    unit_time: h
    round: 1

  - platform: derivative
    name: "DSC-Probe3 EC Uptake Slope"
    unique_id: dsc_probe3_ec_uptake_slope
    source: sensor.dsc_probe3_soil_conductivity
    time_window: "06:00:00"
    unit_time: h
    round: 1

  - platform: derivative
    name: "DSC-Probe4 EC Uptake Slope"
    unique_id: dsc_probe4_ec_uptake_slope
    source: sensor.dsc_probe4_soil_conductivity
    time_window: "06:00:00"
    unit_time: h
    round: 1

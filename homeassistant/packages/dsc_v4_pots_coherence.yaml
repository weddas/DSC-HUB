# ==================================================================
#  DSC-HUB v5.1.4 · POT COHERENCE + RELATIVE DRYBACK
#  ------------------------------------------------------------------
#  Learn from fluctuations: dryback from daily peak→now; shared-event
#  coherence when moisture rises together but EC response disagrees.
# ==================================================================

input_number:
  dsc_coherence_moisture_event_pts:
    name: "DSC Coherence Moisture Event Threshold"
    min: 2
    max: 40
    step: 1
    initial: 8
    unit_of_measurement: "%"
    mode: box
  dsc_probe1_learned_ec_per_moisture:
    name: "DSC POT1 Learned ΔEC/Δmoisture"
    min: -200
    max: 200
    step: 0.5
    initial: 0
    mode: box
  dsc_probe2_learned_ec_per_moisture:
    name: "DSC POT2 Learned ΔEC/Δmoisture"
    min: -200
    max: 200
    step: 0.5
    initial: 0
    mode: box
  dsc_probe3_learned_ec_per_moisture:
    name: "DSC POT3 Learned ΔEC/Δmoisture"
    min: -200
    max: 200
    step: 0.5
    initial: 0
    mode: box
  dsc_probe4_learned_ec_per_moisture:
    name: "DSC POT4 Learned ΔEC/Δmoisture"
    min: -200
    max: 200
    step: 0.5
    initial: 0
    mode: box

template:
  - sensor:
      - name: "DSC POT1 Dryback Pct"
        unique_id: dsc_probe1_dryback_pct
        unit_of_measurement: "%"
        icon: mdi:water-minus
        state: >
          {% set peak = states('sensor.dsc_probe1_soil_moisture_daily_max')|float(none) %}
          {% set now = states('sensor.dsc_probe1_got_moisture')|float(none) %}
          {% if now is none %}{% set now = states('sensor.dsc_probe1_soil_moisture')|float(none) %}{% endif %}
          {% set rate = states('sensor.dsc_probe1_soil_moisture_rate')|float(0) %}
          {% if peak is none or now is none or peak <= 0 %}none
          {% elif rate > 0.5 %}0
          {% else %}{{ ((peak - now) / peak * 100)|round(1) }}{% endif %}
        attributes:
          peak: "{{ states('sensor.dsc_probe1_soil_moisture_daily_max') }}"
          note: "Relative points of this probe's own scale (peak today → now)."

      - name: "DSC POT2 Dryback Pct"
        unique_id: dsc_probe2_dryback_pct
        unit_of_measurement: "%"
        icon: mdi:water-minus
        state: >
          {% set peak = states('sensor.dsc_probe2_soil_moisture_daily_max')|float(none) %}
          {% set now = states('sensor.dsc_probe2_got_moisture')|float(none) %}
          {% if now is none %}{% set now = states('sensor.dsc_probe2_soil_moisture')|float(none) %}{% endif %}
          {% set rate = states('sensor.dsc_probe2_soil_moisture_rate')|float(0) %}
          {% if peak is none or now is none or peak <= 0 %}none
          {% elif rate > 0.5 %}0
          {% else %}{{ ((peak - now) / peak * 100)|round(1) }}{% endif %}

      - name: "DSC POT3 Dryback Pct"
        unique_id: dsc_probe3_dryback_pct
        unit_of_measurement: "%"
        icon: mdi:water-minus
        state: >
          {% set peak = states('sensor.dsc_probe3_soil_moisture_daily_max')|float(none) %}
          {% set now = states('sensor.dsc_probe3_got_moisture')|float(none) %}
          {% if now is none %}{% set now = states('sensor.dsc_probe3_soil_moisture')|float(none) %}{% endif %}
          {% set rate = states('sensor.dsc_probe3_soil_moisture_rate')|float(0) %}
          {% if peak is none or now is none or peak <= 0 %}none
          {% elif rate > 0.5 %}0
          {% else %}{{ ((peak - now) / peak * 100)|round(1) }}{% endif %}

      - name: "DSC POT4 Dryback Pct"
        unique_id: dsc_probe4_dryback_pct
        unit_of_measurement: "%"
        icon: mdi:water-minus
        state: >
          {% set peak = states('sensor.dsc_probe4_soil_moisture_daily_max')|float(none) %}
          {% set now = states('sensor.dsc_probe4_got_moisture')|float(none) %}
          {% if now is none %}{% set now = states('sensor.dsc_probe4_soil_moisture')|float(none) %}{% endif %}
          {% set rate = states('sensor.dsc_probe4_soil_moisture_rate')|float(0) %}
          {% if peak is none or now is none or peak <= 0 %}none
          {% elif rate > 0.5 %}0
          {% else %}{{ ((peak - now) / peak * 100)|round(1) }}{% endif %}

      - name: "DSC POT1 Coherence Summary"
        unique_id: dsc_probe1_coherence_summary
        icon: mdi:compare
        state: >
          {% if not is_state('input_boolean.dsc_probe1_in_service','on') %}OOS
          {% elif is_state('binary_sensor.dsc_probe1_coherence_flag','on') %}
            Moisture moved with peers but EC response diverged — check probe/salt/channel
          {% else %}OK — event response within band{% endif %}

      - name: "DSC POT2 Coherence Summary"
        unique_id: dsc_probe2_coherence_summary
        icon: mdi:compare
        state: >
          {% if not is_state('input_boolean.dsc_probe2_in_service','on') %}OOS
          {% elif is_state('binary_sensor.dsc_probe2_coherence_flag','on') %}
            Moisture moved with peers but EC response diverged — check probe/salt/channel
          {% else %}OK — event response within band{% endif %}

      - name: "DSC POT3 Coherence Summary"
        unique_id: dsc_probe3_coherence_summary
        icon: mdi:compare
        state: >
          {% if not is_state('input_boolean.dsc_probe3_in_service','on') %}OOS
          {% elif is_state('binary_sensor.dsc_probe3_coherence_flag','on') %}
            Moisture moved with peers but EC response diverged — check probe/salt/channel
          {% else %}OK — event response within band{% endif %}

      - name: "DSC POT4 Coherence Summary"
        unique_id: dsc_probe4_coherence_summary
        icon: mdi:compare
        state: >
          {% if not is_state('input_boolean.dsc_probe4_in_service','on') %}OOS
          {% elif is_state('binary_sensor.dsc_probe4_coherence_flag','on') %}
            Moisture moved with peers but EC response diverged — check probe/salt/channel
          {% else %}OK — event response within band{% endif %}

  - binary_sensor:
      - name: "DSC POT1 Coherence Flag"
        unique_id: dsc_probe1_coherence_flag
        icon: mdi:alert-decagram
        delay_on:
          minutes: 10
        state: >
          {% if not is_state('input_boolean.dsc_probe1_in_service','on') %}false
          {% else %}
          {% set thr = states('input_number.dsc_coherence_moisture_event_pts')|float(8) %}
          {% set m1 = states('sensor.dsc_probe1_soil_moisture_rate')|float(0) %}
          {% set peers = [] %}
          {% for n in [2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peers = peers + [states('sensor.dsc_pot' ~ n ~ '_soil_moisture_rate')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set peer_up = peers|select('>=', thr / 6)|list|length %}
          {% set me_up = m1 >= (thr / 6) %}
          {% set ec1 = states('sensor.dsc_probe1_ec_uptake_slope')|float(0) %}
          {% set learned = states('input_number.dsc_probe1_learned_ec_per_moisture')|float(0) %}
          {% set peer_ec = namespace(v=[]) %}
          {% for n in [2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peer_ec.v = peer_ec.v + [states('sensor.dsc_pot' ~ n ~ '_ec_uptake_slope')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set med_ec = (peer_ec.v|sort)[((peer_ec.v|length)-1)//2] if peer_ec.v|length else 0 %}
          {{ me_up and peer_up >= 1 and ((med_ec > 5 and ec1 < med_ec * 0.25) or (learned != 0 and m1 > 0 and (ec1 / m1) < learned * 0.3)) }}
          {% endif %}

      - name: "DSC POT2 Coherence Flag"
        unique_id: dsc_probe2_coherence_flag
        icon: mdi:alert-decagram
        delay_on:
          minutes: 10
        state: >
          {% if not is_state('input_boolean.dsc_probe2_in_service','on') %}false
          {% else %}
          {% set thr = states('input_number.dsc_coherence_moisture_event_pts')|float(8) %}
          {% set m2 = states('sensor.dsc_probe2_soil_moisture_rate')|float(0) %}
          {% set peers = [] %}
          {% for n in [1,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peers = peers + [states('sensor.dsc_pot' ~ n ~ '_soil_moisture_rate')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set peer_up = peers|select('>=', thr / 6)|list|length %}
          {% set me_up = m2 >= (thr / 6) %}
          {% set ec2 = states('sensor.dsc_probe2_ec_uptake_slope')|float(0) %}
          {% set peer_ec = namespace(v=[]) %}
          {% for n in [1,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peer_ec.v = peer_ec.v + [states('sensor.dsc_pot' ~ n ~ '_ec_uptake_slope')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set med_ec = (peer_ec.v|sort)[((peer_ec.v|length)-1)//2] if peer_ec.v|length else 0 %}
          {{ me_up and peer_up >= 1 and med_ec > 5 and ec2 < med_ec * 0.25 }}
          {% endif %}

      - name: "DSC POT3 Coherence Flag"
        unique_id: dsc_probe3_coherence_flag
        icon: mdi:alert-decagram
        delay_on:
          minutes: 10
        state: >
          {% if not is_state('input_boolean.dsc_probe3_in_service','on') %}false
          {% else %}
          {% set thr = states('input_number.dsc_coherence_moisture_event_pts')|float(8) %}
          {% set m3 = states('sensor.dsc_probe3_soil_moisture_rate')|float(0) %}
          {% set peers = [] %}
          {% for n in [1,2,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peers = peers + [states('sensor.dsc_pot' ~ n ~ '_soil_moisture_rate')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set peer_up = peers|select('>=', thr / 6)|list|length %}
          {% set me_up = m3 >= (thr / 6) %}
          {% set ec3 = states('sensor.dsc_probe3_ec_uptake_slope')|float(0) %}
          {% set peer_ec = namespace(v=[]) %}
          {% for n in [1,2,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peer_ec.v = peer_ec.v + [states('sensor.dsc_pot' ~ n ~ '_ec_uptake_slope')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set med_ec = (peer_ec.v|sort)[((peer_ec.v|length)-1)//2] if peer_ec.v|length else 0 %}
          {{ me_up and peer_up >= 1 and med_ec > 5 and ec3 < med_ec * 0.25 }}
          {% endif %}

      - name: "DSC POT4 Coherence Flag"
        unique_id: dsc_probe4_coherence_flag
        icon: mdi:alert-decagram
        delay_on:
          minutes: 10
        state: >
          {% if not is_state('input_boolean.dsc_probe4_in_service','on') %}false
          {% else %}
          {% set thr = states('input_number.dsc_coherence_moisture_event_pts')|float(8) %}
          {% set m4 = states('sensor.dsc_probe4_soil_moisture_rate')|float(0) %}
          {% set peers = [] %}
          {% for n in [1,2,3] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peers = peers + [states('sensor.dsc_pot' ~ n ~ '_soil_moisture_rate')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set peer_up = peers|select('>=', thr / 6)|list|length %}
          {% set me_up = m4 >= (thr / 6) %}
          {% set ec4 = states('sensor.dsc_probe4_ec_uptake_slope')|float(0) %}
          {% set peer_ec = namespace(v=[]) %}
          {% for n in [1,2,3] %}
            {% if is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on') %}
              {% set peer_ec.v = peer_ec.v + [states('sensor.dsc_pot' ~ n ~ '_ec_uptake_slope')|float(0)] %}
            {% endif %}
          {% endfor %}
          {% set med_ec = (peer_ec.v|sort)[((peer_ec.v|length)-1)//2] if peer_ec.v|length else 0 %}
          {{ me_up and peer_up >= 1 and med_ec > 5 and ec4 < med_ec * 0.25 }}
          {% endif %}

  - sensor:
      # N-015: fleet multi-feature coherence score (0–100)
      - name: "DSC Fleet Coherence Score"
        unique_id: dsc_fleet_coherence_score
        unit_of_measurement: "%"
        icon: mdi:chart-timeline-variant
        state: >
          {% set ns = namespace(ok=0, n=0, flags=0) %}
          {% for i in [1,2,3,4] %}
            {% if is_state('input_boolean.dsc_pot' ~ i ~ '_in_service','on') %}
              {% set ns.n = ns.n + 1 %}
              {% if not is_state('binary_sensor.dsc_pot' ~ i ~ '_coherence_flag','on') %}
                {% set ns.ok = ns.ok + 1 %}
              {% else %}{% set ns.flags = ns.flags + 1 %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.n == 0 %}none
          {% else %}{{ ((ns.ok / ns.n) * 100)|round(0) }}{% endif %}
        attributes:
          moisture_ec_band: >-
            {% set ns = namespace(vals=[]) %}
            {% for i in [1,2,3,4] %}
              {% if is_state('input_boolean.dsc_pot' ~ i ~ '_in_service','on') %}
                {% set ns.vals = ns.vals + [states('input_number.dsc_pot' ~ i ~ '_learned_ec_per_moisture')|float(0)] %}
              {% endif %}
            {% endfor %}
            {% if ns.vals|length < 2 %}n/a
            {% else %}
              {{ (ns.vals|min)|round(1) }}…{{ (ns.vals|max)|round(1) }} ΔEC/ΔM
            {% endif %}

automation:
  - id: dsc_pots_learn_ec_moisture_ratio
    alias: "DSC Pots · Learn ΔEC/Δmoisture after coherent rise"
    mode: queued
    max: 4
    triggers:
      - trigger: numeric_state
        entity_id: sensor.dsc_probe1_soil_moisture_rate
        above: 1.5
        for: "00:15:00"
      - trigger: numeric_state
        entity_id: sensor.dsc_probe2_soil_moisture_rate
        above: 1.5
        for: "00:15:00"
      - trigger: numeric_state
        entity_id: sensor.dsc_probe3_soil_moisture_rate
        above: 1.5
        for: "00:15:00"
      - trigger: numeric_state
        entity_id: sensor.dsc_probe4_soil_moisture_rate
        above: 1.5
        for: "00:15:00"
    conditions:
      - condition: template
        value_template: >
          {% set e = trigger.entity_id %}
          {% set n = e.split('_')[1].replace('pot','') %}
          {{ is_state('input_boolean.dsc_pot' ~ n ~ '_in_service','on')
             and not is_state('binary_sensor.dsc_pot' ~ n ~ '_coherence_flag','on') }}
    actions:
      - variables:
          n: "{{ trigger.entity_id.split('_')[1].replace('pot','') }}"
          mrate: "{{ states('sensor.dsc_pot' ~ n ~ '_soil_moisture_rate')|float(0) }}"
          erate: "{{ states('sensor.dsc_pot' ~ n ~ '_ec_uptake_slope')|float(0) }}"
          old: "{{ states('input_number.dsc_pot' ~ n ~ '_learned_ec_per_moisture')|float(0) }}"
          ratio: "{{ (erate / mrate) if mrate|float(0) > 0.2 else 0 }}"
          ewma: "{{ (0.7 * old|float(0) + 0.3 * ratio|float(0))|round(2) }}"
      - condition: template
        value_template: "{{ mrate|float(0) > 0.2 }}"
      - action: input_number.set_value
        target:
          entity_id: "input_number.dsc_pot{{ n }}_learned_ec_per_moisture"
        data:
          value: "{{ ewma }}"

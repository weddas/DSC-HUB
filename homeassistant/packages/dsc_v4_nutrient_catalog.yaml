    max: 64
    initial: "CalMag"
  dsc_nutrient_4_name:
    name: "DSC Nutrient 4 Name"
    max: 64
    initial: "Bloom Booster"
  dsc_nutrient_5_name:
    name: "DSC Nutrient 5 Name"
    max: 64
    initial: ""
  dsc_nutrient_6_name:
    name: "DSC Nutrient 6 Name"
    max: 64
    initial: ""
  dsc_nutrient_7_name:

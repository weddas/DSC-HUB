input_select:
  dsc_mix_target_pot:
    name: "DSC Mix Target Pot"
    icon: mdi:flower
    options:
      - "Fleet"
      - "POT1"
      - "POT2"
      - "POT3"
      - "POT4"
    initial: "Fleet"

template:
  - sensor:
      - name: "DSC Next Mix Recipe"
        unique_id: dsc_next_mix_recipe
        icon: mdi:beaker-plus
        state: >
          {% set L = states('input_number.dsc_mix_tank_liters')|float(20) %}
          {% set str = states('input_number.dsc_mix_strength_pct')|float(100) / 100 %}
          {% set lines = [] %}
          {% for n in range(1,9) %}
            {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
            {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
            {% set inv = is_state('input_boolean.dsc_nutrient_' ~ n ~ '_in_inventory','on') %}
            {% if name and dose > 0 and inv %}
              {% set ml = (dose * L * str)|round(1) %}
              {% set lines = lines + [name ~ ': ' ~ ml ~ ' ml'] %}
            {% endif %}
          {% endfor %}
          {{ lines|join(' · ') if lines else 'No in-stock doses' }}
        attributes:
          tank_l: "{{ states('input_number.dsc_mix_tank_liters') }}"
          strength_pct: "{{ states('input_number.dsc_mix_strength_pct') }}"
          target: "{{ states('input_select.dsc_mix_target_pot') }}"

      - name: "DSC Mix Purchase List"
        unique_id: dsc_mix_purchase_list
        icon: mdi:cart
        state: >
          {% set L = states('input_number.dsc_mix_tank_liters')|float(20) %}
          {% set str = states('input_number.dsc_mix_strength_pct')|float(100) / 100 %}
          {% set need = [] %}
          {% for n in range(1,9) %}
            {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
            {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
            {% set stock = states('input_number.dsc_nutrient_' ~ n ~ '_stock_ml')|float(0) %}
            {% set inv = is_state('input_boolean.dsc_nutrient_' ~ n ~ '_in_inventory','on') %}
            {% set ml = dose * L * str %}
            {% if name and dose > 0 and (not inv or stock < ml) %}
              {% set need = need + [name ~ ' (need ~' ~ ml|round(0) ~ ' ml)'] %}
            {% endif %}
          {% endfor %}
          {{ need|join(', ') if need else 'Stock covers next mix' }}

      - name: "DSC Nutrient Stock Summary"
        unique_id: dsc_nutrient_stock_summary
        icon: mdi:warehouse
        state: >
          {% set lines = [] %}
          {% for n in range(1,9) %}
            {% if is_state('input_boolean.dsc_nutrient_' ~ n ~ '_in_inventory','on') %}
              {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
              {% set stock = states('input_number.dsc_nutrient_' ~ n ~ '_stock_ml')|float(0) %}
              {% if name %}{% set lines = lines + [name ~ '=' ~ stock|round(0) ~ 'ml'] %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ lines|join(' · ') if lines else 'Empty stock room' }}

      - name: "DSC Nutrient Consumption Today"
        unique_id: dsc_nutrient_consumption_today
        icon: mdi:bottle-tonic
        state: "{{ states('sensor.dsc_last_accepted_mix_ml')|float(0) }}"
        unit_of_measurement: "ml"
        attributes:
          note: "Last Accept mix total ml burned (relative book stock)."

      - name: "DSC Last Accepted Mix ml"
        unique_id: dsc_last_accepted_mix_ml
        unit_of_measurement: "ml"
        state: "{{ states('input_number.dsc_last_accepted_mix_ml')|float(0) }}"

script:
  dsc_mix_apply_recipe_pack:
    alias: "DSC Mix · Apply CANNA Coco A+B recipe"
    description: "Load CANNA Coco A/B into nutrient slots 1–2 at the selected stage dose."
    mode: restart
    fields:
      stage:
        name: Stage
        description: "CANNA Coco A+B dose stage"
        required: true
        selector:
          select:
            options:
              - seedling
              - veg
              - flower
    sequence:
      - variables:
          selected_stage: "{{ stage|string|lower|trim }}"
          dose: >-
            {{ 2.0 if selected_stage == 'seedling'
               else 3.0 if selected_stage == 'veg'
               else 4.0 if selected_stage == 'flower'
               else 0 }}
      - condition: template
        value_template: "{{ selected_stage in ['seedling', 'veg', 'flower'] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.dsc_nutrient_1_name
        data:
          value: "CANNA Coco A"
      - action: input_text.set_value
        target:
          entity_id: input_text.dsc_nutrient_2_name
        data:
          value: "CANNA Coco B"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dsc_nutrient_1_dose_ml_l
            - input_number.dsc_nutrient_2_dose_ml_l
        data:
          value: "{{ dose }}"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dsc_nutrient_1_in_inventory
            - input_boolean.dsc_nutrient_2_in_inventory
      - action: persistent_notification.create
        data:
          title: "Mix recipe applied"
          message: "CANNA Coco A+B · {{ selected_stage }} · {{ dose }} ml/L each."

  dsc_accept_mix:
    alias: "DSC Accept Mix (QA)"
    description: "Burn covered recipe ml from in-stock nutrients; warn and skip short-stock lines. Manual QA gate — no pumps."
    mode: single
    sequence:
      - variables:
          L: "{{ states('input_number.dsc_mix_tank_liters')|float(20) }}"
          strength: "{{ states('input_number.dsc_mix_strength_pct')|float(100) / 100 }}"
          short_stock: >-
            {% set ns = namespace(lines=[]) %}
            {% for n in range(1,9) %}
              {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
              {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
              {% set stock = states('input_number.dsc_nutrient_' ~ n ~ '_stock_ml')|float(0) %}
              {% set inv = is_state('input_boolean.dsc_nutrient_' ~ n ~ '_in_inventory','on') %}
              {% set need = (dose * L * strength)|round(1) %}
              {% if name and dose > 0 and inv and stock < need %}
                {% set ns.lines = ns.lines + [name ~ ' (stock ' ~ stock|round(1) ~ ' ml, need ' ~ need ~ ' ml)'] %}
              {% endif %}
            {% endfor %}
            {{ ns.lines|join(', ') }}
          burn_total: >-
            {% set ns = namespace(total=0) %}
            {% for n in range(1,9) %}
              {% set name = states('input_text.dsc_nutrient_' ~ n ~ '_name')|trim %}
              {% set dose = states('input_number.dsc_nutrient_' ~ n ~ '_dose_ml_l')|float(0) %}
              {% set stock = states('input_number.dsc_nutrient_' ~ n ~ '_stock_ml')|float(0) %}
              {% set inv = is_state('input_boolean.dsc_nutrient_' ~ n ~ '_in_inventory','on') %}
              {% set need = (dose * L * strength)|round(1) %}
              {% if name and dose > 0 and inv and stock >= need %}
                {% set ns.total = ns.total + need %}
              {% endif %}
            {% endfor %}
            {{ ns.total|round(1) }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ short_stock|trim != '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Mix short stock"
                  message: >-
                    Skipped understocked lines: {{ short_stock }}.
                    Covered in-inventory lines will still be burned.
      - repeat:
          for_each:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
          sequence:
            - variables:
                n: "{{ repeat.item }}"
                name: "{{ states('input_text.dsc_nutrient_' ~ repeat.item ~ '_name')|trim }}"
                dose: "{{ states('input_number.dsc_nutrient_' ~ repeat.item ~ '_dose_ml_l')|float(0) }}"
                stock: "{{ states('input_number.dsc_nutrient_' ~ repeat.item ~ '_stock_ml')|float(0) }}"
                inv: "{{ is_state('input_boolean.dsc_nutrient_' ~ repeat.item ~ '_in_inventory','on') }}"
                need: "{{ (dose * L * strength)|round(1) }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ name != '' and dose|float(0) > 0 and inv
                           and stock|float(0) >= need|float(0) }}
                  sequence:
                    - action: input_number.set_value
                      target:
                        entity_id: "input_number.dsc_nutrient_{{ repeat.item }}_stock_ml"
                      data:
                        value: "{{ (stock|float(0) - need|float(0))|round(1) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.dsc_last_accepted_mix_ml
        data:
          value: "{{ burn_total|float(0)|round(1) }}"
      - action: persistent_notification.create
        data:
          title: "Mix accepted"
          message: >-
            Burned {{ burn_total|float(0)|round(1) }} ml total from covered stock for
            {{ states('input_number.dsc_mix_tank_liters') }} L @
            {{ states('input_number.dsc_mix_strength_pct') }}%.
            {% if short_stock|trim %}Skipped: {{ short_stock }}.{% endif %}
            Recipe: {{ states('sensor.dsc_next_mix_recipe') }}
      - action: logbook.log
        data:
          name: DSC Accept Mix
          message: "Accepted mix — {{ burn_total|float(0)|round(1) }} ml burned{{ '; skipped ' ~ short_stock if short_stock|trim else '' }}"
          entity_id: sensor.dsc_next_mix_recipe

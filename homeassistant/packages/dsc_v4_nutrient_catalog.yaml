  dsc_nutrient_1_in_inventory:
    name: "DSC Nutrient 1 In Inventory"
    initial: true
  dsc_nutrient_2_in_inventory:
    name: "DSC Nutrient 2 In Inventory"
    initial: true
  dsc_nutrient_3_in_inventory:
    name: "DSC Nutrient 3 In Inventory"
    initial: true
  dsc_nutrient_4_in_inventory:
    name: "DSC Nutrient 4 In Inventory"
    initial: true
  dsc_nutrient_5_in_inventory:
    name: "DSC Nutrient 5 In Inventory"
    initial: false
  dsc_nutrient_6_in_inventory:
    name: "DSC Nutrient 6 In Inventory"
    initial: false
  dsc_nutrient_7_in_inventory:
    name: "DSC Nutrient 7 In Inventory"
    initial: false

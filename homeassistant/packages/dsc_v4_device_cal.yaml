      - service: input_number.set_value
        target:
          entity_id:
            - input_number.dsc_cal_cfm_intake_clone_25
            - input_number.dsc_cal_cfm_intake_clone_50
            - input_number.dsc_cal_cfm_intake_clone_75
            - input_number.dsc_cal_cfm_intake_clone_100
        data: { value: 0 }

  dsc_cal_reset_curve_sf1000:

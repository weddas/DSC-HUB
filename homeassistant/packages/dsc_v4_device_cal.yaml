        target:
          entity_id:
            - input_number.dsc_cal_cfm_intake_main_25
            - input_number.dsc_cal_cfm_intake_main_50
            - input_number.dsc_cal_cfm_intake_main_75
            - input_number.dsc_cal_cfm_intake_main_100
        data: { value: 0 }


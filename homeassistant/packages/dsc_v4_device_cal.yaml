            - input_number.dsc_cal_cfm_recirc_25
            - input_number.dsc_cal_cfm_recirc_50
            - input_number.dsc_cal_cfm_recirc_75
            - input_number.dsc_cal_cfm_recirc_100
        data: { value: 0 }

  dsc_cal_reset_curve_intake_main:

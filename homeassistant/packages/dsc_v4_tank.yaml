# =====================================================================
# DSC-TANK — Nutrient tank (Water Tester, Xtend Tuya) · v4 package
# ---------------------------------------------------------------------
# Live helper brought into git. EC normalized to µS/cm via multiplier.
# Delete any older tank EC helpers with the same unique_ids first.
# Pump / level / in-service dummies: dsc_v4_tank_dummies.yaml (1:1 map when firmware exists).
# =====================================================================

input_select:
  dsc_tank_stage:
    name: "DSC Tank — Feed Stage"
    icon: mdi:calendar-clock
    options:
      - "Seedling"
      - "Early Veg"
      - "Late Veg"
      - "Transition"
      - "Peak Flower"
      - "Late Flower"
      - "Flush"

  dsc_tank_plant_type:
    name: "DSC Tank — Plant Type"
    icon: mdi:dna
    options:
      - "Photoperiod"
      - "Autoflower"

input_number:
  dsc_tank_ec_multiplier:
    name: "DSC Tank — EC unit multiplier"
    icon: mdi:swap-vertical
    min: 1
    max: 1000
    step: 999      # effectively a 1 <-> 1000 toggle
    initial: 1
  dsc_tank_ec_bias:
    name: "DSC Tank — EC bias (µS/cm)"
    icon: mdi:plus-minus-variant
    min: -2000
    max: 2000
    step: 1
    initial: 0
    unit_of_measurement: "µS/cm"
    mode: box
  dsc_tank_ph_bias:
    name: "DSC Tank — pH bias"
    icon: mdi:plus-minus-variant
    min: -2
    max: 2
    step: 0.01
    initial: 0
    mode: box

template:
  - sensor:
      # Single source of truth for tank EC in µS/cm (multiplier then bias)
      - name: "DSC Tank EC Normalized"
        unique_id: dsc_tank_ec_normalized
        unit_of_measurement: "µS/cm"
        state_class: measurement
        icon: mdi:flash
        state: >
          {% set v = states('sensor.water_tester_ec_current')|float(none) %}
          {% set m = states('input_number.dsc_tank_ec_multiplier')|float(1) %}
          {% set b = states('input_number.dsc_tank_ec_bias')|float(0) %}
          {{ ((v * m) + b)|round(0) if v is not none else none }}

      - name: "DSC Tank pH Calibrated"
        unique_id: dsc_tank_ph_calibrated
        unit_of_measurement: "pH"
        state_class: measurement
        icon: mdi:ph
        state: >
          {% set v = states('sensor.water_tester_ph_current')|float(none) %}
          {% set b = states('input_number.dsc_tank_ph_bias')|float(0) %}
          {{ (v + b)|round(2) if v is not none else none }}

      # Stage/type -> EC band (µS/cm). Photo vs Auto maps from Table A.
      - name: "DSC Tank EC Target Min"
        unique_id: dsc_tank_ec_target_min
        unit_of_measurement: "µS/cm"
        icon: mdi:arrow-collapse-down
        state: >
          {% set s = states('input_select.dsc_tank_stage') %}
          {% set auto = states('input_select.dsc_tank_plant_type') == 'Autoflower' %}
          {% set photo = {'Seedling':400,'Early Veg':800,'Late Veg':1300,'Transition':1600,'Peak Flower':1800,'Late Flower':1200,'Flush':0} %}
          {% set autos = {'Seedling':300,'Early Veg':600,'Late Veg':1000,'Transition':1300,'Peak Flower':1400,'Late Flower':1000,'Flush':0} %}
          {{ (autos if auto else photo).get(s, 800) }}

      - name: "DSC Tank EC Target Max"
        unique_id: dsc_tank_ec_target_max
        unit_of_measurement: "µS/cm"
        icon: mdi:arrow-collapse-up
        state: >
          {% set s = states('input_select.dsc_tank_stage') %}
          {% set auto = states('input_select.dsc_tank_plant_type') == 'Autoflower' %}
          {% set photo = {'Seedling':800,'Early Veg':1300,'Late Veg':1800,'Transition':2000,'Peak Flower':2400,'Late Flower':1600,'Flush':400} %}
          {% set autos = {'Seedling':600,'Early Veg':1000,'Late Veg':1400,'Transition':1600,'Peak Flower':1800,'Late Flower':1400,'Flush':400} %}
          {{ (autos if auto else photo).get(s, 1300) }}

  - binary_sensor:
      - name: "DSC Tank EC Out of Range"
        unique_id: dsc_tank_ec_out_of_range
        icon: mdi:flash-alert
        delay_on:
          minutes: 15
        state: >
          {% set v = states('sensor.dsc_tank_ec_normalized')|float(none) %}
          {% set lo = states('sensor.dsc_tank_ec_target_min')|float(0) %}
          {% set hi = states('sensor.dsc_tank_ec_target_max')|float(9999) %}
          {{ v is not none and (v < lo or v > hi) }}

      # Feed-water pH for soil grows: 6.2-6.8 target, alarm outside 6.0-7.0
      - name: "DSC Tank pH Out of Range"
        unique_id: dsc_tank_ph_out_of_range
        icon: mdi:ph
        delay_on:
          minutes: 15
        state: >
          {% set v = states('sensor.dsc_tank_ph_calibrated')|float(none) %}
          {% if v is none %}{% set v = states('sensor.water_tester_ph_current')|float(none) %}{% endif %}
          {{ v is not none and (v < 6.0 or v > 7.0) }}

      # >24C = dissolved O2 drops, Pythium risk climbs. Most valuable
      # tank alert there is.
      - name: "DSC Tank Water Too Warm"
        unique_id: dsc_tank_water_too_warm
        icon: mdi:thermometer-water
        delay_on:
          minutes: 15
        state: >
          {% set v = states('sensor.water_tester_temperature')|float(none) %}
          {{ v is not none and v > 24.0 }}

automation:
  # Push stage-appropriate thresholds into the Tuya device's own
  # warn numbers so its native alarms match HA. Re-syncs on HA start.
  - id: dsc_tank_sync_warn_numbers
    alias: "DSC Tank — Sync Tuya warn thresholds to feed stage"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_select.dsc_tank_stage
          - input_select.dsc_tank_plant_type
      - platform: homeassistant
        event: start
    action:
      - service: number.set_value
        target:
          entity_id: number.water_tester_ec_warn_min
        data:
          value: >
            {{ (states('sensor.dsc_tank_ec_target_min')|float(800)
                / states('input_number.dsc_tank_ec_multiplier')|float(1)) | round(1) }}
      - service: number.set_value
        target:
          entity_id: number.water_tester_ec_warn_max
        data:
          value: >
            {{ (states('sensor.dsc_tank_ec_target_max')|float(1300)
                / states('input_number.dsc_tank_ec_multiplier')|float(1)) | round(1) }}
      - service: number.set_value
        target:
          entity_id: number.water_tester_ph_warn_min
        data:
          value: 6.0
      - service: number.set_value
        target:
          entity_id: number.water_tester_ph_warn_max
        data:
          value: 7.0
      - service: number.set_value
        target:
          entity_id: number.water_tester_temp_warn_min
        data:
          value: 16
      - service: number.set_value
        target:
          entity_id: number.water_tester_temp_warn_max
        data:
          value: 24

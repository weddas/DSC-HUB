# ==================================================================
#  DSC-HUB v5.1 · NOTIFY TARGET
#  ------------------------------------------------------------------
#  Edit input_text.dsc_notify_service to your mobile notify entity, e.g.
#    notify.mobile_app_your_phone
#  Default uses persistent_notification so fresh installs are never silent.
# ==================================================================

input_text:
  dsc_notify_service:
    name: "DSC Notify Service"
    icon: mdi:bell-badge
    initial: "notify.persistent_notification"
    max: 120

script:
  dsc_notify:
    alias: "DSC Notify"
    icon: mdi:bell
    mode: queued
    max: 10
    fields:
      title:
        description: Notification title
        example: DSC alert
      message:
        description: Notification body
        example: Something happened
    sequence:
      - variables:
          svc: "{{ states('input_text.dsc_notify_service')|trim }}"
          ttl: "{{ title | default('DSC-HUB') }}"
          msg: "{{ message | default('') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ svc in ['', 'unknown', 'unavailable'] }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "{{ ttl }}"
                  message: "{{ msg }}"
                  notification_id: dsc_notify_fallback
          - conditions:
              - condition: template
                value_template: "{{ svc == 'notify.persistent_notification' or svc == 'persistent_notification.create' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "{{ ttl }}"
                  message: "{{ msg }}"
                  notification_id: "dsc_{{ ttl|slugify }}"
        default:
          - action: "{{ svc }}"
            data:
              title: "{{ ttl }}"
              message: "{{ msg }}"

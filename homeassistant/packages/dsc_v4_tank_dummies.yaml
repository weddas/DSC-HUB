# =====================================================================
# DSC-TANK dummy helpers — pump / level / in-service until firmware maps
# ---------------------------------------------------------------------
# Bound by Fleet TankCutaway. Do not invent EC/pH here — those stay on
# dsc_v4_tank.yaml tester sensors. Missing level = dashed empty, not a
# half-full guess.
#
# Firmware 1:1 map when DSC-Tank ships:
#   input_boolean.dsc_tank_pump_active  <- binary_sensor.dsc_tank_pump
#   input_number.dsc_tank_pump_on_time  <- sensor.dsc_tank_pump_on_time  (s)
#   input_number.dsc_tank_level_pct     <- sensor.dsc_tank_level_pct
#   input_boolean.dsc_tank_in_service   <- stay operator gate (or firmware ready)
# =====================================================================

input_boolean:
  dsc_tank_in_service:
    name: "DSC Tank — in service"
    icon: mdi:water-check
    initial: false
  dsc_tank_pump_active:
    name: "DSC Tank — pump (dummy until firmware)"
    icon: mdi:pump
    initial: false

input_number:
  dsc_tank_level_pct:
    name: "DSC Tank — level % (dummy until firmware)"
    icon: mdi:hydraulic-oil-level
    min: 0
    max: 100
    step: 1
    initial: 0
    unit_of_measurement: "%"
    mode: box
  dsc_tank_pump_on_time:
    name: "DSC Tank — pump on-time (dummy, seconds)"
    icon: mdi:timer-outline
    min: 0
    max: 86400
    step: 1
    initial: 0
    unit_of_measurement: "s"
    mode: box

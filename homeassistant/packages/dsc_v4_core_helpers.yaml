# ==================================================================
#  DSC-HUB v4 · CORE DASHBOARD HELPERS
#  ------------------------------------------------------------------
#  Phase-0 / Dashboard-v3 support: hub-link alias, fan %, airflow
#  Sankey nodes, photoperiod, leaf offset, appliance runtimes/cycles,
#  transfer-function deltas. Tank + pot packages are separate files.
#
#  Source: dsc_dashboard_v3.yaml (live) merged with v4 Sankey topology
#  the Lovelace dashboard actually wires (direct_room / room_return).
# ==================================================================

input_boolean:
  dsc_event_log:
    name: DSC Event Log
    icon: mdi:notebook-outline
  dsc_fan_test_voice:
    name: DSC Fan Test Voice
    icon: mdi:microphone-message
    initial: false

input_number:
  dsc_leaf_offset:
    name: DSC Leaf Temperature Offset
    icon: mdi:leaf-maple
    min: 0
    max: 5
    step: 0.1
    initial: 2
    unit_of_measurement: "°C"
    mode: box

sensor:
  - platform: history_stats
    name: "DSC Heater Runtime Today"
    unique_id: dsc_heater_runtime_today
    entity_id: switch.dsc_hub_heater_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC AC Runtime Today"
    unique_id: dsc_ac_runtime_today
    entity_id: switch.dsc_hub_ac_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Humidifier Runtime Today"
    unique_id: dsc_humidifier_runtime_today
    entity_id: switch.dsc_hub_humidifier_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Dehumidifier Runtime Today"
    unique_id: dsc_dehumidifier_runtime_today
    entity_id: switch.dsc_hub_dehumidifier_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Grow Mat Runtime Today"
    unique_id: dsc_growmat_runtime_today
    entity_id: switch.dsc_hub_grow_mat_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Heater Cycles Today"
    unique_id: dsc_heater_cycles_today
    entity_id: switch.dsc_hub_heater_demand
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Humidifier Cycles Today"
    unique_id: dsc_humidifier_cycles_today
    entity_id: switch.dsc_hub_humidifier_demand
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Humidifier Cycles Last Hour"
    unique_id: dsc_humidifier_cycles_last_hour
    entity_id: switch.dsc_hub_humidifier_demand
    state: "on"
    type: count
    start: "{{ now() - timedelta(hours=1) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Clone Humidifier Cycles Last Hour"
    unique_id: dsc_clone_humidifier_cycles_last_hour
    entity_id: switch.dsc_hub_clone_humidifier_demand
    state: "on"
    type: count
    start: "{{ now() - timedelta(hours=1) }}"
    end: "{{ now() }}"

template:
  - binary_sensor:
      - name: "DSC Hub Link"
        unique_id: dsc_hub_link
        device_class: connectivity
        icon: mdi:lan-connect
        state: "{{ is_state('binary_sensor.dsc_hub_ha_link_status', 'on') }}"
        availability: "{{ has_value('binary_sensor.dsc_hub_ha_link_status') }}"

  - sensor:
      - name: "DSC Fan Intake Main Pct"
        unique_id: dsc_fan_intake_main_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan
        state: >
          {% set e = 'fan.dsc_hub_4_inch_intake_fan_main' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_4_inch_intake_fan_main') }}"

      - name: "DSC Fan Intake 2x4 Pct"
        unique_id: dsc_fan_intake_2x4_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan
        state: >
          {% set e = 'fan.dsc_hub_4_inch_intake_fan_2x4' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_4_inch_intake_fan_2x4') }}"

      - name: "DSC Fan Exhaust Room Pct"
        unique_id: dsc_fan_exhaust_room_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan-chevron-up
        state: >
          {% set e = 'fan.dsc_hub_6_inch_exhaust_room' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_6_inch_exhaust_room') }}"

      - name: "DSC Fan Exhaust Outside Pct"
        unique_id: dsc_fan_exhaust_outside_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan-chevron-up
        state: >
          {% set e = 'fan.dsc_hub_6_inch_exhaust_outside' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_6_inch_exhaust_outside') }}"

      # Sankey topology used by dsc-hub-v4-dashboard.yaml
      - name: "DSC Airflow Room Supply"
        unique_id: dsc_airflow_room_supply
        unit_of_measurement: "flux"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {{ (states('sensor.dsc_fan_intake_main_pct') | float(0)
              + states('sensor.dsc_fan_intake_2x4_pct') | float(0)) * 10 }}

      - name: "DSC Airflow Reservoir Net"
        unique_id: dsc_airflow_reservoir_net
        unit_of_measurement: "flux"
        state_class: measurement
        icon: mdi:weather-windy
        state: "{{ (states('sensor.dsc_fan_intake_2x4_pct') | float(0)) * 10 }}"

      - name: "DSC Airflow Direct Room"
        unique_id: dsc_airflow_direct_room
        unit_of_measurement: "flux"
        state_class: measurement
        icon: mdi:weather-windy
        state: "{{ (states('sensor.dsc_fan_intake_main_pct') | float(0)) * 10 }}"

      - name: "DSC Airflow Main Load"
        unique_id: dsc_airflow_main_load
        unit_of_measurement: "flux"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {{ (states('sensor.dsc_fan_intake_main_pct') | float(0)
              + states('sensor.dsc_fan_intake_2x4_pct') | float(0)) * 10 }}

      - name: "DSC Airflow Exhaust Out"
        unique_id: dsc_airflow_exhaust_out
        unit_of_measurement: "flux"
        state_class: measurement
        icon: mdi:weather-windy
        state: "{{ (states('sensor.dsc_fan_exhaust_outside_pct') | float(0)) * 10 }}"

      - name: "DSC Airflow Room Return"
        unique_id: dsc_airflow_room_return
        unit_of_measurement: "flux"
        state_class: measurement
        icon: mdi:weather-windy
        state: "{{ (states('sensor.dsc_fan_exhaust_room_pct') | float(0)) * 10 }}"

      - name: "DSC Delta Room to Clone"
        unique_id: dsc_delta_room_to_clone
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:swap-vertical
        state: >
          {{ (states('sensor.dsc_hub_room_temperature') | float(0)
            - states('sensor.dsc_hub_clone_temperature') | float(0)) | round(2) }}

      - name: "DSC Delta Clone to Tent"
        unique_id: dsc_delta_clone_to_tent
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:swap-vertical
        state: >
          {{ (states('sensor.dsc_hub_clone_temperature') | float(0)
            - states('sensor.dsc_hub_tent_temperature') | float(0)) | round(2) }}

      - name: "DSC Main Temp Error"
        unique_id: dsc_main_temp_error
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:target
        state: >
          {{ (states('sensor.dsc_hub_tent_temperature') | float(0)
            - states('number.dsc_hub_target_temp') | float(25)) | round(2) }}

      - name: "DSC Clone Temp Error"
        unique_id: dsc_clone_temp_error
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:target
        state: >
          {{ (states('sensor.dsc_hub_clone_temperature') | float(0)
            - states('number.dsc_hub_clone_target_temp') | float(25)) | round(2) }}

      - name: "DSC Expected Light Hours"
        unique_id: dsc_expected_light_hours
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:sun-clock
        state: >
          {% set s = states('select.dsc_hub_grow_stage') %}
          {% set veg = ['Germination', 'Seedling', 'Early Vegetative',
                        'Vegetative', 'Late (Push) Vegetative'] %}
          {% set flwr = ['Early Flowering', 'Flowering', 'Late Flowering',
                         'Final 48-72h Flowering'] %}
          {% if s in veg %}18
          {% elif s in flwr %}12
          {% else %}0
          {% endif %}

      - name: "DSC Next Light Event"
        unique_id: dsc_next_light_event
        device_class: timestamp
        icon: mdi:clock-end
        state: >
          {% set exp = states('sensor.dsc_expected_light_hours') | float(0) %}
          {% set t = states('time.dsc_hub_lights_on_time') %}
          {% if exp <= 0 or t in ['unknown', 'unavailable', 'none', none] %}
            {{ none }}
          {% else %}
            {% set on_today = today_at(t[0:5]) %}
            {% set off_today = on_today + timedelta(hours=exp) %}
            {% if now() < on_today %}{{ on_today.isoformat() }}
            {% elif now() < off_today %}{{ off_today.isoformat() }}
            {% else %}{{ (on_today + timedelta(days=1)).isoformat() }}
            {% endif %}
          {% endif %}
        attributes:
          event: >
            {% set exp = states('sensor.dsc_expected_light_hours') | float(0) %}
            {% set t = states('time.dsc_hub_lights_on_time') %}
            {% if exp <= 0 or t in ['unknown', 'unavailable', 'none', none] %}none
            {% else %}
              {% set on_today = today_at(t[0:5]) %}
              {% set off_today = on_today + timedelta(hours=exp) %}
              {% if now() < on_today %}sunrise
              {% elif now() < off_today %}sunset
              {% else %}sunrise
              {% endif %}
            {% endif %}

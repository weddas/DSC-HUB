# ==================================================================
#  DSC-HUB v4 · CORE DASHBOARD HELPERS
#  ------------------------------------------------------------------
#  Phase-0 / Dashboard-v3 support: hub-link alias, fan %, airflow
#  Sankey nodes, photoperiod, leaf offset, appliance runtimes/cycles,
#  transfer-function deltas. Tank + pot packages are separate files.
#
#  Source: dsc_dashboard_v3.yaml (live) merged with v4 Sankey topology
#  the Lovelace dashboard actually wires (direct_room / room_return).
# ==================================================================

input_boolean:
  dsc_event_log:
    name: DSC Event Log
    icon: mdi:notebook-outline
  # Single in-service gate (replaces former *_actuator_wired).
  # Off = removed / unsafe / absent: never demand, follow, alert, or learn.
  dsc_ac_in_service:
    name: DSC AC In Service
    icon: mdi:snowflake
    initial: false
  dsc_clone_humidifier_in_service:
    name: DSC Clone Humidifier In Service
    icon: mdi:sprinkler-variant
    initial: false
  dsc_pot1_in_service:
    name: DSC POT1 In Service
    icon: mdi:flower
    initial: true
  dsc_pot2_in_service:
    name: DSC POT2 In Service
    icon: mdi:flower
    initial: true
  dsc_pot3_in_service:
    name: DSC POT3 In Service
    icon: mdi:flower-outline
    initial: false
  dsc_pot4_in_service:
    name: DSC POT4 In Service
    icon: mdi:flower
    initial: true

input_number:
  dsc_leaf_offset:
    name: DSC Leaf Temperature Offset
    icon: mdi:leaf-maple
    min: 0
    max: 5
    step: 0.1
    initial: 2
    unit_of_measurement: "°C"
    mode: box
    # Leaf cooler than air by this many °C → sensor.dsc_*_leaf_vpd_kpa

sensor:
  - platform: history_stats
    name: "DSC Heater Runtime Today"
    unique_id: dsc_heater_runtime_today
    entity_id: switch.dsc_hub_heater_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC AC Runtime Today"
    unique_id: dsc_ac_runtime_today
    entity_id: switch.dsc_hub_ac_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Humidifier Runtime Today"
    unique_id: dsc_humidifier_runtime_today
    entity_id: switch.dsc_hub_humidifier_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Dehumidifier Runtime Today"
    unique_id: dsc_dehumidifier_runtime_today
    entity_id: switch.dsc_hub_dehumidifier_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Grow Mat Runtime Today"
    unique_id: dsc_growmat_runtime_today
    entity_id: switch.dsc_hub_grow_mat_demand
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Heater Cycles Today"
    unique_id: dsc_heater_cycles_today
    entity_id: switch.dsc_hub_heater_demand
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Humidifier Cycles Today"
    unique_id: dsc_humidifier_cycles_today
    entity_id: switch.dsc_hub_humidifier_demand
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Humidifier Cycles Last Hour"
    unique_id: dsc_humidifier_cycles_last_hour
    entity_id: switch.dsc_hub_humidifier_demand
    state: "on"
    type: count
    start: "{{ now() - timedelta(hours=1) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Clone Humidifier Cycles Last Hour"
    unique_id: dsc_clone_humidifier_cycles_last_hour
    entity_id: switch.dsc_hub_clone_humidifier_demand
    state: "on"
    type: count
    start: "{{ now() - timedelta(hours=1) }}"
    end: "{{ now() }}"

template:
  - binary_sensor:
      - name: "DSC Hub Link"
        unique_id: dsc_hub_link
        device_class: connectivity
        icon: mdi:lan-connect
        state: "{{ is_state('binary_sensor.dsc_hub_ha_link_status', 'on') }}"
        availability: "{{ has_value('binary_sensor.dsc_hub_ha_link_status') }}"

      # Soft capacity — intentional OOS, not a problem alert.
      - name: "DSC AC Capacity Offline"
        unique_id: dsc_ac_capacity_offline
        icon: mdi:snowflake-off
        state: "{{ not is_state('input_boolean.dsc_ac_in_service', 'on') }}"

      - name: "DSC Clone Humidifier Capacity Offline"
        unique_id: dsc_clone_humidifier_capacity_offline
        icon: mdi:sprinkler-off
        state: "{{ not is_state('input_boolean.dsc_clone_humidifier_in_service', 'on') }}"

      - name: "DSC Reduced Kit"
        unique_id: dsc_reduced_kit
        icon: mdi:package-variant-closed
        state: >-
          {{ not is_state('input_boolean.dsc_ac_in_service', 'on')
             or not is_state('input_boolean.dsc_clone_humidifier_in_service', 'on')
             or not is_state('input_boolean.dsc_pot1_in_service', 'on')
             or not is_state('input_boolean.dsc_pot2_in_service', 'on')
             or not is_state('input_boolean.dsc_pot3_in_service', 'on')
             or not is_state('input_boolean.dsc_pot4_in_service', 'on')
             or is_state('input_boolean.dsc_humidifier_temp_oos', 'on')
             or is_state('input_boolean.dsc_dehumidifier_temp_oos', 'on')
             or is_state('input_boolean.dsc_humidifier_operator_lockout', 'on')
             or is_state('input_boolean.dsc_dehumidifier_operator_lockout', 'on')
             or is_state('input_boolean.dsc_clone_humidifier_temp_oos', 'on')
             or is_state('input_boolean.dsc_clone_humidifier_operator_lockout', 'on') }}
        attributes:
          offline: >-
            {% set ns = namespace(items=[]) %}
            {% if not is_state('input_boolean.dsc_ac_in_service', 'on') %}
              {% set ns.items = ns.items + ['AC'] %}
            {% endif %}
            {% if not is_state('input_boolean.dsc_clone_humidifier_in_service', 'on') %}
              {% set ns.items = ns.items + ['Clone mister'] %}
            {% endif %}
            {% if is_state('input_boolean.dsc_humidifier_temp_oos','on') %}
              {% set ns.items = ns.items + ['Humidifier (temp)'] %}
            {% endif %}
            {% if is_state('input_boolean.dsc_dehumidifier_temp_oos','on') %}
              {% set ns.items = ns.items + ['Dehumidifier (temp)'] %}
            {% endif %}
            {% if is_state('input_boolean.dsc_humidifier_operator_lockout','on') %}
              {% set ns.items = ns.items + ['Humidifier (lock)'] %}
            {% endif %}
            {% if is_state('input_boolean.dsc_dehumidifier_operator_lockout','on') %}
              {% set ns.items = ns.items + ['Dehumidifier (lock)'] %}
            {% endif %}
            {% for n in [1,2,3,4] %}
              {% if not is_state('input_boolean.dsc_pot' ~ n ~ '_in_service', 'on') %}
                {% set ns.items = ns.items + ['POT' ~ n] %}
              {% endif %}
            {% endfor %}
            {{ ns.items | join(', ') }}

      # Preferred AP learned in NVS disagrees with current association while
      # Lock is ON — mesh/channel split risk until pin/relearn finishes.
      - name: "DSC WiFi Preferred AP Mismatch"
        unique_id: dsc_wifi_preferred_ap_mismatch
        device_class: problem
        icon: mdi:wifi-alert
        state: >-
          {% set lock = is_state('switch.dsc_hub_lock_wifi_ap', 'on') %}
          {% set cur = states('sensor.dsc_hub_wifi_bssid')|trim|upper %}
          {% set pref = states('text.dsc_hub_preferred_wifi_bssid')|trim|upper %}
          {{ lock
             and cur not in ['unknown','unavailable','']
             and pref not in ['unknown','unavailable','','00:00:00:00:00:00']
             and cur != pref }}

      # Buying moisture while dumping outside — wasteful (firmware 5.1.2+
      # clamps OUT during humidifier demand; cue catches unflashed hubs
      # and any RH-overflow override).
      - name: "DSC Humidifier Vent Conflict"
        unique_id: dsc_humidifier_vent_conflict
        device_class: problem
        icon: mdi:water-opacity
        state: >-
          {{ is_state('switch.dsc_hub_humidifier_demand', 'on')
             and is_state('switch.dsc_humidifier_main_relay', 'on')
             and states('sensor.dsc_fan_exhaust_outside_pct')|float(0) >= 30 }}

      # Buying heat while dumping outside (should be rare — heater interlock).
      - name: "DSC Heater Vent Conflict"
        unique_id: dsc_heater_vent_conflict
        device_class: problem
        icon: mdi:heat-wave
        state: >-
          {{ is_state('switch.dsc_hub_heater_demand', 'on')
             and is_state('switch.dsc_heater_main_relay', 'on')
             and states('sensor.dsc_fan_exhaust_outside_pct')|float(0) >= 25 }}

      # Humidifier running hard but tent already at/above RH ceiling —
      # empty tank, wrong routing, or ladder/strategy disagreement.
      - name: "DSC Humidifier Ineffective Suspect"
        unique_id: dsc_humidifier_ineffective_suspect
        device_class: problem
        icon: mdi:water-off
        state: >-
          {% set rh = states('sensor.dsc_hub_tent_humidity')|float(none) %}
          {% set rmax = states('number.dsc_hub_rh_target_max')|float(70) %}
          {% set on_s = states('sensor.dsc_humidifier_relay_on_time')|float(0) %}
          {{ is_state('switch.dsc_hub_humidifier_demand', 'on')
             and is_state('switch.dsc_humidifier_main_relay', 'on')
             and rh is not none
             and rh >= (rmax - 0.5)
             and on_s >= 600 }}

      # Heater duty with tent at/above target — load fighting or no effect.
      - name: "DSC Heater Ineffective Suspect"
        unique_id: dsc_heater_ineffective_suspect
        device_class: problem
        icon: mdi:radiator-off
        state: >-
          {% set t = states('sensor.dsc_hub_tent_temperature')|float(none) %}
          {% set tgt = states('number.dsc_hub_target_temp')|float(21) %}
          {% set on_s = states('sensor.dsc_heater_relay_on_time')|float(0) %}
          {{ is_state('switch.dsc_hub_heater_demand', 'on')
             and is_state('switch.dsc_heater_main_relay', 'on')
             and t is not none
             and t >= (tgt + 0.3)
             and on_s >= 480 }}

      # Mat ON a long time while coldest voted root zone stays cold.
      # Ignore when no pot is in service (reduced kit / all probes parked).
      - name: "DSC Grow Mat Ineffective Suspect"
        unique_id: dsc_grow_mat_ineffective_suspect
        device_class: problem
        icon: mdi:heating-coil
        state: >-
          {% set any_pot = is_state('input_boolean.dsc_pot1_in_service','on')
             or is_state('input_boolean.dsc_pot2_in_service','on')
             or is_state('input_boolean.dsc_pot3_in_service','on')
             or is_state('input_boolean.dsc_pot4_in_service','on') %}
          {% set rz = states('sensor.dsc_coldest_root_zone_temp')|float(none) %}
          {% set low = states('number.dsc_hub_mat_root_zone_low')|float(20)
             if has_value('number.dsc_hub_mat_root_zone_low') else 20 %}
          {% set on_s = states('sensor.dsc_heatmat_relay_on_time')|float(0) %}
          {{ any_pot
             and is_state('switch.dsc_hub_grow_mat_demand', 'on')
             and is_state('switch.dsc_heatmat_main_relay', 'on')
             and rz is not none
             and rz < (low - 0.5)
             and on_s >= 1800 }}

  - sensor:
      - name: "DSC Leaf VPD"
        unique_id: dsc_leaf_vpd_kpa
        unit_of_measurement: "kPa"
        state_class: measurement
        icon: mdi:leaf
        state: >
          {% set t = states('sensor.dsc_hub_tent_temperature')|float(none) %}
          {% set rh = states('sensor.dsc_hub_tent_humidity')|float(none) %}
          {% set lo = states('input_number.dsc_leaf_offset')|float(2) %}
          {% if t is none or rh is none %}unavailable
          {% else %}
            {% set tl = t - lo %}
            {% set svp_l = 0.6108 * (2.718281828 ** ((17.27 * tl) / (tl + 237.3))) %}
            {% set avp = 0.6108 * (2.718281828 ** ((17.27 * t) / (t + 237.3))) * (rh / 100) %}
            {{ (svp_l - avp)|round(3) }}
          {% endif %}
        attributes:
          note: "SVP(T_air − leaf_offset) − AVP(air). Air VPD remains sensor.dsc_hub_vpd_kpa."
          leaf_temp_c: >
            {% set t = states('sensor.dsc_hub_tent_temperature')|float(none) %}
            {% set lo = states('input_number.dsc_leaf_offset')|float(2) %}
            {{ (t - lo)|round(1) if t is not none else none }}

      - name: "DSC Clone Leaf VPD"
        unique_id: dsc_clone_leaf_vpd_kpa
        unit_of_measurement: "kPa"
        state_class: measurement
        icon: mdi:leaf
        state: >
          {% set t = states('sensor.dsc_hub_clone_temperature')|float(none) %}
          {% set rh = states('sensor.dsc_hub_clone_humidity')|float(none) %}
          {% set lo = states('input_number.dsc_leaf_offset')|float(2) %}
          {% if t is none or rh is none %}unavailable
          {% else %}
            {% set tl = t - lo %}
            {% set svp_l = 0.6108 * (2.718281828 ** ((17.27 * tl) / (tl + 237.3))) %}
            {% set avp = 0.6108 * (2.718281828 ** ((17.27 * t) / (t + 237.3))) * (rh / 100) %}
            {{ (svp_l - avp)|round(3) }}
          {% endif %}

      - name: "DSC Fan Intake Main Pct"
        unique_id: dsc_fan_intake_main_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan
        state: >
          {% set e = 'fan.dsc_hub_4_inch_intake_fan_main' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_4_inch_intake_fan_main') }}"

      - name: "DSC Fan Intake 2x4 Pct"
        unique_id: dsc_fan_intake_2x4_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan
        state: >
          {% set e = 'fan.dsc_hub_4_inch_intake_fan_2x4' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_4_inch_intake_fan_2x4') }}"

      - name: "DSC Fan Exhaust Room Pct"
        unique_id: dsc_fan_exhaust_room_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan-chevron-up
        state: >
          {% set e = 'fan.dsc_hub_6_inch_exhaust_room' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_6_inch_exhaust_room') }}"

      - name: "DSC Fan Exhaust Outside Pct"
        unique_id: dsc_fan_exhaust_outside_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fan-chevron-up
        state: >
          {% set e = 'fan.dsc_hub_6_inch_exhaust_outside' %}
          {{ state_attr(e,'percentage') | float(0) if is_state(e,'on') else 0 }}
        availability: "{{ has_value('fan.dsc_hub_6_inch_exhaust_outside') }}"

      # Sankey topology — CFM from plant specs × commanded %.
      # Falls back to legacy pct*10 flux if max CFM helpers are missing.
      - name: "DSC Airflow Room Supply"
        unique_id: dsc_airflow_room_supply
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {% set im = states('input_number.dsc_cfm_intake_main_max')|float(0) %}
          {% set ic = states('input_number.dsc_cfm_intake_clone_max')|float(0) %}
          {% if im > 0 or ic > 0 %}
            {{ ((states('sensor.dsc_fan_intake_main_pct')|float(0)/100*im)
               + (states('sensor.dsc_fan_intake_2x4_pct')|float(0)/100*ic)) | round(1) }}
          {% else %}
            {{ (states('sensor.dsc_fan_intake_main_pct')|float(0)
                + states('sensor.dsc_fan_intake_2x4_pct')|float(0)) * 10 }}
          {% endif %}

      - name: "DSC Airflow Reservoir Net"
        unique_id: dsc_airflow_reservoir_net
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {% set ic = states('input_number.dsc_cfm_intake_clone_max')|float(0) %}
          {% if ic > 0 %}
            {{ (states('sensor.dsc_fan_intake_2x4_pct')|float(0)/100*ic) | round(1) }}
          {% else %}
            {{ (states('sensor.dsc_fan_intake_2x4_pct')|float(0)) * 10 }}
          {% endif %}

      - name: "DSC Airflow Direct Room"
        unique_id: dsc_airflow_direct_room
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {% set im = states('input_number.dsc_cfm_intake_main_max')|float(0) %}
          {% if im > 0 %}
            {{ (states('sensor.dsc_fan_intake_main_pct')|float(0)/100*im) | round(1) }}
          {% else %}
            {{ (states('sensor.dsc_fan_intake_main_pct')|float(0)) * 10 }}
          {% endif %}

      - name: "DSC Airflow Main Load"
        unique_id: dsc_airflow_main_load
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {% set im = states('input_number.dsc_cfm_intake_main_max')|float(0) %}
          {% set ic = states('input_number.dsc_cfm_intake_clone_max')|float(0) %}
          {% if im > 0 or ic > 0 %}
            {{ ((states('sensor.dsc_fan_intake_main_pct')|float(0)/100*im)
               + (states('sensor.dsc_fan_intake_2x4_pct')|float(0)/100*ic)) | round(1) }}
          {% else %}
            {{ (states('sensor.dsc_fan_intake_main_pct')|float(0)
                + states('sensor.dsc_fan_intake_2x4_pct')|float(0)) * 10 }}
          {% endif %}

      - name: "DSC Airflow Exhaust Out"
        unique_id: dsc_airflow_exhaust_out
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {% set mx = states('input_number.dsc_cfm_out_max')|float(0) %}
          {% if mx > 0 %}
            {{ (states('sensor.dsc_fan_exhaust_outside_pct')|float(0)/100*mx) | round(1) }}
          {% else %}
            {{ (states('sensor.dsc_fan_exhaust_outside_pct')|float(0)) * 10 }}
          {% endif %}

      - name: "DSC Airflow Room Return"
        unique_id: dsc_airflow_room_return
        unit_of_measurement: "CFM"
        state_class: measurement
        icon: mdi:weather-windy
        state: >
          {% set mx = states('input_number.dsc_cfm_recirc_max')|float(0) %}
          {% if mx > 0 %}
            {{ (states('sensor.dsc_fan_exhaust_room_pct')|float(0)/100*mx) | round(1) }}
          {% else %}
            {{ (states('sensor.dsc_fan_exhaust_room_pct')|float(0)) * 10 }}
          {% endif %}

      - name: "DSC Delta Room to Clone"
        unique_id: dsc_delta_room_to_clone
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:swap-vertical
        state: >
          {{ (states('sensor.dsc_hub_room_temperature') | float(0)
            - states('sensor.dsc_hub_clone_temperature') | float(0)) | round(2) }}

      - name: "DSC Delta Clone to Tent"
        unique_id: dsc_delta_clone_to_tent
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:swap-vertical
        state: >
          {{ (states('sensor.dsc_hub_clone_temperature') | float(0)
            - states('sensor.dsc_hub_tent_temperature') | float(0)) | round(2) }}

      - name: "DSC Main Temp Error"
        unique_id: dsc_main_temp_error
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:target
        state: >
          {{ (states('sensor.dsc_hub_tent_temperature') | float(0)
            - states('number.dsc_hub_target_temp') | float(25)) | round(2) }}

      - name: "DSC Clone Temp Error"
        unique_id: dsc_clone_temp_error
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:target
        state: >
          {{ (states('sensor.dsc_hub_clone_temperature') | float(0)
            - states('number.dsc_hub_clone_target_temp') | float(25)) | round(2) }}

      - name: "DSC Expected Light Hours"
        unique_id: dsc_expected_light_hours
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:sun-clock
        state: >
          {% set s = states('select.dsc_hub_grow_stage') %}
          {% set veg = ['Germination', 'Seedling', 'Early Vegetative',
                        'Vegetative', 'Late (Push) Vegetative'] %}
          {% set flwr = ['Early Flowering', 'Flowering', 'Late Flowering',
                         'Final 48-72h Flowering'] %}
          {% if s in veg %}18
          {% elif s in flwr %}12
          {% else %}0
          {% endif %}

      - name: "DSC Next Light Event"
        unique_id: dsc_next_light_event
        device_class: timestamp
        icon: mdi:clock-end
        state: >
          {% set exp = states('sensor.dsc_expected_light_hours') | float(0) %}
          {% set t = states('time.dsc_hub_lights_on_time') %}
          {% if exp <= 0 or t in ['unknown', 'unavailable', 'none', none] %}
            {{ none }}
          {% else %}
            {% set on_today = today_at(t[0:5]) %}
            {% set off_today = on_today + timedelta(hours=exp) %}
            {% if now() < on_today %}{{ on_today.isoformat() }}
            {% elif now() < off_today %}{{ off_today.isoformat() }}
            {% else %}{{ (on_today + timedelta(days=1)).isoformat() }}
            {% endif %}
          {% endif %}
        attributes:
          event: >
            {% set exp = states('sensor.dsc_expected_light_hours') | float(0) %}
            {% set t = states('time.dsc_hub_lights_on_time') %}
            {% if exp <= 0 or t in ['unknown', 'unavailable', 'none', none] %}none
            {% else %}
              {% set on_today = today_at(t[0:5]) %}
              {% set off_today = on_today + timedelta(hours=exp) %}
              {% if now() < on_today %}sunrise
              {% elif now() < off_today %}sunset
              {% else %}sunrise
              {% endif %}
            {% endif %}

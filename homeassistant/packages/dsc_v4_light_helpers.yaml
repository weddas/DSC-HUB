# ==================================================================
#  DSC-HUB v4 · LIGHT-ACCOUNTING HELPERS
#  ------------------------------------------------------------------
#  Carried forward from v2.4 (topology Option A unchanged in v4):
#  SF1000 is the 2x4 clone light; 4x8 window is virtual/schedule-only.
#
#  Hub 5.1.7+: prefer sensor.dsc_hub_light_delivered_hours (cycle ledger)
#  over midnight history_stats. Dark-period violation exempts catch-up.
#  First-ledger seed on hub upgrade — flash hub 5.1.7 before trusting
#  mid-dark OTA. Ops: docs/qa/HUB-LIGHT-QUOTA-5.1.7.md
#
#  Install alongside dsc_v4_core_helpers.yaml. Delete any leftover
#  v2.3 light definitions first (dup unique_ids create silent *_2 twins).
# ==================================================================

sensor:
  - platform: history_stats
    name: "DSC Lights On Today 2x4"
    unique_id: dsc_lights_on_today_2x4
    entity_id: light.dsc_hub_sf1000_dimmer
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "DSC Lights On Today 4x8"
    unique_id: dsc_lights_on_today_4x8
    entity_id: binary_sensor.dsc_hub_4x8_window_open
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

template:
  - binary_sensor:
      - name: "DSC Clone Dark Period Violation"
        unique_id: dsc_clone_dark_period_violation
        device_class: problem
        icon: mdi:weather-night-partly-cloudy
        state: >
          {{ is_state('light.dsc_hub_sf1000_dimmer','on')
             and is_state('binary_sensor.dsc_hub_2x4_window_open','off')
             and not is_state('binary_sensor.dsc_hub_light_catchup_active','on') }}
        availability: >
          {{ has_value('light.dsc_hub_sf1000_dimmer')
             and has_value('binary_sensor.dsc_hub_2x4_window_open') }}

      # Inverse of dark violation: window OPEN but SF1000 dark. Plant-critical
      # (5 Aug 2026: photoperiod NVS restored OFF after recovery reboot →
      # ~5.5h dark mid-cycle). Takeover / Manual Light Hold / Clone Off are
      # intentional dark paths and must not trip this.
      - name: "DSC Clone Light Missing In Window"
        unique_id: dsc_clone_light_missing_in_window
        device_class: problem
        icon: mdi:lightbulb-alert-outline
        state: >
          {{ is_state('binary_sensor.dsc_hub_2x4_window_open','on')
             and not is_state('light.dsc_hub_sf1000_dimmer','on')
             and not is_state('switch.dsc_hub_manual_takeover','on')
             and not is_state('switch.dsc_hub_manual_light_hold','on')
             and not is_state('select.dsc_hub_clone_mode','Off') }}
        availability: >
          {{ has_value('light.dsc_hub_sf1000_dimmer')
             and has_value('binary_sensor.dsc_hub_2x4_window_open')
             and has_value('switch.dsc_hub_manual_takeover') }}

  - sensor:
      - name: "DSC Clone Expected Light Hours"
        unique_id: dsc_clone_expected_light_hours
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:sun-clock
        state: >
          {% if is_state('select.dsc_hub_clone_mode','Off') %}
            0
          {% elif is_state('select.dsc_hub_clone_photoperiod','Follow 4x8') %}
            {{ states('sensor.dsc_expected_light_hours') | float(0) | round(0) }}
          {% else %}
            {{ states('number.dsc_hub_clone_light_hours') | float(18) | round(0) }}
          {% endif %}

      - name: "DSC Lights Deviation Today"
        unique_id: dsc_lights_deviation_today
        unit_of_measurement: "h"
        state_class: measurement
        icon: mdi:scale-balance
        state: >
          {% set exp = states('sensor.dsc_clone_expected_light_hours') | float(0) %}
          {% if has_value('sensor.dsc_hub_light_delivered_hours') %}
            {{ (states('sensor.dsc_hub_light_delivered_hours') | float(0) - exp) | round(2) }}
          {% else %}
            {{ (states('sensor.dsc_lights_on_today_2x4') | float(0) - exp) | round(2) }}
          {% endif %}
        availability: >
          {{ has_value('sensor.dsc_clone_expected_light_hours')
             and (has_value('sensor.dsc_hub_light_delivered_hours')
                  or has_value('sensor.dsc_lights_on_today_2x4')) }}

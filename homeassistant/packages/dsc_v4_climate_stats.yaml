# ==================================================================
#  DSC-HUB · Climate zone mean statistics (external recorder)
#  ------------------------------------------------------------------
#  24h and 48h means for Room / 2×4 / 4×8 T, RH, VPD. No invented Got.
#  Unique_ids slug to sensor.dsc_hub_*_mean_24h / _48h (Hub prefix).
#  Room VPD source is the locked template id sensor.dsc_hub_room_vpd_kpa.
# ==================================================================

sensor:
  - platform: statistics
    name: "DSC Hub Room Temp Mean 24h"
    unique_id: dsc_hub_room_temp_mean_24h
    entity_id: sensor.dsc_hub_room_temperature
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1500
  - platform: statistics
    name: "DSC Hub Room Temp Mean 48h"
    unique_id: dsc_hub_room_temp_mean_48h
    entity_id: sensor.dsc_hub_room_temperature
    state_characteristic: mean
    max_age:
      hours: 48
    sampling_size: 2500
  - platform: statistics
    name: "DSC Hub Room RH Mean 24h"
    unique_id: dsc_hub_room_rh_mean_24h
    entity_id: sensor.dsc_hub_room_humidity

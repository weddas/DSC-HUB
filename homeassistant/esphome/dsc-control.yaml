# DSC-CONTROL — HA stub
# Lab OTA target: Nest reservation 192.168.86.177 (mDNS off on panel).
# wifi-lab package sets use_address; keep this overlay in sync if the
# reservation changes before the package lands on master.
substitutions:
  name: dsc-control
  friendly_name: DSC-CONTROL
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_val: !secret dsc_control_api_key
  ota_password_val: !secret dsc_control_ota_password
  ap_password_val: !secret dsc_control_ap_password
  hub_mac: "84:1F:E8:16:E6:60"
  espnow_cmd_tag: "54727"

packages:
  panel:
    url: https://github.com/weddas/DSC-HUB
    ref: master
    files:
      - firmware/v4/dsc-control-wifi-lab.yaml
      - firmware/v4/dsc-control-common.yaml
      # No dsc-fleet-setup-control-lab.yaml — see firmware/v4/dsc-control.yaml
      # (web_server_base on this CYD crash-loops; hub_cmd uses ${hub_mac}).
    refresh: 0s

wifi:
  use_address: 192.168.86.177

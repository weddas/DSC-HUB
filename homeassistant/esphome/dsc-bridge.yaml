# DSC-BRIDGE — HA stub (pulls common + wifi lab from GitHub)
# WT32-ETH01 · F-010 / F-012 / F-013
substitutions:
  name: dsc-bridge
  friendly_name: DSC-BRIDGE
  api_key_val: !secret dsc_bridge_api_key
  ota_password_val: !secret dsc_bridge_ota_password
  ap_password_val: !secret dsc_bridge_ap_password
  anchor_ap_password: !secret dsc_anchor_ap_password
  anchor_ssid: "DSC-Anchor"
  anchor_channel: "11"
  espnow_cmd_tag: "54727"
  hub_mac: "84:1F:E8:16:E6:60"
  dsc_heater_host: !secret dsc_heater_host
  dsc_heatmat_host: !secret dsc_heatmat_host
  dsc_humidifier_host: !secret dsc_humidifier_host
  dsc_dehumidifier_host: !secret dsc_dehumidifier_host
  dsc_heater_api_key: !secret dsc_heater_api_key
  dsc_heatmat_api_key: !secret dsc_heatmat_api_key
  dsc_humidifier_api_key: !secret dsc_humidifier_api_key
  dsc_dehumidifier_api_key: !secret dsc_dehumidifier_api_key

# Components must exist under /config/esphome/components/ on the HA host
# (dsc_api_client, dsc_anchor_ap). Sync does not copy these by default.
external_components:
  - source:
      type: local
      path: components
    components: [dsc_api_client, dsc_anchor_ap]

packages:
  bridge:
    url: https://github.com/weddas/DSC-HUB
    ref: master
    files:
      - firmware/v4/dsc-bridge-common.yaml
    refresh: 0s

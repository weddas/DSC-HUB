# DSC-HUB — HA stub (pulls hub body + ESP-NOW package + lab WiFi from GitHub)
substitutions:
  name: dsc-hub
  friendly_name: DSC-HUB
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key_val: !secret dsc_hub_api_key
  ota_password_val: !secret dsc_hub_ota_password
  ap_password_val: !secret dsc_hub_ap_password
  espnow_key: !secret espnow_key
  panel_mac: "30:76:F5:E9:22:0C"
  espnow_cmd_tag: "54727"
  # Pin to hub AP: copy sensor.dsc_hub_wifi_bssid after first join.
  wifi_bssid: "00:00:00:00:00:00"

packages:
  hub:
    url: https://github.com/weddas/DSC-HUB
    ref: master
    files:
      - firmware/v4/dsc-hub-wifi-lab.yaml
      - firmware/v4/dsc-hub-v4_0.yaml
      - firmware/v4/dsc-hub-fleet-heal.yaml
      - firmware/v4/dsc-hub-espnow-primary.yaml
      # No dsc-fleet-setup-hub-lab.yaml — lab uses ${panel_mac}; kit SoftAP only.
    # 0s during fleet flash cycles so GitHub pushes are picked up immediately.
    # Raise to 1h once the fleet is stable to avoid constant git pulls.
    refresh: 0s

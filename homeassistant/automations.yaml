# ==================================================================
#  DSC-HUB v4 · AUTOMATIONS
#  ------------------------------------------------------------------
#  Demand followers, alerts, grow-log scribe, and safety nets
#  (hub-offline safe-off + emergency/climate/aux fault alerts).
#
#  v4 notes:
#   * Root-zone alert covers all four pot ESP-NOW links.
#   * Mat scribe logs coldest plausible pot when available.
#   * Notifier target is notify.chriss_iphone_max — change if yours differs.
#   * Clone humidifier follower stays out until mister hardware exists.
#   * AC follower stays out until actuator hardware exists.
#
#  Capacity audit (soft hardening): HA must NOT run a second escalation
#  ladder. Firmware owns fans + demand rungs; this file only mirrors the
#  four wired Sonoffs (hum / dehum / heater / mat), alerts, and safe-off.
#  Verified: followers resync on HA start, relay restore, hub-link restore;
#  skip while node test mode is on; hub-offline ≥30s forces all four OFF.
# ==================================================================


# ==================================================================
#  A.  DEMAND FOLLOWERS
# ==================================================================

- id: dsc_follower_humidifier
  alias: "DSC-HUB · Humidifier follows Humidifier Demand"
  description: "Relay mirrors hub demand. Safe-OFF on hub dropout. Resyncs on HA restart + node reconnect + hub-link restore."
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_humidifier_demand
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: switch.dsc_humidifier_main_relay
      from: "unavailable"
      for: "00:00:05"
    - trigger: state
      entity_id: switch.dsc_humidifier_main_relay
      to: "off"
      for: "00:00:02"
    - trigger: state
      entity_id: binary_sensor.dsc_hub_ha_link_status
      to: "on"
      for: "00:00:05"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.dsc_hub_humidifier_demand
              state: "on"
            - condition: state
              entity_id: binary_sensor.dsc_hub_ha_link_status
              state: "on"
            - condition: template
              value_template: "{{ not is_state('binary_sensor.dsc_humidifier_test_mode', 'on') }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.dsc_humidifier_main_relay
      default:
        - condition: template
          value_template: "{{ not is_state('binary_sensor.dsc_humidifier_test_mode', 'on') }}"
        - action: switch.turn_off
          target:
            entity_id: switch.dsc_humidifier_main_relay


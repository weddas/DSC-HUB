# ==================================================================
#  DSC-HUB v4 · AUTOMATIONS
#  ------------------------------------------------------------------
#  Ported from v2.4.1 Rev B. Demand-follower pattern unchanged —
#  Sonoffs remain HA-actuated (ESP8285 has no ESP-NOW).
#
#  v4 notes:
#   * Root-zone alert already covers all four pot ESP-NOW links.
#   * Mat scribe logs coldest plausible pot when available.
#   * Notifier target is notify.chriss_iphone_max — change if yours differs.
#   * Keep dsc_hub_offline_safe_off from your live install if present
#     (not reproduced here — already canonical in your HA).
# ==================================================================


# ==================================================================
#  A.  DEMAND FOLLOWERS
# ==================================================================

- id: dsc_follower_humidifier
  alias: "DSC-HUB · Humidifier follows Humidifier Demand"
  description: "Relay mirrors hub demand. Safe-OFF on hub dropout. Resyncs on HA restart + node reconnect."
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.dsc_hub_humidifier_demand
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: switch.dsc_humidifier_main_relay
      from: "unavailable"
      for: "00:00:05"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.dsc_hub_humidifier_demand
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.dsc_humidifier_main_relay
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.dsc_humidifier_main_relay

